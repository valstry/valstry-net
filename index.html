20亿美元来自与可转换票据及其他融资工具估值变动相关的会计计提，较去年同期130亿美元的净亏损大幅扩大。 与此同时，该公司今年上半年营收达163亿美元，第三季度营收环比增长45%至168亿美元。 Anthropic在算力上的豪赌规模同样令市场瞩目。据华尔街日报报道， 该公司总算力承诺支出将超过6000亿美元，未来十年在算力相关协议上的承诺支出合计逾5180亿美元，且正洽谈进一步扩大计算资源。 分析人士指出，上述支出体量对拟上市投资者而言是不容忽视的估值变量。Anthropic目前据报道正寻求以1.5万亿至2万亿美元估值于11月挂牌上市。 算力承诺规模庞大，", "tags": ["AI", "商业认知"], "topic_score": 7, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792538087.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "国内军用特种线缆细分“小巨人”今日上市。今日无新股申购；②有1只新股上市，为北交所的文峰光电。", "url": "https://www.huxiu.com/moment/1289952.html", "date": "Tue, 20 Oct 2026 23:13:13 GMT", "desc": "国内军用特种线缆细分“小巨人”今日上市。 今日无新股申购；②有1只新股上市，为北交所的文峰光电。", "tags": ["商业认知"], "topic_score": 3, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1792537993.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "Feds suspect ransom negotiator ran ShinyHunters extortion site", "url": "https://krebsonsecurity.com/2026/10/feds-suspect-ransom-negotiator-ran-shinyhunters-extortion-site/", "date": "Tue, 20 Oct 2026 22:21:05 +0000", "desc": "Article URL: https://krebsonsecurity.com/2026/10/feds-suspect-ransom-negotiator-ran-shinyhunters-extortion-site/ Comments URL: https://news.ycombinator.com/item?id=50173487 Points: 59 # Comments: 13", "tags": ["资本市场"], "topic_score": 3, "source": "Hacker News 前页", "cat": "AI实战_创作者", "weight": 4, "ts": 1792534865.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26, "title_zh": "联邦调查人员怀疑，一名赎金谈判代表运营了 ShinyHunters 敲诈网站", "desc_zh": "文章链接：https://krebsonsecurity.com/2026/10/feds-suspect-ransom-negotiator-ran-shinyhunters-extortion-site/ 评论链接：https://news.ycombinator.com/item?id=50173487 得分：59 评论数：13"}, {"title": "8-K/A - Aspire-Lakewood Holdings, Inc. (0001847345) (Filer)", "url": "https://www.sec.gov/Archives/edgar/data/1847345/000149315226047801/0001493152-26-047801-index.htm", "date": "2026-10-20T17:31:11-04:00", "desc" rty Justice Center）代理提交至美国国际贸易法院，要求法院宣告相关关税违法、叫停执行，并责令特朗普政府退还已缴纳税款及利息。 被诉关税自8月22日起正式生效，适用于加拿大曲棍球棒、葡萄酒、蜂蜜、假发及奶酪等多类商品。 此案的背后是更广泛的贸易政策不确定性。自由正义中心此前成功在最高法院推翻特朗普\"对等关税\"，迫使联邦政府退还估计约1660亿美元的已征税款，目前该机构还有另外两起针对特朗普关税措施的诉讼正在进行中。 争议焦点：一部从未被动用过的大萧条时代法律 特朗普于7月20日签署三份总统公告，援引1930年《关税法》第", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792529478.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 14}, {"title": "Super Micro Jumps After Preliminary Results Top Estimates", "url": "https://www.bloomberg.com/news/articles/2026-10-20/super-micro-jumps-after-preliminary-results-top-estimates", "date": "Tue, 20 Oct 2026 20:48:06 GMT", "desc": "Super Micro Computer Inc. jumped in late trading after reporting preliminary quarterly results that topped analysts’ estimates.", "tags": [], "topic_score": 0, "source": "Bloomberg Technology", "cat": "金融媒体_英文", "weight": 2, "ts": 1792529286.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 14}, {"title": "瑞士9月黄金出口额环比增长6%，对英出口创2012年以来新高", "url": "https://wallstreetcn.com/articles/3784061", "date": "Wed, 21 Oct 2026 04:47:34 +0800", "desc": "瑞士9月黄金出口量升至2025年2月以来最高水平，对英国出口更创至少2012年以来的单月新高。英国黄金市场资金流入增加，成为推动瑞士黄金出口增长的重要因素。 瑞士海关数据显示，9月瑞士黄金出口量环比增长6%，达到165.2吨。其中，对英国出口量环比增长24%，达到126.2吨。 瑞士是全球主要的黄金精炼和转运中心之一，英国则拥有全球最大的场外黄金交易市场，两地之间的黄金流动受到投资需求、交易活动及库存配置等因素影响。 9月对主要黄金消费国印度的出口环比下降12%，至3.1吨。上周印度黄金交易价格时隔三个多月首次出现溢价，金价回落提振了珠宝购买需求。 周二，黄金现货下跌0.4%，自8月25日阶段性高点以来，已下跌12%。 英国黄金投资需求走强 英国黄金流入增加之际，黄金ETF投资需求也保持强劲。 世界黄金协会数据显示，2026年第三季度，全球实物支持型黄金ETF净流入创纪录的310亿美元。 ", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792529254.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 14}, {"title": "Boeing wins approval for Max 10 jet in boost for turnaround efforts", "url": "https://www.ft.com/content/0e99c2bc-873c-4d2d-b5c9-a0876faeb9ed?syn-25a6b1a6=1", "date": "Tue, 20 Oct 2026 20:43:44 GMT", "desc": rl": "https://wallstreetcn.com/articles/3784053", "date": "Tue, 20 Oct 2026 23:36:00 +0800", "desc": "韩国股市估值已跌至历史极值区间，但买盘迟迟未能现身。KOSPI今年第三次遭遇五日跌幅超15%的重挫，远期市盈率压缩至历史最低水平，而基本面却未见明显恶化——这一罕见背离正在引发市场高度关注。 摩根大通指出，当前韩股估值与技术面均已发出强烈的逢低买入信号，但边际买家却正在加速消失。 三星和SK海力士的股票回购计划相继收尾，外资持续净卖出，国内机构需求依然疲软，市场恰在最需要支撑的时刻失去了最重要的买盘来源。 与此同时， 杠杆ETF持仓规模尽管遭遇大幅抛售却仍居高不下，持续形成机械性卖压。 摩根大通警告，在这一悬而未决的杠杆风险彻底出清之前，新一轮抛售浪潮的可能性不能排除。 估值跌至历史极值，但\"便宜\"不代表底部 KOSPI当前远期市盈率已降至历史最低水平。 即便剔除三星电子、SK海力士等存储巨头的影响，KOSPI整体仅以8.4倍远期市盈率交投，处于历史第11百分位。 与此同时，相对强弱指数（", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792510560.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "等待最后一跌？大摩：本轮调整或以优质股补跌画上句号", "url": "https://wallstreetcn.com/articles/3784051", "date": "Tue, 20 Oct 2026 22:44:33 +0800", "desc": "多数个股已深度回调，金融条件收紧至2022年以来最高水平，但标普500指数整体仍保持韧性。摩根士丹利认为，这种分化本身正在积聚风险——本轮调整或许要等到迄今\"最后的赢家\"补跌之后，才能真正结束。 摩根士丹利策略师Michael Wilson指出，市场当前呈现出一个耐人寻味的结构： 优质因子已突破52周高位，而等权重标普500指数同期下跌近4% ，大量普通个股的跌幅已相当可观。真正尚未受到明显冲击的，是支撑指数的核心权重股。 Wilson认为， 中期调整往往以优质股的最终补跌告终——而这种补跌，反而可能是市场重新加仓的信号，而非经济周期终结的预兆。 届时，韧性标普500与已遭重创的普通个股之间的落差收敛，或将构成一个真实的风险介入窗口。 优质因子强势突围，市场分化加剧 摩根士丹利的优质因子自8月中旬以来已上涨约6%，并突破52周新高，与此同时等权重标普500指数同期下跌近4%。 这一分化背后", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792507473.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "CoreWeave会是2026年的硅谷银行吗？", "url": "https://wallstreetcn.com/articles/3784046", "date": "Tue, 20 Oct 2026 22:44:07 +0800", "desc": "CoreWeave无担保债券收益率飙升至15%，重新点燃市场对AI基础设施投资周期能否持续的担忧。但巴克莱认为，投资者可能正在重蹈2023年硅谷银行危机时的覆辙，将一家公司的局部信用风险误读为整个行业的系统性危机。 据英国《金融时报》，巴克莱全球研究主席Ajay Rajadhyaksha指出， CoreWeave无担保债券遭遇抛售，主要反映其在公司资本结构中处于较低的偿付优先级，而非AI资本支出周期出现裂缝。 他认为，Chamath Palihapitiya和埃隆·马斯克等人过度解读了这批规模仅20亿美元的无担保债券所释放的信号。 从市场表现看，此次波动的冲击远不及2023年硅谷银行危机期间的全面恐慌。纳斯达克100指数上周下跌5.5%，本周已有所反弹，其他超大规模云计算商的债券收益率也随着美债市场企稳而有所回落。 目前，市场尚未出现AI基础设施融资全面收缩的明确信号。 无担保债券收益率飙", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792507447.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "奇瑞也要用AI重新定义自己了", "url": "https://wallstreetcn.com/articles/3784048", "date": "Tue, 20 Oct 2026 21:45:23 +0800", "desc": "造车近30年，奇瑞正在尝试扩大自己的竞争范围。 10月20日，奇瑞汽车股份有限公司董事长尹同跃宣布进入“瑶光2035”战略阶段。与汽车技术一同出现在规划中的，还有能源、Robotaxi、机器人和智能农机。奇瑞希望将造车积累的技术和制造能力，用于更多产品与市场。 这一选择背后，是汽车技术的变化。电动化、智能化使车企掌握的能力从机械制造扩展到电池、电驱、计算和控制，这些技术在其他设备中同样有用。对已经进行大规模研发投入的企业而言，新的应用也意味着更多分摊成本、获得收入的机会。 奇瑞已有一定基础。前三季度，集团销售汽车约220.7万辆，其中出口约155.1万辆，新能源汽车销量约85.9万辆。规模生产和海外经营，为新业务提供了技术、供应链和市场资源。 与此同时，尹同跃提出，要打通国内外业务、聚焦产品，推动国内销量回到头部。业务范围向外拓展，汽车产品则要更加聚焦，这要求新业务尽可能共用已有积累，减少", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792503923.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "法国成欧洲股市“最不受欢迎”市场，机构看空情绪创纪录", "url": "https://wallstreetcn.com/articles/3784045", "date": "Tue, 20 Oct 2026 20:49:37 +0800", "desc": "法国股市正成为欧洲乃至全球资金规避的核心标的，政治风险居高不下令做空情绪持续升温。 据巴克莱银行策略师， 系统性基金与主动管理基金均在大幅削减对法国CAC 40指数的敞口，其中趋势跟踪基金（CTA）已将法国股市推至欧洲及美国市场中做空规模最大的标的。 与此同时，美国银行上周发布的基金经理调查显示， 法国已成为欧洲最不受欢迎的股票市场 ，净56%的受访者计划在未来12个月内低配法国资产，这一比例为有记录以来最高。 CAC 40今年相对欧洲斯托克600指数的年度表现差距，正处于2010年以来最大的轨道上，并连续第三年跑输后者。在更宏观的背景下，法国持续的政治动荡与债务压力正将风险溢价推向新高，进一步压制市场情绪与估值。 CTA基金大举做空，法国成最大空头头寸 巴克莱策略师Rex Feng与Anshul Gupta在本周二发布的研报中指出，CTA基金在重建美股多头头寸的同时，正积极降低欧洲风险敞", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792500577.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "小天才卖的不是手表，是“合群”？", "url": "https://wallstreetcn.com/articles/3784044", "date": "Tue, 20 Oct 2026 20:44:42 +0800", "desc": "一块卖到 2699 元的儿童手表，在 10 月 20 日这天，因加不了好友被推上热搜第一。 事情本身并不复杂，它的碰一碰加好友、微聊和好友圈只对同品牌开放，不能下载微信、QQ，其他品牌的手表既加不了好友，也进不了班级圈。在多数同学都戴小天才的班里，不买它的孩子，可能连加个好友都做不到。 对此，小天才客服的回应是：确实不支持跨品牌加好友，只能添加为联系人，新品是否开放尚无通知。家长端App 也看不到孩子的好友圈与聊天记录，需要用另一块小天才把孩子加为好友，以好友身份才 等业务的扩张，转化为对这一欧洲核心市场的长期押注。 10月20日，据彭博等媒体报道， 亚马逊计划2027年在德国投资逾160亿欧元，覆盖云计算与人工智能基础设施、物流网络、低轨卫星及流媒体内容制作。 这将是亚马逊迄今在德国单年度规模最大的投资承诺，也反映出公司持续加码欧洲数字基础设施的战略布局。 亚马逊首席全球事务与法务官David Zapolsky在柏林举行的“投资德国峰会”上宣布了这一计划，德国总理弗里德里希·默茨（Friedrich Merz）出席活动。德国联邦经济与能源部长Katherina Reiche表示，这笔投资体现了亚马逊对德国作为未来投资目的地的信心，并强调高性能数据中心是数字经济发展的基础。 此次投资正值美国大型科技公司加速布局欧洲之际。根据彭博预测， 亚马逊2026年资本支出将达到约2200亿美元，此次德国投资进一步体现", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792497849.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "政治动荡叠加财政压力，法债风险溢价再破150基点", "url": "https://wallstreetcn.com/articles/3784034", "date": "Tue, 20 Oct 2026 19:33:42 +0800", "desc": "法国国债风险溢价周二再度突破关键关口，反映出法国在财政整顿与社会动荡的双重压力下，正面临日益严峻的债务融资挑战。 10月20日，据彭博报道， 衡量法国主权债务风险的法德10年期国债利差升破150个基点，达到153个基点，为10月2日以来最高水平。本月早些时候，该利差一度升至159个基点。 与此同时，法国10年期国债收益率维持在4.94%附近，德国同期限国债收益率则下行3个基点至3.43%。 上周末，法国多地爆发大规模抗议，公众对生活成本持续攀升的不满蔓延至街头，公共建筑、商店和餐厅遭到冲击。当局随后加强安保措施，包括实施宵禁，抗议活动一度有所平息，但预计本周晚些时候仍可能出现新一轮动荡。 债市向政府发出警示 摩根大通资产管理公司欧洲、中东和非洲地区（EMEA）首席市场策略师Karen Ward表示，随着债券市场可供选择的投资标的增多，一旦投资者对借款方失去信心，就会要求更高的风险溢价。 “", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792496022.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "对冲基金大幅撤退、信用风险持续升温，纳指为何迟迟不崩？", "url": "https://wallstreetcn.com/articles/3784035", "date": "Tue, 20 Oct 2026 19:25:15 +0800", "desc": "市场表面的反弹掩盖不住水面之下的暗流涌动。 科技股遭遇史上最大规模净卖出、对冲基金杠杆率骤降至五年最低分位、信用利差持续走阔、欧洲主权债务压力升温——多重警示信号同时亮起，纳斯达克100指数（NDX）却依然在区间内震荡，迟迟未见方向性突破。 这一\"大分裂\"正成为当前市场最核心的矛盾。 据高盛（GS）Prime数据，美国基本面多空对冲基金净杠杆率单周下滑3.2个百分点，创2025年4月\"解放日\"以来最大单周降幅，亦是过去五年第四大单周降幅，目前已降至43.7%，处于五年期0百分位。与此同时，信息技术板块净卖出规模创历史纪录，估值亦大幅压缩——NDX远期市盈率已跌至20.5倍，为2023年AI行情启动以来最低水平。 然而，尽管基本面持续恶化、仓位已被大幅清洗，NDX仍未有效跌破区间支撑。信用市场与股票市场之间的背离愈发显著，苹果（AAPL）悄然成为科技板块内部的\"避险资产\"，而法国主权债务压力", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792495515.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "大摩拆解：1.6万亿美元AI基建投资落空的三大推手", "url": "https://wallstreetcn.com/articles/3784033", "date": "Tue, 20 Oct 2026 19:07:21 +0800", "desc": "人工智能基础设施建设热潮背后，一份来自摩根士丹利的深度报告正在向市场发出警示。 摩根士丹利公共政策策略师Ariana Salvatore将AI基建面临的核心约束归纳为三个维度—— \"人、电力与政治\"，并逐一梳理了可能导致这场高达1.6万亿美元资本支出计划受阻的下行路径。 尽管该行维持对AI基建的整体建设性判断，但报告明确指出，这一预期附带了越来越长的前提条件清单。 报告发布之际，市场正将AI情绪最不利的政治情景纳入定价。摩根士丹利认为， 美国政治风险、供需价格周期逆转以及电力缺口三大风险相互叠加，一旦任何环节出现松动，整个资本支出循环都可能以\"灾难性\"速度逆转。 美国政治风险：地方权力比联邦更具杀伤力 摩根士丹利的报告明确指出，美国联邦层面对AI基建实施全面暂停的可能性较低——国家安全框架的存在以及总统对限制性立法的潜在否决权，使华盛顿不太可能直接叫停建设。然而，真正具有约束力的杠杆在地方", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792494441.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "联手华为乾崑，宁德时代想让换电上“主桌”", "url": "https://wallstreetcn.com/articles/3784029", "date": "Tue, 20 Oct 2026 18:38:39 +0800", "desc": "作者 | 周智宇 想象一下，未来，你把车停在公司楼下，转身去上班。汽车发现电量已经不多，便根据你的用车安排，为自己选好附近的换电站。它自行驶出车位，开进站房，自动对准工位。几十秒换好电池，再沿着规划好的路线返回公司。等你下班，车已经停回原位，满电等你出发。 宁德时代与华为乾崑近日的联手，指向这个颇为科幻的场景。 10月19日，引望与宁德时代、时代电服在福建宁德签署智能化补能生态战略合作协议，着手把这一设想变成现实。宁德时代董事长兼CEO曾毓群、华为高级副总裁兼引望CEO靳玉志、宁德时代市场体系联席总裁杨峻等出席签约。 这也是杨峻首次以宁德时代市场体系联席总裁的身份出现。华尔街见闻此前提到，宁德时代换电业务负责人杨峻近日兼任市场体系联席总裁，负责乘用车板块。知情人士表示，此次调整意在进一步做大做强换电业务。 多位行业人士透露，双方合作的方向，是搭载华为乾崑方案的合作车型，逐步接入巧克力换电网", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792492719.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "Google Cloud Outage Mostly Resolved After Knocking Out Services", "url": "https://www.bloomberg.com/news/articles/2026-10-20/google-cloud-outage-takes-down-revolut-and-other-banks-in-uk", "date": "Tue, 20 Oct 2026 10:29:12 GMT", "desc": "A Google Cloud outage in Europe that knocked out digital bank Revolut Ltd. and other online services for several hours on Tuesday has mostly been resolved, the US tech company said.", "tags": [], "topic_score": 0, "source": "Bloombe const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
