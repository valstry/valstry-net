ic_score": 5, "source": "The Information", "cat": "金融媒体_英文", "weight": 3, "ts": 1793734176.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27, "title_zh": "Uber 的 Jill Hazelbaker 将加入 OpenAI 出任首席企业事务官"}, {"title": "独家 | Seedance 海外收入占比已达 50%，国内市场腾讯、B站等互联网企业为主要客户", "url": "https://www.36kr.com/p/4053733300196487", "date": "Tue, 03 Nov 2026 08:28:45 GMT", "desc": "近期《智能涌现》独家获悉，字节跳动旗下视频生成模型 Seedance 的海外收入占比已达到 50%。据接近火山引擎人士透露，过去半年，Seedance 在海外市场的收入增长近 5 倍。目前，海外已经成为 Seedance 模型的重要战场。 今年 2 月，Seedance 2.0 曾因生成内容涉及好莱坞版权角色，收到美国电影协会（MPA）的停止侵权函；半年后，双方在 8 月 17 日签署了全球谅解备忘录。此后，随着 Seedance 2.5 发布，MPA 官方点名了字节在 IP 保护上取得的进展。 8 月，迪士尼与 TikTok 也达成全球短视频内容合作。 创作者可以合规调用漫威、皮克斯、《星球大战》、FX 等数百部片库的角色和片段做二创，作品分发在 TikTok 和 Disney+ 的竖屏频道 Verts，先在美国试点再向全球推开。 正是随着字节与海外关键版权方的合作有所突破，Seedan", "tags": ["企业落地"], "topic_score": 3, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1793694525.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27}, {"title": "In-Model Context Compression with Agentic Soft Tokens for Long-Horizon LLM Agents", "url": "https://arxiv.org/abs/2610.41291", "date": "Tue, 03 Nov 2026 00:00:00 -0500", "desc": "arXiv:2610.41291v1 Announce Type: cross Abstract: Long-horizon LLM agents play an important role in solving complex and sustained tasks, with ever-growing interaction contexts. However, these accumulated contexts will raise substantial computational cost and obscure key decision-relevant evidence. Existing methods typically train external compressors or context-management agents to rewrite context", "tags": ["AI"], "topic_score": 7, "source": "arXiv cs.AI", "cat": "AI技术前沿", "weight": 3, "ts": 1793682000.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27, "title_zh": "面向长周期 LLM 智能体的模型内上下文压缩与智能体软 token", "desc_zh": "arXiv:2610.41291v1 公告类型：cross 摘要：长时程 LLM 智能体在解决复杂且持续的任务中发挥着重要作用，其交互上下文不断增长。然而，这些累积的上下文会带来大量计算开销，并掩盖关键的决策相关证据。现有方法通常训练外部压缩器或上下文管理智能体来重写上下文"}, { 息含量和 up 方面进行比较分析"}, {"title": "FedPA-LoRA: Product-Aligned Framework for Mitigating Aggregation and Initialization Errors in Heterogeneous Federated LoRA", "url": "https://arxiv.org/abs/2608.15381", "date": "Tue, 03 Nov 2026 00:00:00 -0500", "desc": "arXiv:2608.15381v2 Announce Type: replace Abstract: Low-Rank Adaptation (LoRA) enables efficient federated fine-tuning of large language models, but its factorization creates a tension between aggregation fidelity and local optimization continuity. Factor-wise aggregation incurs aggregation mismatch but better preserves factor continuity, whereas product-space reconstruction reduces this mismatch ", "tags": ["资本市场"], "topic_score": 6, "source": "arXiv cs.AI", "cat": "AI技术前沿", "weight": 3, "ts": 1793682000.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27}, {"title": "MLLMEraser: Achieving Test-Time Unlearning in Multimodal Large Language Models through Activation Steering", "url": "https://arxiv.org/abs/2510.04217", "date": "Tue, 03 Nov 2026 00:00:00 -0500", "desc": "arXiv:2510.04217v4 Announce Type: replace-cross Abstract: Multimodal large language models (MLLMs) have demonstrated remarkable capabilities across vision-language tasks, yet their large-scale deployment raises pressing concerns about memorized private data, outdated knowledge, and harmful content. Existing unlearning approaches for MLLMs typically adapt training-based strategies such as gradient ", "tags": ["AI", "个人成长"], "topic_score": 6, "source": "arXiv cs.AI", "cat": "AI技术前沿", "weight": 3, "ts": 1793682000.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27}, {"title": "A Survey on Long-Term Memory Security in LLM Agents: Attacks, Defenses, and Governance Across the Memory Lifecycle", "url": "https://arxiv.org/abs/2604.16548", "date": "Tue, 03 Nov 2026 00:00:00 -0500", "desc": "arXiv:2604.16548v5 Announce Type: replace-cross Abstract: The emergence of writable, cross-sess 二在声明中表示，预计第四季度营收为170亿美元，上下浮动3%。相比之下，分析师平均预期为163亿美元。最新展望进一步表明AI支出具有持续性，可能有助于缓解投资者的紧张情绪。最近几周，由于市场担心AI基础设施行业存在泡沫，芯片制造商和其他科技公司股价遭到重挫。 AMD首席财务官Jean Hu在声明中表示：“我们的第四季度展望反映出营收和利润增长加速，这得益于数据中心产品组合的强劲需求。” 财报发布后，AMD股价盘后上涨近7%。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1793751033.0, "opinion": true, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 16}, {"title": "@duckduckgo: Why is Google bullying schools into using AI? Because they can. And they don’t think you’ll do anything about it. Prove them wrong.", "url": "https://www.threads.com/t/DfSv0lUiQBC", "date": "Tue, 03 Nov 2026 20:32:07 GMT", "desc": "@duckduckgo : Why is Google bullying schools into using AI? Because they can. And they don’t think you’ll do anything about it. Prove them wrong.", "tags": [], "topic_score": 0, "source": "Threads-AI讨论", "cat": "AI实战_创作者", "weight": 4, "ts": 1793737927.0, "opinion": true, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 16}, {"title": "从贪婪到谨慎：华尔街AI投资者的情绪悄然生变", "url": "https://wallstreetcn.com/articles/3785099", "date": "Tue, 03 Nov 2026 21:14:30 +0800", "desc": "华尔街对人工智能的万亿美元押注仍在继续，但投资者的心态正在发生微妙变化。 过去两年，AI热潮几乎成为美股最强劲的上涨引擎。从科技巨头、芯片制造商到公用事业公司，凡是能够与AI产业链建立联系的资产，都曾受到资金追捧。市场对AI重塑经济的乐观预期，不仅推高了相关公司的估值，也催生了其他领域的投机狂热。 但随着AI投资规模不断膨胀，市场开始出现另一种声音：如果这场押注最终没有达到预期，投资者该如何全身而退？ 越来越多投资者开始重新审视AI交易的下行风险，并寻找对冲潜在市场崩盘的方式。 这并不意味着华尔街已经放弃AI，而是曾经单边押注上涨的资金，正开始为另一种可能性做准备。 从追逐上涨到寻找保护，AI交易的风险意识正在抬头。 AI乐观预期遭遇现实检验 过去，AI投资交易的核心逻辑相当简单：人工智能将深刻改变经济，科技巨头需要持续增加资本开支，芯片、数据中心、电力等产业链环节都将从中受益。 这一逻辑", "tags": ["资本市场"], "topic_score": 2, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793711670.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 16}, {"title": "下一个英特尔？华尔街对AMD的期望已高得危险，普通业绩将难逃抛售", "url": "https://wallstreetcn.com/articles/3785096", "date": "Tue, 03 Nov 2026 20:39:48 +0800", "desc": "AI交易的风向正在发生变化。 过去，只要沾上AI，芯片股便能获得市场的慷慨定价。但随着科技巨头巨额资本开支引发现金流担忧，以及英特尔业绩指引不及预期遭遇惨烈抛售，投资者开始重新审视AI产业链的增长逻辑。 对于即将于周二盘后公布财报的超威半导体（AMD）而言，市场的要求已经不只是交出一份好成绩，而是必须用足够强劲的业绩和更激进的未来指引，证明自己仍然配得上高估值。 今年以来，AMD股价累计上涨约118%，远超费城半导体指数46%的涨幅。但在AI交易情绪骤然转冷之际，这场涨势也让AMD站上了一个微妙的位置：增长预期越高，业绩容错空间就越小。 Allspring Global Investments投资组合经理Neville Javeri直言，AMD要想维持当前的上涨势头，“需要的不只是超预期，而是大幅超预期，并伴随相当强劲的业绩指引。温和的业绩表现已经不够了。” 英特尔暴跌，AMD面临同样的考", "tags": ["资本市场"], "topic_score": 2, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793709588.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 16}, {"title": "辉瑞Q3营收、利润双双超预期，上调全年营收指引，减肥药与抗癌药成增长新引擎 | 财报见闻", "url": "https://wallstreetcn.com/articles/3785090", "date": "Tue, 03 Nov 2026 19:45:48 +0800", "desc": "辉瑞制药（Pfizer）第三季度业绩超出市场预期，新药需求增长帮助公司抵消新冠产品销售下滑的压力。随着业绩表现好于预期，辉瑞上调全年营收及调整后每股收益指引，继续推进后疫情时代的业务转型。 辉瑞预计，2026年全年营收将达到620亿至640亿美元，此前预期为605亿至625亿美元；调整后每股收益预计为2.95至3.05美元，此前预期为2.80至3.00美元。 第三季度，辉瑞实现营收165.8亿美元，高于市场预期的158.7亿美元；调整后每股收益为0.87美元，超过分析师预期的0.73美元。 公司纽约早盘股价上涨不足1%，截至周一收盘，年内累计涨幅已达23%。 辉瑞的业绩改善并非孤立现象。上周，礼来、默克和百时美施贵宝等制药企业也相继公布了超出华尔街预期的业绩，并上调全年指引。尽管美国药品定价压力持续存在，制药行业仍展现出较强的收入韧性。 减肥药与癌症药物，辉瑞押注两大增长方向 疫情期间，新", "tags": ["资本市场"], "topic_score": 2, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793706348.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 16}, {"title": "苹果电话会：毛利率遭存储成本反噬，折叠屏Duo供应链受限，高管明确AI商业化路径", "url": "https://wallstreetcn.com/articles/3785028", "date": "Tue, 03 Nov 2026 10:31:28 +0800", "desc": "苹果新任CEO的首份“成绩单”虽创下第四财季营收历史新高，但受大中华区表现不及预期、假日季毛利率承压以及折叠屏供需失衡等多重因素拖累，华尔街的乐观情绪消退。 华尔街见闻提及 ，美东时间11月2日周一美股盘后，苹果公布第四财季营收同比增长11.7%至1144.77亿美元，高于华尔街预期的约1134.7亿美元，增速也高于苹果此前给出的增长指引区间9%-11%。 苹果公司第四财季营收超出分析师预期，但大中华区销售的疲软以及低于部分乐观预期的假日季指引令股价承压，盘后一度下跌约4%。 随后新任CEO John Ternus首次出席电话会，他将中国市场表现定性为\"有很大动能\"，并称iPhone Duo折叠屏手机的生产爬坡进展顺利，但供应约束将持续对本财季构成压力。 内存价格压力则是本次电话会议中反复出现的核心议题。苹果管理层表示，当前内存价格走势\"史无前例\"，公司已在Mac、iPad和iPhone上", "tags": ["企业落地"], "topic_score": 2, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793673088.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false 闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793711892.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "储能巨头的澳洲战事，打到了电池箱之外", "url": "https://wallstreetcn.com/articles/3785098", "date": "Tue, 03 Nov 2026 20:58:22 +0800", "desc": "在澳洲，宁德时代的客户反复追问：“谁能保证并网？” 宁德时代储能事业部CTO、储能欧洲业务部总裁许金梅解释，客户之所以有这个担忧，是因为在澳大利亚，一座电站如果拖上一两年还没并网，可能已经错过了市场上较好的赚钱时机。 这发生在大容量新品接连出现的时候。10月底，宁德时代在澳洲推出9MWh储能新品，同时签下设备配套与测试验证的合作备忘录；欣旺达则把同一款大电芯装进20尺和10尺两种箱体，为运输、场地和供电要求不同的项目提供选择。 就在11月2日，宁德时代宣布，为澳洲3GW/24GWh系列项目定制的8小时以上长时储能系统在近日首批交付，首次面向GWh级应用。 在澳洲，储能厂商要按当地电网和电力市场的规则做产品。客户的供电合同和交易安排，会影响电芯的选择、系统的配置，也会影响厂商需要作出怎样的性能承诺。大电芯的竞赛还在继续，头部厂商也在围绕整座电站调整产品和合作布局。 海外订单背后的工作，正沿着", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793710702.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "苹果CEO特努斯首秀：谨慎有余、魄力不足，错失提振市场信心良机", "url": "https://wallstreetcn.com/articles/3785092", "date": "Tue, 03 Nov 2026 20:03:58 +0800", "desc": "苹果公司新任首席执行官特努斯在就任后首次财报电话会议上令市场大失所望。这位51岁的高管全程紧守脚本，在分析师的追问面前几乎未能展现任何领导者该有的前瞻性愿景，错失了一次向华尔街宣示自身战略主张的绝佳机会。 电话会议召开之初，苹果盘后股价基本持平，略微偏正。但就在这场持续约一小时的会议结束之际，股价已下跌近3%。市场的反应清晰折射出投资者的失落情绪。 苹果当季业绩同样承压。受数据中心大规模扩建推动，内存成本持续飙升，特努斯本人也将这一轮内存通胀形容为\"前所未有\"。与此同时，公司对圣诞购物季及2027财年的展望令市场感到不安。在宏观压力与战略迷雾的双重笼罩下，外界本期待特努斯能站出来提振信心，但最终等来的，只是一次平淡收场。 首秀哑火，股价应声下跌 电话会议伊始，苹果盘后交易平稳，股价小幅飘红。然而随着会议推进，投资者的期待逐渐落空，至通话结束时，股价已累计下跌近3%。 股价下挫固然部分源于公", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793707438.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "飞利浦三季度销售额近44亿欧元，诊疗设备需求带动订单增长", "url": "https://wallstreetcn.com/articles/3785091", "date": "Tue, 03 Nov 2026 19:52:36 +0800", "desc": "飞利浦最大的诊断与治疗业务三季度销售持平，却是集团新增订单增长的主力。 11月3日，飞利浦发布2026年第三季度财报。当季集团销售额为43.9亿欧元，同比增长约2%，按可比口径增长3%。集团可比新增订单额同比增长8%，其中诊断与治疗业务接单表现最强。当季销售增长则主要来自个人健康和互联关护业务。 诊断与治疗业务涵盖CT、磁共振、超声及影像引导治疗设备，去年贡献了飞利浦约48%的销售额。三季度，该板块的影像引导治疗业务销售增长，但精准诊断业务受超声产品销售节奏和中国市场   document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
