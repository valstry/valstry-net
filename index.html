body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}

.seg{display:flex;border:1px solid var(--bd);border-radius:7px;overflow:hidden}
.seg span{padding:5px 13px;cursor:pointer;font-size:12px;color:var(--dim);background:var(--card)}
.seg span.on{background:var(--ac);color:#fff}
button.exp{background:var(--star);border:none;color:#000;padding:6px 13px;border-radius:6px;cursor:pointer;font-weight:600;font-size:12px}
main{padding:16px 20px;max-width:1080px;margin:0 auto}
.it{background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:13px 15px;margin-bottom:9px;display:flex;gap:12px}
.it:hover{border-color:#3d444d}
.it.star{border-color:var(--star);background:#1d1a12}
.sb{background:none;border:none;color:var(--dim);font-size:17px;cursor:pointer;padding:0;line-height:1;height:20px}
.sb.on{color:var(--star)}
.body{flex:1;min-width:0}
.t{font-size:14.5px;font-weight:600;margin-bottom:5px}
.t a{color:var(--tx);text-decoration:none}
.t a:hover{color:var(--ac)}
.meta{color:var(--dim);font-size:11.5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.src{color:var(--ac)}
.tg{background:#21262d;padding:1px 7px;border-radius:9px}
.rk{color:#6e7681}
.age{color:#7ee787}
.orig{color:#6e7681;font-size:11.5px;margin:-2px 0 5px}
.dsc{color:var(--dim);font-size:12.5px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--dim);text-align:center;padding:50px}
#sel{position:fixed;right:18px;bottom:18px;background:var(--star);color:#000;padding:9px 15px;border-radius:20px;font-weight:700;cursor:pointer;box-shadow:0 3px 14px rgba(0,0,0,.5);display:none;font-size:13px}
</style></head><body>

 false, "always_fresh": true, "rank": 23}, {"title": "现在好多演员都开始演伟人的角色了，未来特型演员会消失吗？", "url": "https://www.zhihu.com/question/2093738651259597355", "desc": "从《建国大业》《建党伟业》开始，扮演伟人的就不再是固定的特型演员。近年来更是有多位演员都曾扮演过毛泽东。比如刚刚获得飞天奖优秀男演员的王仁君就在《问苍茫》《古田军号》《浴血荣光》中扮演毛泽东。于和伟、刘烨、谷智鑫等也都分别扮演过中青年毛泽东形象。", "date": "", "hot": 0, "tags": [], "topic_score": 0, "source": "热搜-知乎", "cat": "热点榜_发生了什么", "weight": 5, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 23}, {"title": "做了鸡翅，孩子想多吃一个发现没有了，看到表弟碗里堆积几个，二宝看了一眼之后默默吃饭，你会怎么处理？", "url": "https://www.zhihu.com/question/2080368472178030209", "desc": "鸡翅都是孩子的最爱，我与妹妹合租一个房子带孩子上班，一起生活做饭吃，我的孩子从小我要求吃饭要注意餐桌礼仪，吃完一个再夹下一个，不能霸占。今年开始我妹两个孩子也在一起生活上学，他家两个孩子看到喜欢的食物都夹到碗里堆着吃，我孩子看到默默的看着，我妹完全不意识这个问题，默认此行为，她的孩子我也不好过多教育，我该怎么办？", "date": "", "hot": 0, "tags": [], "topic_score": 0, "source": "热搜-知乎", "cat": "热点榜_发生了什么", "weight": 5, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 23}, {"title": "申真谞加冕个人第九冠超越柯洁，如何评价其历史地位？", "url": "https://www.zhihu.com/question/2094349174879809687", "desc": "10 月 15 日，第四届衢州烂柯杯世界围棋公开赛决赛尘埃落定，在一场「韩国德比」中，申真谞九段以 2 比 0 零封卞相壹九段，第二次捧起烂柯杯冠军奖杯。这是他自 2020 年首夺 LG 杯以来的第 9 个世界冠军，就此超越柯洁的 8 冠，追平曹薰铉九段的历史纪录，仅次于李昌镐的 17 冠与李世石的 14 冠，正式跻身世界棋坛历史前三。申真谞比申真谞个人加冕更值得关注的，是本届烂柯杯创下的一个尴尬纪录——韩国棋手首次在中国主办的世界大赛中包揽四强。八强战中，党毅飞、金禹丞、廖元赫三位中国棋手分别负于申旻俊、申真谞、卞相壹，无一晋级半决赛。从赛前的阵容厚度来看，中国军团并非没有一战之力，但最终全", "date": "", "hot": 0, "tags": [], "topic_score": 0, "source": "热搜-知乎", "cat": "热点榜_发生了什么", "weight": 5, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 23}, {"title": "男子睡梦中蟑螂钻进耳道，拍打水冲后蟑螂死在里面，就医发现耳膜险穿孔，蟑螂等异物进入耳朵怎样处理最安全？", "url": "https://www.zhihu.com/question/2094464362748405033", "desc": "近日，有网友发视频称，国庆假期回老家看望亲戚，睡觉时遇蟑螂钻进耳道引发感染。 检查报告单。图 / 受访者提供 10 月 15 日，梁先生告诉记者，自己今年 33 岁，国庆假期回广东韶关老家走亲戚，由于房间不够，便睡在外婆家的客房。这间客房平时很少人住，不知道里面有蟑螂，睡前也没有挂蚊帐。 10 月 3 日晚，他从睡梦中惊醒，发现左耳耳廓有虫在钻爬，其称，当时不知道是蟑螂还是壁虎，他用手去抓，想把它拍死。梁先生压住它的尾部，没想到它挣脱后钻进了耳道。「吓得我半死，赶紧躺下来拼命拍打头部，又用水冲，本以为它会跑出来，结果它死在了里面。」 梁先生说，由于从韶关老家返回佛山市区的距离较远，而且以为虫子", "date": "", "hot": 0, "tags": [], "topic_score": 0, "source": "热搜-知乎", "cat": "热点榜_发生了什么", "weight": 5, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 23}, {"title": "「加一秒」要消失了，国际计量大会决定取消闰秒，之后时间该怎么校准？这会影响到生活哪些方面？", "url": "https://www.zhihu.com/question/2094361841795388846", "desc": "Nature 报道，国际计量大会投票决定立即取消闰秒，改为地球时与原子时相差 3600 秒时校正一闰小时，预计数千年内都未必需要调整。 来源：Nature 「23:59:60」将不再出现，国际计量大会决定取消闰秒 _ 腾讯新闻", "date": "", "hot": 0, "tags": [], "topic_score": 0, "source": "热搜-知乎", "cat": "热点榜_发生了什么", "weight": 5, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 23}, {"title": "如何评价《海贼王》第 1196 话？", "url": "https://www.zhihu.com/question/2093508000262768508", "desc": "91 万热度", "date": "", "hot": 0, "tags": [], "topic_score": 0, "source": "热搜-知乎", "cat": "热点榜_发生了什么", "weight": 5, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 23}, {"title": "有人说常光顾的一家店老板如果突然开始搭话，就再也不想去了，为啥会有这种心理？你有同感吗？", "url": "https://www.zhihu.com/question/2093003760058332999", "desc": "刷到一个视频。老板说自己的餐厅每天都会有一个定点刷新点一模一样套餐的「NPC」，老板为了维护这个客人，甚至和自己父亲说每次收碗筷的时候等他吃完了过一会再收，因为只要一跟这种不说话的老客户搭话，他就再也不会再来了，这条视频点赞突破了 60 多万，现在疑似被老顾客本人刷到了，老板已经「痛失」这位老顾客。你咋看这事？你介意吃饭的时候老板和你搭话吗？", "date": "", "hot": 0, "tags": [], "topic_score": 0, "source": "热搜-知乎", "cat": "热点榜_发生了什么", "weight": 5, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 23}, {"title": "妈妈因大一儿子未考技能证书，将生活费从 4000 元降至 2000，够花吗？怎样看待这种「降费逼考证」方式？", "url": "https://www.zhihu.com/question/2094821313529565919", "desc": "据先锋新闻报道，近日，北京，一位妈妈与刚读大一的儿子因生活费起争执。赵女士称，原本每月给 4000 元，为让孩子有一技之长，一直让他尽快考取技能证书，但孩子迟迟未考出而且抵触，于是提出降至 2000 元、考出恢复 4000 元。 儿子则认为，在北京读书 2000 元不够日常开销。双方协商后决定先试执行两个月，生活费按周发放，并设考证奖励 500 至 1000 元。赵女士表示，自己反思过去对孩子有些溺爱，想趁孩子即将步入社会帮他学会规划，也希望他明白要靠自己努力找到人生道路。目前孩子对方案仍不满意。每月从 4000 元降至 2000 元，大一男生因生活费与母亲起争执，母亲回应 _ 腾讯新闻", "date": "", "hot": 0, "tags": [], "topic_score": 0, "source": "热搜 持有者，又迎来了一个新身份——成为“国际网球名人堂”中的一员。这不仅是对费德勒出色成绩的认可，也是对他在赛场外、长期推动网球运动发展的肯定。 对于中国网球运动，费德勒也是不可忽视的存在。 官方数据显示，自2002年起，费德勒累计17次到华参与比赛。他既见证了顶尖国际赛事在中国的落地，也让中国网球进入了更广泛的国际视野。 退役至今，当这位网球界领袖逐渐淡出赛场，人们转而更关注他在商业上的布局，其中就包括加盟On昂跑。 作为", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1792215404.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "《哈利波特》的东家被卖了，价值7361亿", "url": "https://www.36kr.com/p/4029435030983298", "date": "Sat, 17 Oct 2026 03:59:49 GMT", "desc": "国庆期间，好莱坞等来了一桩迟到近一年的交割。 派拉蒙天舞公司（以下简称“派拉蒙天舞”）正式宣布，完成对华纳兄弟探索公司（以下简称“华纳兄弟”）的收购，交易金额约1100亿美元（约合人民币7361亿元）。根据公告，合并后的新公司定名为“天空之舞”，股票代码SKYD，并从纳斯达克转至纽约证券交易所挂牌。 华纳兄弟是美国现存第三古老的电影公司，拥有《哈利·波特》《蝙蝠侠》《指环王》等知名IP，也是《老友记》的出品方HBO以及CNN的母公司；而买方派拉蒙天舞同样来头不小，其由老牌制片厂派拉蒙与独立制片公司天舞传媒在去年合并而来，是《碟中谍》《星际迷航》等系列IP的核心出品方。 此次两者合并，不仅促成了美国传媒史上规模最大的并购交易之一，还改写了整个好莱坞的权力版图：传统“五大”制片厂——迪士尼、索尼、派拉蒙、环球、华纳兄弟，如今只剩四家。 更值得关注的是，这桩交易背后还出现了硅谷巨头甲骨文的身影，", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1792209589.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "[OpenAI] 又重置了。", "url": "https://www.v2ex.com/t/1249687#reply0", "date": "2026-10-17T03:40:06Z", "desc": "", "tags": ["AI"], "topic_score": 3, "source": "V2EX 最新", "cat": "AI实战_创作者", "weight": 3, "ts": 1792208406.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "刚刚，Mythos 5破解量子计算重大难题", "url": "https://www.36kr.com/p/4029231447446152", "date": "Sat, 17 Oct 2026 03:23:17 GMT", "desc": "就在刚刚，Anthropic晒出一项炸裂研究。 Mythos 5已经自主闭环，设计出比人类「最佳方案」还要高效得多的全新的量子电路！ 而且，还是在纯语言描述的情况下。 在关键解码任务中，Claude直接将计算成本暴降了12倍甚至17倍！ 更惊人的是，它为了完成任务，自主推导出了人类从未发现的全新代数恒等式。 53个小时内，Myths 5就碾压了人类数年研究。 有网友惊呼：「每一个物理学博士刚刚都发现，他们苦心钻研多年的论文，AI只用几句大白话就能写出10倍优秀的版本……」 人类被卡脖子了：量子计算的「绝望之谷」 为什么设计量子电路这么难？ 要知道，传统计算机用0和1（比特）来存储信息。 而量子计算机用的是「量子位」。借助量子叠加态，它可以同时处理海量信息。一旦真正实用化，它能破解密码、研发绝症特效药、寻找室温超导材料…… 然而，目前的量子计算机，有着重大缺陷。 第一，量子位太少了。 现在的", "tags": [] "广西一女子给孩子冲奶粉时，发现奶粉罐上覆满白色“粉末”，本以为是奶粉残留，细看竟是密密麻麻的粉螨。近日，广西贵港的辛女士准备给小朋友冲奶粉时，发现自家...", "url": "https://www.huxiu.com/moment/1289131.html", "date": "Sun, 18 Oct 2026 00:18:39 GMT", "desc": "广西一女子给孩子冲奶粉时，发现奶粉罐上覆满白色“粉末”，本以为是奶粉残留，细看竟是密密麻麻的粉螨。 近日，广西贵港的辛女士准备给小朋友冲奶粉时，发现自家奶粉罐外壁布满了看似奶粉的白色粉末。凑近细看才发现，这些“粉末”竟是密密麻麻不停蠕动的粉螨，远看和奶粉几乎一模一样，难以分辨。该女士称，起初还以为是发霉，仔细查看后发现，不仅这个奶粉罐，其他奶粉罐和桌子上也全都是密密麻麻的粉螨。视频发布到网络后，引发不少网友热议。什么是粉螨？粉螨是一种常见的储藏物害虫，个体微小，肉眼极难分辨，外观酷似干粉，多呈乳白色，在适宜条件下2~4周即可完成一代繁殖。它们常出现在粮食、干果、草药、奶粉等干燥食品中，其代谢产物是强烈的过敏原，人体接触后容易引发皮肤瘙痒、打喷嚏、咳嗽等过敏症状，严重时还可能导致螨性皮炎、肠螨症、肺螨症等疾病。对于婴幼儿来说，本身抵抗力较弱，风险更需警惕。 奶粉储存要点 一、未开封奶粉 1.", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1792282719.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "“网友爆料蒋依依郭麒麟结婚了”冲上热搜，男女双方深夜发文否认结婚传闻。近日，#网友爆料蒋依依郭麒麟结婚了#冲上热搜，相关词条迅速登上热搜。对此，郭麒麟方...", "url": "https://www.huxiu.com/moment/1289130.html", "date": "Sun, 18 Oct 2026 00:14:41 GMT", "desc": "“网友爆料蒋依依郭麒麟结婚了”冲上热搜，男女双方深夜发文否认结婚传闻。 近日，#网友爆料蒋依依郭麒麟结婚了#冲上热搜，相关词条迅速登上热搜。对此，郭麒麟方称网传内容为假，蒋依依方则表示“纯属造谣，从认识到现在一直都是好朋友。”此前2022年3月，有网友拍到郭麒麟深夜和一位粉衣女生在街头亲密互动，认为这一女生是蒋依依。蒋依依当时回应：小蒋长这么大还没喝过酒呢，否认了恋情。 据悉，二人曾共同参演2021年播出的古装商战剧《赘婿》，郭麒麟挑大梁出演男主宁毅，蒋依依在剧中饰演飒爽女寨主刘西瓜。 据公开资料显示，郭麒麟，本名郭奇林，1996年2月8日出生于天津市，中国内地相声、演员，多次举办个人相声专场演出，台风日渐成熟。2015年开始尝试多维发展，出演古装剧《庆余年》、电影《宠爱》、主演电视剧《赘婿》《边水往事》等。 蒋依依出生于2001年，6岁时以童星身份出道，后毕业于中央戏剧学院，为内地娱乐圈", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1792282481.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "伊朗海军称“违规”穿越海峡而受损的油轮增多。伊朗海军10月17日说，试图穿越霍尔木兹海峡相关禁航区而受损的“违规”油轮近期数量呈上升趋势。伊朗海军在其网站...", "url": "https://www.huxiu.com/moment/1289129.html", "date": "Sun, 18 Oct 2026 00:07:01 GMT", "desc": "伊朗海军称“违规”穿越海峡而受损的油轮增多。 伊朗海军10月17日说，试图穿越霍尔木兹海峡相关禁航区而受损的“违规”油轮近期数量呈上升趋势。伊朗海军在其网站发布声明说，当天早些时候，持续监视与管控霍尔木兹海峡东部入口的海军监测团队发现，一艘“违规”油轮在阿曼湾、靠近海峡东部入口处起火，失去航行能力。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1792282021 "cat": "AI实战_创作者", "weight": 4, "ts": 1792265754.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "@sonaka_a_chto: fuck ai, drew them myself", "url": "https://www.threads.com/t/Dem0e4ICghs", "date": "Sat, 17 Oct 2026 19:06:15 GMT", "desc": "@sonaka_a_chto : fuck ai, drew them myself", "tags": [], "topic_score": 0, "source": "Threads-AI讨论", "cat": "AI实战_创作者", "weight": 4, "ts": 1792263975.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "AI融资成本攀升：Anthropic拟向黑石提供超10%收益率", "url": "https://wallstreetcn.com/articles/3783838", "date": "Sat, 17 Oct 2026 16:14:47 +0800", "desc": "Anthropic正以远高于市场基准的融资成本推进其史上最大规模芯片融资，折射出AI基础设施军备竞赛背后日益高企的资本代价。 据英国《金融时报》17日报道， Anthropic正向黑石集团（Blackstone）提供逾10%的收益率，以换取后者参与这笔代号\"Project North Star\"、总规模高达600亿美元的债务融资。 知情人士透露，黑石旗下基金将认购其中90亿美元，约占180亿美元次级贷款的一半，并获得10%的票息，加计新发折价及其他费用后实际总回报更高。 这笔融资规模预计将创下芯片融资历史纪录，并将成为衡量投资者对AI债务胃口的重要风向标。值得关注的是，仅仅四个月前，Anthropic以8.5%利率完成代号\"Project Big Sky\"的约44亿美元融资，借贷成本的快速攀升，凸显出投资者对AI企业密集融资需求的警惕情绪持续升温。 600亿融资案：规模创纪录，成本同步飙升", "tags": ["AI"], "topic_score": 4, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792224887.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "Arrested OpenAI Engineer Seeks Bail, Denies Planning to Flee", "url": "https://www.bloomberg.com/news/articles/2026-10-17/arrested-openai-engineer-seeks-bail-denies-he-planned-to-flee", "date": "Sat, 17 Oct 2026 03:55:53 GMT", "desc": "The OpenAI software engineer charged with using a hidden recording device in one of the company’s offices asked to be freed from custody and denied his purchase of a one-way plane ticket to his native Saudi Arabia was part of a plan to flee US justice.", "tags": ["AI"], "topic_score": 4, "source": "Bloomberg Technology", "cat": "金融媒体_英文", "weight": 2, "ts": 1792209353.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20, "title_zh": "被捕 OpenAI 工程师申请保释，否认计划潜逃", "desc_zh": "这名被控在公司一处办公室使用隐藏录音设备的 OpenAI 软件工程师申请解除羁押，并否认其购买前往祖国沙特阿拉伯的单程机票是逃避美国司法的一部分。"}, {"title": "Anthropic被曝秘密游说国会：AI造成超10亿美元损失，政府才能叫停？", "url": "https://wallstreetcn.com/articles/3783831", "date": "Sat, 17 Oct 2026 11:22:17 +0800", "desc": "Anthropic正悄然推动一项由其主导起草的AI安全法案，试图为联邦政府干预前沿AI模型设定极高门槛，同时将监管权力严格限定于商务部和联邦法院。 据路透社17日援引Politico报道，Anthropic代表已私下向国会议员游说这份草案法规。 根据法案内容，政府只有在AI模型面临可预见的、迫在眉睫的风险——即可能造成超过10亿美元损失，或导致50人以上死亡或重伤时，方可介入阻止模型发布或使用。 这一高门槛意味着，绝大多数情形下AI模型的开发与部署将不受政府干预。 Anthropic发言人向路透社表示，该法案所体现的提案内容，源自Anthropic今年早些时候发布的\"先进AI框架\"（Advanced AI Framework）。发言人同时强调，法案将赋予政府\"阻止或遏制最强大模型危险部署的能力\"，并要求开发者对前沿AI模型进行测试、公开评估结果，并接受独立第三方评估。商务部未就路透社的置评", "tags": ["AI"], "topic_score": 4, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792207337.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "AI交易忧虑压垮美股，纳指跌超2%、CoreWeave暴跌12%，VIX一度升破22，布油涨破110", "url": "https://wallstreetcn.com/articles/3783778", "date": "Sat, 17 Oct 2026 07:26:52 +0800", "desc": "科技股遭新一轮抛售，AI投资盈利能力的疑虑与油价骤升形成双重压力，美股周五全线下挫。纳指单日重挫2%，芯片股连续第八个交易日收跌，创下2008年以来最长连跌纪录。 周五，纳斯达克100指数收跌2.5%，标普500指数跌1.1%。云计算服务商CoreWeave单日暴跌12%，其债券收益率本周一度突破15%，信用风险攀升至通常预示财务困境的水平。 本周，AI交易的核心矛盾正从算力需求增长转向融资成本、资本开支回报和企业盈利能力。云服务商CoreWeave债务承压，进一步引发市场对AI数据中心建设融资模式的审视；存储芯片、光通信和数据中心设备等此前受益于AI投资热潮的股票，也成为资金减仓的重点。媒体指出，CoreWeave股价持续下跌令市场更关注AI交易的融资问题，未来几周科技巨头的财报将检验高估值能否得到盈利支撑。 在能源层面，布伦特原油结算价收于每桶约110美元附近，WTI原油单日涨幅达3.", "tags": ["资本市场"], "topic_score": 5, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792193212.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "沃什曼谷发言“偏鸽”，市场押注美联储10月按兵不动，加息概率跌破15%", "url": "https://wallstreetcn.com/articles/3783799", "date": "Fri, 16 Oct 2026 20:37:23 +0800", "desc": "美联储主席沃什在曼谷的一番表态，令市场对本月加息的预期大幅降温。 周五上午，沃什在国际货币基金组织年会的一场对话活动中，对货币政策前景几乎未作具体表态，仅重申美联储致力于实现价格稳定。这一\"偏鸽\"姿态令投资者迅速调整押注—— 市场对美联储10月27日至28日政策会议加息的概率预期，从沃什发言前的约27%骤降至15%以下。 美股期货随之扩大涨幅，标普500指数期货转跌为涨，上涨0. function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
