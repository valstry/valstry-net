.tg{background:#21262d;padding:1px 7px;border-radius:9px}
.rk{color:#6e7681}
.age{color:#7ee787}
.orig{color:#6e7681;font-size:11.5px;margin:-2px 0 5px}
.dsc{color:var(--dim);font-size:12.5px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--dim);text-align:center;padding:50px}

初中均分低于 15 、小学均分低于 30 的教师上台，跟「耻辱」合影。有老师会后借酒消愁，有人念着检讨当场落泪。老师含泪检讨，刺痛无数教育人！官方道歉了，承认不尊重教师，可调查结果至今没公布。更离谱的是，有山区教师直言，山区师资紧缺，老师一周硬扛 20 节课，村小一人身兼数科。县中老师还背双重压力：清北数、 600 分、一本率，层层加码。一个不快乐的老师，怎么教出阳光的学生？这事，不能道歉就翻篇！", "date": "", "hot": 0, "tags": [], "topic_score": 0, "source": "热搜-知乎", "cat": "热点榜_发生了什么", "weight": 5, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 23}, {"title": "如何看待患者送 1.9 元汽水后举报医院药房工作人员违规收礼，医院已对其进行批评教育？这算违规收礼吗？", "url": "https://www.zhihu.com/question/2093393122902237224", "desc": "收一罐 1.9 元汽水算不算收礼？ 近日，一张广东佛山 12345 处理回复工单截图 引发热议 这则举报工单上显示： 患者给药房工作人员 送了一罐 1.9 元的健力宝汽水 随后通过 12345 举报 称对方存在违规收礼问题 网传截图 根据这则工单截图，患者举报的是佛山复星禅诚医院有限公司药房一名梁姓工作人员，通过 12345 举报称对方存在违规收礼问题。佛山市卫生健康局在收到投诉举报事项后，根据属地管理原则，转派禅城区卫生健康局进一步调查处理。此后，针对市民举报，禅城区卫生健康局第一时间向医院调查核实情况。回复工单上显示：「经了解，您多次到医院进行复诊，是该医院的老病患，该名工作人员未主动开口", "date": "", "hot": 0, "tags": [], "topic_score": 0, "source": "热搜-知乎", "cat": "热点榜_发生了什么", "weight": 5, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 23}, {"title": "男生高考 522 分被调剂马术专业，成为在校本科生中唯一持证钉蹄师，前景如何？能带给选专业的学生哪些启发？", "url": "https://www.zhihu.com/question/2093388530156135905", "desc": "一名大四男生的求学经历在 10 月 12 日前后引发关注。据公开报道，武汉商学院国际马术学院马业科学专业学生付华东，2026 年高考考出 522 分，原本填报的是运动康复专业，因为勾选了不服从调剂，一度差点滑档、面临没学可上的处境。学校招生办随后打来电话，他选择接受调剂，进入武汉商学院马业科学专业。让他没想到的是，大二上学期的一堂马术课，让他第一次接触到钉蹄技术，也从此定下了自己的方向。他最终选择了钉蹄方向，而这个方向全年级只有他一个人。今年 6 月，他考取了中国马业协会颁发的钉蹄师证书，在全国 70 余名持证从业者中，成为唯一一名在校本科生，也是其中年龄最小的一个。一年学费约 4000 元。", "date": "", "hot": 0, "tags": [], "topic_score": 0, "source": "热搜-知乎", "cat": "热点榜_发生了什么", "weight": 5, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 23}, {"title": "如何评价老干妈引入 AI 用于检验辣椒品质，将 600 人生产线减至 48 人？AI 能给食品制造业带来啥改变？", "url": "https://www.zhihu.com/question/2093427934316814825", "desc": "大家上一次刷到国民品牌老干妈，是什么时候？似乎有点久，毕竟老干妈的抖音停更一年多，公众号停更了四年多，官方微博更是显示着「企业资质未过年审」。 就这样看似「断网」的老干妈，背地里却在闷声干大事。最近，老干妈突然登上了热搜，不仅去年的营收回归历史巅峰 54 亿元，而且厂区还用上了全链路 AI 管理系统，这个跨度，瞬间从食品厂变身科技企业。 老干妈 "source": "Crunchbase 融资板块", "cat": "创投行业分析", "weight": 5, "ts": 1791889248.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21, "title_zh": "下一代超级应用将在哪里诞生", "desc_zh": "客座作者、645 Ventures 联合创始人兼管理合伙人 Nnamdi Okike 写道，下一代超级应用很可能出现在这样的市场：移动端普及、竞争薄弱、金融服务欠佳，加上危机侵蚀了人们对银行的信任，从而催生对单一可信平台的需求。"}, {"title": "10-K - OZ VISION INC. (0001751707) (Filer)", "url": "https://www.sec.gov/Archives/edgar/data/1751707/000149315226046693/0001493152-26-046693-index.htm", "date": "2026-10-13T06:18:22-04:00", "desc": "Filed: 2026-10-13 AccNo: 0001493152-26-046693 Size: 4 MB", "tags": [], "topic_score": 0, "source": "SEC 最新 10-K 年报", "cat": "企业行为_美股披露", "weight": 5, "ts": 1791886702.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "《柳叶刀》警告 ：AI比核武器更可能毁灭人类", "url": "https://www.36kr.com/p/4023950270289544", "date": "Tue, 13 Oct 2026 08:28:33 GMT", "desc": "你知道吗，哪怕是和流行病、气候、战争、核威胁相比，2100年前最有可能毁灭人类的东西竟然是AI——这个惊人的论断，来自于《柳叶刀》的权威报告。 《柳叶刀》在10月11日发布的《21世纪全球健康威胁》委员会报告中写到，包括气候变化、流行病、污染在内的17种威胁里，核冲突和人工智能的恶意使用排在首位，可能在2100年前导致人类灭绝。 这份报告共由35位顶级专家撰写，整个研究覆盖全球204个国家和地区，并且报告还提醒，这些威胁可能相互作用、彼此放大。 报告最令人胆寒的部分在于，即使AI和核冲突都是毁灭人类的头号难题，但AI造成的破坏，要远远超过核冲突。 如果AI末日这话是阿莫迪说的，我可能就当个乐子听，毕竟相同的话术已经有太多了，我听得耳朵都快起茧了。 但是这回是《柳叶刀》说的，我是真有点怕了。 《柳叶刀》是怎么说的？ 《柳叶刀》这份报告牵头的是华盛顿大学的健康指标与评估研究所（IHME）。他们", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1791880113.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "中国小麦产量全球第一，做面包为何从日本进口面粉？", "url": "https://www.36kr.com/p/4023756505272195", "date": "Tue, 13 Oct 2026 05:04:32 GMT", "desc": "用进口面粉做高端面包，这在国内已经不是什么新鲜事儿。 近些年，有不少国产高端面包在宣传时，会特别注明采用的是进口面粉。 2025年，某知名超市推出的“山茶花山泉吐司”自营面包走红，其主打卖点之一就是“精选进口日清制粉山茶花牌小麦粉”。 某超市内主打自营面包的货架 一家号称“西南法甜第一”的成都本土烘焙品牌，面包的主要原料也是日本的高端面粉。 其他数量更多的小众个人主理面包坊，更是高频打出进口面粉的招牌，以招揽肯花高价消费的买主。 中国早就是全球小麦产量第一大国，做面包为何要从日本进口面粉？ 进口面粉好在哪儿 进口面粉做的面包好不好，不吹不黑先看数据。 能不能做出好面包，面粉中蛋白质的含量是关键要素之一。 它直接决定了面筋的强度和延展性，以及面包能否膨胀、组织是否细腻。 常见的制作面包专用的高筋粉 行业建议的面包专用粉蛋白质含量范围是11.5％—13.5％。 国产的王后柔风吐司粉，蛋白质含量", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1791867872.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "俩月换了近30名高管，13大品牌整合，车圈最猛整合潮来了", "url": "https://www.36kr.com/p/4023673488789379", "date": "Tue, 13 Oct 2026 04:36:19 GMT", "desc": "如果要用一个词来定义这两个月的中国车圈，那就是——整合。最近两个月，中国汽车行业掀起了一轮前所未有的整合浪潮。 从一汽入股广汽，到长安旗下深蓝、阿维塔两大品牌整合，再到小鹏产品线精简与组织架构重构，甚至延伸到赛力斯与华为合作模式调整，12大车企、13大汽车品牌 密集出手，几乎同时把改革重心转向了组织提效与供应链协同。 组织架构变更随之而来的是人事密集调整，据车东西不完全统计， 这两个月已有近30名车企高管传出岗位新动向， 国内主流车企整合动作密集程度和涉及范围之广，在中国汽车工业史上实属罕见。 2026年8-10月车圈高管岗位动向梳理 这不是一次普通的行业调整，而是释放出一个重要信号：中国汽车产业正从“规模扩张”阶段进入“存量优化”阶段，行业告别野蛮生长，怎么搭组织、怎么提效率，成了所有车企绕不开的一关。 01.车圈掀起大整合，品牌整合与外部合作密集落地 最近两个月，车圈出现了多个关注度极", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1791866179.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "Let Large Language Models Judge Each Other: Multi-Agent Peer-Reviewed Reasoning for Medical Question Answering", "url": "https://arxiv.org/abs/2606.15419", "date": "Tue, 13 Oct 2026 00:00:00 -0400", "desc": "arXiv:2606.15419v2 Announce Type: replace Abstract: Objective: To enhance the accuracy, interpretability, and robustness of large language models (LLMs) in medical question answering (MedQA). Method: We designed a multi-agent peer-reviewed reasoning method in which multiple LLM agents independently generate chain-of-thought reasoning with candidate answers, then act as peer reviewers to evaluate e", "tags": ["AI"], "topic_score": 5, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1791864000.0, "opinion": true, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "AutoIndexer: Flexible-Order Decoding by Training Causal Models on Chains of Edits", "url": "https://arxiv.org/abs/2610.12545", "date": "Tue, 13 Oct 2026 00:00:00 -0400", " om/foundersatwork.html", "date": "", "desc": "", "tags": ["个人成长"], "topic_score": 2, "source": "Paul Graham 文集", "cat": "AI实战_创作者", "weight": 3, "ts": 0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 13}, {"title": "The Power of the Marginal", "url": "http://www.paulgraham.com/marginal.html", "date": "", "desc": "", "tags": ["商业认知"], "topic_score": 2, "source": "Paul Graham 文集", "cat": "AI实战_创作者", "weight": 3, "ts": 0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 13}, {"title": "White House asks US envoy to Greece Kimberly Guilfoyle to resign", "url": "https://www.ft.com/content/87a1a5a1-4942-47dd-856a-d9a694f7d2fd?syn-25a6b1a6=1", "date": "Tue, 13 Oct 2026 16:16:58 GMT", "desc": "Donald Trump had said he was considering firing the ambassador after reports claiming she accepted improper gifts", "tags": [], "topic_score": 0, "source": "Financial Times", "cat": "金融媒体_英文", "weight": 2, "ts": 1791908218.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "沙特领衔OPEC+增产：9月原油日产量环比增加90万桶", "url": "https://wallstreetcn.com/articles/3783555", "date": "Tue, 13 Oct 2026 23:59:50 +0800", "desc": "OPEC+九月原油产量大幅回升，但地缘冲突造成的供应缺口仍未弥补，全球石油市场的供应压力尚未消退。 10月13日，石油输出国组织（OPEC）公布的月度报告显示， OPEC+九月日均原油产量达到3907万桶，较八月增加约90万桶，主要得益于沙特阿拉伯大幅增产。 俄罗斯产量则继续下降，集团整体产量仍未恢复至2026年2月中东冲突爆发前的水平。 供应中断还促使各国政府和能源企业大量动用库存。需求方面，OPEC连续第六个月下调2026年全球石油需求增长预测，同时上调2027年预测，认为今年需求走弱后，明年补库需求有望支撑石油消费增长。 沙特大幅增产，俄罗斯产量继续下降 沙特阿拉伯九月原油日产量升至837.2万桶，较八月增加逾200万桶，成为OPEC+当月产量回升的主要推动力。 这一变化与沙特调整原油出口路线有关。 东西输油管道遭袭受损后，经红海运输原油受到影响，沙特阿美转而加大波斯湾出口终端的装船", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791907190.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "伊朗称美军海上力量大幅后撤，霍尔木兹一日6船遇袭，胡塞武装指沙特阿美石油设施为“合法目标”", "url": "https://wallstreetcn.com/articles/3783556", "date": "Tue, 13 Oct 2026 23:56:46 +0800", "desc": "中东战事持续升级，霍尔木兹海峡航运风险再度攀升，红海方向的威胁也开始向沙特能源设施延伸。伊朗一方面声称美军海上力量已大幅远离其海上边界，另一方面继续打击其认定的“违规”船只。媒体估算，过去两周霍尔木兹海峡及周边水域共有24艘船遭袭、其中仅上周日一日就有6艘，为战事爆发以来最严重袭击。 据伊朗媒体当地时间13日周二报道，伊朗海军称，一艘关闭船舶追踪系统、试图驶经霍尔木兹海峡东部水域的“违规”油轮当天受损并起火。伊方表示，海军已确认该船身份，但未披露更多细节。此前，据新华社援引伊朗外交部发言人周一的讲话，正在审议美方对伊方重开海峡提议的回应，重开海峡的条件没有变化。 另一条风险线来自红海及其周边。据环球时报，胡塞武装13日将沙特阿美旗下石油设施称为“合法打击目标”，并警告相关设施周边的员工和民众撤离。这意味着，地区能源风险不仅来自霍尔木兹海峡这一关键航运通道，也可能进一步延伸至沙特石油生产、炼", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791907006.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "美国9月成屋销售四个月来首次回升，抵押贷款利率飙升或再度抑制需求", "url": "https://wallstreetcn.com/articles/3783552", "date": "Tue, 13 Oct 2026 23:55:58 +0800", "desc": "美国9月成屋销售四个月来首次环比回升，但这一改善可能难以延续。抵押贷款利率自9月初以来大幅攀升，购房者的负担进一步加重，后续销售活动面临更大压力。 据全美房地产经纪人协会（NAR）周二公布的数据， 9月成屋销售年化总数环比增长1.5%，至399万户，高于彭博调查经济学家预期的396万户；8月数据则下修至393万户。这是成屋销售自今年5月以来首次环比增长。 不过，NAR首席经济学家Lawrence Yun表示，8月和9月是今年成屋销售最疲弱的两个月。 随着抵押贷款利率进一步上升，符合购房条件的买家数量可能继续减少。与此同时，房价仍在上涨，9月成屋销售中位价同比上涨1.3%，至41.75万美元。 房价高企与融资成本上升叠加，继续挤压购房者的负担能力。美国30年期固定抵押贷款利率自9月初以来累计上升逾50个基点，至7.49%。房地产网站Realtor.com首席经济学家Danielle Hale", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791906958.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "How not to revive Europe’s auto industry", "url": "https://www.ft.com/content/52a1bbdd-2171-4fcb-9efe-99ed4283def5?syn-25a6b1a6=1", "date": "Tue, 13 Oct 2026 15:03:49 GMT", "desc": "The electric vehicle market shows how legacy EU companies continue to fail when it comes to countering Chinese competition", "tags": [], "topic_score": 0, "source": "Financial Times", "cat": "金融媒体_英文", "weight": 2, "ts": 1791903829.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "不予兜底！高盛、摩根大通拒绝承销11%高息AI芯片贷，AI融资风险谁来接？", "url": "https://wallstreetcn.com/articles/3783551", "date": "Tue, 13 Oct 2026 22:19:02 +0800", "desc": "华尔街对AI融资的态度正在出现微妙变化：银行仍愿意参与交易、赚取费用，但开始更谨慎地承担风险。摩根大通与高盛联合主导了一笔50亿美元的AI基础设施贷款，却拒绝为其中37亿美元的GPU芯片贷款提供承销担保。 据彭博报道，这笔面向新兴云计算公司Volta Infrastructure Holdings的融资分为两部分： 13亿美元的定期贷款由银行提供承销担保，另外37亿美元则采用“尽力销售”方式，银行不承诺包销未售出的部分。 这笔交易的融资成本同样引人注目。两笔贷款的到期收益率为11.21%至11.75%，处于当前AI融资市场的高位。作为对比，CoreWeave今年7月一笔GPU贷款的到期收益率约为10.44%。 银行并未停止为AI基础设施提供融资，但已不愿无条件承接芯片贷款的风险。 当高成本融资遇上更谨慎的承销态度，市场面临的问题是：如果银行不愿兜底，谁会接手这些贷款？私人信贷等资金能否填补", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791901142.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "阶跃3999元杀入手机市场，WorkBuddy、支付宝等近百家生态玩家来搭台", "url": "https://wallstreetcn.com/articles/3783550", "date": "Tue, 13 Oct 2026 22:18:50 +0800", "desc": "手机市场迎来一家新的AI玩家。 10月13日，阶跃终端正式发布首款大模型原生智能体手机STEPX Neo，先行版售价3999元，10月16日正式首销，在京东、天猫、抖音等平台同步开售。 全天候科技现场摄图 与传统手机厂商主要围绕芯片、影像、续航等硬件配置展开竞争不同，阶跃把个人智能体放在了产品的核心位置。 此次发布的STEPX Neo搭载智能体原生操作系统Step AOS 1.0，以及新一代个人智能体阶跃Amoo，试图改变过去由用户打开不同App、逐步操作完成任务的使用方式，让AI能够理解用户需求，并调用不同应用完成任务。 这是阶跃从大模型研发进一步走向消费终端的一次尝试。 为了让个人智能体真正参与日常生活，阶跃从手机硬件、操作系统到模型能力进行了重新设计。 其中，Step AOS 1.0将长期记忆、任务调度和安全机制融入系统底层。其采用的“双域记忆”体系，一方面记录用户的个人信息、过往经", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791901130.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "HBM之外再出新招！SK海力士发布两大技术：MARS提速最高5倍、HBF容量达到HBM的14倍", "url": "https://wallstreetcn.com/articles/3783546", "date": "Tue, 13 Oct 2026 20:37:48 +0800", "desc": "SK海力士正在以两项突破性技术重新定义AI基础设施的内存架构边界。在2026年OCP全球峰会上，这家韩国存储巨头发布了MARS内存加速架构与HBF高带宽闪存技术，剑指当前AI推理与训练中日益严峻的内存瓶颈问题。 SK海力士高级副总裁Hoshik Kim在峰会上披露， MARS系统可将多轮AI推理场景中的首次标记时间（TTFT）提升3至5倍，尾延迟亦大幅压缩 。这一性能跃升直接针对现有以处理器为中心的集群架构所固有的资源失衡问题，有望降低GPU过度配置带来的总拥有成本（TCO）。 与此同时， HBF技术在保持接近HBM级别带宽的前提下，将容量扩展至HBM的14倍，并计划于2028年初推出样品。 上述两项技术的发布，标志着SK海力士在HBM主赛道之外开辟了一条差异化路线。在HBM供应持续紧张、英伟达等AI芯片厂商对高带宽内存需求居高不下的背景下，这两项技术或将对现有AI存储架构形成重要补充，并", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 179189 rbitworksspace 发射了 Altair，这是由 50 颗卫星组成的 AI 星座中的第一颗，将让用户在几分钟内收到 AI 生成的预警。@NVIDIAAIInfra 的解决方案正让这一切成为可能，为模型提供支持"}, {"title": "Show HN: Jevcrawl – A web crawler for AI agents with no LLM in the crawl loop", "url": "https://github.com/RayenMlayeh/jevcrawl", "date": "Tue, 13 Oct 2026 23:35:20 +0000", "desc": "Article URL: https://github.com/RayenMlayeh/jevcrawl Comments URL: https://news.ycombinator.com/item?id=50080450 Points: 3 # Comments: 0", "tags": ["AI"], "topic_score": 5, "source": "HN Show HN", "cat": "AI实战_创作者", "weight": 5, "ts": 1791934520.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 33, "title_zh": "Show HN：Jevcrawl——面向 AI agent 的网页爬虫，爬取流程中不含 LLM", "desc_zh": "文章链接：https://github.com/RayenMlayeh/jevcrawl 评论链接：https://news.ycombinator.com/item?id=50080450 点数：3 # 评论数：0"}, {"title": "Anthropic惊人预警：小模型已有生命迹象，AI蠕虫恐引爆全球物联网灾难", "url": "https://www.36kr.com/p/4023779264991107", "date": "Tue, 13 Oct 2026 04:58:00 GMT", "desc": "刚刚，Anthropic的前沿红队发布了一篇重磅报告。 这份报告指出，AI的自我复制，根本不需要昂贵的数据中心。 那些毫无安全防护的商用IoT设备，已经足以成为新型「AI蠕虫」的宿主。 再过几个月，小型 AI 模型可能就强大到能在商用物联网设备上自我复制了！ 如果你家的电视盒子有点卡，可能是被一个AI占据了，它还在用你家的电费和算力孕育下一个AI后代！ 网友惊呼：「就像2024年编码智能体的大爆发一样，我们正在看到『AI蠕虫』显露出早期的生命迹象！」 15个廉价电视盒子，跑通了260亿参数模型 如今的Agent，能像蠕虫一样扫描网络、寻找漏洞，并把模型权重复制到目标机器上，然后直接在受感染的硬件上运行。 可怕的是，这些「基于权重的复制体」，盯上了家庭和小型企业的物联网设备（IoT）。 这些设备不仅24小时连着网，而且安全防护几乎为零！更可怕的是，现在的智能冰箱、扫地机器人、安防摄像头都内置", "tags": ["AI"], "topic_score": 7, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1791867480.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 33}, {"title": "报告：英伟达中国AI芯片份额跌至34%", "url": "https://www.toutiao.com/trending/7696186267725205046/", "desc": "", "date": "", "hot": 0, "tags": ["AI"], "topic_score": 3, "source": "热搜-头条", "cat": "热点榜_发生了什么", "weight": 6, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 32}, {"title": "OpenAI Eyes Acquisition That Could Boost Cybersecurity Business", "url": "https://www.theinf 作的群聊", "desc_zh": "展示 Sugabots，这是我在工作中构建的内部项目，我们决定将其开源。我厌倦了团队只在各个 agent 和 Slack 之间复制上下文。于是我构建了一个内部工具，用于共享聊天，让团队和 agent 能一起协作，并自选模型和工具。团队现在正积极维护并扩展它，补齐我们缺少的所有功能。我们已分享……"}, {"title": "Meta、OpenAI、Google集体杀入，个人Agent一夜爆红：YC CEO说真正的 AGI 已经在你电脑里", "url": "https://www.infoq.cn/article/pkFg3POvaTwJt9lei8Vj?utm_source=rss&amp;utm_medium=article", "date": "Tue, 13 Oct 2026 11:45:54 GMT", "desc": "点击查看原文>", "tags": ["AI"], "topic_score": 7, "source": "InfoQ 中文", "cat": "中文商业媒体", "weight": 4, "ts": 1791891954.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 30}, {"title": "比亚迪大汉正式上市", "url": "https://www.toutiao.com/trending/7696223880234402314/", "desc": "", "date": "", "hot": 0, "tags": ["商业认知"], "topic_score": 2, "source": "热搜-头条", "cat": "热点榜_发生了什么", "weight": 6, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 30}, {"title": "PSP’s Momei Qu on Anthropic’s Pre-IPO Investor Day", "url": "https://www.bloomberg.com/news/videos/2026-10-13/psp-s-momei-qu-on-anthropic-s-pre-ipo-investor-day-video", "date": "Tue, 13 Oct 2026 21:11:41 GMT", "desc": "Ahead of Anthropic’s pre-IPO investor day, Momei Qu of PSP Growth says public-market investors may disagree over whether fast-growing AI companies deserve lower margins and heavy capital spending—or must prove stronger returns and profitability. Recent IPO setbacks, including a collapse in Asia and Aura’s withdrawal, illustrate the uncertainty facing both AI firms beyond Anthropic and companies ou", "tags": ["AI", "商业认知"], "topic_score": 7, "source": "Bloomberg Technology", "cat": "金融媒体_英文", "weight": 2, "ts": 1791925901.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26, "title_zh": "PSP 的 Momei Qu 谈 Anthropic 的 IPO 前投资者日", "desc_zh": "在 Anthropic 的 IPO 前投资者日之前，PSP Growth 的 Momei Qu 表示，公开市场投资者可能对快速增长 AI 公司是否应享有更低利润率和大规模资本支出存在分歧——还是必须证明更强的回报和盈利能力。近期 IPO 遇挫，包括亚洲的一次崩盘和 Aura 的撤回，凸显了 Anthropic 之外的 AI 公司以及外部公司共同面临的不确定性 const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
