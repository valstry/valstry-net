 "desc": "丰田的营业利润恢复增长，但这份回升很大部分来自汇率变化而非经营。 11月5日，丰田公布2026财年（2026年4月-2027年3月）第二财季业绩。2026年7—9月，公司营业利润同比增长34.3%，至约1.13万亿日元（约合人民币476.8亿元）；归母净利润却下降18.5%，至7594亿日元（约合人民币321.1亿元）。公司同时将全年营业利润预期从3.4万亿日元（约合人民币1435亿元）上调至3.9万亿日元（约合人民币1646亿元）。 混动需求强劲和日元走软，是支撑业绩的两股力量，二者的作用并不相同。前者反映产品竞争力，后者则取决于外部市场变化。 丰田披露，本季汇率变动对营业利润的正面贡献达到3400亿日元（约合人民币143亿元），超过营业利润同比增加的2881亿日元（约合人民币122亿元）。按公司披露口径，剔除汇率及掉期等影响后，营业利润同比仅增加100亿日元（约合人民币4.2亿元）。也", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793883642.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "Peloton Forecast Tops Estimates in Sign of Comeback Progress", "url": "https://www.bloomberg.com/news/articles/2026-11-05/peloton-forecast-tops-estimates-in-sign-of-comeback-progress", "date": "Thu, 05 Nov 2026 12:00:38 GMT", "desc": "Peloton Interactive Inc. forecast holiday-quarter revenue that was slightly above Wall Street’s expectations, even as the fitness company projected a year-over-year sales decline and narrower profit margins.", "tags": [], "topic_score": 0, "source": "Bloomberg Technology", "cat": "金融媒体_英文", "weight": 2, "ts": 1793880038.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "一个反共识逻辑：反AI运动不会让需求消失，但留给行业更多时间吸收泡沫", "url": "https://wallstreetcn.com/articles/3785285", "date": "Thu, 05 Nov 2026 19:51:00 +0800", "desc": "美国中期选举的结果，正在给AI产业带来一个意想不到的变量。 民主党在多个关键州取得胜利，部分候选人承诺暂停或收紧数据中心建设审批。随着反数据中心势力悄然崛起，市场开始担忧美国AI基础设施扩张遭遇阻力，全球芯片股巨震，三星电子、SK海力士等企业面临服务器DRAM和高带宽内存需求预期变化的风险。 但科技作者Derek Thompson提出了一个反直觉的观点： 美国日益激烈的反AI政治，短期可能打压AI股票，却有望在中长期帮助整个行业避免泡沫。 Thompson曾在美国《大西洋月刊》（The Atlantic）担任专职撰稿人长达17年，长期关注科技、经济、劳动力市场与社会趋势，也是畅销书《丰裕》（Abundance）的合著者，目前主持播客《Plain English》，并通过个人通讯持续分析美国科技与经济议题。 这一判断的关键，不在于反AI运动会让AI需求消失，而在于它可能改变AI供给扩张的速度", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793879460.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "“大多头”Ed Yardeni：通胀或将降温，5%收益率让十年期美债颇具吸引力", "url": "https://wallstreetcn.com/articles/3785286", "date": "Thu, 05 Nov 2026 19:44:26 +0800", "desc": "美国十年期国债收益率已接近5%，知名华尔街策略师Ed Yardeni认为，这一水平极具吸引力——前提是投资者对生产率驱动通胀降温保持信心。 Yardeni在接受彭博电视采访时表示， \"要在5%的收益率水平买入十年期国债，你需要对生产率将推动通胀下行持相对乐观的态度，而我认为这一判断会成立。\"他直言，当前5%附近的收益率水平\"非常有吸引力\"。 与此同时，他预计未来十年通胀中枢约在2%至2.5%之间，对应的实际回报率同样约为2.5%，他认为这在债券市场中\"实际上相当不错\"。 Yardeni发表上述评论之际，美国国债正连续第二个交易日上涨。推动此轮涨势的是美国中期选举民主党横扫的结果——市场普遍预期，这将对特朗普政府的减税和支出计划形成制衡，从而抑制债券供给扩张的预期。受此提振，美债各期限收益率均至少下行4个基点，十年期基准收益率至4.87%，创9月10日以来最低。 利率回归\"正常化\"，收益率区", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793879066.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "月之暗面发布托管智能体服务，沙箱运行与插件调用单独计费", "url": "https://wallstreetcn.com/articles/3785283", "date": "Thu, 05 Nov 2026 18:46:07 +0800", "desc": "11月5日，月之暗面宣布Kimi Hosted Agents（托管智能体）正式发布，将支撑Agent运行的Harness作为云端托管服务提供给企业和开发者。 开放平台更新日志显示，该服务今年9月已开启Beta，当时面向国内企业认证用户。 定价是此次披露中值得关注的信息。官方定价页显示，托管智能体的费用由云沙箱、模型推理和插件三部分组成，总费用等于沙箱运行时长乘以每小时0.072元，加上模型推理费用，再加插件调用次数与单价的乘积。 按官方定价估算，假设一个云沙箱连续计费30天，运行时长费用约51.84元，不包含模型推理与插件调用费用。不同任务所需的插件种类及调用频次不同，实际费用还需叠加模型推理与插件调用成本。 官方定价页还列出了各类插件的调用单价，价格从每次0.001元至0.45元不等。其中，联网搜索每次0.03元，搜图每次0.045元，部分金融数据插件每次调用收费0.35元或0.45元。", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793875567.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "德国10月车市：零跑追近名爵，中国品牌竞争升温", "url": "https://wallstreetcn.com/articles/3785278", "date": "Thu, 05 Nov 2026 18:01:47 +0800", "desc": "作者 | 周智宇 去年10月，零跑在德国的上牌量只有名爵的三分之一。今年10月，两家只差479辆。 名爵这个月其实卖得不错。德国联邦机动车运输管理局（KBA）11月4日公布的数据显示，10月，上汽旗下名爵在德国上牌4140辆，同比增长近五成。零跑上牌3661辆，接近去年同期的四倍。一年间，名爵在德国乘用车市场的单月份额从约1.1%升至1.6%，零跑从约0.4%升至1.4%。 名爵2021年重返德国，今年头九个月的上牌量就超过了去年全年。前十个月，名爵仍比零跑多上牌近1.2万辆。可翻看KBA前三季度的纯电车注册量，零跑有1.51万辆，名爵只有8520辆。 10月，德国乘用车上牌量同比只涨了1.7%，纯电车却大涨近八成，占到新车的37%。从上牌人看，私人名下的新车比去年同期多了两成，企业等商业用户名下的少了8.2%。 今年5月，德国向符合收入条件的家庭开放电动车补贴申请。只要是今年首次上牌的合", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793872907.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "董宇辉自有品牌今晚开卖，直播机构都在往上游走", "url": "https://wallstreetcn.com/articles/3785277", "date": "Thu, 05 Nov 2026 18:00:18 +0800", "desc": "直播机构做自有品牌已不算新鲜事。这次的不同在于，第一款产品不是大米、纸巾这类容错率较高的标品，而是一块必须全程冷链、保质期以天计的千层蛋糕。 11 月 4 日，董宇辉通过抖音新账号“禾与春时旗舰店”发布视频，宣布与辉同行推出自有品牌“禾与春时”。首款产品为猫山王金枕榴莲千层和纯可可脂巧克力千层，定于 11 月 5 日 20 时在与辉同行直播间首发。 “禾与春时”取自春天的禾苗，按董宇辉在视频里的说法，是随着阳光雨露和时间共同成长的状态。 截至发稿，该账号粉丝已超 70 万。店铺商品仍处于待上架状态，价格、规格和保质期均未公布。 工商信息显示，禾与春时（北京）科技有限公司成立于 2026 年 8 月 9 日，注册资本 1000 万元，法定代表人方成林，由子三省（北京）科技有限公司全资持股，股权穿透后实际控制人为董宇辉。经营范围包括食品销售、食用农产品批发、新鲜水果批发等。 9 月 3 日，公", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793872818.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "丰田与清华合研镍氢储能系统，瞄准火电厂调频", "url": "https://wallstreetcn.com/articles/3785276", "date": "Thu, 05 Nov 2026 18:00:03 +0800", "desc": "作者 | 周智宇 丰田在将自己汽车产业中的能力，运用到更宽阔的能源生态当中。 11月5日，丰田汽车与清华大学联合研发的镍氢电池储能系统在上海举行的第九届中国国际进口博览会上全球首秀。丰田预计，这套设备将从2027年底起用于火电厂，帮助机组调节出力。 丰田为混动车研发镍氢电池近三十年，其快充快放也适合电厂调频。据丰田介绍，此次展出的系统采用水系电解液，支持高倍率充放电。火电机组根据电网频率变化增减出力时，电池可以迅速放电补上缺口，或转为充电吸收多余的电。 这是丰田连续第二年在进博会上首发与中国伙伴合研的储能产品。去年，丰田展出的是与中国五矿合研的SWEEP能量柜，多台柜体可以叠加使用，按客户需要增减储电容量。今年与清华合研的系统，则专门面向需要调节出力的发电企业。对这类用户而言，电池要能在机组接到指令时及时跟上，并在反复充放电后保持稳定输出。 在本届进博会上，丰田还展出了一套面向工厂、数据中", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793872803.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "光大银行的利润拉锯战", "url": "https://wallstreetcn.com/articles/3785274", "date": "Thu, 05 Nov 2026 17:44:42 +0800", "desc": "光大银行等来了收入增长，却还没有等来利润修复。 2026年第三季度，光大实现营业收入314.71亿元，同比增长11%，将前三季度营收增速拉回正区间，同比增长0.29%。但前三季度归母净利润为282.71亿元，同比下降23.63%，在9家A股上市股份行中降幅最大。 这份反差，可以用第三季度的三笔账来解释：营业收入同比增加31.19亿元，业务及管理费减少2.44亿元，信用减值损失却增加了78.47亿元。 多赚的收入和省下的费用，加在一起，也没有覆盖新增的减值支出。 拉长时间看，减值支出的变化，一直牵动着光大的利润表现。 2024年，光大营业收入同比下降7.05%，但信用减值损失减少115.53亿元，综合其他损益和税费变化后，净利润仍同比增长2.03%。到了2026年前三季度，收入恢复增长，信用减值损失却同比增加128.24亿元，增幅达到68.08%，归母净利润随之下降23.63%。 收入下滑时", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793871882.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "人身险预定利率研究值回落1.9%，暂未触及产品调价条件", "url": "https://wallstreetcn.com/articles/3785273", "date": "Thu, 05 Nov 2026 17:43:29 +0800", "desc": "人身险预定利率研究值结束了连续两个季度的上涨，重新回到1.9%。 11月4日，中国保险行业协会发布公告称，人身保险业利率研究专家咨询委员会已于10月30日召开2026年三季度例会，研究提出当前普通型人身保险产品预定利率研究值为1.9%，较二季度的1.94%回落4个基点。 研究值向下，并不意味着保单利率马上就要跟着下调。 当前，在售普通型人身险产品的预定利率上限为2.0%，比最新研究值高出10个基点。按照动态调整机制，只有这一差距达到25个基点及以上，并连续维持两个季度，才需要启动新一轮调整。 换句话说，在现行产品利率上限不变的情况下，研究值需降至1.75%及以下，并连续两个季度满足偏离条件，产品调价才能启动。考虑到后续还有两个月的产品切换期，年内人身险产品不存在因这一机制触发的“降息”窗口。 业内认为，由调价预期衍生的“炒停售”也缺乏依据。 2025年7月，研究值降至1.99%，当时在售普", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793871809.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "见闻历11.11限时大促！随日历附赠千元知识礼包，送什么都不如送“搞钱的智慧”", "url": "https://wallstreetcn.com/articles/3782813", "date": "Thu, 05 Nov 2026 17:08:20 +0800", "desc": "本文来自华尔街见闻，欢迎下载APP查看更多", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793869700.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "Sony Lifts Outlook After Spider-Man and Games Fuel Growth", "url": "https://www.bloomberg.com/news/articles/2026-11-05/sony-lifts-outlook-after-spider-man-and-playstation-fuel-growth", "date": "Thu, 05 Nov 2026 06:39:08 GMT", "desc": "Sony Group Corp. raised its profit outlook after a string of entertainment hits propelled better-than-expected results in the September quarter.", "tags": [], "topic_score": 0, "source": "Bloomberg Technology", "cat": " const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
