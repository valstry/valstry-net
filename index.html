ers/accessibility-statements-now-have-a-home-on-github/", "date": "Thu, 05 Nov 2026 16:00:00 +0000", "desc": "GitHub now highlights ACCESSIBILITY.md files and helps maintainers document accessibility goals, known barriers, supported environments, contributor expectations, and reporting processes. The post Accessibility statements now have a home on GitHub appeared first on The GitHub Blog .", "tags": [], "topic_score": 0, "source": "GitHub Blog", "cat": "AI厂商官方", "weight": 3, "ts": 1793894400.0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 23}, {"title": "如何看待广电总局重申未来将把重点放在扶持真人短剧，以及规范 AI 短剧？这对短剧行业会带来哪些影响？", "url": "https://www.zhihu.com/question/2101979474723960031", "desc": "国家广播电视总局相关负责人 5 日在京重申，关于真人微短剧与 AI 微短剧的关系，总局的态度十分明确：扶持真人剧，规范 AI 剧。当日举行的 2026 中国广播电视精品创作大会微短剧论坛上，这位负责人表示，对微短剧而言，AI 带来的不只是创作环节的降本增效，更是生产方式、产业形态、发展逻辑的系统性变革。从剧本创作到拍摄制作，从传播分发到出海运营，全链条都在重塑，新的创作模式、新的产业生态正在孕育，全行业要善于把握、善于运用，让 AI 当好精品创作的帮手、创新发展的引擎。 (新华社)", "date": "", "hot": 0, "tags": [], "topic_score": 0, "source": "热搜-知乎", "cat": "热点榜_发生了什么", "weight": 5, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 23}, {"title": "如何看待仰望 U9 Xtreme 在阿布扎比开放公路跑出 503.17km/h 这件事？", "url": "https://www.zhihu.com/question/2102058162580935679", "desc": "2026 年 11 月 1 日，仰望 U9 Xtreme 在阿联酋阿布扎比 E11 公路跑出了 503.17km/h，吉尼斯世界纪录认证的类别是「量产汽车单方向行驶最高速度」，同时称经过 FIA 验证。车手是 Marc Basseng，动力参数是四电机 3019 马力、全域 1200V 平台、极速轮胎由佳通定制。 想听听大家怎么看待这个 503km/h。不一定要站「牛逼」或「不算」的队，更想看到把它放在极速纪录的真实规则和技术语境里拆开看。", "date": "", "hot": 0, "tags": [], "topic_score": 0, "source": "热搜-知乎", "cat": "热点榜_发生了什么", "weight": 5, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 23}, {"title": "我让老公把一盘土豆丝倒女儿碗里，她气的把筷子摔了，还向我爆粗口，我教训了她一顿，我做错了吗？", "url": "https://www.zhihu.com/question/1926739737244305304", "desc": "今天晚上吃着饭，女儿说肩疼，我就让老公吃完饭带她出去走走，因为她天天不活动身体就会这里疼那里疼。然后她平时吃菜少，今天还吃方便面这种没营养的东西，我就让老公把一盘土豆丝倒她碗里，结果她直接把筷子摔了，并向我爆粗口，我气的说以后不管她了，吃的喝的和学费也让她自己挣，让她从这个家里滚出去 "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "谷歌视频新模型双榜第一，力压Grok、Seedance，价格再砍三成", "url": "https://www.36kr.com/p/4057626189534338", "date": "Fri, 06 Nov 2026 01:54:49 GMT", "desc": "智东西11月6日报道，今天，谷歌DeepMind正式推出新一代视频生成与编辑模型 Gemini Omni 1.2 Flash 。这一新模型带来三大核心升级：原生15秒视频生成、多轮对话式编辑、更强的参考图遵循能力。 同时Gemini Omni 1.2 Flash价格较上一代Omni 1.1 Flash直降30%， 720p视频生成价格降至每秒0.07美元（约合人民币0.46元） ,仅为Seedance 2.5生成同等质量视频价格的不到1/3。 在大模型竞技场上，Gemini Omni 1.2 Flash在文生视频和图生视频两个榜单上都拿下 第一 的成绩，并在视频编辑榜单拿下 第三 的成绩，超过FLUX3 Video、Grok Imagine Video 1.5、Seedance 2.0、Seedance 2.5等模型。 Gemini Omni是谷歌在Veo视频生成模型之外开辟的一条新产品线", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1793930089.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "猎奇，为什么成为了沃尔玛的打法", "url": "https://www.36kr.com/p/4056833146295170", "date": "Fri, 06 Nov 2026 01:13:23 GMT", "desc": "零售商是否能抢先建立开发有竞争力新品的系统，并且尽快扩大渠道，就成为了下一步致胜关键。 “沃集鲜的研发部到底从哪儿找的巫师？”在深圳上班的白领小南，平时的日常兴趣就是下班逛超市买点小零食犒劳自己，比如家附近的沃尔玛或者超盒算，偶尔再去趟华润的ole。 最近几个月，她发现，沃尔玛的自有品牌沃集鲜不断推出的新产品，有一些口味的猎奇程度，让人瞳孔地震。 苹果鸡肉肠、苦瓜火腿肠、菠萝火腿肠，只能算是一些咸甜搭配的开胃菜。号称使用了使用了鲜榨葡萄汁和面的“坚果四脆川味葡萄凉面”、使用了刺梨原汁的“刺梨黄皮糍粑辣子鸡拌面”，就让人完全想象不到该是什么味道。与之相比，天麻炖鸽子味的薯片，反而还让人觉得，似乎有点滋补？ “好像把世界上所有食物排列组合都列了出来，然后随机选择了几十种生成到了沃尔玛”，小南震惊，小南不解，但是她觉得“这个氛围好魔性”，“反而让人想去看看今天又有什么幺蛾子”。 不过她也很好奇，", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1793927603.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "不拼外卖的京东，才是大家都爱的好京东", "url": "https://www.36kr.com/p/4057559909046153", "date": "Fri, 06 Nov 2026 00:52:21 GMT", "desc": "11月4日，第一财经、红星资本局等媒体确认，京东本地生活业务负责人郭庆（老K）因个人原因离职。此时距离他以CEO顾问身份加入京东，过去了两年零十个月，距离京东外卖正式上线那场轰动全国的“外卖大战”，仅过去一年零九个月。 郭庆2014年加入美团，一手推动酒旅业务，2020年进入美团最高决策机构S-team，2021年离职。京东请他来用意很明晰，把美团那套打本地生活的组织能力和战争经验，移植到京东的即时零售版图上。 京东外卖正式上线后，以“免佣”“五险一金”“百亿补贴”三板斧切入，日单量在四个月内冲到2500万单，一度占据全国外卖市场约31%的份额，那是京东本地生活最接近“改变格局”的时刻。 但后来的故事我们都知道了，用补贴买来的份额，和用效率挣来的份额， om/2026/sharp-tech-on-video-the-u-s-votes-on-data-centers-implications-for-big-tech-googles-response-to-ai/", "date": "Fri, 06 Nov 2026 11:00:00 +0000", "desc": "Sharp Tech is, for the first time, available on video. You have two ways to consume it: YouTube, and here on Stratechery", "tags": [], "topic_score": 0, "source": "Stratechery", "cat": "创投行业分析", "weight": 2, "ts": 1793962800.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "特斯拉宣布终止Cybertruck生产，马斯克将资源转向机器人与AI赛道", "url": "https://wallstreetcn.com/articles/3785379", "date": "Fri, 06 Nov 2026 18:31:26 +0800", "desc": "特斯拉决定停产旗下标志性电动皮卡Cybertruck，这款曾被马斯克寄予厚望的产品在销量疲软与多次召回的双重压力下黯然落幕。 马斯克周五在X平台发文称， 特斯拉将于明年年中左右在德克萨斯超级工厂逐步\"收尾\"Cybertruck的生产，转而扩大自动驾驶出租车Cybercab的产能。 Cybertruck的首席工程师Wes Morrill随即在社交媒体上表示： \"Cybertruck是一个了不起的技术开发平台，它的生命将通过Cybercab延续下去。\" 此次停产对特斯拉及其投资者而言意义重大。自美国中期选举共和党遭遇重挫以来，特斯拉股价已累计下跌15%。与此同时，马斯克正推动公司全面转型，聚焦AI人形机器人\"Optimus\"、Cybercab以及电动重卡Semi Truck三条核心业务线，以应对传统电动车业务压力。 销量惨淡，产品折戟 Cybertruck的商业表现远未达到马斯克最初的预期。马", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793961086.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "机器人拟实施“一机一码”，标识码申请量一般不超上年产量3倍", "url": "https://wallstreetcn.com/articles/3785378", "date": "Fri, 06 Nov 2026 18:27:02 +0800", "desc": "11月5日，工业和信息化部（以下简称：工信部）装备工业一司就《机器人产品标识码管理暂行办法（征求意见稿）》公开征求意见，公示期为11月6日至12月5日。 征求意见稿拟对境内生产制造的机器人整机产品建立统一的“身份证”，实行“一机一码”，公示所列的制定目的为规范机器人产品生产制造、支撑机器人行业安全治理。 征求意见稿第二条把适用范围写为在中华人民共和国境内生产制造的机器人整机产品，包括不同结构和形态的工业机器人、服务机器人和特种机器人等，未单列人形机器人。 标识码由机器人制造商代码、产品说明代码、产品顺序号代码和其他代码四部分组成，编码、赋码应当执行GB/T 48541-2026《机器人产品标识码》等相关国家标准。该国标于10月30日发布，2027年2月1日实施。 按征求意见稿的流程设计，工信部指导开展标识码管理，可委托第三方机构作为技术支撑机构搭建标识码服务平台，办理注册、编码、赋码、备案", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793960822.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "新能源接棒前，神龙先打燃油车保 });
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
