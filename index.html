": "Anthropic在启动IPO路演当天密集推出一系列企业办公工具，覆盖视频会议、电子表格、团队白板和企业数据分析等场景。在首次公开募股进入关键阶段之际，这家公司进一步展示了Claude在基础模型之外的企业应用布局，试图向投资者证明其商业化潜力不只来自AI模型本身，也来自对企业办公市场的持续渗透。 美东时间10日周二，Anthropic发布三项新工具：能够实时加入视频会议并执行任务的Claude Meetings、支持团队共同编辑的Claude Whiteboards，以及可由AI创建和修改的Claude Sheets。此外，原名Claude Dashboards的数据分析产品正式更名为Claude Data并全面推出，Anthropic还扩展了与Adobe、Atlassian、Box、Notion等应用的交互式连接器。 这些新功能试图让Claude不再只是回答问题、生成文本的聊天机器人，而", "tags": ["AI", "商业认知"], "topic_score": 7, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1794345115.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "Anthropic路演瞄准35%长期经营利润目标，算力效率提高逾4倍，大企业客户1.19万", "url": "https://wallstreetcn.com/articles/3785675", "date": "Wed, 11 Nov 2026 05:10:31 +0800", "desc": "在美东时间10日周二公布的IPO路演视频中，Anthropic披露长期盈利目标：公司相信，随着算力效率提升、直接采购和租赁算力的比例增加，以及推理业务占比扩大，长期调整后经营利润率有望达到35%以上，较今年第三季度的15%提高20个百分点以上。 除了这一长期盈利目标，Anthropic此次路演还通过招股书公布了多项此前未集中披露的经营数据：截至第三季度，公司营收达到170亿美元，同比增长超过12倍；过去12个月营收达到10万美元以上的企业客户超过1.19万家，同样同比增长超过12倍；算力效率较2025年第一季度提高超过4倍。Anthropic还披露，截至今年10月末，年化营收达到约810亿美元。 路演材料同时展示了礼来、乐天、Salesforce、沃尔玛等大企业客户的应用案例，试图证明Claude正在从编程工具扩展至科研、法律服务、企业运营和零售等场景。 这意味着，Anthropic正试图", "tags": ["AI", "企业落地", "商业认知"], "topic_score": 15, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1794345031.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "Anthropic IPO定价在即：高盛预测2030年营收破6850亿，7位创始人IPO套现17.5亿美元", "url": "https://wallstreetcn.com/articles/3785677", "date": "Wed, 11 Nov 2026 05:10:19 +0800", "desc": "Anthropic正以史上最具野心的IPO姿态叩响资本市场大门，而其主承销行高盛的预测模型为这场盛宴提供了最强力的背书。 11月10日，据彭博社援引知情人士透露， 高盛研究团队预测Anthropic到2030年营收将达约6850亿美元，较该公司2025年的46亿美元增长逾130倍 。 与此同时 华尔街见闻提及 ，Anthropic已启动IPO路演，寻求以约1.4万亿美元的完全稀释后估值完成融资，计划于11月18日（周三）定价，次日开始交易。 承销银行周二上午已开始与潜在投资者举行会议，推介这笔目标融资规模达904亿美元（含260亿美元私募配售）的IPO。 公司七位联合创始人将在此次发行中合计套现17.5亿美元，各自出售约2.5亿美元股份，占各自持股比例约1.5%。 这份增长预测折射出市场对AI技术改造经济潜力的高度乐观，但也令投资者面临一道核心抉择：当前的AI估值究竟反映的是可信赖的增长轨", "tags": ["AI", "商业认知"], "topic_score": 6 al funding to the board. The board also reached a new record of 1,900 private companies last month, along with a new record for the U.S. with more than 1,000 private unicorn companies.", "tags": [], "topic_score": 0, "source": "Crunchbase 融资板块", "cat": "创投行业分析", "weight": 5, "ts": 1794312034.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21, "title_zh": "Crunchbase 独角兽榜单 10 月突破 1,900 家公司，34 家新加入——其中一半成立不足 4 年", "desc_zh": "10 月共有 34 家公司加入 Crunchbase 独角兽榜单，为榜单增加逾 960 亿美元价值和 148 亿美元总融资。上月榜单还创下 1,900 家私营公司的新纪录，美国也创下超过 1,000 家私营独角兽公司的新纪录。"}, {"title": "Startup Founders Are Using AI To File Patents. Here’s Where DIY Becomes A Liability.", "url": "https://news.crunchbase.com/ai/startup-founder-diy-patents-legal-liabiity-drapkin-mutter-landfall/", "date": "Tue, 10 Nov 2026 12:00:16 +0000", "desc": "AI can help startups reduce patent preparation costs, but DIY applications may overlook critical issues. In this guest commentary, attorneys Michael Drapkin and Nathan Mutter of AI-Native law firm Landfall IP, argue that combining AI with legal expertise can produce more efficient, commercially valuable patent protection that withstands investor scrutiny and is harder for competitors to circumvent", "tags": [], "topic_score": 0, "source": "Crunchbase 融资板块", "cat": "创投行业分析", "weight": 5, "ts": 1794312016.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21, "title_zh": "初创公司创始人正用 AI 提交专利申请。以下是 DIY 何时变成隐患。", "desc_zh": "AI 能帮助初创公司降低专利准备成本，但 DIY 申请可能忽略关键问题。在这篇客座评论中，AI-Native 律所 Landfall IP 的律师 Michael Drapkin 和 Nathan Mutter 认为，将 AI 与法律专业经验结合，可以带来更高效、更具商业价值的专利保护，既能经受投资者审查，也更难被竞争对手规避。"}, {"title": "豆包的馅儿，是抖音商城", "url": "https://www.36kr.com/p/4063607098364802", "date": "Tue, 10 Nov 2026 08:17:10 GMT", "desc": "双11尾声将至， 豆包 终于戳破和抖音之间那层薄薄的窗户纸了。 近日，字母榜发现， 豆包 开始根据用户喜好主动推荐商品了。 进入“双11问 豆包 ”入口后，页面不再以预设问题为主，而是升级为了基于用户喜好的商品推荐，商品以双列的形式出现，和抖音内商城模式相同，还出现了直播间推荐。 简单来说， 豆包 开始主动推荐商品，并且给了商城二级入口， 相当于把抖音商城搬到了 豆包 里。 此前，字母榜曾 定价继续走高，涨幅足以抵消成本上升。\n\n按当前定价水平，2027年的续约将带来接近40亿美元的增量年化收入，且无需追加资本开支。\n\n2028年的需求量是可用产能的数倍。\n\n到2027年底，合格需求是可用产能的10倍。\n\n基于已完全取得许可场地的在建工程，我们认为2027年的交付不存在重大风险。\n\n资本开支指引上调，是因为我们预计将比计划更早部署基础设施并向客户交付。\n\n“我们不是一门不惜代价求增长的业务。但当下的环境，对那些拥有差异化技术需求、并且能执行落地的公司而言非常有利可图。”", "url": "https://wallstreetcn.com/livenews/3197962", "desc": "", "date": "", "hot": 0, "tags": ["企业落地"], "topic_score": 7, "source": "华尔街见闻快讯", "cat": "中文科技财经", "weight": 3, "ts": 0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": true, "rank": 21}, {"title": "费城联储主席Paulson支持渐进加息，但警告通胀仍“卡在”目标上方", "url": "https://wallstreetcn.com/articles/3785690", "date": "Wed, 11 Nov 2026 08:29:39 +0800", "desc": "2026年FOMC票委、费城联储主席Anna Paulson周二（11月10日）表态支持渐进式加息路径，但同时发出明确警告：核心通胀持续高于2%目标且未见回落，关税、能源成本上升及数据中心建设热潮均构成持续价格压力。与此同时，多位美联储官员同日发表鹰派言论，就12月会议的加息幅度释放出更强硬信号，美联储内部围绕加息节奏的分歧正在浮出水面。 当日公布的10月通胀数据为这场争论提供了新的注脚。 华尔街见闻文章 写道，美国劳工统计局最新公布的数据显示，剔除食品和能源的核心CPI环比上涨0.3%，超出市场预期。对此，Paulson表示，这份报告表明价格压力“仍然非常真实”，核心通胀指标已“卡在”2.5%至3%之间。美联储上月以10比2的投票结果决定暂停加息，将基准利率维持在3.75%至4%的目标区间，此前9月曾一致投票加息25个基点。 在渐进派与鹰派之间，当日美联储官员的表态呈现出明显分化。 美联", "tags": ["资本市场"], "topic_score": 3, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1794356979.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "江苏扬州发生3.9级地震，中国地震局启动四级应急响应。据中国地震台网正式测定：2026年11月11日6时15分，在江苏扬州市江都区（北纬32.62度，东经119.60度）发生3...", "url": "https://www.huxiu.com/moment/1295783.html", "date": "Wed, 11 Nov 2026 00:18:20 GMT", "desc": "江苏扬州发生3.9级地震，中国地震局启动四级应急响应。 据中国地震台网正式测定：2026年11月11日6时15分，在江苏扬州市江都区（北纬32.62度，东经119.60度）发生3.9级地震，震源深度20公里。 地震发生后，中国地震局迅速启动四级应急响应，调度中国地震台网中心、江苏省地震局开展应急处置工作，要求有关单位开展联合会商，加强震情监测和震后趋势研判，及时报告有关情况。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1794356300.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "3名男子在电竞酒店预订12间客房，不让保洁人员入房打扫，偷走28台电脑主机后担心败露长期续租，辽宁警方：已被采取刑事强制措施。3名男子因手头拮据盯上了电竞酒...", "url": "https://www.huxiu.com/moment/ 794353794.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "贾国龙夫妇质押西贝股权。近日，据国家企业信用信息公示系统显示，内蒙古西贝餐饮集团有限公司新增1条股权出质信息。西贝餐饮集团法定代表人、董事长贾国龙将其...", "url": "https://www.huxiu.com/moment/1295770.html", "date": "Tue, 10 Nov 2026 23:32:37 GMT", "desc": "贾国龙夫妇质押西贝股权。 近日，据国家企业信用信息公示系统显示，内蒙古西贝餐饮集团有限公司新增1条股权出质信息。西贝餐饮集团法定代表人、董事长贾国龙将其直接持有的公司股权，全部质押给上海浦东发展银行北京分行，出质股权数额为2660.4027万元。工商信息显示，今年9月2日，贾国龙妻子张丽平也已将其直接持有的西贝餐饮集团全部股权质押给中国工商银行股份有限公司呼和浩特如意开发区支行，出质股权数额为540.0005万元。据计算，贾国龙夫妇出质股权数额，合计超3200万元。 一般来说，企业高管股权质押，属于其个人融资行为，与公司的经营状况没有直接相关，不能以此直接判断公司经营状况的好坏。质押股权获得的资金，高管可能用于个人及家庭消费、投资、偿还债务，以及公司经营、项目并购等用途。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1794353557.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "第一批新车次列车车票，今起陆续发售。全国铁路列车车次编排改革顺利推进，11月25日0时起始发开的普速旅客列车、11月24日18时起始发开的货物列车将正式使用新车...", "url": "https://www.huxiu.com/moment/1295769.html", "date": "Tue, 10 Nov 2026 23:31:57 GMT", "desc": "第一批新车次列车车票，今起陆续发售。 全国铁路列车车次编排改革顺利推进，11月25日0时起始发开的普速旅客列车、11月24日18时起始发开的货物列车将正式使用新车次，第一批新车次列车车票今日起陆续发售。动车组列车车次此次变更暂时保持不变，将于12月下旬实施变更。 按2026版《列车车次编排规定》，普速旅客列车使用Z、N、V字头：Z为最高时速160公里快速列车（Z1-Z1998），N为最高时速140公里快速列车（N1-N1998），V为最高时速120公里普速列车，其中快速为V1-V5998、普通快车为V6001-V6998、普通慢车为V7001-V7998；货物列车货运班列车次字母由“X”全部改为“B”，其他货物列车仍采用无字头字母编排。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1794353517.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "国家安全部提醒“双十一”购物安全。国家安全部微信公众号发文，又是一年双十一，购物车里装满期待，快递车里满载包裹。快递业一头连着生产，一头连着消费，一件...", "url": "https://www.huxiu.com/moment/1295764.html", "date": "Tue, 10 Nov 2026 23:01:53 GMT", "desc": "国家安全部提醒“双十一”购物安全。 国家安全部微信公众号发文，又是一年双十一，购物车里装满期待，快递车里满载包裹。快递业一头连着生产，一头连着消费，一件件包裹翻山越岭、奔赴城乡，见证经济脉动，也便利千家万户。在“开箱”的快乐背后，一些容易被忽视的安全细节同样值得留意。小小包裹虽不起眼，但从下单、运输到签收、处置，每个环节都可能附着个人信息。个别环节的疏忽大意，就可能给不法分子留下可乘之机。快递承载的姓名、住址、联系方式等个人隐私信息，若未加防护而造成泄露，可能衍生一定安全风险。", "tags": [], "topic_scor , "date": "Tue, 10 Nov 2026 00:00:00 -0500", "desc": "arXiv:2611.09768v1 Announce Type: new Abstract: Large language model (LLM) agents coordinate through conversation, and the same message can be phrased in simpler or more complex language, bluntly or politely. We test whether such differences change how other agents judge and act, using the LURK Werewolf framework, which separates each utterance's speech-act predicate from its natural-language real", "tags": ["AI", "商业认知", "资本市场"], "topic_score": 11, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1794286800.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27, "title_zh": "语言作为特征，礼貌作为策略：LLM 社交推理代理中语言效应的受控测试", "desc_zh": "arXiv:2611.09768v1 公告类型：新论文 摘要：大语言模型（LLM）代理通过对话协调，同一信息可以用更简单或更复杂的语言、直白或礼貌的方式表达。我们使用 LURK Werewolf 框架测试这种差异是否会改变其他代理的判断和行动，该框架将每句话的言语行为谓词与其自然语言表达分离。"}, {"title": "Anthropic 发布 IPO 路演视频正式启动最高 643.5 亿美元募资计划，估值约在 1~1.4 万亿美元", "url": "https://www.ithome.com/1/025/209.htm", "desc": "", "date": "", "hot": 0, "tags": ["AI", "商业认知", "资本市场"], "topic_score": 6, "source": "IT之家", "cat": "中文科技财经", "weight": 4, "ts": 0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": true, "rank": 24}, {"title": "Federal Reserve Board announces approval of two applications by Mutual Federal Bancorp, MHC, and MFB Bancorp, Inc.", "url": "<![CDATA[https://www.federalreserve.gov/newsevents/pressreleases/orders20261109a.htm]]>", "date": "Mon, 9 Nov 2026 21:00:00 GMT", "desc": "Federal Reserve Board announces approval of two applications by Mutual Federal Bancorp, MHC, and MFB Bancorp, Inc.", "tags": ["资本市场"], "topic_score": 3, "source": "美联储 新闻稿", "cat": "宏观监管", "weight": 4, "ts": 1794258000.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 22, "title_zh": "美联储理事会宣布批准 Mutual Federal Bancorp, MHC 和 MFB Bancorp, Inc. 的两项申请。", "desc_zh": "美联储理事会宣布批准 Mutual Federal Bancorp, MHC 和 MFB Bancorp, Inc. 的两项申请。"}, {"title": "Anthr unch", "cat": "科技新闻", "weight": 4, "ts": 1794340672.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 30, "title_zh": "Anthropic 全部7位创始人将在IPO中各套现约2.5亿美元", "desc_zh": "七位联合创始人每人都计划在IPO中出售完全相同数量的股份，按发行价区间中值计算，每人将获得约2.5亿美元现金，同时该群体仍保持对公司的控制。"}, {"title": "Show HN: Cloakroom – Keeps secrets away from agents", "url": "https://github.com/shanjeevrajendran/cloakroom", "date": "Tue, 10 Nov 2026 20:39:46 +0000", "desc": "Cloakroom is an open-source privacy tool that masks secrets and sensitive data from AI agents. It swaps real values for placeholders, then swaps them back to the originals locally. I was trying to build a full on local LLM setup on my machine, but the local models were not up to the mark (at least, not yet). I ended up building a hybrid setup, with the cloud for planning and local models for execu", "tags": ["AI"], "topic_score": 4, "source": "HN Show HN", "cat": "AI实战_创作者", "weight": 5, "ts": 1794343186.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 31, "title_zh": "Show HN：Cloakroom——让机密远离智能体", "desc_zh": "Cloakroom 是一款开源隐私工具，可对AI智能体隐藏机密和敏感数据。它用占位符替换真实值，再在本地将其换回原值。我曾尝试在本机构建完整的本地LLM环境，但本地模型尚未达到要求。最终我构建了混合方案：云端负责规划，本地模型负责执行……"}, {"title": "曝平头哥估值200亿至300亿美元", "url": "https://s.weibo.com/weibo?q=%23%E6%9B%9D%E5%B9%B3%E5%A4%B4%E5%93%A5%E4%BC%B0%E5%80%BC200%E4%BA%BF%E8%87%B3300%E4%BA%BF%E7%BE%8E%E5%85%83%23&t=31&band_rank=15&Refer=top", "desc": "", "date": "", "hot": 0, "tags": ["资本市场"], "topic_score": 2, "source": "热搜-微博", "cat": "热点榜_发生了什么", "weight": 6, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 30}, {"title": "Anthropic Sets Lower than Expected Valuation, Seeks to Raise $90 Billion in IPO", "url": "https://www.theinformation.com/briefings/anthropic-sets-lower-expected-valuation-seeks-raise-64-billion-ipo", "date": "2026-11-10T21:57:55Z", "desc": "", "tags": ["AI", "商业认知", "资本市场"], "topic_score": 7, "source": "The Information", "c const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
