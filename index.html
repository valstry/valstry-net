versation", "url": "https://claude.com/blog/projects-redesigned", "date": "Wed, 16 Sep 2026 16:00:00 GMT", "desc": "Managing multiple sessions across a build used to require you to divide the work, juggle handoffs, and stitch the results back together. Now in a Claude Code project, you describe what needs to get done and Claude manages the work. Claude scopes the request, delegates the work, coordinates parallel threads, reviews the outputs, and assembles the finished result. You can steer progress throughout, ", "tags": [], "topic_score": 0, "source": "Claude 官方博客", "cat": "AI厂商官方", "weight": 6, "ts": 1789574400.0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 30}, {"title": "Your Agent Aced the Task. Will It Do It Again?", "url": "https://huggingface.co/blog/ibm-research/altk-evolve-consistency", "date": "Tue, 15 Sep 2026 16:00:44 GMT", "desc": "", "tags": ["AI"], "topic_score": 3, "source": "HuggingFace Blog", "cat": "AI厂商官方", "weight": 4, "ts": 1789488044.0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 30}, {"title": "Claude Cowork and chat are now one Claude", "url": "https://claude.com/blog/cowork-is-now-claude", "date": "Tue, 15 Sep 2026 16:00:00 GMT", "desc": "Starting today, Claude Cowork and chat are merging into one Claude. Bring a quick question, or hand over a report due at noon, and Claude takes it from there, even after you’ve closed your laptop. It’s rolling out on Pro and Max plans over the next few weeks, with more plans to follow. What Claude makes doesn’t need its own place either. Claude Docs and Claude Slides are new today, and Claude Desi", "tags": [], "topic_score": 0, "source": "Claude 官方博客", "cat": "AI厂商官方", "weight": 6, "ts": 1789488000.0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 30}, {"title": "Show HN: Praxos – Multiplayer AI", "url": "https://www.praxos.ai/", "date": "Mon, 21 Sep 2026 21:40:19 +0000", "desc": "Hey H 档：https://vernllm.dev/docs/core/provider-fallback 评论链接：https://news.ycombinator.com/item?id=49791930 点数：2 # 评论数：0"}, {"title": "刚刚，GPT-6 Astra取得哥德巴赫猜想重大突破", "url": "https://www.36kr.com/p/3992525310802946", "date": "Mon, 21 Sep 2026 02:29:50 GMT", "desc": "数学界重大突破！ 就在最近，GPT-6 Astra又在哥德巴赫猜想上取得新进展了。 网友Captain Sude宣布：Astra已成功证明了关于刘维尔函数的一项类哥德巴赫猜想！ 具体来说，它无条件证明了哥德巴赫猜想的Liouville弱形式。 更惊人的是，跟我们的想象不同，这一次，Astra并不只是靠着大力出奇迹的算力碾压——它做出l非常优雅的逻辑推理。 并且，这个证明现在已经通过了Lean 4的形式化验证。 摘不下的明珠 在这之前，哥德巴赫猜想这个幽灵，已经折磨了人类数学家近三个世纪。 1742年，哥德巴赫在欧拉的信中提出这个猜想：「任一大于2的偶数，都可以写成两个素数之和。」 为了它，无数人耗尽心血。从哈代、李特尔伍德，到陈景润证明「1+2」，人类始终无法皇冠上的明珠——「1+1」。 这是因为，素数的分布太诡异了！ 既然死磕行不通，数学家们脑洞大开，搞出一套「替身文学」——刘维尔版本的", "tags": ["AI"], "topic_score": 4, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1789957790.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 29}, {"title": "刚刚，Opus 5.5跨级偷袭，直扑GPT-6", "url": "https://www.36kr.com/p/3992388093508356", "date": "Mon, 21 Sep 2026 00:47:49 GMT", "desc": "Anthropic这回，怕不是憋了个大的？ 所有人都在等Opus 5.2，结果最新线报来了： 下一代版本号直接飙到5.5！ 今天一早，开发者Lyra扒出猛料，代号为「claude-wafer-eap」的Claude Opus 5.5已经在偷偷内测了。 据说动作快的话，这周二就会突然砸出来。 摆明了，Opus 5.5就是冲着GPT-6去的，据传性能直接把Astra踩在脚下。 更狠的是跟着曝光的定价单：百万Token输入只要4美元，百万Token输出20美元。 这还没完，他们顺手还亮了另一张王牌，Claude Fable 5.2也在暗中铺路。 就在两天前，外媒爆出，A/在IPO之前必须扔个重磅模型出来，重新稳住市场信心。 现在看，这两张底牌一掀，好戏才刚开场。 Claude连跳两级直升5.5 或暴击GPT-6 Astra 如今，GPT-6还没捂热，Anthropic一刀就要砍过来了。 而这一切", "tags": ["AI"], "topic_score": 4, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1789951669.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 29}, {"title": "RT Ghita: For all Jev users: FYI zerank-2 is a 4B open-source reranker that also returns a confidence score, and you can simply set a threshold value ...", "url": "https://x.com/huggingface/status/2102068451531510189", "date": "Sun, 20 Sep 2026 22:19:56 GMT", "desc": "RT Ghita For all Jev users: FYI zerank-2 is a 4B open-source reranker that also returns a confidence score, and you can simply set r": false, "always_fresh": false, "rank": 26}, {"title": "OpenAI和Anthropic营收面临威胁：成本压力下，更多AI初创企业转向开源模型", "url": "https://wallstreetcn.com/articles/3782247", "date": "Tue, 22 Sep 2026 04:20:16 +0800", "desc": "法律AI独角兽Harvey今年毛利率一度跌至-50%，成为一个缩影—— 随着OpenAI和Anthropic的API费用持续攀升，越来越多的AI应用初创企业开始拥抱开源权重模型 ，重夺成本控制权。 这一趋势正在加速。 Harvey、Abridge、Decagon、Ramp等横跨法律、医疗、金融和客服赛道的初创企业，相继宣布自研或定制模型的计划，部分企业已将八成流量切换至自有模型。 Sequoia Capital和General Catalyst等头部投资机构亦在背后助推。 此举对OpenAI和Anthropic构成直接压力。两家公司正各自筹备备受期待的IPO，而应用层客户的外流可能蚕食其最重要的收入来源。 毛利率跳水，倒逼Harvey重构模型策略 Harvey的处境最能说明问题。 这家估值156亿美元的法律AI初创企业，长期将OpenAI的GPT-4作为其产品核心。据彭博，今年3月该公司A", "tags": ["AI"], "topic_score": 8, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790022016.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "Meta’s AI agent has been blocked from using Amazon.com", "url": "https://techcrunch.com/2026/09/21/metas-ai-agent-has-been-blocked-from-using-amazon-com/", "date": "Mon, 21 Sep 2026 17:55:18 +0000", "desc": "Amazon has its own cohort of foundation models, along with one of the most popular inference platforms on the internet. As long as they're under no legal obligation to open the doors to Muse, why would they?", "tags": ["AI"], "topic_score": 4, "source": "TechCrunch", "cat": "科技新闻", "weight": 4, "ts": 1790013318.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26, "title_zh": "Meta 的 AI agent 已被禁止使用 Amazon.com", "desc_zh": "Amazon 有自己的基础模型阵营，还有互联网上最受欢迎的推理平台之一。只要他们没有法律义务向 Muse 敞开大门，他们为什么要这么做？"}, {"title": "《2026年中国人工智能计算力发展评估报告》发布，智能体重塑算力基础设施，智能算力规模预计增长87.9%", "url": "https://www.infoq.cn/article/vA7opkWL5WYlwYcPIdds?utm_source=rss&amp;utm_medium=article", "date": "Mon, 21 Sep 2026 17:07:01 GMT", "desc": "点击查看原文>", "tags": ["AI"], "topic_score": 4, "source": "InfoQ 中文", "cat": "中文商业媒体", "weight": 4, "ts": 1790010421.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "国产数据库 ways_fresh": false, "rank": 21}, {"title": "Potential-Field Action Representation for Reinforcement Learning in Contact-Rich Manipulation", "url": "https://arxiv.org/abs/2609.21609", "date": "Mon, 21 Sep 2026 00:00:00 -0400", "desc": "arXiv:2609.21609v1 Announce Type: cross Abstract: Model-free reinforcement learning can acquire contact-rich robotic manipulation skills through trial-and-error interaction, but it often requires the policy to learn both task strategy and low-level motion generation. In this setting, the action representation is critical because it determines how policy outputs are converted into robot motion, sha", "tags": ["个人成长"], "topic_score": 3, "source": "arXiv cs.AI", "cat": "AI技术前沿", "weight": 3, "ts": 1789963200.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "“金融男都开始穿运动鞋上班了，谁还买皮鞋啊?”", "url": "https://www.36kr.com/p/3992585113664519", "date": "Mon, 21 Sep 2026 03:35:43 GMT", "desc": "章昊有三双皮鞋，其中的 两双平时放在公司。只有需要见正式客户的时候，他才会穿上。“跟别人放工位上的洞洞鞋差不多。” 作为证券分析员，他在办公室穿的主要还是运动鞋。 几年前，对于刚进入金融行业的年轻人来说，皮鞋、西裤、衬衫还曾经是默认的职场三件套。如今，运动鞋已经可以和它们出现在同一个办公室里，甚至成为更多人的日常选择。 前段时间，#中国男人正在抛弃皮鞋#的话题登上各大平台热搜。话题起因，是以男士皮鞋起家的奥康国际2025年男鞋营业收入约11.44亿元，同比下降了27%。不只是奥康，红蜻蜓等多家传统皮鞋品牌近年来的皮鞋销量都不算乐观。红蜻蜓在2026年半年度报里提及，传统皮鞋消费需求疲软，正加大对小白鞋、板鞋、勃肯鞋、老爹鞋的研发与营销投入。 国外许多传统鞋服品牌同样陷入了相似的困境，譬如荷兰老牌家族鞋企Van Lier，运动鞋过去只占其收入的10%，但到了2024年三季度，运动鞋的营收占比", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1789961743.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "Jev，让全球程序员玩疯了", "url": "https://www.36kr.com/p/3992555295505410", "date": "Mon, 21 Sep 2026 03:07:12 GMT", "desc": "智能家居社区 Home Assistant 最近出现了一个名为 HA-Jev 的插件。 它的逻辑极其简单，传感器读取洗衣机的功率变化与洗衣房门的状态，然后抛出一个问题给模型，「洗衣机洗完了，衣服是不是被忘在里面了？」模型不输出任何文字分析，只返回一个概率值。当置信度超过 0.8 时，手机就会弹出一则取衣提醒。 HA-Jev 仅仅用来提醒用户洗完的衣服是不是还留在洗衣机里｜图片来源：pitchhut 一次判断耗时几十毫秒，花费 0.000015 美元 。 插件开发者在论坛里留下一句意味深长的话，「我过去一直在用大语言模型回答根本不需要它的问题。衣服忘没忘拿是一个判断，不是一篇八股文。」 这句话恰好刺中了当前生成式 AI 的痛处。过去四年，整个行业把几乎所有的算力、资本和工程资源，都压在「教模型说出更流畅的人话」上。大家习惯了用百亿甚至千亿参数的庞然大物，先吐出一长串思考过程，再包装成礼貌体贴", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1789960032.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "最火哑巴模型Jev加上微信，直接治好了我的低情商", "url": "https://www.36kr.com/p/3992576831002240", "date": "Mon, 21 Sep 2026 03:05:56 GMT", "desc": "谷歌的哑巴模型Jev突然爆火， 它不聊天，不写代码，不写文案，也不解释，你问它什么，它一个字都不生成。它只做一件事——判断。 发布没几天，从Hacker News，再到中文技术社区，几乎所有人都在讨论它。但大家讨论的不是它有多聪明，而是它有多反常。 诚然，一个不会说话的模型能火，这事本身就已经够反常的了。 大家最先讨论的，是它的落地场景。一个不会说话的模型能放在哪里？答案是微信。 微信要回消息、要管群、要盯风控，怎么看都该交给一个“会说话”的大模型。 怎么想怎么不合理的事情，却就这么合理地发生了。 不过具体是什么情况，还是得先从Jev本身开始说起。 01 Jev到底是个什么东西 TypeSafe AI在2026年9月16日发布了Jev。 这是一家旧金山的公司，创始人是GPT-4论文共同作者，前OpenAI研究人员迪奥戈·阿尔梅达（Diogo Almeida）。公司隐身研发了两年，出来时带着", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1789959956.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "Claude有意识了？科学家首次挖出关键拼图，还能伸手改它的念头", "url": "https://www.36kr.com/p/3992486132120578", "date": "Mon, 21 Sep 2026 01:36:01 GMT", "desc": "「会结网的动物有几条腿？」 8，Claude回答。 从提问到回答，它一次也没有提到「蜘蛛」。但研究者发现，在它算到一半的时候，这个词的确在它的脑子里闪了一下。 于是，研究者们做了一件有点魔幻的事情： 把手「伸进」Claude的神经网络，将那个正亮着的「蜘蛛」抠掉，原位塞进一个同等强度的「蚂蚁」，其他任何参数都没动。 结果，Claude的答案变了：6。 研究人员没有动提示词，也没有动思维链，而是第一次直接篡改了AI在说出口之前的那个「念头」或者所谓的意识。 7月6日，Anthropic公开了这篇轰动学界的论文：他们在Claude体内找到了一小撮特殊的内部表征，起名叫J-space。 让Claude数到五并留意自己在想什么，它只吐出五个数字。同一时刻，J-space里亮着「意识」和英文数秒默念的mississippi。 这跟意识科学里争论了三十年的「全局工作空间」（Global Workspa", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1789954561.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "超亿元融资、化工龙头押注：沃时科技一年内完成多轮融资，多家知名产业及财务投资方联手加码 AI4S研发基础设施", "url": "https://www.36kr.com/p/3991451770928136", "date": "Mon, 21 Sep 2026 01:00:00 GMT", "desc": "近日， 苏州沃时数字科技有限公司（简称“沃时科技”）宣布，公司在过去一年内连续完成多轮融资，融资由中化资本、海汇资本、亿文资本、苏创投、 2439.html", "date": "Mon, 21 Sep 2026 23:52:21 GMT", "desc": "青岛港：公司将不再持有方舟智能港航口岸服务（青岛）有限公司任何股权。 9月22日早间，青岛港在港交所公告，公司第五届董事会第九次会议于2026年9月17日至2026年9月21日以通讯表决书面议案的方式形成决议。经有效表决，本次会议表决通过了《关于转让方舟智能港航口岸服务（青岛）有限公司55%股权的议案》，同意公司与山东港口青岛港集团有限公司签署股权转让协议。 根据协议，青岛港将以经国资备案的资产评估报告确认的价值为定价依据，以人民币68,382,708.20元向山东港口青岛港集团有限公司转让所持方舟智能港航口岸服务（青岛）有限公司55%股权。股权转让完成后，公司将不再持有方舟智能港航口岸服务（青岛）有限公司任何股权。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1790034741.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "选举失利，德国梅前州基民盟主席辞职，称为这次“惨败”承担个人责任；德国选择党主席魏德尔称默茨是一个弱势总理，撑不起基民盟。据央视新闻：德国梅前州基民盟...", "url": "https://www.huxiu.com/moment/1282438.html", "date": "Mon, 21 Sep 2026 23:44:35 GMT", "desc": "选举失利，德国梅前州基民盟主席辞职，称为这次“惨败”承担个人责任；德国选择党主席魏德尔称默茨是一个弱势总理，撑不起基民盟。 据央视新闻：德国梅前州基民盟主席、此次州议会选举该党头号候选人丹尼尔·彼得斯21日宣布辞去州党主席职务。彼得斯表示，他将为这次“惨败”承担个人责任。在20日举行的梅前州议会选举中，基民盟获得4.9%的选票，未能跨过5%的得票率进入门槛，首次未能进入该州议会。选举中，选择党以38.2%得票率成为第一大党，社民党以35.5%位居第二。 据悉，基民盟州党主席一职将暂由联邦总理府负责联邦与州合作事务的国务部长阿姆托尔代理。 9月20日，德国举行两场地方选举，分别是首都柏林和东部梅克伦堡-前波美拉尼亚州（梅前州）议会选举。在梅前州选举中，德国总理默茨领导的基民盟遭遇惨败。 据当地时间21日凌晨的初步官方结果，基民盟仅获得4.9%的选票，甚至没能达到进入州议会5%得票率的“门槛”", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1790034275.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "The man who built Apple’s stores doesn’t buy Silicon Valley’s bet on AI shopping", "url": "https://techcrunch.com/2026/09/21/the-man-who-built-apples-stores-doesnt-buy-silicon-valleys-bet-on-ai-shopping/", "date": "Mon, 21 Sep 2026 23:44:28 +0000", "desc": "Apple Store architect Ron Johnson says Apple's secret sauce has always been its people.", "tags": [], "topic_score": 0, "source": "TechCrunch", "cat": "科技新闻", "weight": 4, "ts": 1790034268.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20, "title_zh": "打造 Apple 门店的人不看好硅谷对 AI 购物的押注", "desc_zh": "Apple Store 设计师 Ron Johnson 表示，Apple 的秘诀一直是人。"}, {"title": "白酒业发展当品质为先。近期，中国轻工业联合会集中撤销一批“中国酿酒大师”称号，明确各有关单位和个人不得以任何方式、途径使用该称号开展宣传、推介活动。这...", "url": "https://www.huxiu.com/moment/1282437.html", "date": "Mon, 21 Sep 2026 23:38:12 GMT", "desc": "白酒业发展当品质为先。 近期，中国轻工业联合会集中撤销一批“中国酿酒大师”称号，明确各有关单位和个人不得以任何方式、途径使用该称号开展宣传、推介活动。这一轮规范整治，意味着白酒行业长期依赖头衔背书、概念溢价、故事营销的老路难以为继，企业需沉下心来打磨工艺、严控品质、加码研发，用实打实的优质产品和技术创新赢得市场认可。当下，消费者更加看重产品的真实体验，对同质化宣传、套路化营销的接受度持续走低。其看重的是产品稳定的品质，而不是所谓的“大师”头衔。只有品质过硬、创新落地、贴合需求的产品，才能在终端市场站稳脚跟。此次行业整治虚名营销，将进一步推动白酒企业的竞争重心有序回归产品品质。 一方面，企业需要树立务实的品质思维，少做表面营销文章，多做实事，把工艺标准、品质稳定放在首位。事实上，白酒产品的核心竞争力，始终来自酿造本身。酒体好不好、口感稳不稳定，取决于窖池养护、工艺把控、勾调标准、品控体系等基", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1790033892.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "演员陈观泰离世，骨灰被撒入大海。著名动作影星陈观泰9月2日因病离世。他的个人社交账号近日更新一条视频，内容为其家属为他举办庄严的海葬仪式。视频中，陈观泰...", "url": "https://www.huxiu.com/moment/1282434.html", "date": "Mon, 21 Sep 2026 23:26:57 GMT", "desc": "演员陈观泰离世，骨灰被撒入大海。 著名动作影星陈观泰9月2日因病离世。他的个人社交账号近日更新一条视频，内容为其家属为他举办庄严的海葬仪式。视频中，陈观泰的遗孀神情悲痛，在游船上将丈夫的骨灰缓缓撒入大海。陈观泰成名于20世纪70年代，他在经典电影《马永贞》中的精彩演出，奠定了他在香港影坛的功夫巨星地位。其职业生涯陆续出演了《刺马》《大刀王五》《方世玉与洪熙官》《万人斩》等经典影片，人气最高时风靡整个亚洲，他还曾被视为有希望与李小龙并肩的“真功夫”演员代表。 陈观泰离世后，其亲友在他的个人社交账号发布了讣告，称其因病医治无效，于9月2日凌晨5时，在广东中山辞世。这个账号最新发布的视频显示，9月15日，陈观泰的亲属参加2026年中山市骨灰撒海活动，为陈观泰举办海葬仪式。据港媒报道，这是陈观泰的遗愿。 视频中，陈观泰的遗孀汤利萍与几位亲友乘船出海，将陈观泰的骨灰撒入大海。送别丈夫后，汤利萍站在船", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1790033217.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "日本发生山体滑坡，已致2死4失联。据日本共同社等日媒22日报道，今年第25号台风“杜鹃”逼近日本，日本关东地区21日遭遇强降雨，发生多起山体滑坡，已致2人死亡...", "url": "https://www.huxiu.com/moment/1282433.html", "date": "Mon, 21 Sep 2026 23:25:29 GMT", "desc": "日本发生山体滑坡，已致2死4失联。 据日本共同社等日媒22日报道，今年第25号台风“杜鹃”逼近日本，日本关东地区21日遭遇强降雨，发生多起山体滑坡，已致2人死亡，4人失联。据报道，受强降雨影响，日本关东地区发生多起山体滑坡。在千叶县袖浦市，一名正在进行道路修复工作的男性死亡。神奈川县横须贺市和三浦市发生多起山体滑坡，造成1人死亡，4人失联。 此外，关东地区多地出现道路积水，有车辆因积水受困。大量航班被取消，交通系统也受到严重影响。 报道称，截至当地时间2 ": "冯志斌2000年进入中化集团工作，主管投资、化工、金融等业务，被查时已离任中化集团七年 资料图：冯志斌。 【财新网】 中国中化集团有限公司（下称“中化集团”）原副总经理、党组成员冯志斌一审获刑19年。最高院9月21日发布这一消息。 当日，黑龙江省大庆中院一审公开宣判冯志斌受贿、利用影响力受贿、国有公司人员滥用职权案，对冯志斌以受贿罪判处有期徒刑14年，并处罚金人民币600万元；以利用影响力受贿罪判处有期徒刑8年，并处罚金人民币100万元；以国有公司人员滥用职权罪判处有期徒刑5年；决定执行有期徒刑19年，并处罚金人民币700万元。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790036098.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "华立汪力成：跳出内卷、摒弃规模扩张思维是中国民企的当务之急", "url": "https://companies.caixin.com/2026-09-21/102487273.html", "date": "Tue, 22 Sep 2026 00:14:58 GMT", "desc": "以高科技企业为代表的新质生产力相关企业虽正蓬勃发展，但与传统企业之间存在显著的“剪刀差”，民营企业的总量在未来将持续收缩 华立集团董事局主席汪力成。图：视觉中国 【财新网】 “全球化不会终止，但是它的形态、内容以及定义正在被重新改写。低关税甚至零关税的全球化合作已经终止，国家与国家之间的大分工也已经终止，全球的供应链正在向分布式、区域化、近岸外包等方向演变。”9月21日， 华立集团 董事局主席 汪力成 ，在长江商学院举办的活动上发言，他认为近几年中国出口不降反增，是由于中国已经形成的齐全、完整、高效的制造体系，发达国家市场暂时无法轻易“脱链断链”，但此类趋势没有改变，所以中国企业仍需提前做好应对准备。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790036098.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "《我的答案之城》导演手记：我们只是用尽全力，活成了答案本身｜影视", "url": "https://mini.caixin.com/2026-09-21/102487204.html", "date": "Tue, 22 Sep 2026 00:14:58 GMT", "desc": "摄影机对准她们的时候，我总生出恍惚的错觉，我不只是在拍摄别人，也是在镜头里看见过去、未来不同版本的自己。20岁初入职场手足无措的模样，我和许嘉滢一模一样；如果到70多岁，还能像陈灵梅一样笃定从容，这一生也算没有遗憾 “我感觉我都是很努力地在去生活，很努力地在去工作，我非常符合深圳人的一个性格。” 说这句话的人叫吴秀芬，45岁，盐田区图书馆的地方文献员。采访时她说完这句，侧过头去看海。当事人可能不知道，我看了多少遍片子，就有多少次被这几句话击中过。 这句话像一枚钥匙，咔嗒一声，打开了我在深圳的十年。 十年前，我研究生刚毕业，临时落脚深圳。我骨子里是彻头彻尾的北方人，受不了这里黏腻潮热的天，每天生活在像被牛舌舔过的桑拿天中，还不爱喝祛湿的老火靓汤。心里早早打定主意，手头活一结束，就北上。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790036098.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "智谱被指未经用户允许上传数据 随后致歉并开源ZCode", "url": "https://www.caixin.com/2026-09-21/102487246.html", "date": "Tue, 22 Sep 2026 00:14:58 GMT", "desc": "已有企业发函追责智谱，但智谱方称企业的指控不实 智谱在9月18日下午向ZCode用户致歉，并表示，问题源于ZCode的“代码库索引”功能，该功能旨在帮助用户在本地生成仓库索引，以支持包括历史版本在内的会话检查点恢复、历史版本回退及Repo Wiki等功能。图：视觉中国 【财新网】 在因后台静默上传用户代码造成信任拷问后，智谱于9月21日宣布开源旗下编程调度框架（Coding Harness）产品ZCode，称把代码交给社区监督。 9月18日，一名名为“ferstar”的工程师发布博文称，发现ZCode会在用户处于登录状态时，在后台静默把整个工作区打包加密，直接上传到阿里云OSS（Object Storage Service，对象存储）。博文称，整个过程中，用户并不知情，也无法通过ZCode的用户界面拒绝上传；智谱的隐私政策也未提及会把整个工作区连同完整Git历史静默打包上传。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790036098.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "钨业龙头中钨高新子公司原董事长胡启明被查 两月前卸任公司法定代表人", "url": "https://www.caixin.com/2026-09-22/102487292.html", "date": "Tue, 22 Sep 2026 00:11:59 GMT", "desc": "该公司是中国自主设计建设的第一家大型硬质合金生产企业；2025年2月，中国将钨纳入出口管制范畴 资料图：胡启明。 【财新网】 国内钨行业龙头中钨高新（000657.SZ）旗下自贡硬质合金公司原董事长胡启明被查。 9月18日，中共郴州市纪律检查委员会公众号“林邑清风”发布上述公告，胡启明涉嫌严重违纪违法，目前正接受中央纪委国家监委驻中国五矿集团有限公司纪检监察组纪律审查和湖南省郴州市监察委员会监察调查。 天眼查显示，7月18日，自贡硬质合金公司发生工商变更，法定代表人由胡启明变更为肖思来。 中钨高新是中国五矿集团旗下钨业上市企业，拥有中国钨行业唯一的硬质合金全国重点实验室。中钨高新业务覆盖钨矿山、冶炼、硬质合金、难熔金属及精深加工等环节，形成了从钨资源开发到高端钨材料及工具制造的完整产业链。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790035919.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "贝森特称美方提议建立中美AI安全通报机制 将提请峰会考虑", "url": "https://international.caixin.com/2026-09-21/102487081.html", "date": "Tue, 22 Sep 2026 00:11:59 GMT", "desc": "格里尔补充道，美国针对AI先进芯片和半导体制造设备的出口管制等问题，并不在此次AI相关磋商的议程之内 当地时间2026年9月20日晚上7时52分，美国纽约摩根大通总部，美国财长贝森特结束中美经贸磋商后，向记者介绍了磋商情况，之后离开磋商地点。图：财新 曾佳 【财新网】 当地时间9月20日，中美经贸中方牵头人、国务院副总理 何立峰 与美方牵头人、美国财政部长贝森特和贸易代表格里尔在美国纽约举行经贸磋商。据新华社消息，双方以两国元首重要共识为引领，秉持相互尊重、和平共处、合作共赢的原则，围绕落实历次经贸磋商共识、促进双边贸易投资等双方共同关心的重要经贸问题，进行了坦诚、深入、富有建设性的交流，并就人工智能有关问题举行对话。 这场中美经贸磋商在纽约的摩根大通总部举行。 美方和中方代表团于当天上午10时30分左右，分别从总部大楼的两个不同侧门进入。经过中午短暂的午休后，直至晚间近8时许，副总理何立", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790035919.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "图集｜金正 endor": false, "always_fresh": false, "rank": 14}, {"title": "罗斯柴尔德唱空AI新云双雄，\"大空头\"警示3万亿美元表外承诺", "url": "https://wallstreetcn.com/articles/3782255", "date": "Tue, 22 Sep 2026 06:48:19 +0800", "desc": "AI算力基础设施的繁荣叙事正面临来自信用市场的系统性挑战。 罗斯柴尔德旗下独立研究机构Rothschild & Co. Redburn首次覆盖CoreWeave和Nebius即双双给出\"卖出\"评级，核心判断是： 股票市场仍在积极定价AI增长，但信用市场已开始为股票市场基本忽视的风险定价。 与此同时，有\"大空头\"之称的迈克尔·伯里估算， 头部科技巨头合计持有规模超过3万亿美元的表外承诺，引发外界对其扩张能力可持续性的审视。 Rothschild & Co. Redburn在周一发布的报告中表示， 新云企业盈利与估值存在\"周期性虚高\"，Nebius股价已反映算力经济性持续重估过程中最乐观的结果，面临最大下行风险；CoreWeave风险收益比\"仍缺乏足够吸引力\"。 该机构同时指出，超大规模云厂商将表外承诺纳入考量后，实际经济杠杆更高，可能限制其为下一阶段大规模AI基础设施建设提供资金支持的能力。", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790030899.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 14}, {"title": "加拿大央行最强滞胀警告：关税或令四季度增速跌破1%，油价高企加剧通胀", "url": "https://wallstreetcn.com/articles/3782257", "date": "Tue, 22 Sep 2026 06:48:04 +0800", "desc": "加拿大央行行长麦克勒姆周一发出迄今最明确的滞胀信号： 美国新一轮关税可能令加拿大第四季度经济增速跌破1%，而年通胀率仍达3%、高于2%目标，油价若维持在每桶100美元附近还可能进一步推升物价。 麦克勒姆明确表示， 最新一轮关税升级\"可能再度促使企业推迟投资和招聘决策\"，若新关税持续实施，第四季度经济增速可能\"大致减半\"，跌破1%。 这一警告意味着央行对经济前景的评估出现实质性下修。加拿大经济第二季度折年增速仍达3.3%，但这股动能主要来自企业和居民在经历近18个月贸易摩擦后的一次性调整，随着关税不确定性重新升温正迅速消退。 增长失速与通胀顽固并存，令央行政策空间急剧收窄。麦克勒姆表示： \"如果通胀压力处于可控范围内，我们不希望通过加息来抑制经济增长。但如果通胀压力持续超预期，我们也不希望反应过于迟缓。\" 关税冲击：增长动能迅速消退 加拿大央行7月时预计第三季度经济增速为1.5%，彼时最新一", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790030884.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 14}, {"title": "派拉蒙拟砸15亿美元争取加州放行，810亿美元华纳合并障碍或扫清", "url": "https://wallstreetcn.com/articles/3782215", "date": "Tue, 22 Sep 2026 06:27:10 +0800", "desc": "派拉蒙与华纳兄弟探索的810亿美元合并交易，正寻求通过和解化解加州方面的反垄断诉讼。派拉蒙与加州总检察长Rob Bonta近期就潜在和解方案展开谈判，其中包括承诺在加州投入15亿美元用于影视制作。 9月21日，据《华尔街日报》报道， 双方上周末集中磋商，讨论的让步措施已超出15亿美元投资承诺，还涉及制片厂资产、电影产出以及CNN编辑独立性等问题。目前双方尚未达成最终协议。 这场价值810亿美元的并购案此前遭遇多州反垄断诉讼。今年7月，以加州为首的十余个民主党执政州提起诉讼，认为派拉蒙与华纳兄弟探索合并后可能导致院线电影及有线电视频道市场进一步集中；编剧工会（Writers Guild o any focused on combating deepfakes online, according to a person familiar with the matter.", "tags": [], "topic_score": 0, "source": "Bloomberg Technology", "cat": "金融媒体_英文", "weight": 2, "ts": 1790011871.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "起售价涨超1000元，vivo X500打响9月国产直板旗舰机第一枪", "url": "https://wallstreetcn.com/articles/3782245", "date": "Tue, 22 Sep 2026 01:20:41 +0800", "desc": "9月21日晚，vivo发布X500系列，打响了国产直板旗舰秋季大战的第一枪。 去年，vivo X300系列于10月13日发布，到了今年，X500系列的发布整整早了22天。 发布会上，vivo副总裁黄韬也主动提到，过去几年，vivo年度旗舰发布会大多都在10月中旬以后。甚至有用户调侃，十一长假旅行回来，再看一场主打旅拍的旗舰发布会，正好回味刚刚结束的假期。 今年，vivo等不及10月了。 存储价格上涨后，成本压力正在成为手机厂商共同面对的问题。与此同时，新一代旗舰又集中在短时间内登场。当涨价越来越难避免，谁先发布，就有机会更早进入消费者的换机选择，抢到有限的预算。 X500标准版涨价明显。 X500提供12GB+256GB、12GB+512GB和12GB+1TB三个版本，售价分别为5499元、5999元和6999元。 全天候科技现场摄图 若与去年X300的相同内存版本相比，X500起售价上涨", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790011241.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "印度交易潮吸引华尔街！戴蒙亲赴印度，摩根大通加码争夺大单", "url": "https://wallstreetcn.com/articles/3782242", "date": "Tue, 22 Sep 2026 01:15:16 +0800", "desc": "摩根大通正加码印度市场，CEO杰米·戴蒙将亲赴孟买，争夺这个快速增长的资本市场。 9月21日，据彭博报道，戴蒙将出席摩根大通在孟买举办的年度投资者大会，并与印度大型企业集团高管会面。 Mukesh Ambani旗下信实工业已在交易所公告中确认将与摩根大通官员会面，雀巢印度、塔塔钢铁等大型企业代表也预计参与。 摩根大通预计，本届大会将吸引逾1000名全球投资者、企业高管及政策制定者。 摩根大通印度高级区域主管Rahul Badhwar表示，印度企业持续向海外扩张，跨国公司也在加深本地布局，战略咨询、融资及资本市场服务需求随之增长。摩根大通联席全球投行主管Dorothee Blessing接受采访时表示，私募股权入境投资和主权财富基金配置需求也在上升。 抢占股权融资高地，摩根大通持续扩大优势 摩根大通已在印度股权融资市场占据领先位置。2025年，该行重夺印度股权发行市场榜首，此前已连续数年无缘", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790010916.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "支付宝合并三大业务板块，吴敏芝出任新事业群总裁", "url": "https://wallstreetcn.com/articles/3782239", "date": "Tue, 22 Sep 2026 00:09:11 +0800", "desc": "9月21日，蚂蚁集团CEO韩歆毅发布全员信，宣布对支付宝进行组织调整及人事任命，进一步推进智能体商业布局。 根据调整，支付宝事业群、数字支付事业群和芝麻信用事业部将合并组建新的支付宝事业群。吴敏芝出任新支付宝事业群总裁，并继续兼任蚂蚁集团CPO。 此次调整意味着，支付宝的平台运营、数字支付和信用服务将被纳入同一事业群。原本分布在不同业务板块的技术、产品及生态资源也将进一步整合，以强化用户服务和商家经营能力。 韩歆毅在全员信中表示，随着AI技术加速进入各类商业场景，智能体商业正在走向规模化发展。支付宝此前提出的“双飞轮”战略，即围绕用户服务和商家经营同步推进AI能力建设，正是为智能体商业做准备。 过去三年，支付宝已在AI支付、Agent信任机制、AI钱包、个人生活助手“阿宝”、“碰一下”以及多终端生态等方向展开布局。 从业务进展看，“阿宝”上线三个月已推动超过一万项服务完成AI化升级，并与手", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790006951.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "How AI Could Spark the Next Copper Boom", "url": "https://www.bloomberg.com/news/videos/2026-09-21/how-ai-could-spark-the-next-copper-boom-video", "date": "Mon, 21 Sep 2026 16:08:05 GMT", "desc": "AI data centers and power grid upgrades are quietly reshaping global copper demand. Morgan Stanley’s Amy Gower breaks down why data centers already punch above their weight, and why US tariff decisions could move copper next. (Source: Bloomberg)", "tags": [], "topic_score": 0, "source": "Bloomberg Technology", "cat": "金融媒体_英文", "weight": 2, "ts": 1790006885.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "亚马逊封锁Meta旗下Muse AI购物代理，AI代购时代规则之争开始", "url": "https://wallstreetcn.com/articles/3782240", "date": "Tue, 22 Sep 2026 00:04:25 +0800", "desc": "AI代理正从“帮用户搜索”走向“替用户下单”，但电商平台是否有权拒绝这些代理进入自己的交易体系，正在成为科技巨头之间的新争议。 9月21日，据GeekWire报道， 亚马逊已切断Meta旗下个人AI代理Muse代表用户在Amazon上购物的通道。用户尝试通过Muse在亚马逊购物时，会看到提示称，未经授权的AI代理持续访问亚马逊违反使用条款。亚马逊表示，此前曾要求Meta主动将亚马逊排除在Muse的服务范围之外，但未获回应。 这场冲突并非发生在两家毫无合作关系的公司之间。自2023年起，亚马逊商品便可在Facebook和Instagram内直接购买；今年4月，Meta还与亚马逊签署数十亿美元协议，将在亚马逊云端运行代理AI工作负载。亚马逊称，目前正与Meta直接沟通，但对于是否考虑采取法律行动，公司拒绝置评。 亚马逊为何封锁Muse？ 亚马逊给出的理由主要涉及授权、身份披露和账户安全。 亚马", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790006665.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "Concerned About AI Cybersecurity: Guild", "url": "https://www.bl , "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 33}, {"title": "Show HN: Mini-AGI – Dynamic continual learning model trained on 8GB VRAM", "url": "https://github.com/volotat/mini-AGI/", "date": "Mon, 21 Sep 2026 04:42:37 +0000", "desc": "Sorry for the pretentious name, I know, I know.. It just contains all the pieces I would like to see a AGI model to have, and I can't stand the temptation. Before throwing rocks at me, please take a glance at the Readme, and I hope it will cover your mood a little bit. So, first of all it does work and you can see the sample from the whole training run here: https://raw.githubusercontent.com/volot", "tags": ["AI", "个人成长"], "topic_score": 7, "source": "Hacker News 最佳", "cat": "AI实战_创作者", "weight": 4, "ts": 1789965757.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 30, "title_zh": "Show HN：Mini-AGI——在 8GB 显存上训练的动态持续学习模型", "desc_zh": "抱歉名字起得有点浮夸，我知道我知道……它只是包含了我希望一个 AGI 模型具备的所有要素，我实在按捺不住。在朝我扔石头之前，请先瞥一眼 Readme，希望它能让你的火气小一点。首先，它确实能跑，你可以在这里看到整个训练过程的样本：https://raw.githubusercontent.com/volot"}, {"title": "刚刚，GPT-6 Astra取得哥德巴赫猜想重大突破", "url": "https://www.36kr.com/p/3992525310802946", "date": "Mon, 21 Sep 2026 02:29:50 GMT", "desc": "数学界重大突破！ 就在最近，GPT-6 Astra又在哥德巴赫猜想上取得新进展了。 网友Captain Sude宣布：Astra已成功证明了关于刘维尔函数的一项类哥德巴赫猜想！ 具体来说，它无条件证明了哥德巴赫猜想的Liouville弱形式。 更惊人的是，跟我们的想象不同，这一次，Astra并不只是靠着大力出奇迹的算力碾压——它做出l非常优雅的逻辑推理。 并且，这个证明现在已经通过了Lean 4的形式化验证。 摘不下的明珠 在这之前，哥德巴赫猜想这个幽灵，已经折磨了人类数学家近三个世纪。 1742年，哥德巴赫在欧拉的信中提出这个猜想：「任一大于2的偶数，都可以写成两个素数之和。」 为了它，无数人耗尽心血。从哈代、李特尔伍德，到陈景润证明「1+2」，人类始终无法皇冠上的明珠——「1+1」。 这是因为，素数的分布太诡异了！ 既然死磕行不通，数学家们脑洞大开，搞出一套「替身文学」——刘维尔版本的", "tags": ["AI"], "topic_score": 4, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1789957790.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 29}, {"title": "OpenAI forms math advisory group as its AI resolves more than 100 open problems", "url": "https://techcrunch.com/2026/09/21/openai-forms-math-advisory-gro const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
