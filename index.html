ce": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1794528355.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "英伟达感谢黄仁勋巨大贡献英伟达公开表态。持续发酵多日的黄仁勋相关舆论风波终于尘埃落定，他本人最终因此前曝光的婚外情相关事件正式离开英伟达。根据英伟达刚...", "url": "https://www.huxiu.com/moment/1296393.html", "date": "Thu, 12 Nov 2026 23:45:43 GMT", "desc": "英伟达感谢黄仁勋巨大贡献英伟达公开表态。 持续发酵多日的黄仁勋相关舆论风波终于尘埃落定，他本人最终因此前曝光的婚外情相关事件正式离开英伟达。根据英伟达刚刚对外发布的官方公告，公司联合创始人黄仁勋即刻卸任首席执行官一职，科莱特·克雷斯于今日上午正式被任命为英伟达临时CEO。在董事会敲定正式的长期继任人选之前，克雷斯将以临时CEO的身份主持公司全盘日常工作，同时她原本担任的执行副总裁兼首席财务官职务也将继续兼任，确保现阶段公司的财务运转和日常运营节奏不会出现大幅波动。 针对黄仁勋的离职，英伟达官方在公告中给出了十分克制的公开表态，董事会和全体公司成员都非常感谢黄仁勋过去数十年间为英伟达乃至整个全球AI产业作出的不可磨灭的巨大贡献。刚刚履新的英伟达临时CEO科莱特·克雷斯已经第一时间向全体员工发出内部备忘录，坦言过去一段时间公司上下经历的处境极其艰难，非常感谢所有员工在舆论风波中的坚韧与专业表现", "tags": ["AI"], "topic_score": 3, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1794527143.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "高盛前CEO劳埃德·布兰克费恩在X上发文，谈及黄仁勋离开英伟达：“黄仁勋的事令人难过。莎士比亚式的。但正如戴高乐所说，‘墓地里埋满了不可或缺之人。’”。", "url": "https://www.huxiu.com/moment/1296384.html", "date": "Thu, 12 Nov 2026 23:19:52 GMT", "desc": "高盛前CEO劳埃德·布兰克费恩在X上发文，谈及黄仁勋离开英伟达：“黄仁勋的事令人难过。莎士比亚式的。但正如戴高乐所说，‘墓地里埋满了不可或缺之人。’”。", "tags": ["AI"], "topic_score": 3, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1794525592.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "Nebius Q3业绩超预期，资本开支升至270亿美元、ARR目标延期，股价跌近17% | 财报见闻", "url": "https://wallstreetcn.com/articles/3785826", "date": "Fri, 13 Nov 2026 06:59:31 +0800", "desc": "AI云计算公司Nebius Group公布第三季度业绩，营收与利润双双超出市场预期，但ARR增长指引下调与资本开支大幅上调的组合，令投资者对其盈利路径产生疑虑。 Nebius三季度营收达9.81亿美元，较市场预期的9.19亿美元高出约6.7%；调整后EBITDA为4.66亿美元，亦大幅超出预期的3.57亿美元。 然而，公司将年化经常性收入（ARR）目标从此前承诺的\"2026年12月前达到70亿至90亿美元\"下调至\"2027年2月前达到70亿美元以上\"，与此同时，公司还表示\"ARR不再是衡量业务的正确指标\"， 令外界对其战略方向的清晰度产生质疑。 受财报表现不及预期拖累，公司股价在盘前交易时段即下挫逾14%。正式开盘后抛压持续释放，股价大幅低开约22%，截至收盘跌幅虽有所收窄，但全天仍重挫16.84%。 值得注意的是，同日半导体领域亦出现普遍抛售情绪，CoreWeave收跌6.86%，部分市", "tags": ["企业落地", "资本市 细节饱满，老板说得也很动情，很容易戳中大众的共情点。但假的真不了，终究会露了马脚。吃7碗米饭还不饱，生活窘迫还", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1794527116.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "@attorneyryan: Microsoft: Hey let’s fire 60,000 people and double down on AI. Microsoft AI: You’re right, deleting everyone’s Outlook WAS a mistake...", "url": "https://www.threads.com/t/DfqQg2JAZrL", "date": "Thu, 12 Nov 2026 23:40:19 GMT", "desc": "@attorneyryan : Microsoft: Hey let’s fire 60,000 people and double down on AI. Microsoft AI: You’re right, deleting everyone’s Outlook WAS a mistake. And honestly? Calling it out is the right move in this situation.", "tags": [], "topic_score": 0, "source": "Threads-AI讨论", "cat": "AI实战_创作者", "weight": 4, "ts": 1794526819.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "电视卖得少了屏幕却越买越大中国电视平均尺寸涨到64.7英寸。电视卖得少了，屏幕却越买越大。洛图科技最新数据显示，2026年前3季度，中国电视零售市场的平均尺寸...", "url": "https://www.huxiu.com/moment/1296391.html", "date": "Thu, 12 Nov 2026 23:38:46 GMT", "desc": "电视卖得少了屏幕却越买越大中国电视平均尺寸涨到64.7英寸。 电视卖得少了，屏幕却越买越大。洛图科技最新数据显示，2026年前3季度，中国电视零售市场的平均尺寸达到64.7英寸，同比增加2.0英寸。更直观的变化是，75英寸、85英寸和98英寸以上这3个尺寸段，合计销量占比已经达到41.1%。也就是说，每卖出10台电视，就有约4台来自这些大屏尺寸段。75英寸依然最受欢迎。第3季度，其销量份额达到21.5%，继续位居所有尺寸之首。算下来，当季每卖出约5台电视，就有1台是75英寸。 不过，增长更抢眼的是85英寸。第3季度，这一尺寸的销量份额达到13.6%，同比增加3.0个百分点，是上述3个大屏尺寸段中份额提升最多的。98英寸以上的泛百寸屏也在扩大地盘，销量份额达到3.5%，同比增加1.1个百分点。虽然占比还不算高，但接近100英寸的大电视，已经在被更多消费者选中。把时间拉长来看，大屏化的变化更明", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1794526726.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "中信建投：2026年前三季度医药板块经营持续改善，2027年趋势有望延续。中信建投研报指出，2026年前三季度医药板块经营持续改善，2027年趋势有望延续。展望2027年...", "url": "https://www.huxiu.com/moment/1296389.html", "date": "Thu, 12 Nov 2026 23:30:12 GMT", "desc": "中信建投：2026年前三季度医药板块经营持续改善，2027年趋势有望延续。 中信建投研报指出，2026年前三季度医药板块经营持续改善，2027年趋势有望延续。展望202 .caixin.com/2026-10-22/102495997.html", "date": "Fri, 13 Nov 2026 00:26:18 GMT", "desc": "全球主要经济体争相回收废旧电池被粉碎处理后产生的“黑粉”，以从中提取用于锂电池再生的关键金属资源；以磷酸铁锂电池为例，欧盟、美国积极探索本土化生产，以期降低对中国进口的依赖", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1794529578.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "[推广] 速薅！ Muse 免费 TG 机器人领取 30 亿 token～", "url": "https://www.v2ex.com/t/1256663#reply0", "date": "2026-11-13T00:25:49Z", "desc": "", "tags": [], "topic_score": 0, "source": "V2EX 最新", "cat": "AI实战_创作者", "weight": 3, "ts": 1794529549.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "中国儿童医疗保障家庭负担重 能否提供免费服务？", "url": "https://www.caixin.com/2026-11-13/102504255.html", "date": "Fri, 13 Nov 2026 00:24:55 GMT", "desc": "研究测算，如为0—6岁儿童提供基本免费医疗服务，每年约需新增公共资金600亿—900亿元，总体具有财政可行性 资料图：儿童医院的医生给儿童做检查。图：IC photo 【财新网】 中国已建立覆盖广泛的儿童基本医保和公共卫生服务体系，但从儿童实际保障需求看，现行制度仍存在低龄儿童参保不足、家庭医疗费用负担较重、门诊及连续治疗保障薄弱、地区间待遇差异明显等问题。 近日，由昆山杜克大学牵头的卫生政策协作组发布一项题为“完善儿童医疗保障的思考与建议”的卫生政策简报（下称“简报”），提出上述发现。其建议，将完善儿童医疗保障作为健全生育支持政策体系、扩大儿童普惠性福利的重要举措。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1794529495.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "闲鱼泄露健康数据事件溯源 英国生物银行将加强审查", "url": "https://www.caixin.com/2026-11-13/102504258.html", "date": "Fri, 13 Nov 2026 00:24:55 GMT", "desc": "泄露健康数据事件告一段落，英国生物银行将分阶段开，UKB将全面审查研究者和机构的身份、资质与数据管理能力，加强对违规行为的主动监测和惩戒 英国生物银行血液样本。图：英国生物银行 【财新网】 暂停访问约半年的英国生物银行（UK Biobank，下称UKB）将重新开放。10月22日，UKB首席执行官兼首席研究员Rory Collins发文表示，一家独立网络安全公司已经确认，UKB的研究分析平台（UKB-RAP）符合安全要求。UKB正在等待英国政府及国家卫生数据控制机构的批准，以恢复平台访问权限。 “一旦获得批准，我们将立即联系各研究项目负责人，安排研究人员分阶段重新进入平台。”Rory Collins说。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1794529495.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "[Android] 在手机上复制完整订阅链接  17}, {"title": "湖北荆州“争抢”广州服装产业 工人如何选择去留？", "url": "https://www.caixin.com/2026-11-12/102504118.html", "date": "Fri, 13 Nov 2026 00:08:30 GMT", "desc": "广州海珠康鹭片区改造持续推进，湖北荆州向在穗服装从业者发出返乡邀请，但工人去留取决于订单、收入与就业机会 资料图：广州中大纺织商圈。图：陈楚红/中新社/视觉中国 【财新网】 随着城市更新和产业升级，吸引全国各地商人和工人前来淘金的广州中大纺织商圈，成为外地政府招商招工的目标。 11月9日，湖北省荆州市人力资源和社会保障局发布《致广州市荆州籍纺织服装从业者的一封信》，瞄准广州海珠区康乐、鹭江、大塘、上冲等服装产业集聚地的搬迁契机，热情邀请荆州籍从业者“带着技术、订单和团队回乡安家兴业”。 荆州方面提出“广州接单、荆州生产”的产业分工模式，以及创业奖补、贷款贴息、技能培训、人员接送和设备转运等扶持措施。按照安排，荆州将于11月14日至17日赴广州开展返乡创业对接活动，并开通24小时服务专线。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1794528510.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "[全球工单系统] 微软挂了吗？ 都挂了哪些服务？ Live 邮箱不能用", "url": "https://www.v2ex.com/t/1256651#reply6", "date": "2026-11-13T00:08:24Z", "desc": "", "tags": [], "topic_score": 0, "source": "V2EX 最新", "cat": "AI实战_创作者", "weight": 3, "ts": 1794528504.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "碧澄能源董事长：新能源运营商需关注精细化运营", "url": "https://topics.caixin.com/2026-11-13/102504251.html", "date": "Thu, 12 Nov 2026 23:46:15 GMT", "desc": "在国内，要做好发、用电两侧的预测和匹配，挖掘其中机会；在海外，可向客户提供综合能源解决方案，获得更大价值空间 11月12日，在第十七届财新峰会的“气候变化与资源革命”专题讨论中，碧澄能源董事长、CEO李文轩发言。图：财新 [查看更多峰会报道，请访问本届财新峰会首页。 可点此打开 ] 【财新网】 国内新能源运营商的机遇正在从规模扩张转向精细化运营，海外市场则可以从设备和工程出口转向综合能源解决方案。 11月12日，在 第十七届财新峰会 的“气候变化与资源革命”专题讨论中，碧澄能源董事长、CEO李文轩表示。 他表示，国内电力市场化改革不断推进，新能源运营商需要同时做好发电侧和用电侧的预测，通过功率预测、负荷预测和交易策略的结合，精细化运营，提高电力资产收益率，也助益整个电力大市场的平衡。 2025年2月，国家发展改革委、国家能源局发布《 关于深化新能源上网电价市场化改革 促进新能源高质量发展的", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1794527175.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "徐林：打造更稳定可预期的新能源投资环境", "url": "https://topics.caixin.com/2026-11-12/102504198.html", "date": "Thu, 12 Nov 2026 23:46:15 GMT", "desc": "目前新能源产能供给过剩、产品价格下跌，新能源项目投资回报受到估值周期影响，退出渠道有限 11月12日，第十七届财新峰会，中美绿色基金董事长徐林发言。图：财新 [查看更多峰会报道，请访问本届财新峰会首页。 可点此打开 ] 【财新网】 政策层应关注新能源领域的产业生态，建立更稳定、可预期的新能源投资环境，鼓励更多社会资本，特别是民营资本在新能源领域进行投资。11月12日，中美绿色基金董事长徐林在第十七届财新峰会上提出上述建议。 11月11日至13日，由财新传媒和财新智库主办的第十七届财新峰会在北京举行，本届峰会主题为“以发展应变局”。 徐林表示，目前新能源产能供给过剩、产品价格下跌，新能源项目投资回报受到估值周期影响，退出渠道有限，当下投资者不得不做长期资本准备，并探索通过企业并购推动产能整合。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1794527175.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "Whoop launched a social network where every user has a ‘verified heartbeat’", "url": "https://www.theverge.com/gadgets/1032630/whoop-humans-social-network", "date": "2026-11-12T18:43:22-05:00", "desc": "Starting Thursday, Whoop members can share their data from its wearables on the app's new Whoop Humans social network. Users can make their metrics, activities, and achievements visible to other Whoop wearers, post Story-like \"Moments\" with photos and captions, and add comments and reactions on other members' posts. Whoop claims its platform is \"entirely human,\" […]", "tags": [], "topic_score": 0, "source": "The Verge", "cat": "科技新闻", "weight": 3, "ts": 1794527002.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "新加坡前副总理王瑞杰：全球化下一阶段应使中国和世界共同繁荣", "url": "https://topics.caixin.com/2026-11-12/102503854.html", "date": "Thu, 12 Nov 2026 23:39:26 GMT", "desc": "王瑞杰说：“全球化的可持续性不仅取决于经济效率，还取决于普通民众是否相信他们在其成功中能获益” 11月12日，王瑞杰在主题为“以发展应变局”的第17届财新峰会上，围绕“新全球化：竞争、合作、创造共享繁荣”发表主旨演讲，并与财新传媒社长胡舒立对谈。图：财新 [查看更多峰会报道，请访问本届财新峰会首页。 可点此打开 ] 【财新网】 “我们需要一种新的全球分工，这种分工应基于互补优势、专业化、创新以及互利共赢的贸易和投资。任何国家都不应认为，自己必须制造一切、主导每一项技术或占据每个产业的每个环节。”新加坡国立研究基金会（NRF）主席、新加坡前副总理王瑞杰表示，对于世界各国而言，“目标应当是构建一个更大的全球经济，而不仅仅是重新分配现有的市场份额。” 11月12日，王瑞杰在主题为“以发展应变局”的 第17届财新峰会 上，围绕“新全球化：竞争、合作、创造共享繁荣”发表主旨演讲，并与财新传媒社长胡舒", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1794526766.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "Humble Bundle redesign removes two-factor verification from settings", "url": "https://www.theverge.com/games/1032659/humble-bundle-redesign-two-factor-verification-security-settings", "date": "2026-11-12T18:30:52-05:00", "desc": "The Humble Bundle storefront for buying games and other software recently got a new look, but on the settings page, it no longer offers a way to add or update two-factor verification methods, as reported by Kotaku. PC Gamer also points out that there are Humble Bundle support pages discussing two-factor verification, and the writer […]", "tags": [], "topic_score": 0, "source": "The Verge", "cat": "科技新闻", "weight": 3, "ts": 1794526252.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "[职场话题] 关于工作未来的探讨", "url": "https://www.v2ex.com/t/1256655#reply0", "date": "2026-11-12T23:27:27Z", "desc": "", "tags": [], "topic_score": 0, "source": "V2EX 最新", "cat": "AI实战_创作者", "weight": 3, "ts": 1794526047.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "Microsoft Outlook is still down", "url": "https://www.theverge.com/tech/1032226/microsoft-outlook-is-down", "date": "2026-11-12T18:25:01-05:00", "desc": "Since just before 1PM ET on Thursday, reports have come in from around the world that people can't access their Outlook email, either through the web or apps. Microsoft quickly acknowledged the issue from its Microsoft 365 Status account, saying that \"We've determined a portion of infrastructure is experiencing elevated load across multiple regions, which […]", "tags": [], "topic_score": 0, "source": "The Verge", "cat": "科技新闻", "weight": 3, "ts": 1794525901.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "[程序员] 请问你们平时如果合理分配的 GPT 的额度？怎么样能省额度？谢谢。", "url": "https://www.v2ex.com/t/1256654#reply0", "date": "2026-11-12T23:19:36Z", "desc": "", "tags": [], "topic_score": 0, "source": "V2EX 最新", "cat": "AI实战_创作者", "weight": 3, "ts": 1794525576.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "TCL李东生谈AI：企业参与AI变革势在必行 但技术投入不必然转为商业价值", "url": "https://topics.caixin.com/2026-11-12/102504173.html", "date": "Thu, 12 Nov 2026 23:11:13 GMT", "desc": "AI发展带来三大变化，包括产品、竞争、商业模式和组织，但另一边高达2.6万亿美元的投入并不必然转化为商业价值，诸多AI企业能否继续发展还有待观察 11月12日，第17届财新峰会，TCL集团董事长李东生发言。图：财新 [查看更多峰会报道，请访问本届财新峰会首页。 可点此打开 ] 【财新网】 “当前全球经济面临诸多挑战，产业格局加速调整，中国企业发展面临严峻考验。同时，以人工智能为代表的新一轮科技革命正在深入发展，为产业转型开辟新的成长空间。”11月12日，TCL集团董事长李东生在“以发展应变局”的第17届财新峰会上，指出中国先进制造业实现转型目标有两条重要路径：一是AI技术应用，二是全球化。 李东生指出，AI的发展正在引发三个方面的变化。首先AI已经成为全球产业竞争的关键变量：“据市场研究机构预测，2026年全球人工智能投资将达到2.6万亿美元，巨额资金投入新的产业赛道将产生巨大的带动效应。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1794525073.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "图集｜故宫太和门封闭修缮 被红色围挡包裹成独特景观", "url": "https://photos.caixin.com/2026-11-12/102504084.html", "date": "Thu, 12 Nov 2026 23:11:13 GMT", "desc": "2026年11月10日，故宫博物院，游客在太和门前广场拍照打卡，远处的太和门正在修缮，被围挡严密地包裹起来。 【财新网】 近日，故宫太和门封闭修缮，仅门前的铜狮可供游客观看。施工过程中，太和门搭设脚手架并加装红色围挡，整座建筑成为故宫的独特景观。故宫博物院2026年7月31日发布公告：根据古建修缮工作计划，太和门自8月3日起封闭施工，重开时间视工程进度另行通知。 此次维修主要对太和门上下檐屋面及各脊处病害进行修缮。2026年4月10日，故宫博物院太和门屋面修缮工程竞争性磋商公告显示，太和门主体结构（包括基础、大木、墙体、屋顶）基本安全，历史上不同时期的修缮有效地保障了主体结构的安全稳定。但由于存在瓦件碎裂脱落、捉节夹垄灰脱落、屋面污染严重、檐头木构件糟朽、檐头处彩画油饰残缺不全等问题，影响着文物建筑安全与价值。参照《太和门现状勘察报告》中病害评估部分相关内容，需对上下檐屋面及各脊处病害进行", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1794525073.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "In reversal, American Cancer Society urges prostate cancer tests for all men", "url": "https://arstechnica.com/health/2026/11/in-reversal-american-cancer-society-urges-prostate-cancer-tests-for-all-men/", "date": "Thu, 12 Nov 2026 22:59:51 +0000", "desc": "Men aged 50–69 and at average risk should get PSA screening every two years.", "tags": [], "topic_score": 0, "so 万套。西部地区销售跌至1999年有记录以来最低，南部和中西部亦创逾十年新低。 尽管市场需求大幅萎缩，但库存上升与价格松动迹象正逐步浮现，或为疲软的市场带来一丝转机。NAR首席经济学家Lawrence Yun表示， 若房贷利率出现回落，当前受压抑的购房需求或将大规模释放。 高利率与通胀夹击，买家观望情绪浓厚 7%以上的房贷利率与持续高企的通胀是此轮成屋销售下滑的核心驱动因素。 对于大多数潜在买家而言，月供负担已显著超出其承受范围，购房决策被迫推迟。 NAR的住房可负担性指数——衡量普通家庭能否符合中位价格住宅贷款资格的指标——已降至2025年年中以来的最低水平，住房成本压力在此次中期选举中", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1794498003.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "Ukraine says Starlink restrictions are back as US envoys land in Moscow", "url": "https://www.ft.com/content/6cd890f1-2e4d-468a-807f-529f45e1678e?syn-25a6b1a6=1", "date": "Thu, 12 Nov 2026 14:29:01 GMT", "desc": "Army struggles to intercept Russian jet-powered drones, just as Steve Witkoff and Jared Kushner meet Vladimir Putin", "tags": [], "topic_score": 0, "source": "Financial Times", "cat": "金融媒体_英文", "weight": 2, "ts": 1794493741.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "Jensen Huang is gone. Will the AI industry pay the price?", "url": "https://www.ft.com/content/dd9072bd-e8a3-4f8e-9985-550aa80a2fd4?syn-25a6b1a6=1", "date": "Thu, 12 Nov 2026 14:22:30 GMT", "desc": "Nvidia chief’s fall could unravel the web of financial dependencies that helped fuel the AI boom", "tags": [], "topic_score": 0, "source": "Financial Times", "cat": "金融媒体_英文", "weight": 2, "ts": 1794493350.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "特朗普称美国不需要与伊朗达成协议，油价直线拉升", "url": "https://wallstreetcn.com/articles/3785827", "date": "Thu, 12 Nov 2026 21:20:55 +0800", "desc": "特朗普表示美国无需与伊朗达成协议，令中东局势前景更趋不明朗，市场对该地区供应风险的担忧重燃。 据央视新闻，当地时间11月12日， 美国总统特朗普表示，美国不需要与伊朗达成协议。 特朗普称，那样的日子早已过去。他声称，美国已经掌握了伊朗数千亿美元的资金以及霍尔木兹海峡。 话音一落，原油直线拉升，布油转涨，截至发稿，日内涨幅超过1%。 特朗普表示，副总统JD·万斯应把重点放在国内事务上，尤其是调查美国各地由民主党掌管的城市和州所涉腐败问题。而据媒体此前报道， 万斯正考虑与伊朗强硬派安全官员Mohsen Rezaei进行直接会谈 ，特朗普已向幕僚和外国对应方表示，支持万斯重启对伊谈判并授权其主导这一进程。 与此同时，伊朗方面也摆出 const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
