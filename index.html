块内部分化持续拉大。数据显示，前三季度19家白酒上市企业合计营收约2655.09亿元，同比下滑7.64%；合计净利润约973.65亿元，同比下滑9.44%。三季报印证了行业深度调整的现状：多数酒企主动控货，放弃短期规模来清理渠道库存。近期白酒板块股价反弹属于预期修复，多位市场人士认为，白酒行业基本面反转仍要等待春节旺季验证，机会集中在头部企业，行情有先后，阶段性反弹不等于趋势反转。", "tags": ["商业认知"], "topic_score": 3, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1793836863.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "宝玉 (@dotey)", "url": "https://sopilot.net/hot-tweets?tweetId=2118127825186177270", "date": "Wed, 04 Nov 2026 23:46:41 GMT", "desc": "OpenAI 推出 Images 2.6：能导出 SVG 矢量图，还能做 GIF 动图，出图快一半 OpenAI 11 月 4 日发布图像模型 Images 2.6，ChatGPT 和 Codex 所有档位的用户今天起都能用，电脑、手机和网页版都有。 这次一个重要变化是能把生成的图导出成 SVG 矢量图，可以直接拿去做网站、App 和印刷品。另外还能生成 GIF 动图，出图速度比上一版快 50%，改图时能更准确地只改指定的地方。 开发者可以通过 API 调用这个模型。API ❤️ 37 🔁 6 💬 19 🔖 26 👀 6559 预测爆火概率:100%，预测浏览量:55000，预测评论浏览量:200 原推链接: https://x.com/dotey/status/2118127825186177270", "tags": [], "topic_score": 0, "source": "SoPilot 推特起爆帖", "cat": "X起爆帖", "weight": 6, "ts": 1793836001.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "工业AI应用场景加快落地，机器视觉产业链迎来业绩验证窗口。从视觉系统集成到下游需求变化，海外龙头近期动向为观察机器视觉行业提供了新线索。德国厂商Basler介...", "url": "https://www.huxiu.com/moment/1294151.html", "date": "Wed, 04 Nov 2026 23:32:47 GMT", "desc": "工业AI应用场景加快落地，机器视觉产业链迎来业绩验证窗口。 从视觉系统集成到下游需求变化，海外龙头近期动向为观察机器视觉行业提供了新线索。德国厂商Basler介绍了镜头与光源协同控制方案，基恩士披露区域及行业销售表现，康耐视即将公布新一季业绩。同时，国内相关企业三季报已披露，工业AI应用能否转化为经营增量，有了更具体的观察样本。分析人士认为，应用扩展、收入增长与利润改善并非同步发生。观察机器视觉产业链，既要识别AI应用带来的业务增量，也要区分研发投入、业务结构及非经常性因素的影响，进一步检验增长的持续性。", "tags": ["企业落地"], "topic_score": 3, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1793835167.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "Orange AI (@oran_ge)", "url": "https://sopilot.net/hot-tweets?tweetId=2118117429201220057", "date": "Wed, 04 Nov 2026 23:05:22 GMT", "desc": "人为了逃避真正的问题，愿意做任何事情。 一个开发者说，Claude 和 Codex 快把他搞破产了。 他给 Claude 一个指令，看着它把东西造出来，检查一下，再想下一步改哪儿。永远有下一件事可做，每一次坐下来都觉得自己很有产出。而且全程不用拿给任何人看，很舒服。 可把 app 拿到别人面前就不同了。可能被忽略，可能被问一句这有什么用，也可能被告知已经在用别的了。于是“再做得完美一点”就成了现成的借口，还差一个功能，设计还能再好，等弄好再找人。Claude 随时陪着，他想做多久都行。 ❤️ 40 🔁 5 💬 16 🔖 18 👀 5263 预测爆火概率:79%，预测浏览量:31000，预测评论浏览量:200 原推链接: https://x.com/oran_ge/status/2118117429201220057", "tags": [], "topic_score": 0, "source": "SoPilot 推特起爆帖", "cat": "X起爆帖", "weight": 6, "ts": 1793833522.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26, "title_zh": "Orange AI（@oran_ge）"}, {"title": "8-K - Kinetik Holdings Inc. (0001692787) (Filer)", "url": "https://www.sec.gov/Archives/edgar/data/1692787/000169278726000142/0001692787-26-000142-index.htm", "date": "2026-11-04T17:30:51-05:00", "desc": "Filed: 2026-11-04 AccNo: 0001692787-26-000142 Size: 1 MB Item 2.02: Results of Operations and Financial Condition Item 9.01: Financial Statements and Exhibits", "tags": [], "topic_score": 0, "source": "SEC 最新 8-K 申报", "cat": "企业行为_美股披露", "weight": 6, "ts": 1793831451.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "8-K - Medicus Pharma Ltd. (0001997296) (Filer)", "url": "https://www.sec.gov/Archives/edgar/data/1997296/000106299326005748/0001062993-26-005748-index.htm", "date": "2026-11-04T17:30:39-05:00", "desc": "Filed: 2026-11-04 AccNo: 0001062993-26-005748 Size: 340 KB Item 7.01: Regulation FD Disclosure Item 9.01: Financial Statements and Exhibits", "tags": [], "topic_score": 0, "source": "SEC 最新 8-K 申报", "cat": "企业行为_美股披露", "weight": 6, "ts": 1793831439.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "8-K - cbdMD, Inc. (0001644903) (Filer)", "url": "https://www.sec.gov/Archives/edgar/data/1644903/000143774926034991/0001437749-26-034991-index.htm", "date": "2026-11-04T17:28:37-05:00", "desc": "Filed: 2026-11-04 AccNo: 0001437749-26-034991 Size: 358 KB Item 2.01: Completion of Acquisition or Disposition of Assets Item 2.03: Creation of a Direct Financial Obligation o alse, "rank": 17}, {"title": "欧洲至少7个航班同日收到炸弹威胁信息 涉事客机均平安降落", "url": "https://international.caixin.com/2026-11-04/102501047.html", "date": "Thu, 05 Nov 2026 00:08:05 GMT", "desc": "专家认为，可能的解释包括一宗威胁引发了模仿、同一个人或团体发出多次威胁，以及国家行为体或其支持者参与的“混合战”行动 当地时间2026年11月2日，匈牙利布达佩斯，维兹航空的一架客机停在布达佩斯李斯特·费伦茨国际机场的停机坪上。图：视觉中国 【财新网】 当地时间11月3日，欧洲至少7个客运航班收到了炸弹威胁信息，涉及飞往波兰、西班牙、意大利和保加利亚的航线。 事发后，各国相继启动安全检查，部分飞机改降，机场一度暂停运行，意大利空军还出动战机护航。所有涉事飞机均安全降落，检查未发现爆炸物。截至发稿，尚无个人或组织宣称负责。 受影响航班分别由波兰航空、北欧航空、维兹航空和瑞安航空运营。其中，瑞安航空至少4个航班受到威胁，分别从里斯本和都柏林飞往罗马、从曼彻斯特飞往穆尔西亚，以及从都柏林飞往索非亚。其余包括两班飞往华沙的客机，以及一班从意大利贝加莫飞往索非亚的维兹航空客机。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1793837285.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "外汇收支便利化支持跨境贸易 拓宽外汇支付业务范围", "url": "https://finance.caixin.com/2026-11-04/102501036.html", "date": "Thu, 05 Nov 2026 00:08:05 GMT", "desc": "拟推出9项经常项目便利化政策，5项为拓宽业务适用场景、范围和种类，4项是进一步降低企业资金结算和交易成本 《征求意见稿》拟对保险机构提出多项优化政策，扩大保险机构外汇资金运用账户收支范围，并同时要求托管银行做好上述账户资金划转情况的记录。图：IC photo 【财新网】 为更好地发挥外汇支持实体经济发展作用，便利经常项下跨境资金结算，支持贸易创新发展，促进高水平对外开放，2026年11月2日，国家外汇管理局发布《关于进一步优化经常项目外汇管理有关事项的通知（征求意见稿）》（下称《征求意见稿》）。 《征求意见稿》提出的多项优化举措覆盖了银行、跨境支付机构、保险机构、租赁机构等。具体包括9项经常项目便利化政策、1项监管要求；其中，9项经常项目便利化政策中，5项为拓宽业务适用场景、范围和种类，4项是进一步降低企业资金结算和交易成本。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1793837285.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "安世荷兰起诉闻泰科技 索赔20亿美元", "url": "https://www.caixin.com/2026-11-04/102501042.html", "date": "Thu, 05 Nov 2026 00:03:53 GMT", "desc": "闻泰不认可安世荷兰的全部指控及索赔金额 闻泰披露的诉讼信息显示，安世荷兰认为，安世中国、安世上海违反与安世荷兰签订的相关内部协议，被告自建中国区供应链，干扰安世荷兰正常运营并形成直接竞争。图：视觉中国 【财新网】 安世荷兰与股东闻泰科技的拉锯战又有新进展。11月3日晚间，*ST闻泰（600745.SH，闻泰科技）公告称，已就法院指定的安世境外股份管理人公司提出的安世股权结构调整方案回函；同时，安世荷兰主体已在荷兰阿姆斯特丹地方法院起诉闻泰及相关关联主体，索赔20亿美元。 闻泰披露的诉讼信息显示，安世荷兰认为，安世中国、安世上海违反与安世荷兰签订的相关内部协议，被告自建中国区供应链，干扰安世荷兰正常运营并形成直接竞争。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1793837033.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "单伟建：中国楼市企稳迹象日益明显 消费有望提升", "url": "https://www.caixin.com/2026-11-04/102500934.html", "date": "Thu, 05 Nov 2026 00:03:53 GMT", "desc": "他看好物业管理行业，认为该行业既能带来稳定现金流，又能适应民生所需 太盟投资集团（PAG）执行董事长兼联合创始人单伟建认为，近期中国房地产市场回稳的迹象已日益明显，有望带动居民消费改善。 【财新网】 “房地产市场不止跌企稳的话，消费很难改善。”太盟投资集团（PAG）执行董事长兼联合创始人 单伟建 认为，近期中国房地产市场回稳的迹象已日益明显，有望带动居民消费改善。 单伟建出席11月4日在香港举办的“2026年国际金融领袖投资峰会”后对财新等媒体作出上述表达。中国家庭持有的现金约30万亿美元，超过国內生产总值50%，其中包括25万亿的家庭存款。这一现象反映出房地产市场低迷拖累消费信心，带来家庭资产负债表收缩。 太盟10月下旬与 中国恒大 清盘人订立协议，拟斥资40.26亿港元，向恒大及旗下全资控制的BVI持股平台CEG Holdings收购 恒大物业 （06666.HK）累计51.016%的", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1793837033.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "【商圈】多面傅成玉：“自己战胜不了自己”", "url": "https://database.caixin.com/2026-11-03/102500473.html", "date": "Thu, 05 Nov 2026 00:03:53 GMT", "desc": "“战场上可以打败敌人，商场上可以战胜对手，往往自己战胜不了自己。这也是个规律。”傅成玉在2014年3月对财新如是说 当地时间2014年3月24日，香港，中石化召开年度发布会，傅成玉出席。图：视觉中国 【财新数据专稿】 2026年10月31日周六下午5点半，中央纪委国家监委网站公告： 中国石油化工集团 （下称“中石化集团”）原党组书记、董事长 傅成玉 涉嫌严重违纪违法，目前正接受中央纪委国家监委纪律审查和监察调查。 当日上午，财新通过多个渠道获知，年满75岁、已卸任退休11年多的傅成玉，于两天前被有关部门从家中带走调查。 这一消息并不太令人意外。一方面，石油石化领域经济利益巨大，深耕数十年、身居央企高位，“拒腐”难度必然大，且该领域在过去十余年都是“腐败高发区”；另一方面，傅成玉退休后多年，虽然一直活跃在能源、双碳、企业治理相关的学术、论坛与国际顾问平台，但他对曝光场合、交流时机也有所选择，", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1793837033.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "图集｜美国中期选举：深红得州翻蓝 共和党38年来首次丢掉参议院席位", "url": "https://photos.caixin.com/2026-11-04/102500855.html", "date": "Thu, 05 Nov 2026 00:03:53 GMT", "desc": "当地时间2026年11月3日，美国得克萨斯州奥斯汀，得克萨斯州民主党联邦参议员候选人詹姆斯·塔拉里科出席选举之夜集会。图：Kaylee Greenlee/IC photo 【财新网】 当地时间2026年11月3日晚，美国选举数据分析机构决策台总部网站预测，得克萨斯州民主党联邦参议员候选人詹姆斯·塔拉里科将击败共和党候选人肯·帕克斯顿，成为1988年以来首名在该州赢得联邦参议院席位的民主党人。 位于美国南部的得州是共和党传统票仓，过去三届总统选举中均支持特朗普。有分析认为，民主党在得州的胜利是一个重大时刻：一 国 【财新网】 近日网传南京大学统计课堂抬头率、挂钩平时分，引发热议。财新了解到，多家高校已引进AI智慧教室系统，智能统计抬头率、到课率等数据。 11月4日，南京大学本科生院与信息化建设管理服务中心发布说明，回应外界对智慧教室系统记录到课率、抬头率等功能的关注。说明称，当前学校智慧教室系统已不再统计抬头率数据；网传“期中教学检查是上级部门检查、到课率将与平时成绩挂钩”等信息均不属实；未经授权，该校智慧教室系统在教学应用中不采集人脸等生物特征信息，不进行人脸识别。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1793836322.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "珠海国资委表态争取多方协同 协助华发集团应对阶段性挑战", "url": "https://finance.caixin.com/2026-11-04/102501030.html", "date": "Wed, 04 Nov 2026 23:33:11 GMT", "desc": "珠海市表示正通过整合重组资源、市场化运作等方式，帮助华发集团加快存量资产盘活，多措并举化解周期性压力 据财新此前了解，现阶段，属地政府纾困华发集团主要聚焦两方面，一是安排华发集团出售旗下资产给其他国资企业，尽快筹集资金；另外是协调金融机构为华发集团提供支持。图：IC photo 【财新网】 珠海华发集团有限公司 （下称“华发集团”）近期流动性承压，属地政府设法展开救助，部分纾困措施正逐步落地。 据《21世纪经济报道》2026年11月4日报道，珠海市通过整合重组资源、市场化运作等方式，已落地支持资金超过400亿元；后续还将统筹各类资源近700亿元，全力支持华发集团应对阶段性挑战，推动业务转型升级。珠海市国资委主任邹晖称，珠海持续深化国资国企改革，推进国资布局优化与资源统筹，夯实国有经济压舱石作用。他指出，华发集团当前面临的是阶段性挑战，由行业周期下行叠加历史包袱所造成。珠海国资委不仅要用足用", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1793835191.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "民主党重掌国会，特朗普承认伊战是败选部分原因", "url": "https://finance.caixin.com/2026-11-05/102501096.html", "date": "Wed, 04 Nov 2026 23:32:42 GMT", "desc": "推荐：A股迎来大奇迹日，科创50暴涨近10%；“China Haul”海外刷屏，中国购为何火爆？ 早上好，今天是11月5日星期四。过去24小时，哪些财经新闻对普通人影响更大，未来又有什么焦点事件被市场密切关注，早知道栏目从新闻汇总到快速解读，为你一网打尽。 24小时热点 11月3日的美国中期选举中， 民主党大获全胜，重夺国会参众两院主导权 。特朗普没有质疑选举结果的有效性， 他表示伊战是共和党败选部分原因，但并不后悔今年2月发动的这场战争 。他还称准备与民主党合作，但如果需要，将行使他的“否决权”。 中期选举会否让中美关系出现新可能性？外交部表示， 中期选举是美国内政 ， 中方愿继续同美方一道维护好、落实好两国元首重要共识 ，加强沟通，妥处分歧，拓展合作，构建基于尊重、公平、对等的中美建设性战略稳定关系。 11月4日，A股午后急拉大幅反弹，科创50暴涨近10%。 三大指数集体上涨，全市场成", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1793835162.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "Nintendo's biggest ROM chip supplier is bowing out of the business", "url": "https: "ts": 1793802677.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "一线直击香港金融科技周：机器人谈复购，智能体找入口", "url": "https://wallstreetcn.com/articles/3785197", "date": "Wed, 04 Nov 2026 21:42:34 +0800", "desc": "今年的香港金融科技周，AI无疑是核心议题。 11月2日，第11届香港金融科技周x StartmeupHK 2026在香港拉开帷幕，活动将持续至11月6日。在已经举行的两天主论坛上，除了银行、保险、支付等传统金融科技议题，具身智能、自动驾驶、算力基础设施乃至商业航天等前沿产业，成为讨论焦点。 这场举办了十余年的行业大会，正在突破传统金融科技的边界。 香港金融科技周承办方Finoverse联合创始人兼联席首席执行官Vila Wong向华尔街见闻表示，过去大会主要吸引银行、保险及大型金融科技企业参与，如今越来越多AI企业和科技初创公司加入。今年大会超过一半的讨论内容与AI相关，投资者通行证申领量也创下历年新高。 变化不仅发生在参会企业和论坛议题上。 在具身智能领域，企业开始讨论机器人量产、模型与硬件协同、商业化交付等问题；在传统金融行业，AI智能体则正在尝试进入银行尽调、保险理赔、财富管理，甚至", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793799754.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "美国10月ADP新增就业8.6万人超预期，连续16个月增加，跳槽者薪资创两年半最快增速", "url": "https://wallstreetcn.com/articles/3785194", "date": "Wed, 04 Nov 2026 21:37:42 +0800", "desc": "美国私营部门就业市场在10月延续增长势头。 当地时间周三， ADP公布的数据显示，美国10月私营部门新增就业人数8.6万人，与经下修后的9月数据基本持平，高于市场预期的6.7万人，显示劳动力市场出现企稳迹象。 从行业分布来看，就业增长主要来自服务业。其中，贸易、运输和公用事业新增3.9万个岗位，教育和医疗服务新增2.8万个，休闲和酒店业新增1.9万个。金融活动、建筑业及其他服务业也实现增长，分别新增1.5万、1.3万和1万个岗位。 不过，部分行业就业人数出现下降。 专业和商业服务业减少2.7万个岗位，自然资源和采矿业减少8000个，信息服务业减少2000个。后者可能受到人工智能基础设施建设的影响。 跳槽者薪资涨幅加快 薪资方面，劳动力流动带来的收入增长更加明显。 ADP数据显示， 跳槽员工薪资同比增长4.8%，创2024年3月以来最快增速 ；留任员工薪资同比增长3%。整体员工基本工资同比增", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793799462.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "华为智驾之外，车企给出“Plan B”", "url": "https://wallstreetcn.com/articles/3785196", "date": "Wed, 04 Nov 2026 21:37:09 +0800", "desc": "作者 | 周智宇 前几年，哪款车能率先用上新一代华为乾崑智驾，是新车发布会上的一个看点。如今，拿着相近的预算挑一辆家用SUV或MPV，买家已经能找到不止一款搭载同档乾崑的车。 市场的变化，已反映在车企的价目表上。11月3日，东风奕派M8加推两款天元激光版。三个多月前，这款六座SUV上市，五个版本用的都是华为乾崑。用车企习惯的话术，是“标配华为乾崑”。 不过这次，东风保留了原来的乾崑版，又给纯电车型配上了自家的辅助驾驶和座舱，把纯电M8的起步指导价从19.98万元降到17.98万元。 乾崑依然是块好招牌。尤其对从燃油车转过来的品牌，消费者原本熟悉的是它的发动机、底盘和空间，有了华为，少费些口舌就能让人愿意试一试它的智驾。只是当同级车也用上了同一套系统，这份好感会把人带进哪家店，就难说了。 眼下，一款车型的热销期已大幅缩短，靠首搭一套智驾方案赢来的优势，却可能只有几个月。过去大家抢的是谁先用上", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793799429.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "民主党浪潮席卷国会，华尔街为何反手做多？", "url": "https://wallstreetcn.com/articles/3785191", "date": "Wed, 04 Nov 2026 21:21:39 +0800", "desc": "美国中期选举结果令华盛顿震动，却未能动摇华尔街。民主党在参众两院双双夺回多数席位，德克萨斯州州长席位易主，这是一代人以来最大规模的政治反转——但股市的回应是买入。 纳斯达克100指数期货在选举夜最深跌幅达2.4%，随后在纽约早盘翻升0.9%，从夜盘低点反弹约929点。高盛和德意志银行均发布研究报告，认为这波反弹具备持续基础。核心逻辑在于：选前积累的大量对冲头寸在事件落地后集中平仓，形成被动推涨动力。 此次选举结果对市场的结构性影响仍不容忽视。德克萨斯州新任候任州长Gina Hinojosa明确表示，在更全面的监管框架通过前不会解除数据中心建设许可冻结，这直接冲击了AI基础设施投资预期。与此同时，债务上限将于明年二季度触发，共和党能否在新国会就任前完成独立提限，已成为市场最大不确定性来源。 七席翻转，民主党开创历史 民主党原需净增四个参议院席位，最终拿下七席，分别赢得爱荷华州、堪萨斯州、缅因", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793798499.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "Meta首次叩门欧元债市，530亿欧元认购需求创历史纪录", "url": "https://wallstreetcn.com/articles/3785192", "date": "Wed, 04 Nov 2026 21:13:37 +0800", "desc": "Meta Platforms首次进军欧元债券市场，吸引投资者创纪录的认购需求。 据彭博周三报道，知情人士透露， Meta首次发行欧元债券获得530亿欧元（约合597亿美元）的投资者认购需求，创下历史纪录。Meta此次计划通过六档欧元债券发行筹集至多90亿欧元，预计于周三晚些时候定价。 此次发行是Meta首次在美国本土市场之外发行债券。就在此前一天，Meta刚刚完成150亿美元的美元债发行。连续登陆美元和欧元债市，凸显出这家科技巨头正积极拓展融资渠道，为人工智能（AI）基础设施投资提供资金支持。 六档债券覆盖近40年期限 据知情人士透露，Meta此次欧元债券发行分为六档，期限分别为4年、6年、8年、12年、18年及38年以上。 其中，最短期限债券的初步定价指引较中期互换利率溢价约140个基点，最长期限债券的利差指引约为370个基点。花旗集团和摩根士丹利担任此次发行的主承销商。 投资者对Met", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793798017.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "法拉利在华发货降四成，利润为何反增？", "url": "https://wallstreetcn.com/articles/3785189", "date": "Wed, 04 Nov 2026 20:42:02 +0800", "desc": "法拉利发往中国市场的汽车进一步减少，全球利润却继续增长。 11月3日，法拉利发布三季报，三季度大中华区发货143辆，同比下降42.3%；同期全球营收18.96亿欧元，同比增长7%，营业利润5.63亿欧元，同比增长12%，营业利润率升至29.7%。 区域结构解释了其中一部分原因。大中华区当季发货占全球的比重已降至约4.2%。欧洲、中东及非洲、美洲和其他亚太市场的增长，抵消了这里的大部分减量，全球发货3368辆，同比仅减少33辆，降幅约1%。 因此，中国市场的大幅下滑，尚未给法拉利全球业务带来同等程度的冲击。其他市场仍能承接需求，使公司有空间在区域销量承压时维持整体经营，而不必急于通过降价补量。 利润增长的另一端，是交付车辆的构成发生变化。法拉利将本季度营业利润增长主要归因于F80带来的产品组合改善，以及个性化选装增加。售价约360万欧元的限量超级跑车F80自2025年第四季度开始交付，本季发", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793796122.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "宝马预计汽车利润率逼近零，新世代能否救场？", "url": "https://wallstreetcn.com/articles/3785190", "date": "Wed, 04 Nov 2026 20:39:16 +0800", "desc": "国产新世代iX3即将交付，宝马却先下调了盈利预期。 11月3日，宝马集团今年第二次下调汽车业务利润率预期。公司预计，2026年汽车业务息税前利润率介于负0.5%和正0.5%之间，此前的预期为1%至3%。部分旧车型提前停产，组织调整也将提速，相关费用会计入第四季度。 11月4日公布的三季报显示，宝马汽车业务当季息税前利润率为3.4%，比去年同期低1.8个百分点。宝马估计，这轮调整将拉低全年汽车业务利润率约2.5个百分点。剔除这部分影响，全年利润率预计仍高于2%。 宝马正在为新一轮产品周期提前承担成本。但在中国，支撑换代的销量基础也在收缩，前三季度，BMW和MINI合计交付同比下降21.8%，欧洲和美国的增长尚不足以补上缺口。新世代因此被寄予双重期待，既要吸引客户，也要改善电动车的盈利能力。 8月开启预订的国产iX3，计划11月交付，起价26.99万元，并实行全国统一价。从定价到销售方式，宝马", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793795956.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "AMD的AI反击战：Helios放量，CPU业务再添一把火", "url": "https://wallstreetcn.com/articles/3785182", "date": "Wed, 04 Nov 2026 20:28:48 +0800", "desc": "AMD的AI反击战，正在从GPU单点突破转向数据中心业务的全面扩张。 在最新公布的2026年第三季度财报中， AMD数据中心业务收入达到85亿美元，同比大增97%，成为推动业绩增长的核心引擎。 与此同时，公司的AI加速器平台MI455X Helios开始进入交付爬坡阶段，服务器CPU需求也持续升温。 AMD预计，2027年公司整体营收增长将超过80%，数据中心业务收入占比将超过八成。 这份增长蓝图迅速获得华尔街关注。 花旗将AMD列为大型成长型计算芯片股首选，目标价定在800美元 ；高盛维持买入评级，预计数据中心业务将支撑公司2027年营收增长超过80%。摩根大通虽然也上调了盈利预测和目标价，却仍维持中性评级。 AMD正在试图证明：它的AI增长故事，不只有GPU。 Helios开始爬坡，AMD加速切入AI基础设施 三季度，AMD营收达到134亿美元，同比增长45%；其中数据中心业务收入85", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793795328.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "特朗普中期选举受挫，反数据中心势力悄然崛起", "url": "https://wallstreetcn.com/articles/3785179", "date": "Wed, 04 Nov 2026 19:33:54 +0800", "desc": "民主党横扫美国中期选举，重塑全球科技与产业格局。 民主党在德克萨斯、佐治亚等关键州赢得州长选举，部分候选人明确承诺对数据中心建设实施暂停令。这一结果令市场对AI基础设施扩张前景产生疑虑——亚洲芯片股周三普遍下跌，美债收益率随之回落，纳斯达克指数近一个月已累计回调约8%。 对于韩国企业而言，此次选举结果的影响喜忧参半。 三星电子、SK海力士等芯片制造商忧虑数据中心监管趋严将压制服务器DRAM及高带宽内存需求；与此同时，韩国汉华解决方案等太阳能企业则期待民主党推动《通胀削减法案》清洁能源税收抵免政策的恢复，从中受益。 数据中心反弹情绪蔓延，科技股承压 此次中期选举中，数据中心反对派的胜选规模令市场始料未及。在德克萨斯州，GLJ Research估计该州约占美国至2030年将投入使用数据中心容量的四分之一。民主党人Gina Hinojosa击败共和党籍现任州长Greg Abbott，终结了共和党", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793792034.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "AI on the Ballot", "url": "https://stratechery.com/2026/ai-on-the-ballot/", "date": "Wed, 04 Nov 2026 11:00:00 +0000", "desc": "Data Centers were on the ballot, and they lost in a major way; what does it mean if American opposition to building is permanent?", "tags": [], "topic_score": 0, "source": "Stratechery", "cat": "创投行业分析", "weight": 2, "ts": 1793790000.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "泰国要抬高纯电车进口门槛了", "url": "https://wallstreetcn.com/articles/3785178", "date": "Wed, 04 Nov 2026 18:27:02 +0800", "desc": "四年前，比亚迪把ATTO 3卖到泰国，车是当地经销商Rêver从中国进口的。今年9月，比亚迪罗勇工厂下线了第10万辆车，恰好也是一辆ATTO 3。 11月3日，泰国内阁通过汽车消费税调整草案，拟从2027年元旦起，将部分进口纯电车的消费税率从10%提至35%，进口增程车的相应税率从15%提至35%。符合现行鼓励政策的泰国产纯电车，仍按2%缴税。 Rêver公开表示赞成。它卖的腾势还要从中国运，但它也在和比亚迪商量，把更多车型放到罗勇造。 Rêver集团首席执行官Pratarnwong Phornprapha对泰国媒体说，过去谈泰国车市，人们习惯把中国车企和日本车企分成两边。如今他更在意的是，同样在泰国卖车，哪些公司已经投了钱、向当地供应商买零件，哪些只做整车进口的生意。 泰国当初为招揽电动车厂，允许车企先进口一批车，随后按约定比例在当地生产。几年过去，工厂确实一家家开了起来，进口新车的生意", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793788022.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "中选惨败后，特朗普对伊朗态度软化，称“可能没必要再打”", "url": "https://wallstreetcn.com/a const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
