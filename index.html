ate": "Mon, 12 Oct 2026 00:00:00 -0400", "desc": "arXiv:2606.15419v2 Announce Type: replace Abstract: Objective: To enhance the accuracy, interpretability, and robustness of large language models (LLMs) in medical question answering (MedQA). Method: We designed a multi-agent peer-reviewed reasoning method in which multiple LLM agents independently generate chain-of-thought reasoning with candidate answers, then act as peer reviewers to evaluate e", "tags": ["AI"], "topic_score": 5, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1791777600.0, "opinion": true, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "AutoIndexer: Flexible-Order Decoding by Training Causal Models on Chains of Edits", "url": "https://arxiv.org/abs/2610.12545", "date": "Mon, 12 Oct 2026 00:00:00 -0400", "desc": "arXiv:2610.12545v1 Announce Type: new Abstract: Autoregressive decoding is less suited to non-causally ordered data, e.g., cross-references or future dependencies, since their outputs cannot be revised post hoc, unlike iterative human reasoning. Diffusion LLMs partially mitigate this limitation but still cannot flexibly insert or remove arbitrary numbers of tokens from a pre-generated context. We ", "tags": ["AI"], "topic_score": 3, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1791777600.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "SWE-Duel: Towards a Self-Scaling Arena for Coding Agents", "url": "https://arxiv.org/abs/2610.12569", "date": "Mon, 12 Oct 2026 00:00:00 -0400", "desc": "arXiv:2610.12569v1 Announce Type: new Abstract: Static coding benchmarks are fixed at release. Over time their tasks leak into training data, and stronger agents eventually saturate them. We argue that a benchmark should instead aim to be self-scaling: its tasks and oracles are created at evaluation time, so no content exists in advance to leak, and its difficulty is set by the participating agent", "tags": ["AI"], "topic_score": 3, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1791777600.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "GeoFitBench-LLM: A Benchmark for Assessing Large Language Models' Capabilities in Geospatial Data Requirements Elicitation for Geo-Analytic Tasks", "url": "https://arxiv.org/abs/2610.12669", "date": "Mon, 12 Oct 2026 00:00:00 -0400", "desc": "arXiv:2610.12669v1 Announce Type: new Abstract: Large language models are becoming central to GeoAI systems, yet their evaluation rarely considers the elicitation of geospatial data requirements. This omission is critical as retrieval oriented geo-analytic tasks cannot be supported reliably without first identifying the necessary datasets and constraints. GeoFitBench-LLM is introduced as a benchma", "tags": ["AI"], "topic_score": 3, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1791777600.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "U4RASD at KnowledgeGraphEval-2026: Ontology-Constrained Encoder and LLM Systems for Arabic Relation Extraction", "url": "https://arxiv.org/abs/2610.12742", "date": "Mon, 12 Oct 2026 00:00:00 -0400", "desc": "arXiv:2610.12742v1 Announce Type: new Abstract: This paper details our submission to KnowledgeGraphEval 2026 Subtask 2 on directed Arabic relation extraction. We explored encoder-based and large language model approaches for predicting one of 40 relations or no_relation from an Arabic sentence and a subject-object pair. Our encoder systems use typed entity markers and separate relation-existence a", "tags": ["AI"], "topic_score": 3, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1791777600.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "Surfing the Activation Wave: Analyzing the Information and Geometry of LLM Hidden States for Spec h the next proposal is generated. Prior work reduces this cost ", "tags": ["AI"], "topic_score": 3, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1791777600.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "Agreement Without Alignment: Label-Free Rubric Clarification Increases LLM-Judge Consensus but Not Agreement with Humans", "url": "https://arxiv.org/abs/2610.13303", "date": "Mon, 12 Oct 2026 00:00:00 -0400", "desc": "arXiv:2610.13303v1 Announce Type: new Abstract: LLM judges are increasingly deployed as panels, and disagreement among panel members is often read as a symptom of an unclear rubric. We test a label-free procedure that turns this disagreement into rubric repairs. The procedure decomposes each rubric into sub-criteria, ranks them by cross-judge disagreement on a development split, and has an editor ", "tags": ["AI"], "topic_score": 3, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1791777600.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "刚刚，神秘Claude Next偷跑上线，4行提示手搓3D电影级大片", "url": "https://www.36kr.com/p/4022339459993481", "date": "Mon, 12 Oct 2026 03:47:59 GMT", "desc": "Anthropic，怕是又憋了个大的！ 明明选的还是Opus 5.5，出来的效果却像换了个模型。 这两天，多位开发者、爆料人接连晒出Claude实测，越测越怀疑： 后台是不是悄悄接上了新一代模型？ 全新 Opus、Opus 5.6 ，甚至 Fable 5.5 ……猜什么的都有，也有人直接把它叫作 「Claude Next」 。 这波实测里，开发者Chetaslua晒出的动画，直接把人看愣了。 4行提示词，跑了2小时，Claude把一个人的一生画完了。 最让人头皮发麻的是，这些惊艳的画面， 全是JS逐帧画出来的 。 从胚胎、门框下量身高的小女孩，到独自坐回扶手椅的老人，30秒走完一生。同一把椅子在前后呼应，代码也开始会讲故事了。 在多轮动画、视频实测后，AI大佬Chetaslua直接将其封为「 Claude Next Model 」统治级的存在。 我本以为还要一个月，才能让图像和视频生成模型", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1791776879.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "How one bug bounty researcher chooses the features they investigate", "url": "https://github.blog/security/how-one-bug-bounty-researcher-chooses-the- 癌——一种年发病率仅为百万分之一的罕见恶性肿瘤。此后十余年，他辗转北京协和医院和美国MD安德森癌症中心，历经两次大手术、五次复发转移、四次急诊抢救、六轮放疗、三轮临床试验，于2025年正式达到术后五年无复发的临床治愈标准。 2022年，他将这段中美求医经历写成近40万字的非虚构作品 《无国界病人》 。书出版后，成百上千的病友通过微博、 小红书 找到他，最多时一天收到20多封附着诊断书与CT报告的私信。随着结识与帮助的病友越来越多，他看到一片更为广阔的疾病图景：遗传性癌症的家族传递、运动康复的医学证据，以及全球鲜为人知的免费医疗资源和先进治疗模式", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1791850173.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "韩试验高超音速飞行器后朝鲜再度试射导弹 日韩戒备应对", "url": "https://international.caixin.com/2026-10-12/102492626.html", "date": "Tue, 13 Oct 2026 00:09:33 GMT", "desc": "此次导弹发射发生之际，半岛局势还因非军事区地雷爆炸事件趋于紧张 当地时间2026年10月12日，韩国首尔，首尔站的屏幕上播放着有关朝鲜导弹发射的新闻报道画面。图：视觉中国 【财新网】 当地时间10月12日上午，朝鲜从平壤附近向朝鲜半岛东部海域发射至少两枚弹道导弹，其中一枚飞行超过900公里。这是朝鲜进入10月以来第二次发射弹道导弹，也是继10月3日后时隔九天再次射弹。 韩国联合参谋本部当天通报称，韩国军方从上午9时20分许开始，探测到朝鲜从平壤一带向东部海域发射数枚不同类型的弹道导弹，其中至少一枚飞行超过900公里。联合参谋本部公报室长张道英表示，韩美情报部门正在分析导弹的具体参数，目前尚不能确定其是否属于高超音速武器或中程弹道导弹。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1791850173.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "【商圈】郑钦文逆风翻盘 Queen Wen不止在球场", "url": "https://database.caixin.com/2026-09-21/102486935.html", "date": "Tue, 13 Oct 2026 00:09:33 GMT", "desc": "郑钦文已成为人们谈论中国网球时绕不开的一个名字，更迅速成为中国运动员商业价值的“天花板” 2026年10月11日，北京，2026中国网球公开赛女单决赛，郑钦文夺冠。图：视觉中国", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1791850173.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "Meta Reaches AI’s Crowded Frontier—Will Users Care?", "url": "https://www.theinformation.com/articles/meta-reaches-ais-crowded-frontier-will-users-care", "date": "2026-10-13T00:07:17Z", "desc": "", "tags": [], "topic_score": 0, "source": "The Information", "cat": "金融媒体_英文", "weight": 3, "ts": 1791850037.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "聚焦｜没有印钞机的央行， ve energy security and accelerate fragmentation", "tags": [], "topic_score": 0, "source": "Financial Times", "cat": "金融媒体_英文", "weight": 2, "ts": 1791825259.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "Zuckerberg says Meta has reached AI ‘frontier’", "url": "https://www.ft.com/content/fca23e77-be57-4d7e-ae61-74ff299e25cb?syn-25a6b1a6=1", "date": "Mon, 12 Oct 2026 17:00:02 GMT", "desc": "FT interview: tech billionaire touts release of new Muse Wonder model after vast spending to challenge rivals in AI race", "tags": [], "topic_score": 0, "source": "Financial Times", "cat": "金融媒体_英文", "weight": 2, "ts": 1791824402.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "Meta Says New Muse Model Hits AI Frontier After Aggressive Push", "url": "https://www.bloomberg.com/news/articles/2026-10-12/meta-says-new-muse-model-reaches-ai-frontier-after-14-month-push", "date": "Mon, 12 Oct 2026 16:56:51 GMT", "desc": "The Muse Wonder model will be a key test for Meta’s expensive and rebuilt superintelligence team.", "tags": [], "topic_score": 0, "source": "Bloomberg Technology", "cat": "金融媒体_英文", "weight": 2, "ts": 1791824211.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "最高支持3.2万个CPU核心！AMD推出Helion智能体AI机架，兼顾纯CPU与GPU混合配置", "url": "https://wallstreetcn.com/articles/3783464", "date": "Tue, 13 Oct 2026 00:19:03 +0800", "desc": "AMD推出面向智能体AI的专用机架计算平台Helion，将开放硬件架构与集成式模型路由能力相结合，进一步拓展其在AI基础设施市场的布局。 10月12日， AMD在加利福尼亚州圣克拉拉宣布推出Helion机架。该平台基于开放计算项目（Open Compute Project，OCP）规范设计，并搭载AMD自研计算芯片。 AMD高级副总裁Dan McNamara表示，智能体AI涵盖个人代理、企业应用、代码执行及复杂工作流等多种场景，不同任务对算力的需求差异显著， Helion旨在通过灵活的架构满足多样化需求 。 Helion内置集成式令牌路由器（token router），可将AI智能体的模型调用请求自动分发至前沿模型或开源模型，并适配不同推理后端。AMD还计划将Helion规范贡献给OCP社区，向行业开放，推动生态伙伴进一步开发和采用。 两种配置，分别面向超大规模数据中心与企业市场 Heli", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791821943.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "Marvell推出第二代CXL内存扩展器，最高支持9TB DDR4内存", "url": "https://wallstreetcn.com/articles/3783461", "date": "Tue, 13 Oct 2026 00:18:48 +0800", "desc": "Marvell正通过更大容量、更高带宽的内存扩展方案，瞄准AI推理基础设施升级带来的需求增长。 据彭博报道，10月12日， Marvell正式发布第二代Structera X 3406和3506 CXL内存扩展器。公司称，这是业界首款六通道CXL 3.2内存扩展器，单控制器最高支持9TB DDR4或6TB DDR5内存，内存通道数量较上一代增加50%。 两款产品预计于2027年第一季度开始向客户提供样品。 此次发布旨在应对AI推理工作负载日益突出的内存瓶颈。随着大型语言模型（LLM）规模扩大、上下文窗口延长以及KV缓存需求快速增长，传统服务器架构的内存容量与带宽正面临更大压力，内存逐渐成为制约AI性能和基础设施效率的关键因素。 AMD、Arm、阿里巴巴、三星和SK海力士等企业均对新产品及相关生态合作表示支持。 核心技术升级：更多通道，更大容量 Structera X 3406和3506在上", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791821928.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "美债收益率走高提振美元资产吸引力，哈萨克斯坦央行拟减持黄金", "url": "https://wallstreetcn.com/articles/3783465", "date": "Mon, 12 Oct 2026 23:36:43 +0800", "desc": "全球央行购金潮出现松动，黄金储备配置开始分化。 10月12日，据彭博报道， 全球主要黄金买家之一哈萨克斯坦央行计划降低黄金在外汇储备中的占比，转而增配美元资产。 美国国债收益率走高，提高了美元资产的利息回报，也削弱了无息黄金的相对吸引力。 哈萨克斯坦央行副行长Aliya Moldabekova表示， 央行计划在年底前将黄金占外汇储备的比重降低约3个百分点，使其降至75%左右。减持将通过期权和实物黄金两种方式进行，各占一半。 此前，全球央行持续购金是支撑金价上涨的重要力量。但今年以来，土耳其和俄罗斯已先后减持部分黄金，哈萨克斯坦也计划调整储备配置，央行购金趋势出现分化。 美债收益率走高，美元资产吸引力上升 Moldabekova表示： “我们已经很长时间没有见到这样的收益率水平了。这使得美元成为极具吸引力的选择，从而降低了黄金作为投资资产的吸引力。” 美国10年期国债收益率上周升至24年来高", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791819403.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "四部门拟给“速成车”踩刹车，新车竞赛要变了", "url": "https://wallstreetcn.com/articles/3783462", "date": "Mon, 12 Oct 2026 22:28:26 +0800", "desc": "“速成车”现象正在迎来一轮最严苛的监管。 10月10日晚间，工业和信息化部等四部门发布《关于进一步加强汽车产品创新设计和研发测试验证有关管理工作的通知（征求意见稿）》（以下简称“《征求意见稿》”），要求车企在申报新车时拿出更完整的测试记录。 随文公布的技术规范提出，乘用车应完成不少于3万公里的可靠性试验，环境适应性验证周期不少于一年，覆盖“高寒—高温—高寒”。 这份文件触及今年汽车业反复争论的“速成车”。车企希望更早推出产品，成熟平台、仿真和并行开发也确实缩短了研发时间。但一款车提前上市，究竟省下了重复开发的时间，还是缩减了实车试验与故障复测，外界很难仅凭发布 新《全球反思》报告中披露，过去一周他走访多家宏观客户，得到三个核心反馈： 利率上行的速度比终点位置更令人担忧；石油与利率这对曾经形影不离的资产，已悄然脱钩；没有人能够预判中东局势的降级路径。这三点叠加，意味着宏观投资者不仅要承受债市的剧烈波动，还同时失去了最重要的前瞻性指标。 与此同时，高盛内部数据显示，2026年表现最佳的系统性策略，恰恰是大规模做空波动率——即押注市场不会出现剧烈波动。这与客户对\"速度风险\"的深切忧虑形成鲜明矛盾，并为市场埋下潜在的脆弱性。 速度才是真正的风险 Miller指出，客户的核心关切并非5.25%这个收益率水平本身，而是抵达这一水平的速度。自8月底以来，10年期美债收益率累计上行约68个基点，高盛利率策略", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791809222.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "国产车企自主四强齐聚，“方盒子”进入大厂混战", "url": "https://wallstreetcn.com/articles/3783457", "date": "Mon, 12 Oct 2026 20:45:03 +0800", "desc": "作者 | 周智宇 曾经作为小众赛道的“方盒子”SUV品类俨然已经成为一个拥挤的赛道。 10月10日，银河战舰700上市，这是吉利汽车首次推出“方盒子”车型。比亚迪、吉利、奇瑞、长城四家主流自主车企由此在这条赛道会合。在北京越野、传祺等企业已经布局的市场，四强齐聚，又带来了更多争头部的目标。银河战舰700的一张牌是“智能”，瞄准了对越野也有潜在需求的“小白”消费者。 似是对银河战舰700上市的回应，在长城汽车旗下品牌坦克在10月12日发布的一张海报中，点明“智能可以避险，大梁才能托底”。 2026年9月，“方盒子”品类头部车型月销已超3万辆，月销量爆款让大厂看见了新增量，也让“方盒子”成为产品版图中难以缺席的一块。 吉利对竞争已有预判。吉利汽车集团副总裁、研究院院长李传海在10月10日晚间对华尔街见闻表示，2027年这条赛道“可能就是一片红海”。不过吉利汽车内部的目标，仍是进入第一阵营、冲击", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791809103.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "奇瑞就马来西亚OMODA 5车辆问题致歉", "url": "https://wallstreetcn.com/articles/3783455", "date": "Mon, 12 Oct 2026 20:35:29 +0800", "desc": "10月11日晚，奇瑞汽车发布《关于马来西亚OMODA 5车辆问题的说明》，就当地一辆2023款OMODA 5发生的车辆问题致歉。 奇瑞称，事件未造成人身伤害，公司已开展原因调查，并与马来西亚陆路交通局等监管机构沟通。马来西亚陆路交通局此前表示，涉事车辆在柔佛新山发生后轴脱落事件。 奇瑞表示，经调查，该批次车辆可能存在后桥纵臂局部焊接位置焊接强度不足的问题，极端情况下有焊缝撕裂风险。使用这一结构的车型此前已停产。奇瑞马来西亚子公司已对受影响的8878辆OMODA 5启动召回，将检查相关零部件，并视检查情况免费更换。 奇瑞马来西亚在10月11日的公告中称，此次召回涉及OMODA 5的C和H两个版本。 车主可在其官网输入车辆识别号码，查询车辆是否在召回范围内。受影响车主可到奇瑞授权服务中心接受免费检查和必要的零部件更换。该公司称，目前生产的车型不在此次召回范围内。 对于马来西亚以外的车辆，奇瑞表", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791808529.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "印度9月CPI升至 ht": 5, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 31}, {"title": "36氪新风向丨在太空中建AI算力中心，马斯克又带火一个万亿美元赛道", "url": "https://www.36kr.com/p/4022305269600128", "date": "Mon, 12 Oct 2026 03:03:27 GMT", "desc": "作者 | 乔钰杰 编辑 | 袁斯来 本文约4800字，建议阅读13分钟 一年前，做太空算力的公司如果想拿投资，会遭遇投资人很多冷眼。 很难责怪他们的冷淡。太空算力中心听上去有些科幻。简单解释，它希望借助太空永不落山的太阳能与真空辐射散热，实现无限的算力扩张。核心设想是解开地面数据中心的电力与能效的死结。 “当时我们内部也认为，这玩意儿不是骗人嘛，市场一度非常冷。”一位投资人回忆。 又是马斯克，在大洋彼岸，以一己之力带火了中国硬科技赛道。 2025年11月，马斯克在社交媒体宣布，依托星舰（Starship）的发射能力与Starlink V3卫星的升级，SpaceX将构建全球首个太空AI数据中心集群，目标实现每年1太瓦（1TW）的AI算力部署。 （SpaceX AI Statellite概念图） 投资人们很快转变了态度，他们觉得“不靠谱也开始靠谱了”，很多人的想法变化并非更深入的研究或赛道更落", "tags": ["AI"], "topic_score": 4, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1791774207.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 29}, {"title": "Show HN: Personal Agent Proxy (Open Source)", "url": "https://github.com/personalagentproxy/proxy", "date": "Mon, 12 Oct 2026 23:30:58 +0000", "desc": "Every (personal) agent (like Muse, Instinct, Grokbot, Poke) asks you to connect your email, calendar, and tools again. Permissions are intransparent and every provider ends up building the same integrations. We think there needs to be an independent tool that holds all connections to third party companies. That way you can keep auth separate, audit what an agent does, set fine-grained permissions ", "tags": ["AI"], "topic_score": 3, "source": "HN Show HN", "cat": "AI实战_创作者", "weight": 5, "ts": 1791847858.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 29, "title_zh": "Show HN：个人智能体代理（开源）"}, {"title": "Meta Unveils New AI Models to Challenge OpenAI and Anthropic", "url": "https://www.theinformation.com/briefings/meta-unveils-new-ai-models-challenge-openai-anthropic", "date": "2026-10-12T20:56:26Z", "desc": "", "tags": ["AI"], "topic_score": 6, "source": "The Information", "cat": "金融媒体_英文", "weight": 3, "ts": 1791838586.0, "opinion": const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
