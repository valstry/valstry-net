据介绍，撞脸陈小春工人家里是三兄弟，上面还有两个哥哥一个姐姐。今年 47 岁，姓陈只是巧合，只是长得像，并不是陈小春的弟弟。 据封面新闻，当事人在直播间表示，自己没有被抱养，也没有胎记。目前拍摄大叔的自媒体博主已经从公司主动离职，其表示「公司想让我删掉视频，给的压力太大了」。 拍摄者说，这条视频纯属偶然拍下，他刚入职没多久，无意间注意到这位大哥，就随手发到网上，并没有恶意炒作。没想到意外走红后给正处于上市关键阶段的公司带来不小的舆论压力", "date": "", "hot": 0, "tags": ["自媒体"], "topic_score": 2, "source": "热搜-知乎", "cat": "热点榜_发生了什么", "weight": 5, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 27}, {"title": "DeepSeek宣布故障补偿方案", "url": "https://search.bilibili.com/all?keyword=DeepSeek%E5%AE%A3%E5%B8%83%E6%95%85%E9%9A%9C%E8%A1%A5%E5%81%BF%E6%96%B9%E6%A1%88", "desc": "", "date": "", "hot": 0, "tags": ["AI"], "topic_score": 2, "source": "热搜-B站", "cat": "热点榜_发生了什么", "weight": 5, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 27}, {"title": "美国财政部敦促全球合作伙伴将人工智能改称为“超级智能”。美国财政部一名高级官员周四在接受媒体采访时表示，美国希望其全球合作伙伴将“人工智能”重新命名为...", "url": "https://www.huxiu.com/moment/1288683.html", "date": "Fri, 16 Oct 2026 00:14:59 GMT", "desc": "美国财政部敦促全球合作伙伴将人工智能改称为“超级智能”。 美国财政部一名高级官员周四在接受媒体采访时表示，美国希望其全球合作伙伴将“人工智能”重新命名为“超级智能”，因为华盛顿认为这一新名称能够更准确地反映这项新兴技术。美国财政部负责国际事务的副部长布朗表示，美国正与国际货币基金组织的其他成员国就此进行磋商，希望IMF指导委员会--国际货币与金融委员会(IMFC)正在起草的一份声明中采用这一新术语。美国总统特朗普上月指示联邦政府机构在提及这项技术时，使用“超级智能”代替“人工智能”。布朗表示，作为20国集团轮值主席国，美国也希望推动这一名称在国际层面得到采用。", "tags": ["AI"], "topic_score": 3, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1792109699.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "宝玉 (@dotey)", "url": "https://sopilot.net/hot-tweets?tweetId=2110877554945175677", "date": "Thu, 15 Oct 2026 23:36:41 GMT", "desc": "Antigravity 向付费 Google AI Pro 用户开放 Gemini 4 Argon，Argon 有单独的每周额度，不占 3.8 Flash 额度 Google 的 AI 编程工具 Antigravity 今天开始向付费的 Google AI Pro 订阅用户推出 Gemini 4 Argon。官方模型页写明只限正式付费的 Pro，试用期的 Pro 用不了，免费用户和 Google AI Plus 用户也不在范围内。能用的地方是 Antigravity 桌面 App、命令行工具 ❤️ 29 🔁 1 💬 19 🔖 8 👀 9720 预测爆火概率:100%，预测浏览量:146000，预测评论浏览量:700 原推链接: https://x.com/dotey/status/2110877554945175677", "tags": [], "topic_score": 0, "source": "SoPilot 推特起爆帖", "cat": "X起爆帖", "weight": 6, "ts": 1792107401.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "机器人初创企业扎堆做投资，边融边投模式引热议。一些尚未盈利、成立两三年的初创公司，账上躺着几十亿元融资，一边持续融资，一边对外投资，这种现象在当下的一...", "url": "https://www.huxiu.com/moment/1288679.html", "date": "Thu, 15 Oct 2026 23:32:53 GMT", "desc": "机器人初创企业扎堆做投资，边融边投模式引热议。 一些尚未盈利、成立两三年的初创公司，账上躺着几十亿元融资，一边持续融资，一边对外投资，这种现象在当下的一级市场越来越普遍。近日，巨蟹智能和墨现科技两家具身智能产业链企业同步官宣完成融资，两家企业的投资方中，都出现了一家具身智能百亿独角兽的身影。记者梳理发现，这种初创企业“左手融资、右手投资”的现象主要集中在具身智能、大模型、AI芯片等领域，其中机器人赛道尤为明显，而且已经从个别头部企业延伸到更多企业。 今年以来，智元机器人、松延动力、银河通用等十多家企业也已纷纷下场做投资。受访人士认为，这类投资大多数是企业提前布局产业生态。业内人士建议，对于商业模式尚待验证的初创企业，应审慎考虑对外投资能否真正服务主营业务，且不挤占研发和商业化所需资金，切勿为了估值叙事而盲目扩张。", "tags": ["商业认知"], "topic_score": 3, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1792107173.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "贵州乳业龙头企业今日上市。今日无新股申购；有1只新股上市，为北交所的南方乳业。", "url": "https://www.huxiu.com/moment/1288677.html", "date": "Thu, 15 Oct 2026 23:20:49 GMT", "desc": "贵州乳业龙头企业今日上市。 今日无新股申购；有1只新股上市，为北交所的南方乳业。", "tags": ["商业认知"], "topic_score": 3, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1792106449.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "一线城市商品住房销售制度改革细则全面落地，多地楼市稳步回暖。此前的8月28日，住房城乡建设部、自然资源部、金融监管总局联合发布《关于完善商品住房销售制度...", "url": "https://www.huxiu.com/moment/1288676.html", "date": "Thu, 15 Oct 2026 23:20:17 GMT", "desc": "一线城市商品住房销售制度改革细则全面落地，多地楼市稳步回暖。 此前的8月28日，住房城乡建设部、自然资源部、金融监管总局联合发布《关于完善商品住房销售制度的通知》，部署各地要有力有序推行商品住房现房销售，实现“所见即所得”，减少商品住房交付纠纷，从根本上防范交付风险，维护购房人合法权益，加快构建房地产发展新模式。《通知》落地后，北京、上海、广州相继于9月24日、9月28日、9月30日出台配套实施意见。从市场表现来看，细则落地后，市场稳步回暖。 业内人士指出，封顶预售、竣工放贷、全流程资金闭环监管等规则，将房企融资逻辑从主体信用导向切换为项目现金流导向，将交付保障从企业承诺升级为制度约束，从制度层面化解购房者的交付顾虑。今年国庆假期，根据中指研究院监测的网签数据，10月1日—7日，重点25城新建住宅成交55.1万平方米，相较去年国庆假期，日均成交同比上涨33.8%。", "tags": ["企业落地"], "topic_score": 3, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1792106417.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "赎旧换新，银行优先股密集退场。近日，江苏银行一纸公告落地，2亿股“苏银优1”优先股进入退场倒计时。11月30日，这家城商行将全额赎回这批发行于2017年的资本工...", "url": "https://www.huxiu.com/moment/1288671.html", "date": "Thu, 15 Oct 2026 22:27:48 GMT", "desc": "赎旧换新，银行优先股密集退场。 近日，江苏银行一纸公告落地，2亿股“苏银优1”优先股进入退场倒计时。11月30日，这家城商行将全额赎回这批发行于2017年的资本工具，赎回价格定为票面金额加当期已宣告且尚未支付的优先股股息。这并非孤例，Wind数据显示，今年以来已有光大银行、平安银行、招商银行、北京银行、南京银行5家上市银行完成优先股赎回，中信银行也将于10月26日赎回2016年发行的3.5亿股优先股。一场围绕其他一级资本工具的“换仓”操作，正在低利率环境中悄然上演。", "tags": ["企业落地"], "topic_score": 3, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1792103268.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "8-K - NORTHRIM BANCORP INC (0001163370) (Filer)", "url": "https://www.sec.gov/Archives/edgar/data/1163370/000116337026000032/0001163370-26-000032-index.htm", "date": "2026-10-15T17:28:26-04:00", "desc": "Filed: 2026-10-15 AccNo: 0001163370-26-000032 Size: 1 MB Item 2.02: Results of Operations and Financial Condition Item 2.06: Material Impairments Item 8.01: Other Events Item 9.01: Financial Statements and Exhibits", "tags": [], "topic_score": 0, "source": "SEC 最新 8-K 申报", "cat": "企业行为_美股披露", "weight": 6, "ts": 1792099706.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "8-K - River Financial Corp (0001641601) (Filer)", "url": "https://www.sec.gov/Archives/edgar/data/1641601/000119312526423045/0001193125-26-423045-index.htm", "date": "2026-10-15T17:27:51-04:00", "desc": "Filed: 2026-10-15 AccNo: 0001193125-26-423045 Size: 181 KB Item 2.02: Results of Operations and Financial Condition Item 9.01: Financial Statements and Exhibits", "tags": [], "topic_score": 0, "source": "SEC 最新 8-K 申报", "cat": "企业行为_美股披露", "weight": 6, "ts": 1792099671.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "MSCI Decision Moves Michael Saylor’s Str p/4026574580322439", "date": "Thu, 15 Oct 2026 05:22:01 GMT", "desc": "文 | 刘思洁 编辑 | 张薇 封面来源 | Table for Six 一个工作日的晚上，我要和五个陌生人坐在一起喝酒。 出发前，我不知道他们是谁，也不知道我会去哪。根据用户填写的个人信息和对活动的期待，AI社交产品Table for Six（下文简称T46），判断哪六个人可能“擦出一些火花”——我就这样拥有了五个“同桌”。 同一时间，在全国14座城市的数百张酒桌上，类似的见面也在发生。 T46于2025年末开始运营，“未来人类实验室”独家获悉，其已获得BAI Capital 和某家游戏公司累计数百万美元天使轮融资，产品累计付费用户超过4万人。 晚上八点半，我准时赶到北京朝阳区的一家清吧。 桌上没有任何看起来与AI有关的设备，只有一套纸质卡牌。卡牌上，三十多个问题按照由浅入深的顺序排列，其中还有六名参与者各自的身份卡，以及每个人报名时想问陌生人的问题。 T46为大家准备的卡牌 一位性格外", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1792041721.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "近8000块的Ebike，蔚来车主们买了数万辆｜产品观察", "url": "https://www.36kr.com/p/4026609117532802", "date": "Thu, 15 Oct 2026 04:48:41 GMT", "desc": "作者 | 张子怡 编辑 | 袁斯来在小红书上搜索Lemmo Zero，你能看到有人带着它飞到京都去骑行；也有人尝试改造它，在车身后挂上拖车，骑着它去买菜；还有人挑战骑它上下班，第一天却忘记带电池。 在中国，E-bike仍是个陌生的品类，少有人知晓。人们更习惯电动两轮车，而非价格动辄上万的Ebike。 有趣的是，售价7999元的Lemmo Zero，在汽车用户中找到市场。总部位于德国柏林的Lemmo于去年同蔚来汽车合作，在NIO Life上线Zero后，迄今已收获数万份订单。 此外，截至8月初，Lemmo在今年6月上线天猫商城，公司介绍称，店铺是高端电助力自行车品类第一名、全品类第二名。 这样的订单表现在中国市场的E-Bike品类中并不多见。Lemmo联合创始人兼CEO Victor曾在摩拜单车负责全球产品研发与设计。Victor见证了创业公司如何实现自行车的大规模生产，亲历过共享经济浪潮下", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1792039721.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "DUALVIEW: Leveraging Broad and Output-Specific Evidence for LLM-based Multi-Output Text Regression", "url": "https://arxiv.org/abs/2610.19206", "date": "Thu, 15 Oct 2026 00:00:00 -0400", "desc": "arXiv:2610.19206v1 Announce Type: new Abstract: While work on LLM-based regression has largely focused on scalar prediction, multi-output text regression remains less explored. We present DualView, a parameter-efficient approach to leverage LLMs for multi-output text regression. \\method{} first extracts broad and output-specific representations from a frozen LLM, then uses a dual-branch architectu", "tags": ["AI"], "topic_score": 5, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1792036800.0, "opinion": true, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "Why Generate a Click? Plug-in Decision Heads for Web Agents", "url": "https://arxiv.org/abs/2610.20107", "date": "Thu, 15 Oct 2026 00:00:00 -0400", "desc": "arXiv:2610.20107v1 Announce Type: new Abstract: Web agents built on vision language models decide every action by generating text such as click(12), although most of that text encodes a choice among a few action types and a few dozen marked elements. We read these choices directly from the hidden states that the generator computes while it reads the goal and the screenshot. Plug-in decision heads ", "tags": ["AI", "资本市场"], "topic_score": 5, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1792036800.0, "opinion": true, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "全球人形机器人背后的20位领军人物", "url": "https://www.36kr.com/p/4026468251539079", "date": "Thu, 15 Oct 2026 03:26:07 GMT", "desc": "一台人形机器人从站起来、走出去，到拿起工具、完成工作，需要跨过多少道门槛？ 关节要有力量也要足够轻巧，身体要保持平衡，双手还要完成精细操作，人工智能需要理解指令，更需要应对真实世界里的变化……每一次看似简单的动作背后，都可能是一个团队持续多年的积累。 推动这场变革的人，也有着截然不同的起点。王兴兴从研究生时期的一台四足机器人出发，走向人形机器人整机研发；彭志辉把个人创客的工程热情带入创业公司；马克·雷伯特用数十年研究拓展机器人的运动能力；布雷特·阿德科克则带着连续创业的经验，让人形机器人进入汽车工厂接受检验。 放眼全球，人形机器人的发展正在形成多条路径：工业生产、仓储物流、家庭服务，以及人与机器之间更自然的交流。 本文选取国内外20位具有代表性的机器人产业与科研领军人物，梳理他们的经历、成果与技术选择。范围涵盖双足人形机器人、轮式人形机器人及仿生交互机器人，兼顾创业者、技术负责人和科研先驱", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1792034767.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "80、90后经历过的那个盗版年代，好像又要回来了", "url": "https://www.36kr.com/p/4026443226992771", "date": "Thu, 15 Oct 2026 01:28:38 GMT", "desc": "“我把空调逆向了，现在点电脑就能开，再也不用找遥控器了” “我用 REA 把马桶逆向了，坐在电脑前也能遥控厕所里的智能马桶了！” 图源推特@爆裂队长NEXT “谢谢 REA，我的 HP 打印机终于能用第三方墨盒了！” 如果说 2026 年上半年 GitHub 上最火的项目是龙虾 OpenClaw。 那么下半年这个头衔应该属于 REA，一个逆向 MCP。 REA 的仓库其实 4 月就建好了，不温不火地更新了半年。直到 10 月 7 号前后突然爆了，登上 GitHub 热榜第一。截至我写稿时，它已经有 22.3 万颗星，在 GitHub 有史以来的星数排行里排到第 23 位。 看到这儿，可能有差友好奇： 到底什么是逆向，逆向又能帮我们做什么？ 别急，马上你就知道了。 去年，我给大家推荐过一个网页版红警。 这是一位罗马尼亚开发者为了让大家打开网页就能玩红警做的项目。由于没有源代码，他只能照着《红", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1792027718.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "马斯克用一笔80亿美元交易，颠覆了电信这门百年生意", "url": "https://www.36kr.com/p/4026368642175108", "date": "Thu, 15 Oct 2026 00:49:25 GMT", "desc": "2026年8月11日，一家叫Grain Management的公司，花了29亿美元，从T-Mobile手里买下一批频谱牌照，外加一批600MHz的频谱。 两个月后的10月，它把这批牌照转手卖给了马斯克的SpaceX，价格是80亿美元。 29亿买进，80亿卖出。中间只隔了两个月，净赚51亿。 Grain Management数钱的速度，大概没人比得上。但就在它成交的同一天，美国电信业的三大巨头，一起迎来了本世纪最黑的一天。 T-Mobile跌13.27%，创下2013年上市以来最差单日，也是当天标普500里表现最差的股票。AT&T跌9.81%，2000年以来最差。Verizon跌8.75%，2002年7月以来最差。三家加起来，一天蒸发约600亿美元。 奇怪的是，同一时间，铁塔公司的股票却在暴涨。Crown Castle涨超15%，American Tower涨近8%，三家铁塔商合计多出约11", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1792025365.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "GitHub Copilot app for Beginners: How to teach Copilot about your codebase", "url": "https://github.blog/ai-and-ml/github-copilot/github-copilot-app-for-beginners-how-to-teach-copilot-about-your-codebase/", "date": "Mon, 12 Oct 2026 17:43:59 +0000", "desc": "Learn how to add custom instructions and skills to your repository, use custom agents, and connect MCP servers like Playwright. The post GitHub Copilot app for Beginners: How to teach Copilot about your codebase appeared first on The GitHub Blog .", "tags": [], "topic_score": 0, "source": "GitHub Blog", "cat": "AI厂商官方", "weight": 3, "ts": 1791827039.0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 21}, {"title": "北京今天下午至明天将有明显降雨，过程累计雨量可达大雨。今天（10月16日）下午至明天，北京将有明显降雨过程，其中，今天白天西部、南部有小雨或零星小雨，夜间...", "url": "http , "weight": 4, "ts": 1792110183.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "不只是Coreweave，数据中心债券正遭到“集体抛售”", "url": "https://wallstreetcn.com/articles/3783740", "date": "Fri, 16 Oct 2026 08:17:16 +0800", "desc": "数据中心债券市场正在经历一场全面抛售，Gartner预测80%的新云计算公司将在2030年前停止独立运营，Allianz首席投资官则警告数据中心债券正迎来\"物竞天择\"时刻。 据英国《金融时报》周四报道， 从承租给Meta、微软、英伟达的大型数据中心专项融资债券，到CoreWeave等新兴云计算公司发行的债务，价格纷纷跌入承压区间， 折射出投资者对AI基础设施投资回报可持续性的深层疑虑。 触发本轮抛售的直接导火索包括：OpenAI将IPO推迟至明年、Anthropic季度营收增速放缓，以及OpenAI上周披露的实际年化营收远低于此前预期。上述信号加剧了市场对AI变现能力的质疑，并引发股债联动下跌。英伟达过去一周市值蒸发约2700亿美元，CoreWeave股价周内累跌约17%，竞争对手Nebius跌幅达18%。 资产管理机构的担忧正在蔓延。德国安联集团首席投资官Ludovic Subran表示", "tags": ["AI"], "topic_score": 3, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792109836.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "因凡蒂诺道歉。来源：视觉中国 当地时间10月15日，国际足联理事会会议在苏黎世举行，这是国际足联主席因凡蒂诺推动的世界杯商业计划曝光后的首次理事会会议。在...", "url": "https://www.huxiu.com/moment/1288684.html", "date": "Fri, 16 Oct 2026 00:16:22 GMT", "desc": "因凡蒂诺道歉。 来源：视觉中国 当地时间10月15日，国际足联理事会会议在苏黎世举行，这是国际足联主席因凡蒂诺推动的世界杯商业计划曝光后的首次理事会会议。在会议中，向私人资本出售世界杯权益的商业计划、美国前锋巴洛贡的红牌禁赛被缓期执行以及国际足联成员协会的资金分配等焦点问题都被提及。据与会的欧洲代表透露，因凡蒂诺就其世界杯出售计划道歉，他对未能早些向理事会通报该计划表示遗憾，但因凡蒂诺并未提供欧洲方面要求公开的相关文件、通信和决策记录等。 欧足联一直是因凡蒂诺最激烈的批评者之一，并多次呼吁他下台。当被问及欧足联对因凡蒂诺的立场是否有所改变时，国际足联副主席、英格兰足总主席黛比·休伊特表示，“就我而言，没有任何变化。除了我们现在有一位表示歉意的主席之外，我没有得到任何新的信息来改变我的看法。” 国际足联理事会成员、德国足协主席贝恩德·诺伊恩多夫在会后对媒体表示，“没有得到任何令人满意的答复”", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1792109782.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "苹果与Meta合作，要在Mac上运行Muse", "url": "https://wallstreetcn.com/articles/3783743", "date": "Fri, 16 Oct 2026 08:15:02 +0800", "desc": "苹果与Meta宣布携手，将Meta旗下最强开源AI模型带上苹果高端桌面电脑，标志着硅谷两大宿敌在人工智能浪潮下打破历史积怨、重新站到同一阵线。这一合作不仅是苹果AI芯片实力的一次公开背书，也对OpenAI和Anthropic构成潜在挑战。 据CNBC报道，两家公司周四（10月15日）宣布，开发者将能够在苹果Mac Studio电脑上本地运行Meta最新开源模型 Muse Spark Open 。用户可将 ，可现实又是窘迫的，这里的繁荣则是限时的 额尔古纳河秋景 国庆假期，我和家人在呼伦贝尔自驾了一圈。上海仍着短袖的日子，大兴安岭腹地已经入冬。山林间的白桦树、落叶松还在“营业”，万山染金，烘托秋日尾章的暖色调，但初雪已经不期而至。随着气温骤降，山里的景区、酒店都即将歇业，“十一”是一年最后的旅游窗口。这让我们在热闹时节体验了一回“歇业风”淡季游。 海拉尔：天寒地冻，热气腾腾 第一天下午，飞机落地海拉尔，我们在机场租车点提了一辆“坦克300”SUV，开始了此次行程。傍晚，气温降了十来度，我们到城里饱餐了一顿羊肉火锅，驱散寒气。吃完不到七点，南方的烧烤店老板可能刚刚搬出桌椅、支起烤炉，而海拉尔的街上已经没什么行人。零下的凛冽寒风打消了我们逛逛呼伦贝尔古城的想法。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1792107583.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "美国扩大电子产品进口限制 封堵华为、中兴等公司出产的零部件", "url": "https://www.caixin.com/2026-10-15/102493706.html", "date": "Thu, 15 Oct 2026 23:35:38 GMT", "desc": "美国禁止一些中国企业的电子设备成品在美销售，现在把限制扩大到了组装设备的零部件 当地时间2026年7月24日，美国新泽西州贝永港。当地时间10月13日，美国联邦政府的独立机构美国联邦通信委员会的一条新规生效，该规定要求，如果一台设备所含的逻辑处理硬件由华为、中兴等“FCC管制清单”上的实体生产，那么这台设备将难以获得FCC的认证而出口到美国。图：视觉中国 【财新网】 美国继续收紧对中国电子产品进入美国市场的限制。当地时间10月13日，美国联邦政府的独立机构美国联邦通信委员会（FCC）的一条新规生效，该规定要求，如果一台设备所含的逻辑处理硬件由 华为 、 中兴 等“FCC管制清单”（FCC Covered List）上的实体生产，那么这台设备将难以获得FCC的认证而出口到美国。 FCC在7月23日发布上述新规，生效日期定于10月13日。FCC认为，“逻辑硬件组件”可能带来国家安全或美国人员安", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1792107338.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "《自然》研究：用全能干细胞孕育生命", "url": "https://www.caixin.com/2026-10-16/102493802.html", "date": "Thu, 15 Oct 2026 23:34:31 GMT", "desc": "任何细胞都能转化成多能干细胞，这些多能干细胞可以再化学诱导成全能干细胞，并有潜力发育为个体 ciTotiSCs来源的胚胎模型，形成卵黄囊血管网络。图：清华大学药学院 【财新网】 干细胞的潜力在哪里？10月14日，全球健康药物研发中心主任、清华大学药学院教授丁胜团队发表于《自然》的研究表明：从一种人工诱导的全能性细胞出发，研究人员可以构建出连续发育的小鼠胚胎模型，使其能够跨越囊胚、原肠运动和早期器官形成等阶段，并出现血管与血液、生殖系以及具有节律性收缩的心脏等组织。 早在四年前，丁胜团队在《自然》发布过一项研究，用普通细胞转变为多能干细胞，再采用三种小分子化学药物“TAW药物组合”，将多能干细胞人工诱导为全能干细胞。全能干细胞，是指能分化为胚胎以及胚胎外组织、并最终产生一个有完整功能活体的干细胞。自然界中最典型的全能干细胞就是受精卵。（详见财新网《 <自然>发布清华大学研究 首次实现体外稳定", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1792107271.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"titl const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
