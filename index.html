acob Coxon，曾先后担任OpenAI与Anthropic的预训练研究员。两个月前，他毅然放弃巨额IPO期权辞职。 就在这两天，他晒出了那张逼走自己的「罪魁祸首」。 让人意外的是，Anthropic居然在IPO路演中， 把这张内部神图当成头号王牌公之于众。 图中那条橙色曲线连对数坐标都压不住，还在加速陡峭上扬。 在亲历者眼里，这无异于拉响了 「奇点警报」 ！ 结合Anthropic最新公开的路演原片与招股书核心文件，三个颠覆认知的真相浮出水面： 「预训练撞墙」彻底破产，重训Mythos算力骤降 刚屠榜全球的初代Mythos在内部曲线上竟只是个中间节点， 如今只需动用最初的一小部分算力，就能把它从头再训出来！ Scaling Laws鼻祖揭秘，砍掉视频死磕代码加速造自己 随着Claude反过来大", "tags": ["AI"], "topic_score": 4, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1794789617.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 29}, {"title": "Anthropic Seeks Record $88.5B Tied To Public Market Debut", "url": "https://news.crunchbase.com/ai/anthropic-record-ipo-ant-public-market-debut-spcx/", "date": "Tue, 10 Nov 2026 18:51:25 +0000", "desc": "Anthropic is seeking to secure up to $88.5 billion in its planned IPO and a concurrent private placement, potentially making it the largest-ever fundraise tied to a public market debut. On Tuesday, the AI giant submitted an updated S-1 filing for its upcoming public offering, unveiling new details including a proposed share price range offering size.", "tags": ["AI", "资本市场"], "topic_score": 6, "source": "Crunchbase 融资板块", "cat": "创投行业分析", "weight": 5, "ts": 1794336685.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 29}, {"title": "Gemini Robotics 2.5 accelerates real-world general dexterity", "url": "https://deepmind.google/blog/gemini-robotics-2-5-accelerates-real-world-physical-intelligence/", "date": "Mon, 09 Nov 2026 19:51:47 +0000", "desc": "Our most capable vision-language-action model enhances robot dexterity, reliability, and safety", "tags": ["资本市场"], "topic_score": 2, "source": "Google DeepMind", "cat": "AI厂商官方", "weight": 5, "ts": 1794253907.0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 29}, {"title": "Agentic cheminformatics with Google Antigravity", "url": "https://deepmind.google/blog/agentic-cheminformatics-with-googl ts": 1794874808.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "特朗普支持黄仁勋回归，英伟达董事会称暂不考虑复职事项", "url": "https://wallstreetcn.com/articles/3786042", "date": "Tue, 17 Nov 2026 08:16:31 +0800", "desc": "英伟达股价周一震荡，特朗普公开表态支持黄仁勋重返CEO职位。 特朗普周一在白宫向记者表示， “我不反对”黄仁勋复职，认为黄仁勋“吸取了深刻教训”，并称“很多人希望黄仁勋回来，这肯定不是个坏主意”。 他同时为黄仁勋辩护称，美国国家安全“没有受到威胁”。 特朗普还透露，黄仁勋辞职后不久他曾与其通话。 然而，据知情人士向媒体透露，尽管部分投资者和员工持续发出呼声， 英伟达董事会目前明确不考虑恢复黄仁勋的CEO职务。 随后，CNBC援引知情人士透露， 董事会目前的工作重心是针对黄仁勋的调查，并未就其重返公司进行任何讨论。英伟达已聘请法律事务所Wachtell Lipton主导调查，重点审查黄仁勋的行为是否危及国家安全或公司机密。 在特朗普发表上述言论期间，英伟达股价一度短暂转涨，随后继续下跌至-2%左右。CNBC相关报道发布后，英伟达股价持续下跌至4.5%。 英伟达董事会于上周五表示，正在遴选猎头", "tags": ["AI"], "topic_score": 3, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1794874591.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "@firefox: Threads now has custom Like buttons. Cool! Meanwhile we’re over here building a browser that lets you turn off AI, but hey, priorities.", "url": "https://www.threads.com/t/Df0nQw8G-qq", "date": "Tue, 17 Nov 2026 00:11:30 GMT", "desc": "@firefox : Threads now has custom Like buttons. Cool! Meanwhile we’re over here building a browser that lets you turn off AI, but hey, priorities.", "tags": [], "topic_score": 0, "source": "Threads-AI讨论", "cat": "AI实战_创作者", "weight": 4, "ts": 1794874290.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "祝贺！中国成功连任。11月16日，国际电信联盟（以下简称“国际电联”）2026年全权代表大会完成国际电联理事国和无线电规则委员会委员选举工作，中国成功连任国际...", "url": "https://www.huxiu.com/moment/1297381.html", "date": "Mon, 16 Nov 2026 23:44:53 GMT", "desc": "祝贺！中国成功连任。 11月16日，国际电信联盟（以下简称“国际电联”）2026年全权代表大会完成国际电联理事国和无线电规则委员会委员选举工作，中国成功连任国际电联理事国（2027—2030年），中国候选人、国家数据集团有限公司董事程建军成功连任无线电规则委员会委员（2027—2030年）。国际电联是联合国信息通信领域专门机构，负责统筹协调全球无线电频谱与卫星轨道资源分配，制定全球通信技术标准，推动通信基础设施建设。国际电联理事会由48个理事国组成，负责在两次全权代表大会之间履行管理机构职责。无线电规则委员会由12名专家组成，负责解释无线电规则、补充完善规则程序，并协调解决成员国之间无线电频率干扰等问题。 中国自1972年恢复在国际电联合法席位后，一直担任理事国，始终以建设性姿态深度 6-11-16/102505466.html", "date": "Tue, 17 Nov 2026 00:27:52 GMT", "desc": "二审法院认为，一审判决认定甘德胜犯诈骗罪部分事实不清、证据不足，裁定撤销原判、发回重审。辩护律师表示，希望警方能够将真正的骗子尽快缉拿归案 北京市第三中级法院。 【财新网】 一桩诈骗案，因花巨资“捞人”不成，又牵出疑似以“领导秘书”“领导妹妹”和国家机关名义行骗的离奇事件而备受关注。近日，该案因事实不清、证据不足被发回重审。 2023年8月，内蒙古商人甘德胜帮忙“捞人”，他受托为福建人王一湖（化名）的亲属办理取保，当时王一湖弟弟的小舅子因涉嫌开设赌场罪被逮捕。王一湖说，家里人特别着急，让其找找人看能不能将人放了，于是他找到认识多年的“方萍”，对方自称是某部委退休干部，“她说可以办，一周就能放人，需要100万元，还说找的是一个部长办理此事”。王一湖回忆，2023年8月21日、22日，家人分七笔将100万元转到方萍指定的银行卡。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1794875272.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "存储三巨头三星、SK海力士、美光遭反垄断诉讼 美法院驳回撤诉申请", "url": "https://www.caixin.com/2026-11-17/102505563.html", "date": "Tue, 17 Nov 2026 00:27:52 GMT", "desc": "AI需求增长引发传统DRAM供需争议，三大存储厂商被指借产能调整推高价格 当地时间2026年11月16日，韩国首尔，韩亚银行交易室内的行情显示屏上显示着韩国综合股价指数（KOSPI）、三星电子及SK海力士的股价。图：视觉中国 【财新网】 当地时间11月14日，美国加州北区联邦地区法院驳回三星电子（KRX：005930）、SK海力士（KRX：000660；NASDAQ：SKHY）和美光科技（NASDAQ：MU）提出的驳回诉讼动议。三家存储厂商被17名美国消费者和三家小企业指控自2022年10月以来协同行动，限制传统动态随机存取存储器（DRAM）供应并推高价格。法院认为，结合三家企业此前涉及联合垄断DRAM价格的历史行为，原告提出的同步减产、产能转向高带宽内存（HBM）、退出DDR4产品线等指控足以支持反垄断诉讼继续推进。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1794875272.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "英特尔和CEO陈立武遭集体诉讼 股价暴跌引披露质疑", "url": "https://www.caixin.com/2026-11-16/102505490.html", "date": "Tue, 17 Nov 2026 00:27:31 GMT", "desc": "法院尚未对相关指控作出认定，英特尔接下来仍需应对客户端市场需求变化和数据中心CPU供货压力 陈立武。图：视觉中国 【财新网】 英特尔和公司CEO陈立武遭投资者集体诉讼。当地时间11月13日，密歇根州南菲尔德市消防与警察退休基金向美国加州北区联邦地区法院提起证券集体诉讼，将英特尔、陈立武及CFO David Zinsner列为被告。原告认为，英特尔在2026年7月23日至10月29日期间对PC市场需求、渠道库存、数据中心业务及供应链状况作出误导性陈述，导致投资者遭受损失。目前，法院尚未对相关指控作出认定。 此次诉讼发生在英特尔股价大幅下跌之后。10月29日，英特尔公布第三季度财报及第四季度业绩指引。次日，英特尔股价下跌28.58%，收于65.76美元，市值蒸发约1400亿美元。11月5日，股价进一步跌至52.25美元。11月13日，英特尔收于59.66美元。原告认为，公司此前对经营状况的披露", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1794875251.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "10月经济数据回落背后", "url": "https://opinion.caixin.com/2026-11-17/102505553.html", "date": "Tue, 17 Nov 2026 00:27:31 GMT", "desc": "中国宏观内需的形成与传导机制正在发生变化 依托中国制造业产业链竞争优势及全球人工智能相关产业需求拉动，10月以美元计价的出口额同比增长35.2%，继续为工业生产和经济增长提供支撑。图：视觉中国 如何看待10月主要经济指标增速放缓 10月主要经济指标同比增速有所回落，但宏观经济总体仍延续平稳增长态势。10月规模以上工业增加值和服务业生产指数同比分别增长4.8%和4.6%，增速较9月分别回落0.7和0.2个百分点；社会消费品零售总额同比增长0.4%，增速较9月回落0.7个百分点；1—10月固定资产投资同比下降8.1%，降幅较1—9月扩大0.9个百分点。但也要看到，工业生产总体仍保持增长，先进制造业、外贸出口以及服务零售表现较好，继续对经济运行形成重要支撑。因此，不能仅凭单月指标变化作出判断，而应结合年内整体走势和增长动能转换情况进行全面分析。 .lanmu_textend{ padding-b", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1794875251.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "万斯被曝考虑退出2028年竞选 面临处理与特朗普关系等考验", "url": "https://international.caixin.com/2026-11-16/102505469.html", "date": "Tue, 17 Nov 2026 00:27:31 GMT", "desc": "分析认为，一方面万斯需要与特朗普不受欢迎的政策进行切割；另一方面由于需要总统的背书，他又不敢得罪特朗普 当地时间2026年11月12日，美国，万斯发表讲话。图：IC photo 【财新网】 共和党在美国中期选举中惨败后，美国副总统万斯的政治前途受人关注。据CNN援引与万斯关系密切的人士称，中期选举之后，万斯已在认真考虑不参加2028年总统竞选。 报道称，虽然万斯还没有下定决心，但对其大约十几名盟友和顾问的采访显示，这位副总统正在自己的政治抱负、MAGA联盟的破裂以及尽一名父亲的职责之间艰难权衡。他们称，万斯坚定地致力于重现MAGA运动在2024年大选中的高光时刻，但不确定他是否应该领导这场运动。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1794875251.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "打造养老社区“天花板”？平安收购北京市中心顶流五星酒店", "url": "https://finance.caixin.com/2026-11-16/102505473.html", "date": "Tue, 17 Nov 2026 00:27:31 GMT", "desc": "励骏酒店是平安在北京核心区域争夺高净值养老客户的重要布局；但高昂的成本能否转化为稀缺的养老服务资源、带动保险业务增长，仍有待时间检验 北京励骏酒店。 图：IC photo 【财新网】 中国平安 正在加码布局城市核心区养老社区。 近日， 平安人寿 计划将北京励骏酒店转型为高端养老社区的消息，在保险业和康养市场引发热议。北京市东城区住建委在回复提案时披露，已引入平安人寿实施励骏酒店项目，打造高端康养服务设施。平安人寿随后回应称，公司将持续深化“保险+高品质康养社区”模式，坚持“城芯享老”定位，深耕核心城市的核心区位。 励骏酒店是一家老牌五星级酒店，位于北京市东城区金宝街92号，地处北京二环内，毗邻王府井商圈，距离故宫仅约1.5公里，周边还有北京协和医院东单院区等医疗资源。酒店于2008年开业，项目占地约1.7万平方米，总建筑面积13.2万平方米。相较于通常选址在城市 const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
