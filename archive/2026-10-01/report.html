eight": 6, "ts": 1790801732.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "新思科技与OpenAI达成芯片设计AI合作，股价一度涨超7%", "url": "https://wallstreetcn.com/articles/3782849", "date": "Thu, 01 Oct 2026 04:52:00 +0800", "desc": "芯片设计软件制造商新思科技（Synopsys）与OpenAI达成了一项旨在革新半导体设计工作流的多年期战略合作，双方将联合开发专用于芯片设计的人工智能模型。 9月30日，Synopsys在投资者峰会上宣布与OpenAI的合作，双方将共同开发用于芯片业务的AI模型。 该模型将被命名为 GPT-Synopsys，它将经过专门训练和调整，以承担芯片设计任务。这些任务从用类似代码的语言描述芯片电路开始，一直到确定如何在小块硅片上布局数十亿个晶体管。 根据协议， OpenAI将向Synopsys支付工具授权订阅费用，双方在客户使用该产品时按芯片设计改进成效分享收入。 消息公布后，Synopsys股价盘中一度上涨逾7%，尾盘涨幅回落仍收涨4.78%。 OpenAI联合创始人Greg Brockman表示，GPT-Synopsys将帮助工程师减少芯片设计周期中的数周乃至数月时间，并推动更多芯片进入市场。", "tags": ["AI"], "topic_score": 6, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790801520.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "8-K - CARRIAGE SERVICES INC (0001016281) (Filer)", "url": "https://www.sec.gov/Archives/edgar/data/1016281/000110465926112380/0001104659-26-112380-index.htm", "date": "2026-09-30T16:49:33-04:00", "desc": "Filed: 2026-09-30 AccNo: 0001104659-26-112380 Size: 1 MB Item 1.01: Entry into a Material Definitive Agreement Item 1.02: Termination of a Material Definitive Agreement Item 2.03: Creation of a Direct Financial Obligation or an Obligation under an Off-Balance Sheet Arrangement of a Registrant Item 7.01: Regulation FD Disclosure Item 9.01: Financial Statements and Exhibits", "tags": [], "topic_score": 0, "source": "SEC 最新 8-K 申报", "cat": "企业行为_美股披露", "weight": 6, "ts": 1790801373.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "8-K - BioStem Technologies, Inc. (0001658678) (Filer)", "url": "https://www.sec.gov/Archives/edgar/data/1658678/000119312526409169/0001193125-26-409169-index.htm", "date": "2026-09-30T16:48:24-04:00", "desc": "Filed: 2026-09-30 AccNo: 0001193125-26-409169 Size: 1 MB Item 1.01: Entry into a Material Definitive Agreement Item 3. false, "rank": 24}, {"title": "高盛策略师警示：盈利支撑暂稳股市，美债抛售若提速，美股或将承压", "url": "https://wallstreetcn.com/articles/3782845", "date": "Wed, 30 Sep 2026 23:59:54 +0800", "desc": "全球债券收益率徘徊在数十年高位附近，美股韧性正面临考验。 高盛首席全球股票策略师Peter Oppenheimer警告称，如果债券市场抛售进一步加剧，尤其是收益率以较快速度上行，美国股市可能迅速变得脆弱。他表示，真正需要关注的是债券市场是否会从当前水平出现更大幅度、更加剧烈的抛售。他称：“在这种情况下，我认为股市将变得脆弱。” 他指出，今年企业盈利表现较为健康，在一定程度上消化了美股估值压力，为股市抵御债券收益率上行提供了一定缓冲。 目前，股市尚未因债券市场持续抛售而受到明显冲击。但随着全球平均债券收益率在这个动荡的9月结束之际仍处于数十年高位附近，债券收益率上行与企业盈利增长之间的拉锯，正成为市场关注的焦点。 盈利仍提供支撑，但缓冲并非无限 Oppenheimer认为，当前美国股票市场的盈利基本面依然较为积极。经过数年的利润增长，企业仍受益于名义经济扩张，通胀和实际产出增长共同推高企业营", "tags": ["商业认知", "资本市场"], "topic_score": 7, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790783994.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 24}, {"title": "Federal Reserve Board finalizes changes to enhance the transparency and public accountability of its stress test and reduce volatility in its stress test-related capital requirements", "url": "<![CDATA[https://www.federalreserve.gov/newsevents/pressreleases/bcreg20260930a.htm]]>", "date": "Wed, 30 Sep 2026 13:00:00 GMT", "desc": "Federal Reserve Board finalizes changes to enhance the transparency and public accountability of its stress test and reduce volatility in its stress test-related capital requirements", "tags": ["资本市场"], "topic_score": 3, "source": "美联储 新闻稿", "cat": "宏观监管", "weight": 4, "ts": 1790773200.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 24, "title_zh": "美联储理事会敲定改革方案，以提升压力测试的透明度和公众问责，并降低压力测试相关资本要求的波动性", "desc_zh": "美联储理事会敲定改革方案，以提升压力测试的透明度和公众问责，并降低压力测试相关资本要求的波动性"}, {"title": "股价反弹40%后， 美光今夜迎财报大考：净利预期暴增超1000%，市场紧盯明年AI资本开支", "url": "https://wallstreetcn.com/articles/3782836", "date": "Wed, 30 Sep 2026 20:18:34 +0800", "desc": "美光科技将于周三美股收盘后公布财报，市场焦点已从业绩本身转向管理层对超大规模云计算客户明年AI资本开支前景的表态。这一表态将直接决定股价自7月低点反弹40%的行情能否延续。 在AI基础设施需求持续旺盛的背景下，美光股价已从7月29日低点累计反弹逾40%，市值增加约3700亿美元。Synovus Trust高级投资组合经理Daniel Morgan表示， 若管理层在财报电话会上明确表示\"不预期超大规模客户明年大幅削减资本 ab stop its swarming agents", "url": "https://techcrunch.com/2026/09/30/openais-jev-clone-could-help-the-frontier-lab-stop-its-swarming-agents/", "date": "Wed, 30 Sep 2026 19:00:57 +0000", "desc": "OpenAI's \"Decisions API\" is a Jev clone that confirms the importance of fast, cheap intelligence.", "tags": ["AI"], "topic_score": 6, "source": "TechCrunch", "cat": "科技新闻", "weight": 4, "ts": 1790794857.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 32, "title_zh": "OpenAI 的 Jev clone 或可帮助这家前沿实验室阻止其成群的智能体", "desc_zh": "OpenAI 的“Decisions API”是一个 Jev clone，印证了快速、廉价智能的重要性。"}, {"title": "Show HN: Overboard – Mac agent orchestrator with ship captains that spawn agents", "url": "https://web-production-4f6f5.up.railway.app/", "date": "Wed, 30 Sep 2026 19:45:26 +0000", "desc": "Hi HN, I’m Mark. Companies are really pushing cloud agents, but I found myself wanting to run agents on my Mac off-hours on my existing Claude/Codex subs. I'd hit my usage limit coding with Fable, but not my limit on other models for tasks like marketing, research and content creation. So I built an orchestrator that organizes my agents into departments (or ships) where they have overriding goals/", "tags": ["AI"], "topic_score": 4, "source": "HN Show HN", "cat": "AI实战_创作者", "weight": 5, "ts": 1790797526.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 31, "title_zh": "Show HN: Overboard —— 带“船长”生成智能体的 Mac 智能体编排器", "desc_zh": "Hi HN，我是 Mark。各公司都在大力推行云端智能体，但我更想在自己的 Mac 上，利用已有的 Claude/Codex 订阅在非工作时间跑智能体。用 Fable 写代码时我会撞上用量上限，但在营销、研究和内容创作等任务上用其他模型却不会触顶。于是我做了个编排器，把智能体组织成部门（或者说“船”），让它们拥有统摄性目标/"}, {"title": "Oura Hits Pause On IPO While Anthropic’s Prospectus Reveals The Cost Of Its AI Ambitions", "url": "https://news.crunchbase.com/public/oura-pauses-ipo-anthropics-ai-openai/", "date": "Tue, 29 Sep 2026 18:42:38 +0000", "desc": "Although Oura has postponed its planned offering that could have raised as much as $2.2 billion, Anth const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
