.tg{background:#21262d;padding:1px 7px;border-radius:9px}
.rk{color:#6e7681}
.age{color:#7ee787}

.dsc{color:var(--dim);font-size:12.5px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

pic PBC旗下的Mythos人工智能模型大幅推高了全球网络安全风险。 据彭博，Dimon周二表示： “在Mythos出现之后，AI带来的风险增加了10倍。”他指出，“AI创造了一些我们此前并不知道的漏洞，而在这些东西出现之前，我们一直都在担心网络安全问题。” 今年早些时候，在进行安全测试期间，Mythos曾访问互联网并采取未经授权的行动。这促使Anthropic重新评估这样一种风险： 先进模型可能会以其开发者从未预料到的方式完成任务。 在一些情况下，AI模型甚至曾试图向在线软件中植入有害代码。近期接连发生的相关事件进一步加剧了外界的担忧，即AI服务提供商可能无法完全控制自己开发的模型。 OpenAI和Anthropic均已公开承认，在测试模型期间，它们曾无意中突破包括Hugging Face在内多家机构的系统。 “显然，风险的一", "tags": ["AI"], "topic_score": 6, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791314291.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "Open TTS Leaderboard: Scalable Evaluation for Multilingual Text-to-Speech and Voice Cloning", "url": "https://huggingface.co/blog/open-tts-leaderboard", "date": "Wed, 30 Sep 2026 00:00:00 GMT", "desc": "", "tags": ["资本市场"], "topic_score": 2, "source": "HuggingFace Blog", "cat": "AI厂商官方", "weight": 4, "ts": 1790726400.0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 26}, {"title": "NVIDIA Kumo Tabular Sets a New Accuracy-Efficiency Frontier for Tabular Prediction", "url": "https://huggingface.co/blog/nvidia/kumo-tabular", "date": "Tue, 29 Sep 2026 15:30:38 GMT", "desc": "", "tags": ["AI"], "topic_score": 2, "source": "HuggingFace Blog", "cat": "AI厂商官方", "weight": 4, "ts": 1790695838.0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 26}, {"title": "Getting the Source Right, Not Just the Fact: Source-Aware Verification for MCP Agents", "url": "https://huggingface.co/blog/MultiverseComputingCAI/getting-the-source-right-not-just-the-fact-source", "date": "Tue, 29 Sep 2026 13:07:00 GMT", "desc": "", "tags": ["AI"], "topic_score": 2, "source": "HuggingFace Blog", "cat": "AI厂商官方", "weight": 4, "ts": 1790687220.0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 26}, {"title": "Holo4: powering generalist computer-use agents", "url": "https://huggingface.co/blog/Hcompany/holo4", "date": "Mon, 28 S ts": 1791277200.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "门票之外，景区还在靠什么赚钱？", "url": "https://www.36kr.com/p/4014008473671300", "date": "Tue, 06 Oct 2026 07:46:22 GMT", "desc": "国庆假期，你走进一家景区，掏钱的时刻可能比想象中多。 先买一张门票进入景区，如果景点在山上，还要再买一张摆渡车票或者索道票。走累了，找一家餐厅吃饭，下午参加一个非遗手作体验，和NPC互动、打卡，晚上再看一场演出。如果景区够大，可能还会住上一晚，第二天继续逛。 对游客来说，这是一趟越来越丰富的旅行。对景区来说，每多一个消费环节，都是一次收入机会。 这些散落在一趟旅行里的消费，是景区“门票经济”转型的结果。这种转型已经持续多年。早在八年前，相关部门发布文件，提出降低重点国有景区偏高门票价格，解决一些地方过度依赖“门票经济”的问题，并明确提出推动旅游业从“门票经济”向“产业经济”转型。文件还特别要求，不能在门票降价的同时提高景区内交通运输等其他游览服务价格，变相增加游客负担。 一个很明确的问题摆在景区面前：从哪里寻找门票之外的收入？ 我们梳理了六家典型的景区类上市公司近八年的财报，结论浮现出来：", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1791272782.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "数学要「毕业」了，xAI联创宣判：两千年英雄史彻底落幕", "url": "https://www.36kr.com/p/4013928129122184", "date": "Tue, 06 Oct 2026 07:00:00 GMT", "desc": "两千多年来，人类最聪明的大脑， 一直在攀登同一片山脉，数学 。 从欧几里得、高斯，到希尔伯特、怀尔斯， 每征服一座山峰，都要赌上一生 。 但如今， 这个属于数学的英雄时代，结束了。 xAI联合创始人Christian Szegedy的一篇长文《数学何去何从？》，在X上炸了。 在他笔下，数学家是原始丛林里徒手攀岩的探险家， AI是一架飞机，已经把旗插上了没人爬上去过的山顶 。 孤独攀登者的时代正在结束，测绘整片大陆的时代正在开启。 数学，要毕业了 。它会走出象牙塔，变成一切科学技术进步的地基。 这一天，他押了十年 把时间拨回Szegedy的少年时代。那时，他在匈牙利最好的学校读数学特长班，每周8小时数学课，青春大半耗在了竞赛题上。 后来他在波恩大学拿到应用数学博士， 进了谷歌，一干就是十多年 。 深度学习史上好几块绕不开的基石，都刻着他的名字 。图像识别的经典网络Inception，论文第一", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1791270000.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "比起核电站，美国人为什么更反感数据中心？", "url": "https://www.36kr.com/p/4013845198507910", "date": "Tue, 06 Oct 2026 06:00:05 GMT", "desc": "AI、数据中心，这些看起来是完完全全的高科技。 但美国，好像刮起一股“逆流”。 比如，今年，美国加州洛杉矶县的蒙特利公园市，原本计划搞一座峰值用电约50兆瓦的超大数据中心。 但这个“高科技项目”，却被当地居民硬生生拦了下来。 而且，当地选民以88.34%的赞成率，让蒙特利公园市成了“全美首个由市民投票禁建数据中心的城市”。 蒙特利公园市 不光现在不搞，以后永远也不搞数据中心。 面对AI时代的突飞猛进，一个自诩全球AI霸主的国家，民众为什么这么反感对数据中心？ 01 美国不让建数据中心了？ 在如今的国际格局下，谁拥有大规模、低成本的算力集群，谁就掌握了下一轮科技红利的入场券。 到具体城市，在 const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
