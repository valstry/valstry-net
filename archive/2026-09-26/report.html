950330503", "date": "Fri, 25 Sep 2026 09:18:07 GMT", "desc": "正所谓天下文章一大抄，看你会抄不会抄。 刚刚发布的Opus 5.5和GPT-6 Luna，一眼望去，这两个模型上面满满是姚顺雨和梁文锋的影子。 或许是因为两家公司都已经将预训练做到了极致，为了提升模型的智能以及降低算力成本，所以这两个新模型都选择开辟新的战场。 Opus 5.5是对上下文动手，GPT-6 Luna是对缓存动手。 这我可熟啊！一个混元，一个 DeepSeek 啊！ 但你别说，阿莫迪和奥特曼还真抄得挺像那么回事。 阿莫迪偷师姚顺雨 先看一组数字，Artificial Analysis的智能指数里，有一项统计是“跑完一道题平均要输出多少token”。 在这张榜单上，Claude Opus 5.5在max档位下，平均每题要吐出11.9万个输出token，其中8.4万个是“思考”，3.5万个是最终答案。而OpenAI的GPT-6 Astra，在同一档位下只用了2.7万个 token。", "tags": ["AI"], "topic_score": 3, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1790327887.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27}, {"title": "Evaluation of OpenAI o1: Opportunities and Challenges of AGI", "url": "https://arxiv.org/abs/2409.18486", "date": "Fri, 25 Sep 2026 00:00:00 -0400", "desc": "arXiv:2409.18486v5 Announce Type: replace Abstract: This comprehensive study evaluates the performance of OpenAI's o1-preview large language model across a diverse array of complex reasoning tasks, spanning multiple domains, including computer science, mathematics, natural sciences, medicine, linguistics, and social sciences. Through rigorous testing, o1-preview demonstrated remarkable capabilitie", "tags": ["AI", "资本市场"], "topic_score": 8, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1790308800.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27, "title_zh": "OpenAI o1 评估：AGI 的机遇与挑战", "desc_zh": "arXiv:2409.18486v5 公告类型：替换 摘要：这项综合研究评估了 OpenAI o1-preview 大语言模型在多个领域的各类复杂推理任务上的表现，涵盖计算机科学、数学、自然科学、医学、语言学和社会科学。经过严格测试，o1-preview 展现出卓越的能力……"}, {"title": "LLMersion: A Local-First AI Agent Framework for Low-Cost Home Language Learning toward Educational Equity", "url": "https://arxiv.org/abs/2609.29672", "date": "Fri, 25 Sep 2026 00:00:00 -0400", "desc": "arXiv:2609.29672v1 Announce Type: new Abstract: Artificial intelligence helps education most where an essential provision has been rationed by cost. For l reetcn.com/articles/3782555", "date": "Sat, 26 Sep 2026 03:10:14 +0800", "desc": "SK海力士旗下美国子公司Solidigm正在评估上市计划， 潜在估值最高达1500亿美元，有望成为美国半导体史上规模最大的IPO。 据路透援引知情人士透露， Solidigm本周已与多家投行举行竞标会议，就IPO承销角色展开角逐，标志着上市进程迈出实质性一步。 该公司计划最早于明年完成上市，目标募资规模约150亿美元。 消息人士提醒，包括交易规模和时间表在内的相关计划仍处于早期阶段，可能因市场状况而调整。 据彭博报道， 今年8月，Solidigm与CoreWeave达成多年期协议，向后者提供企业级固态硬盘（SSD）容量。 Solidigm的其他客户还包括Vast Data、戴尔和腾讯。 若最终成行，此次上市将为这家专注于NAND闪存和企业级固态硬盘的公司提供独立估值，同时借助人工智能基础设施投资热潮吸引市场资金。 AI相关需求持续推动半导体硬件股上涨，Solidigm所在赛道正处于这一趋势", "tags": ["商业认知", "资本市场"], "topic_score": 7, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790363414.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "Meta's Muse appears to use an OpenAI model labeled muse-special", "url": "https://mouse.dev/blog/muse-special/", "date": "Fri, 25 Sep 2026 18:18:06 +0000", "desc": "Article URL: https://mouse.dev/blog/muse-special/ Comments URL: https://news.ycombinator.com/item?id=49848095 Points: 108 # Comments: 45", "tags": ["AI"], "topic_score": 4, "source": "Hacker News 前页", "cat": "AI实战_创作者", "weight": 4, "ts": 1790360286.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "Meta’s AI Tamagotchi bet is…working?", "url": "https://techcrunch.com/video/will-metas-ai-tamagotchi-bet-isworking/", "date": "Fri, 25 Sep 2026 16:00:00 +0000", "desc": "When AI leaders at OpenAI and Anthropic started talking about “pacing the frontier,” maybe someone should have asked: what pace? Now it’s turned into model drop week for both companies as Anthropic rolled out Opus 5.5, followed by OpenAI’s GPT-6 model updates just 90 minutes later. But the company that stole the spotlight was Meta, whose personal AI agent Muse is reportedly outpacing ChatGPT’s ear", "tags": ["AI"], "topic_score": 4, "source": "TechCrunch", "cat": "科技新闻", "weight": 4, "ts": 1790352000.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": 数据中心开发商，由阿波罗全球管理公司控股。 数据中心开发商表示，部署完整的1GW算力将需要至少400亿美元的资本投资。Anthropic需要为租赁提供财务担保，并为在这些数据中心内安装的芯片另行筹措资金。 Anthropic已就成为直接租户并部署由谷歌和博通联合设计的TPU进行了讨论，不过也可以使用英伟达的GPU。谷歌可能会提供信用担保，但该项支持的具体范围尚不明确。 相关洽谈仍处于初步阶段，容量和交易结构仍在谈判之中。 阿波罗于2025年11月收购了Stream的多数股权，当时阿波罗曾表示，该开发商已交付超过20个数据中心园区，并拥有超过4GW的开发储备项目。 这项潜在的租赁协议将使Anthropic进一步延伸其摆脱仅从云服务提供商获取服务", "tags": ["AI"], "topic_score": 5, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790372901.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 24}, {"title": "还没破百万日活，Meta Muse就频频掉链子：服务降级、Agent失败，算力瓶颈浮出水面", "url": "https://wallstreetcn.com/articles/3782546", "date": "Fri, 25 Sep 2026 20:00:20 +0800", "desc": "Meta旗下个人AI智能体Muse用户增长迅猛，但服务端压力已经提前显现。过去11天内，Muse日活用户增长约10倍至70万，但服务降级、Agent任务失败等问题也开始出现，算力瓶颈逐渐浮出水面。 Muse近期已出现多项服务异常， 包括资源消耗远超内部测试预期、部分功能出现降级，以及Agent在执行复杂任务时频繁失败。 一次压力测试中，Muse尝试同时创建120个子Agent，最终仅成功33个，显示其实际运行负载已经给服务稳定性带来压力。 据网络分析机构Similarweb数据，Muse目前日活用户约70万。值得注意的是，这一增长尚未覆盖全部潜在用户：Muse目前仅面向美国和加拿大开放，WhatsApp和Instagram也尚未全面开放注册入口。若后续进一步扩大开放范围，服务端承受的计算负载还将继续上升。 Muse的核心问题在于其高计算资源占用的运行架构。Meta为每名用户配置独立云端虚拟", "tags": ["AI"], "topic_score": 6, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790337620.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 24}, {"title": "瑞银：美企Capex意愿触底反弹，进一步加息对经济冲击或有限", "url": "https://wallstreetcn.com/articles/3782536", "date": "Fri, 25 Sep 2026 16:34:12 +0800", "desc": "美国企业资本开支意愿正在从低位反弹，进一步加息对经济增长的边际拖累或因此低于历史经验。 瑞银在近期报告中指出， 美国企业投资已经经历较长时间的疲弱，当前资本开支的起点明显低于过去周期。在这一背景下，即使利率继续上升，其对企业投资的新增压制空间也可能有限。 与此同时，AI投资仍是美国资本开支增长的主要支柱。过去8个季度，AI相关投资同比增长26%；但更值得关注的是，剔除AI因素后，企业资本开支意愿也开始回升，显示投资企稳迹象可能正从科技行业向更广泛的企业部门扩散。 瑞银认为， 长期低迷积累的维护和更新需求、企业充裕的经营现金流，以及AI需求向其他行业扩散的可能性，都可能为资本开支修复提供支撑。 这意味着，判断紧缩政策的影响，不能只看利率水平，还要观察企业投资的边际变化。 传统投资已持续疲弱，利率冲击空间可能收窄 按照美联储FRBUS模型的经验法则，利率每上升100个基点，第一年大致会令经济增", "tags": ["企业落地", "资本市场"], "topic_score": 6, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790325252.0, "opinion": false, "is_hot": false, "is_vendor": false,  14:33:33 +0800", "desc": "围绕“AI失控”的担忧正在演变为一场更广泛的监管讨论。分析人士认为，如果监管逻辑从限制AI风险进一步延伸至身份认证、内容审查和数字基础设施，最终影响的可能不只是AI行业，而是整个互联网的运行规则。 据OffGuardian作者Kit Knightly分析，当前围绕AI风险展开的讨论，与此前气候变化议题中的部分叙事路径存在相似之处——先强调风险，再推动干预措施，最终可能演变为一套更为严格的监管框架。 按照这一“最坏情景”推演，监管可能沿着一条逐步扩大的路径推进： 先提高AI服务的使用门槛，通过付费、实名和内容审查加强控制；再以防范AI冒充人类为由，推动“人格证明”机制，将数字身份与更多线上活动绑定；最终，数据中心的能源消耗和碳排放可能成为新的监管切入口，并进一步影响互联网使用成本。 对投资者而言，这意味着开源AI模型可能面临更高的合规门槛，AI基础设施的监管成本或将上升，而大型科技公司凭借资", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790318013.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "高盛180度转向！日元12个月目标从165上调至150", "url": "https://wallstreetcn.com/articles/3782533", "date": "Fri, 25 Sep 2026 14:20:18 +0800", "desc": "日元前景出现重大转折。 高盛集团逆转今年7月确立的看空立场，大幅上调日元目标价，将12个月预测从165上调至150，理由是日本国内政策转向加速及资本回流预期升温。 高盛策略师Karen Reichgott Fishman在最新报告中同步上调日元三个月及六个月目标，分别由此前水平调整至158和155。她指出，日本央行加快加息步伐以及国内资本回流日本资产的可能性上升，共同构成此次预测大幅修正的核心驱动力。 受多重利好因素叠加，日元周五一度升至每美元158.28的高位。日本财务大臣片山皋月（Satsuki Katayama）此前透露，美国总统特朗普在与日本首相高市早苗的会面中就日元疲软问题表达了关切，此消息亦对日元形成明显支撑。 政策转向与资本回流：看涨逻辑的双重支柱 Fishman在报告中阐述，日本央行加快加息节奏已起到两重效果： 一方面抑制了扩张性财政政策带来的通胀压力，另一方面也相应减轻了", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790317218.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "Meta CTO解释Muse：回归人性交互，下一代操纵系统的核心是“意图理解”", "url": "https://wallstreetcn.com/articles/3782529", "date": "Fri, 25 Sep 2026 13:19:41 +0800", "desc": "Meta首席技术官Andrew Bosworth 24日在一档播客节目中，就公司旗下AI助手Muse及更广泛的AI战略发表了系统性阐述。当前AI产业过度沉迷于基准测试分数，而忽视了用户体验的本质——Muse的差异化正在于此。 Muse自内测起便已获得Bosworth本人的高度认可，他表示自己迅速将大量工作负载转移至这一平台。产品正式发布后，外部用户的反应与内部预期高度吻合，令其团队深感鼓舞。Bosworth强调，Muse的成功并非来自模型原始智能的最大化，而是来自对\"如何让人类更好地使用工具\"这一命题的深入思考。 与此同时，Bosworth描绘了Meta对下一代人机交互范式的判断： 从\"直接操控\"走向\"意图理解\"，英语将成为新的编程语言。 在AI安全与隐私层面，Meta采取了若干值得关注的举措：公司延迟了Muse的发布时间以完善隐私架构，并推出端对端加密的\"私密AI处理\"功能——用户与服务", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight" const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
