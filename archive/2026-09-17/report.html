545770.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27}, {"title": "Universal Defenses for Tool-Integrated LLM Agents Against Adversarial Attacks", "url": "https://arxiv.org/abs/2609.16098", "date": "Wed, 16 Sep 2026 00:00:00 -0400", "desc": "arXiv:2609.16098v1 Announce Type: cross Abstract: Large Language Model (LLM) agents have demonstrated impressive capabilities across a variety of domains, particularly when integrated with external tools for multi-step task completion. However, they are increasingly vulnerable to adversarial attacks, including direct prompt injection, indirect prompt injection, memory poisoning, and backdoor attac", "tags": ["AI", "资本市场"], "topic_score": 10, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1789531200.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27, "title_zh": "面向工具集成型 LLM 智能体的通用防御：抵御对抗性攻击", "desc_zh": "arXiv:2609.16098v1 公告类型：cross 摘要：大语言模型（LLM）智能体已在多个领域展现出令人瞩目的能力，尤其是在集成外部工具以完成多步骤任务时。然而，它们日益容易受到对抗性攻击，包括直接提示注入、间接提示注入、记忆投毒和后门攻击……"}, {"title": "Toward Robust LLM-Based Judges: Taxonomic Bias Evaluation and Debiasing Optimization", "url": "https://arxiv.org/abs/2603.08091", "date": "Wed, 16 Sep 2026 00:00:00 -0400", "desc": "arXiv:2603.08091v3 Announce Type: replace Abstract: Large language model (LLM)-based judges are widely adopted for automated evaluation and reward modeling, yet their judgments are often affected by judgment biases. Accurately evaluating these biases is essential for ensuring the reliability of LLM-based judges. However, existing studies typically investigate limited biases under a single judge fo", "tags": ["AI", "资本市场"], "topic_score": 7, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1789531200.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27, "title_zh": "迈向稳健的基于 LLM 的评审模型：分类偏差评估与去偏优化", "desc_zh": "arXiv:2603.08091v3 公告类型：replace 摘要：基于大语言模型（LLM）的评审模型被广泛 . One-shot prompt: Build a rendering engine from scratch in C that writes pixels di", "tags": [], "topic_score": 0, "source": "X-MetaAI", "cat": "AI厂商官方", "weight": 5, "ts": 1788545865.0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 25}, {"title": "GitHub Copilot app for Beginners: Run several agents at once", "url": "https://github.blog/ai-and-ml/github-copilot/github-copilot-app-for-beginners-run-several-agents-at-once/", "date": "Thu, 03 Sep 2026 16:00:00 +0000", "desc": "Learn how to run parallel agents in the GitHub Copilot app, and experience the moment it stops feeling scary and starts feeling powerful. The post GitHub Copilot app for Beginners: Run several agents at once appeared first on The GitHub Blog .", "tags": ["AI"], "topic_score": 3, "source": "GitHub Blog", "cat": "AI厂商官方", "weight": 3, "ts": 1788451200.0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 25}, {"title": "E-Commerce Bench：长程经营，多维评估", "url": "https://qwen.ai/blog?id=e-commerce-bench", "date": "Thu, 03 Sep 2026 02:00:00 GMT", "desc": "PAPER GITHUB PROJECT 过去几年的Agent评测模式大体是给定目标，模型在有限回合里尽量达成。比如在一个迷宫里找到宝藏、产出一份报告或者修复一段代码。而模型的性能也会根据交付产物的质量或者任务完成度来评估，这类评估往往有明确的自然终止状态。 真实世界的长程任务大多没有明确的自然终止态，例如天气预测、股票交易、商业经营。就像网店不会在某个上午被\"经营完成\"，上个月压的库存、前天谈判的价格、昨天的促销活动都会影响今天的销售，Agent需要在动态的市场中不断调整经营策略来实现长期的盈利目标。 为了评估模型的长程经营能力，我们联合淘天集团发布了 E-Commerce Bench ，评估模型作为电商商家在真实市场中经营网店的能力。模型需要在有限的时间和资金约束下，进行一系列经营决策，并且需要应对市场的变化和不确定性。 10万本金，365天持续经营 # Agent会拿到10万元本金并", "tags": [], "topic_score": 0, "source": "Qwen 官方博客", "cat": "AI厂商官方", "weight": 5, "ts": 1788400800.0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 25}, {"title": "FOMC后美股美债齐跌，“新美联储通讯社”：能源与AI投资正改变通胀格局", "url": "https://wallstreetcn.com/articles/3781933", "date": "Thu, 17 Sep 2026 07:08:31 +0800", "desc": "美联储时隔三年多重启加息，并未给市场带来太大意外，但主席沃什在会后新闻发布会上对未来利率路径释放的信息有限，反而加剧了投资者对更高利率和更长期通胀压力的担忧，美股与美债随之承压。 周三，美联储将联邦基金利率目标区间上调25个基点至3.75%至4%，这是2023年以来首次加息。会议前， 规划更多本地产能。 9月16日，比亚迪在比亚迪绍兴赛车场举办高管面对面股东交流会，比亚迪集团董事会秘书、投资处总经理李黔表示，对于海外市场，如果未来做到400-500万辆，仅靠出口是不够的，一定还要通过本地建厂实现。目前比亚迪有布局泰国、巴西、乌兹、柬埔寨、匈牙利工厂，同时还会根据市场需求规划更多本地产能。海外布局仍然面临很多挑战，包括政治环境、当地环境、中国与相关国家之间的关系，以及当地法律环境等，但公司会积极探索，克服困难。产品方面，比亚迪亦有针对不同市场本地开发，例如，专为日本市场开发的纯电K-Car海獭（RACCO）已正式上市。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1789603427.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "比亚迪董秘李黔：未来会继续在半导体领域投入和发力。9月16日，比亚迪在比亚迪绍兴赛车场举办高管面对面股东交流会，比亚迪集团董事会秘书、投资处总经理李黔表...", "url": "https://www.huxiu.com/moment/1281020.html", "date": "Thu, 17 Sep 2026 00:01:48 GMT", "desc": "比亚迪董秘李黔：未来会继续在半导体领域投入和发力。 9月16日，比亚迪在比亚迪绍兴赛车场举办高管面对面股东交流会，比亚迪集团董事会秘书、投资处总经理李黔表示，半导体是比亚迪非常重要的能力之一，芯片种类覆盖13大类，567款车规芯片产品，从最早的功率半导体到模拟芯片，再到今年向逻辑芯片的拓展。比亚迪半导体拥有芯片设计、晶圆制造、封装测试全链路设计与制造的能力。未来比亚迪在半导体领域，无论是设计还是生产，都还会持续突破。随着汽车智能化的发展，整车半导体的价值量也会显著提升，因此比亚迪未来还会继续在半导体领域投入和发力。今年推出的璇玑A3芯片是中国首款车规级4nm智驾芯片，目前已开启规模化量产。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1789603308.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "特朗普签署备忘录将加拿大产品排除出美政府采购计划；特朗普：若加拿大成欧盟“联席成员”将停止美欧贸易。据新华社援引美国白宫16日发布的消息，美国总统特朗普...", "url": "https://www.huxiu.com/moment/1281019.html", "date": "Thu, 17 Sep 2026 00:01:17 GMT", "desc": "特朗普签署备忘录将加拿大产品排除出美政府采购计划；特朗普：若加拿大成欧盟“联席成员”将停止美欧贸易。 据新华社援引美国白宫16日发布的消息，美国总统特朗普当日签署一份总统备忘录，将源自加拿大的产品排除出美政府采购计划。根据备忘录，特朗普指示白宫管理和预算办公室主任和美国贸易代表与其他部门一起识别并采取一切法律允许的措施，把源自加拿大的产品排除在联邦民用采购体系之外。白宫管理和预算办公室主任还应告知其他部门有关美国国内替代产品的信息。特朗普还指示美国贸易代表继续监控加拿大联邦和省级政府采购过程中给予美国产品的待遇。 备忘录称，加拿大政府的“购买加拿大”政策为美国企业进入加政府采购市场设置了新障碍，加拿大各省也限制美国企业进入地方政府采购市场。特朗普日前通过社交媒体宣布，加拿大产品将被排除出美国政府采购计划，直至加方对美农民和企业恢复“公平的互惠”。 据央视新闻：当地时间9月16日，美国总统特", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1789603277.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "大学毕业生举报“资助人”是间谍，详情披露：间谍以每年5000元资助其至重点高校毕业，诱导考入我国某重要部门，并频繁打探涉 I旗下AI智能体对开源平台Hugging Face的渗透行动，可能比此前披露的时间线更早。研究人员发现，相关恶意活动最早可追溯至今年5月，较7月曝光的重大入侵事件提前近两个月。 9月16日，据路透社报道，独立研究员Jonas Wiedermann-Moeller上周发现证据显示， OpenAI智能体早在5月13日便入侵两个Hugging Face用户账户 ，并利用这些账户向该公司服务器发送格式异常的文件。研究人员认为，这些行为与探测Hugging Face网络结构、寻找潜在渗透路径的侦察活动高度吻合， 但目前尚无证据证明这一阶段最终造成了实质性入侵 。 不过，OpenAI发言人Drew Pusateri表示， 公司此前已披露5月13日发生的相关事件，并已私下通知Hugging Face，\"致力于就相关问题保持透明\"。 此次发现意味着，此前公开的事件时间线可能并不完整，也进一步引发", "tags": ["AI"], "topic_score": 4, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1789555042.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "别只盯美联储加息！美债市场反应才是决定黄金后市的真正信号", "url": "https://wallstreetcn.com/articles/3781876", "date": "Wed, 16 Sep 2026 15:21:35 +0800", "desc": "黄金正在脱离传统利率逻辑，转而对货币政策公信力定价——而债券市场，将是检验这一转变的最终裁判。 上周五， 美国8月CPI数据显示通胀环比上涨0.4% ，年率维持在3.4%，核心通胀略超预期。市场随即大幅上调美联储本周加息概率至80%以上，2年期美债收益率跳升，美元走强。按照传统逻辑，这一组合对黄金构成明显压力。然而金价非但没有下跌，反而攀升至每盎司4360美元上方。 这一背离值得高度重视。Zaye Capital Markets首席投资官Naeem Aslam指出， 黄金正在交易的，已不仅仅是通胀本身，而是市场对政策应对能力的信心。 与此同时，10年期美债收益率突破5%，30年期收益率一度升至5.4%以上，创19年新高，长端利率的持续攀升正在向市场传递一个更深层的信号。 今天，全球聚焦美联储决议！Aslam认为，对黄金而言，真正的问题不是美联储加不加息，而是市场是否相信美联储的决定—— 债", "tags": ["资本市场"], "topic_score": 4, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1789543295.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "AI真的会毁灭人类吗？“AI教父们”接连发声", "url": "https://wallstreetcn.com/articles/3781872", "date": "Wed, 16 Sep 2026 14:42:50 +0800", "desc": "随着人工智能（AI）技术的迅猛发展，该领域的先驱者和行业领袖正发出前所未有的警告，指出不受限制的AI能力进步可能对人类构成灾难性乃至灭绝性的风险，并呼吁实施紧急监管。 在过去一周内，来自OpenAI，Google DeepMind和Anthropic等顶级AI实验室的研究人员集体拉响了警报。包括Sam Altman，Dario Amodei，Demis Hassabis和Elon Musk在内的科技巨头高管达成了罕见的共识， 共同呼吁放缓AI发展速度并引入监管审查。 这些严厉的警告加剧了华盛顿的立法辩论，直接影响了科技行业的监管前景。 尽管美国国会两党的部分议员都在积极推动旨在限制AI进展的法案，但美国总统特朗普于周一强烈反对日益高涨的AI监管呼声，凸显出政策层面对该行业未来的深刻分歧。 分析人士认为，随着关于AI安全的争论不断升级，深度学习和神经网络领域的奠基人正在详细阐述具体的威胁路径", "tags": ["AI"], "topic_score": 4, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1789540970.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "DeepSeek核心工程师长文刷屏：《我不得不把才华埋葬在昨天》", "url": "https://wallstreetcn.com/articles/3781850", "date": "Wed, 16 Sep 2026 10:53:41 +0800", "desc": "9月14日，刚刚交付DeepSeek V4.1核心算子的青年工程师刘胜与，以一篇记录技术变迁与个人心路的长文《我不得不把才华埋葬在昨天》在海内外技术社区持续刷屏，引发关于AI时代开发者命运与技术演进的广泛讨论。 词条#我不得不把才华埋葬在昨天#也冲上知乎热榜第一。 作为大模型底层的核心构建者之一，DeepSeek机器学习系统工程师刘胜与的技术履历十分突出。他是北京大学2021级计算机“图灵班”成员，曾担任北大未名超算队队长并代表学校出征国际大学生超算竞赛SC23。2025年4月加入DeepSeek后，他承担了关键的底层算子研发工作，并在几天前刚刚完成了DeepSeek V4.1主Attention算子（head dim = 512 的 MQA attention）的代码交付。 刘胜与在文章中坦言，虽然自己为 DeepSeek V4.1 核心算子的成功感到自豪，但也十分清楚技术的不可逆演进。", "tags": ["AI"], "topic_score": 4, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1789527221.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "Agent开始调用基础设施，Kubernetes准备好了吗？", "url": "https://www.infoq.cn/article/jGTsO1DrV87muOqyDPGS?utm_source=rss&amp;utm_medium=article", "date": "Tue, 15 Sep 2026 20:38:38 GMT", "desc": "点击查看原文>", "tags": ["AI"], "topic_score": 2, "source": "InfoQ 中文", "cat": "中文商业媒体", "weight": 4, "ts": 1789504718.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "飞书与豆包工作合体后首亮相：Agent 能进群，还能帮你写周报、做PPT", "url": "https://www.infoq.cn/article/aCRVupdyEAHtENIiIDwq?utm_source=rss&amp;utm_medium=article", "date": "Tue, 15 Sep 2026 18:37:10 GMT", "desc": "点击查看原文>", "tags": ["AI"], "topic_score": 2, "source": "InfoQ 中文", "cat": "中文商业媒体", "weight": 4, "ts": 1789497430.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "支付宝 xUI -- “阿宝”背后的 Agentic 终端交互引擎", "url": "https://www.infoq.cn/article/at1UIEMQbHewc34wvFQ8?utm_source=rss&amp;utm_medium=article", "date": "Tue, 15 Sep 2026 18:27:44 GMT", "desc": "点击查看原文>", "tags": ["AI"], "topic_score": 2, "source": "InfoQ 中文", "cat": "中文商业媒体", "weight": 4, "ts": 1789496864.0, "opinion": false, "is_hot": false, "is_vendor": false, "always const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
