3233236.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "华尔街“琢磨”沃什讲话：暗示还将加息，但幅度不会太大", "url": "https://wallstreetcn.com/articles/3784725", "date": "Thu, 29 Oct 2026 08:17:57 +0800", "desc": "美联储周三维持利率不变，但联储主席沃什措辞被市场解读为今年晚些时候仍将加息的明确信号——只是幅度料将有限。这一“不说破”的沟通策略，令华尔街分析师和交易员各自解读，市场对政策路径的预期也随之逐步清晰。 周三（10月28日）， 美联储以10比2的投票结果决定 将联邦基金利率目标区间维持在3.75%至4%不变，市场随即将目光投向12月会议，并预期2027年初或将再度加息。 沃什在新闻发布会上以强劲经济数据为铺垫，将通胀持续高于2%目标近六年的现实置于政策讨论核心 ，暗示美联储的工作尚未完成。 多位经济学家认为，沃什此番表态实际上为12月加息铺路，同时刻意为自己保留政策灵活性。 BNY Investments首席经济学家Vincent Reinhart将其概括为：“他在为进一步收紧做铺垫，但同时也在划定边界——不需要收紧太多。 ”期货市场定价显示，投资者目前预期美联储将在12月和明年3月各加息一", "tags": ["资本市场"], "topic_score": 3, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793233077.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "贝森特“安抚华尔街”：美债没问题，AI融资没问题，美联储再加息也没问题", "url": "https://wallstreetcn.com/articles/3784723", "date": "Thu, 29 Oct 2026 08:15:22 +0800", "desc": "美国财政部长贝森特（Scott Bessent）周三集中回应了市场对多个核心风险点的担忧，在美联储宣布维持利率不变后不久，他向投资者传递出一个明确信号：当前美国经济与金融体系的主要压力点均在可控范围之内。 据CNBC和彭博社10月28日报道， 在AI融资风险方面，贝森特明确表示“完全不认为这是问题” ，并指出新云计算公司（neoclouds）在整体AI生态系统中占比有限，融资和交易仍在持续推进。在美联储政策方面，他罕见地表示，未来若美联储再度加息，“不一定是政策失误”，与此同时重申对美联储主席沃什（Kevin Warsh）的高度信任。在美债收益率问题上，他将当前高企的10年期国债收益率部分归因于美联储2024年大选前的降息决定，并暗示随着伊朗冲突趋于平息、能源价格回落，通胀压力有望缓解，借贷成本也将随之下降。 上述表态发生在市场对AI债务泡沫、美债收益率持续高位以及美联储政策路径高度不确定", "tags": ["资本市场"], "topic_score": 3, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793232922.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "微软预计不到3000人接受自愿离职微软回应推出自愿离职方案。微软发言人向《商业内幕》透露，公司本周向超过四分之一的员工提供自愿离职补偿方案，但预计最终接受...", "url": "https://www.huxiu.com/moment/1292182.html", "date": "Thu, 29 Oct 2026 00:10:03 GMT", "desc": "微软预计不到3000人接受自愿离职微软回应推出自愿离职方案。 微软发言人向《商业内幕》透露，公司本周向超过四分之一的员工提供自愿离职补偿方案，但预计最终接受的人数不超过3000人。当地时间28日，微软CFO艾米·胡德在内部备忘录中重申了这一判断，并回应员工对方案出台原因的疑问。我知道有些员工不明白我们为什么要在本周推出自愿离职方案。我们的初衷是让想离开微软的员工能够自主决定如何离职。考虑到公司提供的职业发展机会 ags": [], "topic_score": 0, "source": "The Information", "cat": "金融媒体_英文", "weight": 3, "ts": 1793232041.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "Marvell in Talks to Buy Lumentum", "url": "https://www.theinformation.com/briefings/marvell-talks-buy-lumentum", "date": "2026-10-28T23:59:24Z", "desc": "", "tags": [], "topic_score": 0, "source": "The Information", "cat": "金融媒体_英文", "weight": 3, "ts": 1793231964.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "被发明的捕鲸“传统”：近代日本如何捕掠海洋？｜带着问题去读书", "url": "https://mini.caixin.com/2026-10-27/102497827.html", "date": "Wed, 28 Oct 2026 23:40:03 GMT", "desc": "近代早期和当代的日本人都捕鲸，但无论技术、设备、场所，还是参与者，都发生了巨大的变化。将二者都称为“日本的捕鲸传统”无疑是一种误导 《吞鲸者：近代日本如何捕掠海洋》雅各比娜·K. 阿奇 著 韩钊 译 【前记： 这是一部关于近代早期日本的环境警示录。几个世纪前，数以万计的露脊鲸、灰鲸和座头鲸曾游弋在太平洋广阔的海域；而在今天，这些鲸群却已所剩无几。围绕现代日本的捕鲸争议，美国历史学家雅各比娜·K. 阿奇借助来源广泛的多种资料，以敏锐的历史学眼光，追溯鲸鱼以及商业捕鲸副产品如何融入日本各地的生活，对“几千年捕鲸传统”的修辞提出质疑，指出日本捕鲸从未和谐地“可持续”过。 】 几个世纪前，曾有数以万计的露脊鲸、灰鲸和座头鲸游弋于太平洋上的一个面积辽阔的狭长地带里，今天，它们规模庞大的洄游行为仅余下了少量踪迹。对于一个站在日本和歌山县岩石质海岸上的人而言，鲸喷出的粗壮水柱和洄游的鲸群那偶尔惊鸿一瞥的", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1793230803.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "美联储维持利率不变 2027年起议息会议渐减至每年六次", "url": "https://international.caixin.com/2026-10-29/102498325.html", "date": "Wed, 28 Oct 2026 23:36:19 GMT", "desc": "芝商所的美联储观察工具显示，10月议息会议结束后，美联储12月加息的概率从78.3%上升至83.3% 当地时间10月28日，美国联邦储备委员会宣布，将联邦基金利率目标区间维持在3.75%至4%不变。美联储主席沃什出席记者会。图：沙晗汀/中新社/视觉中国 【财新网】 10月28日，美联储在10月议息会议上维持利率不变，与市场预期相符。在2026年9月的议息会议上，美联储刚刚加息25个基点。 美联储发布的声明称，联邦公开市场委员会以10比2的投票结果，决定将联邦基金利率目标区间维持在3.75%至4%不变。投反对票的两名委员分别是美联储理事库克和克利夫兰联储主席贝丝·哈马克（Beth M. Hammack），二人认为美联储应该在10月会议上加息25个基点。 美联储10月的议息声明将美国经济活动描述为强劲扩张，相比之下，美联储在9月的议息声明中称之为稳健。声明的其余部分与9月基本没有变化。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1793230579.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "“养老贷”再惹议 贷款缴社保划算吗？｜社保算账", "url": "https://www.caixin.com/2026-10-29/102498240.html", "date": "Wed, 28 Oct 2026 23:36:19 GMT", "desc": "做法早有先例；关键是如何平衡养老金保障水平与还款压力 张浩田在文中提到，当前，助保贷款产品面临还款压力与养老金保障水平之间的平衡问题。图：IC photo 【财新网】 2025年夏天，湖北省荆门市农商银行曾推出一款“社银贷”产品，试图以银行信用贷款帮助参保人缴纳社保。时隔一年多，相关介绍文章近日再次引发热议。 网络流传的湖北省人社厅及《中国社会保障杂志》等文章介绍，该产品专为缴费能力不足的参保群众量身定制，无需抵押担保，凭借个人信用即可申请，提供低利率普惠贷款，“既解决了灵活就业人员社保缴费难题，又为银行机构拓展生意，实现‘社保增信、银行获客、群众受益’三方共赢。” 但舆论却有不同看法。一些人赞同称，灵活就业人员收入不稳定，“贷款缴社保”确实有助于其参保。但也有质疑，“没钱交社保，哪有钱还贷？”", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1793230579.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "[分享创造] 因为受够了手动更新 IIS 证书，我花了半年时间做了一个自动托管平台，想听听大家的意见", "url": "https://www.v2ex.com/t/1252707#reply2", "date": "2026-10-28T23:16:23Z", "desc": "", "tags": [], "topic_score": 0, "source": "V2EX 最新", "cat": "AI实战_创作者", "weight": 3, "ts": 1793229383.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "央行原副行长李波即将卸任IMF副总裁 接任者廖岷", "url": "https://finance.caixin.com/2026-10-29/102498320.html", "date": "Wed, 28 Oct 2026 23:15:19 GMT", "desc": "中国近年来向IMF贡献了四位副总裁高质量人选，均获得IMF颇高评价 资料图：李波（左）、廖岷。图：视觉中国 【财新网】 北京时间2026年10月28日晚10点，国际货币基金组织（IMF）总裁格奥尔基耶娃（Kristalina Georgieva）宣布，IMF副总裁 李波 将于2026年11月30日任期届满离任，并提议由中国财政部副部长 廖岷 接任，任命自2026年12月1日起生效。 这将是自2011年以来，中国为该国际组织贡献的第四位副总裁人选，前三位是 朱民 、 张涛 、李波，每任的常规任期为五年。 IMF官网介绍，李波负责IMF在约90个国家以及广泛政策问题方面的工作。格奥尔基耶娃在公告中对李波作出了颇具感情色彩的较高评价，称他自2021年8月加入IMF高管团队以来，“一直是我们许多人珍视的同事和挚友，他以沉稳的判断、严谨的学术态度和谦逊的善良，帮助基金组织度过了全球经济最动荡的几年，", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1793229319.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "Adam Mosseri says negativity around AI is ‘going to get worse’", "url": "https://www.theverge.com/ai-artificial-intelligence/1021644/adam-mosseri-instag 为43万至48万张，低于此前媒体报道的约60万张。此类选票主要来自以军士兵、服刑人员、驻外外交人员，以及其他无法前往指定投票站的选民。 央视指出，在以色列政坛，平均每4万张票决定议会1个席位，因此这批最后清点的“特殊选票”往往会成为决定各党派席位乃至影响组阁的关键变量。 不过，特殊选票的数量并不等于最终可能发生变化的席位数，实际影响仍取决于各党获得的有效选票及最终议席分配。 初估特殊选票上限较预估最高准备相差17万票，约12个议席仍", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793208332.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "沙特双通道出口瓦解红海短缺叙事，中东原油溢价一个月从34美元/桶跌至6美元", "url": "https://wallstreetcn.com/articles/3784699", "date": "Thu, 29 Oct 2026 01:18:28 +0800", "desc": "沙特阿拉伯正通过红海与霍尔木兹海峡双线并行的出口格局，打破外界对波斯湾原油供应中断的悲观预期，令中东实货市场的溢价在短短一个月内大幅收窄。 船舶追踪机构初步数据显示，沙特10月迄今的原油日出口量维持在接近战时高位的水平，整体表现与9月相当。与此同时，波斯湾地区其他主要产油国的出口也在向冲突前水平回归，供应紧张的预期正在松动。 供应回暖已直接传导至实货价格。衡量海湾地区现货市场强弱的阿曼-迪拜原油价差，本月早些时候跌至7月以来最低，本周二已降至约6美元/桶，而9月这一数字接近34美元/桶，单月降幅逾80%。 东西管道恢复，双通道打通供应瓶颈 沙特出口韧性的核心，在于东西输油管道的复通。该管道此前因袭击被迫停运，沙特出口一度完全依赖经霍尔木兹海峡的东海岸航线。 管道恢复运营后，沙特重新激活了红海沿岸的延布港出口通道，使其得以同时运用两条出口路线，在应对也门胡塞武装持续袭扰的同时，维持高位出货。", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793207908.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "The globetrotting Trump brothers", "url": "https://www.ft.com/content/a89fa128-8fcb-4ff4-bd8b-6bb591ccd9c1?syn-25a6b1a6=1", "date": "Wed, 28 Oct 2026 05:00:07 GMT", "desc": "The president’s sons Donald Jr and Eric have met world leaders and foreign officials while building a lucrative web of financial interests", "tags": [], "topic_score": 0, "source": "Financial Times", "cat": "金融媒体_英文", "weight": 2, "ts": 1793163607.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "How Vin Bui became engineer #1 at Nowadays — and started treating it like his own company", "url": "https://www.ycombinator.com/blog/how-vin-bui-became-engineer-1-at-nowadays-and-started-treating-it-like-his-own-company/", "date": "Tue, 20 Oct 2026 15:30:50 GMT", "desc": "Vin found Nowadays on Work at const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
