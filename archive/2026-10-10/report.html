续释放，9月房地产市场延续回暖态势，重点城市二手房成交放量，“金九”表现亮眼...", "url": "https://www.huxiu.com/moment/1286967.html", "date": "Sat, 10 Oct 2026 00:12:08 GMT", "desc": "“金九”期间重点城市楼市延续高活跃度。 随着政策红利不断落地、住房消费需求持续释放，9月房地产市场延续回暖态势，重点城市二手房成交放量，“金九”表现亮眼。中指研究院数据显示，9月，二手房活跃度继续高位运行，重点20城二手房成交11.9万套，同比增长7.4%。今年前9个月，重点20城二手住宅成交111.8万套，同比增长6.4%。其中，北京、上海等城市二手房市场成交持续放量。9月，北京、上海二手房分别成交1.6万套、2.4万套，环比分别增长13.7%、3.3%。值得注意的是，上海9月二手房成交量同比增长17.2%，连续七个月同比增长。", "tags": ["企业落地"], "topic_score": 3, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1791591128.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "9月公募、私募机构调研呈现较高集中度。9月，公募机构与私募机构对A股上市公司的调研保持较高活跃度，电子、机械设备、医药生物等行业关注度居前。公募方面，公...", "url": "https://www.huxiu.com/moment/1286959.html", "date": "Fri, 09 Oct 2026 23:37:38 GMT", "desc": "9月公募、私募机构调研呈现较高集中度。 9月，公募机构与私募机构对A股上市公司的调研保持较高活跃度，电子、机械设备、医药生物等行业关注度居前。公募方面，公募排排网数据显示，9月，共有158家公募机构参与A股上市公司调研，覆盖428只个股，合计调研3230次。从行业分布来看，电子、机械设备、医药生物成为公募机构调研重点，三大行业合计被调研1583次，占公募机构调研总次数的49.01%。其中，电子行业被调研个股达85只，合计获公募机构调研879次，关注度领先；机械设备行业被调研个股为52只，合计获公募机构调研403次；医药生物行业被调研个股为38只，合计获公募机构调研301次。", "tags": ["商业认知"], "topic_score": 3, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1791589058.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "消息来源：Nuvacore，这是一家成立仅六个月、由红杉资本支持的芯片初创公司，正在为其设计的新型数据中心中央处理器筹集资金，估值约为25亿美元。", "url": "https://www.huxiu.com/moment/1286956.html", "date": "Fri, 09 Oct 2026 23:31:41 GMT", "desc": "消息来源：Nuvacore，这是一家成立仅六个月、由红杉资本支持的芯片初创公司，正在为其设计的新型数据中心中央处理器筹集资金，估值约为25亿美元。", "tags": ["资本市场"], "topic_score": 3, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1791588701.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "Rewriting Prime Agent in Rust", "url": "https://www.primeintellect.ai/blog/prime-agent-rust", "date": "Fri, 09 Oct 2026 23:06:25 +0000", "desc": "Article URL: https://www.primeintellect.ai/blog/prime-agent-rust Comments URL: https://news.yc  "is_vendor": false, "always_fresh": false, "rank": 15}, {"title": "湖北宜城烟花爆竹事故致12死 调查指顾客违规试放“震天雷”引连环爆燃", "url": "https://china.caixin.com/2026-10-09/102491716.html", "date": "Fri, 09 Oct 2026 15:11:06 GMT", "desc": "死者中包括5名未成年人。调查报告强调，零售环节是烟花爆竹领域全链条安全监管的重要一环 千和百货店外受损情况图。财新了解到，发生事故的是位于宜城市郑集镇金铺村四组12号的千和百货店。图：湖北省应急管理厅 【财新网】 近八个月前发生的湖北襄阳宜城市千和百货店“2·18”重大烟花爆竹爆燃事故有了调查结论。10月9日，湖北省应急管理厅公布报告表示，该起事故是一起因顾客在烟花爆竹零售店前违规试放超标烟花爆竹（标识为“震天雷”的双响），零售店安全主体责任缺失，违规店外摆放、超核定储量存放、销售超标烟花爆竹、安全出口不畅，属地党委、政府及有关部门履职不到位，导致的重大生产安全责任事故。 2月18日，宜城市一烟花爆竹店发生爆燃，过火面积100余平方米，造成12人死亡。其中7名成年人、5名未成年人。遇难者除1人为经营者外，另外11人是前来购买烟花爆竹的顾客。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1791558666.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 15}, {"title": "薛继豪升任泰康人寿总裁 程康平加盟合众人寿", "url": "https://finance.caixin.com/2026-10-09/102491764.html", "date": "Fri, 09 Oct 2026 15:11:06 GMT", "desc": "2025年12月薛继豪担任泰康人寿临时负责人，代行总裁职责，此次为监管批复后的正式任职；原总裁程康平或以顾问身份参与合众人寿相关工作 资料图：薛继豪（左）、程康平。 【财新网】 日前， 泰康人寿 发布公告称，经该公司研究决定，并报国家金融监督管理总局核准任职资格，自2026年9月28日起， 薛继豪 担任泰康人寿总经理。 薛继豪此前为泰康人寿副总裁。2025年12月上旬，时任总裁 程康平 离任，随后泰康人寿发布公告宣布，薛继豪担任临时负责人，代行总经理职责（参见财新网《 泰康人寿换帅 总经理程康平申请退休 》）。 薛继豪出生于1968年12月，本硕均毕业于南开大学，获保险专业学士学位，货币银行学专业硕士学位。现任泰康人寿党委书记、董事，经营委员会成员、总裁兼首席运营官，分管公司业务板块、市场产品板块、合规后援板块、健康险及科技运营板块；同时兼任 泰康保险集团 管理委员会成员。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1791558666.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 15}, {"title": "派拉蒙完成收购华纳兄弟探索 好莱坞制片厂格局重塑", "url": "https://www.caixin.com/2026-10-09/102491694.html", "date": "Fri, 09 Oct 2026 15:11:06 GMT", "desc": "为购得WBD，派拉蒙掌门人大卫·埃里森度过了跌宕起伏的一年 当地时间2026年10月8日，美国加利福尼亚州洛杉矶，航拍视角下的派拉蒙影业水塔，塔身新增了“Skydance Corporation”字样。图：视觉中国 【财新网】 美国当地时间10月6日，派拉蒙天空之舞（以下简称“派拉蒙”）宣布完成对华纳兄弟探索公司（简称“WBD”）的收购。WBD与派拉蒙合并后的新公司更名为“天空之舞”（Skydance）。 自此，以迪士尼、索尼、派拉蒙、环球影业、华纳兄弟为代表的五大好莱坞制片品牌（Major film studios），减少至四家。 新公司天空之舞发布的一条品牌短片正在全球社交媒体上疯转：该短片使用诺兰经典电影《盗梦空间》的主旋律，串联起哈利·波特、指环王、蝙蝠侠等诸多知名I le 依靠卡车运输天然气让多个数据中心按计划推进，以及与 Kleiner Perkins 合伙人 Ilya Fushman 的对话，谈大型 AI IPO 管道和实体 AI 的未来。（来源：彭博）"}, {"title": "Can AI Agents Learn Their Way to the Top? Evaluating Heuristic Learning in a Long-Running Game Agent Competition", "url": "https://arxiv.org/abs/2610.12341", "date": "Fri, 09 Oct 2026 00:00:00 -0400", "desc": "arXiv:2610.12341v1 Announce Type: cross Abstract: Adversarial games have driven advances from heuristic search to reinforcement learning, yet learning and adapting strategies from limited samples remain challenging. AI agents offer an alternative by turning game experience into revisions of executable policies. Building on heuristic learning (HL), we formalize Adversarial Heuristic Learning (AHL),", "tags": ["AI", "商业认知", "个人成长"], "topic_score": 9, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1791518400.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27, "title_zh": "AI 代理能否在学习中登顶？在长期运行的博弈代理竞赛中评估启发式学习", "desc_zh": "arXiv:2610.12341v1 公告类型：交叉 摘要：对抗性博弈推动了从启发式搜索到强化学习的进步，但从有限样本中学习和调整策略仍具挑战。AI 代理提供了一种替代方案，将博弈经验转化为可执行策略的修订。基于启发式学习（HL），我们形式化了对抗性启发式学习（AHL），"}, {"title": "Federal Reserve Board announces enforcement action against American Express Company to address, among other things, the firm’s failure to sufficiently detect and report certain suspicious activity related to money laundering", "url": "<![CDATA[https://www.federalreserve.gov/newsevents/pressreleases/enforcement20261008a.htm]]>", "date": "Thu, 8 Oct 2026 20:30:00 GMT", "desc": "Federal Reserve Board announces enforcement action against American Express Company to address, among other things, the firm’s failure to sufficiently detect and report certain suspicious activity related to money laundering", "tags": ["资本市场"], "topic_score": 3, "source": "美联储 新闻稿", "cat": "宏观监管", "weight": 4, "ts": 1791491400.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 22, "title_zh": "美联储理事会宣布对 American Express Compan const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
