rked, and didn't really find any good tools to simulate all the filters, so I decided to develop a website that displays most of the transforms, filters and noise models seen in my university lecture. It is far fro", "tags": ["AI"], "topic_score": 3, "source": "HN Show HN", "cat": "AI实战_创作者", "weight": 5, "ts": 1791233350.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 29, "title_zh": "Show HN：成像科学网站", "desc_zh": "作为一名大学生，我对成像科学、图像处理和计算机视觉产生了浓厚兴趣。我发现很难想象变换和滤波器究竟如何工作，也没有找到什么好工具来模拟所有滤波器，所以我决定开发一个网站，展示我大学课程中见到的大多数变换、滤波器和噪声模型。它还远未"}, {"title": "刚刚，Tibo承诺「连续28天发布或重置」，OpenAI遭遇信任危机", "url": "https://www.36kr.com/p/4012179282874240", "date": "Mon, 05 Oct 2026 06:00:00 GMT", "desc": "Tibo 又又又又发文了…… 这次，他说 OpenAI 已经「锁定方向」：接下来只做四类事情 —— 简化产品、提高效率以支持更多使用、突破性功能，以及新模型 。 并在不久后再次预告， 将进行连续 28 天的发布或者重置 ，强调了「 对用户而言明显改进且切合实际的功能 」。 评论区一如既往有人欢呼，但是另一种声音比以前更明显。 许多人都在问：「这次值得相信吗？」 开发者日前，OpenAI 把期待值拉得很高，用户听了太多类似的话：20 项新功能、重大更新、即将改变工作方式…… 但发布会结束后，不少重度用户发现，真正影响日常体验的几个问题并没有消失： 额度变少、模型变慢，最受关注的新产品也没有立刻体现出宣传中的价值。 一位用户直接表示，DevDay 前 OpenAI 给人的感觉是「这次要改变一切」，结果真正发布之后，「 根本没什么用 」。他原本最期待的 GPT-6.1 Sol，实际使用后也让他失", "tags": ["AI"], "topic_score": 4, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1791180000.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 29}, {"title": "RT Akshay 🚀: HuggingFace just closed a major gap in harness engineering! (the ultimate guide to multi-harness RL) the same open-weight model can pe...", "url": "https://x.com/huggingface/status/2107130132922335432", "date": "Sun, 04 Oct 2026 12:30:06 GMT", "desc": "RT Akshay 🚀 HuggingFace just closed a major gap in harness engineering! (the ultimate guide to multi-harness RL) the same open-weight model can perform well inside one harness, then lose accuracy or produce invalid tool calls when moved to another. this happens because training inside one interface can teach the model its specific tool names, output formats, context structure, and control flow. th raction. While existing simulation techniques demonstrate surface fidelity to human style and behavior, ecologically valid interactive benchmarking also requires alignment in when and how agents fail across simulated and real user populations. We find that existing simu", "tags": ["资本市场"], "topic_score": 3, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1791172800.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "Beyond Correctness: Resolving Underspecification in Agentic Text-to-SQL", "url": "https://arxiv.org/abs/2610.02739", "date": "Mon, 05 Oct 2026 00:00:00 -0400", "desc": "arXiv:2610.02739v1 Announce Type: new Abstract: Agentic Text-to-SQL systems can interact with users to clarify underspecified queries before generating SQL. However, a correct execution result does not necessarily imply that the agent has adequately resolved the underlying underspecification: the agent may silently make unverified assumptions that happen to match the intended answer. We show that ", "tags": ["AI"], "topic_score": 3, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1791172800.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "Adaptive Mutual Distillation for Balanced Multi-Task Post-Training of Large Language Models", "url": "https://arxiv.org/abs/2610.02856", "date": "Mon, 05 Oct 2026 00:00:00 -0400", "desc": "arXiv:2610.02856v1 Announce Type: new Abstract: Multi-task post-training of large language models (LLMs) aims to improve performance across tasks with unequal amounts of training data. Existing methods focus primarily on balancing task contributions during single-model training. Different task-balancing strategies can produce models with complementary strengths, creating opportunities for mutual d", "tags": ["AI"], "topic_score": 3, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1791172800.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "A Guideline-Augmented Multi-Agent Framework for Schema-as-Code Biomedical Named Entity Recognition", "url": "https://arxiv.org/abs/2610.02970", "date": "Mon, 05 Oct 2026 00:00:00 -0400", "desc": "arXiv:2610.02970v1 Announce Type: new Abstract: Large language models (LLMs) have shown promising potential for biomedical named entity recognition (BioNER) through instruction following and in-context learning. However, existing LLM-based BioNER methods still face two key limitations. First, retrieved demonstrations and external biomedical knowledge provide limited support for dataset-specific an", "tags": ["AI"], "topic_score": 3, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1791172800.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "大学生旅游攻略，坑麻国庆出行的中年人", "url": "https://www.36kr.com/p/4012254113665157", "date": "Mon, 05 Oct 2026 04:00:00 GMT", "desc": "十一假期过半，第一批被骗的中登已经开始在网上发文控诉了：按照大学生的旅游攻略出行，结果钱没省多少，罪倒没少受。明明想的是五天刷完五岳，一天逛完北京，结果照着攻略走一天，就得躺在酒店歇三天。 大学生对此不屑一顾，毕竟“青春没有售价，硬座直达拉萨”才是人生标配。在他们看来，花大价钱躺酒店，吃漂亮但价格贵、分量少的餐厅，远不如省点钱、赶点时间，随时勇闯天涯。 苦哈哈的中登们在“受骗”后诚恳建议：千万别信大学生的旅游攻略，因为他们没有吃过好的，也没有住过好的，中登就该看中登的攻略，主打走到哪里躺到哪里，躺不动了再起来溜达。 同一套流程，怎么大学生美滋滋，中登们却直呼吃不消？ 跟着攻略走，中登先昏厥 一个让人略感吃惊的现象是，在“牛马向往草原”的今天，中登们逐渐成为了旅游市场的主力军。 中青旅遨游旅行发布的《2026国庆假期旅游观察报告》显示，在刚刚过去的中秋节里，我国中秋出游的游客平均年龄为45.", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1791172800.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "溢价400%，一秒抢光？中国玩家全球“扫货”，带火一门套利生意", "url": "https://www.36kr.com/p/4011573432291463", "date": "Mon, 05 Oct 2026 01:40:06 GMT", "desc": "上午九点半，潮玩爱好者苏苏来到泡泡玛特在法国巴黎新开的奥斯曼旗舰店，准备抢购巴黎限定版小野（Hirono）手办。她原以为现场不会太拥挤，“毕竟开业时也没多少人”，但当天她排了40分钟队才得以进店。 “门口排队的人都是冲着巴黎限定款小野吊卡来的，每人每天限购一个，一个小时左右就卖完了，我差点没抢到。”苏苏说。 与此同时，资深Hello Kitty玩家洋洋正在日本东京挑选日本限定的Hello Kitty。从巴黎到东京，从泡泡玛特到三丽鸥（Sanrio），这个国庆假期，中国玩家正跨越国界，在全球范围内掀起一场狂热的“ on": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 15}, {"title": "心智｜审视中年焦虑", "url": "https://weekly.caixin.com/2025-01-11/102278022.html", "date": "Mon, 05 Oct 2026 14:13:25 GMT", "desc": "文｜陈果 人们在中年阶段（40岁—60岁）常常经历一种心理和情绪上的困扰与不安，这种现象被称为中年危机，其通常与对自我身份、成就、时间流逝以及未来不确定性的焦虑相关。每个人面临的危机各不相同，但一些通用建议仍然有所帮助。 1.重新审视自我 中年是重新审视自我的好时机。中年的你也许已经完成了对人生意义的探索，不再为情感纠结，日子趋于安稳。然而，在事业与家庭之间奔波，你是否不再关注自己的兴趣？是否被“应该”“别人都”“不得不”这些观念束缚，或者被不知源头的情绪牵着鼻子走？随着时间流逝加快，你是否想过如何续写自己的人生故事，让此生不留遗憾？", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1791209605.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 15}, {"title": "境外收入追税｜聚焦跨境投资之四", "url": "https://weekly.caixin.com/2025-05-24/102322834.html", "date": "Mon, 05 Oct 2026 14:09:19 GMT", "desc": "随着越来越多中国居民前往海外工作、从事境外投资，中国税务部门的稽查力度也逐步加大 资料图：武汉市江汉区税务局办税大厅。图：视觉中国 文｜财新周刊 文思敏 王小青 发自香港 2025年5月9日，武汉市民刘陌突然收到一条手机短信：“提醒您自查自2021年至今的个人所得税汇算清缴记录，是否包括您全球所得”，并建议他主动申报境外收入。当月13日，刘陌在个人所得税App上再次收到自查提醒。两天之后，武汉税务部门打来了电话，约他去个人所得税办公室面谈。 “从2024年年中到现在，找我们咨询境外收入报税的客户不断增加，之前一般是每年个位数的境外所得申报问题，这两个月已超过两位数了。”金杜律师事务所税务业务合伙人叶永青2025年5月中旬向财新表示，不少客户近期接到税务部门的境外收入自查通知，被追缴的项目主要集中在境外的投资收益，比如投资盈利、利息、股息。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1791209359.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 15}, {"title": "谁在花钱学AI？｜就业众生相之五", "url": "https://weekly.caixin.com/2026-08-29/102479588.html", "date": "Mon, 05 Oct 2026 14:09:19 GMT", "desc": "为了不被AI替代，人们纷纷重返课堂 2026年5月15日，江苏如皋，学员在AI青年夜校学习。 文｜财新周刊 关聪 冯奕铭 40多名二三十岁的学员坐在写字楼里的教室，大约90%的授课内容是人工智能（AI）发展史等能在网上搜到的背景知识，剩下10%是AI相关岗位的模拟面试与复盘。也许刚好是这10%发挥了作用，让刚刚大四毕业的刘浩伦顺利入职了一家互联网头部公司担任AI训练师——这是他此前从未听说过的岗位。 刘浩伦的大学专业是视觉传达，他想过从事游戏原画师、角色建模师，但到了大四，AI已能生成3D模型，图像模型正在颠覆设计行业，“这条路的梯子被AI抽走了”。在 抖音 一名设计行业博主的直播间里，刘浩伦偶然发现了这门收费2万元的AI培训课程，跑到线下授课点调研属实后报了名。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1791209359.0, "opinion": false, "is_hot": false, "is   if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
