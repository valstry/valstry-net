body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}

.seg{display:flex;border:1px solid var(--bd);border-radius:7px;overflow:hidden}
.seg span{padding:5px 13px;cursor:pointer;font-size:12px;color:var(--dim);background:var(--card)}
.seg span.on{background:var(--ac);color:#fff}
button.exp{background:var(--star);border:none;color:#000;padding:6px 13px;border-radius:6px;cursor:pointer;font-weight:600;font-size:12px}
main{padding:16px 20px;max-width:1080px;margin:0 auto}
.it{background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:13px 15px;margin-bottom:9px;display:flex;gap:12px}
.it:hover{border-color:#3d444d}

.sb{background:none;border:none;color:var(--dim);font-size:17px;cursor:pointer;padding:0;line-height:1;height:20px}
.sb.on{color:var(--star)}
.body{flex:1;min-width:0}
.t{font-size:14.5px;font-weight:600;margin-bottom:5px}
.t a{color:var(--tx);text-decoration:none}
.t a:hover{color:var(--ac)}
.meta{color:var(--dim);font-size:11.5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.src{color:var(--ac)}
.tg{background:#21262d;padding:1px 7px;border-radius:9px}
.rk{color:#6e7681}
.age{color:#7ee787}
.orig{color:#6e7681;font-size:11.5px;margin:-2px 0 5px}
.dsc{color:var(--dim);font-size:12.5px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--dim);text-align:center;padding:50px}
#sel{position:fixed;right:18px;bottom:18px;background:var(--star);color:#000;padding:9px 15px;border-radius:20px;font-weight:700;cursor:pointer;box-shadow:0 3px 14px rgba(0,0,0,.5);display:none;font-size:13px}

: false, "always_fresh": false, "rank": 21}, {"title": "刚刚，AI击穿了“视频图灵测试”，1700万网友在线围观", "url": "https://www.36kr.com/p/4009475424063619", "date": "Sat, 03 Oct 2026 01:31:32 GMT", "desc": "过去，视频通话常被当成确认身份的一道保险。文字可以代写，声音可以合成，但让对方打开摄像头，聊几句、看表情，似乎总能多一分把握。 如今，连这份眼见为实的笃定也开始受到挑战。 最近， AI 研究团队 Tavus 发布实时视频交互模型 Griffin， 并公布了一项实验结果。在与其研究预览版 Griffin-Lite 进行一分钟视频通话后，54 名参与者中有 26 人认为，屏幕另一端坐着一个真人，占比约为 48%。 ▲ 截至发稿前，近 1736 万网友围观 作为对照，Tavus 上一代系统在相同实验流程下，只有 41 人中的 1 人被当成真人，比例为 2.4%。 Tavus 据此宣称，Griffin 是首个通过实时「视频图灵测试」的模型， 并将其归入一个新类别 Human Interaction Model，简称 HIM，即人类交互模型。 不过，「首次通过」目前仍是 Tavus 对实验结果的定义", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1790991092.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "刚刚，Meta开源Muse Gadgets，让全球开发者自己「造AI外设」", "url": "https://www.36kr.com/p/4009352273236101", "date": "Sat, 03 Oct 2026 01:23:39 GMT", "desc": "Meta 的 Muse 还在持续升温。 这款刚推出不久的个人 AI Agent，已经成为 Meta 今年 AI 战略中的重要产品。不同于传统聊天机器人，Muse 被设计为能够替用户执行任务的智能助手：处理邮件、购物、规划行程，甚至在后台持续完成一些复杂操作。 而就在刚刚，Meta 又公布了一项新的动作： 正式推出 Muse Gadgets 开源项目，全面下放硬件能力，让全球创客与开发者能够为 Muse 打造专属的外围硬件设备。 按照 Meta 公布的信息， 开发者可以使用 ESP32 开发板运行 Muse 固件，或使用 Linux SDK 连接更复杂的设备， 也就是说开发者不仅能够在低成本微控制器上部署 Muse 交互逻辑，还能直接在树莓派 5（Raspberry Pi 5） 等更强大的边缘计算设备上运行 Muse 客户端。 官方还列举了多种极具实用性的 DIY 形态参考： 彩色墨水屏（E", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1790990619.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "苏姿丰抬头，李飞飞低头", "url": "https://www.36kr.com/p/4009381083600769", "date": "Sat, 03 Oct 2026 01:23:02 GMT", "desc": "作者｜画画 如果把时间拨回 2014 年，苏姿丰刚接手 AMD。 那时的 AMD 还看不出今天 AI 明星公司的样子。公司承压，业务陷入困境，甚至有人怀疑，这家老牌芯片公司等不到下一轮机会。 也是在那个阶段，李飞飞在做一件看起来更笨的事情： 给机器准备足够多的图片。 9 月 28 日，AMD 宣布以约 82 亿美元全股票收购李飞飞创办的 World Labs。交易完成后，李飞飞将加入 AMD，担任执行副总裁兼首席科学家，直接向苏姿丰汇报。 表面看，这是一家芯片公司收购一家 AI 创业公司。往深处看，是两条走了十多年的路终于交汇。 一、苏姿丰把 AMD 从悬崖边拉了回来 2014 年，苏姿丰接任 AMD CEO。 那时的 AMD 已经连续多年一蹶不振。 2014 年 AMD 营收约 55 亿 确，以婚姻为目的给付的购房款、购车款等具有彩礼性质，可按照彩礼裁判规则予以处理；同时，应结合双方对婚姻的态度、是否形成稳定的共同生活等事实来认定给付彩礼的目的是否实现 最高法院表示，当事人以索要彩礼为名骗取他人财物，构成犯罪的，不仅要退赔被害人所遭受的损失，还要依法承担刑事责任。图：视觉中国 【财新网】 男女双方为了结婚，除给付礼金形式的彩礼外，还给付购车款、购房款等大额款项。若后续出现纠纷，这些款项是不是认定为彩礼，应不应当返还？最高法院近日发布涉彩礼纠纷典型案例，明确以婚姻为目的给付的购房款、购车款等具有彩礼性质，可按照彩礼裁判规则予以处理。 在其中一起案例中，2020年10月，赵某（男）与李某相识恋爱。按照当地习俗“上门提亲”时，赵某给付礼金6.6万元。2021年2月，双方举办婚礼后共同生活。李某答应赵某，在赵某为其买车后办理结婚登记，赵某于是给予李某购车款15万元。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1791073775.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "欧洲市场复苏贡献增量 特斯拉第三季度交付超预期", "url": "https://www.caixin.com/2026-10-03/102490583.html", "date": "Sun, 04 Oct 2026 00:29:35 GMT", "desc": "2026年前三季度，特斯拉销售汽车132.5万辆，全年销量有望恢复增长 当地时间2026年9月3日，美国得克萨斯州奥斯汀，一辆特斯拉“Cybercab”在市中心行驶。特斯拉第三季度交付量同比下跌2%，但跌幅好于市场预期。图：视觉中国 【财新网】 2026年第三季度，特斯拉共生产汽车46.4万辆，交付48.7万辆。美国当地时间10月2日，特斯拉（NASDAQ：TSLA）发布上述数据。 特斯拉第三季度交付量同比下跌2%，但跌幅好于市场预期。高盛、摩根士丹利、巴克莱银行、瑞银等23家机构之前预计，特斯拉第三季度交付量为46.2万辆。受此影响，特斯拉10月2日收报370.59美元/股，涨4.65%。 2025年第三季度，特斯拉的交付量基数较高，当时美国电动汽车税收抵免优惠即将取消，美国市场出现一波提前购车高峰。2026年第三季度，特斯拉能够基本保持在近49万辆交付规模，主要得益于欧洲市场回暖。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1791073775.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "武汉全装修住宅可分阶段竣备 毛坯备案能否按揭放款仍待明确", "url": "https://www.caixin.com/2026-10-03/102490488.html", "date": "Sun, 04 Oct 2026 00:29:35 GMT", "desc": "相较北上广，武汉的库存压力更大，当地细则更强调稳定企业经营和缓冲制度切换 商品住宅毛坯房，卧室飘窗外的城市高楼建筑群景观。图：视觉中国 【财新网】 武汉允许全装修商品住房在毛坯、室内装修两个建设阶段分别办理竣工备案。10月1日，该市住房和城市更新局、自然资源和城乡建设局、地方金融管理局联合发布《关于贯彻落实〈关于完善商品住房销售制度的通知〉的实施意见》（下称《实施意见》），提出上述规定。 《实施意见》自发布之日起执行。分阶段竣备可视为工程建设和行政审批流程的优化，但这一地方细则没有明确毛坯阶段备案能否满足个人住房按揭贷款的放款条件。 《实施意见》还提出，允许同一楼栋以正负零为界，对地下、地上部分分阶段实施竣工备案；规模较大的项目可预先划定最小单元，依次组织竣工验收备案，水、电、气、热及市政配套齐全后，房屋方可交付。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1791073775.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": f neLearning 找个替代品 [0] https://news.ycombinator.com/item?id=49912499 评论链接：https://news.ycombinator.com/item?id=49948326 点数：1 # 评论：0"}, {"title": "国庆出游用AI，第一批人已经被坑惨了", "url": "https://www.36kr.com/p/4009478235295881", "date": "Sat, 03 Oct 2026 03:24:48 GMT", "desc": "国庆长假进入第三天，景区门口排起长队，高铁站、网红街区又一次被挤满，不少人趁着这几天出门旅游。 出门前，总绕不开做攻略。先要打开社交平台，收藏几篇“本地人吐血整理”“三天两 夜不绕路”“看这一篇就够了”的帖子，再把景点、餐厅和酒店一个个放到地图上，比较距离、价格和评 价。还要确认哪家店营业、景区几点开门、节假日要不要预约。往往是攻略还没做完，出行的兴奋劲已经消耗了大半。 这两年，越来越多人把这件事交给了AI。一开始，大家用的多是 豆包 、 DeepSeek 这类通用大模型：输入出发时间、酒店位置和想去的地方，它很快就能排好路线，把每天几点出门、在哪吃饭都写清楚。后来，携程、同程、飞猪等旅游平台也推出了自己的AI旅行助手，查景点、比酒店、订票，都能在一个对话框里完成。 工具越来越多，AI做的攻略也越来越像样，人自然越来越放心。但一到人挤人的长假，问题就暴露出来了：AI能快速整理公开信息，却不", "tags": ["AI"], "topic_score": 3, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1790997888.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27}, {"title": "OpenAI’s Dot agent is enterprise software that can also order your dinner", "url": "https://www.theverge.com/ai-artificial-intelligence/1004096/openai-chatgpt-dots-hands-on-agent", "date": "2026-10-02T13:56:00-04:00", "desc": "It's a tale as old as last week: OpenAI's new agent platform, called Dots, is full of cute little guys who can do your bidding. But unlike the ultra-approachable Meta Muse, Dots feel very much like using workplace software that happens to be able to order you a burrito - emphasis on work. OpenAI announced […]", "tags": ["AI"], "topic_score": 7, "source": "The Verge", "cat": "科技新闻", "weight": 3, "ts": 1790963760.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 25, "title_zh": "OpenAI 的 Dot agent 是能帮你订晚餐的企业软件", "desc_zh": "这是个上周才有的老故事：OpenAI 的新 agent 平台 Dots 里全是些能听你差遣的可爱小家伙。但与极其亲民的 Meta Muse 不同，Dots 用起来很像工作软件，只是恰好能帮你订个墨西哥卷饼——重点在“工作”。OpenAI 宣布……"}, {"title": "AI Agents Are Going Rogue. Novel Legal Battles Are Next", "url": "https://www.theinformation.com/articles/ai-agents-going-rogue-novel-legal-battles-next", "date": "2026-10-03T14:51:41Z", "desc": const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
