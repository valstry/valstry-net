om/zh-cn/guides/chat_prefix_completion", "date": "Invalid Date", "desc": "对话前缀续写沿用 Chat Completion API ，用户提供 assistant 开头的消息，来让模型补全其余的消息。 注意事项 使用对话前缀续写时，用户需确保 messages 列表里最后一条消息的 role 为 assistant ，并设置最后一条消息的 prefix 参数为 True 。 用户需要设置 base_url=\"https://api.deepseek.com/beta\" 来开启 Beta 功能。 样例代码 下面给出了对话前缀续写的完整 Python 代码样例。在这个例子中，我们设置 assistant 开头的消息为 \"```python\\n\" 来强制模型输出 python 代码，并设置 stop 参数为 ['```'] 来避免模型的额外解释。 from openai import OpenAI client = OpenAI ( api_key = \"<your ", "tags": [], "topic_score": 0, "source": "DeepSeek 官方", "cat": "AI厂商官方", "weight": 7, "ts": 0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 31}, {"title": "JSON Output", "url": "https://api-docs.deepseek.com/zh-cn/guides/json_mode", "date": "Invalid Date", "desc": "在很多场景下，用户需要让模型严格按照 JSON 格式来输出，以实现输出的结构化，便于后续逻辑进行解析。 DeepSeek 提供了 JSON Output 功能，来确保模型输出合法的 JSON 字符串。 注意事项 设置 response_format 参数为 {'type': 'json_object'} 。 用户传入的 system 或 user prompt 中必须含有 json 字样，并给出希望模型输出的 JSON 格式的样例，以指导模型来输出合法 JSON。 需要合理设置 max_tokens 参数，防止 JSON 字符串被中途截断。 在使用 JSON Output 功能时，API 有概率会返回空的 content。我们正在积极优化该问题，您可以尝试修改 prompt 以缓解此类问题。 样例代码 这里展示了使用 JSON Output 功能的完整 Python 代码： import ", "tags": [], "topic_score": 0, "source": "DeepSeek 官方", "cat": "AI厂商官方", "weight": 7, "ts": 0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 31}, {"title": "Files API", "url": "https://api-docs.deepseek.com/zh-cn/guides/files_api", "date": "Invalid Date", "desc": "Files API 让你上传图片，之后通过 file_id 引用。推荐在以下场景使用： 在多个请求中复用同一张图片，无需重复上传。 发送会超过 48 MiB 请求体限制或 32 MiB 单图内联限制的图片（见 图像理解：限制 ）。 上传的文件与 deepseek-flash 模型配合使用。如何在对话请求中引用已上传的文件，请参考 图像理解 。 支持的格式： JPEG、PNG、GIF、WebP 。格式由文件实际内容判断。 以下示例的 base_url 为 https://api.deepseek.com 。 上传文件 通过 multipart/form-data 请求向 POST /files 上传文件。单个文件最大 64 MiB ，上传需在 10 分钟 内完成。 表单字段： 字段 是否必填 说明 file 是 要上传的图片文件。 purpose 是 必须为 user_data 。 expi", "tags": [], "topic_score": 0, "source": "DeepSeek 官方", "cat": "AI厂商官方", "weight": 7, "ts": 0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 31}, {"title": "上下文硬盘缓存", "url": "https://api-docs.deepseek.com/zh-cn/guides/kv_cache", "date": "Invalid Date", "desc": "DeepSeek API 上下文硬盘缓存技术对所有用户默认开启，用户无需修改代码即可享用。 用户的每一个请求都会触发硬盘缓存的构建。若后续请求与之前的请求在前缀上存在重复，则重复部分只需要从缓存中拉取，计入“缓存命中”。 缓存落盘与命中规则 缓存命中的前提是相应前缀已被“落盘”（写入硬盘缓存）。受 Sliding Window Attention 机制的影响，缓存前缀的存取与判别与之前有所不同。每条缓存前缀是一个独立的完整单元。后续请求只有在完整匹配 缓存前缀单元 时，才能命中缓存。 缓存前缀落盘时机： 请求结束位置落盘 ：每次请求的 用户输入结束位置 与 模型输出结束位置 ，会产生两个 缓存前缀单元 。后续请求若 完整 匹配了它们，则可命中。 公共前缀检测落盘 ：当系统检测到多次请求之间存在公共前缀时，会将该公共前缀作为一个独立的 缓存前缀单元 进行落盘。后续请求若 完整 复用了该 缓存", "tags": [], "topic_score": 0, "source": "DeepSeek 官方", "cat": "AI厂商官方", "weight": 7, "ts": 0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 31}, {"title": "8-K/A - IB Acquisition Corp. (0001998781) (Filer)", "url": "https://www.sec.gov/Archives/edgar/data/1998781/000149315226043952/0001493152-26-043952-index.htm", "date": "2026-09-23T17:15:13-04:00", "desc": "Filed: 2026-09-23 AccNo: 0001493152-26-043952 Size: 767 KB Item 1.01: Entry into a Material Definitive Agreement Item 3.02: Unregistered Sales of Equity Securities Item 9.01: Financial Statements and Exhibits", "tags": ["商业认知"], "topic_score": 2, "source": "SEC 最新 8-K 申报", "cat": "企业行为_美股披露", "weight": 6, "ts": 1790198113.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 30}, {"title": "8-K - KKR Private Equity Conglomerate LLC (0001957845) (Filer)", "url": "https://www.sec.gov/Archives/edgar/data/1957845/000195784526000087/0001957845-26-000087-index.htm", "date": "2026-09-23T16:44:01-04:00", "desc": "Filed: 2026-09-23 AccNo: 0001957845-26-000087 Size: 140 KB Item 3.02: Unregistered Sales of Equity Securities", "tags": ["资本市场"], "topic_score": 2, "source": "SEC 最新 8-K 申报", "cat": "企业行为_美股披露", "weight": 6, "ts": 1790196241.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 30}, {"title": "8-K - Constellation A lse, "always_fresh": false, "rank": 26}, {"title": "10月再加息一次！高盛：这可能是本轮周期“终曲”。高盛预计美联储在10月27日的议息会议上会完成今年的最后一次加息；②该行指出，油价持续回落以抑制通胀，是实...", "url": "https://www.huxiu.com/moment/1283152.html", "date": "Wed, 23 Sep 2026 23:59:55 GMT", "desc": "10月再加息一次！高盛：这可能是本轮周期“终曲”。 高盛预计美联储在10月27日的议息会议上会完成今年的最后一次加息；②该行指出，油价持续回落以抑制通胀，是实现本轮“两次加息就完事儿”的关键条件。", "tags": ["资本市场"], "topic_score": 3, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1790207995.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "Anthropic成立生命科学研究团队，Claude发现具有CRISPR样特征的新型酶系统。当地时间9月23日，Anthropic宣布成立生命科学研究团队及实验室，并公布Claude参与生...", "url": "https://www.huxiu.com/moment/1283142.html", "date": "Wed, 23 Sep 2026 23:32:40 GMT", "desc": "Anthropic成立生命科学研究团队，Claude发现具有CRISPR样特征的新型酶系统。 当地时间9月23日，Anthropic宣布成立生命科学研究团队及实验室，并公布Claude参与生物学研究取得的早期成果。研究人员称，Claude在分析超过20万个逆转录酶（RT）序列后，发现一种此前未被描述的酶系统，并将其命名为“阵列相关逆转录酶”（ART）。Anthropic称，Claude约950个智能体在21小时内使用约2.1亿个Token，筛选出3500个候选系统并进一步缩小至20个。 ART主要存在于感染细菌的噬菌体中，由逆转录酶、邻近的辅助基因以及一组排列规律的DNA重复序列组成，后者与CRISPR重复序列具有相似特征。初步实验显示，这些重复序列也会被转录为多个短RNA，但其具体功能仍有待进一步研究。该研究由Anthropic科学家进行实验验证，公司已发布预印本。", "tags": ["AI"], "topic_score": 3, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1790206360.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "“高中签率”新股，今日申购。今日有1只新股申购，为创业板的粤芯半导体；②有1只新股上市，为北交所的百瑞吉。", "url": "https://www.huxiu.com/moment/1283137.html", "date": "Wed, 23 Sep 2026 23:13:53 GMT", "desc": "“高中签率”新股，今日申购。 今日有1只新股申购，为创业板的粤芯半导体；②有1只新股上市，为北交所的百瑞吉。", "tags": ["商业认知"], "topic_score": 3, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1790205233.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "OpenAI与Anthropic联袂呼吁AI放缓与国际协调，与特朗普立场分歧", "url": "https://wallstreetcn.com/articles/3782411", "date": "Thu, 24 Sep 2026 07:08:07 +0800", "desc": "OpenAI和Anthropic两家顶级AI公司的CEO本周在联合国安理会发出共同呼声，要求各国就人工智能风险展开国际合作。而就在前一天，特朗普在联合国大会上将此斥为\"全球主义阴谋\"。这一罕见的公开对峙，将AI监管路线之争推上了全球外交舞台。 周三，OpenAI首席执行官Sam Altman与Anthropic首席执行官Dario Amodei在联合国安理会发表讲话，双双呼吁放缓AI开发节奏，并寻求跨国协调机制以应对潜在的灾难性风险。 在竞争激烈的AI行业，两位对手CEO公开站在同一立场，本身已属罕见。同时此番表态与特朗普政府的政策取向形成直接冲突。 特朗普周二在联合国大会演讲中明确表示，美国将推动AI技术进步，\"而非加以限制\"，并称外界协调AI发展的努力是企图控制这一技术的\"全球主义阴谋\"。两种截然相反的立场在同一周内于联合国相继登场，令AI监管的国际博弈更加复杂。 华尔街见闻此前发布文", "tags": ["AI"], "topic_score": 8, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790204887.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "Anthropic says its biology lab has already found something big", "url": "https://techcrunch.com/2026/09/23/anthropic-says-its-biology-lab-has-already-found-something-big/", "date": "Wed, 23 Sep 2026 22:17:39 +0000", "desc": "But maybe the biggest reveal is that Anthropic has not let Claude run loose in its biology lab. Humans are still, so far, in the loop.", "tags": ["AI"], "topic_score": 3, "source": "TechCrunch", "cat": "科技新闻", "weight": 4, "ts": 1790201859.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26, "title_zh": "Anthropic 称其生物实验室已发现重大成果", "desc_zh": "但也许最大的揭示是，Anthropic 并没有让 Claude 在其生物实验室里自由行动。到目前为止，人类仍在回路中。"}, {"title": "意外强劲PMI重燃加息预期，美债遭“血洗”！纳指终结四连涨，美元涨黄金跌", "url": "https://wallstreetcn.com/articles/3782354", "date": "Thu, 24 Sep 2026 06:01:06 +0800", "desc": "油价上涨与强劲经济数据的双重夹击，令市场对美联储将维持更长时间紧缩立场的押注急剧升温，美国国债收益率飙升至近二十年高位，美股随之承压下行。 美国采购经理人指数（PMI）数据周三远超预期，创2021年以来最快扩张速度，引发市场对经济从\"韧性\"转向\"过热\"的担忧，并触发国债市场的大规模抛售。 10年期美债收益率单日上行14个基点，突破5.00%关口；5年期收益率盘中升至2007年以来最高水平，30年期收益率则攀升至2004年来峰值。利率互换市场已充分计入未来一年三次加息预期，部分对冲仓位甚至反映了第四次加息的可能性。 此番冲击波及范围广泛。美元指数跳涨0.6%至7月以来最高水平，黄金跌破4300美元，比特币下探84000美元，三大美股指数跌幅介于0.7%至0.9%之间，对利率最为敏感的小盘股领跌，而 纽交所新低个股数量已连续七日超过新高个股。 美国债市遭\"血洗\"，PMI意外强劲点燃实际利率重定", "tags": ["资本市场"], "topic_score": 6, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790200866.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "8-K - Tri-State Generation & Transmissio s": [], "topic_score": 0, "source": "Crunchbase 融资板块", "cat": "创投行业分析", "weight": 5, "ts": 1790161238.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21, "title_zh": "巨型 A 轮融资正在增加", "desc_zh": "根据 Crunchbase 数据，今年迄今全球初创公司已至少完成 114 笔 1 亿美元及以上的 A 轮融资。这是多年来最高的年度总额，并有望超过历史峰值。我们来看看钱流向了哪里。"}, {"title": "10-K - Crona Corp. (0001696411) (Filer)", "url": "https://www.sec.gov/Archives/edgar/data/1696411/000147793226005753/0001477932-26-005753-index.htm", "date": "2026-09-23T06:03:47-04:00", "desc": "Filed: 2026-09-23 AccNo: 0001477932-26-005753 Size: 2 MB", "tags": [], "topic_score": 0, "source": "SEC 最新 10-K 年报", "cat": "企业行为_美股披露", "weight": 5, "ts": 1790157827.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "从 iPhone 18 开始，苹果给你的照片打上「看不见」的水印", "url": "https://www.36kr.com/p/3995514940903297", "date": "Wed, 23 Sep 2026 05:56:58 GMT", "desc": "大约两百年前，法国人尼埃普斯将一块涂有感光材料的白镴板放进暗箱，对准窗外。 光线穿过镜头，落在这块金属板上。经过漫长的曝光，窗外的风景留下了一些模糊的明暗。这张《窗外的勒格拉景色》，通常被视为现存最早的相机照片。 此后近两百年，摄影技术经历了无数次变化。其中的核心并没有变——真实存在的东西反射或者发出光线，光穿过镜头，在感光介质上留下痕迹。 「照片」的词源，正是「光的书写/光的图」(photo-graph)。这个词本身就隐含着一层意思：画面里的那一刻，曾经真实发生过。 但也是在摄影术诞生后的两个世纪里，照片对于「真实」的映射其实早已被消解。 如果你看过电影《寂静的朋友》，里面那种人工修饰底片的技术，在 19 世纪末期就已流行开来。数码时代来了，Photoshop 的事情则更无需篇幅赘述；而到了生成式 AI 浪潮骤起的今天，一张「看起来真实」照片与现实之间那种理所当然的联系，早已荡然无存。 ", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1790143018.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "昔日女鞋第一，卷土重来", "url": "https://www.36kr.com/p/3988505287211779", "date": "Wed, 23 Sep 2026 04:17:14 GMT", "desc": "文｜贺哲馨 编辑｜乔芊 传奇 上个世纪 90 年代，每个美国女人的鞋柜里都有一双 Nine West。 这不是夸张的说法，《纽约时报》1997 年就是这么写的。在女鞋这个品类里，Nine West 是全球产业链分工最早、也最彻底的受益者。在 Zara、H&M、优衣库席卷世界之前，它已经提前二十年践行了这套打法。 1969 年，意大利裔美国人 Vince Camuto 接到了来自日本住友银行的邀约。银行希望分散投资，请他去巴西做自有品牌鞋的设计与进口——那里原料充足、人工便宜、大量工厂空着。多次往返巴西的过程中，Camuto 结识了同为住友银行承包方的 Jerome Fisher。 1977 年 5 月，Fisher Camuto Corporation 在纽约成立。两人自立门户时，对外的说法是一句话：日本的钱、意大利的设计、巴西的制造。 公司成立第一年营收就达到 900 万美元。1978 ", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1790137034.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "A retrospective analysis on the use of LLMs to study infant syntax learning", "url": "https://arxiv.org/abs/2609.26539", "date": "Wed, 23 Sep 2026 00:00:00 -0400", "desc": "arXiv:2609.26539v1 Announce Type: new Abstract: Large language models (LLMs) have increasingly been used to investigate how children acquire syntax at an early stage of development. This is notably the central scientific goal of the BabyLM challenge, a community-wide effort to develop models that achieve human-level syntactic performance while being trained on developmentally realistic corpora. In", "tags": ["AI", "个人成长"], "topic_score": 5, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1790136000.0, "opinion": true, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "最卷一夜，Claude 5.5 发布，性能直逼 Fable，还要卷价格", "url": "https://www.36kr.com/p/3995149994446981", "date": "Wed, 23 Sep 2026 02:23:23 GMT", "desc": "九月的新模型像下饺子一样接连登场，却大多只来得及各领风骚一两天，很快又被下一款抢走风头。 就在刚刚，Anthropic 正式发布了 Claude Opus 5.5。 这是 Claude 5.5 家族的首款模型，未来几周内还会有 Sonnet 5.5 和 Haiku 5.5 陆续登场。 Opus 5.5 并非一次常规的半代升级。官方称，它在多数任务上的表现已经达到 Claude Fable 5.1 水平，相比 Opus 5 的典型任务成本降低 40%，输出速度提高超过 30%。 半代升级，Opus 性能直逼 Fable Anthropic 将 Opus 5.5 定位为面向长时间编程 Agent 和知识工作的主力模型。从官方公布的成绩看，它在 Agent 编程、电脑操作和专业工作上都取得了明显提升。 在 Terminal-Bench 4.0 中，Opus 5.5 得分为 66.4%，高于 GP", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1790130203.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "10-K - ESPEY MFG & ELECTRONICS CORP (0000033533) (Filer)", "url": "https://www.sec.gov/Archives/edgar/data/33533/000117494726000891/0001174947-26-000891-index.htm", "date": "2026-09-22T21:57:59-04 ，安徽、河南、福建三省委书记亦调整到位：曾长期任职湖北的61岁工信部部长 李乐成 转任安徽省委书记，前任梁言顺年逾63岁；曾长期任职上海的61岁福建省委书记 周祖翼 转任河南省委书记，前任刘宁年逾64岁；曾长期任职国土系统的59岁福建省长赵龙补缺周祖翼，顺位出任福建省委书记。 据新华网消息，9月23日，安徽省召开领导干部会议，中组部副部长吴浩在会上宣布了中央决定。李乐成任安徽省委委员、常委、书记，梁言顺不再担任安徽省委书记、常委、委员职务。据悉，梁言顺因年龄原因不再担任省委书记职务。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790209042.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "美国将在格陵兰岛扩张军事存在 非北约国家被禁止开发敏感领域", "url": "https://international.caixin.com/2026-09-23/102488119.html", "date": "Thu, 24 Sep 2026 00:17:22 GMT", "desc": "协议允许美国进入格陵兰岛进行军事活动，包括建立由特朗普牵头的“金穹”导弹防御系统 当地时间2026年9月22日，美国纽约，美国与丹麦及其自治领地格陵兰岛签署一项安全协议，以“加强北极和北大西洋地区的安全”。当天，美国总统特朗普、丹麦首相弗雷泽里克森和格陵兰岛自治政府总理尼尔森出席了在纽约联合国总部举行的签字仪式。图：IC PHOTO 【财新网】 当地时间9月22日，美国、丹麦和丹麦自治领地格陵兰岛的三方领导人，签署了一项安全协议，为美国扩大格陵兰岛的军事存在铺平道路，并在一定程度上缓解了美国总统特朗普过去一年多以来，因有意“购置”格陵兰岛所引发的跨大西洋紧张局势。 三方是在美国纽约联合国大会期间签署该协议的。 该协议是对1951年美丹两国签署的格陵兰岛防务协定以及其后续相关协议的修订和补充。 根据1951年协议，只要将相关行动告知丹麦和格陵兰，美国便有权利在格陵兰岛建设军事基地，并在格陵兰", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790209042.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "新加坡禁止公共交通上音视频扰民 最高罚款约2600元", "url": "https://international.caixin.com/2026-09-23/102488144.html", "date": "Thu, 24 Sep 2026 00:17:22 GMT", "desc": "此前新加坡地铁已执行类似措施，车内饮食、乱丢垃圾等行为也被纳入处罚范围 当地时间2026年4月22日，新加坡一街道公交车。图：视觉中国 【财新网】 随着短视频和流媒体普及，公共交通工具上的音视频外放问题受到更多关注，海外部分地区开始通过明确的处罚措施约束此类滋扰行为。自9月23日起，在新加坡公交车、公交换乘站及总站以大音量外放音乐或视频、滋扰他人的乘客，最高可被罚款500新元（约合人民币2600元），车内饮食、乱丢垃圾、把脚放在座位上等行为，也被纳入处罚范围。 对于较严重的违规行为，例如在公交换乘站、公交总站阻碍乘客通行或危及他人安全，以及在公交车、换乘站或总站随地大小便等，最高罚款可达5000新元。陆路交通管理局表示，此次新规是为了统一公交车与地铁在滋扰、扰乱秩序行为上的监管标准，避免同类行为因交通工具不同而处罚不一致。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790209042.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "[分享创造] [分享创造] PageLens：把多个网页的变化整理成个人信息流", "url": "https://www.v2ex.com/t/1244390#reply0", "date": "2026-09-24T00:15:31Z", "desc": "", "tags": [], "topic_score": 0, "source": "V2EX 最新", "cat": "AI实战_创作者", "weight": 3, "ts": 1790208931.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "高通发布两款2纳米工艺手机芯片 押注智能体应用", "url": "https://www.caixin.com/2026-09-23/102488111.html", "date": "Thu, 24 Sep 2026 00:14:03 GMT", "desc": "为应对存储压力，手机市场转向中高端产品组合，高通推出双旗舰产品覆盖不同产品层级 市场调研机构Omdia报告显示，随着存储价格大幅上涨，2026年一季度，存储成本已占售价低于400美元智能手机总BOM（物料清单）成本的近60%。图：视觉中国 【财新网】 当地时间9月22日高通2026骁龙峰会上，高通宣布，手机旗舰产品线首次同时推出两款芯片产品，分别为第六代骁龙8至尊版和第六代骁龙8超级至尊版。两款芯片CPU（中央处理器）、GPU（图形处理器）和NPU（神经网络处理器）的基础架构相同，均采用台积电2纳米工艺，这也是高通首次将2nm工艺引入手机平台。 相比至尊版，超级至尊版芯片采用了更先进的Offset PoP散热优化封装技术，帮助芯片在高工作负载场景更有效散热并保持高性能表现；支持带宽更高的LPDDR6内存；GPU方面加入Matrix Cores扩展，优化图形增强类AI任务表现，且HPM（高性", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790208843.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "车企辅助驾驶体验趋同 座舱智能体成为新竞争焦点", "url": "https://www.caixin.com/2026-09-24/102488219.html", "date": "Thu, 24 Sep 2026 00:11:39 GMT", "desc": "随着辅助驾驶和自动驾驶普及，用户部分精力从驾驶任务中解放出来，这意味着智能座舱体验将越来越重要 上汽乘用车荣威品牌新车座舱内部。图：荣威 【财新网】 AI大模型上车是近期行业竞争新方向。9月21日，上汽乘用车荣威品牌新车开启预售，该公司称，这款车型是豆包座舱助手第一车。该功能由上汽乘用车和字节跳动旗下火山引擎共同开发。 汽车智能化有辅助驾驶和智能座舱两大方向。辅助驾驶经过几年快速发展已经面临瓶颈，不同头部车企和供应商系统的体验差别并不明显。智能座舱成为企业打造差异化的着力点。实际上，随着辅助驾驶和自动驾驶普及，用户的部分精力从驾驶任务中解放出来，这意味着智能座舱体验将越来越重要。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790208699.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "江西省长叶建春辞职被接受 上月已官宣落马", "url": "https://china.caixin.com/2026-09-23/102488106.html", "date": "Thu, 24 Sep 2026 00:11:39 GMT", "desc": "易炼红自2018年8月至2021年10月任江西省长，叶建春自2021年10月接替易炼红任江西省长至今，两人都是二十届中央委员 资料图：叶建春。图：视觉中国 【财新网】 官宣落马近一个月后，江西省长叶建春请辞被接受。 据江西人大微信公众号消息，2026年9月23日，江西十四届人大常委会二十五次会议决定，接受叶建春辞去江西省长职务的请求，并报江西十四届人大五次会议备案。 8月27日，中央纪委国家监委网站通报称，时任江西省委副书记、省长叶建春涉嫌严重违纪违法，目前正接受中央纪委国家监委纪律审查和监察调查。 叶建春官宣落马前最后一次露面，是在8月24日。据江西省政府网站，当日，省长叶建春主持召开第138次省政府常务会议。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790208699.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "李在明称韩国愿推进美朝对话重启 抛出结束半岛战争状态路线图", "url": "https://international.caixin.com/2026-09-23/102488154.html", "date": "Thu, 24 Sep 2026 00:11:39 GMT", "desc": "在与李在明的会晤中，特朗普重申了与朝鲜开展对话的意愿 当地时间2026年9月22日，美国纽约，韩国总统李在明在联合国总部举行的第81届联合国大会上发表讲话。图：视觉中国 【财新网】 当地时间9月22日，韩国总统李在明在纽约举行的第81届联合国大会一般性辩论上发表讲话，提出朝鲜半岛和平共存的三项蓝图，并明确阐述处理朝鲜核与导弹问题的阶段性路线。 他表示，韩国将推动长期停滞的朝美对话尽快重启，为结束朝鲜半岛战争状态、建立和平机制创造条件。 当天晚些时候，李在明与美国总统特朗普举行约30分钟的会晤。 根据韩国总统府公布的消息，特朗普在会谈中重申了与朝鲜开展对话的意愿，双方同意就重启朝美接触、建立朝鲜半岛可持续和平机制保持密切沟通。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790208699.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "[分享创造] 做了一个 Mac 窗口分组工具 TabSash，想找几位朋友试用反馈", "url": "https://www.v2ex.com/t/1244387#reply0", "date": "2026-09-24T00:09:32Z", "desc": "", "tags": [], "topic_score": 0, "source": "V2EX 最新", "cat": "AI实战_创作者", "weight": 3, "ts": 1790208572.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "Amazon’s New AI Offer Reflects Discounting Surge", "url": "https://www.theinformation.com/articles/amazons-new-ai-offer-reflects-discounting-surge", "date": "2026-09-24T00:08:15Z", "desc": "", "tags": [], "topic_score": 0, "source": "The Information", "cat": "金融媒体_英文", "weight": 3, "ts": 1790208495.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "[程序员] Muse 听说对新手小白，比较友好，能力在线？", "url": "https://www.v2ex.com/t/1244383#reply3", "date": "2026-09-24T00:07:42Z", "desc": "", "tags": [], "topic_score": 0, "source": "V2EX 最新", "cat": "AI实战_创作者", "weight": 3, "ts": 1790208462.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title  "always_fresh": false, "rank": 17}, {"title": "Meta’s next VR device isn’t a headset — it’s glasses", "url": "https://www.theverge.com/tech/999517/meta-vr-glasses-connect-2026-hands-on", "date": "2026-09-23T19:45:36-04:00", "desc": "Meta is launching new VR hardware: a pair of glasses. The new Meta VR Glasses sit on your ears like a typical pair of glasses instead of being strapped over your head, but they still have immersive displays for watching movies, playing games, and getting work done. Imagine a pair of hefty black sunglasses with […]", "tags": [], "topic_score": 0, "source": "The Verge", "cat": "科技新闻", "weight": 3, "ts": 1790207136.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "Muse is coming to Meta smart glasses", "url": "https://www.theverge.com/tech/999673/meta-connect-2026-muse-glasses-features", "date": "2026-09-23T19:40:56-04:00", "desc": "Just a couple of weeks after launching Muse, Meta announced that it's \"working on\" bringing the agent to its smart glasses, including the new glasses it unveiled at Meta Connect. Users will be able to activate Muse from their glasses by saying its name and ask it to handle tasks like guiding a workout, logging […]", "tags": [], "topic_score": 0, "source": "The Verge", "cat": "科技新闻", "weight": 3, "ts": 1790206856.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "Meta ditches the camera on its newest smart glasses", "url": "https://www.theverge.com/tech/999281/ray-ban-meta-audio-glasses-meta-connect-2026", "date": "2026-09-23T19:40:34-04:00", "desc": "Walking around Meta Connect 2026, everyone's sporting smart glasses in all sorts of shapes, colors, and sizes. It's a marked difference here, a tech bubble where \"pervert glasses\" are not a concern. Outside Connect, the public backlash against wearable surveillance tech - a catchall term that encompasses not just smart glasses, but also smartwatches and 进一步加剧，10年期美债收益率站上5.1%、创2007年7月以来新高。国际原油重上100美元、美国经济数据强于预期以及美联储官员释放继续加息信号，共同推动市场重新定价“更高更久”的利率路径，美债标售需求疲软又让债市雪上加霜。 美东时间23日周三美股午盘时段，在5年期国债标售完成后，各期限美债收益率升幅扩大，付息国债品种之中，只有2年期和3年期美债的收益率盘中未曾超过5.0%。5年期收益率自2007年来首次突破5%整数关口，盘中曾升近20个基点。 基准10年期美债收益率一度升至5.13%上方，日内升约17个基点，有望创四个月最大日升幅；2年期美债收益率逼近4.95%，创两年新高，日内近19个基点；3年期收益率一度升约20个基点至5.0122%。30年期美债收益率曾升至5.41%上方、日内升逾10个基点，时隔一周又创2007年来新高。 经济数据、油价和美联储“三重夹击” 本轮美", "tags": ["资本市场"], "topic_score": 2, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790188015.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 16}, {"title": "AI替代潮被高估？巴克莱：仅20%职场核心技能可被高度复制，但放大效应已悄然蔓延", "url": "https://wallstreetcn.com/articles/3782358", "date": "Wed, 23 Sep 2026 14:34:34 +0800", "desc": "AI对劳动力市场的冲击或许远比市场叙事更为温和，但也更为深远。巴克莱最新研究显示，真正能被AI高度复制的职场核心技能仅占约20%，大规模\"替代潮\"的担忧存在高估；然而AI对生产率的\"放大效应\"却呈现出截然不同的图景——其覆盖面远比自动化替代宽广，几乎渗透至劳动力市场的每个角落。 巴克莱于9月22日发布报告，推出\"AI自动化与放大框架\"（Barclays 3A Framework），以技能而非职业为核心分析单元，系统评估认知型AI与物理型AI对逾830个职业的影响。研究发现，自动化风险高度集中于少数职业群体， 认知型AI的高度暴露职业主要集中在计算机、工程和科学类岗位，物理型AI的高度暴露职业则集中在建筑、生产、安装、维护与维修领域。 与此同时，美国招聘数据已出现与AI相符的结构性变化——自2022年以来，自动化暴露度最高职业的招聘职位占比已从约30%回落至25%左右。 AI技能需求的急速扩", "tags": ["个人成长"], "topic_score": 2, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790145274.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 16}, {"title": "“券商一哥”掌门将换人，邹迎光接棒张佑君", "url": "https://wallstreetcn.com/articles/3782349", "date": "Wed, 23 Sep 2026 11:48:18 +0800", "desc": "“券商一哥”即将迎来新的一把手。 华尔街见闻多方求证获悉，9月22日中信证券内部已就相关人事调整作出安排，张佑君将退休，现任总经理邹迎光接棒。 这意味着，执掌中信证券超过十年的张佑君即将交棒。后续待履行上市公司相关程序后，中信证券管理层也将完成新一轮调整。 此次接棒并不突然。 2024年11月，中信证券董事会聘任邹迎光为总经理。此后不到两年，这名从固定收益业务成长起来的老将进一步走向中信证券管理层核心。 出生于1970年的邹迎光，职业经历颇为特别。 他本科就读于首都医科大学临床医学专业，毕业后曾在北京宣武医院担任外科医生。此后转向金融行业，并于2000年获得中央财经大学货币银行学专业经济学硕士。 在华夏证券及此后重组成立的中信建投期间，邹迎光长期从事债券及固定收益业务，历任债券业务部总经理助理、固定收益部负责人等职。 2017年，邹迎光进入中信证券并成为执行委员会委员，也曾负责固定收益业务", "tags": ["个人成长"], "topic_score": 2, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790135298.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 16}, {"title": "办公Agent不再比谁会做PPT，开始争夺“谁最懂这家公司”", "url": "https://wallstreetcn.com/articles/3782346", "date": "Wed, 23 Sep 2026 11:12:40 +0800", "desc": "9月22日的云栖大会上，千问办公一次发布了六项企业能力。 最抓眼球的是“数字员工”：它有名字、部门、负责人、岗位职责和授权范围，能被停用，执行记录也可以追溯。看起来，AI终于从一个悬浮在桌面上的工具，变成了组织架构里有工牌的同事。 但如果只盯着这张“工牌”，很容易错过发布会上更重要的四个字：企业上下文。 按照千问办公的描述，它要连接群聊、文档、知识库和业务系统，从中识别人、项目、流程和规则，再根据具体任务调取相关信息。换句话说，数字员工能不能干活，越来越取决于它背后有没有一套持续更新的公司记忆。 这意味着，办公Agent的竞争进入了一个新阶段。 过去大家比谁会做PPT、整理表格、生成报告； 接下来真正拉开差距的，是谁知道这家公司发生过什么、现在按什么规则运转，以及一件事究竟应该找谁。 第一轮竞争，像在考一个陌生的临时工 过去一年，办公Agent最常见的演示方式，是给它一份文件，再要求它完成", "tags": ["AI"], "topic_score": 2, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790133160.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 16}, {"title": "Agent“重塑”服务业！Muse重燃“恐慌”，金融股“躺枪”", "url": "https://wallstreetcn.com/articles/3782330", "date": "Wed, 23 Sep 2026 09:04:01 +0800", "desc": "Meta消费级AI代理Muse以压倒性下载量登顶苹果App Store，引发华尔街对AI颠覆金融服务业的新一轮担忧，银行与券商股遭遇数月来最大单日跌幅。 9月22日，美股金融板块重挫，标普500金融板块下跌约2%，拖累大盘基本收平。 券商嘉信理财与LPL Financial各跌逾6%。摩根大通下跌3.4%，创7月以来最大单日跌幅；富国银行跌3.9%，为5月以来最大跌幅；美国银行与花旗分别下跌3%和2%。 保险商Allstate、旅游预订平台Booking Holdings亦未能幸免。 市场的核心担忧在于，Muse此类AI智能体一旦大规模普及，将侵蚀那些依赖消费者行为惯性的传统商业模式—— 从财富管理、经纪服务到保险定价，均面临被绕过甚至替代的风险。 分析人士指出，此次抛售的范围和烈度，已远超今年早些时候同类事件所引发的市场波动。 Muse冲榜，“消费者惯性”模式受到冲击 Muse于9月8日", "tags": ["AI"], "topic_score": 2, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790125441.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 16}, {"title": "AI热情叠加中东局势缓和预期，纳指四连涨新高，美金融股下挫，原油五连跌，黄金走V", "url": "https://wallstreetcn.com/articles/3782289", "date": "Wed, 23 Sep 2026 05:55:37 +0800", "desc": "人工智能浪潮持续推高芯片及科技股，纳指四连涨再创新高，而\"智能体AI\"对金融行业的颠覆性预期则拖累银行股承压，标普横盘、道指下挫。 与此同时，国际油价在中东外交动态的多番反转中剧烈震荡，最终收跌逾2%。 纳斯达克100指数收涨0.8%，道琼斯工业平均指数下跌0.4%，标普500指数基本收平。芯片股连续第六个交易日上涨，美光科技和英伟达领涨，而金融板块则成为当日市场最大拖累。 市场对智能体AI浪潮的预期，正在制造显著的板块分化：科技股受益承接买盘，银行保险等具有\"人力替代属性\"的行业则遭到抛售。 油价方面，布 ge audiences.", "tags": [], "topic_score": 0, "source": "TechCrunch", "cat": "科技新闻", "weight": 4, "ts": 1790173800.0, "opinion": true, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 14}, {"title": "以史为鉴，全球加息周期开启后，哪些资产表现最好？", "url": "https://wallstreetcn.com/articles/3782374", "date": "Wed, 23 Sep 2026 18:51:42 +0800", "desc": "美伊冲突重燃、欧美日央行相继加息，全球货币政策正站在新一轮收紧周期的入口。以史为鉴，梳理上世纪70年代以来的十轮全球同步紧缩周期，或可为当下的资产配置提供重要参照。 东方财富证券研究所于9月23日发布宏观专题报告，基于104个经济体的政策利率数据库，系统梳理了1970年代以来全球十轮同步紧缩周期的特征与规律。报告指出，当前全球净加息扩散指数虽因8月底美伊冲突升级而有所回升，但整体水平仍明显低于此前典型紧缩周期，尚未进入全面加速紧缩阶段。 在此背景下，报告认为美债具备增配空间。 分析师认为，前期美债收益率冲高存在定价偏差，市场已提前计价加息预期，若美伊局势有所缓和，通胀预期有望随油价回落向下收敛，期限利差也有望进一步收窄。 十轮紧缩周期，三类驱动逻辑 东方财富证券研究所基于净加息扩散指数的变动，将1970年代以来的全球同步紧缩划分为十个主要周期，并归纳为三大类型。 \"抗通胀\" 型包括2026", "tags": ["资本市场"], "topic_score": 3, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790160702.0, "opinion": true, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 14}, {"title": "特朗普7月披露逾千笔证券交易：抛售微软、亚马逊，买入英伟达、Marvell与Salesforce", "url": "https://wallstreetcn.com/articles/3782324", "date": "Wed, 23 Sep 2026 05:17:44 +0800", "desc": "特朗普7月的投资组合再度迎来密集操作。根据周二公布的最新申报文件，其名下账户当月共计完成1156笔证券交易，买卖总额估计介于7900万至2.70亿美元之间，涉及科技股、国防股、ETF及债券等多个资产类别。 据CNBC，此次申报显示， 7月20日，特朗普名下账户分别出售微软与亚马逊股票，每笔交易金额介于500万至2500万美元之间，为当月规模最大的两笔交易。 同日，该账户还卖出了军工巨头诺斯罗普·格鲁曼（Northrop Grumman）公司股票，而这一天，特朗普恰好签署了一项行政令，收紧了国防承包商供应链要求。 申报文件未显示交易发生的具体时间及投资决策的作出方。白宫表示，特朗普的股票和债券投资组合由第三方金融机构独立管理，特朗普本人及其家庭成员对投资方向和买卖决策均无任何影响力。 然而，批评者指出，此类密集交易与历届总统普遍采用盲目信托或分散化基金的惯例形成鲜明对比，潜在的利益冲突争议持", "tags": ["AI"], "topic_score": 2, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790111864.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 14}, {"title": "花旗：通胀超越关税成家族办公室头号隐忧，富豪们涌向黄金与美股", "url": "https://wallstreetcn.com/articles/3782317", "date": "Wed, 23 Sep 2026 02:01:33 +0800", "desc": "全球最富有的投资者正将通胀列为首要风险。据花旗集团最新调查， 通胀今年已取代贸易战与关税，跃升为家族办公室最大担忧 ，这一趋势正在深刻影响超高净值群体的资产配置逻辑。 花旗集团年度全球家族办公室报告显示， 利率变动与全球金融体系稳定性紧随通胀之后，成为受访机构最关切的议题。 在 const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
