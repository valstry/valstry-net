"ts": 1791132428.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "最火AI岗位FDE：月薪5万，都干这些…", "url": "https://www.36kr.com/p/4011048293666944", "date": "Sun, 04 Oct 2026 08:15:34 GMT", "desc": "FDE ，全网最火热、最神秘的AI岗位之一。 火热在于，不少大厂开出了月薪高达三五万的招聘，小红书FDE遍地走，到处都是求职经验贴。 据招聘数据网站FDE Pulse统计，海外公开薪资的FDE岗位，基本年薪中位数约20万美元，折合人民币约134万元。 （都是钱啊这都是钱） 神秘在于，我访谈了6个FDE从业者，最后发现，他们做的事情好像都不太一样…… FDE的全称是Forward Deployed Engineer，中文名叫 前线（前沿）部署工程师 。 顾名思义，就是驻扎到客户现场的工程师：一边部署软件，一边解决客户的实际问题。 现在，这个词已经从硅谷火到了国内。 海外，Anthropic宣布投资1亿美元，在2027年底前培训1万名FDE工程师，OpenAI也带着40亿美元投资成立了专做部署的公司；AWS则拿出10亿美元组建FDE部门，把数千名工程师派到客户身边。 国内也在跟进，不少大厂都挂", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1791101734.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "王传福说石油总有一天要用完，但IEA说2027年后，石油每天过剩600万桶", "url": "https://www.36kr.com/p/4010937161797510", "date": "Sun, 04 Oct 2026 04:14:21 GMT", "desc": "王传福最近在一个发布会上说：\"燃油车用的是汽油，汽油来自石油，石油总有一天会用完。一直这么过度用下去，就是在透支人类的未来。\" 王传福说石油会用完，但国际能源署IEA在今年6月给出预测， 2027年全球石油就将出现供应过剩。 IEA在其2027年首次展望中预计，明年石油市场将出现明显过剩，因为石油生产将激增800万桶/日，而需求仅增长200万桶/日，也就是说每天过剩600万桶。 甚至有人认为，地球内部可能像一个巨大的能源工厂，石油会不断生成，使用时间可能达到5亿年。 上世纪50年代壳牌地质学家哈伯特提出了一套\"石油峰值论\"——他当年预测美国石油1970年见顶，世界石油2000年前后枯竭。 结果呢？美国水力压裂技术一上，从最大石油进口国摇身一变成了全球最大产油国，2019年页岩油产量压过沙特俄罗斯。 这就尴尬了。王传福说石油要用完，IEA说石油要过剩。那到底石油会不会用完？ 石油会不会用完？", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1791087261.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "国庆有人花218元体验“扇巴掌”", "url": "https://www.36kr.com/p/4009854440706176", "date": "Sun, 04 Oct 2026 00:48:26 GMT", "desc": "今年国庆，横店景区内挤满了准备过把“戏瘾”的游客。 一时间，清明上河图、明清宫苑的实景片场里，主角从专业演员变成了五六十岁的爷爷奶奶、带着孩子的年轻父母，甚至不会中文的外国游客。 今年8月，横店影视城推出“短剧体验”项目，据其官方小程序显示：游客最低只需要花费218元（不含妆造），便可以“全资进组”，配备一名导演，以及若干NPC搭戏，还原短剧拍摄真实片场。拍摄结束后2天左右，游客还可以获得一部两分钟左右的成片。如果游客想更沉浸地体验剧情，还可以升级为388元包含全套妆造的套餐。 需要注意的是，上述两个套餐不包括景区门票，游客体验该项目仍需另行购买239元的景区通票，或者选择499元的单个园区+短剧拍摄体验套餐，国庆黄金周期间（10月1日-10月5日），该套餐价格已经上调到549元。 国庆假期前，横店微电影的工作人员就告诉时代财经，目前游客体验最多的是甄嬛系列，国庆期间正式拍摄，可能需要排队", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1791074906.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "米哈游的黄金路绝版，AI让游戏小厂更难“出头”？", "url": "https://www.36kr.com/p/4010750691217539", "date": "Sun, 04 Oct 2026 00:46:00 GMT", "desc": "四个技术宅从上海交大闵行校区的一间宿舍出发，一路做成估值1750亿的游戏大厂之一。2020年《原神》上线，171天全球流水破10亿美元。米哈游也从一家小型游戏创业公司，迅速跻身全球游戏行业头部。 过去十多年，中国游戏行业让人津津乐道的创业故事并不少见。这条路，如今可能很难复刻了。 2026年，AI进入游戏产业深水区。做一款游戏更容易了，但让一家游戏公司从0走到100更难了。前不久，国内游戏公司更新的半年报，正在释放这个信号。 “普涨时代”正在结束 如果只看行业大盘，2026年的游戏市场并不算差。数据显示，国内游戏市场上半年收入突破1884亿元，增速超过12%，几乎算是近年来最亮眼的一份成绩单。 但如果把视线从整个行业移到一家家上市游戏公司身上，情况就没有那么乐观。 近期，64家上市游戏公司发布了半年报。统计显示，今年上半年，这些公司的整体游戏收入同比仅增长约9%，增速较此前明显放缓。其中，", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1791074760.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "The 7-year-old Nvidia Shield TV is now $100 more expensive due to AI", "url": "https://arstechnica.com/gadgets/2026/10/the-7-year-old-nvidia-shield-tv-is-now-100-more-expensive-thanks-to-ai/", "date": "Fri, 02 Oct 2026 14:52:16 +0000", "desc": "Initially launched in 2019, the Nvidia Shield TV Pro now retails for $299.99.", "tags": ["AI"], "topic_score": 4, "source": "Ars Technica", "cat": "科技新闻", "weight": 3, "ts": 1790952736.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "How China’s Token Resellers Create an Anthropic Gray Market", "url": "https://www.theinformation.com/articles/chinas-token-resellers-create-anthropic-gray-market", "date": "2026-10-02T13:01:07Z", "desc": "", "tags": ["AI", "资本市场"], "topic_score": 4, "source": "The Information", "cat": "金融媒体_英文", "weight": 3, "ts": 1790946067.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "r   if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
