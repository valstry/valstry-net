点，内部曾反复讨论是否要直接照搬国内的门店模式。一开始，霸王茶姬曾把特许经营权授权给新加坡本地合作方，对方有本地运营的多年经验，因此沿用旧模式，只开二三十平米的小店，最终销量惨淡，模式没有跑通。 以大店模式经营的霸王茶姬决定收回特许经营权，开始在当地自营，公司一家一家接洽核心商圈业主，“花了一年半，才有第一家业主接受我们的门店模式。”据黄鸿飞透露，霸王茶姬在新加坡已经开了45家门店，“现在虽然还没有领先，但很快就会成为细分赛道第一名。”", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790728247.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "敛财直至落马前三个月 64岁广西高官彭晓春一审获刑死缓", "url": "https://china.caixin.com/2026-09-29/102489690.html", "date": "Wed, 30 Sep 2026 00:30:47 GMT", "desc": "法院认定他受贿2.63亿余元，有未遂情节和“重大立功表现”；中共二十大以来广西落马高官5人，其中3人成“亿元贪官”，另有两名有广西任职经历的正省部级高官贪腐超亿元 2026年9月29日，广东省佛山市中级人民法院一审公开宣判广西壮族自治区政协原党组成员、副主席彭晓春受贿一案。图：央视新闻 【财新网】 广西高官 彭晓春 一审被认定受贿2.63亿余元获刑死缓。9月29日，广东佛山中院通报，当日该院一审宣判广西政协原党组成员、副主席彭晓春受贿一案，对彭晓春以受贿罪判处死刑，缓期二年执行，剥夺政治权利终身，并处没收个人全部财产；对追缴在案的彭晓春受贿所得财物及孳息依法上缴国库，不足部分继续追缴。 至此，2026年已有42名落马中管干部领刑，此前41人为： 赵金云 、 王昊 、 陈笑波 、 章更生 、 张效廉 、 唐一军 、 李微微 、 张天峰 、 罗增斌 、 李海涛 、 马丰胜 、 吴存荣 、 谭瑞", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790728247.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "渣打银行新加坡及东盟区主管：中国和东南亚消费行业发生根本性转变", "url": "https://topics.caixin.com/2026-09-29/102489776.html", "date": "Wed, 30 Sep 2026 00:30:47 GMT", "desc": "中国-东盟正在形成一体化生产网络，不再是单向把产品出口至某国，而是双向甚至多维度、多流向的货物流转，半成品也在跨境流通 2026年9月29日，新加坡，2026亚洲愿景论坛创新峰会，渣打银行企业及投资银行业务新加坡及东盟区主管周蕴彤。图：财新 【财新网】 9月29日下午，在“ 2026亚洲愿景论坛创新峰会 ”上，渣打银行企业及投资银行业务新加坡及东盟区主管周蕴彤介绍，中国和东南亚的消费行业出现了三大根本性转变。 首先是“供应链一体化”，大量企业从以中国为单一核心的供应链，转向融入区域生态体系。 周蕴彤称，过去人们看待中国和东南亚，是按生产端、消费端将其割裂为两块独立市场，但现在，两个区域越来越“深度互联”，已经是一个生态，企业策略也从简单的“中国+1”模式升级为“中国+东盟”。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790728247.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "央行加码结构性政策工具：PSL降息扩围、科创与民企再贷款增加额度", "url": "https://finance.caixin.com/2026-09-29/102489760.html", "date": "Wed, 30 Sep 2026 00:30:47 GMT", "desc": "将继续根据宏观经济运行情况、物价走势和宏观调控需要，综合运用多种货币政策工具 2026年9月27日，北京，中国人民银行总行。图：视觉中国 【财新网】 国务院常务会议提到“推出一批务实管用的增量政策”的第二天，央行调整完善若干货币政策工具。 2026年9月29日，央行宣布进一步调整完善几项货币政策工具，为经济平稳增长、高质量发展和金融市场稳定运行创造适宜的货币金融环境，推动经济持续向新向优向好发展，支持“十五五”实现良好开局。 具体包括：一是下调抵押补充贷款（PSL）利率0.25个百分点。一年期PSL利率从1.75%降至1.5%，以更好地激励政策性银行支持实体经济、服务国家战略。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790728247.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "【市场洞察】从产品到服务，中国体育产业出海走到哪一步？", "url": "https://database.caixin.com/2026-09-29/102489597.html", "date": "Wed, 30 Sep 2026 00:30:47 GMT", "desc": "未来体育产业全球化需要完成两层跨越。第一，把赛事赛场的专业资质、产品技术能力转化为面向普通海外消费者的商品力；第二，补齐海外渠道建设、本地化品牌营销、研发创新体系短板 2025年12月18日，山东聊城，泰山体育产业集团有限公司的生产车间，工人组装运动自行车。图：视觉中国", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790728247.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "人事观察｜47岁马珊珊当选沈阳市长", "url": "https://china.caixin.com/2026-09-29/102489664.html", "date": "Wed, 30 Sep 2026 00:30:47 GMT", "desc": "马珊珊2001年7月参加工作，长期任职家乡天津，曾任南开区委书记，2025年秋交流辽宁，是目前全国第二年轻的省部级高官 资料图：马珊珊。 【财新网】 辽宁两座副省级城市大连、沈阳同日任命市长。继 姚华明 当选大连市长后，据辽宁省委组织部微信公众号“辽宁先锋”消息，9月29日，沈阳十七届人大六次会议选举 马珊珊 （女）为沈阳市长。 此前的9月15日，沈阳十七届人大常委会三十四次会议通过，决定接受吕志成辞去沈阳市长职务的请求，决定任命马珊珊为沈阳市副市长，并决定其为代理市长。 再此前的9月12日晚，东北新闻网发布消息，辽宁省委决定：马珊珊任沈阳市委委员、常委、副书记，免去吕志成的沈阳市委副书记、常委、委员职务。沈阳市委决定：马珊珊任沈阳市政府党组书记，免去吕志成的沈阳市政府党组书记职务。吕志成年底将满60岁（1966年12月生）。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790728247.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "德勤：消费趋势新变化正颠覆商业模式", "url": "https://topics.caixin.com/2026-09-29/102489782.html", "date": "Wed, 30 Sep 2026 00:30:47 GMT", "desc": "消费者对交付结果有极高的期待，希望一切产品和服务都能贴合自身的价值观念与个人需求 2026年9月29日，新加坡，2026亚洲愿景论坛创新峰会，德勤东南亚消费行业负责人Vivek Sharma。图：财新 【财新网】 9月29日下午，德勤东南亚消费行业负责人Vivek Sharma在“ 2026亚洲愿景论坛创新峰会 ”上表示，当下并行的社会结构与技术革命，正在创造全新的商业模式，一些过去持续 const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
