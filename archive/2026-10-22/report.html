ion evidence while preserving competing hypotheses about unobserved states. Although effective, many belief-state methods encode memory in discrete natural language, where repeated compression can omit evidence or prematurely discard plausible alternatives. We introduce LAMB, a", "tags": ["AI"], "topic_score": 3, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1792555200.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "Sharp Degree Bounds for Putinar Certificates in Terms of the Positivity Margin via Analytic Sums of Squares", "url": "https://arxiv.org/abs/2610.26976", "date": "Wed, 21 Oct 2026 00:00:00 -0400", "desc": "arXiv:2610.26976v1 Announce Type: new Abstract: We establish sharp degree bounds for Putinar sum-of-squares (SOS) certificates in terms of the positivity margin $\\delta$. For any fixed Archimedean quadratic module with prescribed generators and any fixed bound on the degree of the objective, we prove a uniform certificate-degree upper bound of $O(\\delta^{-1/2}\\log^2(2/\\delta))$ for normalized poly", "tags": ["商业认知"], "topic_score": 3, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1792555200.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "Cross-Lingual Reusability of LLM Pipelines: Financial Extraction, Multilingual Reasoning, and Semantic Screening", "url": "https://arxiv.org/abs/2610.27043", "date": "Wed, 21 Oct 2026 00:00:00 -0400", "desc": "arXiv:2610.27043v1 Announce Type: new Abstract: Financial institutions increasingly deploy large language models (LLMs) in multilingual markets, raising a practical question: can pipelines developed and validated in English be reused across languages, or must they be rebuilt per locale? We test cross-lingual reusability along three dimensions--accuracy, reasoning-effort transfer, and behavioural s", "tags": ["AI"], "topic_score": 3, "source": "arXiv cs.CL", "cat": "AI技 ance holds that a large language model reviews a document better when the work is divided among agents. We test a narrow form of it in a controlled comparison of single-agent and multi-agent setups on a financial task, reviewing credit assessment memos against requirements. One agent checks six requirements in one call. A team of thr", "tags": ["AI"], "topic_score": 5, "source": "arXiv cs.AI", "cat": "AI技术前沿", "weight": 3, "ts": 1792555200.0, "opinion": true, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "马斯克画饼「全民高收入」，AI干了我的活，还能给我分钱？", "url": "https://www.36kr.com/p/4035092270125958", "date": "Wed, 21 Oct 2026 03:53:49 GMT", "desc": "最近 AI 巨头们不是捣鼓新模型，就在忙着发钱。 10 月 18 日，Anthropic 公布了要设立一个公共福利基金，并且已经得到了股东们的批准，在此基础上会将相当于公司 5% 的股份投入到该基金当中去。 马斯克看完了立刻附和，与其把股份交给基金公司，倒不如直接发放给广大投资者。 说完之后他真的这么做了：10月19日，马斯克表示打算从2027年起向每一个美国孩子发放一份SpaceX股票。 除了马斯克还提出一个概念「全民高收入」，这是一个生产能力很强、物质供应很充足的社会，并不是简单的向每一个人发放一笔钱。 不是，AI 对就业影响的焦虑还没结束，「全民高收入」的好日子就要来？ Anthropic 要把 3000 多亿分给普通人 这并不是一次普通的现金捐款，Anthropic 的公告里有几个值得注意的细节。 Anthropic 计划以一家由公司全资持有的有限责任公司（LLC）来设立基金，并不", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1792554829.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "VR、XR、MR 的 2026，谁在真正赚钱？", "url": "https://www.36kr.com/p/4034920386614406", "date": "Wed, 21 Oct 2026 01:44:45 GMT", "desc": "2026 年过半，中国 XR 产业交出一份分裂的成绩单：全球 VR 头显出货量同比下滑 18%，AR 设备却暴涨 138%；中国智能眼镜上半年销量同比翻倍，7 月线上零售却掉头向下。 冰与火之间，这个行业正在完成一次身份切换——从科技展台上的概念，变成货架上、景区里能收钱的产品。 终端： AI 眼镜接棒，MR 头显二次起跑 字节跳动 PICO 把筹码押在 MR 头显上。内部代号\"Project Swan\"的旗舰定名PICO Space Pro：microOLED 约 4000 PPI、约 40 PPD，双芯片架构——自研 XR 感知芯片把延迟压到约 12ms，用于 SLAM、运动补偿与反畸变，搭配的旗舰 SoC 在 CPU/GPU 上据称超 XR2 Gen 2 两倍。原定 9 月 2 日的北京发布会因软件体验升级推迟至四季度。同期 PICO 账号体系升级为\" 豆包 通行证\"，创始人周宏伟被", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1792547085.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "AI员工泡沫破裂，Meta紧急叫停裁员计划，小扎：还是人类好用", "url": "https://www.36kr.com/p/4034913072747394", "date": "Wed, 21 Oct 2026 01:35:57 GMT", "desc": "说好的用AI替代员工上岗呢？ 这怎么人都被广进了，AI也没顶上啊...... 此前，Meta原定于11月展开的第二轮裁员计划，因AI没展现预期工作能力而暂停。 小扎：都是骗人的，根本没有这么好用的AI员工。（哭） 与此同时，微软也在复盘中表示：自家的业务并没有随着大规模推广AI而变好。 几个月的加速之后，大厂开始重算AI效率账了...... Meta取消第二轮裁员 要说小扎对AI员工有多大信心，看看Meta的重组方案就知道了。 今年1月，扎克伯格与高管们在夏威夷开会时，讨论了一项名为 Project OT 的计划。 OT全称Organization Transformation，即组织转型。 按当时的设想，未来Meta的组织架构要围绕AI重新设计。 过去一个产品开发团队需要10到20个人，工程师、产品经理、设计师各司其职。 以后呢？ 3到5人足矣。 △ 新团队被称为Pod，豆荚，一种硅谷常", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1792546557.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "未来10年，这一类人，越来越难找到工作", "url": "https://www.36kr.com/p/4034862204736386", "date": "Wed, 21 Oct 2026 00:55:13 GMT", "desc": "前几天，我看了李飞飞和MasterClass CEO大卫·罗吉尔的一次访谈。 对话中，两个人聊到一个扎心的判断：未来10年，职场正在出现一个“杠铃效应”。 杠铃的一端，是前 1% 的顶尖专家；另一端，是能同时驾驭多件事的高主动性通才。而中间那些 “还凑合”的人，空间正在被急剧压缩。 我很认同这个观点，这是正在发生的事实。 做管理咨询这么多年，我见过太多“还凑合”的人：不犯错，也不出彩；不迟到，也不加班；交代的事能交差，但交出来的东西，换谁都能做。 过去，这类人能活。因为公司要规模、要人头、要“把活分下去”。 但未来10年，这一类人，会越来越难找到工作。 01 要么成为最顶尖的10%，要么被淘汰 我们先看李飞飞和罗吉尔说的“杠铃效应”。 为什么是杠铃，而不是别的形状？因为AI正在把职场的“中间地带”抽空。 罗吉尔在访谈中举了一个例子：一个“还凑合”的文章撰稿人，现在任何人用一个大语言模型，都", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1792544113.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "网红国货“被迫”改名：亏损6000万、品牌一夜清零", "url": "https://www.36kr.com/p/4034904904815748", "date": "Wed, 21 Oct 2026 00:49:03 GMT", "desc": "“因为一个疏忽，我亏了6000万，团队散了，品牌一夜清零，公司命悬一线。” 近日，国货美妆品牌唐魅可（TOMMARK）创始人应娅妮在社交平台发布视频，讲述一场商标风波给企业带来的经营冲击。 据其披露，唐魅可收到雅诗兰黛集团旗下MAC相关商标权利主体提出的无效宣告申请，涉及“唐魅可”与“魅可”的近似争议，前者相关商标被宣告无效，原有名称无法继续使用。 曾拿下电商平台BB霜类目第一、累计销售额突破15亿的美妆黑马，如今不得不更换品牌名称。创始人自述中，由于这次争议，“唐魅可”已改名为“唐魅”，同时面临包装物料作废、库存积压、员工离职等一系列问题，损失约6000万元。 唐魅可的改名风波，也折射出新消费品牌从流量驱动走向长期经营时容易被忽视的一道关卡：当品牌规模壮大，知识产权保护是否跟上了扩张脚步？ 靠一款抹茶气垫走红，曾爆卖超15亿 在商标风波之前，唐魅可曾是国货美妆赛 味着AI加速计算硬件的供给约束有望在2027至2028年间得到实质性缓解，对英伟达及相关供应链企业均构成明确的中长期业务支撑信号。 基板产能三年", "tags": ["AI"], "topic_score": 4, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792581020.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "AI算力够不够？硅谷喊“供不应求”，华尔街警告“价格崩塌”", "url": "https://wallstreetcn.com/articles/3784102", "date": "Wed, 21 Oct 2026 15:53:05 +0800", "desc": "AI算力投资正站在叙事分裂的十字路口。硅谷的掌舵者们以实际订单和极短回本周期为证据，坚称当前算力严重短缺、供不应求；而华尔街的顶级资管人则冷静地追问：一旦供给赶上需求，边际定价崩塌、折旧模型失效、企业端ROI精算收紧，这门生意的回报还能否维系？ SpaceX首席执行官马斯克在最新一季财报电话会上抛出了迄今最激进的算力扩张计划——预计2026年底在线算力达到2.5至3GW，2027年再新增10GW，并以\"如果届时上线算力低于13GW，我会感到意外\"来定调业绩指引。他描述的现货市场图景是：所有超大规模云厂商和数十家中小公司正\"无情地围追堵截\"，要求租用更多算力，\"如果我们对所有人都说'好'，我们的算力可以出租好几次\"。谷歌CEO皮查伊（Sundar Pichai）同样罕见地公开确认，客户今天想锁定2027年算力\"极其困难\"，全行业都希望手里的算力是当初规划量的两倍。 然而，Citadel创始人", "tags": ["AI"], "topic_score": 4, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792569185.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "英伟达推出临床手术AI模拟器，基于真实手术录像训练而成", "url": "https://wallstreetcn.com/articles/3784108", "date": "Wed, 21 Oct 2026 14:48:57 +0800", "desc": "英伟达将生成式AI引入手术室场景，推出全球首款基于真实胆囊切除术录像训练的实时交互手术模拟器，标志着外科机器人仿真研究迈入临床级视觉环境。 英伟达于10月20日发布Cosmos3-H-Dreams，该系统从CMR Surgical Versius平台的临床手术录像中学习视觉动态，能够根据器械操控指令实时生成新的手术场景续帧，而非简单回放已有手术录像。系统可在单块RTX PRO 6000 GPU上交互式运行。 英伟达明确表示，Cosmos3-H-Dreams是一款研究型模拟器，尚未经过患者护理验证，不适用于临床诊疗。视觉真实感并不等同于生物力学准确性，系统当前仅覆盖特定术式和器械组合，距离临床应用仍有多项验证工作需要完成。对于关注医疗AI赛道的投资者而言，该系统更多代表英伟达在物理AI与手术机器人仿真领域的技术布局，而非近期商业化落地。 从桌面缝合到临床场景 Cosmos3-H-Dreams", "tags": ["AI"], "topic_score": 4, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792565337.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "Ken Griffin详解“AI大跌”：算力类似航空，“边际定价”、“折旧期限”与“企业预算”三大陷阱", "url": "https://wallstreetcn.com/articles/3784098", "date": "Wed, 21 Oct 2026 11:51:40 +0800", "desc": "10月21日，在Citadel年度全球市场未来峰会上，Griffin接受彭博记者Dani Burger采访时表示，市场正从过去两年的\"主题式扫货\"转向真正意义上的基本面研究。他说：\"我认为这个市场正在经历的，是人们真正开始做功课。\" 过去两年，市场逻辑简单粗暴：数据中心万亿级建设潮开启，买入全产业链卡位节点——英伟达、高带宽内存DRAM、超微多层陶瓷电容器MLCC，以及韩国、中国台湾、日本供应商和云计算巨头——几乎稳赚。如今，这套逻辑正在被重新审视。近日，AI交易也遭遇大幅重挫， 半导体板块遭遇了金融危机以来最长连跌。 Ken Griffin警告：GPU与航空公司高度相似，边际运行成本极低，一旦算力供过于求，现货租赁与API调用价格将瞬间崩塌，重演2000年电信泡沫中\"暗光纤\"的覆辙。 陷阱一：边际定价崩塌——GPU的“航空公司时刻” Griffin用航空业打了一个直接的比方。 \"GPU和", "tags": ["AI"], "topic_score": 4, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792554700.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "谷歌CEO最新访谈：云业务正在为前沿AI“让路”，想锁定明年的算力“极其困难”，RSI“距终局还很远”", "url": "https://wallstreetcn.com/articles/3784092", "date": "Wed, 21 Oct 2026 11:15:19 +0800", "desc": "近日，谷歌发布旗舰模型Gemini 4 Argon，这款模型在72小时内消耗了25万亿Token，是上一代Gemini 3.0同期的三倍，并创下谷歌历史纪录。 谷歌CEO皮查伊（Sundar Pichai）在模型发布后的首次公开深度访谈中，正面回应了外界关于“谷歌放弃前沿AI”的质疑，并罕见承认公司云业务正在为前沿模型研发主动让渡算力资源。 皮查伊坐进硅谷山景城的录音棚，接受科技媒体人Alex Kantrowitz主持的《Big Technology Podcast》专访。他证实了全行业算力严重短缺的判断——当下每家公司都希望自己手里的算力是当初规划量的2倍，客户今天想锁定2027年的算力“极其困难”。在递归自我改进（RSI）问题上，皮查伊明确划定边界：当前阶段是AI智能体与人类研究员协同推进的过渡期，距离“自主失控的终局”仍相当遥远。 前沿模型，是谷歌的“第一优先级”，不是选项 过去一年", "tags": ["AI"], "topic_score": 4, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792552519.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "比 Opus 5.5 便宜 88 倍！MiniMax M3.1 Flash “杀“回王座，顺手拿了个 Agent 国模第一", "url": "https://www.infoq.cn/article/7Twa7KBWIzi8JGOdVwCK?utm_source=rss&amp;utm_medium=article", "date": "Wed, 21 Oct 2026 00:26:48 GMT", "desc": "点击查看原文>", "tags": ["AI"], "topic_score": 2, "source": "InfoQ 中文", "cat": "中文商业媒体", "weight": 4, "ts": 1792542408.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "国模Agent第一！MiniMax爆改Flash战力，全时段大肥鱼谷价", "url": "https://www.qbitai.com/2026/10/504517.html", "date": "Tue, 20 Oct 2026 13:29:54 +0000", "desc": "兔皮底下，竟然是MiniMax！", "tags": ["AI"], "topic_score": 2, "source": "量子位", "cat": "中文商业媒体", "weight": 4, "ts": 17925029 联社）潘功胜：将退出存贷款基准利率 用市场化利率指标来替代", "date": "", "hot": 0, "tags": [], "topic_score": 0, "source": "热搜-知乎", "cat": "热点榜_发生了什么", "weight": 5, "ts": 0, "opinion": true, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 19}, {"title": "陶哲轩和邓煜的对谈《数学与 AI 究竟是什么关系？》，如何理解他们各自的观点？", "url": "https://www.zhihu.com/question/2095840244973004152", "desc": "有了这些模型，人的哪些方面能力会变得重要？它怎样才能与人合作，真正帮助人而不是取代人？ 陶哲轩 关键是增强人的能力。也就是说，要设法为科学家提供工具，也为从业者等人提供工具，让他们的能力真正增强。当你使用这些工具时，你自己也会变得更聪明，理解得更深，而不是牺牲自己的能力，依赖 AI 来获得答案。 所以还是那句话，任何技术都是如此。拿汽车来说，如果到哪儿都开车，久而久之，你会忘了怎么走路，或者身体变差，但这并不意味着你该彻底放弃汽车。你需要有意识、有分寸地使用这些交通工具。 而且我觉得，我们可以相信大家，尤其是年轻一代。眼下可能有很多焦虑，甚至绝望，因为许多数学领域的老规矩都在发生变化。但一旦大", "date": "", "hot": 0, "tags": [], "topic_score": 0, "source": "热搜-知乎", "cat": "热点榜_发生了什么", "weight": 5, "ts": 0, "opinion": true, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 19}, {"title": "美股杠杆加不动了？华尔街“已耗尽资产负债表”，只能劝对冲基金“加空仓”", "url": "https://wallstreetcn.com/articles/3784162", "date": "Thu, 22 Oct 2026 08:20:09 +0800", "desc": "当内部风控触及上限，华尔街的答案不是踩刹车，而是移动球门柱。 据彭博最新报道，巴克莱银行今年早些时候在亚洲AI股票交易热潮中触及对冲基金客户融资上限后， 通过内部拍卖机制，将宏观利率交易台的部分资本配额借调给大宗经纪业务，以维持对亚洲对冲基金客户的贷款扩张。 与此同时，包括高盛在内的多家银行交易员开始向对冲基金客户施压，鼓励其持有更多空头头寸——这一操作在账面上压缩了资产负债表占用，却并未真正降低市场整体杠杆水平。 高盛首席财务官Denis Coleman本月早些时候表示，股票融资需求持续超出行业可用容量，高盛因此得以\"有选择性地部署资源\"。高盛大宗经纪数据显示，截至10月18日当周， 美国多空对冲基金净杠杆率下降3.2个百分点至43.7%，创五年新低——但这一下降几乎全部来自空头头寸的增加，而非多头的削减。 自7月31日以来，多头杠杆仅下降0.5个百分点至128.8%，空头杠杆则上升8.", "tags": ["资本市场"], "topic_score": 2, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792628409.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 18}, {"title": "Tesla, IBM & Meta Report Earnings as AI Takes Center Stage", "url": "https://www.bloomberg.com/news/videos/2026-10-21/the-close-10-21-2026-video", "date": "Wed, 21 Oct 2026 22:04:16 GMT", "desc": "The Close brings you the latest news and analysis leading up to the final minutes and seconds before and after the closing bell on Wall Street. Today's guests are BlackRock Head const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
