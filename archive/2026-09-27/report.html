s": 1790317256.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 16}, {"title": "谷歌“算力卫星”下周发射！搭乘SpaceX火箭 、每运行15分钟就要停机散热", "url": "https://wallstreetcn.com/articles/3782530", "date": "Fri, 25 Sep 2026 11:59:17 +0800", "desc": "谷歌即将首次把自研AI芯片送入低地球轨道，探索将AI算力从地面数据中心延伸至太空。 下周，一颗由谷歌与卫星成像公司Planet联合研制的实验卫星，将搭乘SpaceX的Transporter-18拼车任务发射升空。 卫星搭载4颗谷歌自研Trillium TPU芯片，将在轨运行谷歌Gemini模型，并接收、回答来自地面的指令。 这是谷歌“日晷捕手”（Project Suncatcher）项目的首次在轨测试。谷歌的长期目标，是在地球轨道上部署由多颗卫星组成的AI计算集群，以获得更充足的太阳能，并缓解地面数据中心面临的电力和土地约束。 不过，这次任务仍属于早期技术验证。谷歌研究高级副总裁James Manyika表示，当前阶段重点是验证芯片和相关硬件能否经受发射、辐射和太空热环境，而非立即推出商业化系统。 更现实的问题是，在太空运行AI芯片，目前连散热都尚未完全解决——卫星每次全功率运行约15分钟", "tags": ["AI"], "topic_score": 3, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790308757.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 16}, {"title": "今年就“贡献”2亿美元！“AI股神”是高盛“最大主经纪客户”", "url": "https://wallstreetcn.com/articles/3782520", "date": "Fri, 25 Sep 2026 09:31:35 +0800", "desc": "被市场称为“AI股神”的Leopold Aschenbrenner，其创立的Situational Awareness基金成立仅两年，便已跻身高盛最重要的主经纪客户之列。 据英国《金融时报》援引知情人士透露， 高盛今年通过向Situational Awareness提供融资服务，获得的费用收入已超过2亿美元，使其成为高盛主经纪业务中费用贡献最高的对冲基金客户。 这笔收入与Situational Awareness此前激进的加杠杆策略密切相关。不过，这种交易模式正在退潮。今年7月，Aschenbrenner已告知投资者，将停止通过借贷放大投资押注。 随着融资需求下降，高盛未来从该基金获得的相关费用也将随之减少。 与此同时，AI股票的急剧回调让高杠杆策略迅速遭到反噬。Situational Awareness在遭遇数十亿美元亏损后，此前估值约160亿美元的公开市场头寸大部分被出售给Ken Gr", "tags": ["企业落地"], "topic_score": 3, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790299895.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 16}, {"title": "报道：蓝色起源按1400亿美元估值融资100亿美元", "url": "https://wallstreetcn.com/articles/3782506", "date": "Fri, 25 Sep 2026 07:28:47 +0800", "desc": "蓝色起源完成首轮外部融资，估值达1400亿美元，创始人杰夫·贝索斯在这家太空公司上的累计投入已高达300亿美元。这轮融资将为蓝色起源提供追赶SpaceX的弹药，并为其雄心勃勃的营收增长计划提供资金支撑。 9月24日，据《华尔街日报》报道， 蓝色起源已完成100亿美元的外部融资，公司估值约为1400亿美元。 贝索斯本人在本轮融资中额外注资20亿美元，将其自2000年创立公司以来的总投入推至约300亿美元。 报道援引知情人士透露，最终融资规模可能超过100亿美元的初始目标。 这轮融资为这家私营公 "weight": 5, "ts": 1790385678.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "Meta Muse为超级智能买单", "url": "https://www.36kr.com/p/3999313876734086", "date": "Sat, 26 Sep 2026 00:55:54 GMT", "desc": "我认为，Meta为Muse付出的承诺税，可能是AI行业近年最贵的一笔。 13天，250万次下载。上线约10天直接登顶App Store第一，干掉了ChatGPT。市场在狂欢，Meta市值单日涨了约2000亿美元。 看起来是一场漂亮的翻身仗，但它承诺了什么，又交付了什么，这两件事之间的差距，值得算一算。 ...... 扎克伯格这次最大的承诺是钱。九月初，他给Muse定了个位，叫「个人超级智能」。 你回想一下，过去两年AI圈用过多少词，聊天机器人、AI助手、Copilot、智能体，每个词都在试图描述同一个东西，但扎克伯格这次选了个最大的。 这个词本身就带着野心，他想说的很清楚，Muse要替你干活，陪你聊天只是起步。 看产品演示就知道了： Muse说自己能帮你订机票、购物、管日程，App关了它也能接着跑。你想，这等于在跟用户承诺一件事，你有了一个数字分身，它24小时在线，替你跑腿。嗯，很性感。 ", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1790384154.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "第一批“请3休13”的人，已经在焦虑酒店的神秘小虫子了", "url": "https://www.36kr.com/p/3999514065276804", "date": "Sat, 26 Sep 2026 00:53:11 GMT", "desc": "旅行本来就是短暂离开熟悉生活的过程，住酒店要操心的事已经够多了，现在又多了一项看不见、说不准、也很难证明的“床虱焦虑”。（本文没有恐怖的虫子特写图，请放心阅读）。 作者 | 洛卡来 编辑 | 贾小凡 题图 | 蜜语纪 第一批“请3休13”的人已经出发了，还有一批在盼着假期出游的人，正在悄悄搜索一个不那么浪漫的词：床虱。 在北方，它还有个更家常的名字：臭虫。这个名字对祖辈来说，可能并不是什么新鲜事。在卫生条件不算完善、集体宿舍更常见的年代，臭虫曾是床板缝、铺盖卷和夏夜里的“老熟人”。 没想到，在干净前卫的城市生活里，它们最近又有点卷土重来的意思，尤其坑惨了旅游住酒店的人。 今年打开社交平台，“住酒店被床虱咬了”“怎么判断是不是床虱”“行李箱会不会把虫子带回家”之类的帖子并不少见：有人晒出腿上成片的红疙瘩，一开始还以为是过敏；有人旅行结束后几天还在发痒，才开始回想入住那晚的床垫是不是有可疑的痕", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1790383991.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "微软CEO回应XBOX裁员。据TechpowerUp报道，微软首席执行官萨提亚·纳德拉（Satya Nadella）针对XBOX正在实施的裁员表态，称很高兴看到（great to see）。此番言...", "url": "https://www.huxiu.com/moment/1283832.html", "date": "Sun, 27 Sep 2026 00:37:09 GMT", "desc": "微软CEO回应XBOX裁员。 据TechpowerUp报道，微软首席执行官萨提亚·纳德拉（Satya Nadella）针对XBOX正在实施的裁员表态，称很高兴看到（great to see）。此番言论所谈及的，正是由XBOX首席执行官阿莎·夏尔马（Asha Sharma）主导的重组工作。注意到，在纳德拉发表该看法之前，XBOX刚刚又进行了一轮裁员，新增裁撤268个岗位，而今年早些时候已经砍掉了1600个工作岗位。这项重组计划已经合并多家游戏工作室、重新调整《光环》（Halo）等IP项目布局，还有多名开发人员直接遭到解雇。 纳德拉是在亚历克斯·希思（Alex Heath）主持的Sources Podcast播客节目接受访谈、探讨XBOX在微软内部的定位时说出这番话的。当被问及他如何看待XBOX当下状况以及未来走向时，纳德拉表示：我的感觉非常好。团队正在开展一定程度的精简工作，阿莎也在推进相关", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1790469429.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "中国移动、中国电信、中国联通，集中叫停。在三大运营商线下营业厅，不少消费者都碰到过“免费领手机”“办宽带送礼品”的宣传。看似是办套餐就能白拿手机，实际...", "url": "https://www.huxiu.com/moment/1283831.html", "date": "Sun, 27 Sep 2026 00:34:20 GMT", "desc": "中国移动、中国电信、中国联通，集中叫停。 在三大运营商线下营业厅，不少消费者都碰到过“免费领手机”“办宽带送礼品”的宣传。看似是办套餐就能白拿手机，实际是‌签了贷款合同‌，每月话费里包含还款金额。有消息称，9月24日起，三大运营商金融分期购机业务暂停，不能再新增办理这类0元拿手机业务。近年来，关于分期购机的投诉从未间断。三年前，湖南株洲吴先生便遭遇过业务员上门承诺在网三年就送一部手机，几天后吴先生收到的却是一条“贷款成功”的短信。合同显示，他名下多了一笔1950元、36期的消费贷款。 三年过去，类似的情况仍在出现。这类投诉都有共同点：用户以为自己办的是通信业务，签下的却是贷款合同；以为交的是话费，实际上是在还贷款。一旦手机欠费停机，贷款随即逾期，个人征信跟着受损。 近日，有消息称，三大运营商已经暂停此类业务，总台记者致电电信、联通运营商客服以及移动“和包信用购”客服，对方都表示，此类分期购", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1790469260.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "中国人民解放军南部战区位黄岩岛周边海空域组织海空联合演训。9月27日，中国人民解放军南部战区位黄岩岛周边海空域组织海空联合演训，这是针对当前个别国家破坏...", "url": "https://www.huxiu.com/moment/1283829.html", "date": "Sun, 27 Sep 2026 00:07:04 GMT", "desc": "中国人民解放军南部战区位黄岩岛周边海空域组织海空联合演训。 9月27日，中国人民解放军南部战区位黄岩岛周边海空域组织海空联合演训，这是针对当前个别国家破坏地区和平稳定的必要行动，旨在检验提升部队维护国家领土主权和海洋权益的实战能力。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1790467624.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "邓亚萍谈日本男单全军覆没：男团夺冠后兴奋过了头，能战胜国乒出乎他们的意料；张本智和对中国队做了充分的准备，单打他的心态不一样了。据看看新闻Knews：亚运...", "url": "https://www.huxiu.com/moment/1283828.html", "date": "Sun, 27 Sep 2026 00:03:46 GMT", "desc": "邓亚萍谈日本男单全军覆没：男团夺冠后兴奋过了头，能战胜国乒出乎他们的意料；张本智和对中国队做了充分的准备，单打他的心态不一样了。 据看看新闻Knews：亚运会乒乓球男单1/4决赛，张本智和和松岛辉空先后出局，日本男单选手全部出局。邓亚萍在节目中，谈到了日本男 document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
