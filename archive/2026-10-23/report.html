strations with building an MCP/API for these agents to consume. The problem: testing against these tools is hard! Agent memory + account statefulness make reproducibility, in the ways required for repeatable/reliable outcom", "tags": ["AI"], "topic_score": 4, "source": "HN Show HN", "cat": "AI实战_创作者", "weight": 5, "ts": 1792707520.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 31, "title_zh": "Show HN：CATT 0.2.1——在 CI 中针对类 Muse/Instinct 的智能体/服务进行测试", "desc_zh": "HN 的朋友们好，我们最近开源了 Consumer Agent Testing Tool，帮助团队针对 Muse 和 Instinct 等专有助手进行迭代。我们开发它，是为了减少自己在构建供这些智能体使用的 MCP/API 时遇到的挫败感。问题在于：针对这些工具进行测试很难！智能体记忆 + 账户状态化，使得实现可重复/可靠结果所需的那种可复现性变得困难。"}, {"title": "Show HN: Murmur, open-source push-to-talk dictation for Mac (BYO OpenAI key)", "url": "https://github.com/leochaddad/murmur", "date": "Thu, 22 Oct 2026 20:47:08 +0000", "desc": "I know there are many dictation apps out there, but I built one myself anyways based on my custom needs. Since OpenAI dictation is so good, my previous workflow would be speaking to ChatGPT UI and pasting a default prompt to turn my speech into a well formatted prompt Now I just hold a key (Fn for me), talk, let go, and the text gets pasted wherever the cursor is, mostly Claude Code in the termina", "tags": ["AI"], "topic_score": 4, "source": "HN Show HN", "cat": "AI实战_创作者", "weight": 5, "ts": 1792702028.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 31, "title_zh": "Show HN：Murmur——面向 Mac 的开源按键说话听写工具（自带 OpenAI 密钥）", "desc_zh": "我知道市面上有很多听写应用，但我还是根据自己的定制需求做了一个。由于 OpenAI 的听写效果太好了，我此前的工作流是对着 ChatGPT UI 说话，再粘贴一个默认提示词，把语音变成格式良好的提示词。现在我只需按住一个键（我的是 Fn），说话，松开，文本就会粘贴到光标所在处，多数是在终端里的 Claude Code 中。"}, {"title": "Show HN: Secure your AI agents on Mac", "url": "https://installplango.com/", "date": "Thu, 22 Oct 2026 20:15:37 +0000", "desc": "Plango is a Mac native security suite for anyone running AI coding tools. It works by running a custom local security model that evalua 势持续紧张。研究人员警告，在漏洞公开披露前后，黑客的攻击尝试已从数千次骤升至数百万次，部分系统被入侵的可能性不可排除。 周四，英国确认，超过30项政府服务仍处于下线状态，以待安全更新完成部署。电信运营商Orange也于周四宣布暂停部分网站和应用的访问。 此前一天，奥地利、荷兰、芬兰、法国等数十个国家和地区已陆续采取类似措施，日本多家银行和航空公司亦中断了部分在线服务。 网络安全公司Cloudflare首席执行官Matthew Prince透露，在漏洞公开披露前10小时，其系统已识别出数千次针对该漏洞的利用尝试；公告发布后两小时内，攻击次数飙升至数十万次，随后进一步增至数百万次。目前尚不清楚有多少次入侵尝试最终成功窃取数据或入侵系统。 Palo Alto Networks则表示，已识别逾2260万个包含该漏洞的\"暴露实例\"，规模\"极为庞大\"。", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792683220.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "美国上周首申人数降至19.4万，创三个月新低，逼近60年来最低水平", "url": "https://wallstreetcn.com/articles/3784239", "date": "Thu, 22 Oct 2026 23:13:55 +0800", "desc": "美国初请失业救济人数意外降至三个月低点，进一步表明企业裁员仍然有限，但招聘放缓、消费者信心低迷等迹象显示，劳动力市场的韧性并不意味着就业形势全面向好。 美国劳工部周四公布的数据显示，截至10月17日当周， 初请失业救济人数减少6000人至19.4万，低于彭博调查经济学家预期的20万。四周移动均值降至19.775万，为2022年以来最低水平，初请人数持续处于近60年来的极低区间。 续请失业救济人数则增加2.5万至173万，升至六周高位，但仍处于近三年来的低位，表明持续领取失业救济的人数总体仍然有限。 彭博经济学家Eliza Winger表示，初请数据表明，10月非农就业调查基准周内裁员规模有限。 尽管近期多家企业宣布裁员，人工智能也开始影响部分行业的用工需求，但目前尚无充分证据表明，AI已引发大范围裁员。 初请人数维持低位，劳动力市场尚未出现裁员潮 未经季节性调整的初请人数上周减少逾1.9万", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792682035.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "“所有人都崩溃了”......百名交易员，同一笔交易，两度爆仓！", "url": "https://wallstreetcn.com/articles/3784234", "date": "Thu, 22 Oct 2026 23:13:49 +0800", "desc": "欧洲国债套利交易接连爆仓，近百名伦敦交易员出局，一场高杠杆交易的集体崩塌正在冲击欧洲固定收益市场。 “Everyone has blown up（所有人都爆仓了）……他们全部出局了。” 说出这句话的，是一位流动性提供商的资深交易员。他亲眼目睹了这场欧洲国债市场的剧烈震荡： 近百名交易员在同一笔交易上前后两度爆仓，黯然离开了他们曾经年薪百万美元的岗位。 这并非个别基金的投资失误，而是一场由拥挤交易、高杠杆和流动性收缩共同引发的连锁崩塌。 那笔曾经像“印钞机”一样的交易 过去近三年，伦敦多策略对冲基金圈最热门的操作之一，是一笔逻辑简单、收益看似稳定的套利交易： 买入法国国债（OAT），再以国债作为抵押品，在回购市场（repo market）融资，赚取债券收益率与回购融资成本之间的利差（carry）。 通过不断加杠杆，原本只有几个基点的利差，也能被放大成数百万美元的年度收益。这种交易逐渐成为欧洲", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792682029.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "“大9”混战，万辆爆款也站不稳了", "url": "https://wallstreetcn.com/articles/3784235", "date": "Thu, 22 Oct 2026 21:48:09 +0800", "desc": "作者 | 周智宇 10月21日，极氪公布9X上市一周年成绩：累计交付突破8.5万辆，单车成交均价超过53万元。 卖得贵，也卖得多，是中国车企争相造“大9”的初衷。2022年的理想L9、2023年底的问界M9先后证明了这种可能，到2025年春季，同行的旗舰开始密集上市。 如今，车企已经能造出配置相近的产品，消费者却多了许多选择，二十多万元就能买到一辆配置齐全的大六座。各家的品牌都想往上走，争夺的买家却越来越接近。 销量过万，也不再足以让一家车企放心。零跑D19在7月冲过万辆，9月又回到三千辆左右。 “大9”的花期越来越短。一次冲高可以证明产品曾经获得认可，却还不足以支撑车企对旗舰的全部期待：提高售价、贡献规模，并为后续研发带来利润。 早期“大9”的成功仍在吸引后来者。只是等各家的旗舰陆续开进展厅，当初看中的市场里，已经多了一批同样准备了数年的对手。车可以照着相近的思路造，先行者起步时的竞争环", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792676889.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "欧洲气价再破90欧元，天然气库存仅约74%，冬季供应警报拉响", "url": "https://wallstreetcn.com/articles/3784233", "date": "Thu, 22 Oct 2026 21:26:06 +0800", "desc": "欧洲天然气市场正逼近新一轮供应危机，低库存与LNG供应受阻风险叠加，令冬季能源短缺担忧再度升温。 荷兰TTF前月期货本周早些时候升至2022年末以来最高水平，随后再度突破90欧元/兆瓦时。与去年冬季相比，天然气价格已接近三倍，欧洲工业、物流及居民用能成本面临进一步上涨压力。 供应端的压力主要来自欧洲库存不足与全球LNG贸易受扰。 欧盟储气设施填充率目前约为74%，降至彭博数据追溯至2009年以来的同期最低水平；与此同时，霍尔木兹海峡局势持续紧张，可能限制LNG供应，而欧洲还需与亚洲买家争夺有限的现货资源。 高盛大宗商品分析师Daan Struyven警告称， 如果霍尔木兹海峡LNG出口量仅维持正常水平的四分之一左右，同时严寒天气推高供暖需求，欧洲天然气价格可能进一步升至150欧元/兆瓦时。 随着冬季临近，寒潮与供应中断是否同时发生，将成为决定欧洲天然气市场压力的关键变量。 库存降至历史同期", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792675566.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "布油突破112美元！胡塞武装称对沙特发动多轮袭击，目标包括国防部、沙特阿美原油设施", "url": "https://wallstreetcn.com/articles/3784231", "date": "Thu, 22 Oct 2026 20:30:34 +0800", "desc": "油价因中东紧张局势骤然升级再度飙涨。 据CCTV国际时讯，也门胡塞武装发言人叶海亚·萨雷亚今天（10月22日）发表视频声明称， 胡塞武装在过去48小时内对沙特实施了4次军事行动，使用了数枚弹道导弹和无人机： 第一次行动打击了沙特首都利雅得的国防部大楼，“精准命中”；第二次行动打击了沙特达曼市的法赫德国王国际机场，“导致机场航班运行中断”；第三次行动打击了沙特延布的沙特阿美石油公司设施，“精准命中，并在目标地点引发火灾”；第四次行动打击了沙特艾卜哈国际机场，“精准命中”。 布伦特原油期货周四早盘涨逾3%，报112.25美元/桶；美国WTI原油上涨2.79%，报99.86美元/桶。这是布伦特原油自本轮冲突爆发以来首次突破11 nion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 30, "title_zh": "AI IPO 浪潮是互联网泡沫的邪恶双胞胎。Anthropic 的推迟恰好证明了这一点。", "desc_zh": "在这篇来自 Airrived 联合创始人兼 CEO Anurag Gurtu 的客座文章中，他主张，鉴于庞大的基础设施投入、安全担忧、客户集中度以及来自更廉价开放权重模型的竞争，Anthropic 的营收快速增长并不足以支撑其拟议的 2 万亿美元 IPO 估值；他认为，持久的企业 AI 价值将来自专有数据、可靠的部署。"}, {"title": "Is Anyone Enforcing the Cartel? What Reinforcement Learning Teaches LLM Agents in Markets", "url": "https://arxiv.org/abs/2610.28787", "date": "Thu, 22 Oct 2026 00:00:00 -0400", "desc": "arXiv:2610.28787v1 Announce Type: new Abstract: Evaluations of large language model (LLM) agents report that pricing agents collude at others' expense. Yet collusion is defined by enforcement: a cartel, in which competitors share monopoly profits, holds only if a member who cheats is punished. We introduce an audit that tests enforcement by forcing a member to cheat in counterfactual copies of a m", "tags": ["AI", "资本市场", "个人成长"], "topic_score": 11, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1792641600.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27, "title_zh": "有人在执行卡特尔吗？强化学习在市场中教给 LLM 智能体的东西", "desc_zh": "arXiv:2610.28787v1 公告类型：新论文 摘要：对大语言模型（LLM）智能体的评估报告称，定价智能体会以他人利益为代价进行合谋。然而，合谋由执行来定义：竞争者共享垄断利润的卡特尔，只有在作弊成员受到惩罚时才能维持。我们引入一种审计方法，通过在市场的反事实副本中强制一名成员作弊，以此测试执行情况。"}, {"title": "Anthropic IPO to Drive Blockbuster Gains for Iconiq, Spark, GIC", "url": "https://www.bloomberg.com/news/articles/2026-10-22/anthropic-ipo-to-drive-blockbuster-gains-for-iconiq-spark-gic", "date": "Thu, 22 Oct 2026 19:34:03 GMT", "desc": "By the time Iconiq made its first investment in Anthropic PBC in 2025, the artificial intelligence developer was valued at $183 billion — more than almost any other tech startup in the world — and well on its way to becoming an AI juggernaut. Yet even Iconiq’s later stage bet is now set to bring in massive returns as Anthropic nears its Wall Street debut.The investment firm, which has pumpe const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
