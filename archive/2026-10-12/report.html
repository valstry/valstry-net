", "cat": "中文商业媒体", "weight": 4, "ts": 1791761504.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "现房销售正以“确定性”提振楼市信心。近期，北京、上海、广州、武汉相继发布商品房销售制度改革实施细则，与国家层面鼓励现房销售的导向形成呼应。长期以来，我...", "url": "https://www.huxiu.com/moment/1287360.html", "date": "Sun, 11 Oct 2026 23:31:11 GMT", "desc": "现房销售正以“确定性”提振楼市信心。 近期，北京、上海、广州、武汉相继发布商品房销售制度改革实施细则，与国家层面鼓励现房销售的导向形成呼应。长期以来，我国商品房销售以预售制为主。这一制度诞生于住房市场化改革的初期，彼时房企普遍体量偏小、筹资渠道有限，难以独立扛起长周期、高投入的项目建设压力，“先收款、后交房”的安排由此成为主流，并在相当长时间里支撑了房地产市场在供应端的快速扩容。然而，当行业告别高速扩张、转入深度调整，预售制的弊端也随之暴露：虚假宣传、“货不对板”、逾期交房乃至项目烂尾等风险反复出现，削弱了消费者的信任，也让楼市调整期的观望情绪持续累积。预售制有其历史合理性，但合理并不意味着恒久适用。随着我国房地产市场供求关系发生重大变化，靠放宽购房准入门槛、下调房贷利率、发放购房补贴等需求端政策，仅能降低购房交易成本，难以根除购房者“交了钱收不了房”的忧虑。 现房销售制度正是直击这一痛点", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1791761471.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "汽车行业监管再升级，车企迅速掀起学习、自查热潮。直击“速成造车”的痛点，汽车行业监管再升级。10月10日，工业和信息化部等四部门联合公开发布《关于进一步加...", "url": "https://www.huxiu.com/moment/1287359.html", "date": "Sun, 11 Oct 2026 23:24:09 GMT", "desc": "汽车行业监管再升级，车企迅速掀起学习、自查热潮。 直击“速成造车”的痛点，汽车行业监管再升级。10月10日，工业和信息化部等四部门联合公开发布《关于进一步加强汽车产品创新设计和研发测试验证有关管理工作的通知（征求意见稿）》（以下简称《征求意见稿》），对汽车制动系统等关键结构件、可靠性与耐久性验证以及隐藏式门把手、零重力座椅创新设计等提出了要求。记者了解到，《征求意见稿》发布后，整车企业迅速掀起学习、自查热潮。 多家车企相关负责人告诉记者，周末期间就对《征求意见稿》组织开展了学习，后续将在全公司范围传达；还有一些车企向记者确认，地方相关部门也在组织学习和落实。受访企业和专家普遍认为，此次监管精准纠偏行业“重创新噱头、轻安全验证”的伪创新乱象，倒逼产业告别快消式造车逻辑，全面开启从抢快迭代到深耕品质、稳质长跑的全新发展阶段。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1791761049.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "@kellylynnedang: They didn’t just lose bots. Its banks. Tomorrow, whatever dark ass money was stored in those servers is gone too. I’m talking crypt...", "url": "https://www.threads.com/t/DeX1GORiGXa", "date": "Sun, 11 Oct 2026 23:23:01 GMT", "desc": "@kellylynnedang : They didn’t just lose bots. Its banks. T 行业的利润版图。美光科技在截至9月30日的第四财季录得净利润377亿美元，而苹果同期净利润为298亿美元——美光单季多赚了约80亿美元。 这一反转并非偶然。市场策略师Charlie Bilello在X平台上用三句话概括了这一逻辑： “苹果需要芯片。美光有芯片。美光定价格。” 他补充道，美光净利润“在短短两年内飙升42倍至380亿美元——比苹果上季度的盈利还多80亿美元”，并直言：“我们从未见过这样的定价权。” 科技投资分析师Beth Kindig也在X平台上指出：“美光现在产生的营业利润已经超过苹果。” 美光的数字：从亏损边缘到碾压苹果 美光的盈利反转速度令人咋舌。 2024财年，美光每股标准化盈利仅为1.30美元。到2026财年，这一数字跳升至75.52美元。覆盖2027财年的35位分析师预计，届时每股盈利将达176.15美元——意味着盈利将在一年内再度翻倍以上。", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791712743.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "全球经济的“风暴眼”：发达国家“债务危机”", "url": "https://wallstreetcn.com/articles/3783373", "date": "Sun, 11 Oct 2026 17:15:00 +0800", "desc": "发达国家正从全球金融体系的稳定锚，转变为新的风险源。在能源价格飙升、利率持续走高的背景下，美国、欧洲和日本的债务可持续性问题日益突出。曾被视为全球金融市场安全底座的发达经济体，如今自身的财政状况正成为投资者无法忽视的隐忧。 国际货币基金组织（IMF）总裁Kristalina Georgieva近日发出警告， 称发达经济体已成为债务问题上最严重的违规者。随着政府偿债利息不断攀升，财政空间被进一步挤压，各国为民众提供生活成本支持的能力也将受到限制 。 “我们应该为人们变得更加不满做好准备，”她表示，“也许会走上街头。”这番表态正值IMF与世界银行年会召开前夕，会议举办地泰国曾是近三十年前亚洲金融危机的起点。 美银证券进一步指出， 美国和法国正面临债务高企、融资成本上升与财政调整受阻的多重压力。两国在低利率时期积累了高额债务，却难以在融资环境收紧后削减支出。美国的压力主要来自税收收入回落，法国则", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791710100.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "马斯克放话：虽然现在还不懂造芯片，但Terrafab未来要造出“比任何人都更好的芯片”", "url": "https://wallstreetcn.com/articles/3783367", "date": "Sun, 11 Oct 2026 16:17:38 +0800", "desc": "马斯克宣称，凭借旗下公司在定制化设备制造领域积累的深厚经验，他有信心在芯片制造领域后来居上，超越所有竞争对手。这一表态，为其正在推进的Terrafab芯片工厂项目再度注入强烈的市场关注。 马斯克于当地时间周六通过直播形式出席在德克萨斯州奥斯汀特斯拉超级工厂外举办的\"X Takeover\"活动，面向客户与投资者发表上述言论。 他坦承目前\"完全不知道如何制造微芯片\"，但同时表示\"我们会搞清楚的\"，并预计旗下公司最终将在芯片制造上超越所有人，尽管\"可能需要相当多年时间\"。 这番表态的背景是，马斯克正筹备在德克萨斯州格莱姆斯（Grimes）建设Terrafab芯片工厂，该项目由特斯拉、SpaceX与英特尔组成合资企业共同推进，初始投资规模逾150亿美元。 定制化能力是核心底气 马斯克在活动上解释了其信心来源。他表示，在参观竞争对手的芯片制造设施时，并未看到太多定制化设备，而这恰恰是其旗下公司的强项", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791706658.0, "opinion": false t": "中文科技财经", "weight": 4, "ts": 0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": true, "rank": 22}, {"title": "Show HN: Tracon (air traffic control for subagents)", "url": "https://github.com/phalladar/tracon", "date": "Sun, 11 Oct 2026 19:35:33 +0000", "desc": "My Claude Code workflow usually involves... a lot of subagents. I make one Opus model coordinate work as my tech lead, it dispatches subagents using models appropriate for the task into their own git worktrees, and then I try to multitask and do something else while they run. I'd been finding lately (particularly with Opus 5.5) that there was a ton of drift and instances of subagents not doing any", "tags": ["AI"], "topic_score": 4, "source": "HN Show HN", "cat": "AI实战_创作者", "weight": 5, "ts": 1791747333.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 31, "title_zh": "Show HN：Tracon（子 agent 的空中交通管制）", "desc_zh": "我的 Claude Code 工作流通常涉及……大量子 agent。我用一个 Opus 模型作为技术主管协调工作，它根据任务把子 agent 派发到各自的 git worktree 中，使用合适的模型，然后我一边多任务处理做点别的事，一边等它们运行。我最近发现（尤其是用 Opus 5.5 时）出现了大量漂移，还有子 agent 什么都没做的情况"}, {"title": "微软CEO呼吁对高级AI设置“紧急制动”系统。据彭博社10月11日报道，微软公司首席执行官Satya Nadella表示，应该将强大的人工智能模型视为潜在的内部威胁，并创建...", "url": "https://www.huxiu.com/moment/1287355.html", "date": "Sun, 11 Oct 2026 23:12:27 GMT", "desc": "微软CEO呼吁对高级AI设置“紧急制动”系统。 据彭博社10月11日报道，微软公司首席执行官Satya Nadella表示，应该将强大的人工智能模型视为潜在的内部威胁，并创建一个“紧急制动”系统，以防止模型失控。Nadella认为，那些部署先进人工智能的人不应该仅依赖制造商的保证。9月14日，微软人工智能研究人员发布了一系列指导原则，限制了该公司最先进模型的开发。此前，业界领袖呼吁放慢前沿模型的开发速度，并将重点放在安全性上。 Nadella提出的安全建议包括：不要依赖单一人工智能模型做出关键决策；保留人工智能代理行为的防篡改记录；对人工智能系统进行独立审计等。他还呼吁披露重大人工智能故障或安全漏洞，并要求企业分享故障详情，以便其他企业能够加强安全防护措施。", "tags": ["AI"], "topic_score": 5, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1791760347.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 30}, {"title": "被字节开除实习生创业获2亿美元估值", "url": "https://www.baidu.com/s?wd=%E8%A2%AB%E5%AD%97%E8%8A%82%E5%BC%80%E9%99%A4%E5%AE%9E%E4%B9%A0%E7%94%9F%E const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
