I"], "topic_score": 6, "source": "arXiv cs.AI", "cat": "AI技术前沿", "weight": 3, "ts": 1790913600.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27}, {"title": "刚刚，GPT-6 Astra破解拿破仑百年悬案", "url": "https://www.36kr.com/p/4007160336027525", "date": "Fri, 02 Oct 2026 01:31:27 GMT", "desc": "就在刚刚，GPT-6 Astra破解了一封217年的拿破仑密信，全网震惊了。 1809年，拿破仑的一封绝密信件被送往亚得里亚海对岸。 217年来，这封信成了密码学界的一桩无头悬案。它全篇由1300个如同鬼画符般的手绘符号组成，常年霸占着权威密码网站Cryptiana的「未解悬案榜单」，全球顶尖的密码学专家都感叹：「无从下手」。 在这张1202 × 1836像素的图片上，平均每个密码符号仅仅占据可怜的19个像素 直到上周，一位不懂密码学的AI工程师，随手丢给 GPT-6 Astra 一张模糊的黑白图片和一句提示词。 仅仅6个小时后，这封密信被破解了！ 拿破仑当年的排兵布阵图重见天日，连他回忆录中被「和谐」打码、中断了整整160年的半句御旨，也被AI一字不差地「补」齐了。 Astra强大的多模态能力和长程自主规划面前，人类发掘隐秘知识的壁垒，已经被彻底摧毁。 沉睡217年的死局：一张模糊的图与", "tags": ["AI"], "topic_score": 3, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1790904687.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27}, {"title": "In the past 6 months... - Muse Spark - Muse Image - Muse Video - Muse Spark 1.1 - Meta Model API - Muse Glimmer - Muse Spark 1.2 - Muse Code - Muse Sp...", "url": "https://x.com/AIatMeta/status/2104579386024603826", "date": "Mon, 28 Sep 2026 14:30:01 GMT", "desc": "In the past 6 months... - Muse Spark - Muse Image - Muse Video - Muse Spark 1.1 - Meta Model API - Muse Glimmer - Muse Spark 1.2 - Muse Code - Muse Spark 1.3 - Muse ...and we’re just getting started. 🚀", "tags": [], "topic_score": 0, "source": "X-MetaAI", "cat": "AI厂商官方", "weight": 5, "ts": 1790605801.0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 27}, {"title": "AI-powered fuzzing with the GitHub Security Lab Taskflow Agent", "url": "https://github.blog/security/application-security/ai-powered-fuzzing-with-the-github-security-lab-taskflow-agent/", "date": "Thu, 24 Sep 2026 18:26:12 +0000", "desc": "In this blog post, I explain how to use the new fuzzing taskflow based on the GitHub Security Lab Taskflow Agent AI framework. The post AI-powered fuzz 过上了黄金周", "url": "https://www.36kr.com/p/4008277186285446", "date": "Fri, 02 Oct 2026 05:32:28 GMT", "desc": "每逢国庆，中国人.zip自动解压，全世界都知道我们放长假了。 不仅是国外的热门旅游目的地，国外的小众景点、犄角旮旯，也会冒出大量中国游客，印证了那句话：中国人能飞。 有人分享：“我记得我来的是瑞士啊，怎么周围全是普通话、四川话、东北话……” 机场里也乌泱泱的全是准备出国游的中国人，许多人拍下这幕，配文“这是要去攻打XXX吗？” 还有人在意大利拍了一段视频，满屏都是滑翔伞，评论区的许多网友也都下意识地认为：这个时间点，天上飞的应该都是中国人。 中国游客像蒲公英一样在全球散开，老外们也享福过上了黄金周。 很早以前，中国游客是“人见人嫌”，给人的印象是说话大声、爱插队、没素质。 如今风向变了，中国游客是“人见人抢”。 2025年9月底，韩国对中国3人以上的团队游客试行免签，一放就是大半年。为了接人，仁川机场一口气加了120个中文标识，首尔地铁全线开通支付宝购票，连路边小吃摊都挂上了中文菜单。 泰", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1790919148.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "超长13天：游客挤景区，景区挤港交所", "url": "https://www.36kr.com/p/4008237864374406", "date": "Fri, 02 Oct 2026 04:50:23 GMT", "desc": "9月25日，中秋假期第一天。去哪儿旅行的研究员注意到，这个假期有超过两成游客只订了去程，走到哪儿算哪儿。 敢这么安排，是因为日历给了底气：中秋和国庆之间只隔着三个工作日，请3天年假就能连休13天，这是近五年来最宽裕的一次双节窗口。“请3休13”很快在社交平台上传开，机票、酒店的预订节奏被整体往前推了一大截。 人潮涌向景区的时候，景区自己也在排另一条队。去年12月，靠一台山水实景演出起家的印象大红袍在港交所挂牌，成了港股“实景演出第一股”。今年1月，陕西旅游在上交所敲钟，这是近5年来A股首家新上市的文旅公司。此后，扬州瘦西湖、开封清明上河园陆续把招股书递到了港交所门前，8月底，复星旗下的地中海度假集团也加入进来。队伍里有国企，有民企，有景区，也有演艺和度假村，几乎覆盖了文旅行业的主要业态。 游客挤景区，景区挤港交所。一个超长黄金周，恰好把这两支队伍放进了同一个画面里，一边是看得见的客流，另一", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1790916623.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "Agent Error Dataset: Scaling 50,000 Error--Diagnosis Pairs for Failure Analysis and Error-Aware Post-Training", "url": "https://arxiv.org/abs/2609.40111", "date": "Fri, 02 Oct 2026 00:00:00 -0400", "desc": "arXiv:2609.40111v2 Announce Type: cross Abstract: An unsuccessful LLM agent rollout contains more information than its final reward: the observations available to the agent, the actions it chose, and the environment's responses. Reusing this experience for learning requires identifying a decision to revise and testing a concrete alternative. We introduce the Agent Error Dataset (AED), comprising 5", "tags": ["AI"], "topic_score": 5, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1790913600.0, "opinion": true, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "月薪两万修不起车，新能源车维修为啥这么难？", "url": "https://www.36kr.com/p/4007322594432649", "date": "Fri, 02 Oct 2026 03:52:46 GMT", "desc": "这些年，伴随着新能源汽车的快速普及，智能化的新能源汽车已经成为了不少人买车的首选，特别是最近油电同价已经成为大势所趋，更是引发了新能源车销量的大涨，但是就在新能源车日益变多的时候，新能源车买得起修不起的问题再度引发了关注，这又到底是怎么回事？ 一、月薪两万修不起车？ 据中国新闻周刊的报道，新能源汽车的新车销量如今已经超过燃油车，且差距仍在拉大，但多数车型在销售过程中，比油车省钱依然被视为核心卖点之一。 而这份基础实惠之外，随着新能源汽车销量逐年递增以及智能程度的持续提高，越来越多的车主开始抱怨其高昂的维修成本、繁琐的售后难题以及居高不下的保险费用。 日前，J.D.Power（君迪)发布《2026中国新能源汽车售后服务满意度研究》，表示国内新能源汽车销量持续走高、技术快速迭代的背后，售后体系仍存在大量亟待解决的痛点。其中最突出的一点，就是新能源车事故维修平均价格约为燃油车的1.7倍。中国汽车", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1790913166.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "这届老外：来中国扫货，顺便旅个游", "url": "https://www.36kr.com/p/4008129479315332", "date": "Fri, 02 Oct 2026 02:43:54 GMT", "desc": "中秋国庆长假期间，在国内旅行的朋友可能会发现： 身边的游客数量一点都没少，不同以往的是，人群中的外国游客越来越多了。 过境免签范围持续扩大后，国际游客正在加速进入中国。比起几年前，他们的行程变得更加具体，也更加“在地”。 国家移民管理局数据显示， 2026年1至8月，外国人出入境6128.7万人次，同比增长19.5%。其中免签入境2372万人次，同比增长26.8%，占入境外国人的77.6%。 在这股热潮中，购物，逐渐从行程的附属项变成了清晰的旅行目的： 商务部数据显示，2026年1至7月，境外人员在华消费达2636亿元，同比增长27.8%；办理离境退税的境外旅客数量同比增长超3倍；上半年，全国离境退税商品销售额同比增长69%。 据公开报道，今年9月，西班牙游客Gabriel带着一只行李箱来到中国，在游历北京、西安、成都、重庆和上海近四周后，又去买了第二只箱子，“因为我原来的箱子已经装满了。", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1790909034.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "变现门槛翻一番，YouTube的目标或是短视频", "url": "https://www.36kr.com/p/4007122846748807", "date": "Fri, 02 Oct 2026 01:16:53 GMT", "desc": "自从2023年夏季起，为了让自家广告业务重新增长，YouTube开展了打击广告屏蔽插件的工作。三年时间过去后，即便YouTube‌百般阻挠，依然挡不住用户跳过广告的热情。眼看用户不怎么买账，YouTube决定从创作者身上下手。 日前，YouTube方面宣布调整广告收益计划的门槛。从2027年2月1日起，参与YouTube 洲方面进行沟通，若欧洲释放战略储备，将产生\"巨大影响\"，并称希望\"很快\"能有相关消息。 在利率与债务问题上，哈塞特承认当前利息支出水平\"高得令人无法接受\"，但强调白宫尊重美联储独立性，特朗普总统\"认真对待削减赤字问题\"，并明确表示\"不想通过通货膨胀来摆脱债务\"。 美国劳工部周五公布数据显示 ，9月非农就业人数仅增加2.9万，远低于市场预期的9万，且低于所有预测区间下限。失业率从8月的4.1%小幅升至4.2%。 就业数据\"符合预期\" 哈塞特为最新非农数据作出积极定性", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790955312.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "Quant hedge funds reap big gains from global bond sell-off", "url": "https://www.ft.com/content/75b0ab84-a252-4ea1-9058-c9ee7ca07f4f?syn-25a6b1a6=1", "date": "Fri, 02 Oct 2026 15:13:59 GMT", "desc": "Trend-following portfolios have latched on to sharp rise in yields this year as Iran war and strong US economic data fuel inflation fears", "tags": [], "topic_score": 0, "source": "Financial Times", "cat": "金融媒体_英文", "weight": 2, "ts": 1790954039.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "G7决定释放1亿桶紧急油储，前20天先大规模投放柴油，美油一度跌超5%", "url": "https://wallstreetcn.com/articles/3782940", "date": "Fri, 02 Oct 2026 22:09:12 +0800", "desc": "在国际能源市场供应紧张、柴油价格持续高企之际，七国集团（G7）终于祭出大规模战略储备释放措施。 当地时间10月2日周五，法国总统府发布的G7领导人声明称，G7将通过国际能源署（IEA）协调释放1亿桶石油战略储备，行动将“立即”开始，并持续4个月；这期间，G7成员国及合作伙伴将在最初20天内率先大规模释放柴油储备。G7同时承诺，避免在成员国之间实施能源及能源产品出口限制，并呼吁其他产油国不要采取可能进一步加剧市场紧张的出口禁令。 以上G7决定公布后，周五美股早盘时段，国际原油期货跌幅明显扩大。周五美股早盘时段，美国WTI原油一度跌破88.10美元/桶，日内跌近5.2%；布伦特原油曾跌至98.50美元/桶下方，日内跌近3.8%。周五稍早，原油已经因为G7可能进一步释放战略储备的消息而承压下行。 前20天前置式释放柴油储备 G7各国避免能源出口限制 据法国总统府公布的G7领导人声明，此次行动的核", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790950152.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "美光首次明确2027-2028年供应更紧，四大基地同步扩产HBM", "url": "https://wallstreetcn.com/articles/3782935", "date": "Fri, 02 Oct 2026 19:48:59 +0800", "desc": "美光科技最新一季营收与利润双双超出市场预期，但比业绩本身更值得关注的是管理层对远期供需的判断： 公司首次明确，2027至2028年的HBM产能供应将比2026年更加紧张 ，并同步在中国台湾桃园、台中、铜锣、台南四大制造基地扩产 论：0"}, {"title": "Exclusive: Nvidia, SoftBank Make Final $20 Billion Investment in OpenAI’s Last Round", "url": "https://www.theinformation.com/briefings/exclusive-nvidia-softbank-make-final-20-billion-investment-openais-last-round", "date": "2026-10-02T20:26:21Z", "desc": "", "tags": ["AI"], "topic_score": 5, "source": "The Information", "cat": "金融媒体_英文", "weight": 3, "ts": 1790972781.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27, "title_zh": "独家：Nvidia、SoftBank 在 OpenAI 最后一轮融资中完成 200 亿美元投资"}, {"title": "OpenAI’s Dot agent is enterprise software that can also order your dinner", "url": "https://www.theverge.com/ai-artificial-intelligence/1004096/openai-chatgpt-dots-hands-on-agent", "date": "2026-10-02T13:56:00-04:00", "desc": "It's a tale as old as last week: OpenAI's new agent platform, called Dots, is full of cute little guys who can do your bidding. But unlike the ultra-approachable Meta Muse, Dots feel very much like using workplace software that happens to be able to order you a burrito - emphasis on work. OpenAI announced […]", "tags": ["AI"], "topic_score": 7, "source": "The Verge", "cat": "科技新闻", "weight": 3, "ts": 1790963760.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27, "title_zh": "OpenAI 的 Dot agent 是能帮你订晚餐的企业软件", "desc_zh": "这是个上周才有的老故事：OpenAI 的新 agent 平台 Dots 里全是些能听你差遣的可爱小家伙。但与极其亲民的 Meta Muse 不同，Dots 用起来很像工作软件，只是恰好能帮你订个墨西哥卷饼——重点在“工作”。OpenAI 宣布……"}, {"title": "Diagnosing Training Inference Mismatch in LLM Reinforcement Learning via a Zero-Mismatch Reference", "url": "https://arxiv.org/abs/2605.14220", "date": "Fri, 02 Oct 2026 00:00:00 -0400", "desc": "arXiv:2605.14220v2 Announce Type: replace-cross Abstract: Modern LLM RL systems separate rollout generation from policy optimization. These two stages are expected to produce token probabilities that match exactly. However, implementation differences can make them assign different values to the same sequence under the same model weights, inducing Training-Inference Mismatch (TIM). TIM is difficult", "tags": ["AI", "个人成长"], "topic_score": 8, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1790913600.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27, "title_zh": "通过零失配参考诊断 LLM 强化学习中的训练-推理失配", "desc_zh": "arXiv:2605.14220v2 公告类型：replace-cross 摘要：现代 LLM RL 系统将 rollout 生成与策略优化分离。这两个阶段本应产生完全一致的 token 概率。然而，实现差异可能使它们在相同模型权重下对同一序列赋予不同值，从而引发训练-推理失配（TIM）。TIM 很难……"}, {"title": "莫氏鸡煲总店员工从 180 人减至 30 多人，国庆假期上座率仅六成，为啥网红餐厅总难逃流量暴跌的命运？", "url": "https://www.zhihu.com/question/2089354143802418288", "desc": "2026 年 10 月 1 日中午，走进莫氏鸡煲佛山顺德陈村总店，曾经为排队顾客准备的候「鸡」亭已经撤走，其中一个遮雨棚改为了小卖部——排队已经不是这家店的常态。这一天，午市的整体上座率约六成。 从今年 4 月的爆火，到如今客流明显回落，莫叔没有丧失对鸡煲生意的信心。10 月 1 日，他告诉极目新闻记者，如今他正忙着在老家筹建新的养鸡场，保障现有门店的活鸡供应，「把质量搞好了，不怕没有生意。」 爆火半年后，莫氏鸡煲总店人员从 180 人减至 30 多人，莫叔已还清 180 多万旧债，又贷款建养鸡场", "date": "", "hot": 0, "tags": ["自媒体"], "topic_score": 2, "source": "热搜-知乎", "cat": "热点榜_发生了什么", "weight": 5, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 27}, {"title": "Federal Reserve Board announces approval of application by Fleur Capital Corporation", "url": "<![CDATA[https://www.federalreserve.gov/newsevents/pressreleases/orders20261002a.htm]]>", "date": "Fri, 2 Oct 2026 20:45:00 GMT", "desc": "Federal Reserve Board announces approval of application by Fleur Capital Corporation", "tags": ["资本市场"], "topic_score": 3, "source": "美联储 新闻稿", "cat": "宏观监管", "weight": 4, "ts": 1790973900.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26, "title_zh": "美联储理事会宣布批准 Fleur Capital Corporation 的申请", "desc_zh": "美联储理事会宣布批准 Fleur Capital Corporation 的申请"}, {"title": "Anthropic’s IPO filing maps the AI safety startup market", "url": "https://www.cbinsights.com/research/newsletter-october-1-2026/", "date": "Thu, 01 Oct 2026 22:33:58 +0000", "desc": "Anthropic’s S-1 just leaked, with ~80 pages on risk factors, i const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
