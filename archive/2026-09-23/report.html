7Z", "desc": "", "tags": [], "topic_score": 0, "source": "V2EX 最新", "cat": "AI实战_创作者", "weight": 3, "ts": 1790123427.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "广州“金融茶”爆雷两年后调查扩围 数百名核心人员及经销商被带走", "url": "https://china.caixin.com/2026-09-22/102487324.html", "date": "Wed, 23 Sep 2026 00:29:18 GMT", "desc": "多名广州芳村茶商透露，2026年以来，警方对泛茶的调查从公司核心人员逐步扩展至渠道商、经销商和“开票人员” 2026年春节过后，部分原泛茶经销网络重新组织“金融茶”交易，“炒茶”风潮又起。在4月至5月间，警方以涉嫌非法吸收公众存款罪对核心人员展开调查，此后调查拓展至渠道商、经销商和“开票人员”。制图：赵凌筠 【财新网】 泛茶“爆雷”两年后，警方对这家“金融茶”公司的调查明显扩围。 近期，多名广州芳村茶商告诉财新，2026年春节过后，部分原泛茶经销网络重新组织“金融茶”交易，“炒茶”风潮又起。在4月至5月间，警方以涉嫌非法吸收公众存款罪对核心人员展开调查，此后调查拓展至渠道商、经销商和“开票人员”，向此前参与开单、收款和资金流转的外围网络延伸。 泛茶创立于2021年，之后迅速扩张，至2024年“爆雷”前，全国经销商门店发展到近500家。在广州芳村茶叶市场，泛茶被视作最典型的“金融茶”品牌之一", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790123358.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "[程序员] claude opus 5.5 和 gpt 6 sol ,你们都用上了吗？", "url": "https://www.v2ex.com/t/1244099#reply3", "date": "2026-09-23T00:27:28Z", "desc": "", "tags": [], "topic_score": 0, "source": "V2EX 最新", "cat": "AI实战_创作者", "weight": 3, "ts": 1790123248.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "韩国前第一夫人金建希“卖官鬻爵”案二审宣判 刑期由七年减至五年", "url": "https://international.caixin.com/2026-09-22/102487606.html", "date": "Wed, 23 Sep 2026 00:25:40 GMT", "desc": "由于控辩双方均已表明上诉意向，二审判决尚未生效 资料图：当地时间2025年8月12日，韩国首尔，遭弹劾前总统尹锡悦的妻子、前第一夫人金建希抵达首尔中央地方法院。图：IC PHOTO 【财新网】 当地时间9月22日下午，韩国首尔高等法院刑事审判第15-3合议庭对韩国前总统尹锡悦的妻子金建希“卖官鬻爵”案作出二审判决，认定其违反《特定犯罪加重处罚法》、构成斡旋受贿罪，但以江诗丹顿手表和《岁寒图》复制品两项指控证据不足为由改判无罪，将刑期由一审的七年减至五年，追缴金额由6480万韩元降至2440万韩元（约合人民币12万元），并维持对李禹焕画作、梵克雅宝项链及胸针等涉案物品的没收。 “卖官鬻爵”是金建希案特检组对案件性质的概括，并非韩国刑法中的正式罪名。金建希被控的斡旋受贿罪，是指以就公务员职务事项进行斡旋为名收受财物或利益。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790123140.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "林毅夫：中国AI开源模式将缩小不同经济体收入差距", "url": "https://www.caixin.com/2026-09-22/102487667.html", "date": "Wed, 23 Sep 2026 00:25:40 GMT", "desc": "中美人工智能发展模式不同，中国是轻资产和开源权重模式，而美国则是重资产和闭源。在技术能力靠近后，开源模式将获得更大发展 2026年4月10日，广东深圳，第十四届中国电子信息博览会，人形机器人正在演示泡茶茶艺。图：IC PHOTO 【财新网】 “第一次工业革命前，收入最高的国家——荷兰的人均收入，是最贫困国家的5倍。但历经三次工业革命后，目前，最高收入国家和最低收入国家的差距可能是百倍。”9月22日，北京大学新结构经济学研究院院长 林毅夫 在英特尔技术创新与产业生态大会现场指出，被称为第四次工业革命的人工智能有可能改变发达经济体和发展中国家的收入差距，其关键在于以中国AI大模型为代表的开源权重模型，可以降低AI的技术门槛和使用成本，缩短发展中国家在产业智能化等方面追赶发达国家的时间。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790123140.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "人事观察｜西部三省份高层联动 藏、甘、青一把手到位", "url": "https://china.caixin.com/2026-09-22/102487563.html", "date": "Wed, 23 Sep 2026 00:25:40 GMT", "desc": "62岁胡昌升任西藏党委书记，60岁吴晓军任甘肃省委书记，60岁罗东川任青海省委书记，63岁王君正卸任西藏党委书记 胡昌升（左）、吴晓军（中）、罗东川（右）。 【财新网】 中共二十届五中全会前，西藏、甘肃、青海三省份党委书记联动调整。其中，甘肃省委书记 胡昌升 接替63岁的王君正，出任西藏党委书记；青海省委书记 吴晓军 转任甘肃省委书记；青海省长 罗东川 履新青海省委书记。 据新华网消息，9月22日，西藏召开领导干部会议，中组部副部长郝军辉在会上宣布了中央决定。胡昌升任西藏党委委员、常委、书记，王君正不再担任西藏党委书记、常委、委员职务。据悉，王君正因年龄原因不再担任区党委书记职务。 9月22日，甘肃省召开领导干部会议，中组部副部长齐家滨在会上宣布了中央决定。吴晓军任甘肃省委委员、常委、书记，胡昌升不再担任甘肃省委书记、常委、委员职务。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790123140.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "长生生物疫苗案二审判决 原董事长高俊芳获无期徒刑(含视频)", "url": "https://www.caixin.com/2026-09-22/102487302.html", "date": "Wed, 23 Sep 2026 00:25:40 GMT", "desc": "高俊芳四罪并罚；根据二审判决的认定，涉案的“假疫苗”，并非公众认知中的假药、劣药 资料图：高俊芳。 【财新网】 延宕八年的 长春长生生物科技有限责任公司 （下称“长生生物”）“假疫苗”案二审宣判。1954年出生的原董事长 高俊芳 被指犯有生产、销售伪劣产品罪、非国家工作人员受贿罪、挪用资金罪、单位行贿罪，四罪并罚，获无期徒刑。 这一消息由9月21日被《经济观察报》曝出后，财新经由知情人士处确认属实。 此外，高俊芳丈夫、长生生物原董事、副总经理 张友奎 及16名员工亦获刑。其中，张友奎犯挪用资金罪，被判处有期徒刑6年；长生生物原董事、副总经理 张晶 ，长生生物全资控股子公司长春长生生物科技有限责任公司（下称“长春长生”）副总经理 刘景晔 等12人，犯生产、销售伪劣产品罪，分别被判处有期徒刑15年至7年不等；长生生物原董事 赵志伟 等4名员工，犯帮助毁灭证据罪，被判处有期徒刑2年10个月至2年", "tags": [], "topic_score": 0, "so 邹迎光接棒中信证券党委书记 张佑君即将退休", "url": "https://finance.caixin.com/2026-09-22/102487642.html", "date": "Wed, 23 Sep 2026 00:19:03 GMT", "desc": "待履行上市公司相关程序后，邹迎光预计将出任中信证券董事长 资料图：邹迎光。 【财新网】 券业龙头 中信证券 （600030.SH/06030.HK）迎来高层换届。9月22日，多位接近中信证券的消息人士透露，中信证券当日内部发文官宣，该公司党委副书记、总裁 邹迎光 出任中信证券党委书记，现任党委书记 张佑君 不再担任现职。这意味着，执掌中信证券10年有余的张佑君即将卸任退休。 多位消息人士称，待履行上市公司相关程序后，邹迎光预计将出任中信证券董事长。据财新此前报道， 中信集团 在9月上旬对邹迎光进行了内部考察及公示（参见财新金融我闻9月13日报道《 中信证券董事会换届在即 一、二把手联动即将揭晓 》）", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790122743.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "高校分类发展改革启幕 能否打破“歧视链”？｜教育观察", "url": "https://www.caixin.com/2026-09-23/102487753.html", "date": "Wed, 23 Sep 2026 00:18:53 GMT", "desc": "高校的分类框架为“基本办学定位”加“基本方向”：基本办学定位分为研究型、应用型、技能型等，基本方向分为综合性和特色化。意图构建起不同高校错位发展、各展所长的新格局 武汉，一高校自习室内，大学生正在备考。图：视觉中国 【财新网】 中共中央办公厅、国务院办公厅近日印发《关于分类推进高校改革的意见》（下称“《意见》”），对分类推进高校改革作出系统部署。《意见》指出，要科学构建高校分类发展体系，区分综合性、特色化基本方向，确立高校分类框架，根据隶属关系建立多元适配的高校分类模式。 近年来，高校学科专业调整力度空前。分类推进高校改革是继高校专业调整后又一项完善人才供需适配的举措。 当前部分高校因定位模糊、盲目攀高导致资源浪费。为支持多样化人才供给，此前相关文件已多次强调分类推进高校改革，要求高校告别“千校一面”，在各自赛道上各展所长。《 教育强国建设规划纲要（2024—2035年） 》明确提出“分类", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790122733.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "最新封面报道｜济州岛迷雾", "url": "https://weekly.caixin.com/2026-09-18/102486123.html", "date": "Wed, 23 Sep 2026 00:18:53 GMT", "desc": "始于基层警务系统失职，演变为至今真相未明的传言风暴，迫使转型中的刑事司法体系作答 2026年8月24日，韩国济州，警方在济州市翰林邑水原里一处棕榈树农场发现数月前失踪的张美兰遗体，并正在进行现场勘查。图：Park Ji-ho/视觉中国 文｜财新周刊 罗子琳 发自韩国济州 济州偶来小路（Jeju Olle Trail）串联韩国济州岛的村庄、田野和海岸，是在国际游客中颇具知名度的一条长距离徒步路线。位于济州岛西北部的翰林邑水原里，是这条路线穿过的其中一处村庄。这座仅有约500户、1050名居民的小村落，如今不仅成为韩国政界争论的风暴策源地，也出现在各种语言的互联网热议中：8月24日，一名失踪已久、但被当地警方声称“已确认本人安全”的37岁女性居民张美兰，在村东南一片棕榈林中被发现，遗体已高度腐败。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790122733.0, "opinion": false, "is_hot": false, "is_vend berto Perli）表示，美联储将继续评估银行体系准备金水平，因为美联储购买美国国债短期票据（Treasury bills）的规模并非按照预设路径推进。 今年早些时候，联邦公开市场委员会（FOMC）授权纽约联储市场操作部门根据需要调整准备金管理购债规模。 佩利周二表示，这类购债目前规模为零，未来将根据“不断变化的市场状况”进行调整。 “如果未来有需要，我们随时准备再次调整购债规模，以落实FOMC将准备金维持在充裕区间的政策。” 他补充称，纽约联储将密切关注高级金融官员对市场状况的判断，以及融资市场出现压力的其他迹象。佩利表示： “如果正如市场观察人士所预期的那样，10月将出现新一轮大规模国债短期票据净发行，我们将密切关注市场对此的反应。” 本月早些时候，美联储官员宣布，在10月中旬之前不会出于准备金管理目的购买美国国债短期票据，实际上延长了8月开始", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790117866.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 14}, {"title": "Aldi US COO: Americans Are Feeling Inflation Pressures", "url": "https://www.bloomberg.com/news/videos/2026-09-22/aldi-us-coo-americans-are-feeling-inflation-pressures-video", "date": "Tue, 22 Sep 2026 22:35:59 GMT", "desc": "Dave Rinaldo, Aldi US Chief Operating Officer, joins Bloomberg's Romaine Bostick to breakdown shopping trends he's seeing in the US consumer, the grocer's plan to open 180 stores by year-end and its new digital strategy. (Source: Bloomberg)", "tags": [], "topic_score": 0, "source": "Bloomberg Technology", "cat": "金融媒体_英文", "weight": 2, "ts": 1790116559.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 14}, {"title": "Whole Foods CEO: Customers Are Making More Trips", "url": "https://www.bloomberg.com/news/videos/2026-09-22/whole-foods-ceo-customers-are-making-more-trips-video", "date": "Tue, 22 Sep 2026 22:33:01 GMT", "desc": "Whole Foods CEO Jason Buechel came into the studio to speak with Bloomberg's Romaine Bostick about Amazon's approach to affordability, how customer's are changing shopping habits amid rising costs and how the healthy grocery competition has changed. (Source: Bloomberg)", "tags": [], "topic_score": 0, "source": "Bloomberg Technology", "cat": "金融媒体_英文", "weight": 2, "ts": 1790116381.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 14}, {"title": "沙特7月原油出口升至四个月高位，俄罗斯9月海运原油出  false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 13}, {"title": "Learning from Founders", "url": "http://www.paulgraham.com/foundersatwork.html", "date": "", "desc": "", "tags": ["个人成长"], "topic_score": 2, "source": "Paul Graham 文集", "cat": "AI实战_创作者", "weight": 3, "ts": 0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 13}, {"title": "The Power of the Marginal", "url": "http://www.paulgraham.com/marginal.html", "date": "", "desc": "", "tags": ["商业认知"], "topic_score": 2, "source": "Paul Graham 文集", "cat": "AI实战_创作者", "weight": 3, "ts": 0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 13}, {"title": "美联储“三把手”：美债集中清算进展领先预期，充裕储备金框架行之有效", "url": "https://wallstreetcn.com/articles/3782315", "date": "Wed, 23 Sep 2026 02:01:24 +0800", "desc": "美联储纽约联储行长John Williams表示，美国国债及国债回购协议的集中清算推进进度已超出预期，并重申当前充裕储备金框架的有效性。 Williams在最新讲话中指出， 行业已开始提前扩建已清算回购和现金交易基础设施，交易活动正在从非清算市场向清算市场转移，整体进度领先于监管截止时限。 这一进展意味着美国国债市场的结构性改革正在加速落地。 与此同时， Williams重申，美联储当前维持\"充裕\"银行储备金水平的运营框架已被证明\"高度有效\" ，能够确保市场利率稳定处于联邦基金目标利率区间之内，并支持金融市场正常运转。 上周，美联储官员一致投票决定加息25个基点，为2023年以来首次加息，且最新经济预测显示多数官员支持今年至少再加息一次。 Williams本次讲话未就货币政策立场作出评论。 集中清算提前推进，国债市场结构加速重塑 根据监管要求，符合条件的美国国债二级市场交易、回购及逆回购协", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790100084.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "大摩详解“AI时代的广告业”：从注意力争夺到交易闭环", "url": "https://wallstreetcn.com/articles/3782314", "date": "Wed, 23 Sep 2026 00:52:15 +0800", "desc": "AI正在重塑中国互联网广告的预算流向，但至少在2030年前，它更像是一场存量市场的重新分配，而非新的广告增量周期。 摩根士丹利亚洲团队9月发布的中国互联网行业深度研究显示，在已使用或计划采用AI的广告主中，72%表示广告总预算没有变化，74%认为跨平台广告支出正在进一步集中。在总预算增长有限的情况下，AI首先改变的是广告预算的配置方式。 这一趋势已经体现在广告主的实际应用中。2025年，74%的受访广告主使用AI进行内容生成，62%用于广告活动管理，而商品Feed/目录优化、生成式引擎优化的渗透率分别仅为9%和5%。 当前AI对广告行业的主要作用仍是提升效率，而不是创造新的广告入口。 随着AI从内容生成、投放优化进一步走向Agent，广告平台的竞争也将逐渐延伸至用户决策和交易环节。 对于互联网平台而言，真正值得关注的不是AI本身带来多少新增预算，而是谁能够借助AI获得更多存量预算，并进一步", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790095935.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "特朗普联大讲话：美国中选后或与伊朗达成协议、油价或大跌，对AI“只鼓励、不限制”", "url": "https://wallstreetcn.com/articles/3782313", "date": "Tue, 22 Sep 2026 23:16:50 +0800", "desc": "美东时间22日周二，美国总统特朗普在联合国大会发表讲话时重申他本月稍早的预测：美国将在11月中期选举后与伊朗达成协议，还预计，若伊朗冲突结束，油价将大跌，甚至可能跌至冲突前水平以下。同时，特朗普在人工智能（AI）问题上明确表示，美国将“只鼓励超级智能”，而不是限制其发展。 据新华社，特朗普9月9日说，他认为美国同伊朗的战事将在11月美国国会中期选举完成后“立即结束”；9月13日特朗普又称，伊朗战事将在11月美国国会中期选举后立即结束，届时“汽油价格将会快速下跌”。 本周二，特朗普再次提到美国中选后结束伊朗战事的说法。据新华社，22日第81届联合国大会一般性辩论在纽约联合国总部开幕当天，特朗普在讲话中称可迅速“摧毁”伊朗，但不排除双方在11月美国国会中期选举后达成结束冲突协议的可能性。 新华社提到，特朗普讲话大篇幅聚焦其中东政策。他为美国与以色列2月底联合对伊朗发动袭击进行辩护，称绝不会允许", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790090210.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "理想高管回应自研电池七大疑问", "url": "https://wallstreetcn.com/articles/3782310", "date": "Tue, 22 Sep 2026 21:36:45 +0800", "desc": "作者 | 周智宇 从宁德时代转向自研，近期理想的电池切换引发市场关注。 i9、MEGA等车型陆续公布电池切换安排，部分用户仍然倾向选择宁德时代电池。理想自研电池的性能和质量能否达到同等水平，为何有这次切换，以及一家车企如何与专业电池厂竞争，成为外界追问的重点。 9月21日，理想汽车联合创始人、总裁兼总工程师马东辉等高管，在一场与华尔街见闻等媒体的交流中，对这些问题作出集中回应。 “不是备份方案。”马东辉明确表示，从全新一代理想L8开始，理想正在推进新产品搭载自研电池，这一战略方向已经确定。 理想汽车整车电动研发高级副总裁、山东理想汽车电池有限公司董事长刘立国表示，理想此前自研定义、由欣旺达代工的电池产品，售后质量表现不弱于任何一家电池供应商的产品；但在固态电池等前沿技术的研发能力上，理想与宁德时代仍有较大差距。 从自研的必要性、技术水平和成本，到用户对电池品牌的信任，以及与供应商的合作边界", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790084205.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "高域与敦煌共建低空交旅融合枢纽，飞行汽车瞄准景区组网", "url": "https://wallstreetcn.com/articles/3782307", "date": "Tue, 22 Sep 2026 21:12:47 +0800", "desc": "9月22日上午，GOVY AirCab在敦煌会展中心南侧广场缓缓升空，在30至50米高度完成环绕飞行和定点悬停。戈壁、晨光与飞行器同框，成为广东高域科技有限公司（下称“高域”）与敦煌市签署低空交旅融合枢纽示范项目协议后的首个公开场景。 高域是广汽集团孵化的低空出行科技企业，目前布局飞行器研发、制造与运营。 一场飞行演示的意义，不止于展示飞行器能飞。对于高域而言，敦煌项目已经在回答更具体的商业问题：飞行汽车进入文旅目的地后，如何从单次体验延伸为连接景区、文化内容与消费服务的运营体系。 敦煌的条件提供了这一探索的起点。当地的鸣沙山月牙泉、雅丹地质公园、阳关玉门关等景区各具特色，也分布在较大的空间范围内。游客能够在地面欣赏景观，景区之间的移动时间则为低空接驳提供了应用空间。 广汽高域副总经理葛晶对华尔街见闻表示，敦煌拥有世界级文旅资源、较好的空域条件、来自全球的游客基础，以及地方政府对低空经济的", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790082767.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "“我们无路可退”！中东冲击波蔓延，特朗普农村中选基本盘正在“崩塌”", "url": "https://wallstreetcn.com/articles/3782306", "date": "Tue, 22 Sep 2026 21:04:56 +0800", "desc": "美国对伊朗战争已持续近七个月，其经济冲击波正以前所未有的烈度席卷美国农业腹地。柴油价格飙升、关税推高农资成本、出口市场陷入僵局，三重压力叠加之下，曾是特朗普最坚实票仓的农民群体正走向崩溃边缘。 全美柴油均价本周触及每加仑6.49美元，较一年前暴涨约75%，据AAA数据显示，北卡罗来纳州周四更创下每加仑6.19美元的历史纪录。 北卡农民Matt Bell告诉CBS新闻，他原本为2026年预算的3.5万美元燃油开支，在8月便已告罄，全年实际支出预计将达5万至6万美元。 \"每一台设备都烧柴油，\"他说，\"我们已经无路可退。\" 这一群体的愤怒正在转化为政治信号。多位受访农民表示，他们曾多次投票支持特朗普，但如今正重新考量选票归属 。农民John Boyd Jr.对CNN表示， 全美目前已有逾400宗农场止赎案悬而未决，\"这是农民的破产危机\"。随着中期选举临近，共和党在农村地区的支持热情出现明显下滑。", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790082296.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "Andreessen Horowitz Launches AI School as a College Alternative", "url": "https://www.bloomberg.com/news/articles/2026-09-22/andreessen-horowitz-launches-ai-school-as-a-college-alternative", "date": "Tue, 22 Sep 2026 13:00:29 GMT", "desc": "Venture capital firm Andreessen Horowitz is launching a new program aimed at recent high school graduates and college dropouts that will identify and train young talent building artificial intelligence products.", "tags": [], "topic_score": 0, "source": "Bloomberg Technology", "cat": "金融媒体_英文", "weight": 2, "ts": 1790082029.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "沙特东西输油管道传重启信号，延布港最快本周恢复原油出口", "url": "https://wallstreetcn.com/articles/3782302", "date": "Tue, 22 Sep 2026 19:14:06 +0800", "desc": "沙特阿拉伯东西输油管道的重启信号，叠加伊朗总统赴联合国大会释放的外 const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
