: "Anthropic wants to have it both ways. With its impending IPO, it wants to tap the vast riches of the public markets and insists it doesn't want to compromise its core mission of developing AI safely and for the benefit of humanity. But greater model capabilities bring greater risks, and shareholders eager for returns may […]", "tags": ["AI", "资本市场"], "topic_score": 6, "source": "The Verge", "cat": "科技新闻", "weight": 3, "ts": 1793120670.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27, "title_zh": "Anthropic 与华尔街保持距离的周密计划", "desc_zh": "Anthropic 想两全其美。随着 IPO 临近，它既想获取公开市场的巨额财富，又坚称不愿牺牲其安全开发 AI、造福人类的核心使命。但更强的模型能力带来更大风险，而渴望回报的股东可能 […]"}, {"title": "杨振宁当年的遗憾，被OpenAI补上了?", "url": "https://www.36kr.com/p/4043775631381385", "date": "Tue, 27 Oct 2026 09:28:26 GMT", "desc": "2019年3月21日，《国家科学评论》（NSR）执行主编、神经生物学家蒲慕明和斯坦福大学的加速器物理学家赵午，到清华找杨振宁聊天。 他们聊到了1954年那篇论文，96岁的杨振宁回忆称，他和米尔斯算出了一个极其好看的结果，但里面有个硬伤，如果按照他们的理论，世界上应该存在一种“有电荷却没有质量”的粒子，可自然界根本没有这样的东西。 当时他们纠结了很久，最后还是决定发表。 杨振宁的第一个理由是“它（杨-米尔斯场论）真的是非常非常漂亮”（because it was very very beautiful），第二个理由是“场论也还没有得到数学上的精确描述。场论被发散困难所困扰，但是这并没有阻止它在重整化方案中获得神奇的成功。所以，场论有可能在将来解决我们遇到的问题。” 说完这句，他又补了一句：“而泡利的选择是不发表。” 泡利是量子力学的主要奠基人之一，不相容原理和中微子都出自他手，1945年拿了", "tags": ["AI"], "topic_score": 3, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1793093306.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27}, {"title": "Continual Learning Exam: Benchmarking Long-Horizon RSI and Experiential Learning in LLM Agents", "url": "https://arxiv.org/abs/2610.33956", "date": "Tue, 27 Oct 2026 00:00:00 -0400", "desc": "arXiv:2610.33956v1 Announce Type: cross Abstract: Continual learning is the ability of LLM agents to improve over time by acquiring, refining, and applying knowledge from experience while retaining useful prior knowledge. It is essential for agents learning over long time horizons, yet current evaluations largely assess individual task performance rather than improvement throu nion": true, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "[推广] 想体验更稳定的 AI 接口？ DeepSeek 限时免费蹬", "url": "https://www.v2ex.com/t/1252350#reply2", "date": "2026-10-27T15:10:03Z", "desc": "", "tags": ["AI"], "topic_score": 3, "source": "V2EX 最新", "cat": "AI实战_创作者", "weight": 3, "ts": 1793113803.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "10-K - Simply Good Foods Co (0001702744) (Filer)", "url": "https://www.sec.gov/Archives/edgar/data/1702744/000170274426000031/0001702744-26-000031-index.htm", "date": "2026-10-27T08:35:33-04:00", "desc": "Filed: 2026-10-27 AccNo: 0001702744-26-000031 Size: 12 MB", "tags": [], "topic_score": 0, "source": "SEC 最新 10-K 年报", "cat": "企业行为_美股披露", "weight": 5, "ts": 1793104533.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "Crunchbase Data Shows Q3 Robotics Startup Funding Jumps 185% As US And China Lead Physical AI Push", "url": "https://news.crunchbase.com/venture/q3-2026-us-china-robotics-startup-funding-jumps-physical-ai-push/", "date": "Tue, 27 Oct 2026 11:00:53 +0000", "desc": "Venture funding to robotics startups has soared in 2026, with the bulk of investment going to companies based in China and the U.S., Crunchbase data shows. All told, global venture funding to robotics startups totaled $9.9 billion in Q3, more than double the $4.3 billion invested in Q3 2025, per Crunchbase data.", "tags": [], "topic_score": 0, "source": "Crunchbase 融资板块", "cat": "创投行业分析", "weight": 5, "ts": 1793098853.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21, "title_zh": "Crunchbase 数据显示，Q3 机器人初创企业融资激增 185%，美国和中国引领物理 AI 推进", "desc_zh": "Crunchbase 数据显示，2026 年机器人初创企业的风险投资大幅飙升，大部分资金流向中国和美国的公司。总体而言，根据 Crunchbase 数据，Q3 全球机器人初创企业风险投资总额达 99 亿美元，是 2025 年 Q3 43 亿美元投资额的两倍多。"}, {"title": "王的猜想，被AI一夜通关", "url": "https://www.36kr.com/p/4043601956033414", "date": "Tue, 27 Oct 2026 05:59:38 GMT", "desc": "困扰人类几十年的世界级难题，AI 只用几天就交卷了。 就在刚刚，OpenAI 宣布其模型一次性带来三项突破：推翻了计算机科学界坚信近 30 年的指数时间假设；证明了所有维度的局部平滑化猜想；为量子色动力学和杨-米尔斯理论构造了严格的数学存在性证明。 OpenAI 宣告，顺着数学推导链条往回推，这意味着卡凯亚猜想（又名挂谷猜想）在所有维度宣告破解。 而 2025 年初，中国数学家王虹刚刚因为证明三维卡凯亚猜想（即三维挂谷猜想）震惊世界。仅仅一年半的时间，人类引以为傲的突破就成了 AI 成果的一个特例。 更有趣的是，OpenAI 请来了当年提出 ETH 假设的科学家本人，来审查 AI 对自己假设的反证；又请来诺贝尔物理学奖得主领衔的团队，来消化 AI 写出的千禧年难题证明。 科学家们花了半辈子没找到答案的问题，AI 几天就生成了解答。数学家们接下来的工作，不再是寻找证明，而是验证 AI 的证明", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1793080778.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "Why Are Some Emotions Harder for LLMs? Uncovering the Causal Mechanisms of Emotion Inference via Sparse Autoencoders", "url": "https://arxiv.org/abs/2604.25866", "date": "Tue, 27 Oct 2026 00:00:00 -0400", "desc": "arXiv:2604.25866v3 Announce Type: replace Abstract: Large language models (LLMs) are increasingly used in emotionally sensitive human-AI applications, where reliable emotion detection is essential. However, their emotion recognition abilities remain uneven: models often perform well on some emotions while consistently struggling with others. Although recent work has explored emotion mechanisms in ", "tags": ["AI"], "topic_score": 5, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1793073600.0, "opinion": true, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "iPhone Duo适配大翻车？实测对比小米、华为，结果有点意外", "url": "https://www.36kr.com/p/4042687208232833", "date": "Tue, 27 Oct 2026 03:41:35 GMT", "desc": "作为苹果首台折叠屏手机，iPhone Duo的热度大家这几天应该也见到了。 不过，随着iPhone Duo正式开售，大家的关注点也逐渐从硬件配置转向了软件体验。尤其是各种让人「瞠目结舌」的应用适配问题，更是在网上引发了不少争议：从微信界面出现黑边，到部分第三方应用无法充分利用大屏空间，甚至一些系统自带应用也存在适配问题，这些问题也让不少用户开始怀疑，苹果是不是还没做好进入折叠屏市场的准备。 毕竟应用适配一直是折叠屏手机绕不开的问题。相比刚刚入局的苹果，已经在这个市场摸索多年的华为和小米，实际表现又能好到哪里去？ （图片来源：雷科技摄制） 这一次，小雷就找来了iPhone Duo、小米18 Fold和华为Pura X Max三款阔折叠手机，从日常应用适配、系统交互以及多任务操作几个方面进行对比，看看三款手机的大屏体验究竟有多大差距。 都是阔折叠，果米华的交互逻辑截然不同 虽然三款手机都采用了", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1793072495.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "羽绒服的第三次进化：从卷参数到系统性保暖，千亿赛道换了考题", "url": "https://www.36kr.com/p/4042466610254729", "date": "Tue, 27 Oct 2026 02:13:30 GMT", "desc": "十月的第一场秋雨落下，把北京提前拽入初冬。此时，都市通勤者正在陷入一场无声的妥协：要么选择保暖力强但身形臃肿、远看像个“米其林轮胎”的高充绒量羽绒服，为此牺牲所有的利落版型与穿着体面；要么为了都市通勤的轻便，买一件看起来比较利落的轻便羽绒服，结果在早晚高峰的降温和冷风中瑟瑟发抖。 这并非消费者的挑剔，而是行业供给长期停留在一个粗糙的妥协里。过去几年，保暖服饰赛道陷入了一场“参数战”的竞赛：大家比拼谁的绒子含量更高、谁的充绒克数更大。 然而，很少有人去审视一个反物理的残酷真相：羽绒是极好的保温材料，但本身存在流动性强、支撑性弱的固有缺陷。当羽绒服遭遇背包带的挤压、久坐的挤压、或者肢体大幅度拉伸时，羽绒会被压扁或者移位，局部保暖性失效，隐性失温随即发生。 这意味着，即使吊牌上的数字再高，也无法为一个被背包压实后局部失温的肩部保暖。 当消费端对“既扛得住低温、又不肯穿得臃肿”的需求达到顶峰，羽绒", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1793067210.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "一杯10元无限续，日营收2万+，全国都在复制这种茶馆", "url": "https://www.36kr.com/p/4043390865822850", "date": "Tue, 27 Oct 2026 01:47:09 GMT", "desc": "新中式茶馆风潮之后，一种“10元茶馆”模式正在全国遍地开花。 10元一杯茶，茶水无限续，茶点个位数，坐上一整天也不会有人催。这种看起来很难赚钱的模式，却有品牌做到了日入2万+，并复制出多家门店。 “10元茶馆”到底能不能赚钱？我和几位从业者聊了聊。 日客流破千，10元茶馆全国遍地开花 从长沙到西安，在城市的老城区、公园、文艺街区， 一种“10元茶馆/茶摊”正在不断涌现。 一杯茶仅需10元甚至更低，茶水无限续，坐到下班也不会有人催；饿了要份茶点，单价仅需几块钱。 成都青羊区，成都漆器老厂房被改造成大旗茶馆，2000多平方米、230张桌子、约1000个座位。10点前早茶5元、10点后基础茶10元， 日常客流上千人次，节假日单日售茶营收可达3万元。 南昌民德路，市政府旧礼堂改成老茶馆， 日均接待约5000人次 ，开业当天突破7000人次。 郑州紫荆山公园旁的老房子改造成1100平茶馆，今年6月开", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1793065629.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "How bug bounty sharpens one researcher’s security skills", "url": "https://github.blog/security/how-bug-bounty-sharpens-one-researchers-security-skills/", "date": "Thu, 22 Oct 2026 17:21:30 +0000", "desc": "As Cybersecurity Awareness Month continues, the GitHub Bug Bounty team spotlights @r31n, diving into their research ap //www.huxiu.com/moment/1291858.html", "date": "Tue, 27 Oct 2026 23:03:06 GMT", "desc": "北京动物园回应大熊猫“萌兰”身体状况：多次呼唤动物未响应，经诊断评估未发现明显异常，安排专人值守观察。 10月27日晚，北京动物园官方微博回应大熊猫“萌兰”身体状况：今天（27日）下午，大熊猫“萌兰”在室外运动场持续休息，期间饲养、兽医人员密切关注动物状态，并多次呼唤，动物未响应，约19:00饲养人员将其收回内舍。 随后，工作人员对“萌兰”的采食、活动、精神、休息、排泄等情况进行全面观察，兽医同步采集粪便样本进行检测，经诊断评估，未发现明显异常。目前，“萌兰”状态平稳。 今晚（27日晚），已安排饲养、兽医等人员专人值守，持续观察“萌兰”夜间采食、活动、精神、休息、排泄等情况。明日（28日）早晨视情况外放展出。感谢大家的关心！ 27日，有网友发文反映，北京动物园大熊猫萌兰下午加餐出外场后出现持续精神萎靡、长时间趴卧，并伴有干呕、嘴角带白沫等情况。截至闭园下班时，状态仍未好转，且没有回到内舍。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1793142186.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "@_beccablue_: Just taken today so for that little ignorant woman that it is a total AI with her little decorative mirrors.This is not an AI photo. Thi...", "url": "https://www.threads.com/t/DfA_VC5jzDb", "date": "Tue, 27 Oct 2026 23:01:17 GMT", "desc": "@_beccablue_ : Just taken today so for that little ignorant woman that it is a total AI with her little decorative mirrors.This is not an AI photo. This is a true natural person who takes pride and the way she takes care of herself. As United States Marine Corps veteran!!", "tags": [], "topic_score": 0, "source": "Threads-AI讨论", "cat": "AI实战_创作者", "weight": 4, "ts": 1793142077.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "The data center boom has an upside: innovation for the US grid", "url": "https://techcrunch.com/2026/10/27/the-data-center-boom-has-an-upside-innovation-for-the-us-grid/", "date": "Tue, 27 Oct 2026 22:55:41 +0000", "desc": "As the AI boom stresses the existing power grid, all sorts of new opportunities for grid modernization are also emerging as a result, industry insiders say.", "tags": [], "topic_score": 0, "source": "TechCrunch", "cat": "科技新闻", "weight": 4, "ts": 1793141741.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 2 const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
