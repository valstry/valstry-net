lse, "is_vendor": false, "always_fresh": false, "rank": 22}, {"title": "同样是科技巨头IPO，Anthropic为何比SpaceX上市定价更保守", "url": "https://wallstreetcn.com/articles/3785926", "date": "Sat, 14 Nov 2026 07:44:09 +0800", "desc": "Anthropic正寻求打破SpaceX创下的史上最大IPO纪录，但在定价策略上，这家Claude开发商选择了一条截然不同的路径——将更多主动权交给机构投资者，而非单方面设定价格。 华尔街见闻提及，Anthropic正以每股70至78美元的区间价格向投资者询价，目标完全稀释估值约为1.4万亿美元，计划通过IPO募资最多644亿美元，另通过私募融资260亿美元。 据彭博社报道，这与SpaceX在营销阶段直接设定每股135美元固定价格的\"要么接受、要么放弃\"模式形成鲜明对比 。与此同时，当前人工智能板块交易环境趋于复杂，此前市场流传的Anthropic 2万亿美元估值预期已悄然消退。 报道指出，相较于SpaceX今年6月以862亿美元估值上市时所处的顺风环境，Anthropic面临的市场背景明显承压 ——纳斯达克100指数近三个月累计下跌约7%，AI基础设施供给过剩的担忧、美联储加息以及中期选", "tags": ["AI", "商业认知"], "topic_score": 9, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1794613449.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 22}, {"title": "纳指跌0.9%、道指逆势收涨，英伟达跌2%，苹果盘中刷新历史高位，比特币跌破7万", "url": "https://wallstreetcn.com/articles/3785885", "date": "Sat, 14 Nov 2026 06:54:12 +0800", "desc": "英伟达领导层动荡持续发酵，叠加通胀压力高企与美联储加息预期升温，美股指周五表现分化，标普、纳指收跌，道指则在消费股支撑下收涨。 美国10月生产者价格指数（PPI）同比上涨6.5%，创2022年11月以来最快年增速，尽管数据略低于市场预期，但仍强化了美联储12月继续加息的预期。BMO资本市场分析师Vail Hartman指出，PPI中纳入美联储首选通胀指标的分项数据在10月有所回落。LPL Financial首席经济学家Jeffrey Roach表示： 考虑到整体经济的脆弱性，50个基点的加息幅度可能带来不必要的风险，预计美联储将加息25个基点。 周五费城半导体指数下跌3.4%，纳斯达克100指数跌1.2%，标普500指数跌0.4%，收报7560.87点。 尽管标普500逾半数成分股录得上涨，科技板块的集中抛压仍主导了市场走向。英伟达CEO黄仁勋因婚外情丑闻辞职消息持续冲击市场，该公司股价本", "tags": ["AI", "资本市场"], "topic_score": 8, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1794610452.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 22}, {"title": "8-K - MACROGENICS INC (0001125345) (Filer)", "url": "https://www.sec.gov/Archives/edgar/data/1125345/000112534526000077/0001125345-26-000077-index.htm", "date": "2026-11-13T17:28:39-05:00", "desc": "Filed: 2026-11-13 AccNo: 0001125345-26-000077 Size: 6 MB Item 7.01: Regulation FD Disclosure Item 9.01: Financial Statements and Exhibits", "tags": [], "topic_score": 0, "source": "SEC 最新 8-K 申报", "cat": " ight": 3, "ts": 1794788974.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "射击教练被控走私武器案二审开庭 激辩罪与非罪", "url": "https://china.caixin.com/2026-11-15/102505000.html", "date": "Mon, 16 Nov 2026 00:29:34 GMT", "desc": "辩护律师表示，涉案全部配件加在一起都不可能组装成一套枪支，并且田红以形式上的“违法”润滑了僵化体制之下独家供应商无法满足实际需求的局面 庭审结束后的北京高院。图：IC photo 【财新网】 备受关注的国家级射击教练 田红 被控走私武器案，近日二审开庭。此前，田红及其子付义涵被认定走私入境气瓶等枪支散件2446件，一审分别获判有期徒刑10年、6年。（详见《财新周刊》2026年第3期《 射击教练何以卷入走私武器案 》） 财新从庭审现场了解到，被告人田红表示，其没有走私武器的主观故意和牟利目的，销售运动枪支配件是为了帮助射击运动发展，解决体育训练用品供应不足的问题。 辩护律师强调，当涉案全部配件加在一起都不可能组装成一套枪支的时候，就不能再机械地按照司法解释，以30件散件等于一套的方式来计算。并且，田红以形式上的“违法”润滑了僵化体制之下的独家供应商无法满足实际需求的局面，为射击竞技体育运动事", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1794788974.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "【我闻】中国新能源企业赴欧洲投资建厂 缘何引发“人口贩运”刑事调查？", "url": "https://wenews.caixin.com/2026-11-14/102504962.html", "date": "Mon, 16 Nov 2026 00:29:34 GMT", "desc": "国内工程建设领域常见的层层分包、劳务中介招工、工资“打包”结算等做法，到了欧洲却可能水土不服，成为中企出海不可忽视的合规风险 【金融我闻/岳跃】 2026年夏天，一批在芬兰工作的中国工人被要求签署一份协议。按照协议，他们在芬兰拿到的工资，如果超过出国前约定的数额，多出来的钱就必须以人民币返还给中国劳务机构。协议还规定，工人不能随意辞职或提出工资索赔，否则可能面临高额赔偿。 这些工人正在参与建设一座投资约8亿欧元的电池材料工厂。项目由中国创业板上市公司 当升科技 （300073.SZ）控股，芬兰国有企业参股，总承包商是 中国交建 旗下的 中国港湾工程公司 。由于工厂大量采用中国设备，2026年夏天，工地上有300多名从中国来的安装工人。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1794788974.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "偶遇“好人生命中最好的那一部分”｜廷滕寺的人与诗①", "url": "https://mini.caixin.com/2026-11-14/102504916.html", "date": "Mon, 16 Nov 2026 00:29:34 GMT", "desc": "看着车尾灯的两个小红点消失在黢黑的乡村仄径上，心中深感此行不虚，下来问路更是天赐良机，让我更深地理解了华兹华斯的诗，和他关于这里的风土人情影响人们的情感 廷滕寺。 《廷滕寺的人与诗》“财新mini+”连载中，查看 已更新内容 由于不熟悉英国的路况，离开了色尔本小村庄，费了好大力气才辗转驶上伦敦南—威尔士公路（Motorway 4, 简称M4）。这是一条全长304公里的封闭式高速公路，单向分道，车速快而均匀。一旦上来，驾驶就轻松多了。我长舒一口气，脑子一松，早年熟读的华兹华斯的那几首诗自动回旋起来。耳中最先响起的是我十七八岁并不流畅的背诵，就是那首相当流行的“金色水仙花”诗，其原名是《我独自游荡，像流云一样》（I Wandered Lon .com/articles/3785906", "date": "Fri, 13 Nov 2026 22:32:32 +0800", "desc": "最新讲话显示，美联储官员对通胀前景的担忧进一步升温。 美东时间11月13日周五，芝加哥联储主席古尔斯比（Austan Goolsbee）警告，美国当前通胀压力具有广泛性，通胀走势正在朝着错误方向发展，未来利率走向将取决于通胀表现，美联储还有控制通胀的工作要做，并需要重新确立抗通胀公信力。 波士顿联储主席科林斯（Susan Collins）则表示，通胀水平仍然过高且正在扩散，近期可能有必要进一步收紧货币政策。 两位官员均强调，通胀压力尚未得到有效控制，未来政策方向仍将受到价格走势的制约。不过，科林斯倾向于审慎调整政策，同时提醒，抑制通胀所需的较高利率也会增加购房和建房成本。 值得关注的是，古尔斯比将于2027年成为FOMC有投票权的票委，科林斯则将在2028年获得投票权。两人的最新表态也为观察美联储未来的政策倾向提供了重要参考。 在周五的讲话中，两位人释放了相近的政策信号：通胀问题仍未解决，", "tags": ["资本市场"], "topic_score": 2, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1794580352.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 14}, {"title": "LinkedIn 基于 OpenTelemetry 追踪用户动作全链路：从前端点击到后端服务", "url": "https://www.infoq.cn/article/3u1PmO0HqQXBFNibKZoe?utm_source=rss&amp;utm_medium=article", "date": "Thu, 12 Nov 2026 16:44:00 GMT", "desc": "点击查看原文>", "tags": [], "topic_score": 0, "source": "InfoQ 中文", "cat": "中文商业媒体", "weight": 4, "ts": 1794501840.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 14}, {"title": "Google 终于让 PyTorch 原生跑上 TPU，开发者：“早该如此！”", "url": "https://www.infoq.cn/article/Fikt82HLToqb6ZANB2xj?utm_source=rss&amp;utm_medium=article", "date": "Thu, 12 Nov 2026 15:00:00 GMT", "desc": "点击查看原文>", "tags": [], "topic_score": 0, "source": "InfoQ 中文", "cat": "中文商业媒体", "weight": 4, "ts": 1794495600.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 14}, {"title": "智能体 AI 架构中记忆、知识与上下文的系统化方案", "url": "https://www.infoq.cn/article/COuPKpA6rTf05C6JM10y?utm_source=rss&amp;utm_medium=article", "date": "Thu, 12 Nov 2026 13:00:00 GMT", "desc": "点击查看原文>", "tags": [], "topic_score": 0, "source": "InfoQ 中文", "cat": "中文商业媒体", "weight": 4, "ts": 1794488400.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 14}, {"title": "How Founders Can Reduce Platform Risk Before It Threatens Growth", "url": "https://news.crunchbase.com/ai/sta   document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
