6995907853057", "date": "Thu, 17 Sep 2026 08:01:17 GMT", "desc": "马斯克最近又在X上骂人。这次挨骂的是纪录片导演亚历克斯·吉布尼：他“毫无诚信”，是个“卑鄙无耻的人”，拍了一部“无聊了整整四小时”的电影。 电影叫《Musk》，拍了近四年，9月8日刚在威尼斯首映。 马斯克的律师比观众更早行动： 首映前五天，律师函已经送到片方，警告可能提起诉讼。 吉布尼对这种阵仗并不陌生。这 位奥斯卡获奖导演拍过安然的财务造假，也调查过号称“女乔布斯” 的伊丽莎白·霍姆斯如何用滴血验病的承诺吸引投资。 他惯于采访前员工、合伙人和身边人，追查那些光鲜故事背后发生了什么。这次，镜头对准了马斯克。 首映仍如期举行。放映结束后，现场观众起立鼓掌约四分钟，还有人朝导演喊了一声“谢谢”。 而且马斯克越是生气，外界越是兴奋和期待。最讽刺的是，就在9月15日，发行方Bleecker Street以观众需求强烈为由，宣布将纽约、洛杉矶的上映日期从10月16日提到9日。 实际上，2023年项目", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1789632077.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "全球芯片销售单月增6.4%：AI景气正在向这5个环节扩散", "url": "https://www.36kr.com/p/3986916839429766", "date": "Thu, 17 Sep 2026 06:18:27 GMT", "desc": "AI芯片的这轮景气，正在出现一个值得关注的新变化。 美国半导体行业协会（SIA）最新数据显示，2026年7月全球半导体销售额达到1468亿美元，比6月增长6.4%。更值得注意的是，这已经是全球半导体销售连续第17个月实现环比增长。 如果把时间拉长来看，变化更加明显：今年二季度全球半导体销售额达到4033亿美元，较一季度增长35.1%。 芯片市场显然很热。 但现在更重要的问题已经不是“AI芯片还热不热”，而是： 当GPU已经成为市场最熟悉的AI硬件之后，这轮景气接下来会传导到哪里？ 答案正在越来越清晰。 从存储、先进封装，到半导体设备和材料，再到电源、散热乃至高速互联，AI正在把过去围绕“一颗芯片”的行情，逐渐扩展成围绕“一整台AI服务器”和“一整座数据中心”的产业链需求。 这可能是接下来理解AI硬件周期最重要的一条线索。 1468亿美元背后，不能只看到GPU 先看一个容易被忽略的数据细节。", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1789625907.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "两个00后男生，如何凭借AI征服了北美年轻女用户？", "url": "https://www.36kr.com/p/3987096020384776", "date": "Thu, 17 Sep 2026 06:07:02 GMT", "desc": "文丨小葵 编辑丨果脯 AI时代下，创业圈变得愈发契合“大浪淘沙”这个词。生产力的爆发，让现在的太多人能做到“成名5分钟”，市面上涌现的优秀产品数量更是几何倍增多，但与此同时，有的人可能真的只是昙花一现，有的人却已经找到了自己的长处，选择走出舒适区，想要闯出一片天。 MobAI的两位00后创始人便是如此。其中，Vito钟文鼎曾是某头部VC的投资人，Kaito王博则是原捏ta的产品经理。 在职期间，他们共同开发了一款名叫《修仙模拟器》的产品。关注AI产品领域的人应该对其不陌生，《修仙模拟器》算是早期比较经典的一款AI相关产品。它依靠prompt驱动，需要用户持续填写提示词，虽然有着较高的自由度和丰富的内容，但也和当时诸多AI产品一样，对用户的AI训练能力有着不小要求。 修仙模拟器 为了解决这一问题，他们也曾尝试过不同的题材，但最终都不太理想。最穷的时候，公司账面上甚至只有2700元。 这种困境", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业 s strongly confounded with candidate quality and c", "tags": ["AI"], "topic_score": 3, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1789617600.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "Beyond Accuracy: How Procedural Traces Shift the Decision Criterion of LLM Overseers", "url": "https://arxiv.org/abs/2609.18204", "date": "Thu, 17 Sep 2026 00:00:00 -0400", "desc": "arXiv:2609.18204v1 Announce Type: new Abstract: Organizations increasingly use oversight loops where one large language model (LLM) audits another's outputs alongside procedural traces of claimed steps. A common concern about such LLM-as-a-judge pipelines is that detailed traces make overseers gullible. Using signal detection theory, we audit five LLM overseers on 19 compliance tasks (4,551 analyz", "tags": ["AI"], "topic_score": 3, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1789617600.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "STRETCH the Boundaries: A Unified Self-Taught Framework for Progressive LLM Evolution", "url": "https://arxiv.org/abs/2609.18642", "date": "Thu, 17 Sep 2026 00:00:00 -0400", "desc": "arXiv:2609.18642v1 Announce Type: new Abstract: Large language models (LLMs) often suffer from capability stagnation in self-improvement training because fixed difficulty levels fail to adapt to their evolving proficiency. To address this issue, we propose STRETCH (Self-Taught Reasoning Evolution via Targeted CHallenge), a unified framework inspired by cognitive scaffolding theory. STRETCH introdu", "tags": ["AI"], "topic_score": 3, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1789617600.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "LocQE: Principled Domain Adaptation for Localisation Quality Estimation by Leveraging Post-Edits", "url": "https://arxiv.org/abs/2609.18720", " 磅论文。 这一次，他们展示了一条完全不同的RSI路线：AI自我进化，居然可以靠做梦？ 这一次，谷歌是让智能体把自己走过的每一步存成一棵树，然后在树里「做梦」。 在梦里练出更优的探索策略，再回到现实继续干。 论文地址：https://arxiv.org/abs/2609.14858 Dream-RSI的效果可以说是相当震撼： 算法优化任务，主流进化搜索系统需要跑51200代，Dream-RSI调用317次就达到了同等水平。 圆填充问题，追平谷歌自家AlphaEvolveV2的最强纪录。 GPU内核优化，达到同等性能，生成次数暴降2.43倍。 底层权重一字未改，Gemini 3.1 Pro和3.7 Flash均可套用。 此外还有一个更有意思的结论，人给AI指方向，反而比不指更", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1789617479.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "年轻人不再为 AI 兴奋", "url": "https://www.36kr.com/p/3986775840619525", "date": "Thu, 17 Sep 2026 02:25:04 GMT", "desc": "皮尤研究中心最新调查显示，历史上第一次，多数30岁以下成年人表示对AI的担忧多于兴奋。 一个标志性时刻的到来 2026年夏天，皮尤研究中心发布了一项引发广泛讨论的调查结果：美国 30岁以下成年人中，首次有超过半数（55%）表示对人工智能的担忧多于兴奋 。这一数字在两年前还只有39%，而在2021年皮尤首次提出这个问题时，仅有31%。 这件事的意义远不止于一个民调数字的变化。 过去半个多世纪里，从个人电脑到互联网，从智能手机到社交媒体，年轻群体几乎无一例外地站在技术乐观主义的最前沿。他们是新技术最早的使用者、最热烈的拥护者，也是技术红利的直接受益者。这种“年轻人天然亲近新技术”的规律，曾经是科技行业最可靠的信仰之一。而AI似乎正在打破这一规律。 数据背后的转变轨迹 皮尤的调查数据勾勒出一条清晰的曲线。在“担忧多于兴奋”这一指标上，18至29岁群体的占比从2021年的31%一路攀升：2022年", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1789611904.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "[OpenAI] 精细、 [极少量] 翻译用什么模型？", "url": "https://www.v2ex.com/t/1242819#reply2", "date": "2026-09-16T23:36:27Z", "desc": "", "tags": ["AI"], "topic_score": 4, "source": "V2EX 最新", "cat": "AI实战_创作者", "weight": 3, "ts": 1789601787.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "Y Combinator Still Busiest Startup Investor In August As Nvidia Ramps Up Its Dealmaking Pace", "url": "https://news.crunchbase.com/venture/y-combinator-busiest-startup-investor-nvda-ramps-up-august-2026/", "date": "Mon, 14 Sep 2026 11:00:45 +0000", "desc": "We ranked August’s most active startup investors across several categories, including lead backers, prolific venture dealmakers, highest spenders ps://www.huxiu.com/moment/1281364.html", "date": "Fri, 18 Sep 2026 01:05:50 GMT", "desc": "《医药工业发展“十五五”规划》发布。 工业和信息化部、国家发展改革委等十部门今天联合发布《医药工业发展“十五五”规划》。《规划》提出，2030年，规模以上医药工业企业营业收入将超过3.5万亿元。《规划》重点围绕产业规模效益、创新发展、企业培育和集群发展等方面提出了“十五五”时期医药工业发展预期性指标。 其中包括：产业规模效益稳步提升，创新药产业规模增速年均达到20%以上，全球年销售额超10亿美元的品种数量达到5个以上；年营业收入超过100亿元的医药工业企业数量达到50家，千亿级医药产业园区数量达到20个。在创新发展方面，《规划》提出的目标是：医药工业上市企业平均研发投入强度年均达到10%以上，首创新药占全球比例达到25%以上。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1789693550.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "@blue11may: Ai mà sáng ra đã nhuộm đỏ phố chỉ thế này? Chính là chú Thơm Da LAB 😍 Cr: punnyaple.memo", "url": "https://www.threads.com/t/DdaNuXqjyi0", "date": "Fri, 18 Sep 2026 01:05:18 GMT", "desc": "@blue11may : Ai mà sáng ra đã nhuộm đỏ phố chỉ thế này? Chính là chú Thơm Da LAB 😍 Cr: punnyaple.memo", "tags": [], "topic_score": 0, "source": "Threads-AI讨论", "cat": "AI实战_创作者", "weight": 4, "ts": 1789693518.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "Goose: 1.16x faster than C++ and 1.12x than safe Rust, while memory safe", "url": "https://github.com/aardappel/goose/tree/master", "date": "Fri, 18 Sep 2026 01:04:54 +0000", "desc": "Article URL: https://github.com/aardappel/goose/tree/master Comments URL: https://news.ycombinator.com/item?id=49748954 Points: 18 # Comments: 5", "tags": [], "topic_score": 0, "source": "Hacker News 前页", "cat": "AI实战_创作者", "weight": 4, "ts": 1789693494.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "南方医科大学学生坠亡事件相关造谣账号被处置。9月15日凌晨，南方医科大学广州白云校区一名学生坠亡，引发社会关注。事件发生后，网络上出现大量传言，诸如“学...", "url": "https://www.huxiu.com/moment/1281363.html", "date": "Fri, 18 Sep 2026 00:58:57 GMT", "desc": "南方医科大学学生坠亡事件相关造谣账号被处置。 9月15日凌晨，南方医科大学广州白云校区一名学生坠亡，引发社会关注。事件发生后，网络上出现大量传言，诸如“学生父母双双重伤进ICU”“导师仅批准三天假期”“导师压榨逼迫学生”等说法在社交平台广泛传播。记者注意到，上述网传信息最早由“小野的瓜田”“右脸颊 const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
