main{padding:16px 20px;max-width:1080px;margin:0 auto}

e MCP connectors, Agent Skills, or both, and are the main way to build third-party extensions for Claude. Build a plugin, submit it through the new directory submission portal, and once approved, it's listed in the Claude directory . ‍ Submit a", "tags": [], "topic_score": 0, "source": "Claude 官方博客", "cat": "AI厂商官方", "weight": 6, "ts": 1790265600.0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 30}, {"title": "2.1.282", "url": "https://code.claude.com/docs/en/changelog#2-1-282", "date": "Wed, 23 Sep 2026 16:00:00 GMT", "desc": "Added a maxProseWidth setting that caps the width of Claude’s prose in wide terminals while tables and code blocks keep the full width Added a startup notice, and /status and claude doctor entries, listing telemetry variables in a project’s settings files that were ignored or that turned telemetry off Added the allowClaudeInChromeWithManagedMcp managed setting to let claude --chrome run alongside ", "tags": [], "topic_score": 0, "source": "Claude Code 更新日志", "cat": "AI厂商官方", "weight": 6, "ts": 1790179200.0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 30}, {"title": "Claude Tag now supports personal connectors in channels", "url": "https://claude.com/blog/claude-tag-now-supports-personal-connectors-in-channels", "date": "Wed, 23 Sep 2026 16:00:00 GMT", "desc": "Claude Tag (beta) lets you add Claude to a Slack channel, where it works alongside your team. Until now, Claude could only use the connectors an admin attached to the channel , and most organizations keep that list short on purpose: they want access to follow the person, not the channel. Now Claude can use your own connectors for a request you make in a channel. For example, your calendar, your dr", "tags": [], "topic_score": 0, "source": "Claude 官方博客", "cat": "AI厂商官方", "weight": 6, "ts": 1790179200.0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 30}, {"title": "Coding 100.0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 30}, {"title": "Show HN: LLMs Play Chicken in Realtime", "url": "https://chicken.wildcardlabs.tech", "date": "Mon, 28 Sep 2026 23:10:54 +0000", "desc": "Was curious how LLMs would play chicken without a clear reward matrix, and then took it a step further by allowing communication and realtime decision making. Each LLM is in an independent loop, where each turn they are given the current speed and time to impact, as well as their historical latency. They can pre-plan moves to account for latency. Comments URL: https://news.ycombinator.com/item?id=", "tags": ["AI"], "topic_score": 3, "source": "HN Show HN", "cat": "AI实战_创作者", "weight": 5, "ts": 1790637054.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 29, "title_zh": "Show HN：LLM 实时玩胆小鬼博弈", "desc_zh": "好奇 LLM 在没有明确奖励矩阵时会如何玩「斗鸡博弈」，于是更进一步，允许它们通信并实时决策。每个 LLM 处于独立循环中，每轮都会获得当前速度、撞击时间，以及各自的历史延迟。它们可以预先规划动作以应对延迟。评论 URL：https://news.ycombinator.com/item?id="}, {"title": "Show HN: What a VM for your AI agent costs across 13 sandbox providers", "url": "https://vm-price-board.sf.tools/", "date": "Mon, 28 Sep 2026 21:31:39 +0000", "desc": "I was annoyed by tracking all these new sandbox prices manually, and seeing a new one pop up on X every week. So I built a page where you describe the machine, and it shows what provider can provide it for the cheapest, free tiers included. Am I missing any providers? I can add more! page: https://vm-price-board.sf.tools , source: https://github.com/sf-tools/vm-price-board Comments URL: https://ne", "tags": ["AI"], "topic_score": 3, "source": "HN Show HN", "cat": "AI实战_创作者", "weight": 5, "ts": 1790631099.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 29, "title_zh": "Show HN：你的 AI agent 虚拟机在 13 家沙箱提供商处的成本对比", "desc_zh": "手动追踪所有这些新的沙箱价格让我很烦，而且每周都有新的在 X 上冒出来。所以我做了个页面：你描述机器配置，它就会显示哪家提供商能最便宜地提供，含免费套餐。我漏掉哪些提供商了吗？我可以继续添加！页面：htt -image-2.1", "date": "Sun, 20 Sep 2026 12:00:00 GMT", "desc": "GITHUB HUGGING FACE MODELSCOPE 我们很高兴地开源 Qwen-Image-2.1 ，千问图像系列当前兼顾生成效果、推理效率与使用成本的开源图像模型。Qwen-Image-2.1 将文生图与图像编辑整合在同一模型中，视觉生成部分仅有 7B 参数 ，并原生支持透明图像的生成与编辑。 本次更新的主要特色包括四个方面： 小模强效，极致价比 ：轻量的模型结构与推理优化，在生成质量和计算成本之间取得平衡。 原生透明，创改一体 ：根据提示词生成普通图像或透明图像，并支持透明图层编辑与抠图。 全能编辑，多局保全 ：支持最多 10 张参考图 ，增强局部编辑、人像与商品保真，并覆盖多种编辑任务。 真实质感，字雅人美 ：提升文字排版、人物光影与细节表现，让生成结果更具美感。 小模强效，极致价比 # Qwen-Image-2.1 采用轻量简洁的模型结构，视觉生成部分包含 32 层 Si", "tags": [], "topic_score": 0, "source": "Qwen 官方博客", "cat": "AI厂商官方", "weight": 5, "ts": 1789905600.0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 25}, {"title": "Qwen3.8-LiveTranslate：知其人，传其义", "url": "https://qwen.ai/blog?id=qwen3.8-livetranslate", "date": "Fri, 18 Sep 2026 09:30:00 GMT", "desc": "API Demo 同传不只是翻译得快，更要听得清、译得准。Qwen3.8-LiveTranslate 以 Interleave 架构重构实时同传，忠实度、流畅度、简洁度全面提升，字均延迟（LAAL）从 2.8 秒降至 2.3 秒。我们希望同传不只传递语言、也能保留交流中人物与上下文信息，因此，在支持 60 种语言的基础上，Qwen3.8-LiveTranslate 新增三项能力让同传更广泛的应用于真实场景中：实时说话人分离，每句话归属清晰，音色复刻更稳定；原文译文同帧同出，双语同屏；长上下文消歧，联系前文读懂当下，人名术语翻译更精准。 核心亮点 # Interleave 架构：音频与文本交织，更高质量、更低延迟。 本代模型将同传重构为音频-文本交织的单流形式，已听音频和已出译文均可缓存复用，翻译质量相比上代显著提升，字均延迟（LAAL）从上一代的 2.8 秒降至 2.3 秒。 实时说话人分", "tags": [], "topic_score": 0, "source": "Qwen 官方博客", "cat": "AI厂商官方", "weight": 5, "ts": 1789723800.0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 25}, {"title": "Qwen3.8-Omni-Flash：耳聪目明，办事得力", "url": "https://qwen.ai/blog?id=qwen3.8-omni-flash", "date": "Fri, 18 Sep 2026 07:00:00 GMT", "desc": "QWEN STUDIO QWEN-LIVE HARNESS QWEN-MM-PLUGINS QWEN3.8-OMNI-FLASH API QWEN3.8-OMNI-FLASH-REALTIME API 引言 # 今天，新一代原生全模态模型 Qwen3.8-Omni-Flash 正式上线。该模型的核心目标是提升其在真实生产力场景中的 Agent 能力，推动全模态模型从“理解全模态内容”进一步走向“规划任务、调用工具并完成创作”。在具备编程、文本知识工作和 GUI 操作等通用 Agentic 能力的基础上，Qwen3.8-Omni-Flash 进一步拓展了以音视频为核心的 Agentic 应用，在视频剪辑、音乐视频创作、影视制作与解说、音视频转图文摘要和音视频对话等需要综合处理文本、图像、音频与视频的工作流中取得了显著效果。 图 1：Qwen3.8-Omni-Flash 与其在生产环境中的应用", "tags": [], "topic_score": 0, "source": "Qwen 官方 ": 1790610855.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 24}, {"title": "FBI reportedly declares ‘cyber security incident’ after hackers steal agents’ personal data", "url": "https://techcrunch.com/2026/09/28/fbi-reportedly-declares-cyber-security-incident-after-hackers-steal-agents-personal-data/", "date": "Mon, 28 Sep 2026 14:50:30 +0000", "desc": "The bureau has not yet publicly confirmed a breach, but has told its agents that their personal information and Social Security numbers were exposed.", "tags": ["AI"], "topic_score": 3, "source": "TechCrunch", "cat": "科技新闻", "weight": 4, "ts": 1790607030.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 24}, {"title": "AI需求仍在狂飙！英伟达最新披露：供应承诺额暴增135%，Anthropic已签约超1800亿美元", "url": "https://wallstreetcn.com/articles/3782667", "date": "Mon, 28 Sep 2026 21:55:31 +0800", "desc": "英伟达最新披露的数据显示，AI基础设施需求持续扩张，多项关键指标较上季度大幅跳升，为市场提供了迄今最新的需求能见度参考。 英伟达披露，AI初创公司Anthropic迄今已签约2.6吉瓦的AI基础设施算力，交付期延伸至2028年，其跨多家云服务商（CSP）及新兴云平台（Neocloud）的合同总价值已超过1800亿美元。与此同时，英伟达整体供应承诺额从上季度的1190亿美元大幅攀升至2790亿美元，增幅超过130%，本次承诺额的增长主要与内存采购相关。 上述数据的披露延续了英伟达在财报周期中定期公布合同承诺规模的惯例。市场对此类数据的解读通常遵循固定逻辑：合同总额被视为需求持续性的佐证，而承诺构成则决定其实际分量。 Anthropic签约规模凸显头部AI客户需求强度 英伟达披露，Anthropic已累计签约2.6吉瓦AI基础设施算力，交付期覆盖至2028年，跨多家CSP及Neocloud平台", "tags": ["AI"], "topic_score": 8, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790603731.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 24}, {"title": "摩根大通：美股科技七巨头“杀估值”已近尾声，但难再回到“一枝独秀”", "url": "https://wallstreetcn.com/articles/3782662", "date": "Mon, 28 Sep 2026 19:29:33 +0800", "desc": "美股科技板块经历长达数月的估值压缩后，摩根大通认为最艰难的阶段或已过去，但\"科技独领风骚\"的时代不会重演。 据追风交易台，摩根大通策略师Mislav Matejka在9月28日发布的报告中指出 ，以\"科技七巨头\"（Mag-7）为代表的大型科技股估值已跌至10年最低，超大规模云厂商（Hyperscalers）相对标普500的市盈率溢价亦压缩至逾一个标准差的低位，杀估值进程在很大程度上已接近尾声。 报告同时维持对半导体的超配立场，并建议重新布局\"做多半导体、做空软件\"的配对交易。 然而，摩根大通明确表示， 科技板块不太可能重返此前\"一枝独秀\"的极端强势格局。 该行认为， AI资本开支周期仍将持续，盈利动能依然稳健，变现路径也在逐步清晰，这些因素共同支撑科技板块重新获得市场关注——但科技股主导市场回报的时代已成过去 。 Mag-7与超大规模云厂商：估值压缩接近尾声 Mag-7今年以来持续跑输大盘", "tags": ["资本市场"], "topic_score": 6, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790594973.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 24}, {"title": "小模型本地部署“抢走”云端算力需求，万亿美元数据中心资本开支面临考验", "url": "https://wallstreetcn.com/articles/3782651", "date": "Mon, 28 Sep 2026 17:39:21 +0800", "desc": "AI应用持续扩张，但支撑这轮热潮的超大规模数据中心投资，正面临新的需求端挑战。 杰富瑞报告指出， 随着小型语言模型性能提升、成本下降，企业AI部署可能从集中式云端转向本地化，由此对云端算力需求以及巨额数据中心资本开支形成压力。 这一判断的一个重要依据，是近期对AI服务器实际使用情况的观察。2026年9月，Swerve Research Technologies通过追踪Anthropic服务器请求队列的等待时间构建“拥堵指数”，发现相关服务器利用率较2026年1月至2月的峰值下降26%。 这一指标并不能直接对应公司收入，但如果利用率持续走低，可能意味着部分算力供给开始出现闲置。 与此同时，AI基础设施投资仍在快速扩张。市场目前预计，Meta、Alphabet、亚马逊和微软四家美国科技巨头2027年资本支出合计可能达到9900亿美元。报告认为， 如果AI算力需求增速最终无法匹配如此庞大的投资规", "tags": ["AI", "企业落地"], "topic_score": 8, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790588361.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 24}, {"title": "英伟达推出AI安全系统：实时监控智能体，毫秒级阻止违规行为", "url": "https://wallstreetcn.com/articles/3782650", "date": "Mon, 28 Sep 2026 17:12:54 +0800", "desc": "英伟达正以新的安全架构回应AI自主代理失控带来的行业风险。 周一，英伟达发布名为“Open Agent Safety Platform”的双层AI安全平台，包含两款开源软件工具OpenShell与Nvidia Sentry，可运行于英伟达硬件之上，实时管控AI代理的访问权限，并在其违规时将其关闭。 英伟达表示， 该系统能够在毫秒级隔离异常代理，并称如果相关实验室此前已部署这套技术，今年7月OpenAI模型攻击Hugging Face的事件本可被阻止。 这一举措也是英伟达在持续扩展芯片业务之外，向AI软件安全领域延伸的最新动作。与此同时，首席执行官黄仁勋近期多次将AI安全视为工程问题，强调AI系统必须接受严格的安全测试。 双层架构实时监控，毫秒级隔离异常代理 英伟达企业AI副总裁Justin Boitano在发布前的媒体简报会上表示， Open Agent Safety Platform能够", "tags": ["AI"], "topic_score": 7, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790586774.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 24}, {"title": "Nvidia Debuts System Meant to Stop AI Agents From Going Awry", "url": "https://www.bloomberg.com/news/articles/2026-09-28/nvidia-debuts-system-designed-to-stop-ai-agents-from-going-awry", "date": "Mon, 28 Sep 2026 09:0 an Howard-Jones披露， 今年4月至6月间，OpenAI智能体向联合国贸易和发展会议（UNCTAD）统计网站发送逾1.6万次扫描请求。 涉事智能体原本被要求通过UNCTADstat API获取生产能力指数（PCI）相关公开数据，但由于缺乏直接API访问权限，加之HTTP工具受到限制，数据抓取一度受阻。 任务受阻后，智能体没有停止，而是开始自行寻找绕过限制的办法。 在多次请求失败后，它误以为网站存在一个并不存在的“过滤器”，并尝试隐藏自身行为，随后又发现可以利用谷歌XSS游戏作为跳板继续完成任务。该游戏原本用于帮助用户学习跨站脚本技术，但被智能体当作实现数据获取目标的工具。 此次事件的规模和影响尚未达", "tags": ["AI"], "topic_score": 4, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790591025.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "金银集体杀跌！高油价与美联储高加息预期持续压制贵金属", "url": "https://wallstreetcn.com/articles/3782648", "date": "Mon, 28 Sep 2026 16:38:00 +0800", "desc": "油价高位运行叠加美国经济活动走强，进一步强化市场对美联储维持高利率甚至继续加息的预期，黄金价格周一延续跌势，贵金属市场承压。 截至发稿，布伦特原油突破100美元/桶，日内涨超2.5%；现货黄金跌破4150美元/盎司，现货白银跌5.01%至61.08美元/盎司。市场目前定价显示，美联储10月再度加息的概率约为65%至70%，白银、铂金等贵金属同步走弱。 美元指数小幅上涨0.1%至0.2%，徘徊在101附近，进一步压制以美元计价的黄金。另据《华尔街日报》报道，Saxo Bank分析师称，部分黄金抛售发生在亚洲交易时段，或与投资者在长假前提前获利了结有关。 油价高企，加息预期升温 油价持续高位成为金价承压的重要外部因素。 特朗普拒绝伊朗提出的“7天重开霍尔木兹海峡”方案后，伊朗外长阿拉格齐表示，伊朗已为战事重开做好准备，但外交大门仍未关闭，是否恢复接触取决于美国的选择。据新华社援引伊朗媒体27日", "tags": ["资本市场"], "topic_score": 4, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790584680.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "只有少数股在涨！高盛警告：美股广度创2000年互联网泡沫来最差，债波动率罕见背离", "url": "https://wallstreetcn.com/articles/3782634", "date": "Mon, 28 Sep 2026 14:40:52 +0800", "desc": "表面平静之下，美股正在经历一场结构性撕裂。 高盛衍生品交易主管Brian Garrett发出警告： 美国股票市场\"拒绝为任何恐慌定价\"。 高盛恐慌指数（Panic Index）上周五收于1以下，VIX维持在低十几的水平，但与此同时，债券波动率指标MOVE指数却处于约100百分位的极端高位——两者之间的背离，正在向市场发出罕见的结构性预警信号。 更令人警惕的是美股内部的广度崩塌。 标普500指数成分股中，站上200日均线的比例已不足50%；52周新低股票数量连续九个交易日多于新高股票数量——这两项指标同时触发，是自2000年互联网泡沫顶部以来首次出现。 与此同时，标普500指数中位数股票较52周高点已下跌16%，指数整体却因AI相关龙头股的强势而维持在高位附近，形成严重的\"指数虚胖\"格局。 对冲基金的行为同样印证了这一分裂： 据高盛最新Prime数据，美国多空基金总杠杆升至210.6%（一年", "tags": ["资本市场"], "topic_score": 4, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790577652.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "“AI空头”思考：云大厂“ROIC下滑”、大模型“难有护城河”、OpenAI是“AI时代WeWork”、Muse背后“人肉电池”", "url": "https://wallstreetcn.com/articles/3782626", "date": "Mon, 28 Sep 2026 11:30:42 +0800", "desc": "近日，知名做空机构Chanos & Co创始人Jim Chanos与纽约大学荣誉教授、AI研究者Gary Marcus近日在RiskReversal播客节目中展开深度对话。 Jim Chanos与Gary Marcus警示，AI建设周期面临资本回报下滑、模型同质化和融资依赖等问题。Chanos称云巨头增量ROIC（投入资本回报率）已自2024年见顶回落；Marcus认为大模型缺乏长期技术护城河，OpenAI或成“AI时代WeWork”。他还称，热门智能体Muse背后仍有人工参与，智能体大规模授权的安全风险值得审视。 两位长期唱空AI的人从财务和技术两个维度共同拆解AI泡沫。 从左到右依次为Jim Chanos、主持人、Gary Marcus 云大厂的ROIC正在快速下滑 Jim Chanos表示，Chanos & Co从2025年初开始重点研究超大规模云厂商（Hyperscaler）的资本", "tags": ["AI", "商业认知"], "topic_score": 11, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790566242.0, "opinion": true, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "阿里云霍嘉：企业AI落地，先砍掉一批伪场景", "url": "https://wallstreetcn.com/articles/3782619", "date": "Mon, 28 Sep 2026 10:51:21 +0800", "desc": "今年1月2日，阿里云智能集团副总裁霍嘉跑了一个半程马拉松。当天他发了一条朋友圈：「今年是奥运第一个周期的决赛年，练了四年终于比赛了。」 这比的正是AI应用落地。 9月23日，云栖大会期间的一场媒体群访上，霍嘉又讲了一遍这个判断。大模型真正落地的第四年，今年才是AI应用落地的元年。 Token消耗在爆发，价格在上涨，这是比赛开始的信号。企业侧的情况要复杂得多。 霍嘉的团队一年来接触了大量企业项目。 他看到的失败，很少死在模型不够聪明上。 死因是找错了场景，高估了自己的数据，用做信息化项目的办法做AI。 他给出的办法有两个，一是对客户说No，二是把工程师推到客户现场。 01 四类客户：前两类靠需求，后两类看价值 霍嘉对今年AI价格上涨的解释是三个因素叠加：需求爆发，模型能力提高，企业实际感受到了生产力提升。 海外头部模型产品出现之后，AI从聊天和娱乐工具，走到了生产力工具的早期，Token背后", "tags": ["企业落地"], "topic_score": 4, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790563881.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "迎战Meta Muse，OpenAI紧急推出个人助手，预计周二发布", "url": "https://wallstreetcn.com/articles/3782618", "date": "Mon, 28 Sep 2026 08:33:42 +0800", "desc": "在Meta个人AI智能体Muse获得摩根大通最高评级、风头一时无两之际，OpenAI正加速推出一款名为\"o\"的常驻AI助手，以正面迎击这场日益激烈的AI智能体竞赛。 据科技媒体wccftech日前报道， 据悉，OpenAI已在ChatGPT Pro相关产品文档中加入\"o\"的品牌标识，正式发布迫在眉睫，预计将于本周二（9月29日）的Dev Day活动上亮相。 这一动作被外界普遍解读为对Meta Muse近期强势表现的直接回应——摩根大通在其最新发布的Assistant Benchmark评测中，将Meta Muse列为当前最顶尖的AI智能体。 此次Dev Day还将带来更多重磅消息： OpenAI预计同步推出新订阅 :31:01 GMT", "desc": "@anhthohoankiem : Ai giỏi đọc khẩu hình vào xem giúp 2 anh em này đang nói gì nhé.", "tags": [], "topic_score": 0, "source": "Threads-AI讨论", "cat": "AI实战_创作者", "weight": 4, "ts": 1790559061.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 18}, {"title": "“个股 vs 指数”波动率分化！美股热门交易：做多个股期权，用指数期权对冲", "url": "https://wallstreetcn.com/articles/3782616", "date": "Mon, 28 Sep 2026 09:02:14 +0800", "desc": "AI叙事分化、油价剧震与美债收益率飙升正在共同催化美股期权市场的一笔热门交易—— 分散交易（Dispersion Trade） 。这一策略的核心逻辑是： 做多个股期权、做空指数期权 ，从个股与指数波动率之间的裂口中获利。 据彭博报道，当前市场环境为该策略提供了罕见的入场窗口。 个股隐含波动率自7月底以来持续收缩，尤其是高飞的科技股，使得分散交易的建仓成本相对低廉。 与此同时，AI赢家与输家叙事的快速切换、地缘冲突对能源股的剧烈冲击，以及美债收益率攀升至二十年高位，正推动标普500成分股走势加速分化——这恰恰是分散交易最理想的土壤。 标普500成分股相对于指数本身的已实现一个月绝对回报，已升至过去30年的第95百分位。 然而，这笔交易并非没有争议。部分市场人士警告，分散交易已是过度拥挤的策略，随时面临\"洗牌\"风险；另一些人则认为，在低确信度的市场环境下，更简单的对冲方案—— 买入少数精选个股", "tags": ["资本市场"], "topic_score": 3, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790557334.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 18}, {"title": "Federal Reserve Board issues enforcement actions with former employee of Northstar Bank, former employee of American Express Travel Related Services Company, Inc., and former employee of Regions Bank", "url": "<![CDATA[https://www.federalreserve.gov/newsevents/pressreleases/enforcement20260918a.htm]]>", "date": "Fri, 18 Sep 2026 15:00:00 GMT", "desc": "Federal Reserve Board issues enforcement actions with former employee of Northstar Bank, former employee of American Express Travel Related Services Company, Inc., and former employee of Regions Bank", "tags": ["资本市场"], "topic_score": 3, "source": "美联储 新闻稿", "cat": "宏观监管", "weight": 4, "ts": 1789743600.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 18}, {"title": "Federal Reserve Board announces termination of enforcement action with SNB Bancshares and Bank of Eufaula", "url": "<![CDATA[https://www.federalreserve.gov/newseve 幅回落7个百分点。图：泱波/中新社/视觉中国 【财新网】 受去年同期基数偏高影响，2026年8月工业企业利润同比增速显著回落，1—8月累计利润仍保持两位数增长。工业企业应收账款同比增速持续回升，8月末同比增长9%，创2025年5月以来新高。 国家统计局9月28日公布的数据显示，2026年8月，全国规模以上工业企业利润同比增长4.2%，增速比上月大幅回落7个百分点。这主要是受去年同期基数较高影响，2025年8月工业企业利润同比增速超20%，为当年次高水平。 从前八月累计表现看，工业生产稳定增长和工业品价格涨幅扩大，推动规模以上工业企业营业收入增长，相应带动工业", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790641412.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "2026亚洲愿景论坛创新峰会29日启幕 共议“变革与韧性”", "url": "https://topics.caixin.com/2026-09-28/102489256.html", "date": "Tue, 29 Sep 2026 00:23:32 GMT", "desc": "聚焦技术加速颠覆与全球格局重构背景下，亚洲如何以创新与韧性塑造可持续未来 【财新网】 以“变革与韧性”为主题的 2026亚洲愿景论坛创新峰会 ，将于9月29-30日在新加坡举行，聚焦技术加速颠覆与全球格局重构背景下，亚洲如何以创新与韧性塑造可持续未来。 亚洲愿景论坛由财新国际在新加坡政府支持下合作推出，新加坡旅游局（STB）提供官方支持，至今已成功举办三届。2026年，双方又携手推出首届“创新峰会”子品牌，实现从宏观地缘对话向商业解决方案与产业落地的升级。 本次峰会汇聚来自全球的300余位政策制定者、企业家与专家学者。亚洲愿景论坛联席主席、新加坡国立研究基金会主席、新加坡前副总理王瑞杰将发表主题演讲，并在闭幕环节致辞；新加坡永续发展与环境部兼主管贸易关系部长傅海燕将参与炉边对话环节，围绕“从新加坡到亚洲——可持续发展行动蓝图”分享见解；马来西亚投资、贸易及工业部副部长兼国会议员沈志勤，新加", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790641412.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "超八成中国ODI流向亚洲：钱到底流去了哪里？", "url": "https://economy.caixin.com/2026-09-28/102489296.html", "date": "Tue, 29 Sep 2026 00:23:32 GMT", "desc": "“亚洲热”的背后，潜藏着一条巨大资金流向通道 2025年中国对外直接投资流量首次突破2000亿美元，达2135.8亿美元，同比增长11.1%，重回全球第二。图：视觉中国 【财新网】 9月23日，商务部、国家统计局、国家外汇局联合发布《2025年度中国对外直接投资统计公报》。2025年中国对外直接投资流量首次突破2000亿美元，达2135.8亿美元，同比增长11.1%，重回全球第二。 虽然总量创历史新高，但拆开结构看，值得玩味的是资金的目的地分布：亚洲仍是中国企业“走出去”最多的地区，2025年增长15.3%，占比达到82.9%，较上年提高3个百分点。与此同时，对美国、非洲的投资规模双双下降，欧洲则略有增长。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1790641412.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "[互联网] 大家多久没用百度了？", "url": "https://www.v2ex.com/t/1245350#reply25", "date": "2026-09-29T00:18:05Z", "desc": "", "tags": [], "t core": 0, "source": "Crunchbase 融资板块", "cat": "创投行业分析", "weight": 5, "ts": 1789756172.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 15}, {"title": "阿斯利康20亿美元入股Summit，看好康方生物依沃西", "url": "https://wallstreetcn.com/articles/3782694", "date": "Tue, 29 Sep 2026 08:15:38 +0800", "desc": "阿斯利康斥资20亿美元战略入股Summit Therapeutics，将依沃西单抗推向全球肿瘤免疫治疗竞争的核心舞台。这笔交易不仅是对这款中国创新药物潜力的重磅背书，也在康方生物最新OS数据引发业界广泛关注的节点上，进一步强化了市场对依沃西能够挑战\"K药\"地位的预期。 9月29日，据路透社报道，阿斯利康将以每股普通股等值18.36美元的价格认购Summit优先股， 较Summit周一收盘价15.48美元溢价18.6% ，交易预计本周内完成。消息公布后，Summit股价盘后涨幅超过18%。双方同时宣布将联合开展一系列临床试验，将依沃西与阿斯利康旗下癌症疗法组合测试，并已签署初步协议，探索依沃西与阿斯利康多款抗体偶联药物（ADC）的联合用药方案。 此次交易的核心标的，是由康方生物研发、于2022年以最高50亿美元潜在总额授权给Summit的依沃西单抗——全球首个PD-1/VEGF双特异性抗体。", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790640938.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 14}, {"title": "沙特修复管道，红海原油出口“全量运行”，其出口量将决定油价走势", "url": "https://wallstreetcn.com/articles/3782693", "date": "Tue, 29 Sep 2026 08:07:16 +0800", "desc": "沙特阿拉伯东西输油管道在遭受无人机袭击后完成修复并恢复出口，这一关键能源通道的重启正在重塑全球原油供应格局，并对近期油价涨势构成压力。 周二，据《华尔街日报》援引知情人士消息透露， 沙特国家石油公司沙特阿美已于周日开始通过东西管道向红海港口延布装载原油，目前管道输送量约为每日350万桶。与此同时，沙特在霍尔木兹海峡的原油装载量此前已大幅攀升 ，两条出口通道同步运作的前景令市场密切关注。 消息公布后，国际基准布伦特原油价格周一涨幅有所收窄，但仍维持在每桶105美元上方。 分析人士指出，沙特能否在维持霍尔木兹海峡高位出口量的同时，同步恢复延布港的装运，将是决定整体出口规模能否超越袭击前水平的关键变量，进而影响近期油价能否出现实质性回落。 管道修复，关键能源动脉重启 东西输油管道全长750英里，横贯沙特阿拉伯，连接波斯湾沿岸的主要产油区与红海港口延布，是沙特绕开霍尔木兹海峡向外输送原油的核心替代", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790640436.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 14}, {"title": "全球债券2007年来首度逼近4%，美债整体利率水平已触及二十年来最高点", "url": "https://wallstreetcn.com/articles/3782690", "date": "Tue, 29 Sep 2026 07:58:33 +0800", "desc": "全球债券收益率正以2007年以来首次的姿态逼近4%这一关键关口，美国30年期国债收益率同期升至2004年以来的最高水平，全球债市正经历一轮跨市场的同步抛售。 周一，伴随原油价格走高，美债收益率曲线各期限整体攀升了7至8个基点，彭博全球综合债券指数逼近4%为2007年以来首次。 目前， 美国整体利率水平已触及20年来的最高点，其中10年期实际利率更是向上突破，创下自雷曼 "is_hot": false, "is_vendor": false, "always_fresh": true, "rank": 21}, {"title": "Apps, Agents, and Aggregation", "url": "https://stratechery.com/2026/apps-agents-and-aggregation/", "date": "Mon, 28 Sep 2026 10:25:37 +0000", "desc": "Agents are the ultimate Aggregators; they reveal apps as a means, not an ends, and providing them is tech's biggest prize.", "tags": ["AI"], "topic_score": 3, "source": "Stratechery", "cat": "创投行业分析", "weight": 2, "ts": 1790591137.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 18, "title_zh": "应用、Agent 与聚合", "desc_zh": "Agent 是终极聚合器；它们揭示应用只是手段而非目的，而提供 Agent 是科技界最大的奖赏。"}, {"title": "Basis completes a tax workbook 2x faster with GPT-6 Astra", "url": "https://openai.com/index/basis-tax-workbook-with-astra", "date": "Mon, 28 Sep 2026 00:00:00 GMT", "desc": "GPT-6 Astra completed a 50-tab tax workbook twice as fast as GPT-5.6 Sol, and its stronger understanding of user intent gives Basis more confidence in real-world use.", "tags": ["AI"], "topic_score": 3, "source": "OpenAI News", "cat": "AI厂商官方", "weight": 7, "ts": 1790553600.0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 41, "title_zh": "Basis 借助 GPT-6 Astra 将税务工作簿处理速度提升一倍", "desc_zh": "GPT-6 Astra 完成一份 50 个标签页的税务工作簿的速度是 GPT-5.6 Sol 的两倍，其对用户意图更强的理解也让 Basis 在真实场景中更有信心。"}, {"title": "英伟达，大动作。当地时间9月28日，英伟达宣布推出NVIDIA Open Agent Safety Platform，这是一个开放软件平台及参考系统设计，旨在从智能体测试到部署全流程增强...", "url": "https://www.huxiu.com/moment/1284328.html", "date": "Tue, 29 Sep 2026 00:10:24 GMT", "desc": "英伟达，大动作。 当地时间9月28日，英伟达宣布推出NVIDIA Open Agent Safety Platform，这是一个开放软件平台及参考系统设计，旨在从智能体测试到部署全流程增强AI安全，并对运行智能体的软件、硬件、计算及机器人系统实现全栈治理与控制。该平台包括NVIDIA OpenShell安全运行时软件，可为在CPU上运行的智能体设定可强制执行边界。OpenShell现已广泛可用，并在首款专为智能体AI打造的NVIDIA Vera CPU上以极低开销运行。作为开源软件，OpenShell还可扩展至Arm、Intel等第三方计算平台。 参考系统设计包含NVIDIA Sentry。这是一个运行在NVIDIA BlueField-4 DPU上的带外监控程序，可持续监控智能体行为，并在芯片内独立执行安全策略。若智能体试图越出软件边界，Sentry可在毫秒内将其隔离并停止。 此外，当地", "tags": ["AI"], "topic_score": 9, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1790640624.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 32}, {"title": "Show HN: LLMs Play Chicken in Realtime", "url": "https://chicken.wildcardlabs.tech", "date": "Mon, 28 Sep 2026 23:10:54 +0000", "desc": "Was curious how LLMs would play chicken without a clear reward matrix, and then took it a step further by allowing communication and realtime decision making. Each LLM is in an independent loop, where each turn they are given the current speed and time to impact, as well as their historical latency. They can pre-plan moves to account for latency. Comments URL: https://news.ycombinator.com/item?id=", "tags": ["AI"], "topic_score": 3, "source": "HN Show HN", "cat": "AI实战_创作者", "weight": 5, "ts": 1790637054.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 29, "title_zh": "Show HN：LLM 实时玩胆小鬼博弈", "desc_zh": "好奇 LLM 在没有明确奖励矩阵时会如何玩「斗鸡博弈」，于是更进一步，允许它们通信并实时决策。每个 LLM 处于独立循环中，每轮都会获得当前速度、撞击时间，以及各自的历史延迟。它们可以预先规划动作以应对延迟。评论 URL：https://news.ycombinator.com/item?id="}, {"title": "Tiffany 小红书", "url": "https://s.weibo.com/weibo?q=Tiffany%20%E5%B0%8F%E7%BA%A2%E4%B9%A6&t=31&band_rank=13&Refer=top", "desc": "", "date": "", "hot": 0, "tags": [], "topic_score": 0, "source": "热搜-微博", "cat": "热点榜_发生了什么", "weight": 6, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 26}, {"title": "OpenAI’s AI agents need to catch up", "url": "https://www.theverge.com/ai-artificial-intelligence/1001590/openai-devday-2026-aeon-ai-agent", "date": "2026-09-28T14:40:24-04:00", "desc": "OpenAI popularized the modern generative AI chatbot, but as its 2026 DevDay event approaches, it's fallen behind in one of the industry's hottest categories: continuously running, consumer-facing AI agents. On Tuesday, it will likely try to capture the lead in that race. Rumors abound that OpenAI will release its own AI agent, dubbed Aeon - […]", const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
