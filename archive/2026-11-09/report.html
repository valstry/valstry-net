ihapitiya在11月8日播出的节目中披露， 真正的“核弹级”变量隐藏在SpaceX与Anthropic的算力供应合同之中——双方均持有\"90天相互退出条款\"。 一旦市场算力供给因各州许可冻结而骤然收紧，SpaceX理论上可以终止合约并以现货价格2至3倍重新定价，届时整个AI产业的力量格局将被彻底改写。 (All-In Podcast节目截图) 超大规模云厂商坐拥存量算力稳居“包租公”地位，而严重依赖外部租借的新云（Neoclouds）与前沿模型公司则面临生死存亡之局。 与此同", "tags": ["AI"], "topic_score": 6, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1794112626.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 24}, {"title": "CyberwIIOS：如何驾驭大模型在 OT 侧跨越“幻觉”与“失控”｜AICon北京", "url": "https://www.infoq.cn/article/K1bCIbHxeu3wLIjdusgr?utm_source=rss&amp;utm_medium=article", "date": "Sat, 07 Nov 2026 10:00:00 GMT", "desc": "点击查看原文>", "tags": ["AI"], "topic_score": 4, "source": "InfoQ 中文", "cat": "中文商业媒体", "weight": 4, "ts": 1794045600.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 24}, {"title": "Egyptian and Nigerian English join the Open ASR Leaderboard", "url": "https://huggingface.co/blog/open-asr-leaderboard-liva", "date": "Fri, 06 Nov 2026 00:00:00 GMT", "desc": "", "tags": [], "topic_score": 0, "source": "HuggingFace Blog", "cat": "AI厂商官方", "weight": 4, "ts": 1793923200.0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 24}, {"title": "Gemini Omni 1.2 Flash: Fast and cost-effective with longer clips", "url": "https://blog.google/innovation-and-ai/technology/developers-tools/introducing-gemini-omni-1-2-flash/", "date": "Thu, 05 Nov 2026 17:00:00 +0000", "desc": "Gemini Omni 1.2 Flash brings native 15-second video generation and editing, stronger consistency, and 30% lower pricing.", "tags": [], "topic_score": 0, "source": "Google AI 博客", "cat": "AI厂商官方", "weight": 4, "ts": 1793898000.0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 24}, {"title": "A Closer Look at Phonon TTS. Launching High-Quality On-Device Speech That Tops the Benchmarks.", "url": "https://huggingface.co/blog/phonon-tts", "date": "Thu, 05 Nov 2026 00:00:00 GMT" 年的流动性危机，而非2000年科技泡沫破裂的前兆。他的核心判断是： AI增长引擎本身可能依然完好，市场剧烈重定价的是建设融资与时间节奏，而非底层需求。 这一判断对投资者的操作含义至关重要", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1794039340.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 10}, {"title": "卡塔尔称美伊谈判取得重大进展！万斯深度介入，斡旋升至美国政府最高层级", "url": "https://wallstreetcn.com/articles/3785439", "date": "Sat, 07 Nov 2026 15:59:00 +0800", "desc": "美伊间接谈判出现迄今最明确的积极信号。卡塔尔首相公开表态谈判已取得\"重大成果\"，美国媒体同步披露副总统万斯已亲自深度介入谈判进程，标志着这一轮美伊间接斡旋升至美国政府最高决策层级。 据中国国际电视台欧洲分台最新报道， 卡塔尔首相表示：\"我们已经取得了很大成果，我相信我们能够达成解决方案。\"他同时强调\"我们无法等待一个完美的协议，我们希望达成一个好的协议\"。这 是调停方迄今最为正面和明确的公开表态。 据环球网援引美国Axios新闻网报道，两名知情人士披露，万斯本人在过去两周参与了与伊朗的间接谈判，旨在促成新的停火协议并重启核谈判。分析人士认为，万斯的介入为谈判走向注入了新的不确定性，也赋予了此轮外交努力更高的政治权重，对市场对地区局势风险的定价具有直接影响。 万斯亲自斡旋，几乎每日与调停方沟通 据知情人士透露，万斯几乎每天都在与卡塔尔首相兼外交大臣Sheikh Mohammed、巴基斯坦陆军", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1794038340.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 10}, {"title": "中选只不过是最后一根稻草？市场终于正视AI“循环融资”的雷", "url": "https://wallstreetcn.com/articles/3785435", "date": "Sat, 07 Nov 2026 14:05:05 +0800", "desc": "AI繁荣叙事的裂缝正在扩大。中选次日，纳斯达克遭遇新冠疫情以来最大单日跌幅，科技基金年内涨幅悉数抹去，而这场震荡此前长期被市场刻意忽视的一个结构性隐患浮出水面——AI循环融资。 摩根大通现金交易全球联席主管Ron Adler在最新市场反思中直言，AI始终是当前市场的核心支点，而随着超大规模云计算企业（hyperscaler）开始转向资本市场为自身野心融资，交易员们顺势沿风险曲线走得更远，大举买入上游零部件和瓶颈资产。 然而，这条逻辑链条的脆弱性如今已无从回避。 \"循环收入获得了大量关注，但AI对市场和科技板块的循环冲击，在行情顺风的时候并未得到足够审视，\"Adler表示，\"现在，这一切已经改变。\" 这一判断来得并不偶然。就在同一天，《华尔街日报》等媒体密集报道了AI循环融资的风险，市场情绪骤然转向。标普500指数创下\"解放日\"以来最大单日跌幅，对冲基金承压明显，市场成交量较前一交易日飙升逾", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1794031505.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 10}, {"title": "AI基建融资新裂痕！一批数据中心贷款被打包甩卖，星际之门项目也在其中", "url": "https://wallstreetcn.com/articles/3785434", "date": "Sat, 07 Nov 2026 13:22:56 +0800", "desc": "荷兰国际集团ING正寻求一次性出售约5亿美元的数据中心贷款组合，其中包括与OpenAI、软银及甲骨文联合推进的\"星际之门\"（S const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
