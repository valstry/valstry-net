.tg{background:#21262d;padding:1px 7px;border-radius:9px}
.rk{color:#6e7681}
.age{color:#7ee787}

visers.", "tags": [], "topic_score": 0, "source": "Crunchbase 融资板块", "cat": "创投行业分析", "weight": 5, "ts": 1794916845.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21, "title_zh": "钱已到账，如今创始人成了风险。", "desc_zh": "融资完成后最初的 90 天可能让创始人应接不暇，但高管教练 Kelly Meerbott 解释说，他们可以通过在做出重大承诺前先暂停、正视压力、安排与联合创始人坦诚沟通，以及向董事会和可信赖的外部顾问寻求支持，来保护自己的决策质量。"}, {"title": "10-K - Walt Disney Co (0001744489) (Filer)", "url": "https://www.sec.gov/Archives/edgar/data/1744489/000174448926000066/0001744489-26-000066-index.htm", "date": "2026-11-17T06:32:32-05:00", "desc": "Filed: 2026-11-17 AccNo: 0001744489-26-000066 Size: 22 MB", "tags": [], "topic_score": 0, "source": "SEC 最新 10-K 年报", "cat": "企业行为_美股披露", "weight": 5, "ts": 1794915152.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "AI正在杀死游戏行业吗？| 游戏风向标", "url": "https://www.36kr.com/p/4073486195332226", "date": "Tue, 17 Nov 2026 06:52:56 GMT", "desc": "文丨二几 在游戏行业，AI正在成为一场关于未来的“罗生门”：有人把AI视作生产力革命，有人担心AI将摧毁原有的开发者生态。支持和反对各执一词，谁也说不准哪一种未来会先到来。 GDC刚刚发布的《2026年游戏行业报告》显示，40%的游戏行业从业者已经在工作中使用生成式AI，但与此同时，55%的受访者认为AI正在给游戏行业带来负面影响。 《2026年游戏行业报告》数据 腾讯最近的一场风波，则把这种矛盾表现得更加直观。11月11日，腾讯28周年总办LinkTime中，马化腾谈到AI时代的组织调整，提出要让核心业务全面拥抱AI、探索AI Native业务。但这番表态很快被解读成“腾讯裁员50%”，甚至衍生出“裁员8000人”的传闻。11月12日，腾讯公关总监张军出面澄清，所谓“50%”指的是资源向AI业务调度，并非裁员比例。 误读的背后是员工害怕被AI替代的焦虑。11月16日，腾讯文化发布的Lin", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1794898376.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "今年最火的“过冬战袍”，把冲锋衣挤下桌", "url": "https://www.36kr.com/p/4073321151386502", "date": "Tue, 17 Nov 2026 04:00:20 GMT", "desc": "当一群人在超市抢购百元羽绒服，另一群人开始扒拉出一种体面穿搭——皮草。 在小红书，第一批预备过冬的人，把海宁皮革城逛成时尚码头。他们手握小红书攻略、抖音比价视频，冲到线下，本着花小钱办大事的原则，置办过冬的行头。 作为古早网红，今年冬天皮草的声势“卷土重来”。 根据千瓜数据，近30天（10月6日-11月5日），小红书上皮草相关的笔记有14.32万篇，突破10万大关，成为热门品类。虽然不及羽绒服，但已经超过了冲锋衣、羊绒大衣等当季热门单品。 销售额翻了2.5倍，皮草悄悄上桌 海量的社媒讨论背后，是人们在花真金白银买皮草。 根据天猫双11发布的女装店铺榜单，2026年双11首波开门红，女装 。在“粤港澳大湾区与亚太发展机遇”专题研讨上，珠海格力电器董事长董明珠阐述了她眼中制造业的全球化逻辑，表示不能做一个依赖型的企业，要做一个赋能型、创造型的企业。她还抛出一个更“重”的判断，一个企业的使命不只是盈利赚钱，“我们的存在就是为了解决人类的问题，企业才有价值”。董明珠回顾，格力从几百人的研发队伍发展到如今2万人的研发队伍，在实现全品类家电覆盖的同时进入智能制造领域，数控机床、电机、压缩机等核心部件全部自主研发，“我们才有底气为更多行业和企业赋能”。 现场还促成了台上的一次“牵手”。谈起机器人，董明珠透露格力研发机器人已十几年，自动化生产线上的机器人全部由自主完成，2019年格力机器人乐队还曾登上央视春晚为歌唱家伴奏。她当场向同台的优必选科技创始人、董事会主席兼首席执行官", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1794960421.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "比亚迪王传福：出海坚持属地化生产，我赢你输的局面不可能长久。11月17日，2026年APEC工商领导人峰会在深圳开幕。在“打造亚太可持续发展新范式”专题研讨上，比...", "url": "https://www.huxiu.com/moment/1297744.html", "date": "Wed, 18 Nov 2026 00:06:34 GMT", "desc": "比亚迪王传福：出海坚持属地化生产，我赢你输的局面不可能长久。 11月17日，2026年APEC工商领导人峰会在深圳开幕。在“打造亚太可持续发展新范式”专题研讨上，比亚迪股份有限公司董事长兼总裁王传福晒出了一组出海数据：比亚迪目前拥有约102万名员工，其中海外员工约6万名。比亚迪在出口产品的同时坚持属地化生产，把就业和税收留在当地。“外界对中国制造有些误会，以为我们抢了他们的饭碗，其实我们是填补当地空白。”他说，比亚迪从智利采购了大量铜和锂，同时向智利交付了大批电动大巴，改善了当地环境，“我们的贸易是互补的。” 他还列举了比亚迪在海外工厂的几个样本：泰国工厂年产能约15万辆，带动当地约6000人就业，95%以上是泰国本地员工；印尼工厂同样雇佣约6000名本地员工，本地化比例也在95%以上；巴西项目同理。供应链方面，比亚迪全球约有11.2万家供应商，其中不少是本地供应商，泰国工厂的本地化率已超", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1794960394.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "Stripe backer Atomico calls for Europe to own its success stories", "url": "https://techcrunch.com/2026/11/17/stripe-backer-atomico-calls-for-europe-to-own-its-success-stories/", "date": "Wed, 18 Nov 2026 00:01:00 +0000", "desc": "Europe is home to many of the world's fastest growing companies of all time, veteran VC firm Atomico highlighted in its latest annual State of European Tech report.", "tags": [], "topic_score": 0, "source": "TechCrunch", "cat": "科技新闻", "weight": 4, "ts": 1794960060.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "微软联合逾40家机构发起AI透明度倡议，推动建立行业通用标准。该倡议包括三项内容：扩大微软对美国国家标准与技术研究院（NIST） 格提出，宇宙中可能存在一种全新粒子。他们将其命名为“轴子”。轴子质量极轻，与普通物质和光的相互作用极弱，因此极难探测。理论物理学家还推测，轴子可能有助于解释暗物质，甚至暗能量。几十年来，物理学家借助多种实验来寻找这些难以捉摸的粒子。 与依赖天体观测或宇宙学假设的搜索不同，ALPS Ⅱ在实验室内同时产生并探测轴子，因此其给出的上限更为稳健。实验中，强激光束穿过由12个超导偶极磁体组成的强磁场。若轴子存在，少量光子可能在磁场中转化为轴子。随后，激光被一堵不透明墙完全", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1794957774.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "Microsoft's ONNX Runtime has disappeared from GitHub", "url": "https://github.com/microsoft/onnxruntime", "date": "Tue, 17 Nov 2026 23:18:49 +0000", "desc": "Article URL: https://github.com/microsoft/onnxruntime Comments URL: https://news.ycombinator.com/item?id=50539610 Points: 54 # Comments: 11", "tags": [], "topic_score": 0, "source": "Hacker News 前页", "cat": "AI实战_创作者", "weight": 4, "ts": 1794957529.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "金刚石微波激射器将量子信号增强超千倍。日本冲绳科学技术研究所科学家研制出一种基于电子自旋的微波激射放大器，可在接近绝对零度的极低温下工作，将量子信号增...", "url": "https://www.huxiu.com/moment/1297735.html", "date": "Tue, 17 Nov 2026 23:18:48 GMT", "desc": "金刚石微波激射器将量子信号增强超千倍。 日本冲绳科学技术研究所科学家研制出一种基于电子自旋的微波激射放大器，可在接近绝对零度的极低温下工作，将量子信号增强1000倍以上，并可处理更强输入信号、在强磁场中稳定运行，为实用化量子计算与高分辨率传感技术铺平道路。相关论文发表于最新一期《自然·通讯》杂志。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1794957528.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "特朗普500亿美元空域升级计划遭遇参议院阻力。美国总统唐纳德·特朗普提议拨款501亿美元以全面改造美国空域系统，该计划目前在美国参议院正遭遇阻力。上周，美国...", "url": "https://www.huxiu.com/moment/1297733.html", "date": "Tue, 17 Nov 2026 23:13:01 GMT", "desc": "特朗普500亿美元空域升级计划遭遇参议院阻力。 美国总统唐纳德·特朗普提议拨款501亿美元以全面改造美国空域系统，该计划目前在美国参议院正遭遇阻力。上周，美国发生技术系统故障导致全国航班停飞，此后两党参议员纷纷要求政府就这一关键基础设施的现代化计划提供更多细节。周二，美国交通部长肖恩·达菲（Sean Duffy）与美国联邦航空管理局（FAA）局长布莱恩·贝德福德（Bryan Bedford）与共和党参议员们共进了一场漫长的闭门午餐。会后，许多参议员对该拨款请求仍持怀疑态度。 负责监管联邦航空管理局的参议院商务委员会主席特德·克鲁兹（Ted Cruz）表示：“我认为这500亿美元不会全部获批。”他补充说，部分申请资金与安全问题没有直接关系，并强调：“我表达的观点是   render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
