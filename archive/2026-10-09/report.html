etcn.com/articles/3783224", "date": "Fri, 09 Oct 2026 06:37:47 +0800", "desc": "澳大利亚数据中心运营商Firmus Grid在公开市场遭遇投资者冷遇后，宣布撤回赴澳交所上市计划，转而寻求私募融资。这是三周内第二宗数据中心巨型IPO折戟，市场对AI基础设施资产的公开市场定价正面临严峻考验。 Firmus原计划募资最高55亿美元，按每股11澳元定价，对应估值约437亿澳元（304亿美元）。据彭博报道，截至认购截止，询价簿未现明确定价或交易结构。Firmus一度将发行价下调至8澳元，较发行区间低约25%，并试图将底线守在8.25澳元。 最终，该公司周五宣布撤回上市申请，以\"近期市场波动及当前市况\"为由，称\"交易条款无法充分反映公司业务实力与长期增长前景\"，并表示将转向私募市场寻求资金。 此番折戟直接冲击关联方。Firmus股东之一Maas Group的股价盘中一度暴跌30%，创历史最大单日跌幅。 六个月估值六倍跳：从55亿到304亿美元 Firmus2019年以比特币挖矿起", "tags": ["AI", "商业认知"], "topic_score": 7, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791499067.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "8-K - Trinity Capital Inc. (0001786108) (Filer)", "url": "https://www.sec.gov/Archives/edgar/data/1786108/000119312526418097/0001193125-26-418097-index.htm", "date": "2026-10-08T17:30:13-04:00", "desc": "Filed: 2026-10-08 AccNo: 0001193125-26-418097 Size: 327 KB Item 7.01: Regulation FD Disclosure Item 9.01: Financial Statements and Exhibits", "tags": [], "topic_score": 0, "source": "SEC 最新 8-K 申报", "cat": "企业行为_美股披露", "weight": 6, "ts": 1791495013.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "8-K - Bain Capital Private Credit (0001899017) (Filer)", "url": "https://www.sec.gov/Archives/edgar/data/1899017/000119312526418095/0001193125-26-418095-index.htm", "date": "2026-10-08T17:29:30-04:00", "desc": "Filed: 2026-10-08 AccNo: 0001193125-26-418095 Size: 1 MB Item 1.01: Entry into a Material Definitive Agreement Item 2.03: Creation of a Direct Financial Obligation or an Obligation under an Off-Balance Sheet Arrangement of a Registrant Item 8.01: Other Events Item 9.01: Financial Statements and Exhibits", "tags": [], "topic_score": 0, "source": "SEC 最新 8-K 申报", "cat": "企业行为_美股披露", "weight": 6, "ts": 1791494970.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "8-K - X4 Pha s; Appointment of Certain Officers: Compensatory Arrangements of Certain Officers Item 7.01: Regulation FD Disclosure Item 9.01: Financial Statements and Exhibits", "tags": [], "topic_score": 0, "source": "SEC 最新 8-K 申报", "cat": "企业行为_美股披露", "weight": 6, "ts": 1791491420.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "Federal Reserve Board announces enforcement action against American Express Company to address, among other things, the firm’s failure to sufficiently detect and report certain suspicious activity related to money laundering", "url": "<![CDATA[https://www.federalreserve.gov/newsevents/pressreleases/enforcement20261008a.htm]]>", "date": "Thu, 8 Oct 2026 20:30:00 GMT", "desc": "Federal Reserve Board announces enforcement action against American Express Company to address, among other things, the firm’s failure to sufficiently detect and report certain suspicious activity related to money laundering", "tags": ["资本市场"], "topic_score": 3, "source": "美联储 新闻稿", "cat": "宏观监管", "weight": 4, "ts": 1791491400.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26, "title_zh": "美联储理事会宣布对 American Express Company 采取执法行动，以解决该公司未能充分发现和报告某些与洗钱相关的可疑活动等问题", "desc_zh": "美联储理事会宣布对 American Express Company 采取执法行动，以解决该公司未能充分发现和报告某些与洗钱相关的可疑活动等问题"}, {"title": "Google brings agentic AI to Gemini, starting with businesses", "url": "https://techcrunch.com/2026/10/08/google-brings-agentic-ai-to-gemini-starting-with-businesses/", "date": "Thu, 08 Oct 2026 18:18:00 +0000", "desc": "Google is turning Gemini into an AI agent that can plan, execute tasks, and work across business apps and systems. The agent can delegate work to subagents, use multiple AI models, and even gets its own workplace identity, complete with an email address.", "tags": ["AI"], "topic_score": 4, "source": "TechCrunch", "cat": "科技新闻", "weight": 4, "ts": 1791483480.0, "opinion": false, "is_hot": false, "is_vendor": fals I", "商业认知"], "topic_score": 6, "source": "Bloomberg Technology", "cat": "金融媒体_英文", "weight": 2, "ts": 1791454843.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 24}, {"title": "中文在线放弃港股IPO，28亿AIGC扩张计划遭遇追问", "url": "https://wallstreetcn.com/articles/3783189", "date": "Thu, 08 Oct 2026 17:01:27 +0800", "desc": "筹划近十个月后，中文在线突然终止了赴港上市计划。 10月8日，中文在线公告称，综合考虑市场环境与自身发展规划，决定终止H股发行上市。公司于2025年12月启动赴港计划，今年2月底正式递表，由花旗担任独家保荐人。 这一决定距离公司公布新一轮A股融资计划，仅过去一周。 9月30日，中文在线披露定增预案，拟募集不超过28.33亿元，用于数字版权采购、IP衍生内容开发、AI大模型研发及AIGC多模态内容平台建设等。 10月2日，深交所随即下发问询函，要求公司解释融资规模及募投项目合理性，并特别追问为何同时推进A股定增与港股IPO。 10月7日，正值深交所要求回复问询函的前一天，中文在线董事会决定终止H股上市。 从时间线来看，A股定增遭遇问询，很可能是促使中文在线重新权衡融资路径的重要因素。终止H股上市后，两地同时推进股权融资的问题随之消除。 不过，摆在中文在线面前的另一项难题，是新一轮募资规模已经", "tags": ["商业认知", "资本市场"], "topic_score": 6, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791450087.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 24}, {"title": "AI“世纪IPO之战”：OpenAI奋起直追，与Anthropic差距正在缩小", "url": "https://wallstreetcn.com/articles/3783161", "date": "Thu, 08 Oct 2026 11:53:20 +0800", "desc": "今年以来，AI大模型领域的商业竞争格局正在发生显著逆转。曾一度主导企业市场的Anthropic，正面临OpenAI的强力追赶——而这场角力的终极舞台，是两家公司即将到来的IPO。 据OpenRouter最新数据， 在同时使用Anthropic和OpenAI产品的约12万家企业中，两家公司的支出占比在9月已大致持平。而在今年年初，Anthropic一家独占这一群体总支出的四分之三。 这一逆转的核心驱动力，是OpenAI今年夏季推出的GPT-5.6系列模型——该系列以成本效率为核心设计理念，并在发布后随即大幅降价。与此同时，Anthropic在其旗舰模型Fable 5上设置的数据留存政策，也令部分企业客户望而却步。 两家公司均面临资本支出急剧攀升的压力，且均在筹备IPO：Anthropic最早可能于今年11月上市，OpenAI则预计明年跟进。 华尔街正密切审视两家公司能否以可持续的商业模式和营", "tags": ["AI", "商业认知"], "topic_score": 12, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791431600.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 24}, {"title": "博通拟为OpenAI筹集300亿美元债务融资，AI算力扩张加速转向杠杆化", "url": "https://wallstreetcn.com/articles/3783156", "date": "Thu, 08 Oct 2026 11:47:53 +0800", "desc": "博通在为Anthropic PBC启动600亿美元债务融资后，目前正筹划为OpenAI的定制芯片采购提供约300亿美元的资金支持。这一举动标志着芯片制造商与AI开发商之间的深度绑定正从技术合作延伸至资本层面。 10月8日，据彭博引述知情人士透露，博通已经开展了初步讨论，计划安排融资以帮助OpenAI购买双方正在共同开发的定制AI芯片。知情人士表示：“目前尚未启动正式程序，计划仍有可能发生变化，但初步谈判表明，两家公司可能会为OpenAI芯片寻求筹集约300亿美元的债务。” 这一潜在交易凸显了AI算力扩张对资本开支的巨大消耗，并揭示了行业融资模式的转变。面对装备数据中心日益高昂的成本，科技企业正积极寻求新的融资形式，以支持软件和服务的快速普及。债务融资正成为替代传统股权融资、支撑庞大AI基础设施建设的关键工具。 目前，博通、OpenAI以及潜在参与方黑石的代表均拒绝就此置评。 科技巨头齐聚债", "tags": ["AI"], "topic_score": 8, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791431273.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 24}, {"title": "大模型原生智能体手机STEPX Neo将于10月13日正式发布", "url": "https://www.qbitai.com/2026/10/501915.html", "date": "Thu, 08 Oct 2026 02:15:37 +0000", "desc": "", "tags": ["AI"], "topic_score": 3, "source": "量子位", "cat": "中文商业媒体", "weight": 4, "ts": 1791425737.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 24}, {"title": "Open-sourcing AstaBrief, the fast report-generation model in Asta", "url": "https://huggingface.co/blog/allenai/astabrief", "date": "Fri, 02 Oct 2026 15:19:50 GMT", "desc": "", "tags": [], "topic_score": 0, "source": "HuggingFace Blog", "cat": "AI厂商官方", "weight": 4, "ts": 1790954390.0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 24}, {"title": "The latest AI news we announced in September 2026", "url": "https://blog.google/innovation-and-ai/technology/ai/google-ai-updates-september-2026/", "date": "Fri, 02 Oct 2026 15:00:00 +0000", "desc": "Here are Google’s latest AI updates from September 2026", "tags": [], "topic_score": 0, "source": "Google AI 博客", "cat": "AI厂商官方", "weight": 4, "ts": 1790953200.0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 24}, {"title": "Ahem! Unmissable Meeting Reminders", "url": "https://www.producthunt.com/products/ahem-calendar-overlay", "date": "2026-10-08T17:31:33-07:00", "desc": "", "tags": [], "topic_score": 0, "source": "Product Hunt", "cat": "AI实战_创作者", "weight": 5, "ts": 1791505893.0, "opinion": false, "is_hot": false, "is_vendor": false, streetcn.com/articles/3783225", "date": "Fri, 09 Oct 2026 07:15:08 +0800", "desc": "为按时交付AI数据中心，甲骨文Oracle采取非常规供能手段应对管道延误，但高昂成本与扩容瓶颈仍是隐忧。 10月8日据彭博报道，甲骨文正以卡车运输压缩天然气的方式，维持旗下多个AI数据中心的建设与运营进度，以规避管道基础设施延误带来的时间损失。 这一非常规策略已在犹他州和德克萨斯州付诸实施，并正被考虑引入新墨西哥州的关键项目。甲骨文自由现金流目前为负，且预计在更多AI数据中心竣工投用前将持续承压。 甲骨文股价周四收跌5.5%，报135.69美元，创7月16日以来最大单日跌幅。 与此同时，与甲骨文存在燃料电池供能合作的Bloom Energy股价同日重挫逾6%，市场对甲骨文数据中心扩张节奏及相关合作落地前景的担忧明显升温。 卡车供气已有先例：犹他州和德克萨斯州率先落地 这并非甲骨文的初次尝试。 据报道援引知情人士透露，在 盐湖城郊区的数据中心项目 中，甲骨文采用卡车运气的方式维持了 逾一年 ", "tags": ["AI"], "topic_score": 2, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791501308.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 18}, {"title": "China's Delivery Robots Are Learning to Tackle the Night Shift", "url": "https://www.bloomberg.com/news/features/2026-10-08/china-s-delivery-robots-are-learning-to-tackle-the-night-shift", "date": "Thu, 08 Oct 2026 23:00:15 GMT", "desc": "Autonomous vehicle companies believe there’s a huge market opportunity in delivering after dark, if the technical challenges can be overcome.", "tags": ["个人成长"], "topic_score": 2, "source": "Bloomberg Technology", "cat": "金融媒体_英文", "weight": 2, "ts": 1791500415.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 18}, {"title": "Siebert Williams Shank CEO on 30 Year Anniversary", "url": "https://www.bloomberg.com/news/videos/2026-10-08/siebert-williams-shank-ceo-on-30-year-anniversary-video", "date": "Thu, 08 Oct 2026 21:47:08 GMT", "desc": "Suzanne Shank discussed how Siebert Williams Shank has expanded since launching in 1996 as a municipal bond underwriter. The firm now works across corporate debt markets, serves 80 of the Fortune 100, and remains active in municipals, with growth supported by mergers and acquisitions. She speaks with Romaine Bostick & Jess Menton on \"The Close.\" (Source: Bloomberg)", "tags": ["资本市场"], "topic_score": 2, "source": "Bloomberg Technology", "cat": "金融媒体_英文", "weight": 2, "ts": 179149 与劳动者之间的权利义务，合理确定企业用工责任，完善劳动标准体系，健全权益保障制度机制。图：视觉中国 【财新网】 围绕新就业形态，中国首部部门规章酝酿出炉。10月8日，人力资源与社会保障部于官网发布《新就业形态劳动者权益保障办法（征求意见稿）》（下简称《征求意见稿》），从即日起至11月8日，向社会公开征求意见。 人社部在起草说明中介绍，当前，中国依托互联网平台就业的新就业形态劳动者（下简称“新业态劳动者”）持续增长，成为劳动就业的重要组成部分。但由于平台企业用工形式和新就业形态就业方式相对灵活、复杂多样，难以直接适用现行劳动法律，权益保障面临新情况新问题。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1791505358.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "“双节”期间体验消费继续升温 游客消费拉动餐饮增长", "url": "https://www.caixin.com/2026-10-08/102491289.html", "date": "Fri, 09 Oct 2026 00:22:38 GMT", "desc": "“请3休13”的连休长假，让人们的出行半径进一步扩大，也带动了相关旅游目的地的消费增长 2026年10月2日，合肥市淮河路步行街游人如织。图：视觉中国 【财新网】 今年中秋与国庆假期临近，“请3休13”的连休长假，出行半径扩大，带动相关旅游目的地的消费增长。 国家税务总局10月8日披露数据称，国庆假期全国服务消费旺盛，相关行业日均销售收入同比增长19.5%。其中，旅游游览和娱乐服务销售收入同比增长23.6%；餐饮服务销售收入同比增长9%；文化艺术服务销售收入同比增长20.9%；体育服务销售收入同比增长29.4%。 在商品消费方面，家用电器和音像器材销售收入同比增长40.1%；手机、手环等通讯器材销售收入同比增长119.8%；厨具卫具零售同比增长52.3%。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1791505358.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "与古典传统展开妙趣横生的对话，加拿大诗人安妮·卡森获诺贝尔文学奖", "url": "https://www.caixin.com/2026-10-08/102491265.html", "date": "Fri, 09 Oct 2026 00:22:38 GMT", "desc": "她以诗歌、翻译、戏剧等多种形式，持续与古希腊罗马传统展开对话，把一系列古典资源转化为当代读者可感知的文学经验，让爱欲、孤独、失去这些古老的主题重新开口说话 【财新网】 北京时间2026年10月8日19时（瑞典斯德哥尔摩当地时间13时），2026年诺贝尔文学奖揭晓。瑞典学院宣布，将本年度诺贝尔文学奖授予加拿大诗人、散文家和翻译家安妮·卡森（Anne Carson），以表彰她“大胆而富有创造力的作品，通过与古典传统妙趣横生的对话，为当代文学开辟了新的形式”。（for her bold and inventive oeuvre that, in playful dialogue with the classical tradition, has created new forms for contemporary literature）", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1791505358.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "人事观察｜江苏省委高层再调整 换届前多要职已落定", "url": "https://china.caixin.com/2026-10-08/102491272.html", "date": "Fri, 09 Oct 2026 00:22:38 GMT", "desc : "https://finance.caixin.com/2026-10-08/102491251.html", "date": "Thu, 08 Oct 2026 23:47:12 GMT", "desc": "全球经济失衡是产业分工格局演进、国际货币体系固有矛盾、各国投资储蓄缺口等因素共同作用的结果，不是顺差国或逆差国单方面责任 央行强调，中国实施以市场供求为基础、参考一篮子货币进行调节、有管理的浮动汇率制度，坚持让市场在汇率形成中发挥决定性作用；重点防范汇率短期大幅波动尤其是短期急剧贬值影响金融稳定。图：IC photo 【财新网】 全球贸易交流日益增加，中国因出口强劲、经常账户顺差增长而在全球失衡的国际讨论中受到关注。一些观点认为，当前全球失衡与顺差国的汇率低估有关。 2026年10月8日，中国人民银行官网发布的《关于人民币汇率的政策立场》指出，中国推进人民币汇率市场化改革的方向是坚定、一贯的，坚持让市场在汇率形成中发挥决定性作用，没有必要、也无意通过汇率贬值获取贸易竞争优势。 央行强调，中国实施以市场供求为基础、参考一篮子货币进行调节、有管理的浮动汇率制度，坚持让市场在汇率形成中发挥决定性", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1791503232.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "纪检高官许传智：受贿22年，获刑12年", "url": "https://china.caixin.com/2026-10-08/102491280.html", "date": "Thu, 08 Oct 2026 23:47:12 GMT", "desc": "法院认定其到案后主动交代办案机关尚未掌握的大部分受贿事实和全部利用影响力受贿事实 2026年10月8日，浙江省宁波市中级人民法院一审公开宣判中央巡视组原副部级巡视专员许传智受贿、利用影响力受贿案，对被告人许传智以受贿罪判处有期徒刑十年六个月，并处罚金人民币一百万元，以利用影响力受贿罪判处有期徒刑五年，并处罚金人民币一百五十万元，决定执行有期徒刑十二年，并处罚金人民币二百五十万元；对追缴在案的许传智犯罪所得财物及孳息依法上缴国库，不足部分继续追缴。图：央视新闻 【财新网】 因受贿、利用影响力受贿，资深纪检高官 许传智 ，被一审判处有期徒刑12年，并处罚金250万元。10月8日，宁波中院一审宣判中央巡视组原副部级巡视专员许传智受贿、利用影响力受贿案，对其以受贿罪判处有期徒刑10年6个月，并处罚金100万元，以利用影响力受贿罪判处有期徒刑5年，并处罚金150万元，决定执行有期徒刑12年，并处罚金", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1791503232.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "蔡天凤碎尸案扑朔迷离 前夫兄弟被指在星巴克“预演”杀人", "url": "https://china.caixin.com/2026-10-08/102491247.html", "date": "Thu, 08 Oct 2026 23:47:12 GMT", "desc": "随着案件进入证人作供阶段，蔡天凤母亲张燕花的证供进一步揭示蔡家与邝家之间复杂的经济关系 2023年2月27日，中国香港，蔡天凤大埔龙尾村遇害现场已封锁。图：IC photo 【财新网】 经历长时间的司法程序与证据搜集后，震惊全港的香港名媛蔡天凤（Abby Choi）碎尸案近日在高等法院继续审理。随着控方开案陈词及证人作供，案件发生前后的更多细节浮出水面。控方展示的监控片段显示，案发当日，蔡天凤的前夫邝港智与其兄长邝港杰曾在旺角一间星巴克咖啡店会面，其间多次做出疑似模拟袭击的动作。控方认为，二人当时正在预演如何袭击蔡天凤。 根据控方指控，邝港智、其父亲邝球及兄长邝港杰涉嫌于2023年2月21日，在大埔龙尾村共同谋杀当时28岁的蔡天凤。三人均否认谋杀罪，邝港智及邝港杰承认阻止合法埋葬尸体罪，邝球则否认该项控罪。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中 12}, {"title": "张雪昔日东家浙阿波罗冲刺北交所，六成收入源自代工", "url": "https://wallstreetcn.com/articles/3783212", "date": "Thu, 08 Oct 2026 21:38:20 +0800", "desc": "张雪机车在国际赛场夺冠走红后，其创始人张雪曾经的老东家走到了资本市场的聚光灯下。 近日，浙江阿波罗运动科技股份有限公司（下称“浙阿波罗”）向北交所发起上市冲刺。 浙阿波罗主要产品涵盖电动两轮车、燃油越野摩托车及全地形车，长期以面向欧美客户的ODM代工业务为主。 报告期内，浙阿波罗的业绩保持高速增长，2025年收入、归母净利润分别为5.88亿元、0.67亿元，分别同比增长了52.49%、55.21%。 2026年仍保持增长态势，上半年收入、归母净利润分别为3.07亿元、0.27亿元，分别同比增长36.78%、14.12%。 此前，同样来自浙江的越野摩托车公司华洋赛车已于2023年登陆北交所。若此次上市成功，浙阿波罗有望成为继华洋赛车之后，北交所第二家越野摩托车上市公司。 代工为主 张雪与浙阿波罗的渊源可以追溯到2009年。 当年，22岁的张雪凭借一封手写求职信，获得浙阿波罗董事长应儿的赏识，", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791466700.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "优衣库欧美收入首次卖赢大中华区，不过内地开始企稳了", "url": "https://wallstreetcn.com/articles/3783211", "date": "Thu, 08 Oct 2026 21:30:02 +0800", "desc": "优衣库母公司迅销集团再创历史新高，但支撑这份成绩单的全球市场格局已经发生变化。 10月8日，迅销集团发布截至2026年8月底的全年业绩。期内集团收入同比增长16.6%至3.96万亿日元，营业利润增长约32%至7431亿日元，归母净利润增长25.3%至5425亿日元，连续第五年刷新业绩纪录。 其中，优衣库海外业务收入增长26.2%至2.41万亿日元，事业利润增长44.1%至4398亿日元，成为集团业绩增长的主要动力。 大中华区终于显现修复迹象。2026财年，大中华区收入增长11.3%至7240亿日元，事业利润增长24.6%至1120亿日元。 其中，中国内地按当地货币计算，全年收入增长约3%，事业利润增长约18%，事业利润率提升至约16%。 迅销在最新财报中指出，中国内地经营结构改革稳步推进，已经出现重新进入增长轨道的积极迹象。第四财季，中国内地同店销售进一步改善，休闲内衣、家居休闲裤及AIR", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791466202.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "特朗普“喊话”难再撼动油市，交易员转而紧盯实际供应流向", "url": "https://wallstreetcn.com/articles/3783210", "date": "Thu, 08 Oct 2026 21:29:25 +0800", "desc": "美伊冲突持续七个月后，原油市场对特朗普言论的敏感度已大幅下降，交易员的注意力正从白宫声明转向实物货物流向等供应指标。 随着冲突拖延， 特朗普每一轮表态对油价的冲击力度持续衰减 。10月1日，特朗普警告伊朗若不签署停火协议将\"不复存在\"，油价几乎纹丝不动——而4月1日他发出类似威胁时，布伦特原油单日涨幅一度超过7%，收于每桶109美元上方。这一对比鲜明地揭示出市场情绪的根本性转变。 市场情绪的退潮正在重塑交易行为。据彭博采访的多位原油交易员，他们正在缩减头寸规模，并将精力集中于货运数据等可量化的实物供应信号，而非白宫的外交或军事表态。布伦特原油期货未平仓合约已跌至2025年3月以来最低水平，日内价格波动区间也较战争初期显著收窄。 言论冲击力递减，市场逐渐\"脱敏\" 冲突爆发初期，特朗普的每一句话都牵动着油市神经。交易员密切追踪其表态，试图研判战 , "desc": "arXiv:2610.09115v1 Announce Type: cross Abstract: Steering an LLM agent means deciding whether to correct it, at which step, and with which mechanism. Uncertainty is often used to decide when to correct an agent, but whether it can guide these decisions remains unclear. We steer agent trajectories separately at every non-terminal step with each of four mechanisms and run each continuation to compl", "tags": ["AI", "个人成长"], "topic_score": 9, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1791432000.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27, "title_zh": "从不确定性到行动：学会引导 LLM 智能体", "desc_zh": "arXiv:2610.09115v1 公告类型：cross 摘要：引导 LLM 智能体意味着决定是否纠正它、在哪一步纠正、用哪种机制纠正。不确定性常被用来判断何时纠正智能体，但它能否指导这些决策仍不明确。我们在每个非终末步骤用四种机制分别引导智能体轨迹，并将每条延续运行至完成……"}, {"title": "From Ballet To Breach Prevention: How A Magician’s Son Raised $4.2M In Seed Funding For His Cybersecurity Startup", "url": "https://news.crunchbase.com/cybersecurity/from-ballet-to-breach-prevention-ai-startup-hilt-cielen/", "date": "Wed, 07 Oct 2026 13:00:37 +0000", "desc": "The latest in our series of articles on venture funding to non-tech founders features a former magician's assistant and ballet dancer who's building cybersecurity software with $4.2 million in seed funding.", "tags": ["AI"], "topic_score": 4, "source": "Crunchbase 融资板块", "cat": "创投行业分析", "weight": 5, "ts": 1791378037.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27, "title_zh": "从芭蕾到防入侵：一位魔术师之子如何为其网络安全初创公司融得 420 万美元种子轮", "desc_zh": "我们关于非技术背景创始人风险投资系列文章的最新一篇，主角是一位前魔术师助理兼芭蕾舞者，他正用 420 万美元种子资金打造网络安全软件。"}, {"title": "OpenAI 推出 GPT-6.1 Sol Ultrafast 版：6 倍价格、最高 8 倍速度", "url": "https://www.ithome.com/1/010/768.htm", "desc": "", "date": "", "hot": 0, "tags": ["AI"], "topic_score": 5, "source": "IT之家", "cat": "中文科技财经", "weight": 4, "ts": 0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": true, "rank": 22}, {"title": "Disrupting A const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
