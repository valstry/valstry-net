s-up-defining-moment-for-wall-street-and-ai-boom", "date": "Mon, 26 Oct 2026 23:23:19 GMT", "desc": "Anthropic PBC’s initial public offering is laying bare the stark extremes of the multi-trillion-dollar AI boom business model: astonishing growth paired with uncertainty about demand and the spending required to continue developing the technology. The startup, which publicly filed IPO paperwork on Monday, is poised to be the first major US firm focused solely on building AI software to make its ma", "tags": ["AI", "商业认知"], "topic_score": 7, "source": "Bloomberg Technology", "cat": "金融媒体_英文", "weight": 2, "ts": 1793056999.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26, "title_zh": "Anthropic 的 IPO 为华尔街和 AI 热潮带来决定性时刻", "desc_zh": "Anthropic PBC 的首次公开募股揭示了数万亿美元 AI 热潮商业模式的鲜明两极：惊人的增长，伴随需求的不确定性，以及继续开发该技术所需的支出。这家初创公司周一公开提交了 IPO 文件，有望成为首家专注构建 AI 软件的美国大型公司，从而[……]"}, {"title": "@rabbit.6763032: Still giving despite the emotional imbalance That's a win. Would appreciate a \"hello\" today. Human interaction remains underrated. #E...", "url": "https://www.threads.com/t/De-awOLjeFk", "date": "Mon, 26 Oct 2026 23:03:12 GMT", "desc": "@rabbit.6763032 : Still giving despite the emotional imbalance That's a win. Would appreciate a \"hello\" today. Human interaction remains underrated. #Elon", "tags": ["资本市场"], "topic_score": 3, "source": "Threads-AI讨论", "cat": "AI实战_创作者", "weight": 4, "ts": 1793055792.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "四大华尔街巨头630亿美元豪掷Anthropic算力，博通为芯片残值托底", "url": "https://wallstreetcn.com/articles/3784511", "date": "Tue, 27 Oct 2026 06:33:26 +0800", "desc": "博通携手多家金融机构，构建起迄今最大规模的AI芯片融资交易之一，折射出华尔街对人工智能基础设施建设的持续押注。 美国银行、黑石、花旗及摩根士丹利周一联合宣布， 通过一家新成立的特殊目的载体（SPV），提供总计630亿美元的融资，用于采购博通AI加速器及网络设备，并将其租赁给AI大模型开发商Anthropic。芯片交付预计自2027年起开始。 此次交易规模之大、结构之复杂，令华尔街与硅谷业界高度关注。在数据中心建设遭遇反弹、AI未来需求前景存疑的背景下，这笔交易被市场视为机构资本对AI基础设施投资信心的一次重要背书。 与此同时， Anthropic当日还提交了IPO申请 ，上半年净亏807亿美元，公司称未来可能无法实现盈利，警示人类“生存危机”。 周一博通收涨2.33%。 交易结构：SPV居中，博通兜底 根据各方声明，本次融资通过新设SPV执行，资金用于购置博通XPU AI加速器及网络解决方", "tags": ["AI"], "topic_score": 7, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793054006.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "Alan Chen (@alanchen)", "url": "https://sopilot.net/hot-tweets?tweetId=2114845009099014276", "date": "Mon, 26 Oct 2026 22:21:56 GMT", "desc": "美银、黑石、花旗、摩根士丹利刚刚凑了 630 亿美元，新开一家特殊目的公司，买博通的 XPU 定制 AI 芯片和网络设备，再整批租给 Anthropic，2027 年开始交货。 钱分两层：第一顺位贷款由美银、花旗、大摩安排，第二顺位由黑石独家出。最狠的一条在博通身上：它给这家公司提供\"残值支持\"，金额等于第一顺位贷款的规模。说白了，芯片将来要是不值钱了，银行那一层先由博通兜着。 第一顺位到底多大、利率多少、租几年，这些都是潜在的red flag,暂时还不知道 今早 SpaceX 的 8-K ❤️ 26 🔁 2 💬 6 🔖 0 👀 4963 预测爆火概率:60%，预测浏览量:20000，预测评论浏览量:200 原推链接: https://x.com/alanchen/status/2114845009099014276", "tags": [], "topic_score": 0, "source": "SoPilot 推特起爆帖", "cat": "X起爆帖", "weight": 6, "ts": 1793053316.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26, "title_zh": "Alan Chen (@alanchen)"}, {"title": "相宁 (@xiangning0)", "url": "https://sopilot.net/hot-tweets?tweetId=2114842331287560301", "date": "Mon, 26 Oct 2026 22:11:18 GMT", "desc": "最新的GPT- 6.1 Terra最全详细测评来了： 1.Token速度：这是最让我惊喜的点，实测数据 开xhigh 普通模式均速约81t/s，峰值150t/s，低值62t/s fast模式下均速130t/s，峰值183t/s,低值100t/s 速度相比sol提升巨大 2.额度用量：官方宣称API价格是Sol的一半 相当于额度是sol的两倍，和我实测数据差不多 我测试了马里奥小游戏，用量3500万Tokens，消耗了5X额度的2%，用时20分25秒。 切换到Sol测试同样的任务， ❤️ 93 🔁 4 💬 26 🔖 19 👀 32056 预测爆火概率:100%，预测浏览量:498000，预测评论浏览量:1700 原推链接: https://x.com/xiangning0/status/2114842331287560301", "tags": [], "topic_score": 0, "source": "SoPilot 推特起爆帖", "cat": "X起爆帖", "weight": 6, "ts": 1793052678.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "@stevenwishnoff: I just got a notice from Meta that they’ve linked accounts that I’ve deliberately kept separate - AND IT DOESNT ALLOW ME TO OPT OUT...", "url": "https://www.threads.com/t/De-Sb8SktLE", "date": "Mon, 26 Oct 2 007114-index.htm", "date": "2026-10-26T17:01:43-04:00", "desc": "Filed: 2026-10-26 AccNo: 0001580642-26-007114 Size: 250 KB Item 8.01: Other Events Item 9.01: Financial Statements and Exhibits", "tags": [], "topic_score": 0, "source": "SEC 最新 8-K 申报", "cat": "企业行为_美股披露", "weight": 6, "ts": 1793048503.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "Anthropic正式提交IPO申请！股票代码“ANT”，上半年净亏807亿美元，警示人类“生存危机”", "url": "https://wallstreetcn.com/articles/3784495", "date": "Tue, 27 Oct 2026 05:01:41 +0800", "desc": "全球AI行业最受瞩目的IPO之一，正式进入公开申报阶段。 根据10月26日披露的申报信息，Anthropic正式向美国证券交易委员会（SEC）提交首次公开募股（IPO）申请，计划以股票代码“ANT”在纳斯达克全球精选市场挂牌交易。 同日，据《华尔街日报》报道， Anthropic计划于11月16日当周进行IPO。 此前彭博社报道称，市场传出的目标估值高达2万亿美元，有望超过SpaceX此前创纪录的1.77万亿美元上市规模。路透社报道，在Anthropic于近期一场投资者活动披露部分财务细节后， 部分投资者目前对其估值约为1.5万亿美元，较一周前的约2万亿美元明显下调。 申报文件显示， Anthropic上半年营收163亿美元，上半年净亏损807亿美元。 公司警告投资者， 未来可能无法实现或维持盈利。 不过，据路透社此前对申报材料的报道，807亿美元的净亏损中，其中约720亿美元来自可转换债", "tags": ["AI", "商业认知"], "topic_score": 7, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793048501.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "8-K - DataMeds AI, Inc. (0002030763) (Filer)", "url": "https://www.sec.gov/Archives/edgar/data/2030763/000149315226048573/0001493152-26-048573-index.htm", "date": "2026-10-26T17:00:43-04:00", "desc": "Filed: 2026-10-26 AccNo: 0001493152-26-048573 Size: 472 KB Item 1.01: Entry into a Material Definitive Agreement Item 7.01: Regulation FD Disclosure Item 9.01: Financial Statements and Exhibits", "tags": [], "topic_score": 0, "source": "SEC 最新 8-K 申报", "cat": "企业行为_美股披露", "weight": 6, "ts": 1793048443.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26}, {"title": "8-K - Eva Live Inc (0001983736) (Filer)", "url": "https://www.sec.gov/Archives/edgar/data/1983736/000149315226048572/0001493152-26-048572-index.htm", "date": "2026-10-26T17:00:42-04:00", "desc": "Filed: 2026-10 and \"False\" Add Up to One? Complement Consistency in LLM-Agent Opinion Simulations", "url": "https://arxiv.org/abs/2610.32874", "date": "Mon, 26 Oct 2026 00:00:00 -0400", "desc": "arXiv:2610.32874v1 Announce Type: new Abstract: In LLM-agent opinion simulations, each agent reports the probability that a claim is true after seeing its own previous probability and the probabilities reported by its neighbors, and that number becomes its state in the next round. If the number describes the agent's position rather than the sentence it was shown, then rewriting the claim as its co", "tags": ["AI"], "topic_score": 6, "source": "arXiv cs.AI", "cat": "AI技术前沿", "weight": 3, "ts": 1792987200.0, "opinion": true, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 23}, {"title": "From Review to Authorization: Key-Isolated Threshold Signing for LLM Agents", "url": "https://arxiv.org/abs/2609.05901", "date": "Mon, 26 Oct 2026 00:00:00 -0400", "desc": "arXiv:2609.05901v2 Announce Type: replace-cross Abstract: Autonomous LLM agents can turn semantic judgments into consequential actions such as payments and permission changes. If the same process makes these judgments and controls a reusable signing credential, a mistaken judgment can reach execution without further approval. To make LLM review govern execution, we present KITA, an authorization a", "tags": ["AI"], "topic_score": 6, "source": "arXiv cs.AI", "cat": "AI技术前沿", "weight": 3, "ts": 1792987200.0, "opinion": true, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 23}, {"title": "An Agentic Approach with Evidence-Grounded Verification for Multimodal Emotion Reasoning in Conversation", "url": "https://arxiv.org/abs/2610.31685", "date": "Mon, 26 Oct 2026 00:00:00 -0400", "desc": "arXiv:2610.31685v1 Announce Type: new Abstract: LLM-based multimodal emotion reasoning systems perform well on standard benchmarks, but improving them through instruction tuning can be computationally expensive. Agent gs": [], "topic_score": 0, "source": "Crunchbase 融资板块", "cat": "创投行业分析", "weight": 5, "ts": 1793012438.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21, "title_zh": "当增长势头变成个人风险：Joonko 认罪协议对创始人意味着什么", "desc_zh": "关于客户、收入和 AI 能力的虚假陈述可能使创始人承担个人证券欺诈责任，而 D&O 保险对已成立的违规行为保护有限。特邀作者 Founder Shield 的 Kyle Jeziorski 分享创始人需密切关注的三个保单条款。"}, {"title": "California Startups Have Raised More So Far In 2026 Than The Entire US Ever Has In A Single Year", "url": "https://news.crunchbase.com/venture/california-startups-most-us-funding-2026-openai-anthropic/", "date": "Mon, 26 Oct 2026 11:00:35 +0000", "desc": "California companies have scooped up more than three-fourths of all U.S. startup funding this year. That, per Crunchbase data, is an apparent record share. And keep in mind: This year still has a couple months left.", "tags": [], "topic_score": 0, "source": "Crunchbase 融资板块", "cat": "创投行业分析", "weight": 5, "ts": 1793012435.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21, "title_zh": "加州初创公司 2026 年迄今融资额已超过美国以往任何单年总额", "desc_zh": "加州公司今年已吸纳全美初创融资的四分之三以上。根据 Crunchbase 数据，这似乎是创纪录的份额。别忘了：今年还剩两个月。"}, {"title": "刚刚，Reddit最大开源社区全面封杀AI，Linux和Python被除名", "url": "https://www.36kr.com/p/4042371529921671", "date": "Mon, 26 Oct 2026 07:24:05 GMT", "desc": "开源界刚刚发生了一件魔幻到离谱的大事。 Reddit最大开源社区r/opensource，一纸禁令甩了出来—— 从今天起，全面封杀任何使用AI、由AI生成或专门面向AI的项目！ 版主u/Wolvereness在置顶长文中态度强硬，原话写道：只要你的项目用了AI、由AI编写，或者目标是服务于AI，那么r/opensource就绝不欢迎你。 帖子一出，瞬间引爆了全网围观，评论区彻底炸开了锅。 很快有人发现了一个致命的逻辑漏洞，按这条规矩， 人类史上最伟大的开源项目Linux，已经被「开除」了 。 Linux之父早都上手用Claude Code，辅助写Linux代码了。 一个以「开放、自由」为信仰的社区，开始搞起了「AI血统审查」。而被审查的对象，恰恰是开源精神的祖师爷。 这一幕，堪称2026年开源圈最大的黑色幽默。 一纸禁令：你的Token一文不值 这场风暴的起点，源于r/opensource", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1792999445.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "一位开发者让电视服用了 Claude，这是它系统发生的变化", "url": "https://www.36kr.com/p/4039708325057672", "date": "Mon, 26 Oct 2026 05:52:08 GMT", "desc": "曾几何时，电视在人们心目中，还是个开机就能看、按两下遥控器就能换台的物种。 现在，打开电视准备看部电影，首先映入眼帘的却是一段开机广告。好不容易进了主页，扑面而来的又是满屏的海报推荐、会员充值弹窗，中途按个暂停还会跳出一整张促销贴片。 图｜北京商报 最近，有一群人终于不打算再忍下去了。他们找来了一个意料之外的帮手——AI，试着把电视给「改回去」。 给电视做一场「大扫除」 上周，开发者 Gathin 在社交平台上发了一组给父母改电视的照片。按他的描述，家里的小米电视连打开 Netflix 前都要先看一段赞助广告。 于是，他把电视型号交给了编程助手 Claude Code，让它通过 Wi-Fi 接入设备，一口气停用了 25 个系统组件，再写一个极简桌面——原来杂乱的主页，一下子就变得清爽起来。 他随后把这套 prompt、桌面源码和踩坑记录开源到了 GitHub，项目命名为 CleanYour", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1792993928.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "苹果第二款折叠屏曝光，这次是平板，设备边界要消失了？", "url": "https://www.36kr.com/p/4039837890156419", "date": "Mon, 26 Oct 2026 05:11:21 GMT", "desc": "开发折叠屏设备，只有零次和无数次？ 在首款折叠屏手机iPhone Duo引发轰动后，苹果的第二台折叠屏设备距离我们也不远了。日前数码博主@Kang爆料称，苹果正在测试一款巨大的可折叠平板，类似华为的设备。 该博主提到的华为设备，应该是折叠屏笔记本电脑MateBook Fold。以此来看，苹果这款设备很可能像MateBook Fold一样，集平板电脑和笔记本电脑的优势于一体。 经雷科技（ID：Leitech）查证，早在一年前，天风国际分析师郭明錤就爆料称，苹果正在开发一款折叠屏平板电脑，展开后尺寸为18-20英寸。今年初，彭博社记者马克·古尔曼报道称，苹果仍在推进该项目，但未必能在2028年发布，有可能推迟到2029年。 不过雷科技真正关心的并非这款折叠屏平板电脑本身，而是整个数码科技领域正在模糊手机、平板电脑、笔记本电脑之间的界限，让数码产品像轿跑SUV这类“跨界”车型一样，兼顾不同品类的", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1792991481.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "Validating the Comparison, Not Just the Scorer: Why Overall Accuracy Can Mislead in Interactive LLM Evaluation", "url": "https://arxiv.org/abs/2610.31678", "date": "Mon, 26 Oct 2026 00:00:00 -0400", "desc": "arXiv:2610.31678v1 Announce Type: new Abstract: Many LLM studies compare how models respond to different follow-up prompts. For example, one prompt may neutrally ask a model to reconsider, while another insists that an invented film really exists. The difference is used to measure the effect of conversational pressure. An automatic scorer then labels whether each response makes a  "tags": [], "topic_score": 0, "source": "The Verge", "cat": "科技新闻", "weight": 3, "ts": 1793028394.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 15}, {"title": "【我闻】为“盘踞者”代言 重庆知名女律师关系网的另一面", "url": "https://wenews.caixin.com/2026-10-26/102497605.html", "date": "Mon, 26 Oct 2026 15:20:12 GMT", "desc": "“她对渝中区法律界影响深远”，因此当地律师几乎没人情愿接世贸大厦的几十宗案子 【金融我闻/刘冉】 重庆著名的解放碑步行街，邹容路131号，世贸大厦，这栋曾经的“西南第一高楼”里，商业裙楼已经空置了近20年。两年前，投资人老陈（化名）决定投资这里面的一个商业项目，但没有想到自己遇到的是一个陷阱。 “招商的时候说得特别好，什么‘解放碑核心、世界贸易中心、年客流上亿’，态度也特好，合同签订得很丝滑。”经商多年的老陈没想到投资了世贸大厦内的这个商业项目后，会陷入这样的困境：自己的账户被查封，已经付出的几千万元投资几乎要打水漂。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1793028012.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 15}, {"title": "工抵房成“债务接力棒” 东方雨虹一边收房抵债一边以房抵债", "url": "https://www.caixin.com/2026-10-26/102497502.html", "date": "Mon, 26 Oct 2026 15:20:12 GMT", "desc": "房地产开发商没钱支付工程款，便用房产抵债；接收房产的施工、建材企业如果同样缺钱，又可能将房产抵给自己的供应商 东方雨虹成立于1995年，主营建筑防水材料及防水工程施工，房地产开发商是其重要客户。图：视觉中国 【财新网】 东方雨虹 （002271.SZ）10月25日披露的公告显示，2026年第三季度，该公司作为债权人，通过接受房产等抵债资产处理客户欠款，涉及7549.60万元的债权账面价值；同期又作为债务人，以抵债资产或自有房产抵偿自身欠款，涉及1915.24万元的债务账面价值。 东方雨虹成立于1995年，主营建筑防水材料及防水工程施工，房地产开发商是其重要客户。随着房地产行业进入深度调整期，该公司也面临账款回收和资产减值压力。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1793028012.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 15}, {"title": "港证监放行首批零售代币化基金二级市场全天候交易", "url": "https://finance.caixin.com/2026-10-26/102497570.html", "date": "Mon, 26 Oct 2026 15:20:12 GMT", "desc": "代币化货币市场基金展开二级市场交易，是香港证监会持续推动香港数字资产发展的重要里程碑 根据香港证监会此前的监管通函，代币化产品欲透过香港持牌虚拟资产交易平台进行二级市场交易，无论是新设立的产品，还是现有证监会认可的产品增设代币化功能，都须事先咨询香港证监会的意见，香港证监会则针对逐个产品的申请进行审批。图：视觉中国 【财新网】 香港数字资产生态圈，取得一项重要新进展。经香港证监会批准，华夏基金（香港）旗下两只数字货币基金于2026年10月26日正式开通二级市场7×24小时连续交易。 这是香港首次放行面向零售投资者的代币化基金，在持牌虚拟资产交易平台（VATP）上进行二级市场交易。此前由于香港的代币化产品仅开放一级市场申赎，未能实现二级市场交易，一直被业界认为是代币化发展的短板。 在现行交易所买卖基金及VATP监管制度基础上，香港证监会于2026年4月推出全新监管框架，试行让证监  12}, {"title": "四环向北，AUDI向南：奥迪在中国重新落子", "url": "https://wallstreetcn.com/articles/3784494", "date": "Mon, 26 Oct 2026 21:02:35 +0800", "desc": "酝酿多时，南北奥迪的品牌分工正式明确。 10月26日，奥迪中国宣布，奥迪已分别与中国一汽、上汽集团签署战略协议：中国一汽将强化奥迪四环品牌在智能豪华新能源和燃油车双领域的布局；上汽奥迪则聚焦AUDI字母标品牌，专注新能源市场，推出符合中国消费者需求的下一代智能网联汽车。 就在四天前，奥迪宣布张俊将于11月1日出任奥迪中国总裁，现任Audi Sport负责人Rolf Michl同期出任奥迪中国首席运营官，两人共同组成精简后的中国管理董事会。奥迪在任命公告中强调，要强化本地运营，更快响应客户需求。换帅与划界相继公布，新团队履新前，先有了更明确的业务分工。 这份分工改变了南北奥迪之间的竞争方式。此前，上汽奥迪同时经营四环和AUDI两个品牌，产品包括A7L、Q6、A5L Sportback等燃油车型，以及不同技术路线的纯电车型。这让上汽奥迪拥有较宽的产品覆盖，也增加了它与一汽奥迪在品牌、价格和客户", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793019755.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "拉加德或提前离场，欧洲央行接班之争聚焦谁更能对抗\"债券义警\"", "url": "https://wallstreetcn.com/articles/3784488", "date": "Mon, 26 Oct 2026 20:11:13 +0800", "desc": "法国债市动荡正在深刻重塑欧洲央行的权力交接格局。 法国国债收益率上周触及24年高位，此后虽在穆迪维持评级后短暂企稳，但财政失衡与政治僵局的深层矛盾仍未化解。与此同时，欧洲央行行长拉加德的任期可能提前于明年1月结束，远早于原定的明年10月届满，继任者或将在金融市场动荡尚未平息之际便仓促接棒。 在此背景下， 荷兰人诺特（Klaas Knot）与西班牙人德克斯（Pablo Hernandez de Cos）之间的接班人之争，正日益演变为一场关于\"谁能更有效应对债券义警\"的能力角逐。 前欧洲央行首席经济学家Peter Praet指出，一旦金融市场出现剧烈动荡，央行必须介入，但问题的关键在于\"如何介入，以及介入的速度\"。 法国债市冲击波蔓延至欧洲央行决策 法国国债市场的动荡已开始主导原本聚焦于通胀与增长的欧洲央行政策议程。一次原本旨在评估当前通胀风险与经济增长放缓的例行会议，如今因欧元区第二大经济体", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793016673.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "AI悄然入场：华尔街债券交易员部分工作或将被机器接手", "url": "https://wallstreetcn.com/articles/3784486", "date": "Mon, 26 Oct 2026 19:54:50 +0800", "desc": "债券交易员对人工智能的担忧并非多余，但颠覆不会一蜂而至。 AI智能体在数年内有望承接部分华尔街债券交易工作，但鉴于此前机器人在市场动荡期间的失灵前车之鉴，有经验的人类交易员仍将参与监督。巴克莱银行主题固定收益货币与大宗商品研究主管Zornitsa Todorova表示： \"基于我们与客户的所有交流，每个人都在为此做准备。这是一个缓慢演进的过程，但它肯定会发生。\" 对于日均成交量约620亿美元的美国公司债市场而言，这场变革的影响不容小觑。 据巴克莱估计，未来几年美国投资级债券的电子交易占比或从目前的45%升至65%，高收益债券的电子交易占比则有望从约25%翻倍至50%。 现阶段：AI更多用于辅助决策，而非直接执行交易 目前，率先尝试的机构大多将AI智能体用于信息收集、数据分析、复杂条款解读及新闻摘要提炼，以辅助交易前的决策判断。此 }
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
