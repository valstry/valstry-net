 "ts": 1794443102.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "因丈夫与第三者伪造结婚证并使用，“婚外胚胎案”原配妻子申请刑事立案监督，后续：检察院对其诉求不予支持。江苏无锡 “婚外胚胎” 事件持续引发关注。男子唐先...", "url": "https://www.huxiu.com/moment/1296065.html", "date": "Thu, 12 Nov 2026 00:21:43 GMT", "desc": "因丈夫与第三者伪造结婚证并使用，“婚外胚胎案”原配妻子申请刑事立案监督，后续：检察院对其诉求不予支持。 江苏无锡 “婚外胚胎” 事件持续引发关注。男子唐先生与第三者伪造结婚证，在上海中山医院实施试管婴儿相关操作、培育受精卵。此前唐先生因伪造证件仅被处以行政拘留5日，原配朱女士就此向上海市徐汇区检察院提交材料，申请刑事立案监督。11月11日，朱女士收到徐汇区检察院的审查结果，其立案监督申请未获支持。 公开信息显示，今年5月，公安部门认定唐先生及第三者存在使用伪造国家机关证件的违法行为，对二人均作出行政拘留5日的处罚。据极目新闻此前报道，8月4日，朱女士前往上海市徐汇区人民检察院，针对丈夫伪造证件却仅被行政拘留的处理结果提交申请，请求开展刑事立案监督。11月11日，朱女士再次赴该院，签收了立案监督审查通知书。 极目新闻记者从现场获悉，检察院受理该申请后，对相关材料依法审查，听取了当事人及其代理", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1794442903.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "伊朗高官：美若再动武，参与的欧洲基地皆为目标。伊朗最高国家安全委员会秘书雷扎伊12日表示，如果美国再对伊朗动武，其“参与侵略”的欧洲军事基地也将成为目标...", "url": "https://www.huxiu.com/moment/1296064.html", "date": "Thu, 12 Nov 2026 00:20:56 GMT", "desc": "伊朗高官：美若再动武，参与的欧洲基地皆为目标。 伊朗最高国家安全委员会秘书雷扎伊12日表示，如果美国再对伊朗动武，其“参与侵略”的欧洲军事基地也将成为目标。雷扎伊当天在社交媒体上说，如果美国再对伊朗发动战事，“从西亚到欧洲，参与侵略的每个军事基地都将成为伊朗致命打击的合法目标”，“没有安全之地”。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1794442856.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "Nvidia Working With Outside Firm to Identify CEO Options", "url": "https://www.bloomberg.com/news/videos/2026-11-12/nvidia-working-with-outside-firm-to-identify-ceo-options-video", "date": "Thu, 12 Nov 2026 00:19:45 GMT", "desc": "Nvidia's board has been working with an outside firm to identify potential replacements for Chief Executive Officer Jensen Huang following reports of multiple extramarital affairs, including one with a woman who is reportedly suspected of spying for China. (Source: Bloomberg)", "tags": ["AI"], "topic_score": 3, "source": "Bloomberg Technology", "cat": "金融媒体_英文", "weight": 2, "ts": 1794442785.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "伊朗高官宣布：目前波斯湾内没有美军存在。据伊朗媒体报道，当地时间11日，伊朗武装部队副总参谋长海达里表示，目前，波斯湾内没有美军存在。他指出，如果飞机从...", "url": "https://www.huxiu.com/moment/1296063.html", "date": "Thu, 12 Nov 2026 00:17:56 GMT", "desc": "伊朗高官宣布：目前波斯湾内没有美军存在。 据伊朗媒体报道，当地时间11日，伊朗武装部队副总参谋长海达里表示，目前，波斯湾内没有美军存在。他指出，如果飞机从任何国家飞向伊朗并轰炸了某处目标，伊朗武装部队有权对飞机起飞国境内的相应目标实施打击。海达里还称，“我们已经为未来可能发生的战争建立并准备了一个目标库。”在这个目标库中，地理限制已被取消，伊朗将毫不犹豫地对这些目标实施打击。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1794442676.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "俄外长：美特使将前往莫斯科向普京通报三方会谈相关情况。当地时间11日，俄罗斯外长拉夫罗夫称，俄罗斯总统普京将于12日在莫斯科会见美国总统特使威特科夫和特朗...", "url": "https://www.huxiu.com/moment/1296061.html", "date": "Thu, 12 Nov 2026 00:08:04 GMT", "desc": "俄外长：美特使将前往莫斯科向普京通报三方会谈相关情况。 当地时间11日，俄罗斯外长拉夫罗夫称，俄罗斯总统普京将于12日在莫斯科会见美国总统特使威特科夫和特朗普总统的女婿库什纳。拉夫罗夫在接受采访时表示，他从已经发布的声明中获悉，美国特使将前往莫斯科向普京通报会谈的相关情况，普京也会定期收到俄罗斯代表团团长、俄总统助理梅金斯基的报告，结合从美方那里得知的情况，普京将决定下一步该怎么做。拉夫罗夫还表示，俄方要做的是达成特别军事行动目标。 为期两天的俄罗斯、美国和乌克兰三方会谈11日在阿联酋首都阿布扎比结束。会谈结束后，美国总统特朗普的女婿库什纳表示，他与美国总统特使威特科夫将于12日前往莫斯科与俄罗斯总统普京举行会谈，主要讨论俄美乌会谈的相关内容，并试图在一些问题上取得进展。库什纳称，在莫斯科，除了人道主义问题，美方还将试图与普京讨论让欧洲参与谈判的可能性。而他和威特科夫将在莫斯科之行结束后前", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1794442084.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "机构：英国房屋销售前景创2023年以来最悲观水平。周四公布的一项调查显示，随着抵押贷款利率上升挤压了购房需求，10月份英国房地产测量师对未来短期房屋销售前景...", "url": "https://www.huxiu.com/moment/1296060.html", "date": "Thu, 12 Nov 2026 00:05:47 GMT", "desc": "机构：英国房屋销售前景创2023年以来最悲观水平。 周四公布的一项调查显示，随着抵押贷款利率上升挤压了购房需求，10月份英国房地产测量师对未来短期房屋销售前景的看法降至三年多来的最低点。英国皇家特许测量师学会（RICS）表示，10月份其对未来12个月房屋销售的预期指数降至-17，测量师们预计房屋销售量将出现自2023年7月以来最广泛的下滑。RICS市场研究主管塔兰特·帕森斯（Tarrant Parsons）表示：“购房需求依然低迷，鉴于当前面临的持续宏观经济挑战，受访者正为未来一年更疲软的销售表现做准备。” RICS的核心房价差值指数上月降至-36，低于9月份向下修正后的-34，且降幅略大于媒体调查中-34的预期值。其新买家咨询指数维持在-24，而达成销售指数从-18降至-24，为三个月来的最低水平。在租赁市场方面，租客需求有所增强，而房东减少了挂牌出租的房源数量。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1794441947.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "日本10月国内企业商品物价指数同比7.1%，预期6.5%，前值6.8%。日本10月国内企业商品物价指数环比0.7%，预期0.3%，前值 -0.3%。", "url": "https://www.huxiu.com/moment/1296058.html", "date": "Wed, 11 Nov 2026 23:50:48 GMT", "desc": "日本10月国内企业商品物价指数同比7.1%，预期6.5%，前值6.8%。日本10月国内企业商品物价指数环比0.7%，预期0.3%，前值 -0.3%。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1794441048.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "The unfolding Jensen Huang scandal: a timeline", "url": "https://techcrunch.com/2026/11/11/nvidia-ceo-jensen-huangs-affair-with-alleged-chinese-spy-a-timeline/", "date": "Wed, 11 Nov 2026 23:50:00 +0000", "desc": "The affair could have ramifications for national security as the U.S. and China race to develop the most advanced AI infrastructure.", "tags": [], "topic_score": 0, "source": "TechCrunch", "cat": "科技新闻", "weight": 4, "ts": 1794441000.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "京东今年双11售出超5000万件AI产品。记者获悉，2026年京东11.11共售出超5000万件AI产品。其中AIPC、AI工作站、AI相机、AI眼镜、AI录音设备等AI趋势品成交额同比...", "url": "https://www.huxiu.com/moment/1296057.html", "date": "Wed, 11 Nov 2026 23:49:59 GMT", "desc": "京东今年双11售出超5000万件AI产品。 记者获悉，2026年京东11.11共售出超5000万件AI产品。其中AIPC、AI工作站、AI相机、AI眼镜、AI录音设备等AI趋势品成交额同比增长超100%，“Token”搜索量环比提升超13倍，京东平台大模型Token包销量环比增长超10倍。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1794440999.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "Nvidia Working With Outside Firm to Identify CEO Candidates", "url": "https://www.bloomberg.com/news/articles/2026-11-11/nvidia-working-wi 大空间，是比亚迪当前的畅销车型之一。据比亚迪披露，该产品10月单月销量达到1.4万辆，连续第四个月破万。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1794442249.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "大西洋观察｜南非非国大之殇", "url": "https://international.caixin.com/2026-11-11/102503666.html", "date": "Thu, 12 Nov 2026 00:10:49 GMT", "desc": "当下的南非非国大正处于内外交困的状态。究其根本，则是长期漠视主流黑人民众的利益，将后者的支持视作理所应当 当地时间2026年11月3日，南非约翰内斯堡，各政党在市中心希尔布罗社区的一处投票站外搭建竞选帐篷。图：视觉中国 【财新网】 正处南半球夏季的非洲最大经济体南非，自1994年以来长期执政的非洲人国民大会党（非国大）却感到阵阵寒意。 11月4日开始的南非地方政府选举，非国大虽然凭借30.76%的得票率，勉强保住全国第一大党的位置，但这一得票率相较现任总统拉马福萨2019年就任伊始近三分之二的地方选举得票率，和2021年46%的得票率，下降了近乎一半。 对比大幅下降的得票率，更令非国大痛心的是，全国最重要八大都市区中的六个，非国大都失去执政权。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1794442249.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "蔡天凤碎尸案继续审理 前夫兄长指胞弟是凶手", "url": "https://china.caixin.com/2026-11-11/102503560.html", "date": "Thu, 12 Nov 2026 00:10:49 GMT", "desc": "邝港杰称购买绞肉机等是父亲要求，部分物品供家中使用，部分是替朋友的店铺购买 2023年2月26日，中国香港，蔡天凤大埔龙尾村遇害现场。图：IC photo 【财新网】 轰动香港的名媛蔡天凤碎尸案进入辩方举证阶段，三名被告之间的责任归属成为庭审焦点。11月11日，蔡天凤前夫的兄长邝港杰在香港高等法院出庭自辩时，否认参与谋杀，并称杀害蔡天凤的是其胞弟、蔡天凤前夫邝港智。 邝港杰在代表律师询问下，否认于2023年2月21日杀害蔡天凤，也否认事先知道蔡天凤当天会遇害，或会在其驾驶的七人车内遭到袭击。当律师追问他是否知道真正的凶手时，邝港杰先是点头，随后沉默，最终回答是胞弟邝港智。作供期间，邝港杰一度哽咽，其父亲邝球亦在被告席上拿出纸巾拭泪，邝港智则表现平静、没有特别反应。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1794442249.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "东方通连续四年财务造假被索赔 特别代表人诉讼权利登记启动", "url": "https://finance.caixin.com/2026-11-11/102503701.html", "date": "Thu, 12 Nov 2026 00:10:49 GMT", "desc": "自2020年4月29日（含）至2025年4月14日（含）期间买入东方通股票，并于2025年4月14日收市后仍持有该股票的投资者，属于案件适格索赔权利人 资料图：北京，东方通中间件展台。图：视觉中国 【财新网】 时隔半年， 东方通 证券虚假陈述责任纠纷案再有进展。2026年11月11日下午，北京金融法院发布公告，明确该案适用特别代表人诉讼程序审理。这意味着， 中证中小投资者服务中心有限责任公司 （下称“投服中心”）将接受适格投资者的特别授权，作为代表人参加诉讼。 东方通曾是国产中间件软件龙头企业，连续十余年位居国产中间件市场占有率榜首 距"}, {"title": "2026，AI应用的钱都流向了哪里？", "url": "https://www.36kr.com/p/4064628019598211", "date": "Wed, 11 Nov 2026 01:24:42 GMT", "desc": "2026年，AI融资市场最“大笔”的钱，依然流向大模型、算力等基础能力。但越来越频繁的融资故事，开始发生在应用层。 据智东西统计，2026年上半年，国内AI产业链上亿元融资中，AI应用方向融资事件最多，共33起。其中，视频、图像和3D生成占了近四成，AI Agent约占两成，企业应用、AI医疗/药物、AI金融、AI营销等方向也都出现了亿元级融资。 Megan 是 原点社区 GTM 公益社区发起人， 也 是一名国内C端应用出海操盘手，她告诉「定焦One」，从和投资机构交流的体感来看，今年资本对AI应用的态度经历过一轮变化。上半年整体积极，到了夏末秋初，部分机构转向谨慎，原因有二：一是具身智能等赛道分走了注意力，二是一些AI应用在投入大量资金后，日活、声量和商业化都没有跑出来，退出路径也开始受到更多讨论。进入10月后，市场关注度有所回升，但投资人更看重自研模型能力、技术壁垒或软硬件结合这类能拉", "tags": ["AI"], "topic_score": 4, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1794360282.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 29}, {"title": "EngineAgent: Agentizing On-Device LLM Inference Engines with Inference Stack Hierarchy Awareness and Hardware Abilities", "url": "https://arxiv.org/abs/2611.14356", "date": "Wed, 11 Nov 2026 00:00:00 -0500", "desc": "arXiv:2611.14356v1 Announce Type: cross Abstract: Rapidly evolving LLM architectures and heterogeneous mobile hardware make supporting new models in on-device inference engines a recurring and costly system challenge. Each model may require coordinated changes across conversion, graph construction, operators, and hardware backends. Existing coding agents often miss these cross-layer dependencies a", "tags": ["AI"], "topic_score": 8, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1794373200.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27, "title_zh": "EngineAgent：让端侧 LLM 推理引擎具备 Agent 能力，感知推理栈层级与硬件能力", "desc_zh": "arXiv:2611.14356v1 公告类型：cross 摘要：快速演进的 LLM 架构与异构移动硬件，使端侧推理引擎支持新模型成为反复出现且成本高昂的系统性挑战。每个模型可能需要在转换、图构建、算子和硬件后端之间进行协同修改。现有编码 Agent 往往忽略这些跨层依赖"}, {"title": "周四你需要知道的隔夜全球要闻：AI产业链交易热潮回归，纳斯达克100指数收涨超2%；承销商拟上调Anthropic估值至1.5万亿美元；特朗普据对万斯重启与伊朗谈判持开放态度", "url": "https://www.cls.cn/detail/2532065", "desc": "", "date": "", "hot": 0, "tags": ["AI", "资本市场"], "topic_score": 6 const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
