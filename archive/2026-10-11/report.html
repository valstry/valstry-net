它们可能已被攻破，并建立一套“紧...", "url": "https://www.huxiu.com/moment/1287191.html", "date": "Sun, 11 Oct 2026 00:22:42 GMT", "desc": "微软CEO称AI是潜在内部威胁。 微软公司CEO萨提亚·纳德拉(Satya Nadella)表示，企业应将强大的AI模型视为潜在的内部威胁，假定它们可能已被攻破，并建立一套“紧急刹车”系统，以防止智能体模型失控。纳德拉周六在X平台上发帖称，部署先进AI的企业不应仅仅依赖AI模型开发商的安全保证。“我们必须假定模型已被攻破，并从一开始就对其加以限制。可以把它想象成紧急刹车。获得授权的人员应当始终能够在模型执行任务的过程中暂停或关闭它。”纳德拉表示。 就在纳德拉发表上述言论之际，Anthropic和OpenAI近几个月披露了一系列AI模型出现非预期行为的事件，包括Anthropic的一款模型在一起警方调查的谋杀案中提交虚假线索，以及AI模型多次入侵第三方网站。这些披露加剧了外界对前沿AI安全风险的担忧，也让所谓的AI“紧急关闭开关”再次成为讨论焦点。", "tags": ["AI"], "topic_score": 4, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1791678162.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 28}, {"title": "Nvidia in talks to acquire US 'open' model startup Reflection AI", "url": "https://www.ft.com/content/052610c5-22b4-4dd4-932e-b7f9f0628b6a", "date": "Sat, 10 Oct 2026 18:48:35 +0000", "desc": "Article URL: https://www.ft.com/content/052610c5-22b4-4dd4-932e-b7f9f0628b6a Comments URL: https://news.ycombinator.com/item?id=50035886 Points: 106 # Comments: 75", "tags": ["AI"], "topic_score": 4, "source": "Hacker News 前页", "cat": "AI实战_创作者", "weight": 4, "ts": 1791658115.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 28, "title_zh": "Nvidia 正洽谈收购美国“开放”模型初创公司 Reflection AI", "desc_zh": "文章链接：https://www.ft.com/content/052610c5-22b4-4dd4-932e-b7f9f0628b6a 评论链接：https://news.ycombinator.com/item?id=50035886 得分：106 评论数：75"}, {"title": "OpenAI 只用 15 天，就杀死了估值 100 亿美元的 Jev？", "url": "https://www.infoq.cn/article/qmoRIQ1TceKfKwGlXN0S?utm_source=rss&amp;utm_medium=article", "date": "Sat, 10 Oct 2026 15:11:32 GMT", "desc": "点击查看原文>", "tags": ["AI", "资本市场"], "topic_score": 5, "source": "InfoQ 中文", "cat": "中文商业媒体", "weight": 4, "ts": 1791645092.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 28}, {"title": "Anthropic can’t reliably control its AI agents. It’s cutting off its internal evals from the live intern url": "https://www.36kr.com/p/4019715270397829", "date": "Sat, 10 Oct 2026 08:48:40 GMT", "desc": "今年前八个月，国内50万以上汽车销量前十里有七款国产车[1]：分别是极氪9X、问界M9、岚图梦想家、腾势D9、蔚来ES9、智界V9、极氪8X。 燃油车阵营里，是硕果仅存的三个老网红：奔驰E、奥迪A6L、宝马X5。 不过，易车的榜单筛选口径比较宽，指导价和50万沾上边就行，对经销商打折和配置考虑不多。我们用更窄的口径梳理出两份榜单，也得出了相似的结论： 国产豪华新能源卖的越来越好了。 TOP10畅销车榜单中，自主含量提升非常明显，今年6到8月，份额达到79%。其中，问界M9 30257辆，蔚来ES9 21380辆，理想L9和极氪9X各卖了1万多辆。与消费者体感中，各种各样大六座SUV发布会吻合。 相比之下，曾经加价排队的宝马X5只剩1万出头，夹在极氪9X和009之间。 整体来看，50万以上的豪华车市场，国产品牌存在感确实越来越强。今年上半年，自主品牌份额提高到37%，去年只有29%，三年前还", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1791622120.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "“中国Muse”过不了豆包", "url": "https://www.36kr.com/p/4019540634013572", "date": "Sat, 10 Oct 2026 07:06:42 GMT", "desc": "最近，不少人注意到， 豆包 App开始支持缴纳水费、电费、燃气费等生活费用。 输入“交水费”等提示词后， 豆包 会提示需要绑定户号，并引导用户前往生活缴费界面。 字母榜（ID: wujicaijing） 实测发现，上述界面并非嵌入 豆包 内部，而是抖音此前推出的一款生活服务小程序。 接近 豆包 人士对此表示， 豆包 正在逐步建设出行服务、生活缴费等生活场景下的办事能力。 扩展为个人办事的能力，是 豆包 近期重点投入方向。 国庆假期前不久， 豆包 上线“出行用 豆包 ”，聚集四个功能模块：地图导航、交通出行、酒店住宿和吃喝玩乐，涵盖导航、周边、打车、高铁、机票、酒店、民宿、餐饮、游玩等功能。 更早时候， 豆包 还做了“买前问 豆包 ”，提供商品购买建议和链接，用户无需跳转到App外即可完成消费。 水电费缴纳、叫车、订酒店这类事情，特点是繁琐、刚需、个人化。 豆包 搞定这些工作，就能慢慢培养起", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1791616002.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "South Korean Banks Were Hacked Using Chinese AI Agent, Researchers Say", "url": "https://www.theinformation.com/briefings/south-korean-banks-hacked-using-chinese-ai-agent-researchers-say", "date": "2026-10-10T06:00:13Z", "desc": "", "tags": ["AI"], "topic_score": 3, "source": "The Information", "cat": "金融媒体_英文", "weight": 3, "ts": 1791612013.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21, "title_zh": "研究人员称，韩国银行遭中国 AI 智能体攻击"}, {"title": "OpenAI Researchers Say They Were Fired for “Prioritizing Safety”", "url": "https://www.theinformation.com/briefings/openai-researchers-say-fired-prioritizing-safety", "date": "2026-10-10T06:00:13Z", "desc": "", "tags": ["AI"], "topic_score": 3, "source": "The Information", "cat": "金融媒体_英文", "weight": 3, "ts": 1791612013.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "最会过日子的年轻人，开始让陌生网友审批花钱", "url": "https://www.36kr.com/p/4019364731522952", "date": "Sat, 10 Oct 2026 01:30:31 GMT", "desc": "“填写价格、购买理由和替代品，本身就是一种很短暂的自我审视。写购买理由的时候，你必须回答自己，到底为什么需要它；写替代品的时候，又会提醒自己，是不是已经有类似的东西，或者有没有成本更低的解决办法。很多时候，申请还没有提交，冲动已经消退了一半。” 换季时节，衣柜总会迎来新一轮“扩容危机”。最近，刘伽就看上了一条裤子，她已经在脑海里想好了一整套OOTD：配上刚买的新毛衣，应该会成为秋冬衣橱里的常驻单品。 不过，搬家时整理衣物的经历，让她直观地感受到自己的购买欲有多旺盛。那天之后，她给自己定了一条规则：不要再冲动消费。可就像在夜跑时遇上烧烤，规则遇上购物车时，也往往会变得很脆弱。 （图/《一个购物狂的自白》剧照） 就在这条裤子即将被加入“后悔清单”前，她想起了最近在年轻人中流行的购物审批小程序。人们可以把想买的东西发布到广场上，写下商品价格、购买理由以及替代方案，再由陌生网友帮忙“审批”。 刘伽", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1791595831.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "固态电池，真的要来了", "url": "https://www.36kr.com/p/4019304011976585", "date": "Sat, 10 Oct 2026 01:15:16 GMT", "desc": "从规模取胜，到定义标准的跨越。 赶在今年国庆的前夕，工信部、发改委等七部门，抛出了一份野心勃勃的产业规划。 2026年9月28日，七部门联合印发《新型电池产业发展“十五五”规划》（工信部联规〔2026〕220号）。这是中国电池领域第一份国家级专项规划，也首次把全固态电池写进国家时间表——到2030年，全固态电池初步实现规模化应用。 文件还给出两个更硬的指标，长寿命锂电池循环寿命达到15000次，头部企业产品缺陷率降至PPB级（十亿分之一）。官方以最直接的方式，标明了国内动力电池产业的未来方向。 液态电池眼下仍是绝对主力，全固态却还没跨过量产门槛，中间的落差暂时由混合固液电池填上。这种在很多人看来属于过渡性的产品，已经于去年末开始，陆陆续续量产上市。 ▲ MG4目前的市场表现不错，部分是因为定价问题，但半固态的加分也是有的 上汽集团曾在2024年计划推出智己光年版L6，率先搭载上汽清陶开发的", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1791594916.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "Secret protection must scale with software", "url": "https://github.blog/ai-and-ml/github-copilot/secret-protection-must-scale-with-software/", "date": "Wed, 07 Oct 2026 17:45:34 +0000", "desc": "Developers aren’t e": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1791678024.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "渣打银行高管：人民币国际化进入2.0阶段，商业价值加速显现", "url": "https://finance.caixin.com/2026-10-10/102492182.html", "date": "Sun, 11 Oct 2026 00:20:24 GMT", "desc": "融资成本优势，可能是当前企业扩大人民币使用的重要驱动力之一 央行数据显示，截至2026年一季度末，主要离岸市场人民币存款余额约1.8万亿元，较上年末增加1261亿元，处于历史高位；其中香港10352亿元。图：视觉中国 【财新网】 “人民币正在更广泛地展现自身的商业价值。从结算货币看，中国跨境收付（含贸易和跨境投资）中，已有超过50%以人民币结算。随着CIPS、mBridge、数字人民币，以及数字人民币跨境基础设施‘数币达’（CBETS）等持续释放效能，人民币在跨境结算中的使用还会增加。” 渣打中国 行长兼副董事长 鲁静 近日在接受财新采访时表示。 “我们把当前这一阶段称为人民币国际化的2.0阶段。”鲁静指出，在这一阶段，国际市场对人民币的商业使用需求在多个维度持续提升；从更广的层面看，国际参与者也希望降低对单一货币体系的依赖，寻求更加多元的货币选择，并借助数字货币等创新来进一步便利商业使用", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1791678024.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "[问与答] 想学插花 V 友们有好的课程视频推荐吗？", "url": "https://www.v2ex.com/t/1247757#reply0", "date": "2026-10-11T00:16:51Z", "desc": "", "tags": [], "topic_score": 0, "source": "V2EX 最新", "cat": "AI实战_创作者", "weight": 3, "ts": 1791677811.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "[AI Tools 精品 AI 工具导航] 做了一个 Google Trends 上升词监控工具，适合 SEO 和选题研究", "url": "https://www.v2ex.com/t/1247747#reply1", "date": "2026-10-11T00:16:14Z", "desc": "", "tags": [], "topic_score": 0, "source": "V2EX 最新", "cat": "AI实战_创作者", "weight": 3, "ts": 1791677774.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "[职场话题] 我认为应用开发包括前端正在迎来最好的时代", "url": "https://www.v2ex.com/t/1247755#reply3", "date": "2026-10-11T00:15:42Z", "desc": "", "tags": [], "topic_score": 0, "source": "V2EX 最新", "cat": "AI实战_创作者", "weight": 3, "ts": 1791677742.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "【数据图解】赴韩人数领跑出境游，俄罗斯来华游客数量大增", "url": "https://database.caixin.com/2026-10-10/102492161.html", "date": "Sun, 11 Oct 2026 00:13:59 GMT", "desc": "赴日旅游人数骤降，泰国旅游热度有所回升，8月去韩国的中国游客数量69.8万人次，同比大增了42.5%；前7个月北京接待俄罗斯游客58.22万人次，同比暴增134% 数据来源：各国文旅部门", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1791677639.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "专栏｜美国债务清算时刻逼近", "url": "https://weekly.caixin.com/2026-10-10/102491866.html", "date": "Sun, 11 Oct 2026 00:13:59 GMT", "desc": "一旦利率上升持续推高借贷成本，美国将会怎么做？ 随着高利率持续推高财政赤字，政府面临三种选择：增税、削减支出，或者继续举债。大多数情况下，美国政府都会选择继续举债。 图：IC photo 文｜肯尼斯·罗格夫 哈佛大学经济学与公共政策教授 国际货币基金组织前首席经济学家 美国的财政状况越来越像一列沿着蜿蜒山路疾驰的火车，似乎没有人愿意让列车减速。因为他们担心一旦速度放缓、落后于既定进度，就会丢掉工作。即使这列火车并没有脱轨，也值得追问：为什么还要继续加速前行？尽管美国经济保持稳健增长，联邦财政赤字仍约占美国国内生产总值（GDP）的6%。然而，在美国总统特朗普的施政选项中，似乎并没有减少赤字这一项。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1791677639.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "超强厄尔尼诺事件形成 为有监测以来最强", "url": "https://science.caixin.com/2026-10-10/102492120.html", "date": "Sun, 11 Oct 2026 00:13:59 GMT", "desc": "此前共监测到三次超强厄尔尼诺事件，分别发生于1982—1983年、1997—1998年和2014—2016年。专家提示，厄尔尼诺对中国夏季降水的影响具有明显滞后性，2027年长江流域出现较重洪涝灾害的风险较大 9月，赤道太平洋大部海表温度较常年同期偏高，东太平洋暖水中心偏高3.0℃以上。图：国家气候中心 【财新网】 10月9日，国家气候中心、国家海洋预报台先后发出通报，宣布2026/27年超强厄尔尼诺事件已于9月正式形成，类型为东部型，即海温暖中心位于赤道东太平洋。预测显示，未来三个月赤道中东太平洋海表温度将继续升高，在秋末冬初达到峰值。国家气候中心表示，此次厄尔尼诺事件将成为有系统性监测以来最强厄尔尼诺事件。 数据显示，自有监测记录以来，此前共出现过三次超强厄尔尼诺事件，分别发生于1982—1983年、1997—1998年和2014—2016年。国家气候中心首席预报员赵俊虎在接受媒体采访", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1791677639.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "特稿｜横州溃坝启示", "url": "https://science.caixin.com/2026-10-10/102491778.html", "date": "Sun, 11 Oct 2026 00:13:59 GMT", "desc": "造成上百人遇难失联的溃坝事件是怎样发生的？极端降水事件频发，中国现存超9万座土石坝如何应对超标准洪水的挑战？ 横州六蓝水库东坝和主坝，如今水库干涸见底，只有少量流水。 【财新网】 洪水过后近两个月，广西南宁横州市云表镇更像是一个干旱少雨的西北村镇。洪水裹挟而来的淤泥已经板结，被过往车辆碾作尘土。只要有风吹来，尘灰遮天蔽日，甚至看不清对面的行人。往上游走，溃坝后的六蓝、云表水库早已干涸，库底斑驳，像沙漠中分布着大大小小的绿洲。 受台风“美莎克”影响，2026年7月上旬，广西遭遇大范围持续性强降雨，南宁、贵港、钦州等多地发生超历史极值降水，多座中小型水库出现漫顶溃坝险情。7月6日，横州市六蓝、云表等水库接连溃决。据南宁市政府通报，截至8月21日，南宁市因灾遇难136人、失联10人，其中横州六蓝、云表等水库溃坝洪灾遇难107人、失联7人。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1791677639.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "天眼｜西班牙：房困引政争", "url": "https://weekly.caixin.com/2026-10-10/102491940.html", "date": "Sun, 11 Oct 2026 00:12:03 GMT", "desc": "图｜Emilio Morenatti/视觉中国 当地时间2026年10月5日，西班牙巴塞罗那，住房问题抗议者在示威活动中与警方发生冲突，点燃了垃圾桶。此前数小时，西班牙首相佩德罗·桑切斯宣布解散众议院，将大选提前至11月29日举行。9月下旬，马德里87岁老人玛丽亚·德尔卡门·阿巴斯卡尔被从居住了70多年的公寓强制驱逐，西班牙积压已久的住房矛盾迅速发酵。10月2日，众议院否决政府两项紧急住房法令，引发全国约50城大规模示威。10月5日晚间，巴塞罗那数万人的示威演变为警民冲突，28名警察受伤、13人被捕。10月6日，政府绕开议会以法令形式批准21项住房紧急措施，包括租金年涨幅上限2%、暂停驱逐、限制企业购房等，部分条款已于10月8日生效。■", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1791677523.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "中欧就混动汽车贸易达成谅解 未来四年中国出口如何削减一半？", "url": "https://www.caixin.com/2026-10-10/102492100.html", "date": "Sun, 11 Oct 2026 00:08:40 GMT", "desc": "欧洲汽车工业协会称，2026年上半年，中国品牌在欧洲混动汽车市场的份额已达14%，其中在插电式混动汽车市场的份额更是高达25% 10月8-9日，商务部部长王文涛在北京与欧委会贸易和经济安全委员谢夫乔维奇共同主持召开中欧贸易投资磋商机制第二次例会并发表联合声明。图：商务部 【财新网】 经过密集磋商，中欧双方以符合世贸组织规则的方式就混动汽车贸易达成了谅解。10月9日，中国商务部发布中欧贸易投资磋商机制第二次例会联合声明，提及上述内容。 中欧双方尚未披露将就混动汽车贸易采取哪些具体措施。在接受媒体采访时，欧盟委员会（下称“欧委会”）贸易和经济安全委员马罗什·谢夫乔维奇（Maroš Šefčovič）称，未来四年，中国混动汽车对欧出口规模可能比原先预计的减少一半以上，涉及数百万辆。 谢夫乔维奇解释称，50%降幅的基准是欧委会对未来四年中国混动汽车出口的预测值。这意味着，双方采取的措施并不会导致当", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1791677320.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "财新观察｜与诺奖相比，诺奖级成果是第一位的", "url": "https://weekly.caixin.com/2026-10-10/102491859.html", "date": "Sun, 11 Oct 2026 00:06:57 GMT", "desc": "以更平和的心态审视获奖，更容易客观理性把握中国科研所处的位置 当地时间2 const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
