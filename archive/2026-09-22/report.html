main{padding:16px 20px;max-width:1080px;margin:0 auto}

.body{flex:1;min-width:0}
.t{font-size:14.5px;font-weight:600;margin-bottom:5px}

.tg{background:#21262d;padding:1px 7px;border-radius:9px}
.rk{color:#6e7681}
.age{color:#7ee787}
.orig{color:#6e7681;font-size:11.5px;margin:-2px 0 5px}
.dsc{color:var(--dim);font-size:12.5px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--dim);text-align:center;padding:50px}
#sel{position:fixed;right:18px;bottom:18px;background:var(--star);color:#000;padding:9px 15px;border-radius:20px;font-weight:700;cursor:pointer;box-shadow:0 3px 14px rgba(0,0,0,.5);display:none;font-size:13px}

sistant 开头的消息为 \"```python\\n\" 来强制模型输出 python 代码，并设置 stop 参数为 ['```'] 来避免模型的额外解释。 from openai import OpenAI client = OpenAI ( api_key = \"<your ", "tags": [], "topic_score": 0, "source": "DeepSeek 官方", "cat": "AI厂商官方", "weight": 7, "ts": 0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 31}, {"title": "JSON Output", "url": "https://api-docs.deepseek.com/zh-cn/guides/json_mode", "date": "Invalid Date", "desc": "在很多场景下，用户需要让模型严格按照 JSON 格式来输出，以实现输出的结构化，便于后续逻辑进行解析。 DeepSeek 提供了 JSON Output 功能，来确保模型输出合法的 JSON 字符串。 注意事项 设置 response_format 参数为 {'type': 'json_object'} 。 用户传入的 system 或 user prompt 中必须含有 json 字样，并给出希望模型输出的 JSON 格式的样例，以指导模型来输出合法 JSON。 需要合理设置 max_tokens 参数，防止 JSON 字符串被中途截断。 在使用 JSON Output 功能时，API 有概率会返回空的 content。我们正在积极优化该问题，您可以尝试修改 prompt 以缓解此类问题。 样例代码 这里展示了使用 JSON Output 功能的完整 Python 代码： import ", "tags": [], "topic_score": 0, "source": "DeepSeek 官方", "cat": "AI厂商官方", "weight": 7, "ts": 0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 31}, {"title": "Files API", "url": "https://api-docs.deepseek.com/zh-cn/guides/files_api", "date": "Invalid Date", "desc": "Files API 让你上传图片，之后通过 file_id 引用。推荐在以下场景使用： 在多个请求中复用同一张图片，无需重复上传。 发送会超过 48 MiB 请求体限制或 32 MiB 单图内联限制的图片（见 图像理解：限制 ）。 上传的文件与 deepseek-flash 模型配合使用。如何在对话请求中引用已上传的文件，请参考 图像理解 。 支持的格式： JPEG、PNG、GIF、WebP 。格式由文件实际内容判断。 以下示例的 base_url 为 https://api.deepseek.com 。 上传文件 通过 multipart/form-data 请求向 POST /files 上传文件。单个文件最大 64 MiB ，上传需在 10 分钟 内完成。 表单字段： 字段 是否必填 说明 file 是 要上传的图片文件。 purpose 是 必须为 user_data 。 expi", "tags": [], "topic_score": 0, "source": "DeepSeek 官方", "cat": "AI厂商官方", "weight": 7, "ts": 0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 31}, {"title": "上下文硬盘缓存", "url": "https://api-docs.deepseek.com/zh-cn/guides/kv_cache", "date": "Invalid Date", "desc": "DeepSeek API 上下文硬盘缓存技术对所有用户默认开启，用户无需修改代码即可享用。 用户的每一个请求都会触发硬盘缓存的构建。若后续请求与之前的请求在前缀上存在重复，则重复部分只需要从缓存中拉取，计入“缓存命中”。 缓存落盘与命中规则 缓存命中的前提是相应前缀已被“落盘 mes", "cat": "金融媒体_英文", "weight": 2, "ts": 1789976745.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "AI狂飙背后的“债务黑洞”：未来5年或需1.2万亿美元外部融资", "url": "https://wallstreetcn.com/articles/3782200", "date": "Mon, 21 Sep 2026 14:50:16 +0800", "desc": "全球AI基础设施建设正以史无前例的速度燃烧资本，但支撑这场\"超级周期\"的债务引擎已悄然膨胀至令市场警觉的规模。随着越来越多的科技巨头陷入自由现金流负值，外部融资需求将不可避免地持续攀升。 据高盛最新测算， 2027年超大规模云服务商（Hyperscaler）全球直接债务发行规模预计将达4200亿美元，较2026年全年预估的2500亿美元增逾60%。 与此同时，美国银行在其最新报告中测算，到2030年，以微软、亚马逊、Alphabet、Meta、甲骨文、SpaceX、Coreweave及Nebius为代表的核心AI基础设施主体， 外部融资总需求将达1.2万亿至1.5万亿美元，若以债务为主要融资渠道，预计每年将为信贷市场带来逾3000亿美元的增量供给，短期内甚至有望冲至5000亿美元。 这一债务扩张浪潮不仅波及投资级债券市场，更通过表外特殊目的载体（SPV）、基础设施融资、私募信贷等多条渠道持", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1789973416.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "IMF：全球债务2029年将超GDP", "url": "https://wallstreetcn.com/articles/3782193", "date": "Mon, 21 Sep 2026 14:40:50 +0800", "desc": "国际货币基金组织警告，全球公共债务将比此前预期提前两年突破GDP总量，美国债务路径被明确点名为\"不可持续\"，全球财政整顿的紧迫性显著上升。 IMF总裁Kristalina Georgieva于20日在纽约出席卡塔尔政府主办的经济论坛时表示，各国在巩固财政状况方面行动远远不够。 据彭博报道，她指出，IMF最新预测显示，受美国等政府借贷快速攀升驱动， 全球公共债务将于2029年超过全球GDP的100%，较此前预期提前整整两年。 在美国财政问题上，Georgieva表示已就此与美国财政部长Scott Bessent进行专项讨论，双方均认同当前美国债务结构不可持续，美国需逐步压缩预算赤字与债务规模。与此同时，她还警告中东战事可能对全球经济造成冲击，并对卡塔尔凭借充裕财政缓冲抵御冲击的能力给予正面评价。 债务警戒线提前触及，美国等政府借贷是主因 IMF此次上调债务风险预警的核心依据，在于美国等政府借", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1789972850.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "报道：三星明年HBM4/HBM4E产量或翻倍，产品占比将从40%升至80%", "url": "https://wallstreetcn.com/articles/3782197", "date": "Mon, 21 Sep 2026 14:40:45 +0800", "desc": "三星电子正大举押注下一代高带宽内存，公司在AI存储芯片竞争中正全面转向高附加值产品。 据首尔经济日报报道，三星电子计划将HBM生产工艺中不可或缺的\"玻璃载板\"的外包清洗量， 从今年每月2万片提升至明年每月5万片，增幅达2.5倍。 行业人士据此判断， HBM4及HBM4E的实际产量明年将较今年至少翻倍。 与此同时，三星HBM整体月均投片量预计将从今年约18万片扩大至明年约25万片，增幅近40%。 产量扩张背后，是三星对高世代产品的战略集中 明现在已经通过了Lean 4的形式化验证。 摘不下的明珠 在这之前，哥德巴赫猜想这个幽灵，已经折磨了人类数学家近三个世纪。 1742年，哥德巴赫在欧拉的信中提出这个猜想：「任一大于2的偶数，都可以写成两个素数之和。」 为了它，无数人耗尽心血。从哈代、李特尔伍德，到陈景润证明「1+2」，人类始终无法皇冠上的明珠——「1+1」。 这是因为，素数的分布太诡异了！ 既然死磕行不通，数学家们脑洞大开，搞出一套「替身文学」——刘维尔版本的", "tags": ["AI"], "topic_score": 4, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1789957790.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 29}, {"title": "Show HN: PokerTools Arena – Local AI vs. AI Poker LLM Benchmark Table", "url": "https://github.com/pokertools-arena/pokertools-arena.github.io", "date": "Mon, 21 Sep 2026 15:00:39 +0000", "desc": "Article URL: https://github.com/pokertools-arena/pokertools-arena.github.io Comments URL: https://news.ycombinator.com/item?id=49788178 Points: 3 # Comments: 0", "tags": ["AI"], "topic_score": 3, "source": "HN Show HN", "cat": "AI实战_创作者", "weight": 5, "ts": 1790002839.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 29, "title_zh": "Show HN：PokerTools Arena——本地 AI 对 AI 扑克 LLM 基准排行榜", "desc_zh": "文章链接：https://github.com/pokertools-arena/pokertools-arena.github.io 评论链接：https://news.ycombinator.com/item?id=49788178 得分：3 评论数：0"}, {"title": "Nscale IPO Files to Go Public, Shows Huge Revenue Jump And Steep Losses", "url": "https://www.theinformation.com/briefings/nscale-ipo-files-go-public-shows-huge-revenue-jump-steep-losses", "date": "2026-09-21T11:46:16Z", "desc": "", "tags": ["企业落地", "商业认知"], "topic_score": 4, "source": "The Information", "cat": "金融媒体_英文", "weight": 3, "ts": 1789991176.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 25, "title_zh": "Nscale 提交 IPO 文件拟上市，营收大增但亏损严重"}, {"title": "Do Personality-Tuned LLMs Make Better Social Agents?", "url": "https://arxiv.org/abs/2609.21857", "date": "Mon, 21 Sep 2026 00:00:00 -0400", "desc": "arXiv:2609.21857v1 Announce Type: new Abstract: LLMs are increasingly used in social simulations for socially interactive agents and robots, o const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
