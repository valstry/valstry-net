工智能模型。 9月30日，Synopsys在投资者峰会上宣布与OpenAI的合作，双方将共同开发用于芯片业务的AI模型。 该模型将被命名为 GPT-Synopsys，它将经过专门训练和调整，以承担芯片设计任务。这些任务从用类似代码的语言描述芯片电路开始，一直到确定如何在小块硅片上布局数十亿个晶体管。 根据协议， OpenAI将向Synopsys支付工具授权订阅费用，双方在客户使用该产品时按芯片设计改进成效分享收入。 消息公布后，Synopsys股价盘中一度上涨逾7%，尾盘涨幅回落仍收涨4.78%。 OpenAI联合创始人Greg Brockman表示，GPT-Synopsys将帮助工程师减少芯片设计周期中的数周乃至数月时间，并推动更多芯片进入市场。", "tags": ["AI"], "topic_score": 6, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790801520.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 22}, {"title": "美FTC被曝加大对Anthropic、OpenAI等AI巨头调查力度，官员称不会妨碍AI主导地位", "url": "https://wallstreetcn.com/articles/3782844", "date": "Thu, 01 Oct 2026 00:07:21 +0800", "desc": "美国联邦贸易委员会（FTC）正在加大对前沿AI实验室的全面调查力度，以揭示其技术可能给消费者带来的潜在风险，并计划向这些科技巨头下达类似于传票的正式调取信息的要求。 一名FTC高级官员向《纽约邮报》透露， FTC主席Andrew Ferguson已于数周前启动调查，调查对象涵盖Anthropic、OpenAI及其他顶级AI实验室。 目前FTC正在起草\"民事调查要求\"（Civil Investigative Demands，CIDs），其效力类似于传票，将强制Anthropic等AI巨头高管就其产品及据称存在的潜在消费者风险作证，并提交相关文件。CIDs预计将于未来数周内正式发出。 该FTC官员还表示： \"我们必须绝对赢得这场超智能竞争，而我们正在取得胜利，但民主党想要摧毁这项技术，这既不是主席感兴趣做的事，也绝非总统感兴趣做的事。\" FTC的调查与维持美国AI领域主导地位并不矛盾，该官员强", "tags": ["AI"], "topic_score": 7, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790784441.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 22}, {"title": "高盛策略师警示：盈利支撑暂稳股市，美债抛售若提速，美股或将承压", "url": "https://wallstreetcn.com/articles/3782845", "date": "Wed, 30 Sep 2026 23:59:54 +0800", "desc": "全球债券收益率徘徊在数十年高位附近，美股韧性正面临考验。 高盛首席全球股票策略师Peter Oppenheimer警告称，如果债券市场抛售进一步加剧，尤其是收益率以较快速度上行，美国股市可能迅速变得脆弱。他表示，真正需要关注的是债券市场是否会从当前水平出现更大幅度、更加剧烈的抛售。他称：“在这种情况下，我认为股市将变得脆弱。” 他指出，今年企业盈利表现较为健康，在一定程度上消化了美股估值压力，为股市抵御债券收益率上行提供了一定缓冲。 目前，股市尚未因债券市场持续抛售而受到明显冲击。但随着全球平均债券收益率在这个动荡的9月结束之际仍处于数十年高位附近，债券收益率上行与企业盈利增长之间的拉锯，正成为市场关注的焦点。 盈利仍提供支撑，但缓冲并非无限 Oppenheimer认为，当前美国股票市场的盈利基本面依然较为积极。经过数年的利润增长，企业仍受益于名义经济扩张，通胀和实际产出增长共同推高企业营", "tags": ["商业认知", "资本市场"], "topic_score": 7, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790783994.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 22}, {"title": "股价反弹40%后， 美光今夜迎财报大考：净利预期暴增超1000%，市场紧盯明年AI资本开支", "url": "https://wallstreetcn.com/articles/3782836", "date": "Wed, 30 Sep 2026 20:18:34 +0800", "desc": "美光科技将于周三美股收盘后公布财报，市场焦点已从业绩本身转向管理层对超大规模云计算客户明年AI资本开支前景的表态。这一表态将直接决定股价自7月低点反弹40%的行情能否延续。 在AI基础设施需求持续旺盛的背景下，美光股价已从7月29日低点累计反弹逾40%，市值增加约3700亿美元。Synovus Trust高级投资组合经理Daniel Morgan表示， 若管理层在财报电话会上明确表示\"不预期超大规模客户明年大幅削减资本开支预算，并预计支出将持续\"，将对股价形成强劲催化。 然而，尽管近期基本面强劲，美光股价仍以约7倍远期市盈率交易，远低于过去两年约10倍的均值，也大幅落后于标普500指数的19倍。市场对2027至2028财年增速大幅放缓的预期，以及内存行业固有的周期性风险，持续压制估值。 盈利有望上修，但幅度收窄 分析师普遍预计美光本季度业绩将创历史新高，但上修空间较前几个季度有所收窄。 据", "tags": ["企业落地", "资本市场"], "topic_score": 8, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790770714.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 22}, {"title": "DeepSeek官方开源昇腾基础组件，与昇腾共建高效易用的AI芯片软件生态", "url": "https://www.qbitai.com/2026/09/499263.html", "date": "Wed, 30 Sep 2026 02:53:17 +0000", "desc": "", "tags": ["AI"], "topic_score": 3, "source": "量子位", "cat": "中文商业媒体", "weight": 4, "ts": 1790736797.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 22}, {"title": "00后捧红的“穷鬼天堂”，成了国庆最狠镰刀", "url": "https://www.36kr.com/p/4006810439733378", "date": "Thu, 01 Oct 2026 08:22:33 GMT", "desc": "“前闻汗味后闻屁，内急难寻方便地。双腿发软钱花光，一身疲惫回故乡。” 国庆假期刚刚第一天，各大景区已经毫无悬念地再次挤成了“人从众𠈌”。 有人总结出假期景点现状：跨过山河大海，却走不出人山人海；泰山还没看到，先把人山看够了；不到长城非好汉，一到长城全是汗。 景区里寸步难行，路上也没好到哪去。 有人29号就提前请假，自以为能凭错峰出行畅通无阻。 却没想到，高架桥上都是提前请假的大聪明，硬生生把错峰也挤成了高峰。 人挤人的景区，让许多人心有余悸，于是把目光投向县城。 毕竟，在社交媒体的推波助澜下，“县城游”早已和三个关键词划上等号：清净、便宜、不商业化。 但今年国庆，不少人很快发现：自己还是太天真了。 曾经性价比拉满的县城游，早已化身最狠镰刀，等着收割反向旅游的游客们。 《时代周报》指出，浙江淳安县一家酒店，平时299元，国庆涨到了949元，涨幅超过 200% 。 广东汕头一家酒店，更是堪称最", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1790842953.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "卡戴珊“闯中”太接地气，但700块一件的网红衣还卖得动吗？", "url": "https://www.36kr.com/p/4006830758989953", "date": ent/1285192.html", "date": "Thu, 01 Oct 2026 23:58:27 GMT", "desc": "薛之谦演唱会突发屏幕故障，当场叫停演出，在线监督工作人员修屏幕，喊话团队“没有下一次了”。 10月1日晚，薛之谦“万兽之王”演唱会成都站在成都东安湖体育公园主体育场唱响。演唱会现场出现了一个小插曲，其中一块屏幕突然坏了。 薛之谦发现后，干脆停下演唱，假装生气的样子站在舞台上，在线监督工作人员抢修大屏幕，非要等修好了才肯继续唱。期间，还对硬体团队放话“我再说一遍，没有下一次了”。 这一幕让全场歌迷笑翻，纷纷直呼“薛之谦太宠粉了”。 公开资料显示，薛之谦，汉族，1983年7月17日出生于上海，毕业于格里昂酒店管理学院，华语流行乐男歌手、影视演员、音乐制作人。 2005年，薛之谦因参加选秀节目《我型我秀》而正式出道。2006年6月12日，他发行个人首张同名专辑《薛之谦》，随后凭借歌曲《认真的雪》获得广泛关注。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1790899107.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "东京通胀加速，大幅高于日本央行目标。随着部分临时性政府政策效应消退，东京核心通胀指标大幅走高，印证日本央行在加快政策正常化步伐后，将继续上调基准利率的...", "url": "https://www.huxiu.com/moment/1285191.html", "date": "Thu, 01 Oct 2026 23:39:31 GMT", "desc": "东京通胀加速，大幅高于日本央行目标。 随着部分临时性政府政策效应消退，东京核心通胀指标大幅走高，印证日本央行在加快政策正常化步伐后，将继续上调基准利率的立场。日本总务省周五公布的数据显示，东京9月剔除生鲜食品的消费者物价指数同比上涨2.7%。该数据高于经济学家预期中值2.3%，上月增幅为1.8%。此前，东京扩大育儿补贴以及夏季水费减免政策压低了该项通胀指标，因此市场普遍预期本次数据将出现加速上涨。CPI的飙升印证了日本央行的担忧：通胀上行风险或将推动核心物价趋势突破2%的目标。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1790897971.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "市场消息：Netflix宣布与西班牙流媒体平台Filmin达成合作协议，向西班牙用户开放精选内容的月度观看权限。", "url": "https://www.huxiu.com/moment/1285190.html", "date": "Thu, 01 Oct 2026 23:39:09 GMT", "desc": "市场消息：Netflix宣布与西班牙流媒体平台Filmin达成合作协议，向西班牙用户开放精选内容的月度观看权限。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1790897949.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "中方：中国对安理会有关伊朗制裁问题的决议草案投了反对票，是为了坚持正确的是非观、维护中东地区长治久安，中国在伊朗核问题上没有私利。10月1日，中国常驻联...", "url": "https://www.huxiu.com/moment/1285188.html", "date": "Thu, 01 Oct 2026 23:22:42 GMT", "desc": "中方：中国对安理会有关伊朗制裁问题的决议草案投了反对票，是为了坚持正确的是非观、维护中东地区长治久安，中国在伊朗核问题上没有私利。 10月1日，中国常驻联合国副代表孙磊大使在联大否决权问题特别会议上发言指出，日前，中国对安理会有关伊朗制裁问题的决议草案投了反对票，是为了坚持正确的是非观、维护伊朗核问题政治解决大局、妥善解决防扩散关切，以及中东地区长治久安。孙磊大使强调，中国在动用否决权问题上一贯极为慎重，但作为安理会常任理事国，在事关大是大非、公道正义的问题面前，中国也绝不会放弃原则。 中国在伊朗核问题上没有私利，中方的出发点始终是维护多边主义和安理会权威，维护国际核不扩散体系和地区和平稳定。中国愿继续同各方一道，为推动政治解决伊朗核问题作出不懈努力。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1790896962.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "桂林文促会：向阿丘诚恳致歉。9月30日，广西桂林市中华文化促进会（桂林文促会）在其微信公众号发布公告称，近日接到群众举报线索，反映原央视主持人阿丘（本名...", "url": "https://www.huxiu.com/moment/1285187.html", "date": "Thu, 01 Oct 2026 23:18:31 GMT", "desc": "桂林文促会：向阿丘诚恳致歉。 9月30日，广西桂林市中华文化促进会（桂林文促会）在其微信公众号发布公告称，近日接到群众举报线索，反映原央视主持人阿丘（本名邱孟煌）在桂林举办收费活动过程中，擅自使用“中华文化促进会”等名义开展宣传、为活动做信用背书，对社会公众造成明显误导。长安街知事注意到，10月1日上午，该公众号上已找不到该公告。 10月1日14时许，阿丘本人回应“被通报”，表示此次活动符合规定，不存在所谓“冒用名义”的情况，桂林文促会发布的公告涉嫌严重侵犯其名誉权，要求对方配合完成后续澄清义务，并向他赔礼道歉，消除严重的社会负面影响。阿丘表示，保留通过法律途径追究桂林市文化促进会相关法律责任的权利。 10月1日15时许，中华文化促进会文旅创新工作委员会发布声明，澄清阿丘以该工委会常务副主任身份出席活动并致辞，属于正常履职工作，无需地方分支机构报备，全程合规合法，无任何违规违纪行为。 1日", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1790896711.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "中方代表古巴、朝鲜、伊朗、俄罗斯等28个国家在联大三委作共同发言：当前单边强制措施大行其道，敦促国际社会坚决遏止这一非法行径。中国常驻联合国代表傅聪1日...", "url": "https://www.huxiu.com/moment/1285185.html", "date": "Thu, 01 Oct 2026 23:12:31 GMT", "desc": "中方代表古巴、朝鲜、伊朗、俄罗斯等28个国家在联大三委作共同发言：当前单边强制措施大行其道，敦促国际社会坚决遏止这一非法行径。 中国常驻联合国代表傅聪1日代表28个观点相近国家在联大第三委员会就单边强制措施作共同发言，敦促国际社会坚决遏止这一非法行径。 傅聪说，当前单边主义肆意蔓延，单边强制措施大行其道。历史证明，单边强制措施是造成国际乱象、破坏世界秩序的罪魁祸首之一。国际社会必须保持清醒，加强团结合作，坚决遏止这一非法行径。发展中国家及其人民仍在继续遭受单边强制措施的负面影响。这些单边强制措施违背主权平等与合作原则，干涉他国内政，违反《联合国宪章》宗旨和原则，有悖于多边主义和国际法。 傅聪说，尽管国际社会反复呼吁立即取消单边强制措施，但这些非法举措继续对目标国家及其人民造成严重后果，甚至危及生命。单边强制措施以及次级制裁和过度遵守，加剧当前人道和经济挑战，严重威胁粮食、能源和金融安全。将", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1790896351.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "麦当劳荃湾的铺位以1.2亿港元卖出39年内升值14倍。据报道，麦当劳以1.2亿港元(约153 s://wallstreetcn.com/articles/3782890", "date": "Thu, 01 Oct 2026 22:08:14 +0800", "desc": "先行指标显示，过去一个月，美国制造业扩张势头延续，但企业面临的成本和供应链压力明显升温。 美东时间10月1日周四，美国供应管理协会（ISM）公布，美国9月ISM制造业指数较8月的54.6略为降至54.5，低于市场预期的55.0，在7月该指数创四年新高后连续两个月下滑。当天稍早公布的美国9月标普全球制造业PMI终值为54.8，创2022年5月以来新高，高于8月终值53.9，但低于9月初值57.0。 虽然继续回落，但ISM制造业指数已连续九个月处于50这一荣枯线上方，标志着进入2026年以来制造企业活动持续处于扩张区间。分项指标则凸显了通胀上行的压力：衡量企业原材料成本的价格指数从8月的71.1大幅升至77.9，为5月以来四个月最高水平。 数据公布后，市场对经济有韧性、通胀压力却重新抬头的担忧升温。美股大盘下行，盘初转跌的道指跌幅扩大，周四小幅高开的标普500指数和高开的纳指均转跌；美国国债市", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790863694.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "全球债市风暴中，韩国减少国债发行，日本表示将适当控制年度国债总发行量", "url": "https://wallstreetcn.com/articles/3782886", "date": "Thu, 01 Oct 2026 19:47:59 +0800", "desc": "全球债市抛售潮持续蔓延之际，亚洲两大经济体相继出手，试图通过压缩国债供给稳定本国债券市场。 韩国财政部10月1日宣布，当月国债发行量较原计划削减5万亿韩元，降至12万亿韩元，并明确表示“如有需要将考虑进一步削减国债发行”。与此同时，日本首相高市早苗表示，将综合考虑初期预算和补充预算，“适当控制年度国债总发行量”。 两国表态均指向同一方向：在全球收益率接连刷新历史高位的压力下，主动收缩供给以缓解市场压力。目前，美国10年期国债收益率已突破5.3%，创2002年以来新高；英国30年期国债收益率升破6%，为1998年以来首次。 韩国：动用超额税收，削减各期限国债发行 据当地媒体最新报道，韩国财政部将此次削减的资金来源锁定为超预期税收收入。 声明显示，削减规模按期限分布如下：2年期国债减少1万亿韩元，3年期和5年期各减少8000亿韩元，10年期和30年期各减少7000亿韩元，50年期减少2000亿", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790855279.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "欧元区9月制造业PMI创52个月新高，需求回暖引发通胀压力重现", "url": "https://wallstreetcn.com/articles/3782883", "date": "Thu, 01 Oct 2026 19:37:36 +0800", "desc": "欧元区制造业复苏势头持续强化，但随之而来的价格压力正令市场对欧洲央行货币政策路径的判断趋于复杂。 周四，标普全球公布的欧元区9月制造业采购经理人指数（PMI）升至52.9，为2022年5月以来最高水平，连续第三个月上行，并高于此前初值52.7。 新订单增速创2022年3月以来最快，出口订单连续两个月扩张，标志着外需出现逾四年半以来首次持续性回升。与此同时，投入成本与出厂价格通胀均自5月以来首次加速，官方数据预计将显示欧元区9月通胀率升至3.6%，为2023年9月以来最高。 价格压力的重燃已在利率预期上留下明显印记。 市场目前定价显示，欧洲央行将在2027年中前累计加息三次。 标普全球首席商业经济学家Chris Williamson表示，消费品需求持续下滑，生活成本上升仍在拖累家庭支出，\"在此背景下，投入成本与出厂价格再度加速上涨，令人担忧，这将进一步加剧市场对欧洲央行追加加息的猜测。\" 复", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790854656.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "赛力斯和华为又绑定了五年", "url": "https://wallstreetcn.com/articles/3782884", "date": "Thu, 01 Oct 2026 19:28:14 +0800", "desc": "作者 | 周智宇 赛力斯与华为之间 “合作模式升级”，迎来了一个关键节点。 华尔街见闻10月1日获悉，9月30日，鸿蒙智行问界业务升级战略合作签约仪式在深圳举行。华为常务董事、终端BG董事长余承东，赛力斯集团董事长张兴海等出席，双方达成面向新五年的合作。 双方表示，将继续坚持问界高端智能汽车品牌定位，联合组建问界业务专属团队，以专属专营更好地服务用户，推动问界品牌向上。 不过，有知情人士表示，对于双方如何组建问界业务专属团队，还要后续才会逐渐明确。 半个月前，双方曾宣布，问界的产品定义、设计、营销、渠道和服务由赛力斯主导，华为终端参与赋能。9月28日，余承东再次重申这一安排，并表示将分出更多资源强化其他“四界”。 此次公布的新五年合作，增加了联合组建问界业务专属团队的安排，专属专营则继续推进。 在多品牌合作体系里，专营门店能集中销售资源，专属团队则有助于双方围绕问界的需求安排人手、协调业务", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790854094.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "华尔街机构警告：美联储犯下“原罪”，十年期美债收益率或将迈向8%", "url": "https://wallstreetcn.com/articles/3782880", "date": "Thu, 01 Oct 2026 18:37:49 +0800", "desc": "全球债市风暴愈演愈烈之际，TS Lombard首席美国经济学家Steven Blitz发出警告，美联储重蹈历史覆辙，在通胀尚未被彻底压制之前便过早放松货币政策， 这一\"原罪\"将推动十年期美债收益率在未来数年内最终触及8%。 十年期美债收益率周三已升至5.30%，创2002年以来新高，华尔街多数机构正在讨论6%是否是下一个关口。但Blitz在其最新报告《原罪重演》中认为，这种判断\"格局太小\"——5.75%只是下一个阶段性平台，8%才是长期目标，届时将对股市形成实质性压制，并终结投资者数十年来形成的\"逢跌买入\"思维定式。 这一判断的核心逻辑在于：宽松财政与宽松货币的政策组合，将在每一个经济周期中推高通胀与收益率的中枢，而美国政治生态决定了这一局面短期内难以逆转。Blitz明确表示，最早要到2029年，美国才可能出现真正压制通胀的政治意愿，\"但我不会把赌注押在这上面\"。 \"原罪\"：过早放松，历史", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790851069.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "不想再被霍尔木兹拿捏！阿布扎比联手全球资本，砸数百亿美元打造“石油出口新枢纽”", "url": "https://wallstreetcn.com/articles/3782877", "date": "Thu, 01 Oct 2026 16:52:21 +0800", "desc": "阿布扎比正以前所未有的力度和速度，重塑中东能源出口格局。 阿布扎比王储Sheikh Khaled bin Mohamed Al Nahyan主导的主权基金L'imad Holding， 正牵头推进一项被官方命名为\"零霍尔木兹\"（Zero Hormuz）的战略，核心是将位于阿曼湾、完全绕开霍尔木兹海峡的富查伊拉港（Fujairah）打造成新的石油出口枢纽 。L'imad计划在海峡以 设计的人工智能模型。 9月30日，Synopsys在投资者峰会上宣布与OpenAI的合作，双方将共同开发用于芯片业务的AI模型。 该模型将被命名为 GPT-Synopsys，它将经过专门训练和调整，以承担芯片设计任务。这些任务从用类似代码的语言描述芯片电路开始，一直到确定如何在小块硅片上布局数十亿个晶体管。 根据协议， OpenAI将向Synopsys支付工具授权订阅费用，双方在客户使用该产品时按芯片设计改进成效分享收入。 消息公布后，Synopsys股价盘中一度上涨逾7%，尾盘涨幅回落仍收涨4.78%。 OpenAI联合创始人Greg Brockman表示，GPT-Synopsys将帮助工程师减少芯片设计周期中的数周乃至数月时间，并推动更多芯片进入市场。", "tags": ["AI"], "topic_score": 6, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790801520.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 22}, {"title": "美FTC被曝加大对Anthropic、OpenAI等AI巨头调查力度，官员称不会妨碍AI主导地位", "url": "https://wallstreetcn.com/articles/3782844", "date": "Thu, 01 Oct 2026 00:07:21 +0800", "desc": "美国联邦贸易委员会（FTC）正在加大对前沿AI实验室的全面调查力度，以揭示其技术可能给消费者带来的潜在风险，并计划向这些科技巨头下达类似于传票的正式调取信息的要求。 一名FTC高级官员向《纽约邮报》透露， FTC主席Andrew Ferguson已于数周前启动调查，调查对象涵盖Anthropic、OpenAI及其他顶级AI实验室。 目前FTC正在起草\"民事调查要求\"（Civil Investigative Demands，CIDs），其效力类似于传票，将强制Anthropic等AI巨头高管就其产品及据称存在的潜在消费者风险作证，并提交相关文件。CIDs预计将于未来数周内正式发出。 该FTC官员还表示： \"我们必须绝对赢得这场超智能竞争，而我们正在取得胜利，但民主党想要摧毁这项技术，这既不是主席感兴趣做的事，也绝非总统感兴趣做的事。\" FTC的调查与维持美国AI领域主导地位并不矛盾，该官员强", "tags": ["AI"], "topic_score": 7, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790784441.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 22}, {"title": "高盛策略师警示：盈利支撑暂稳股市，美债抛售若提速，美股或将承压", "url": "https://wallstreetcn.com/articles/3782845", "date": "Wed, 30 Sep 2026 23:59:54 +0800", "desc": "全球债券收益率徘徊在数十年高位附近，美股韧性正面临考验。 高盛首席全球股票策略师Peter Oppenheimer警告称，如果债券市场抛售进一步加剧，尤其是收益率以较快速度上行，美国股市可能迅速变得脆弱。他表示，真正需要关注的是债券市场是否会从当前水平出现更大幅度、更加剧烈的抛售。他称：“在这种情况下，我认为股市将变得脆弱。” 他指出，今年企业盈利表现较为健康，在一定程度上消化了美股估值压力，为股市抵御债券收益率上行提供了一定缓冲。 目前，股市尚未因债券市场持续抛售而受到明显冲击。但随着全球平均债券收益率在这个动荡的9月结束之际仍处于数十年高位附近，债券收益率上行与企业盈利增长之间的拉锯，正成为市场关注的焦点。 盈利仍提供支撑，但缓冲并非无限 Oppenheimer认为，当前美国股票市场的盈利基本面依然较为积极。经过数年的利润增长，企业仍受益于名义经济扩张，通胀和实际产出增长共同推高企业营", "tags": ["商业认知", "资本市场"], "topic_score": 7, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790783994.0, "opinion": false, "is_hot": false, "is_ 20626.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "谷歌反击！Gemini 4 Argon性能比肩Astra，成本仅60%", "url": "https://www.36kr.com/p/4006662298865801", "date": "Thu, 01 Oct 2026 02:08:06 GMT", "desc": "智东西10月1日消息，今天凌晨，谷歌发布新一代旗舰模型 Gemini 4 Argon ，重点面向 软件工程、法律与金融等企业知识工作 ，以及 网络安全防御 等复杂、长周期任务。 在衡量 长程软件工程能力 的DeepSWE v1.1测试、评估金融、编程、法律和税务等 企业知识工作 的Vals Index、测试 企业端到端自动化执行能力 的AutomationBench，以及考察 长视频理解能力 的LVBench中，Gemini 4 Argon均 领先GPT-6 Astra、Claude Fable 5.1和Claude Opus 5.5等模型 ；在评估 漏洞修复能力 的CWE-bench v1中，Argon以68%的成绩 与GPT-6 Astra并列第一 。 在Text Arena的模型成本与得分对比中，Gemini 4 Argon High以 1525分和每百万Token 8美元 的混合价", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1790820486.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "一生要强的中国人，连度假都要「考个证」？", "url": "https://www.36kr.com/p/4006619084689545", "date": "Thu, 01 Oct 2026 02:04:57 GMT", "desc": "众所周知，目前上班族假日旅游的精神状态，主要分两种。 一种是“既然放假了，那我就啥也不想做了”，就算出门，也是换个地方宅，互联网人称Staycation。 Staycation的精髓就在于能不溜达就不溜达，最爽的莫过于找个海岛沙滩或山间小墅一躺，在极致的大脑放空中等待复工的“噩耗”。 而另一种，则是“既然放假了，那我终于能做点儿什么了”。 是前脚刚离开CBD和格子间，后脚就出现在景德镇的拉坯台前，学着把一坨泥烧成盘子；或是出现在清迈的网球场上，顶着太阳连上几天私教，把假期过成短期拉练。 既然人来了，课上了，钱花了，要是能再拿个证书就更好了，于是S tudycation就这样诞生了。 Studycation践行者们的旅途，也从过去的休闲之旅，变成了考证之旅。 请3休13的假期，挤满考证的中产 所谓考证式旅游，即在去某地游玩的同时，用假期时间迅速学一项技能，并以一张证书作为自己学有所成的证明。", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1790820297.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "刚刚，谷歌发布Gemini 4 Argon：单次输出上限达100万Token", "url": "https://www.36kr.com/p/4006503753830529", "date": "Thu, 01 Oct 2026 01:00:22 GMT", "desc": "刚刚，Google 宣布推出新一代前沿模型 Gemini 4 Argon。 Google 将 Argon 定位为 面向复杂、长周期工作流的模型 ，重点覆盖软件工程、法律与金融等企业知识工作，以及网络安全防御。 与以往直接面向公众开放的方式不同，Argon 将采用分阶段发布策略。该模型将通过 Fairwind Program，首批提供给受信任的网络安全防御者。 价格方面，Argon API 的初始定价为每百万输入 Token 2 美元、每百万输出 Token 10 美元，缓存输入 Token 的价格比标准输入价格低 95%。 单次输出上限扩至 100 const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
