 "ts": 1790416519.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "认购倍数高达4倍！“AI戒指”Oura IPO遇热捧", "url": "https://wallstreetcn.com/articles/3782572", "date": "Sat, 26 Sep 2026 09:44:12 +0800", "desc": "智能戒指制造商Oura在动荡市场中逆势而上，其IPO获得约4倍超额认购，成为近期美股IPO市场的一抹亮色。 据彭博社援引知情人士消息，负责此次发行的承销银行预计将于周一下午截止接受投资者订单。 Oura及部分股东合计发行5000万股，定价区间为每股40至44美元，拟募资最高达22亿美元。 按发行价上限计算，公司市值将达141亿美元，若计入股票期权及限制性股票单元，完全稀释后估值约为150亿美元。 此次IPO定价日期定于9月29日，股票将在纳斯达克全球精选市场以\"OURA\"为代码挂牌交易。Oura的强劲认购势头尤为引人关注——就在此前数日，核电服务公司Holtec Nuclear Corp.与CVC Capital Partners旗下Bamboo Insurance Services Inc.相继以市场环境为由推迟IPO计划，令美股新股市场笼罩阴影。 公司与股东共同套现 根据向美国证券交易", "tags": ["商业认知", "资本市场"], "topic_score": 5, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790387052.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "报道：Anthropic洽谈租赁最高1GW数据中心容量，相关投资至少400亿美元", "url": "https://wallstreetcn.com/articles/3782561", "date": "Sat, 26 Sep 2026 05:48:21 +0800", "desc": "据The Information报道，Anthropic正探讨从Stream Data Centers租赁高达1GW算力的事项。Stream是一家美国数据中心开发商，由阿波罗全球管理公司控股。 数据中心开发商表示，部署完整的1GW算力将需要至少400亿美元的资本投资。Anthropic需要为租赁提供财务担保，并为在这些数据中心内安装的芯片另行筹措资金。 Anthropic已就成为直接租户并部署由谷歌和博通联合设计的TPU进行了讨论，不过也可以使用英伟达的GPU。谷歌可能会提供信用担保，但该项支持的具体范围尚不明确。 相关洽谈仍处于初步阶段，容量和交易结构仍在谈判之中。 阿波罗于2025年11月收购了Stream的多数股权，当时阿波罗曾表示，该开发商已交付超过20个数据中心园区，并拥有超过4GW的开发储备项目。 这项潜在的租赁协议将使Anthropic进一步延伸其摆脱仅从云服务提供商获取服务", "tags": ["AI"], "topic_score": 5, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790372901.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "马斯克放话：Colossus 2部署的英伟达芯片年底或增加一倍", "url": "https://wallstreetcn.com/articles/3782549", "date": "Fri, 25 Sep 2026 20:44:03 +0800", "desc": "马斯克旗下人工智能公司xAI正在加速扩充AI算力。 当地时间9月25日，马斯克在社交平台X上表示，其AI计算集群Colossus 2目前已部署 11万颗英伟达GB200和44万颗GB300，共计55万颗芯片 ，年底前芯片数量可能超过目前水平的两倍。 马斯克透露，Colossus 2还将迎来密集扩容： 22万颗GB300预计下周正式投入运行，另外22万颗将于11月上线；如果进展顺利，12月底前还可能再上线22万颗GB300。 按照这一扩容计划，Colossus 2到年底最多可能新增66万颗GB300，芯片总数将达到 121万颗左右 ，较目前的55万颗增加约120%。 这也意味着，Colossus 2将在未来几个月迎来大规模算力扩张，新增芯片几乎全部来自英伟达GB300。 马斯克同时披露，Colossus 1目前拥有 15万颗H100、5万颗H200和3万颗GB200 。此前，xAI曾表示，计", "tags": ["AI"], "topic_score": 5, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790340243.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "为了把更多HBM塞进芯片，英伟达加速布局下一代玻璃基板", "url": "https://wallstreetcn.com/articles/3782539", "date": "Fri, 25 Sep 2026 17:56:26 +0800", "desc": "英伟达正联合产业链企业推进新一代玻璃基板技术落地，以应对AI芯片封装在尺寸、散热和互连方面日益突出的物理限制。若技术实现突破，玻璃基板有望支持更大规模的HBM集成，为下一代GPU提升封装密度和数据传输能力。 据报道， 德国设备厂商SCHMID在近期上半年业绩发布会上披露，公司正与英特尔、英伟达、AMD各自供应链中的核心企业合作，共同推进玻璃芯核基板设备研发。 SCHMID首席战略官Roland Rettenmayer表示，目前玻璃通孔（TGV）金属化工艺仍存在技术障碍，终端客户认证也尚未完成。 英伟达CEO黄仁勋此前已就这一技术路线展开多方接触。他与SK集团会长崔泰源会面时，曾讨论包括玻璃基板在内的下一代半导体合作，并积极推动台积电加快相关技术开发。这表明， 英伟达正在评估将玻璃基板引入下一代GPU的可行性。 玻璃基板瞄准AI芯片封装瓶颈，有望扩大HBM集成 随着AI芯片性能和功耗持续提升", "tags": ["AI", "企业落地"], "topic_score": 5, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790330186.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "Federal Reserve Board requests public comment on two proposals related to establishing a regulatory framework for Board-supervised payment stablecoin issuers under the GENIUS Act", "url": "<![CDATA[https://www.federalreserve.gov/newsevents/pressreleases/bcreg20260924a.htm]]>", "date": "Thu, 24 Sep 2026 18:30:00 GMT", "desc": "Federal Reserve Board requests public comment on two proposals related to establishing a regulatory framework for Board-supervised payment stablecoin issuers under the GENIUS Act", "tags": ["资本市场"], "topic_score": 3, "source": "美联储 新闻稿", "cat": "宏观监管", "weight": 4, "ts": 1790274600.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "世界人工智能开源大赛（GOAI）总决赛暨颁奖盛典在杭州举行", "url": "https://www.infoq.cn/article/hrmb2p18iKEwl24OMvcv?utm_source=rss&amp;utm_medium=article", "date": "Thu, 24 Sep 2026 1 道： 这有时会导致汽车汽油价格小幅上涨，所以我们正在非常认真地研究这件事——我们可能会这么做。 据彭博报道，美国国家经济委员会主任 哈塞特 、财政部长 贝森特 、美国贸易代表 格里尔 ，过去一周已在分析短期柴油出口禁令的潜在影响，凸显出政府对这一方案的认真程度。 高盛研报认为，这是“非常可能发生的情景，但非基准预期”。该行推演，禁令将会在短期内可压低美国柴油价格（每周约降0.25美元/加仑），但若持续9至10周至储罐装满，将反推汽油价格上涨（每周约涨0.30美元/加仑），同时推高欧洲柴油价格 为什么此刻讨论禁令？ 潜在禁令的驱动因素来自", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790554942.0, "opinion": true, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 10}, {"title": "Meta AI主管Alexandr Wang：为何我要做Muse", "url": "https://wallstreetcn.com/articles/3782587", "date": "Sat, 26 Sep 2026 19:50:41 +0800", "desc": "Meta首席AI官Alexandr Wang近日发表公开信，阐述其主导构建Muse AI助手背后的核心理念——让每一个普通人都能实现自己的梦想。这封信与Muse的强劲市场表现一同出现在公众视野中，进一步巩固了外界对这笔高达140亿美元收购交易价值的判断。 Muse自上线以来势头迅猛。据Sensor Tower数据，该应用在美国和加拿大App Store上线首12天内累计下载量达280万次，超越ChatGPT同期130万次的成绩，并于9月19日创下单日26.4万次下载的美国纪录。受此提振，Meta过去五个交易日市值增加约2340亿美元。 Wang在公开信中写道，大多数人从未说出自己真正想要什么——不是因为没有渴望，而是因为梦想往往在繁琐的现实障碍中悄然消亡。他将Muse定位为每个人的\"第二大脑\"， 一个能够听懂半句话、帮人制定计划、发送邮件、寻找资金、清除障碍的\"全能经理人\"。 一封关于\"渴", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790423441.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 10}, {"title": "高盛测算：“AI第二阶段”的“资本缺口”要怎么补？", "url": "https://wallstreetcn.com/articles/3782577", "date": "Sat, 26 Sep 2026 11:53:27 +0800", "desc": "超大规模云计算企业（Hyperscaler）的AI资本支出狂潮正从\"花多少\"的争论，转向\"能赚回多少\"的核心命题。 高盛最新研究显示，六大超大规模云计算企业若要在2026至2027年约1.73万亿美元的AI算力资本支出上实现15%的投入资本回报率（ROIC）， 需在2028至2030年间累计创造约1.42万亿美元的收入。 高盛互联网与科技团队负责人Eric Sheridan在报告中指出，当前市场争论的焦点已从近期支出规模本身，转向这轮巨额投资能否在未来三年内产生可观回报。与此同时，云计算积压订单数据提供了一定支撑——截至2026年第二季度，AWS、Azure和谷歌云合计积压订单约1.69万亿美元，同比增长152%，为收入目标的可实现性提供了初步背书。 然而，高盛框架之外的变量同样不容忽视。约3万亿美元的表外承诺并未纳入ROIC分母，GPU和算力定价的持续下行压力已有所显现，而规模更为庞大的", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790394807.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 10}, {"title": "阿波罗首席经济学家警告：美联储可能忽视了柴油价格风险", "url": "https://wallstreetcn.com/articles/3782576", "date": "Sat, 26 Sep 2026 11:47:10 +0800", "desc": "阿波罗全球管理公司首席经济学家Torsten Slok发出警告，创纪录的柴油价格对通胀构成的威胁，可能远超美联储目前的评估——因为柴油成本会渗透进核心消费者价格指数，而后者恰恰是美联储货币政策的核心参照指标。 Slok周五在彭博电视《Surveillance》节目中表示， 柴油相关运输成本的传导路径与汽油截然不同。由于运输商品对零售供应链乃至数据中心建设均不可或缺，需求价格弹性极低，价格上涨最终将转嫁至企业和消费者。 “柴油价格上涨，实际上是进入了CPI篮子中能源项以外的其他分项，”他说。 这一表态与美联储内部的分歧形成呼应。芝加哥联储主席Austan Goolsbee本周警告称，央行不能忽视反复出现且持续存在的供给冲击，\"一旦供给冲击引发的通胀变得持续，'看穿'逻辑的部分依据便不再成立。\"目前美国通胀仍远高于美联储2%的目标，货币政策走向面临更大不确定性。 柴油冲击核心通胀，传统框架面临", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790394430.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 10}, {"title": "即便油价下跌，30年期美债收益率依旧突破了5.5%", "url": "https://wallstreetcn.com/articles/3782571", "date": "Sat, 26 Sep 2026 09:12:28 +0800", "desc": "在缺乏明确技术支撑的\"真空\"环境下，长端美债收益率自我强化上行，与油价走势背道而驰。 美国长端国债收益率正在展现出独立于传统驱动因素之外的上行动能。在一个充满压力的交易周收官之际，30年期美债收益率突破5.5%，创下2004年以来新高，而当日油价却同步下跌——这一背离信号令市场警觉。 周五，30年期美债收益率盘中最高上涨5个基点至5.53%，收盘维持在5.49%上方，较前一日上涨约2个基点。10年期美债收益率同样刷新多年高位，突破5.22%。值得注意的是，30年期收益率在今年7月初时尚低于5%，短短数月内已大幅攀升逾50个基点。 与此同时，对美联储政策预期更为敏感的短端收益率则出现下行，2年期收益率当日下跌约7个基点。长短端收益率的分化，令收益率曲线关键区间——包括2年至10年期、5年至30年期——从本周早些时候逾一年低位显著反弹走陡。 \"真空\"状态：缺乏技术支撑，收益率自我强化上行 此轮", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1790385148.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 10}, {"title": "报道：特朗普拒绝伊朗7天停火提议，预计中期选举后恢复轰炸", "url": "https://wallstreetcn.com/articles/3782570", "date": "Sat, 26 Sep 2026 08:38:13 +0800", "desc": "美伊冲突在战争与和平之间徘徊，局势或再度滑向敌对状态。 周六，据媒体援引美国官员最新消息， 特朗普已拒绝伊朗提出的7天停火方案，并向幕僚表示，他预计将在11月中期选举后恢复对伊朗的轰炸行动。 伊朗的停火提议原本包含重开霍尔木兹海峡、重启核谈判等条件，以换取美国解除对伊朗港口的封锁。 特朗普私下对伊朗是否能满足其要求持怀疑态度，已向幕僚表示，他认为恢复轰炸行动的可能性较大。然后，据央视新闻此前报道，一位美国官员透露，美伊双方目前仍在就霍尔木兹海峡开放及重启谈判等议题进行\"积极且富有建设性\"的讨论。 特朗普当前的立场表明，这场持续七个月的冲突所处的战和模糊状态，正向敌对方向倾斜。对于全球大宗商品市场而言，霍尔木兹海峡的通行前景及油价走势，将持续受到这场冲突走向的牵引。 停火提议的核心条款 据知情人士透露，伊朗在上周日举行的卡塔尔会议上提出了这份7天停火方案。根据该方案， 美国须解除海上封锁、解", "tags": [], "topic_ function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
