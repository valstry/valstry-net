56086690185", "date": "Mon, 19 Oct 2026 01:03:08 GMT", "desc": "设定一些不合理的目标，然后告诉模型：这非常合理！ 这是Claude Code桌面版负责人Felix Rieseberg分享的一个AI使用小技巧。 具体怎么做？ 假设你想把网站加载时间从10秒压缩到5秒，他建议： 直接把目标定到0.2秒 。 模型说做不到？那就继续告诉它：这个问题完全可以解决，再试试再试试。 在Felix看来，我们给AI布置任务，还可以更大胆一点。 他还分享了一个小技巧： 把任务里的名词换成动词。 比如，原本的任务是「做一份汇报PPT」，可以重新表述成： 在30分钟内，让一群忙碌的人信服你对事情前因后果的解释，并在情况尚不明朗时作出决策。 除了故意把目标定得激进，他还给出了几种具体做法： 别只让AI「像专家一样思考」 。接着追问：真正的专家会看哪些原始资料、使用什么工具、采用什么方法，再把这些要求写进任务里。 别把自己的判断直接当成答案 。把它交给AI检验，让AI回到原始材料", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1792371788.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "Anthropic gives outside AI watchdog “employee-like” access", "url": "https://arstechnica.com/ai/2026/10/anthropic-gives-outside-ai-watchdog-employee-like-access/", "date": "Sun, 18 Oct 2026 16:25:19 +0000", "desc": "The outside watchdog can publish its findings without Anthropic's approval.", "tags": ["AI"], "topic_score": 4, "source": "Ars Technica", "cat": "科技新闻", "weight": 3, "ts": 1792340719.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "10-K - COMMERCIAL METALS Co (0000022444) (Filer)", "url": "https://www.sec.gov/Archives/edgar/data/22444/000002244426000065/0000022444-26-000065-index.htm", "date": "2026-10-16T10:29:32-04:00", "desc": "Filed: 2026-10-16 AccNo: 0000022444-26-000065 Size: 25 MB", "tags": ["企业落地"], "topic_score": 2, "source": "SEC 最新 10-K 年报", "cat": "企业行为_美股披露", "weight": 5, "ts": 1792160972.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "The next developer interface is ambient intelligence", "url": "https://github.blog/news-insights/company-news/the-next-developer-interface-is-ambient-intelligence/", "date": "Thu, 15 Oct 2026 19:39:27 +0000", "desc": "AI, agents, voice, and physical controls are shifting software development from operating tools to expressing intent—and helpin s a lot of work ahead. Let’s get back to work. 🚀 GOD BLESS AMERICA ❤️🇺🇸", "tags": [], "topic_score": 0, "source": "Threads-AI讨论", "cat": "AI实战_创作者", "weight": 4, "ts": 1792449023.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "标普全球警告：美国科技巨头AI相关负债或超已知规模", "url": "https://wallstreetcn.com/articles/3783965", "date": "Tue, 20 Oct 2026 06:19:03 +0800", "desc": "标普全球警告称，全球最大科技公司的人工智能相关负债规模可能远超已披露水平，但该机构目前暂无调整评级的计划。 标普全球数字基础设施主管Mark Habib在伦敦圆桌会议上表示，超大规模云服务商（hyperscalers）可能存在大量未披露的AI相关债务，主要源于其对数据中心建设或中小型AI企业的隐性担保安排。他说： \"可以合理判断，有更多（债务）是我们看不到的。\" 此番表态发生在市场对AI基础设施融资前景愈发谨慎的背景之下。AI基础设施提供商及英伟达支持的CoreWeave等所谓\"新云\"（neocloud）公司近期发行的债券价格持续下跌，反映出投资者对其激进借贷规模的忧虑。 隐性负债敞口难以量化 Mark Habib重点提及超大规模云服务商与AI项目之间的\"互联融资结构\"——大型科技公司通过实际上为大型数据中心建设或规模较小的AI企业提供担保的方式，形成表外潜在负债。 \"如果这些负债未被披露", "tags": ["AI"], "topic_score": 3, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792448343.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "Alger’s Crawford: There’s Skittishness in the Market", "url": "https://www.bloomberg.com/news/videos/2026-10-19/alger-s-crawford-there-s-skittishness-in-the-market-video", "date": "Mon, 19 Oct 2026 22:06:05 GMT", "desc": "Ankur Crawford, a Portfolio Manager at Alger and Former Intel Engineer, said recent market nervousness around AI— including concerns tied to CoreWeave—does not reflect the strength of underlying adoption and infrastructure demand. She described a striking gap between stock performance and on-the-ground fundamentals, while noting that returns from AI investment will take time and that debt, supply-", "tags": ["资本市场"], "topic_score": 3, "source": "Bloomberg Technology", "cat": "金融媒体_英文", "weight": 2, "ts": 1792447565.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "Big Take: CoreWeave And The Fragile AI Economy", "url": "https://www.bloomberg.com/news/videos/2026-10-19/big-take-corewe _hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "Anthropic拿出5%股权成立公益基金，应对AI冲击就业市场", "url": "https://wallstreetcn.com/articles/3783906", "date": "Mon, 19 Oct 2026 14:41:01 +0800", "desc": "AI领军企业Anthropic宣布将公司5%股权注入一只新设公益基金，并设计了随公司估值增长而自动扩大持股比例的机制，此举将使约20%的Anthropic股份最终用于公共利益。 Anthropic周日（10月18日）宣布，将在股东批准后，向新成立的“Anthropic公益基金”（Anthropic Public Benefit Fund）注入公司5%的股份。 此外，每当公司估值在设定基准线上方每增长50%，董事会可酌情追加2%的股权。该基金将以全资有限责任公司（LLC）形式运营，而非传统的501(c)(3)免税非营利机构，以保留在不同捐赠形式之间灵活调配的空间。公司明确表示，该LLC持有的股权不得用于在美国或其他任何国家的游说或政治捐款。 在用途上，Anthropic将应对AI冲击就业市场列为核心议题之一。 公司表示，AI可能创造巨大经济价值，但也可能给大量劳动者带来不稳定性。Anthro", "tags": ["AI"], "topic_score": 4, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792392061.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "市场只给17%概率，经济学家却喊“五五开”：美联储10月加息悬念被严重低估？", "url": "https://wallstreetcn.com/articles/3783908", "date": "Mon, 19 Oct 2026 14:40:51 +0800", "desc": "期货市场对美联储10月加息几乎不屑一顾，但经济学家群体正发出截然不同的警告信号。 期货市场目前仅给予美联储10月加息17%的概率，押注央行将按兵不动。 然而，据MarketWatch近日报道， 多位经济学家认为，10月27日至28日的议息会议远比市场定价所呈现的更具悬念。 前美国银行证券首席经济学家Ethan Harris直言，这是一个“五五开”的判断；牛津经济研究院美国经济学家Matthew Martin则更为明确，直接预测美联储将在10月和12月连续加息。两种截然对立的判断，折射出当前货币政策路径的高度不确定性。 推动经济学家上调加息预期的核心驱动力，是超预期的通胀数据。 华尔街见闻文章 写道，美国9月通胀数据显示，消费者价格同比上涨3.7%，生产者价格指数批发通胀率更高达6.3%，且能源以外商品价格加速上行——这一细节尤为令人警惕，因为此类商品价格波动性相对较低，其走强意味着通胀压力", "tags": ["资本市场"], "topic_score": 4, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792392051.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "AI资金流向图：英伟达拿走6900亿，其余499家瓜分3400亿", "url": "https://wallstreetcn.com/articles/3783876", "date": "Mon, 19 Oct 2026 08:58:50 +0800", "desc": "摩根士丹利首次绘制出2027年AI资本支出的完整流向图，揭示出一个高度集中的收益结构：在超大规模云服务商1.58万亿美元的支出中，约三分之二的S&P 500受益金额流向英伟达一家，其余499家成分股合计仅分得约3390亿美元。 摩根士丹利策略师Nick Lentini、Mike Wilson及逾二十位行业分析师联合发布报告《追踪AI 1.6万亿美元资金流向：绘制资本支出繁荣所创造的收入图谱》，首次将超大规模云服务商的资本支出逐笔追踪至具体公司的收入报表。报告核心结论是： AI资本支出将直接驱动S&P 500约25%的销售增长，AI相关企业将贡献2027年标普指数78%的盈利增长。 报告同时揭示了一个长期被忽视的隐性风险：超大规模云服务商已披露逾1.1万亿美元尚未启动的租约承诺，这部分\"合成资本支出\"并不体现在任何现金流量表的资本支出项下，却在经济实质上等同于债务融资。摩根士丹利信用策略师预", "tags": ["AI"], "topic_score": 4, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792371530.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "No agenda, no rush, no leaving San Francisco: Benchmark’s partners on investing in a frenzied market", "url": "https://techcrunch.com/2026/10/18/no-agenda-no-rush-no-leaving-san-francisco-benchmarks-partners-on-investing-in-a-frenzied-market/", "date": "Sun, 18 Oct 2026 21:00:00 +0000", "desc": "Benchmark may have grown its funds and swapped out some partners, but onstage the five who are left sounded like friends who just happen to be running one of the Valley’s most storied firms", "tags": ["资本市场"], "topic_score": 2, "source": "TechCrunch", "cat": "科技新闻", "weight": 4, "ts": 1792357200.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "Anthropic says it’s committing 5% of its shares to a ‘public benefit fund’", "url": "https://techcrunch.com/2026/10/18/anthropic-says-its-committing-5-of-its-shares-to-a-public-benefit-fund/", "date": "Sun, 18 Oct 2026 20:37:40 +0000", "desc": "The company offered some broad-strokes ideas for how this money might actually be used, such as “large donations to traditional nonprofits or direct distributions to specific populations.”", "tags": ["AI"], "topic_score": 2, "source": "TechCrunch", "cat": "科技新闻", "weight": 4, "ts": 1792355860.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "Federal Reserve Board announces termination of enforcement actions with Gardner Bancshares, Inc. and Small Business Bank", "url": "<![CDATA[https://www.federalreserve.gov/newsevents/pressreleases/enforcement20261016a.htm]]>", "date": "Fri, 16 Oct 2026 15:00:00 GMT", "desc": "Federal Reserve Board announces termination of en 1月1日起施行，有效期5年，届时废止2023年的试行规则。（详见财新网报道《 首份国家级电力现货市场基本规则落地 》）", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1792455986.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "法国西班牙抗议潮外溢至欧洲多国 主因为年轻人生活成本高企", "url": "https://international.caixin.com/2026-10-19/102495010.html", "date": "Tue, 20 Oct 2026 00:26:26 GMT", "desc": "抗议者以年轻人为主，他们主要抗议住房危机、生活成本高企和低工资水平等 当地时间2026年10月18日，意大利米兰，市中心街头发生多起破坏公物和抢劫事件。图：视觉中国 【财新网】 近来席卷西班牙和法国的抗议浪潮，已经蔓延至意大利、葡萄牙和比利时。 当地时间10月17日，在意大利米兰市中心，一场原本和平的抗议逐步失控，骚乱者与警方发生冲突，并洗劫商店、纵火焚烧财物。 这场抗议原旨在反对生活成本上升和低工资等生活困境。随着抗议进行，有身穿黑衣、戴着面罩的年轻人向防暴警察投掷石块、铺路石、烟花和瓶子等，并点燃由酒吧桌子搭成的路障。事后画面显示，一辆意大利宪兵队的警车严重受损。 据意大利安莎通讯社报道，警方起初撤退以等待增援，随后使用了催泪瓦斯清场。约有50名年轻人被捕，其中半数左右为未成年人。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1792455986.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "泽连斯基警告美若站在普京一边将是巨大悲剧 美方辩解涉俄柴油协议", "url": "https://international.caixin.com/2026-10-19/102495020.html", "date": "Tue, 20 Oct 2026 00:26:26 GMT", "desc": "美国能源部长克里斯·赖特同期接受美媒采访时为特朗普辩护，称美俄柴油协议“是一种旨在结束战争的诱因，而不是在给俄罗斯提供经济上的救命索” 当地时间2026年10月18日，乌克兰基辅，乌克兰总统泽连斯基在办公室接受采访。图：视觉中国 【财新网】 当地时间10月18日，特朗普在其所拥有的“真实社交”平台上发文，大篇幅解释他与俄罗斯签订柴油协议及放松涉俄制裁的原因，并对乌克兰总统泽连斯基再次做出公开批评。 特朗普称，目前有关俄乌停战的谈判正在进行中且进展顺利，他不希望“采取任何可能导致俄罗斯退出谈判桌的行动”。 特朗普解释称，现阶段他固然可以签署新的涉俄制裁文件，但这么做，将会破坏谈判进程。他强调，自己可以选择“稍后签署”，也可以“在任何想签署的时间签署，因此没有必要立即行动”。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1792455986.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "“金九”房价上涨城市数量增加，成交向头部“吸金”项目集中", "url": "https://database.caixin.com/2026-10-19/102494989.html", "date": "Tue, 20 Oct 2026 00:26:26 GMT", "desc": "9月，有9个城市二手房价格上涨，比8月增加6个，新房价格上涨的城市有16个；机构数据显示，前三季度重点城市销售额前30的项目中，有17个是一线城市套均总价1000万以上的高端项目 资料图：深圳一处在建楼盘。图：视觉中国", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1792455986.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "回升中的分化：三季度经济回顾与四季度展望", "url": "https://opinion.caixin.com/2026-10-20/102495043.html", "date": "Tue, 20 Oct 2026 00:26:26 GMT", "desc": "经济“K型分化”仍然明显，企业投资和居民消费改善相对滞后，四季度稳增长需要坚持存量政策加快落地与增量政策适时推出相结合，更加突出扩大有效需求、改善企业经营和稳定居民预期 山东枣庄一企业工人在生产线上巡检。本轮回升仍主要由外需和生产端带动，消费和投资虽然出现一定边际改善，总体仍然偏弱，经济增长向企业经营效益、投资扩张和居民消费的传导尚不充分。图：视觉中国 三季度经济增速回升，9月积极变化进一步增多 三季度经济回升主要有三方面原因。 一是外需持续走强，出口增长明显提速，成为经济回升的重要动力。根据海关数据测算，按美元计价，三季度出口同比增长28.4%，比二季度加快8.3个百分点；其中9月出口同比增长36.3%，比8月加快11.4个百分点。出口较快增长，一方面得益于全球AI基础设施投资扩张和绿色转型带来的需求，集成电路、计算机设备、汽车等产品表现突出；另一方面，海外传统消费品需求改善，叠加中国制", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1792455986.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "米琴：《伊甸之东》中的老李", "url": "https://mini.caixin.com/2026-10-19/102494708.html", "date": "Tue, 20 Oct 2026 00:26:26 GMT", "desc": "小说中的老李善良、高贵、充满智慧。电视剧中的老李“精准地契合了原著的精神” Hoon Lee在《伊甸之东》中饰演Lee。图：Netflix 根据斯坦贝克的小说《伊甸之东》拍摄的7集电视剧（Netflix）被赞为“美得令人难以置信”，甚至会“彻底改变你人生”，让你“永远铭记自己拥有改变的力量”。[1] 小说是一部约23万字的史诗巨著，描写了生活在加州萨利纳斯山谷的两个移民家庭，从美国南北战争到第一次世界大战结束几十年的变迁。其中汉密尔顿家族据说是以斯坦贝克的外祖父塞缪尔·汉密尔顿的真实家族为原型创作。电视剧只聚焦另一个虚构的家族——特拉斯克家族，因为这个家族的故事与中心主题有关。这个家族的两代人——查尔斯和亚当兄弟俩，以及迦尔和阿伦这对双胞胎——都涉及对圣经中该隐和亚伯故事的现代化改编。而亚当·特拉斯克的仆人老李，对源自该隐和亚伯传说的希伯来语“timshel”进行了探讨和解读，成为小说主题", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1792455986.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "视线｜高中生抗议触发连锁反应 法国街头暴力蔓延撬动政局", "url": "https://photos.caixin.com/2026-10-19/102494893.html", "date": "Tue, 20 Oct 2026 00:26:26 GMT", "desc": "当地时间2026年10月17日，法国利摩日爆发示威游行。此次动员号召得到了广泛支持，参与者包括“黄背心”运动人士、工会成员以及大中学生等。图：IC photo 【财新网】 从巴黎贫困郊区到法国上百座城市，法国高中生对教育危机的怒火已足足燃烧了一个月。自2026年9月17日首场校园抗议爆发以来，这场由破旧校舍与教育不平等引发的争端，迅速与民众对生活成本上涨的长期积怨交织合流。强力维稳并未能平息怒火。据估计，一个月来已有上万人被捕，其中绝大多数是未成年人。 当地时间10月17日，抗议浪潮迎来了爆发以来规模最大的一天。内政部长努涅斯统计，全国共举行了110场游行，约55万人走上街头。游行队伍彻底打破了行业与阶层的界限，涵盖了中学生、大学生、教师及教职工、学生家长、工会成员、农工阶层、医护人员、律师乃至昔日的“黄背心”成员。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1792455986.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "3家券商、2家基金公司因境外调研违规行为采取监管措施", "url": "https://finance.caixin.com/2026-10-19/102494755.html", "date": "Tue, 20 Oct 2026 00:26:26 GMT", "desc": "通报指出，近日有媒体报道，部分机构在境外调研和人员行为管理等方面存在漏洞。机构司组织对有关证券基金公司进行了检查，根据检查结果对相关证券公司、基金公司采取了监管措施，并对聚焦重点领域对证券基金公司提出了诸多要求 通报指出，近日，有媒体报道，部分机构在境外调研和人员行为管理等方面存在漏洞。机构司组织对有关证券基金公司进行了检查。制图：石燕 【财新网】 2026年10月16日，中国证监会向证券公司、基金公司发布监管通报，要求“加强证券基金公司投研人员调研行为监管”，并对3家券商、2家基金公司因境外调研违规行为采取监管措施。多位行业人士向财新证实了这一事项。 外界注意到，证监会证券基金机构监管司（下称“机构司”）发出的《机构监管情况通报》未使用违规公司的具体名称，改以字母和数字代替：3家券商分别是G1证券、H证券、G2证券；2家基金公司分别是F基金、H基金。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1792455986.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "潘功胜：人民币在国际支付中占比在6%-7% 排全球第三", "url": "https://finance.caixin.com/2026-10-19/102494963.html", "date": "Tue, 20 Oct 2026 00:26:26 GMT", "desc": "综合考虑人民币跨境支付和海外离岸支付，将通过人民币跨境支付系统（CIPS）、银行内部系统结算的金额纳入统计后，人民币在国际支付中稳定地排在全球第三位 潘功胜表示，下一步，人民银行将进一步增强高质量的政策供给，为境内外主体持有、使用人民币营造更加良好的环境。图：视觉中国 【财新网】 在国际货币体系格局生变的当下，人民币国际化正处于难得的机遇期。2026年10月19日，在2026金融街论坛年会上，中国人民银行行长潘功胜表示，人民币国际化正式起步于2009年。在市场需求的驱动下，叠加当前国际环境和地缘政治形势变化，国际市场对人民币使用的需求明显增强，人民币国际化水平持续提升。 “目前，人民币已成为我国对外收支第一大结算货币、全球第二大贸易融资货币、第三大支付货币。虽然按照SWIFT的统计，人民币在国际支付中的占比是3-4%左右，排在全球第五位。但综合考虑人民币跨境支付和海外离岸支付，将通过人民币", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1792455986.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "法国示威和骚乱升级街头暴力席卷多地 马克龙拒绝内政部长辞职", "url": "https://international.caixin.com/2026-10-19/102494821.html", "date": "Tue, 20 Oct 2026 00:21:33 GMT", "desc": "抗议者在法国首都巴黎、南部港口城市马赛及其他地区走上街头，纵火焚烧车辆和建筑 当地时间2026年10月18日，法国巴黎，身着防暴装备的警察严阵以待。图：IC photo 【财新网】 法国境内因高中生抗议而起的 债券。 本周，CoreWeave的2032年到期债券收益率一度突破16%，五年期信用违约互换（CDS）利差飙升至1117基点，隐含五年违约概率约63%。高盛在周末发布的信贷趋势报告中直言： CoreWeave已成为\"市场的贝塔晴雨表\"，其债券吸引了股票和宏观市场投资者的广泛关注，信贷压力由此蔓延至整个数据中心生态系统 。 与此同时，瑞银桌面交易员Torsten Sippel独立得出相同结论，称CoreWeave已成为\"AI交易的重要风向标\"，市场争论的焦点正从算力需求本身，转向AI基础设施扩张的经济性与融资可持续性。 这场信贷动荡对权益市场造成直接冲击。摩根士丹利AI科技受益股篮子（MSXXAIB）本周录得2023年成立以来最大单周跌幅，下挫16.5%，同期标普500仅跌约2%。", "tags": ["资本市场"], "topic_score": 2, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792413162.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 16}, {"title": "海光信息Q3营收同比增长45.46%，AI驱动高端芯片需求持续攀升 | 财报见闻", "url": "https://wallstreetcn.com/articles/3783939", "date": "Mon, 19 Oct 2026 19:44:58 +0800", "desc": "海光信息三季报显示，人工智能产业的快速扩张正在深刻重塑国内高端芯片市场格局，公司业绩增长势头持续强劲。 海光信息于2026年10月20日发布三季报。前三季度营业收入达149.55亿元，同比增长57.58%；归属于上市公司股东的净利润28.47亿元，同比增长45.12%。 单季度来看， 2026年第三季度营收58.56亿元，同比增长45.46%；净利润10.48亿元，同比增长37.90%。 公司将业绩增长归因于人工智能产业快速发展，以及国产化进程由政策驱动全面转向市场驱动，国内高端芯片需求持续攀升。 值得关注的是，剔除股份支付影响后，前三季度归属于上市公司股东的净利润达35.86亿元，同比增幅达76.90%，远高于会计口径下的45.12%，显示公司核心经营盈利能力的改善幅度更为显著。 营收与盈利双线提速，研发投入同步加码 海光信息前三季度营业收入149.55亿元，较上年同期增加约54.39亿", "tags": ["资本市场"], "topic_score": 2, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792410298.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 16}, {"title": "美股上周素描：机构创纪录地“抛”，散户创纪录地“抄”", "url": "https://wallstreetcn.com/articles/3783899", "date": "Mon, 19 Oct 2026 11:48:13 +0800", "desc": "半导体板块刚经历年内最惨一周，散户资金却以创纪录规模三倍杠杆抄底，与对冲基金创纪录的净卖出形成罕见对峙。 高盛Prime最新数据显示全球科技股上周净卖出规模创历史纪录，净敞口降至0百分位；但总敞口仍高达213.9%，处于83百分位。 与此同时，散户借道杠杆ETF逆势抄底。高盛ETF专家Chris Lucas周日在报告中指出，过去一周近100亿美元资金涌入杠杆ETF，为2006年有数据以来最大单周流入， 其中约70亿美元流向三倍做多半导体ETF SOXL ，创该产品历史纪录，贡献了当周净流入的74%。 高盛衍生品与资金流向策略师Brian Garrett判断，仓位已经极低、市场广度在改善、AI债务负担并非新消息，下一步走势“更多取决于财报确认，而非其他任何因素”。在机构大幅低配却未真正离场、散户杠杆资金高度集中的格局下，财报季成为多空对峙的裁决点。 半导体遭遇大抛售 上周，纳斯达克100收于", "tags": ["资本市场"], "topic_score": 2, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792381693.0, "opinion": false, "is_hot": false, "is_vendo ": "AI信贷悖论：华尔街恐慌过早了吗？", "url": "https://wallstreetcn.com/articles/3783949", "date": "Mon, 19 Oct 2026 21:27:58 +0800", "desc": "AI投资热潮正在催生一个深层矛盾：数万亿美元的基础设施承诺与尚未成熟的终端需求之间，裂缝正在信贷市场悄然显现。 据摩根大通数据， 超大规模云计算商（hyperscaler）信用利差上周扩大12个基点至148个基点，创7月以来最高水平，距年内高点仅差6个基点 。与此同时，TS Lombard估计， 与AI相关的累计债务规模到2027年底可能接近2万亿美元。信贷市场正在对AI融资风险重新定价。 然而，悖论恰在于此： 超大规模云计算商今年债务规模虽增加了1170亿美元，其平均信用评级却实际上小幅提升。信贷市场的压力更多集中于生态系统中的薄弱环节，而非那些主导融资的科技巨头本身。 随着财报季临近，市场面临的关键问题是：此轮利差扩大究竟预示着基本面的实质恶化，还是不过是又一次仓位过度调整？ 收入缺口：3万亿美元的悬念 AI繁荣的核心矛盾在于，谁来最终为这场盛宴买单。 TS Lombard估计，目前A", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792416478.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "大众汽车深陷困境：十万裁员阴云笼罩，薪资冻结计划延续至2030年", "url": "https://wallstreetcn.com/articles/3783946", "date": "Mon, 19 Oct 2026 21:11:33 +0800", "desc": "大众汽车正面临数十年来最严峻的结构性危机。这家德国汽车巨头计划将薪资冻结执行至本十年末，同时裁员目标已扩大至10万人，集团整体转型压力持续升级。 据德国《南德意志报》（Süddeutsche Zeitung）报道， 大众汽车管理层已在内部文件中提出将薪资冻结延续至2030年，涉及旗下数十万名员工。 该报指出，\"最新计划代表着管理层与员工代表之间冲突的进一步升级。\" 这一消息紧随大众汽车今年9月的重大战略调整——彼时公司下调全年业绩展望，并将裁员目标翻倍至10万个职位。两项措施叠加，令集团劳资关系愈发紧张，亦对欧洲汽车行业整体情绪构成压制。 薪资冻结纳入整体重组框架 据《南德意志报》援引内部文件报道，薪资冻结方案已被纳入大众汽车执行董事会批准的更广泛重组计划之中。根据这一名为\"集团目标愿景\"（Group Target Picture）的转型战略，集团旗下所有地区及工厂均被要求作出\"适当贡献\"", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792415493.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "智界，要以自己的名义造车了", "url": "https://wallstreetcn.com/articles/3783948", "date": "Mon, 19 Oct 2026 21:08:25 +0800", "desc": "作者 | 周智宇 智界要把自己的名字，放在新车的车尾了。 工信部第412批《道路机动车辆生产企业及产品公告》显示，安徽智界新能源汽车有限公司进入新准入车辆生产企业清单。公示期截止至2026年10月23日，智界目前仍在等待最终获批。 智界方面在10月18日向华尔街见闻表示，正计划获得独立生产资质。 对于已经有产品、有研发团队，也有工厂在运转的智界，争取生产资质，是此前一系列独立运作安排向制造端的延伸。成立公司、调整管理层、引入团队持股之后，智界要进一步把造车这门生意放到自己的公司里。 在车型密集更新的市场里，采购、研发与生产之间的每一次衔接，都有时间和成本。车企争取更完整的制造经营权，也是在争取更直接地处理这些事情的空间。 这使智界的变化有了超出一张资质的意味。华为仍在深度参与产品，奇瑞继续提供制造与研发积累，围绕智界的专属组织和公司安排却在不断完善。一个“界”逐步长成一家怎样的车企，开始有", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792415305.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "韩国股市今年第三次急跌：谁在卖？谁在等？谁已经买不动了？", "url": "https://wallstreetcn.com/articles/3783945", "date": "Mon, 19 Oct 2026 21:04:37 +0800", "desc": "韩国股市再度遭遇重挫，但这一次，此前支撑市场的最重要买盘已经走完。 据追风交易台，摩根大通2026年10月19日发布的韩国股票策略报告， 韩国综合指数（KOSPI）上周录得5日跌幅超过15%，为年内第三次触及这一阈值，前两次分别发生在3月和7月。 与前两轮不同的是， 三星电子的股票回购计划已告完成，SK海力士的回购也接近尾声——自8月底以来一直充当市场最稳定边际买家的企业回购力量，正从放缓走向退场。 摩根大通指出， 目前KOSPI前瞻市盈率处于纪录低位，剔除存储板块后仅为8.4倍，位于历史第11百分位，技术面亦显示14日RSI降至光复节以来最低，超卖个股比例扩至极端水平。 该行维持对韩国股市6至12个月的结构性看多立场，但同时指出，资金失衡与全球风险规避情绪的修复仍需时间，战术上在10月底前维持谨慎。 回购退场：这次急跌与前两次的根本差异 三次急跌，表面相似，内在逻辑却已发生关键变化。 3", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792415077.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "高盛上调CoreWeave至“买入”：市场高估了融资成本，低估了计算收费能力", "url": "https://wallstreetcn.com/articles/3783944", "date": "Mon, 19 Oct 2026 20:53:26 +0800", "desc": "高盛认为，投资者对CoreWeave资金支付方式的担忧过度，而对其计算收费潜力的重视又严重不足。 据追风交易台，高盛分析师Gabriela Borges和Maura Hager周一将CoreWeave评级从\"中性\"上调至\"买入\"，目标价106美元。鉴于该股自8月11日二季度财报发布后已累计下跌43%、过去五个交易日单独下挫24%，收于61.39美元，106美元的目标价仍意味着约73%的上行空间。 高盛在报告中直接援引\"Finance 101\"框架， 指出CoreWeave的企业价值与其无杠杆内部收益率（uIRR）和加权平均资本成本（WACC）之间的利差高度相关，并认为市场正在低估uIRR的上修幅度，同时高估了WACC的上升空间。 此次上调对市场情绪具有直接影响。 过去一周，CoreWeave无担保债券收益率攀升至13.5%至15%，信用违约互换（CDS）触及历史高位，德意志银行估算其未来1", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792414406.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "广发郭磊：实现年度增长目标已压力不大", "url": "https://wallstreetcn.com/articles/3783941", "date": "Mon, 19 Oct 2026 20:13:57 +0800", "desc": "第一，三季度实际GDP同比增长4.5%，高于我们预期的4.35%，偏高的9月出口和单月工业增加值数据形成带动。这样实际增长在二季度放缓的基础上小幅反弹，前三季度GDP累计同比为4.60%。四季度基数偏低，实现4.5-5.0%的年度增长目标已压力不大，理论上四季度同比4.2%即可以达到目标下限。 第二，三季度名义GDP同比为6.0%，高于一二季度的4.9%、5.9%。关于名义增长，我们的理解是：（1）名义增长决定企业盈利，三季度企业盈利环境理论上进一步略好于二季度；（2）不过目前的价格上涨在行业上较为集中，在报告《涨价的接力与换手》中，我们指出本轮涨价的两大线索分别是“全球地缘格局”（石油、化工、煤炭）、“全球产业变局”（有色、电子产品），其他行业价格仍偏弱，这对应微观体感可能会有一定分化。从提升经济增长广谱性、改善供求关系的角度，稳增长仍十分必要；（3）鉴于大宗价格处于经验偏高位，且四季度", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792412037.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "马斯克：明年向每个美国儿童赠送一股SpaceX股票，总价值约105亿美元", "url": "https://wallstreetcn.com/articles/3783940", "date": "Mon, 19 Oct 2026 19:53:52 +0800", "desc": "马斯克宣布将向全美每一名儿童赠送一股SpaceX股票，此举若兑现， 将构成有史以来规模最大的单次股权赠予之一，总价值约达105亿美元 。这一表态迅速引发市场对SpaceX股权结构、上市预期及马斯克财富分配意图的广泛关注。 当地时间10月19日，马斯克于在其旗下社交媒体平台X上发文称： \"明年，我将向美国每一个孩子赠送一股我的SpaceX股票，这将是许多次赠予中的第一次。\" 该帖子随后被马斯克置顶于其X主页。按美国人口普查局估计，美国目前约有7200万名儿童，以SpaceX当前每股146美元的价格计算，此次赠予总价值约为105亿美元。 然而，这一承诺的可操作性目前仍不明朗。马斯克并未就具体赠予方式、法律架构或税务安排作出任何说明，外界对于此举能否落地存在相当疑问。值得注意的是，马斯克此前有过多次提出宏大计划却未能兑现、或事后将其解释为玩笑的先例。 回应Anthropic，马斯克主张股权\"直接", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792410832.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "大摩Wilson：股市调整接近尾声，是时候准备布局了", "url": "https://wallstreetcn.com/articles/3783938", "date": "Mon, 19 Oct 2026 19:48:41 +0800", "desc": "摩根士丹利首席股票策略师Michael Wilson发出明确信号： 持续数月的股市内部调整正接近尾声，投资者应做好增加风险敞口的准备。 这一判断建立在质量因子突破新高、盈利修正分化加剧以及估值已完成大幅消化三重信号之上，为市场提供了难得的布局窗口。 据追风交易台， Wilson在最新客户报告中指出，尽管标普500指数距历史高点仅差约2%，但指数内部的市场广度已显著恶化，等权重版本自8月14日高点以来累计下跌近4%，金融、工业、非必需消费品等周期性板块承受了估值压缩的主要冲击。这一分化格局正是市场从早周期向中周期过渡的典型特征。 Wilson表示，\"我们建议投资者做好准备， 无论是迎接一次快速的修复，还是承受更缓慢地延续至11月的下行压力，因为在我们看来，届时将是增加风险（仓位）而非回避风险的时机。 \"与此同时，高盛策略师注意到投资者仓位正趋于防御，摩根大通则认为债券收益率企稳将对股市形成\"", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792410521.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "Vinted Cracks Down on Looted Goods After French Riots", "url": "https://www.bloomberg.com/news/articles/2026-10-19/vinted-faces-influx-of-suspected-looted-goods-after-french-riots", "date": "Mon, 19 Oct 2026 11:08:54 GMT", "desc": "Vinted, a secondhand online marketplace that counts France as one of its largest markets, has seen an influx of listings suspected to contain looted items after riots broke out across the country.", "tags": [], "topic_score": 0, "source": "Bloomberg Technology", "cat": "金融媒体_英文", "weight": 2, "ts": 1792408134.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "CME plans tungsten futures as demand for weapons rises", "url": "https://www.ft.com/content/96d88d61-002d-4b5c-8e0b-4f50577518c5?syn-25a6b1a6=1", "date": "Mon, 19 Oct 2026 10:30:57 GMT", "desc": "China has restricted exports of critical mineral used in armour-piercing munitions", "tags": [], "topic_score": 0, "source": "Financial Times", "cat": "金融媒体_英文", "weight": 2, "ts": 1792405857.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "Do You Trust Apple?", "url": "https://stratechery.com/2026/do-you-trust-apple/", "date": "Mon, 19 Oct 2026 10:00:00 +0000", "desc": "Apple has a lot of trust in terms of delivering integrated products and preserving privacy; the real trust question is if you think Siri AI will justify investing more in their ecosystem.", "tags": [], "topic_score": 0, "source": "Stratechery", "cat": "创投行业分析", "weight": 2, "ts": 1792404000.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "首批主动ETF获批，18家头部机构拔得头筹", "url": "https://wallstreetcn.com/articles/3783930", "date": "Mon, 19 Oct 2026 17:53:08 +0800", "desc": "来自业界的信息，仅仅经历3个月的审批流程，国内首批主动ETF产品于10月19日正式获批。 主动ETF是ETF行业的又一创新产品，此前我国ETF市场还未曾出现过。 据悉，首批主动ETF产品共有18家，都将于周五（10月23日）全面启动发行。其中9只基金预计挂牌上交所，包括 易方达、华夏、永赢、摩根、华泰柏瑞、汇添富、华安、招商、平安基金 ；9个主动ETF挂牌深圳交易所，包括 南方、富国、大成、鹏华、工银瑞信、华宝、国泰、天弘、建信基金 等。 其中，易方达预计将推出一只品质均衡风格的主动管理ETF，公司投研相关人士表示：主动股票ETF将主动管理的价值发现功能与ET was previously using Claude Code with Conductor and r", "tags": ["AI"], "topic_score": 5, "source": "HN Show HN", "cat": "AI实战_创作者", "weight": 5, "ts": 1792443434.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 33, "title_zh": "Show HN：Craig——用于运行并行编码智能体的 TUI", "desc_zh": "大家好 HN！我是 Sam，这是 Craig。Craig 是一个本地优先的 TUI，用于管理 AI 编码智能体。它不绑定特定智能体，默认创建隔离的 worktree，并提供丰富的 CLI 供智能体交互，以在 TUI 中操作状态和执行动作。我是在拿到一家使用 Cursor 的公司的录用通知后开始构建 Craig 的。我之前用 Claude Code 搭配 Conductor 和 r……"}, {"title": "OpenAI拟融资300亿美元，估值或超1.4万亿美元。据报道，OpenAI正加快推进一轮约300亿美元的融资，目标估值可能超过1.4万亿美元，并希望赶在竞争对手Anthropic预...", "url": "https://www.huxiu.com/moment/1289638.html", "date": "Tue, 20 Oct 2026 00:02:34 GMT", "desc": "OpenAI拟融资300亿美元，估值或超1.4万亿美元。 据报道，OpenAI正加快推进一轮约300亿美元的融资，目标估值可能超过1.4万亿美元，并希望赶在竞争对手Anthropic预计于11月中旬上市前获得投资者承诺。软银集团、阿布扎比投资机构MGX及其他现有投资者正洽谈参与本轮融资。 OpenAI向投资者表示，其年化营收在推出GPT-6 Astra模型后加速增长，目前已达500亿美元，预计年底升至700亿美元。 公司希望在Anthropic披露更多财务信息、引发投资者进一步比较之前完成融资。OpenAI今年3月在一轮1220亿美元融资后估值达到8520亿美元。", "tags": ["AI", "资本市场"], "topic_score": 11, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1792454554.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 32}, {"title": "Microsoft says AI agents are like insider threats as ‘frontier models can’t be trusted’", "url": "https://techcrunch.com/2026/10/19/microsoft-says-ai-agents-are-like-insider-threats-as-frontier-models-cant-be-trusted/", "date": "Mon, 19 Oct 2026 22:04:28 +0000", "desc": "Microsoft wants enterprises to closely watch the agents employees use with systems not controlled by AI labs like OpenAI and Anthropic.", "tags": ["AI"], "topic_score": 7, "source": "TechCrunch", "cat": "科技新闻", "weight": 4, "ts": 1792447468.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 32, "title_zh": "微软称 AI 智能体类似内部威胁，因为“前沿模型不可信”", "desc_zh": "微软希望企业密切关注员工在不受 OpenAI 和 Anthropic 等 AI 实验室控制的系统上使用的智能体。"}, {"title": "FederatedBytes: Tokenizer-Free, Byte-Level Sma const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
