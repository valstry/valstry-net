chmark for Evaluating LLM Tutors in Supporting Students with Challenging Behaviors", "url": "https://arxiv.org/abs/2610.30828", "date": "Fri, 23 Oct 2026 00:00:00 -0400", "desc": "arXiv:2610.30828v1 Announce Type: new Abstract: LLMs are increasingly used as AI tutors, yet existing benchmarks overlook the challenging behaviors common among students with learning and behavioral difficulties. We introduce TutorCaseBench, a benchmark that grounds AI-tutor evaluation in qualitative case studies from pedagogy, educational psychology, and special education. Our pipeline converts d", "tags": ["AI"], "topic_score": 3, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1792728000.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "RetiJev: Fast and Source-Grounded Ophthalmic Decision Models", "url": "https://arxiv.org/abs/2610.30947", "date": "Fri, 23 Oct 2026 00:00:00 -0400", "desc": "arXiv:2610.30947v1 Announce Type: new Abstract: Ophthalmic clinical decision support requires fast, accurate, and privacy-preserving inference, yet autoregressive large language models (LLMs) incur substantial latency and computational overhead for decisions among predefined actions. We therefore investigate a decision-oriented alternative to generative reasoning. Specifically, we first introduce ", "tags": ["AI"], "topic_score": 3, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1792728000.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "IQuest-Q1: Advancing Foundation Capabilities for Agentic CLI Systems", "url": "https://arxiv.org/abs/2610.30949", "date": "Fri, 23 Oct 2026 00:00:00 -0400", "desc": "arXiv:2610.30949v1 Announce Type: new Abstract: We present IQuest-Q1, a sparse Mixture-of-Experts (MoE) agentic foundation model with 320B total parameters (15B activated). IQuest-Q1 is developed through a three-stage process: (1) stable and efficient pre-training, combining Stable SplitNorm, Muon, and muP with a two-stage curriculum whose second stage increases the coding-data mixture, preserving", "tags": ["AI"], "topic_score": 3, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1792728000.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "A Reality Check of Inference-Time Context Augmentation Methods", "url": "https://arxiv.org/abs/2610.30983", "date": "Fri, 23 Oct 2026 00:00:00 -0400", "desc": "arXiv:2610.30983v1 Announce Type: new Abstract: Large language models (LLMs) often fail to utilise the context given in the input, resulting in hallucinations or a fallback to parametric knowledge. Context augmentation methods aim to improve model performance by modifying the input, from inserting filler tokens that add computational time to adding relevant content such as elaboration of a context", "tags": ["AI"], "topic_score": 3, "source": "arXiv cs.CL", "cat": "AI技术前沿", "weight": 3, "ts": 1792728000.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "关于 iPhone Duo，到手前你需要知道的 12 件事", "url": "https://www.36kr.com/p/4037781363545220", "date": "Fri, 23 Oct 2026 03:28:57 GMT", "desc": "相信第一批抢到 iPhone Duo 的朋友，已经陆续摸到新机了。 也有不少朋友虽然抢到了首发，却还在犹豫要不要留下。 关于 iPhone Duo 究竟是一台怎样的产品，我们昨天已经在首发评测里和大家深度聊过，首发｜我们用了一周的 iPhone Duo，这里有你关心的一切，但真正准备买它、用它的时候，许多藏在日常细节里的实际体验，往往才是决定去留的关键。 为此，爱范儿整理了几个大家比较关心的问题，聊聊 iPhone Duo 在购买和使用前，有哪些事情值得注意。 如果你还在持币观望，或者正对着刚拆封的新机纠结要不要留下，不妨先看完这篇再做 决定。 Only eSIM，换卡需要注意什么 在所有问题里，最先摆在面前、也最可能决定你要不要留下这台手机的，其实是 eSIM。 和海外版本一样，国行 iPhone Duo 这次也彻底取消了实体 SIM 卡槽。换卡这件事也变得麻烦了不少。 让人有些无奈的是", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1792726137.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "用 Claude 给小米电视去广告火了，这届用户开始用 AI 整顿智能硬件", "url": "https://www.36kr.com/p/4037841110422403", "date": "Fri, 23 Oct 2026 02:51:54 GMT", "desc": "现在还有年轻人往家里摆电视吗？且不说视频网站包罗万象，就算留一台电视在家里，开机后先出现的，可能不是你要看的节目，而是一排推荐、广告和用不上的预装应用，非常劝退。 最近，有人把电视型号交给 Claude Code，让它连上同一 Wi-Fi 下的 Android 电视，查出哪些软件在后台运行，再逐项关掉广告服务和预装应用，装上一张只保留常用应用的主屏幕。这一系列操作，最终成为一个开源项目，TV Detox。 「Detox」是排毒的意思，完全是疯狂暗示了旧的电视系统「有毒」。引入 AI，让它负责辨认软件和执行命令，用户只需在每次改动前确认。 这种改造有成熟的技术基础，Android 原本就有调试工具，熟练的人早就能手动完成。只是过去你得自己找出一长串看不懂的程序名，判断哪一个能关、哪一个维系着遥控器、投屏或电视开机；现在可以让编程助手先读一遍这台电视，再把它看到的东西翻译给你听。 因为类似的做", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1792723914.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "AI房产经纪人，第一单成交了", "url": "https://www.36kr.com/p/4037778327720835", "date": "Fri, 23 Oct 2026 01:21:49 GMT", "desc": "10月15日，卖方王女士和买方刘先生正式签订了珠海华发新城6期一套二手房的买卖合同，然后顺利办理过户手续。这套总价195万元的房子买卖，是国内AI经纪人主导的第一单交易。 这笔交易的线上挂牌、客户匹配、房源验真、输出小区成交参考价、线上议价等交易核心环节全由AI经纪人“易居小新”提供服务，真人只出现在线下实地带看、专业合同鉴证、过户服务等环节。 这笔交易还有特殊的一点：AI经纪人不收成交佣金，卖方把原本按传统模式要付给中介的4万元佣金，全部让利给了房子的下一任主人。 从“辅助”角色到真正站到了交易撮合的核心位置，AI终于迈出了关键一步。 当前国内房产经纪领域的AI应用分为两条完全不同路线。主流模式是AI作为提升效率和服务的工具，辅助经纪人作业。AI是中介的外挂，不改变原有商业模式，佣金规则不变，交易决策权仍然掌握在经纪人手里，贝壳、58安居客、中小中介平台都大规模在用。 代表产品有贝壳AI", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1792718509.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "Anthropic’s Elevator Problem: Persuading Investors to Share Its AI Dream", "url": "https://www.theinformation.com/articles/anthropics-elevator-problem-persuading-investors-share-ai-dream", "date": "2026-10-23T00:32:11Z", "desc": "", "tags": ["AI"], "topic_score": 3, "source": "The Information", "cat": "金融媒体_英文", "weight": 3, "ts": 1792715531.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "How To Build A Billion-Dollar Company Without Venture Capital", "url": "https://news.crunchbase.com/startups/bootstrapping-billion-dollar-company-ai-staffing-demarco-bairesdev/", "date": "Tue, 20 Oct 2026 11:00:46 +0000", "desc ilson, Principal of Consumer and Retail Strategy at KPMG US, discusses the firm’s holiday survey, which projects spending will increase 5% year over year. She says much of the rise reflects higher prices, though consumers are still willing to spend on priorities. She speaks to Romaine Bostick on \"The Close.\" (Source: Bloomberg)", "tags": [], "topic_score": 0, "source": "Bloomberg Technology", "cat": "金融媒体_英文", "weight": 2, "ts": 1792792584.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 14}, {"title": "特朗普政府扩大对加拿大商品关税豁免范围，助力中期选举", "url": "https://wallstreetcn.com/articles/3784359", "date": "Sat, 24 Oct 2026 05:46:39 +0800", "desc": "特朗普政府扩大对加拿大商品的关税豁免范围， 此举被普遍解读为助力缅因州共和党参议员Susan Collins的连任竞选。 Collins周五宣布，豁免范围将涵盖特定纸张、塑料、机械及海藻产品，称此举有助于该州农村和沿海经济，受益行业包括蓝莓、马铃薯、苹果及海藻产业。 据白宫文件，上述变化将于10月30日生效。 与此同时， 特朗普政府将对地毯、独木舟及棺材等其他品类加征新关税，以抵消豁免带来的整体关税影响，确保净影响保持不变。 此次调整发生在美加贸易谈判陷入僵局之际——自8月双方关税协议磋商破裂后，实质性谈判至今未能重启。 Collins正面临今年11月竞选连任的严峻压力，但此举也在政治上引发争议，民主党对手Troy Jackson批评称，Collins\"想要因端来一杯水灭火而居功\"。 豁免范围及关税替代安排 根据白宫文件，本次豁免涉及部分胶合板、纸制品、机械及制冷设备、包装箱等加拿大进口商", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792791999.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 14}, {"title": "AlixPartners Co-CEO Rob Hornby on AI Bull Case", "url": "https://www.bloomberg.com/news/videos/2026-10-23/alixpartners-co-ceo-rob-hornby-on-ai-bull-case-video", "date": "Fri, 23 Oct 2026 21:33:04 GMT", "desc": "Rob Hornby says AI costs are falling faster than those of comparable technologies historically, but remain substantial. He describes companies as being in a transition period: investment is underway while returns are uneven, and the shift from flat fees to per-token charges has exposed costs. He speaks with Romaine Bostick & Jess Menton on \"The Close.\" (Source: Bloomberg)", "tags": [], "topic_score": 0, "source": "Bloomberg Technology", "cat": "金融媒体_英文", "weight": 2, "ts": 1792791184.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 14}, {"title": "全球投资级企业债利差创一年半新高，AI融资潮冲击信用市场", "url": "https://wallstreetcn.com/articles/3784362", "date": "Sat, 24 Oct 2026 05:30:35 +0800", "desc": "全球信用市场正在发出逾一年来最强烈的避险信号。科技公司为人工智能建设大举举债的前景，叠加油价上涨与法国政局动荡，共同推动全球企业债利差急剧走阔。 彭博指数数据显示， 全球投资级企业债利差周四飙升至129个基点，创2025年5月以来最宽水平。 与此同时， 追踪美国蓝筹企业债违约保护成本的CDX投资级指数周五升至64个基点，触及3月以来高点。亚洲高评级美元债利差也扩至2025年7月以来最高，波动加剧迫使韩国进出口银行推迟一笔日元债券发行。 市场担忧的核心在于：以Meta为代表的科技巨头正在酝酿史无前例的融资规模， 而AI投资能否及时转化为盈利，仍是未知数。 PGIM Credit美国投资级企业债联席主管David Del Vecchio表示，\"市场正在消化为AI建设所需潜在发行规模带来的冲击，投资者几乎没有理由主动入场填补空缺。\" CreditSights新加坡南亚及东南亚企业债主管Laksh", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792791035.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 14}, {"title": "美国将氦列为关键材料，半导体制造是重要考量，全球供应中断风险上升", "url": "https://wallstreetcn.com/articles/3784355", "date": "Sat, 24 Oct 2026 05:29:13 +0800", "desc": "美国能源部将氦气正式列入关键材料清单，此举将为氦气生产商开辟更多联邦融资渠道，并强化政府对供应链的监控力度。在全球氦气供应面临多重扰动的背景下，这一决定凸显了氦气对半导体、量子计算及清洁能源等战略性产业的不可替代性。 美国能源部长Chris Wright在声明中表示，特朗普政府正致力于摆脱美国对外国关键材料的依赖，以强化本土制造业、保障国家经济与安全。 与此同时，卡塔尔因伊朗封锁霍尔木兹海峡导致氦气出口大幅萎缩，俄罗斯也于4月对氦气出口实施临时管制，全球供应压力骤然上升。 此次指定使氦气成为能源部关键材料清单上的第20个品种。美国半导体行业协会副会长David Isaacs表示，氦气在半导体冷却、光刻、泄漏检测等核心环节发挥着不可或缺的作用，行业期待与政府及产业界合作，共同提升半导体供应链韧性。 供应风险升级，倒逼政策行动 氦气被纳入关键材料清单的直接导火索，是全球供应格局的急剧恶化。卡塔", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792790953.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 14}, {"title": "高管揭示Meta AI订阅变现新路：Muse免广告但企业服务收费，智能体购物抽成", "url": "https://wallstreetcn.com/articles/3784364", "date": "Sat, 24 Oct 2026 05:18:40 +0800", "desc": "Meta正试图为AI业务寻找一条不同于传统广告的变现路径。 Meta首席AI官Alexandr Wang在接受日经新闻采访时表示，Meta的个人AI智能体Muse将坚持免广告，普通用户可免费使用，但高阶功能和企业服务将收费，公司还计划从智能体促成的购物交易中抽取佣金。Wang表示，Muse不仅能够回答问题，还可以代替用户执行任务、节省时间和金钱，因此比此前的AI产品更有用。 日经新闻发稿当天、10月23日周五，Muse首次登陆日本市场。Muse 9月8日在北美上线后反响热烈，相关应用下载量六周即达到1000万次，增长速度超过包括ChatGPT在内的部分竞品。 从个人订阅到企业服务，探索广告之外的收入 Alexandr Wang表示，Muse对普通用户免费开放，Meta希望未来将其推广至数十亿用户。不过，对于重度用户，以及希望使用最先进模型的用户，公司已经推出订阅方案。Meta也计划向企业提", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792790320.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 14}, {"title": "The Urgent Need for Whistleblowers", "url": "https://www.bloomberg.com/news/videos/2026-10-23/opinion-the-urgent-need-for-whistleblowers-video", "date": "Fri, 23 Oct 2026 21:00:31 GMT", "desc": "“You Can See Everything” is the latest reminder of how whistleblowers are more important than ever. But at the same time the role is becoming more complicated — and opaque, Bloomberg Opinion columnist Beth Kowitt says. (Source: Bloomberg)", "tags": [], "topic_score": 0, "source": "Bloomberg Technology", "cat": "金融媒体_英文", "weight": 2, "ts": 1792789231.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 14}, {"title": "美油盘中涨超4%，布油冲向117美元、又创五个月新高，中东风险持续、空头回补加把火", "url": "https://wallstreetcn.com/articles/3784356", "date": "Sat, 24 Oct 2026 04:53:14 +0800", "desc": "中东能源供应风险持续升温，叠加周末前空头回补及期权对冲买盘，国际原油进一步走高。 美东时间23日周五美股早盘时段，布伦特原油一度突破117.40美元/桶，日内涨近3.8%；美股尾盘盘时，美国WTI原油曾涨破103.90美元、日内涨近4.5%。 到收盘，WTI 12月原油期货涨3.82%，创9月15日以来最大涨幅，报103.27美元/桶，本周累涨4.29%；布伦特12月原油期货涨3.14%，报116.72美元/桶，在周四收创5月4日以来新高后，又刷新4月29日以来收盘高位，本周累涨6.24%，创9月11日以来最大周涨幅。 截至周五，美油连涨三周，三周累涨13.35%，布油连涨五周，年内累计涨幅已超过85%，中东冲突引发的供应风险溢价仍是支撑油价的重要力量。 因此，后续市场需要重点关注中东冲突是否进一步波及关键产油设施及运输通道、霍尔木兹海峡原油出口能否保持恢复势头，以及柴油等成品油的供应紧张", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792788794.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 14}, {"title": "AI Ushers in New Era of Cybersecurity Needs", "url": "https://www.bloomberg.com/news/videos/2026-10-23/ai-ushers-in-new-era-of-cybersecurity-needs-video", "date": "Fri, 23 Oct 2026 20:25:56 GMT", "desc": "The US government is working to address and stop any poten const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
