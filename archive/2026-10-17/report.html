791399832.0, "opinion": true, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 27}, {"title": "官方拟修订《中国禁止出口限制出口技术目录》，增列部分人工智能、生物医药、光伏技术，背后有哪些考量？", "url": "https://www.zhihu.com/question/2094468473413789647", "desc": "2026 年 10 月 16 日，商务部、科技部发布 2026 年第 48 号公告，就修订《中国禁止出口限制出口技术目录》（以下简称《目录》）公开征求意见，并对相关技术实施出口前登记的临时管理措施。日前，商务部新闻发言人就有关问题回答了记者提问。 问：《目录》修订的背景是什么？ 答：根据《中华人民共和国对外贸易法》第二十条，国务院对外贸易主管部门会同国务院其他有关部门，制定、调整并发布禁止或限制出口的技术目录。自 2001 年以来，商务部会同科技部多次调整修订《目录》，有进有出，有管有放，已形成工作惯例。此次修订亦是技术贸易管理的常态化工作，依法依规进行，不针对任何特定国家、地区或实体。 近年", "date": "", "hot": 0, "tags": ["AI"], "topic_score": 2, "source": "热搜-知乎", "cat": "热点榜_发生了什么", "weight": 5, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 27}, {"title": "英伟达美国官网下架RTX5090", "url": "https://search.bilibili.com/all?keyword=%E8%8B%B1%E4%BC%9F%E8%BE%BE%E7%BE%8E%E5%9B%BD%E5%AE%98%E7%BD%91%E4%B8%8B%E6%9E%B6RTX5090", "desc": "", "date": "", "hot": 0, "tags": ["AI"], "topic_score": 2, "source": "热搜-B站", "cat": "热点榜_发生了什么", "weight": 5, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 27}, {"title": "OpenAI Poaches Another SpaceX Sales Lead Focused on AI", "url": "https://www.bloomberg.com/news/articles/2026-10-16/openai-poaches-another-spacex-sales-lead-focused-on-ai", "date": "Fri, 16 Oct 2026 21:36:22 GMT", "desc": "OpenAI has hired SpaceX’s Graham Seamans to lead sales for the firm’s cybersecurity business, the latest in a string of hires from Elon Musk’s artificial intelligence venture.", "tags": ["AI", "个人成长"], "topic_score": 6, "source": "Bloomberg Technology", "cat": "金融媒体_英文", "weight": 2, "ts": 1792186582.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 26, "title_zh": "OpenAI 再挖走 SpaceX 一位专注 AI 的销售负责人", "desc_zh": "OpenAI 已聘请 SpaceX 的 Graham Seamans 领导其网络安全业务的销售，这是该公司从 Elon Musk 的 AI 事业中挖来的又一人。"}, {"title": "8-K - NATIONAL RURAL UTILITIES COOPERATIVE FINANCE CORP /DC/ (0000070502) (Filer)", "  "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "Asia’s Startup Funding At Near Record High In Q3, Driven By AI", "url": "https://news.crunchbase.com/venture/q3-2026-asia-startup-funding-near-record-ai/", "date": "Fri, 16 Oct 2026 11:00:42 +0000", "desc": "Overall, investors put $38.5 billion into reported seed- through growth-stage financings for Asian startups in Q3, per Crunchbase data. Of that, a majority went to AI-focused companies, echoing the trends we’ve seen globally.", "tags": [], "topic_score": 0, "source": "Crunchbase 融资板块", "cat": "创投行业分析", "weight": 5, "ts": 1792148442.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21, "title_zh": "亚洲创业融资在 Q3 逼近历史高位，受 AI 驱动", "desc_zh": "总体而言，据 Crunchbase 数据，第三季度投资者向已披露的亚洲初创企业种子轮至成长期融资投入了 385 亿美元。其中大部分流向了专注 AI 的公司，与我们在全球看到的趋势一致。"}, {"title": "10-K - Accenture plc (0001467373) (Filer)", "url": "https://www.sec.gov/Archives/edgar/data/1467373/000146737326000049/0001467373-26-000049-index.htm", "date": "2026-10-16T06:22:21-04:00", "desc": "Filed: 2026-10-16 AccNo: 0001467373-26-000049 Size: 25 MB", "tags": [], "topic_score": 0, "source": "SEC 最新 10-K 年报", "cat": "企业行为_美股披露", "weight": 5, "ts": 1792146141.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "Anthropic Says AI Evaluators Can Now Work at Company", "url": "https://www.theinformation.com/briefings/anthropic-says-ai-evaluators-can-now-work-company", "date": "2026-10-16T07:14:41Z", "desc": "", "tags": ["AI"], "topic_score": 3, "source": "The Information", "cat": "金融媒体_英文", "weight": 3, "ts": 1792134881.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "入门款卖到1350元，昂跑凭什么？｜专访", "url": "https://www.36kr.com/p/4025220294004611", "date": "Fri, 16 Oct 2026 05:53:08 GMT", "desc": "文｜贺哲馨 编辑｜乔芊 在苏黎世 昂跑更像一家硅谷的科技公司，而非一家跑鞋企业。 在瑞士苏黎世西区，这座城市过去的重工业带，昂跑的全球总部 On Labs 就在这里。整幢楼风格冷峻，内饰用了大量不锈钢和玻璃材料。广场一侧是工坊，粗犷的水泥地面上立着高精度的喷织机械臂。不远处的实验室里，时不时有运动员来测试最新的产品。科学家在跑步机旁，把数据记进电脑，作为下一轮产品调整的依据。 大楼一层有一家叫 Roots 的素食餐厅。天光好的中午，你会看到清一色脚踩昂跑的员工在这里进餐、休憩。步行五分钟之内，是苏黎世艺术大学和苏黎世应用科技大学——昂跑把它们看作创新、设计和人才培养的天然邻居。 昂跑联合创始人 David Allemann 很喜欢拿一些科技消费品公司自比。“昂跑应该像苹果和戴森，”他对36氪说，“精致的外表，创新的内核，高端的定位。” Premium（高端），也是我们拜访期间，昂跑管理层和", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1792129988.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "是的，特斯拉真造了一辆「飞行汽车」", "url": "https://www.36kr.com/p/4028000383324547", "date": "Fri, 16 Oct 2026 04:08:06 GMT", "desc": "我们知道马斯克是个疯子，但没想到他能这么疯。 当地时间 10 月 16 日，在 SpaceX 于州 McGregor/Waco 的火箭试验场上，一段向上垂直弯过来的人造公路上，一台白色跑车以匪夷所思的状态，反重力地贴在了上面的弯上。这还不算完，在这段路上倒车加速后，这台车脱离公路，直接飞到空中，转体并通过推进器稳稳落地。 无法形容的酷｜图片来源：Tesla 新一代的特斯拉 Roderster 跑车，就以这种情况，完成了自己的首秀。 伊隆·马斯克在开场时候告诉现场观众：「我们确定没问题，但要是不巧的话，咱们这里的安全距离可不太够。」 当然，你知道的，一些恐惧，恰恰能激起人们更大的兴奋，老马是懂行的。 测试的 Rocket 版本使用的并非真人驾驶员｜图片来源：Tesla 除了能飞，新一代 Roderster 跑车据悉将有三个版本，Performance、Thrust 和 Rocket 版本，其", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1792123686.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "马斯克造了一辆来自2077年的“科幻超跑”，它会飞", "url": "https://www.36kr.com/p/4028009049395590", "date": "Fri, 16 Oct 2026 03:51:08 GMT", "desc": "一辆特斯拉和SpaceX联合打造的“科幻超跑”终于揭开面纱。 10月16日，特斯拉通在位于德克萨斯州麦格雷戈（McGregor）、紧邻SpaceX 火箭测试的场地，正式举行第二代Roadster的揭幕与技术演示活动。 特斯拉透露，新款Roadster分为性能版、限量推力版和仅限邀请的火箭版。推力版零百加速推进到1秒以内。消费者可以预定性能版本，标称483公里续航，订金33.2万元，预计2028年开始量产交付。 其中火箭版改为单座赛道布局，在车辆周边包裹圈全方位布置了由SpaceX深度开发的冷气推进喷嘴，支持前向、向上及横向旋转推进，使其真正具备了悬停与飞行能力。 为此，特斯拉专门向美国联邦航空管理局申请了场地周边的临时禁飞区。 “这是特斯拉和SpaceX工程师们紧密合作完成的非凡成果，是你在任何电影里都未曾见过的东西。那比任何一辆詹姆斯·邦德的座驾都要棒。”马斯克说。 2008年，马丁·艾", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1792122668.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "前钉钉总裁叶军，离职一年后创业了，赌大厂做不了也不屑做的「缝隙」", "url": "https://www.36kr.com/p/4027938341867904", "date": "Fri, 16 Oct 2026 03:32:38 GMT", "desc": "文 | 刘思洁 编辑 | 张薇 封面来源 | Unsplash 从阿里离职一年后，前阿里副总裁、钉钉总裁叶军的创业方向终于敲定：企业级AI Agent。新公司深空之序成立约3个月，已经获得千万元融资，领投方为广州四三九九信息科技有限公司，并有两家客户付费。 对叶军来说，这或许带着点延续未竟之事的意味。 离开钉钉对叶军来说，有点始料未及。彼时，钉钉正在全力准备8.0发布会，计划推出一个全面转向Agent底座版本，被他称为钉钉“AI版本”。2025年3月31日，接到职位调整的通知。 三个月后，叶军离开了工作19年的阿里。 那场没有召开的发布会，成为了叶军AI实践路上的一个遗憾。在钉钉时，他一直信奉“Agent是下一个时代的窗口”，2022年开始推动业务全面转向AI。 叶军很清楚，曾经他想做的事情，只能依托于大厂的平台去做。现在，作为一个创业者，他能做的则是用自己过往的资源和经验，去抵达大厂做不", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1792121558.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "健身、炒股、姐弟恋？“中女三件套”是对她们最大的误解", "url": "https://www.36kr.com/p/4027825224339842", "date": "Fri, 16 Oct 2026 01:15:41 GMT", "desc": "仅仅10来年，“中女”从一种被污名化的标签变成一种勋章，“中女时代”的奇点已经到来了吗？ 当我们谈论中女时，谈的不只是消费力强的“超级用户”，更是具有能动性的创造主体。 中女无须以资产界定身份，她们是有一定成熟度、开始或持续探索生活可能性的女性，指向的是一种生活的态度或主体性意识。 她们有了前几代人所没有的力量——80%以上家庭的消费决策由中女做出，通过互联网，她们拥有了构建自己事业版图的更多可能性。中女是消费者，同时也是大小生意人、投资人、主理人…… 中女如同一滴水。她们转换自身的状态，在际遇中想象新的可能。她们之中，有人负责前行及探索：离开传统稳定单位后，能否创造出不内卷的工作？ 对所谓“好工作”的想象，也是对人的存在形式的想象。她们努力保留自我、拥有自己可做的事，也试图处理好工作和生活之间的张力。 中女是中流砥柱，也意味着她们是承压主体。 随着社会整体晚熟，人到30岁才算“社会性成年", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1792113341.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "16天，他用Opus 5.5把《小王子》做成3D游戏，书里的星球能逛了", "url": "https://www.36kr.com/p/4027808060101250", "date": "Fri, 16 Oct 2026 01:14:51 GMT", "desc": "他用了16天，把《小王子》做成了一款能玩的3D剧情游戏。 10月13日，开发者Sac在X上公布了自己的作品。 据Sac介绍，他用Opus 5.5，结合3D模型生成工具Tripo和3D制作软件Blender，把故事中的每颗星球变成了可以探索的3D场景。 这款游戏的名字叫《小王子：星辰之旅》（The Little Prince: Across the Stars），目前已经有了独立的网站入口。 对这本书的粉丝来说，仅仅是能亲自走进那些曾经在脑海里想象过的地方，就足已让人心动。 小王子的星球，可以亲自逛了 先看作者放出的演示。 金发的小王子站在草木和岩石之间，远处是铺展开来的云海。 镜头转入室内，木质屋顶下，墙上挂着地图，两侧摆着书架。 另一段画面里，小王子在沙地上奔跑，影子跟着脚步移动。 从云海到房间，再到沙漠，书中的人物和环境，有了具体的形状、光影和空间。 对于读过《小王子》的人，这种改编很", "tags": [], "topic_score": 0, "source": "36氪 热榜", 方式的可选消费品，而非仅具仪式价值的物品。事实上，这一转变也解释", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1792196012.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "“双11”大战提前启幕，AI成为重要抓手。2026年“双11”大促拉开帷幕，天猫、京东于10月15日举办大促发布会，抖音同日官宣启动，头部平台同台竞逐。面对存量市场...", "url": "https://www.huxiu.com/moment/1288948.html", "date": "Sat, 17 Oct 2026 00:12:46 GMT", "desc": "“双11”大战提前启幕，AI成为重要抓手。 2026年“双11”大促拉开帷幕，天猫、京东于10月15日举办大促发布会，抖音同日官宣启动，头部平台同台竞逐。面对存量市场竞争，平台一改往年繁复的玩法，将大促提前、简化活动规则，争夺用户注意力与商家资源。不同于以往主要依靠价格补贴拉动增长，本届“双11”的显著变化是，AI成为重要抓手，AI工具、电商智能体覆盖了商家经营全链路。 与此同时，一键出海工具、海外仓履约体系与跨境AI应用持续降低跨境运营门槛，出海业务有望成为本届大促新亮点。业内人士表示，一键出海大幅降低商家出海门槛，海外仓破解跨境物流时效、售后体验痛点，跨境AI智能体补齐询盘、报关、合规风控等短板。整体来看，电商出海竞争正从单纯商品输出，转向综合服务能力比拼。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1792195966.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "中央气象台发布强对流天气蓝色预警。中央气象台10月17日06时继续发布强对流天气蓝色预警：预计10月17日08时至18日08时，黄淮中部、江淮西部、江汉中东部、江南西...", "url": "https://www.huxiu.com/moment/1288943.html", "date": "Fri, 16 Oct 2026 23:24:14 GMT", "desc": "中央气象台发布强对流天气蓝色预警。 中央气象台10月17日06时继续发布强对流天气蓝色预警：预计10月17日08时至18日08时，黄淮中部、江淮西部、江汉中东部、江南西部等地的部分地区将有8级以上雷暴大风或冰雹天气，其中，河南南部、湖北东部、湖南北部等地的部分地区将有10级以上雷暴大风，最大风力可达11级以上；东北地区南部、华北东部、黄淮、江淮、江汉、西南地区东部、江南西部等地的部分地区将有小时雨量大于20毫米的短时强降水天气，其中，辽宁东部和南部、山东南部、湖北南部、湖南北部、重庆东北部等地的部分地区小时雨量大于50毫米，最大可达70毫米以上。预计，强对流的主要影响时段为今天午后至夜间。 防御指南：1.政府及相关部门按照职责做好防短时暴雨、防雷、防大风准备工作，气象部门做好人工防雹作业准备；2.户外行人和工作人员减少户外活动，注意远离棚架广告牌等搭建物；3.驱赶家禽、牲畜进入有顶篷的场所", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1792193054.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "金价银价油价都涨了。受中东冲突加剧、美国原油库存下降等因素影响，国际油价16日显著上涨。截至当天收盘，纽约商品交易所11月交货的轻质原油期货价格收于每桶10...", "url": "https://www.huxiu.com/moment/1288942.html", "date": "Fri, 16 Oct 2026 23:21:15 GMT", "desc": "金价银价油价都涨了。 受中东冲突加剧、美国原油库存下降等因素影响，国际油价16日显著上涨。截至当天收盘，纽约商品交易所11月交 干预", "url": "https://www.caixin.com/2026-10-17/102494162.html", "date": "Sat, 17 Oct 2026 00:28:56 GMT", "desc": "新指南强调，肥胖管理不仅是为了改善体重，更是要保护儿童青少年的身心健康，促进健康成长和终身福祉 2024年，全球有1.7亿名5—19岁儿童和青少年患有肥胖症，其中包括7000万名儿童（5—9岁）和1亿名青少年（10—19岁），且这一年龄段的肥胖患病率已从1990年的2%上升到2024年的8%。图：视觉中国 【财新网】 肥胖作为一种疾病，会对儿童和青少年的身心健康产生深远影响。2024年，全球有1.7亿名5—19岁儿童和青少年患有肥胖症，其中包括7000万名儿童（5—9岁）和1亿名青少年（10—19岁），且这一年龄段的肥胖患病率已从1990年的2%上升到2024年的8%。 近日，世界卫生组织发布首份全球儿童和青少年肥胖管理指南，并披露上述数据。《指南》表示，世卫各成员国儿童和青少年肥胖患病率持续上升，而肥胖对身心健康、非传染性疾病早发及生活质量均会产生消极影响，亟需科学的干预措施。该《指南》", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1792196936.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "新能源投资格局重塑 资产金融化属性有望增强", "url": "https://www.caixin.com/2026-10-17/102494159.html", "date": "Sat, 17 Oct 2026 00:27:44 GMT", "desc": "尽管新能源电价和资产收益仍面临压力，但随着电力市场化改革推进、电价更多反映真实供需关系，长期资本看到新的投资机会 2026年7月31日，山东枣庄一处光伏发电站。图：视觉中国 【财新网】 “虽然目前很多投资人持悲观态度，但在我们看来，风电仍然是基础设施投资的最优选项之一。”10月15日，在北京国际风能大会上，能源投资机构衡正资本首席执行官徐彬表示。 徐彬认为，当前新能源资产持有方的痛点是“有装机、没收入；或有收入、没利润”。 风光新能源全面入市背景下，新能源电价持续下行，这给新能源投资方带来挑战。2025年2月，国家发改委、国家能源局联合发布《 关于深化新能源上网电价市场化改革 促进新能源高质量发展的通知 》（136号文），推动新能源全面入市。“最大的挑战在于，市场化交易之后，我们究竟应该以什么样的锚点，评估一个风电资产未来20年、25年的价值？”他说。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1792196864.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "[问与答] 低空飞行器来了, 人类进入低空飞行交通时代?", "url": "https://www.v2ex.com/t/1249498#reply9", "date": "2026-10-17T00:23:21Z", "desc": "", "tags": [], "topic_score": 0, "source": "V2EX 最新", "cat": "AI实战_创作者", "weight": 3, "ts": 1792196601.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "德国一机器人当街对人进行性暗示触碰 拥有者遭调查机器人被扣留(含视频)", "url": "https://international.caixin.com/2026-10-16/102493999.html", "date": "Sat, 17 Oct 2026 00:15:47 GMT", "desc": "德国刑警部门正以涉嫌“带有性意味的侮辱”罪名对该事件展开调查，涉事机器人已被扣押 当地时间2026年10月11日，德国科隆，警方公布了一台扣押的机器人。图：视觉中国 【财 ore earlier this week, a user on Reddit says they're seeing a fake version of WhatsApp in a \"sponsored\" slot above the real version. As reported earlier by Android Authority, the WhatsApp dupe has racked up over 500,000 downloads and, at the time of writing, its […]", "tags": [], "topic_score": 0, "source": "The Verge", "cat": "科技新闻", "weight": 3, "ts": 1792162943.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 15}, {"title": "[分享创造] 宝可梦塔防", "url": "https://www.v2ex.com/t/1249488#reply0", "date": "2026-10-16T15:01:35Z", "desc": "", "tags": [], "topic_score": 0, "source": "V2EX 最新", "cat": "AI实战_创作者", "weight": 3, "ts": 1792162895.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 15}, {"title": "美联储主席对话IMF总裁：AI对经济影响复杂，央行如何应对尾部风险", "url": "https://economy.caixin.com/2026-10-16/102494133.html", "date": "Fri, 16 Oct 2026 14:58:28 GMT", "desc": "以保证价格稳定和充分就业为使命的中央银行，必须认识到AI会带来冲击；保护央行的信誉，就是要把政策做好、做对 10月16日，沃什与国际货币基金组织总裁格奥尔基耶娃在2026年IMF/世界银行年会期间进行了一次公开对谈。图：IC photo 【财新网】 人工智能（AI）革命给全球经济带来了什么？美联储主席沃什（Kelvin Warsh）相信AI能提高生产力并创造更多财富，但这条道路注定筚路蓝缕。“虽然这个趋势也许不会影响美联储当前的决策，但我认为中央银行要为未来的政策制定‘投资’。” 10月16日，沃什与国际货币基金组织（IMF）总裁格奥尔基耶娃（Kristalina Georgieva）在2026年IMF/世界银行年会期间进行了一次公开对谈。这是沃什第一次以美联储主席身份参加该年会，但他在此之前已与格奥尔吉耶娃熟识，沃什称为“一对老友”；而格奥尔吉耶娃也对沃什有着很不错的印象，颇为赞许地评价", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1792162708.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 15}, {"title": "禁止出口目录拟增列部分生物医药技术，涉及CGT、小核酸等", "url": "https://www.caixin.com/2026-10-16/102494136.html", "date": "Fri, 16 Oct 2026 14:58:28 GMT", "desc": "业内关心管理范围是否包括对外授权许可等BD交易，文件显示，此次列管对国际合作的重要情形作出排除或适用便利措施 资料图：江苏苏州疾控中心病原微生物与生物检验。图：视觉中国 【财新网】 10月16日，商务部、科技部发布公告，就修订《中国禁止出口限制出口技术目录》（下称《目录》）公开征求意见，拟增列部分人工智能、生物医药、光伏技术，其中生物医药相关技术5项，涉及细胞和基因治疗、小核酸药、病原微生物三个细分领域。 中国创新药近年以对外授权许可等形式“出海”潮起后，技术出口相关政策风向愈发受到行业和市场关注。两部门征求意见稿显示，此次拟增列的5项生物医药技术中，3项技术拟禁止出口、2项技术拟限制出口。", "tags": [], "topic_sco 为，此举剥削选民投票权，且有益于印度总理莫迪的执政党、印度教民族主义政党印度人民党（印人党）。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1792161361.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 15}, {"title": "俄安全局拘押一名日本记者 被控协助日政府调查北方四岛动员参战情况", "url": "https://international.caixin.com/2026-10-16/102494093.html", "date": "Fri, 16 Oct 2026 14:27:06 GMT", "desc": "日本方面否认这名记者在俄罗斯从事间谍活动 当地时间2026年10月14日，俄罗斯联邦安全局近日在萨哈林州逮捕了日本《北海道新闻》驻萨哈林州首府南萨哈林斯克的一名记者，理由是这名日籍记者涉嫌从事间谍活动。图：IC photo 【财新网】 10月13日，俄罗斯联邦安全局（FSB）公布了其以涉嫌间谍活动为由，拘押日本《北海道新闻》驻俄罗斯远东记者今井裕纪的消息，并将其从萨哈林州移送至莫斯科。日本方面否认这名记者在俄罗斯从事间谍活动。 当地时间10月16日上午，日本内阁官房长官木原稔在首相官邸举行记者会时表示，俄罗斯方面已于当地时间10月15日就此事向日本作出领事通报，但日本外交人员仍未能接触今井裕纪。 木原稔表示，日本政府将继续要求俄方尽快安排领事探视，“首先要尽早实现领事会面，以便确认其本人的健康状况以及本人对事实的认识。我们将为此全力以赴”。他称，日本政府将继续“强力敦促俄方”，采取必要措施", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1792160826.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 15}, {"title": "胡塞武装袭击也门总统府致5人死亡 沙特指责伊朗助长局势升级", "url": "https://international.caixin.com/2026-10-16/102494088.html", "date": "Fri, 16 Oct 2026 14:27:06 GMT", "desc": "联合国安理会强烈谴责胡塞武装持续对沙特阿拉伯发动袭击，包括针对民用航空和能源基础设施的袭击 当地时间10月14日，沙特支持的也门政府军等武装力量与胡塞武装在塔伊兹市西南方向激烈交火。图：央视新闻 【财新网】 当地时间10月15日，也门胡塞武装用导弹袭击了位于也门南部城市亚丁马希克宫（Maashiq Palace）的也门总统府，造成5人死亡，至少16人受伤。社交媒体上出现的视频显示，袭击发生后，浓烟从马希克宫上空升起。 也门信息部长穆阿迈尔·埃尔亚尼（Moammar al-Eryani）表示，也门总理沙亚·穆赫辛·赞达尼（Shaya Mohsin Zindani）没有在袭击中受伤。据CNN报道，赞达尼的2名安保人员在此次袭击中丧生。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1792160826.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 15}, {"title": "【我闻】资深财金技术官僚黄奇帆被查 一位政坛不倒翁的跌宕之路", "url": "https://wenews.caixin.com/2026-10-15/102493639.html", "date": "Fri, 16 Oct 2026 14:15:31 GMT", "desc": "土地财政金融模式的首位践行者，久经政坛风雨，为重庆经济发展颇有创新之举，但昔日的隐患也已成风险 图：视觉中国 【金融我闻/刘冉 程思炜 张一川】 近年来常以学术观点活跃于舆论场的十八届中央委员、重庆原市长 黄奇帆 ，在退休10年后官宣落马。 从上海到重庆，74岁的黄奇帆的经历可谓久经风雨，有罕见的政坛不倒翁之称。在2016年底从重庆市长任上退休后，黄奇帆出任了 0", "desc": "金融市场分析平台The Market Ear认为，纳斯达克100指数（NDX）正处于技术与基本面的双重考验之中。在经历一轮剧烈抛售后，指数在关键趋势支撑位和100日均线交汇处形成锤形反转K线，多空双方在此展开决定性博弈，若守住，可能触发强力轧空行情，若跌破，则市场或将急速恶化。 本周四盘中，半导体行业基金VanEck Semiconductor ETF（SMH）和内存产业基金Roundhill Memory ETF（DRAM）相关标的成交量暴增至近期峰值，多空对冲基金账面遭受重创，全球系统性多空策略一日下跌1.4%，接近四个标准差的极端波动。与此同时，科技股信用违约互换（CDS）利差持续走阔，信用市场与股票市场的压力信号罕见地趋于一致。 当前，NDX远期市盈率已回落至约21倍，重回2023年AI行情启动以来的估值低点。分析人士指出，随着仓位持续出清，进入财报季后盈利端或将成为支撑估值的关键", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792163481.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "日赚4.8亿元！长鑫科技前三季度净利润超1300亿元，同比扭亏为盈，拟最高20亿回购股票", "url": "https://wallstreetcn.com/articles/3783806", "date": "Fri, 16 Oct 2026 21:45:16 +0800", "desc": "AI算力需求持续升温，全球DRAM市场景气度上行，长鑫科技迎来业绩大幅反转。 周五晚上，长鑫科技发布业绩预告， 预计2026年前三季度归属于上市公司股东的净利润达1310亿元至1325亿元，较上年同期亏损52.80亿元实现大幅扭亏为盈，增幅逾千亿元， 标志着这家国内存储芯片龙头在AI驱动的行业景气周期中完成了一次历史性跨越。 根据公告， 同期营业收入预计约为2650亿元至2700亿元，较上年同期320.84亿元增加逾2300亿元，同比增幅超过七倍。 公司将业绩大幅改善归因于AI算力需求快速增长带动全球DRAM行业景气度提升，产品供不应求，价格大幅上涨，同时公司产能利用率保持高位运行，规模效应持续显现。 与此同时，公司董事长朱一明提议以自有或自筹资金回购公司A股股份， 回购资金总额不低于10亿元、不超过20亿元，回购价格不高于董事会审议通过回购方案决议前30个交易日股票交易均价的150 %，", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792158316.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "生存还是毁灭？德银：AI大潮下，企业“要么改变，要么死亡”，没有中间路线", "url": "https://wallstreetcn.com/articles/3783805", "date": "Fri, 16 Oct 2026 21:26:40 +0800", "desc": "人工智能正在重塑每一个行业的竞争格局，而德意志银行警告，真正的风险并非AI交易整体退潮，而是AI将把每个行业的企业切割成截然对立的两类：采纳者与出局者。 德意志银行研究院在一份题为《AI繁荣还是末日：超级智能将带来什么感受，何时到来》的20页报告中指出，随着AI能力持续跃升，企业将被迫分化为\"双峰\"格局—— 采纳者与出局者之间几乎不存在中间地带。 报告援引前谷歌CEO Eric Schmidt提出的\"旧金山共识\"——即硅谷主流观点认为，通过规模化定律与AI自我迭代，超级智能将于2030年前后到来——并据此推演出对投资组合的深远冲击。 这一判断的直接市场含义是：传统投资组合管理的三大基石——分散化、以历史波动率衡量风险、下跌时买入——在双峰世界中均可能失效。本周AI板块的剧烈震荡提供了一次现实演练：新云服务商与存储芯片制造商遭受重创，部分看似平静的股价在崩跌前夕波动率处于历史最低分位。 \"要", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792157200.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "巴克莱：AI交易“最佳阶段”已过，芯片股暴跌是仓位出清而非基本面崩塌", "url": "https://wallstreetcn.com/articles/3783804", "date": "Fri, 16 Oct 2026 21:17:14 +0800", "desc": "AI交易动摇之际，市场将目光投向即将到来的财报季，寻找这场史无前例的科技投资浪潮能否兑现回报的答案。 Meta Platforms将率先在下周公布季度业绩，成为超大规模科技公司中首个接受市场检验的\"AI资本开支样本\"。 高盛预测， 包括Meta在内的五大超大规模公司明年合计资本支出将升至约1.2万亿美元，投资者迫切希望从Meta财报中寻找这些巨额投入能否转化为可持续盈利的信号 。与此同时，费城半导体指数本月已累计下跌8%，AI云计算公司CoreWeave因约500亿美元债务引发的融资风险警报，令市场情绪愈发脆弱。 在此背景下，Meta财报的意义已远超单一公司业绩本身——它将为后续科技巨头财报定下基调，并直接考验市场对AI投入产出比的定价逻辑是否站得住脚。 AI交易出现裂痕，市场情绪趋于谨慎 支撑本轮牛市长达四年的AI主线交易，近期出现明显动摇。半导体公司及戴尔科技等科技硬件企业股价大幅回调", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792156634.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "报道：CoreWeave三位创始人在股价崩跌前套现33亿美元", "url": "https://wallstreetcn.com/articles/3783800", "date": "Fri, 16 Oct 2026 20:58:54 +0800", "desc": "CoreWeave三位联合创始人在公司股价崩跌前累计套现逾33亿美元，而当前该公司债券已跌入困境区间，信用违约互换利差飙至历史高位，市场对其偿债能力的担忧急剧升温。 据彭博对公司申报文件的统计， Michael Intrator、Brian Venturo和Brannin McBee三人自2025年3月IPO以来持续大规模减持，仅2026年一年合计套现即达24亿美元。 与此同时，CoreWeave股价较5月峰值已累计下跌逾50%，创始人账面财富蒸发约150亿美元。 公司债务压力正加速显现。截至本周末，CoreWeave 2032年到期的9.625%无担保债券跌至面值约76美分，已触及市场通常定义的困境债务门槛；五年期信用违约互换利差升至创纪录的1117个基点，隐含五年内违约概率高达63%。 创始人减持规模：IPO后分批出货，累计套现超33亿 据彭博报道，三位创始人的减持贯穿上市后整个周期，", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792155534.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "上线了！2027见闻历超值预售99元，活动火热进行中！", "url": "https://wallstreetcn.com/articles/3782813", "date": "Fri, 16 Oct 2026 20:57:12 +0800", "desc": "本文来自华尔街见闻，欢迎下载APP查看更多", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792155432.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "Apple Says iPhone Duo Demand const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
