，记者前往该家长所指的小卖部走访并以家长身份与店主沟通，了解赊账规则。店主介绍，可以添加家长联系方式同步孩子消费情况，可先买后付，约定每日消费限额。按照店家的说法，低年级学生如果需要赊账，要提前征得家长同意。但店主坦言，面对高年级学生，店铺很难约束、管控他们的消费行为。 白云区均禾街的一名学", "date": "", "hot": 0, "tags": [], "topic_score": 0, "source": "热搜-知乎", "cat": "热点榜_发生了什么", "weight": 5, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 23}, {"title": "中国空间站将迎首位外籍航天员，巴基斯坦载荷专家参加神舟二十四号任务，具有哪些意义？", "url": "https://www.zhihu.com/question/2102344635867559303", "desc": "据中国载人航天工程办公室消息，神舟二十四号载人飞行任务将有 1 名巴基斯坦航天员以载荷专家身份参加，在完成短期在轨飞行后，随神舟二十三号载人飞船返回。这是中国载人航天工程历史上首次中外航天员联合飞行，中国空间站将迎来首位外籍航天员到访。 2025 年 2 月，中国和巴基斯坦在伊斯兰堡签署《关于选拔、训练巴基斯坦航天员并参与中国空间站飞行任务的合作协议》，正式启动巴基斯坦航天员选拔工作。经过初选、复选、定选三个阶段的严格筛选和评定，选拔出 2 名巴基斯坦预备航天员，在华完成各项训练并通过考核后，其中 1 人将执行载人飞行任务，1 人作为任务备份航天员。 「天宫」将迎首位外籍航天员 巴基斯坦载荷专", "date": "", "hot": 0, "tags": [], "topic_score": 0, "source": "热搜-知乎", "cat": "热点榜_发生了什么", "weight": 5, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 23}, {"title": "地月距离达到多大，月球可以变成太阳的一颗行星？", "url": "https://www.zhihu.com/question/978464108", "desc": "小行星带里有很多小型天体，质量远小于月球，但是他们绕着太阳转，为什么月球没有绕着太阳转呢？ 我知道肯定是因为离地球近的原因，但是月球距离地球多远以后，就会变成太阳的行星呢？", "date": "", "hot": 0, "tags": [], "topic_score": 0, "source": "热搜-知乎", "cat": "热点榜_发生了什么", "weight": 5, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 23}, {"title": "曝美光将暂停 45 亿美元内存厂扩产，为何后续会出现要么 AI 崩要么内存涨价的局面？", "url": "https://www.zhihu.com/question/2102194286016082260", "desc": "快科技 11 月 6 日消息，内存涨价持续一年了，明年会迎来一个关键点，三星、 SK 海力士及美光三巨头之前宣布过超大规模投资扩产，但美光出乎意料地率先暂停扩产。 日前有消息称美光将暂停针对中国台湾地区的 45 亿美元内存工厂的投资计划，引发全球关注，爆料这事的是彭博这样的大媒体，而美光公司的回应非常官方化，强调业务运营正常，完全回避了工厂是否停工的问题。 放在以前，这种严重影响股价的消息肯定要迅速辟谣，但美光此番态度也暗示了暂停扩产一事十有八九。 暂停的直接原因说是跟当地工厂罢工有关，但这显然是纸面上的，美光暂停内存扩产本质上还是近期 AI 产业链的调整导致的，尤其是美光大选之后 AI 数据", "date": "", "hot": 0, "tags": [], "topic_score": 0, "source": "热搜-知乎", "cat": "热点榜_发生了什么", "weight": 5, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 23}, 片板块领涨，但市场广度疲弱，多数个股仍收跌。 周五，纳斯达克100指数涨1.35%，芯片股指数大涨4.2%，科技大盘股的集中发力掩盖了市场内部的分化。标普500指数中超过56%的成分股当日下跌，市值加权表现跑赢等权重近80个基点。 与此同时，美国就业数据大幅强于预期，10月非农新增就业16.5万人，远超市场预估的7万人，失业率降至4.1%，进一步压实了美联储12月加息的预期，推动美元走强、美债收益率上行，对金价和比特币形成压制。12月加息概率回升至76%。 高盛股票交易部门指出，本周美股恐慌指标已飙升至极端水平，历史上这类读数往往预示着中期强劲反弹。但该团队同时提示： 这并非立即追入风险资产的理由。 芯片股从周四的暴跌中反弹，超跌板块领涨 周五费城半导体指数上涨约3%，纳斯达克100全天最终收涨1.35%，而标普500指数仅微涨0.3%，道琼斯工业平均指数", "tags": ["资本市场"], "topic_score": 9, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1794005103.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 22}, {"title": "8-K - Pono Capital Four, Inc. (0002108164) (Filer)", "url": "https://www.sec.gov/Archives/edgar/data/2108164/000149315226050548/0001493152-26-050548-index.htm", "date": "2026-11-06T17:30:10-05:00", "desc": "Filed: 2026-11-06 AccNo: 0001493152-26-050548 Size: 327 KB Item 1.01: Entry into a Material Definitive Agreement Item 9.01: Financial Statements and Exhibits", "tags": [], "topic_score": 0, "source": "SEC 最新 8-K 申报", "cat": "企业行为_美股披露", "weight": 6, "ts": 1794004210.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 22}, {"title": "8-K - TEN Holdings, Inc. (0002030954) (Filer)", "url": "https://www.sec.gov/Archives/edgar/data/2030954/000149315226050546/0001493152-26-050546-index.htm", "date": "2026-11-06T17:29:47-05:00", "desc": "Filed: 2026-11-06 AccNo: 0001493152-26-050546 Size: 262 KB Item 2.02: Results of Operations and Financial Condition Item 9.01: Financial Statements and Exhibits", "tags": [], "topic_score": 0, "source": "SEC 最新 8-K 申报", "cat": "企业行为_美股披露", "weight": 6, "ts": 1794004187.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 22}, {"title": "8-K - bioAffinity Technologies, Inc. (0001712762) (Filer)", "url": "https://www.sec.gov/Archives/edgar/data/1712762/000149315226050541/0001493152-26-050541-index.htm", "date": "2026-11-06T17:28:31-05:00", "desc": "Filed: 2026-11-06 AccNo: 0001493152-2 晚于 2027 年 12 月 31 日全面下线，超期未使用部分将自动退款。 扣子企业版下线公告", "date": "", "hot": 0, "tags": [], "topic_score": 0, "source": "热搜-知乎", "cat": "热点榜_发生了什么", "weight": 5, "ts": 0, "opinion": true, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 19}, {"title": "因拖欠工资起争执，男子被雇主扇 9 次耳光后急性脑梗死离世，雇主被判担责七成赔 84 万余元，法律上如何解读？", "url": "https://www.zhihu.com/question/2102507102237476054", "desc": "因拖欠工资和辞退问题起争执，59 岁男子马某被雇主秦某扇了九次耳光。当天傍晚，马某因急性脑梗死入院，昏迷 14 个月后去世。之后，家属起诉秦某索赔 136 万余元。 记者从中国裁判文书网获悉，近日，郑州市中级人民法院公布二审判决书，驳回秦某的上诉。此前一审法院判决：秦某对马某的损害后果承担 70% 的赔偿责任，赔偿其亲属各项损失共计 84 万余元。 判决书显示，马某此前在秦某处工作。2024 年 12 月 14 日下午，二人在郑州某小区单元门口，因拖欠工资及辞退事宜发生争执，马某儿媳田某在现场附近。田某报案称，物业的秦某「突然打我爸，拦也拦不住…打的头部脸部，打的很重，打完之后老人说渴、头晕…", "date": "", "hot": 0, "tags": [], "topic_score": 0, "source": "热搜-知乎", "cat": "热点榜_发生了什么", "weight": 5, "ts": 0, "opinion": true, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 19}, {"title": "《影之刃零》海外收入占到 55%，一款武侠游戏在欧美卖得比国内好，这事该怎么看？", "url": "https://www.zhihu.com/question/2101626484280631616", "desc": "市场分析机构估算，《影之刃零》在中国大陆、台湾和香港以外的 Steam 与 PlayStation 收入占比已经达到 55%，约 1.23 亿美元。这个数字意味着，它有一半以上的钱是从不看武侠、不熟悉这个 IP 的市场里挣来的。 对比发售前的结构会更清楚。Steam 在 8 月中旬开放预购时，中国市场约占收入的 70%；预售量早已超过 100 万份，大陆加台港合计占 62.5%。也就是说，起跑的时候它几乎是一部「国内游戏」。 截至 11 月 2 日，中国市场的累计收入占比从约 68% 降到 45%，美国从 10% 升到 18%，其他地区从 25% 升到 38%。这条曲线的拐点，和评测解禁、海外", "date": "", "hot": 0, "tags": [], "topic_score": 0, "source": "热搜-知乎", "cat": "热点榜_发生了什么", "weight": 5, "ts": 0, "opinion": true, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 19}, {"title": "US believes Nvidia’s Huang had romantic relationship with alleged Chinese spy", "url": "https://www.ft.com/content/a55a2a22-4479-4f93-a445-6147a5c6d790?syn-25a6b1a6=1", "date": "Sat, 07 Nov 2026 21:41:05 GMT", "desc": "American intelligence warned the tech boss was involved with executive recruited by China to gather information on US group", "tags": ["AI"], "topic_score": 2, "source": "Financial Times", "cat": "金融媒体_英文", "weight": 2, "ts": 1794087665.0, "opinion nk": 18}, {"title": "AI资本开支“见顶”，美国经济也随之“见顶”？", "url": "https://wallstreetcn.com/articles/3785430", "date": "Sat, 07 Nov 2026 11:04:11 +0800", "desc": "AI资本支出正逼近历史拐点，而美国经济增长的命运或与之深度绑定。 据追风交易台，杰富瑞策略师Christopher Wood在最新报告中警告，金融市场已通过信用利差扩大和半导体股票持续下跌，发出AI资本开支周期可能触顶的明确信号——这一判断的宏观含义远不止于科技板块本身。 据杰富瑞报告，在截至2026年三季度的四个季度里， 美国AI相关实际资本支出对实际GDP同比增长的贡献高达1.39个百分点，占整体2.1%增速的67%。与此同时，信息处理设备与软件投资占名义GDP的比例已升至5.35%，超越2000年互联网泡沫顶峰时期的4.46%，创下历史新高。 这意味着，一旦AI资本开支出现实质性收缩，美国经济增长将面临直接且显著的下行冲击。 市场已率先作出反应。半导体股票持续承压，信用市场出现明显裂缝：Amazon、Alphabet和Meta的10年期企业债利差较近期低点分别扩大16个、16个和35", "tags": ["企业落地"], "topic_score": 3, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1794020651.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 18}, {"title": "@tanveer_wadud: g o o d m o r n i n g ❤️", "url": "https://www.threads.com/t/DfbHKMdiTNf", "date": "Sat, 07 Nov 2026 02:29:58 GMT", "desc": "@tanveer_wadud : g o o d m o r n i n g ❤️", "tags": [], "topic_score": 0, "source": "Threads-AI讨论", "cat": "AI实战_创作者", "weight": 4, "ts": 1794018598.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 18}, {"title": "Crusoe sells troubled Wyoming data center project to Google", "url": "https://techcrunch.com/2026/11/06/crusoe-sells-troubled-wyoming-data-center-project-to-google/", "date": "Sat, 07 Nov 2026 01:40:28 +0000", "desc": "The deal highlights the challenges of developing massive AI data centers.", "tags": [], "topic_score": 0, "source": "TechCrunch", "cat": "科技新闻", "weight": 4, "ts": 1794015628.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 18}, {"title": "大金主踩刹车？OpenAI新融资被曝遇冷、软银大幅缩减投入，CFO称中选后数据中心投资不变", "url": "https://wallstreetcn.com/articles/3785402", "date": "Sat, 07 Nov 2026 03:40:20 +0800", "desc": "OpenAI正面临新一轮融资的重大挑战。在10月末传出OpenAI将 融资目标调低100亿美元 的消息后，本周五又有《纽约时报》的报道称，多位主要投资方在本轮融资中大幅削减出资规模，软银等此前最积极的支持者此次仅计划投入数亿美元，与过往数百亿美元的投入相比不可同日而语。 据今年10月末的《金融时报》报道，OpenAI将本轮融资目标从最初的300亿美元削减至少三分之一，目前寻求融资规模 "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1794039754.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "AI泡沫破裂了吗？高盛：当下更像1998年，而非2000年", "url": "https://wallstreetcn.com/articles/3785440", "date": "Sat, 07 Nov 2026 16:15:40 +0800", "desc": "科技股遭遇剧烈抛售，但究竟是杠杆出清还是商业模式被证伪，这决定了截然相反的操作方向。 据追风交易台，高盛FICC与股票交易台在11月6日报告中表示，纳斯达克指数单日下跌5.5%，费城半导体指数重挫12%，标普500指数下跌4.4%。高盛现金股票业务数据显示，当日美国现金股票业务净卖出30亿美元，其中信息技术与通信服务板块占22亿美元， 科技板块累计净卖出规模已扩大至270亿美元，超过7月那轮210亿美元的技术性抛售。 与此同时，VVIX单日变动幅度为2018年2月5日\"波动率末日\"以来最大。 高盛FICC与股票业务负责人Rich Privorotsky在上述日更中明确表态，倾向于将本轮下跌定性为类似1998年的流动性危机，而非2000年科技泡沫破裂的前兆。他的核心判断是： AI增长引擎本身可能依然完好，市场剧烈重定价的是建设融资与时间节奏，而非底层需求。 这一判断对投资者的操作含义至关重要", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1794039340.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "卡塔尔称美伊谈判取得重大进展！万斯深度介入，斡旋升至美国政府最高层级", "url": "https://wallstreetcn.com/articles/3785439", "date": "Sat, 07 Nov 2026 15:59:00 +0800", "desc": "美伊间接谈判出现迄今最明确的积极信号。卡塔尔首相公开表态谈判已取得\"重大成果\"，美国媒体同步披露副总统万斯已亲自深度介入谈判进程，标志着这一轮美伊间接斡旋升至美国政府最高决策层级。 据中国国际电视台欧洲分台最新报道， 卡塔尔首相表示：\"我们已经取得了很大成果，我相信我们能够达成解决方案。\"他同时强调\"我们无法等待一个完美的协议，我们希望达成一个好的协议\"。这 是调停方迄今最为正面和明确的公开表态。 据环球网援引美国Axios新闻网报道，两名知情人士披露，万斯本人在过去两周参与了与伊朗的间接谈判，旨在促成新的停火协议并重启核谈判。分析人士认为，万斯的介入为谈判走向注入了新的不确定性，也赋予了此轮外交努力更高的政治权重，对市场对地区局势风险的定价具有直接影响。 万斯亲自斡旋，几乎每日与调停方沟通 据知情人士透露，万斯几乎每天都在与卡塔尔首相兼外交大臣Sheikh Mohammed、巴基斯坦陆军", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1794038340.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "中选只不过是最后一根稻草？市场终于正视AI“循环融资”的雷", "url": "https://wallstreetcn.com/articles/3785435", "date": "Sat, 07 Nov 2026 14:05:05 +0800", "desc": "AI繁荣叙事的裂缝正在扩大。中选次日，纳斯达克遭遇新冠疫情以来最大单日跌幅，科技基金年内涨幅悉数抹去，而这场震荡此前长期被市场刻意忽视的一个结构性隐患浮出水面——AI循环融资。 摩根大通现金交易全球联席主管Ron Adler在最新市场反思中直言，AI始终是当前市场的核心支点，而随着超大规模云计算企业（hyperscaler）开始转向资本市场为自身野心融资，交易员们顺势沿风险曲线走得更远，大举买入上 const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
