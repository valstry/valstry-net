, "weight": 5, "ts": 0, "opinion": false, "is_hot": true, "is_vendor": false, "always_fresh": true, "rank": 23}, {"title": "OpenAI指控前员工携逾百份硬件机密返苹果，反击苹果7月发起的诉讼", "url": "https://wallstreetcn.com/articles/3783655", "date": "Thu, 15 Oct 2026 07:20:42 +0800", "desc": "OpenAI与苹果原定于周三就商业秘密诉讼案对簿公堂，但新的指控导致庭审推迟。OpenAI表示，可能会基于这项新指控提起反诉。 周三，OpenAI抛出一份新的法庭文件，指控一名前员工在离职前窃取逾百份涉及未发布设备的高度机密文件，转投苹果后更向苹果高管进行了相关产品计划的演示。 OpenAI表示，涉事员工此前曾供职苹果，后加入OpenAI仅约六个月，随即重返苹果。 该员工将文件发送至个人账户的时间恰在其离职当日，所窃文件包含未发布设备的详细图像及高度机密的工程与制造数据。 OpenAI警告，其商业机密或已在苹果内部流通，\"苹果工程师或将据此影响苹果即将推出的产品\"。 对此，苹果否认相关指控，称公司已建立严格政策以防止新员工滥用前雇主的保密信息，目前未发现任何支持OpenAI指控的证据，并批评OpenAI此举意在转移诉讼焦点。 新指控推迟庭审，OpenAI称或提出反诉 OpenAI在文件中表", "tags": ["AI"], "topic_score": 4, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792020042.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 22}, {"title": "美CPI全面升温响“通胀螺旋”警报，10月加息概率一度五成，“新美联储通讯社”：盯紧沃什本周讲话", "url": "https://wallstreetcn.com/articles/3783651", "date": "Thu, 15 Oct 2026 06:52:39 +0800", "desc": "美国9月CPI全面超预期，涨价压力从能源向核心商品和服务扩散，令市场短线加码押注美联储10月加息。通胀能否持续降温、是否需要更快收紧货币政策，成为投资者接下来关注的焦点。 美东时间14日周三公布的数据显示，美国9月CPI环比上涨0.6%，同比涨3.7%，均高于经济学家预期；剔除食品和能源的核心CPI环比涨0.3%，同比涨2.6%、也超出预期。报告公布后，市场对美联储10月加息的押注一度升至约50%，美债收益率上行，美股承压。随着交易时段推进，加息概率随后回落至约40%，显示投资者仍在权衡通胀风险与美联储是否会对单月数据作出反应。 CPI后，市场预计10月加息概率曾升至50%、12月加息概率一度超过95%，后均有所回落 被称为“新美联储通讯社”的记者Nick Timiraos指出，与8月通胀数据中部分涨价具有较强的个别因素不同，9月核心CPI的超预期表现更加广泛：核心商品价格环比涨约0.25", "tags": ["资本市场"], "topic_score": 4, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1792018359.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 22}, {"title": "Stocks Slide as Hot Inflation & AI Credit Fears Hit Markets", "url": "https://www.bloomberg.com/news/videos/2026-10-14/the-close-10-14-2026-video", "date": "Wed, 14 Oct 2026 22:04:00 GMT", "desc": "The Close brings you the latest news and analysis leading up to the final minutes and seconds before and after the closing bell on Wall Street. Today's guests are  20}, {"title": "五个月来最大涨幅！美国9月CPI同比3.7%，核心CPI同比2.6%超预期，10月加息预期飙升", "url": "https://wallstreetcn.com/articles/3783634", "date": "Wed, 14 Oct 2026 20:30:26 +0800", "desc": "美国通胀数据全面走热，加息预期骤然升温，金融市场承压。 美国劳工统计局周三公布数据显示，9月消费者价格指数（CPI）同比上涨3.7%，为五个月来最大涨幅，高于市场预期的3.6%，较前值3.4%进一步扩大。 核心CPI同比上涨2.6%，同样超出预期的2.5%， 创五个月来最快涨幅，通胀压力的持续性超出市场此前预判。 环比方面，美国9月CPI环比上涨0.6%，与预期持平，前值为0.4%。核心CPI环比上涨0.3%，高于预期的0.2%，与前值持平。 数据公布后，金融市场迅速作出反应。美元指数短线拉升约30点，美国10年期国债收益率同步走高，美股三大股指期货均转跌，现货黄金短线下挫约30美元。 交易员大幅上调对美联储10月加息的押注，10月加息概率飙升至50%，同时预计到2027年底美联储还将累计再加息三次。 此次数据是美联储10月27日至28日利率决议前最后一份CPI报告，其结果将直接影响决策层", "tags": ["资本市场"], "topic_score": 4, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791981026.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "英伟达开放Vera Rubin机架设计，AI数据中心标准之争提前打响", "url": "https://wallstreetcn.com/articles/3783629", "date": "Wed, 14 Oct 2026 20:08:05 +0800", "desc": "英伟达向外部厂商开放其下一代AI平台Vera Rubin的服务器设计规范，并发布专为AI智能体打造的CPU机架系统，意在将自身技术标准植入整个AI数据中心生态，进一步巩固其在GPU市场之外的行业影响力。 此次披露发生于13日在加利福尼亚州圣何塞举行的开放计算项目（OCP）全球峰会。 英伟达副总裁Ian Buck在演讲中宣布，公司将向外部合作方开放Vera Rubin平台的服务器机架及计算托盘设计蓝图，涵盖供电、液冷和网络连接的通用规范。 英伟达表示，此举将降低服务器制造商的研发门槛，并缩短数据中心的建设周期与成本。 行业分析人士认为，此举背后存在明确的战略意图——随着AI智能体时代到来，基础设施需求正从GPU向CPU和网络设备延伸，英伟达正借助设计规范的开放，抢先构建以自身为核心的AI基础设施生态。 800伏直流方案应对机架功耗瓶颈 在供电架构上，英伟达在新设计方案中提出将机架直流电压提升", "tags": ["AI"], "topic_score": 4, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791979685.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "OpenAI Vows Not to Use Trade Secrets Allegedly Taken From Apple", "url": "https://www.bloomberg.com/news/articles/2026-10-14/apple-openai-head-to-court-in-high-stakes-ai-trade-secret-fight", "date": "Wed, 14 Oct 2026 10:30:00 GMT", "desc": "OpenAI agreed not to use trade secrets that Apple Inc. claims were stolen by employees who defected from the iPhone maker to the artificial intelligence startup while a legal fight between the companies plays out.", "tags": ["AI" "weight": 3, "ts": 1792023480.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "电动两轮车前三季度内销下滑近5% 行业能否重回增长？", "url": "https://www.caixin.com/2026-10-14/102493458.html", "date": "Thu, 15 Oct 2026 00:18:00 GMT", "desc": "10月初，国内大量电动自行车产品的3C证书被暂停，车型无法正常销售和上牌，市场销售陷入停滞 2026年6月17日，重庆，电动两轮车生产线。图：何蓬磊/中新社/视觉中国 【财新网】 2026年前三季度，中国电动两轮车内销4837.8万辆，同比下降4.8%。市场机构 奥维云网 于10月14日发布上述数据。第三季度，国内销量虽明显回升，但年内累计下滑的局面尚未扭转。 据奥维云网统计，第三季度电动两轮车内销量突破2000万辆，同比增长9.0%，实现年内首次单季度同比增长。而此前两个季度，行业销量连续同比下降，上半年内销量同比下滑12.6%，降至2825.2万辆。 2025年，电动自行车“以旧换新”政策在一定程度上提前释放了部分存量换购需求，对后续市场形成透支效应。据商务部统计，2025年国内电动自行车以旧换新超过1250万辆，老旧车辆淘汰更新量超过2024年的9倍。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1792023480.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "[分享创造] 做了一个图片擦除物体和去背景的免费在线工具和 API", "url": "https://www.v2ex.com/t/1248875#reply3", "date": "2026-10-15T00:17:10Z", "desc": "", "tags": [], "topic_score": 0, "source": "V2EX 最新", "cat": "AI实战_创作者", "weight": 3, "ts": 1792023430.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "从钱凯港争议看中企在海外法治中守住投资边界", "url": "https://opinion.caixin.com/2026-10-15/102493544.html", "date": "Thu, 15 Oct 2026 00:15:06 GMT", "desc": "当法律理解和市场竞争认定在投资项目落地后发生分歧，企业面对的便不再只是商业风险，而是制度预期本身的波动 2026年2月23日，秘鲁钱凯市，钱凯港起重机作业画面。图：IC photo 秘鲁钱凯港最近卷入监管权争议，引起了不少关注。围绕秘鲁基础设施投资监管机构OSITRAN是否有权对这一由私人投资、私人所有并承担公共服务功能的港口实施全面监管，钱凯公司已先后启动多轮司法程序。表面看，这是一宗港口监管权限之争。再往深处看，它提醒中国企业一个很实际的问题：项目落地以后，麻烦未必只来自合同或许可本身。东道国法律怎么解释，监管机构怎么理解自己的权力，市场竞争条件会不会被重新认定，都会影响项目能否稳定运行。 一、钱凯港争议，表面争监管，实则争边界 东道国对重要港口实施监管，并不令人意外。任何承担公共服务功能的基础设施项目，都不可能完全游离于本地法律和行政体系之外。 .lanmu_textend{ pad", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1792023306.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "[推广] AI 订阅站 HuiAI，方便不想折腾海外卡的人开 ChatGPT/Claude/Gemini,可开票", "url": "http nk": 17}, {"title": "香港周生生门店发生劫案 男子扮顾客抢走8万港元金项链", "url": "https://companies.caixin.com/2026-10-14/102493452.html", "date": "Wed, 14 Oct 2026 23:53:39 GMT", "desc": "类似的盗窃手法一日前刚在香港上水的一家金店上演，劫匪逃跑时跌倒被当场制服 10月14日下午3时许，香港大埔广福道的一间周生生珠宝店遭劫，一名男子抢走一条金链后逃走，警方正追捕劫匪。图：视觉中国 【财新网】 香港连续两日发生黄金劫案，劫匪均扮成顾客，以挑选项链为名抢走金饰。10月14日下午3时许，香港大埔广福道的一间周生生珠宝店遭劫，一名男子抢走一条金链后逃走，警方正追捕劫匪。 据香港有线新闻报道，案发时，一名身穿深色衣服、白色运动鞋的男子进入周生生珠宝店，声称选购金饰。店员取出一条重约一两多、价值约8万港元的金项链供其查看或试戴，男子突然抢走金项链，向店外逃去。在香港，黄金买卖通常采用金衡两，1两约等于37.43克。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1792022019.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "解药｜“K药”陷入专利战：新剂型遭欧洲多国禁售", "url": "https://www.caixin.com/2026-10-15/102493484.html", "date": "Wed, 14 Oct 2026 23:53:39 GMT", "desc": "默沙东旗下核心产品“K药”帕博利珠单抗的皮下注射剂型，因“专利侵权”被欧洲多国禁售，但原始静脉滴注剂型不受影响 Keytruda是全球首个不限癌种的PD-1免疫检查点抑制剂，2014年首次在美国获批，2018年中国亦批准上市。 【财新网】 默沙东（NYSE:MRK）的PD-1抑制剂帕博利珠单抗（商品名：Keytruda、可瑞达），国内多称为“K药”，两年前已登顶全球“药王”宝座。（参见财新网《 解药｜K药登顶全球处方药榜首 “减肥神药”紧追 》）该药专利到期日近，其在多国获批上市的新剂型，日前因“专利侵权”在欧洲陷入禁售风波。 10月7日，美国生物公司Halozyme（NASDAQ:HALO）公布了一则诉讼的判决结果：荷兰海牙地区法院专利法庭认定帕博利珠单抗皮下注射剂（Keytruda SC）侵犯了Halozyme所持有的一项编号为EP2797622的专利MDASE（Modified Hy", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1792022019.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "【我闻】20年创业何以至此 宜信唐宁其人", "url": "https://wenews.caixin.com/2026-10-14/102493298.html", "date": "Wed, 14 Oct 2026 23:53:39 GMT", "desc": "北大毕业、美国留学的唐宁，创业20年，从小额信贷到第三方财富，几度转型，还是走到今天的境地 图：视觉中国 【金融我闻/刘冉】 2026年10月12日中午，北京市公安局朝阳分局公众号发布一则警情通报：近期，该局依法对宜信相关公司涉嫌违法犯罪立案侦查，目前，实际控制人唐某（男，53岁）、赵某（女，51岁）等多名犯罪嫌疑人已被依法采取刑事强制措施。通报同时给出网上报案、邮寄报案、实地报案三条渠道，并提醒投资人不要相信“提前兑付”名义的诈骗。 对照公开信息，通报中被称“唐某”的，指向了 宜信集团 创始人兼CEO 唐宁 。就在通报发布的前一晚，10月11日傍晚，宜信集团在旗下 瑞承 、 宜人优选 两个App上，向类固收产品投资者定向推送了一封《关于向类固收产品客户的致歉信》。信中首次承认“实质违约”，集团“可能资不抵债，偿债缺口较大”，“未兑付类固收产品对应的底层资产质量差，积极寻求市场化整体处置无", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1792022019.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "[macOS] 写了一个 macOS 原生的 Conky", "url": "https://www.v2ex.com/t/1248874#reply0", "date": "2026-10-14T23:25:58Z", "desc": "", "tags": [], "topic_score": 0, "source": "V2EX 最新", "cat": "AI实战_创作者", "weight": 3, "ts": 1792020358.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "育儿思絮之九：起早贪黑上学，学会生活了吗？｜亲子", "url": "https://mini.caixin.com/2026-10-14/102493199.html", "date": "Wed, 14 Oct 2026 23:15:36 GMT", "desc": "我们持续十数年甚至将近二十年早晨没觉睡、起早落黑上下学的生活，到底让我们学到了哪些有用的生活技能，从而支撑起我们剩下的余生？ 绘图：赵凌筠 AI辅助生成 节假日和周六日之外，每天早晨，我都会在6:40——冬天这会儿天还没亮——叫醒女儿，让她醒五分钟起床。通常她会睡回去，6:45让她起床的时候，她依然很困很难受。没办法，我们就活在这台早起的机器里。 我猜想，这百年来每一代上过学的人，孩提时候可能都没睡够，我们打着呵欠进校，眯着睡眼上课，虽然未必耷拉着脑袋离校。 人对不很严重且日复一日的受虐这种事，似乎有极大的适应力和复原力，小时候那种没睡够的难受劲儿，成年后回想起来大都模糊了——因为长大了之后似乎还是睡不够——乐观地想，至少比睡不着的人幸福。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1792019736.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "McKinsey is making job applicants spar with a fake AI client", "url": "https://www.theverge.com/news/1011654/mckinsey-ai-client-interview", "date": "2026-10-14T18:53:31-04:00", "desc": "Consulting firm McKinsey & Company is going to ask some entry-level candidates to have a 10-minute conversation with an AI simulation of a client as part of the interview process, according to The Wall Street Journal. The AI simulation \"aims to reflect 80% of the scenarios McKinsey consultants might encounter in their day-to-day work,\" the […]", "tags": [], "topic_score": 0, "source": "The Verge", "cat": "科技新闻", "weight": 3, "ts": 1792018411.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "As a TV enthusiast, I was hoping for more from the Apple TV 4K", "url": "https://www.theverge.com/tech/1011324/apple-tv-4 const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
