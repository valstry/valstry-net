比也有所回暖。”深圳链家东方颐园店商圈经理熊小飞对证券时报记者表示，“最直观的变化是，购房者的决策链条明显缩短，楼市新政提振了购房者的信心，也扫除了市场长期存在的不确定性，购房决策更为果断。” 记者在采访时发现，深圳不同区域的二手房价走势虽有分化，但市场信心已有所修复，业主与购房者的议价空间持续收窄。与此同时，申请30年以上长期个人住房贷款的购房者占比正快速提升。另据深圳贝壳研究院监测，今年国庆假期前五天，贝壳深圳合作门店二手房签约量同比增长23%。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1791416453.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "Robot data startup Mecka AI nabs $60M from Sequoia", "url": "https://techcrunch.com/2026/10/07/robot-data-startup-mecka-ai-nabs-60m-from-sequoia/", "date": "Wed, 07 Oct 2026 23:36:57 +0000", "desc": "Mecka AI collects and analyzes human motion data to train humanoid robots and other kinds of robots. The startup pays people to record everyday tasks.", "tags": [], "topic_score": 0, "source": "TechCrunch", "cat": "科技新闻", "weight": 4, "ts": 1791416217.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "备战四季度权益市场，公募以均衡配置抵御波动。三季度以来，A股市场经历了一轮显著的结构再平衡行情。展望四季度，市场投资主线正成为各方关注焦点。近日，万家...", "url": "https://www.huxiu.com/moment/1286353.html", "date": "Wed, 07 Oct 2026 23:33:55 GMT", "desc": "备战四季度权益市场，公募以均衡配置抵御波动。 三季度以来，A股市场经历了一轮显著的结构再平衡行情。展望四季度，市场投资主线正成为各方关注焦点。近日，万家基金、摩根资产管理、汇丰晋信基金、博时基金、国联安基金等多家基金公司发布最新的四季度投资策略。公募机构普遍认为，三季度的市场调整主要缘于交易拥挤度的消化与资金再平衡，并非核心产业逻辑的反转。 面对已经到来的四季度，市场有望在估值修复与行情扩散中震荡上行。在配置思路上，基金公司普遍主张在坚守AI（人工智能）等硬科技产业趋势的同时，采取更加均衡的配置策略。证券时报记者梳理发现，出海制造、战略资源品以及具备修复空间的低估值传统板块，成为各大公募机构重点看好的方向。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1791416035.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "美拟就国际学生留美工作征收高额费用，称推出该措施是为了打击“签证欺诈和滥用问题”。据新华社：美国国土安全部7日公布一项拟议规则，将就国际学生借助“选择...", "url": "https://www.huxiu.com/moment/1286352.html", "date": "Wed, 07 Oct 2026 23:32:47 GMT", "desc": "美拟就国际学生留美工作征收高额费用，称推出该措施是为了打击“签证欺诈和滥用问题”。 据新华社：美国国土安全部7日公布一项拟议规则，将就国际学生借助“选择性实习训练”项目在美国工作征收高额费用。这是美政府收紧留学生相关政策的最新举动。根据这项规则，学校为每名学生首次申请“选择性实习训练”项目时需支付7万美元，申请延期还需再支付3万美元。该项目允许持学生签证的国际学生从事与所学专业直接相关的工作，是国际学生转入工作签证的重要过渡渠道。 美国国土安全部称，推出这项措施是为了打击“签证欺诈和滥用问题”，“选择性实习训练”项目不应该成为进入美国劳动力市场的后门。 美国国际教育工作者协会发表声明表示，将国际学生拒之门外将会“损害美国的创新、经济增长、劳动力发展以及全球领导地位”。 美国国土安全部计划征求公众意见后敲定最终规则。美媒认为，这一收费措施或将面临法律挑战。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1791415967.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "源于资本补充和稳健发展需求，年内险企密集增资。近一个月，多家保险公司接连推出增资举措，引发市场关注。国庆长假前夕，根据公告，国宝人寿总股份将由19.8亿股...", "url": "https://www.huxiu.com/moment/1286351.html", "date": "Wed, 07 Oct 2026 23:30:26 GMT", "desc": "源于资本补充和稳健发展需求，年内险企密集增资。 近一个月，多家保险公司接连推出增资举措，引发市场关注。国庆长假前夕，根据公告，国宝人寿总股份将由19.8亿股增至45.21亿股，增加注册资本约25.41亿元；招商局仁和人寿拟增发股份约18.57亿股，募集资金约26.56亿元。证券时报记者梳理中国保险行业协会网站信息发现，9月以来，披露增资方案的保险公司已有5家，年初至今宣布增资的保险公司则多达13家。保险公司纷纷增资，主要源于资本补充和稳健发展需求。多家保险公司披露的信息显示，募集资金将用于补充资本，提升偿付能力充足率，增强抗风险能力，以支持公司业务持续稳健发展。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1791415826.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "外资机构关注中国资产，全球多头基金调升中国股票配置。国庆长假期间，外围市场并不平静。10年期美债收益率一度升破5.352%，创24年新高。在高利率的阴云之下，外...", "url": "https://www.huxiu.com/moment/1286350.html", "date": "Wed, 07 Oct 2026 23:28:49 GMT", "desc": "外资机构关注中国资产，全球多头基金调升中国股票配置。 国庆长假期间，外围市场并不平静。10年期美债收益率一度升破5.352%，创24年新高。在高利率的阴云之下，外资对中国资产的关注不降反升。美银最新报告显示，全球主动型多头基金对中国股票的配置已从“低配”升至“基准中性”，结束了长达四年的低配状态。富达国际、威灵顿投资管理等全球资管巨头也相继发声，在复杂的宏观中积极寻觅中国“新一代赢家”。", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1791415729.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "@trinhhh706: Mình ra Huế chơi ai đón mình đi chơi cùng với mình koo😜😜", "url": "https://www.threads.com/t/DeNihdPkmEg", "date": "Wed, 07 Oct 2026 23:28:19 GMT", "desc": "@trinhhh706 : Mình ra Huế chơi ai đón mình đi chơi cùng với mình koo😜😜", "tags": [], "topic_score": 0, "source": "Threads-AI讨论", "cat" push into smart home devices will include a doorbell, thermostat and other accessories developed through an unusual partnership with LG Electronics. The products will be part of an ecosystem that works with Apple's new smart home hub, according to sources. Bloomberg's consumer tech editor Mark Gurman joins Ed Ludlow with the details on \"Bloomberg Tech.\" (Source: Bloomberg)", "tags": [], "topic_score": 0, "source": "Bloomberg Technology", "cat": "金融媒体_英文", "weight": 2, "ts": 1791395738.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "伊朗高官放话\"永不放弃\"铀浓缩权利、美伊\"没有谈判\"，即将封锁霍尔木兹“非法航道”", "url": "https://wallstreetcn.com/articles/3783124", "date": "Thu, 08 Oct 2026 01:19:14 +0800", "desc": "布伦特原油突破每桶102美元，美伊核谈判前景再度蒙上阴影。 一名伊朗高级官员周三向路透社表示， 伊朗\"永远不会放弃\"铀浓缩权利，目前与美国之间\"没有任何谈判\"在进行。 该官员同时指出，美国就伊朗核计划提出的方案与伊朗诉求\"相悖\"。消息公布后，布伦特原油价格迅速升破每桶102美元。 同日，据央视新闻，伊朗伊斯兰革命卫队司令顾问纳格迪表示， 霍尔木兹海峡已经关闭，伊朗将很快封锁该海峡的“非法航道”，这种情况将持续到伊朗的合法诉求得到满足为止。 另据央视报道，当地时间7日， 伊朗总统佩泽希齐扬与俄罗斯总统普京举行电话会谈，双方强调应继续加强两国的双边战略合作。 普京表示，俄罗斯支持一些国家为缓和地区紧张局势所做出的外交努力，并强调俄罗斯也随时准备为此发挥作用和提供协助。 核谈判立场强硬，伊朗划定\"红线\" 据路透社报道，伊朗高级官员明确表示，美国承认伊朗铀浓缩权利是德黑兰的\"红线\"，伊朗\"永远不会", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791393554.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "美国消费者一年期通胀预期升至3.9%，创三年多新高，劳动力市场信心改善", "url": "https://wallstreetcn.com/articles/3783123", "date": "Wed, 07 Oct 2026 23:42:21 +0800", "desc": "根据纽约联储周三公布的一项调查，美国消费者对短期通胀的预期在上月明显升温；对劳动力市场的看法有所改善，包括认为自己失业的概率下降，以及主动辞职的可能性上升。 纽约联储每月发布的《消费者预期调查》显示， 消费者对未来一年通胀率的中值预期从8月的3.6%升至9月的3.9%，创2023年5月以来最高水平； 对未来三年的通胀预期中值从8月的3.2%小幅升至3.3%，而未来五年的通胀预期中值维持在3%不变。 未来一年，消费者预计汽油价格上涨4.8%；食品价格上涨5.5%；医疗费用上涨9.2%；大学教育费用上涨7.5%；租金上涨6.8%。 这项数据发布之际，距离11月中期选举已不到一个月。纽约联储的最新调查进一步显示，美国消费者对经济的悲观情绪仍然持续，尽管美国经济仍在扩张。近几周公布的其他数据显示，9月消费者信心降至四个月低点，失业率小幅上升，但仍处于历史低位附近。 美联储官员9月将基准利率上调25", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791387741.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "2026年诺贝尔化学奖揭晓：两位科学家破解生命手性之谜，成果深刻影响制药产业", "url": "https://wallstreetcn.com/articles/3783117", "date": "Wed, 07 Oct 2026 19:11:30 +0800", "desc": "法国化学家Henri B. Kagan与日本化学家Kenso Soai因在不对称有机合成中发现非线性效应与自催化现象，共同摘得2026年诺贝尔化学奖。 他们的研究解答了困扰化学界逾百年的核心谜题：生命为何只选择分子的一种镜像。 瑞典皇家科学院表示， 两位得主的发现使化学家得以驱动反应朝单一手性方向进行，打破了此前实验室中始终生成等量镜像分子的僵局。 诺贝尔化学委员会主席Heiner Linke评价称，两人\"提供了一个逾百年化学谜题的解答，他们所发展的化学反应令人叹为观止\"。两人将平分1200万瑞典克朗奖金。 这一荣誉在制药、香料及农用化学品行业具有直接现实意义。凡涉及生产与生命体相互作用物质的企业，均有赖于两位得主所建立的理论框架——Kagan发现的非线性效应已成为优化不对称合成、提升对映体纯度的核心工具，而Soai构建的自催化反应体系则首次在人工化学中实现了从非手性到同手性的完整转化。 ", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791371490.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "暂不救市，欧央行：解决财政困境非我职责，法国需自救", "url": "https://wallstreetcn.com/articles/3783114", "date": "Wed, 07 Oct 2026 19:01:32 +0800", "desc": "法国债市的压力正在从财政失衡，演变为一场央行、政府与总统候选人同时卷入的政治博弈。 10月7日，据彭博报道，欧洲央行管委会成员、法兰西银行行长Emmanuel Moulin明确表示，法国债市形势“严峻而复杂”，但尚未满足欧央行介入条件。 “欧央行不是为了处理各国的财政问题而存在的”，法国必须通过预算和财政调整自行解决问题。 法国国债近期遭遇抛售，10年期国债与德国国债利差一度扩大至约160个基点，创2011—2012年欧债危机以来新高。尽管随着部分投资者入场，该利差周二回落至约127个基点，但市场对法国财政可持续性的担忧并未消退。而总统大选临近，又让市场开始提前定价下一届政府的财政路线。 极右翼候选人勒庞主张大幅削减支出、压低赤字，同时希望欧央行帮助缓解融资压力；极左翼候选人让-吕克·梅朗雄则提出冻结或注销部分法国国债。 两套路线方向迥异，却共同指向法国当前的债务与财政约束，也意味着大选结", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1791370892.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "为何美债收益率、纳指同步新高？广发刘晨明：产业周期大幅降速才是科技股牛熊“分水岭”", "url": "https://wallstreetcn.com/articles/3783119", "date": "Wed, 07 Oct 2026 18:59:46 +0800", "desc": "国庆假期期间，美债收益率与纳斯达克指数同步创出新高：10年期美债收益率升至5.3%以上，创2002年以来新高，英伟达、台积电等科技龙头股价也持续走强。利率上行通常意味着估值承压，但这一轮科技行情却呈现出明显的“利率脱敏”，背后的关键在于产业周期仍处于高景气阶段。 广发证券刘晨明团队报告指出， 当前全球半导体周期大概率仍处于“加速上行”或“高速震荡”阶段，而不是即将进入大幅降速期。对于科技股而言，利率变化更多影响短期估值，真正决定中期行情方向的仍是产业景气度。 历史数据也印证了这一点。过去三十余年，道琼斯工 const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
