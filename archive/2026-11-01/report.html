, "ts": 1792339200.0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 28}, {"title": "最新封面报道之二｜最赚钱“AI实验室”IPO揭幕", "url": "https://weekly.caixin.com/2026-10-31/102499335.html", "date": "Sun, 01 Nov 2026 00:05:48 GMT", "desc": "诞生五年，仅三年多有业绩收入，Anthropic以近2万亿美元估值挺进公开市场——AI时代的新神话 2026年9月23日，美国纽约，联合国安理会召开人工智能相关会议，Anthropic首席执行官达里奥·阿莫代伊（Dario Amodei）发言。图：Sarah Yenesel/IC photo 相关阅读： 封面报道｜重估科技股 文｜财新周刊 杜知航 “公司的Claude team plan（团队版订阅方案）欠费了，大家都不会干活了。”美国时间10月26日早上，一家美国公司的程序员给财新分享了一张员工向财务部门催付款的截图，催促给美国人工智能（AI）大模型公司Anthropic旗下的大模型Claude续费充值。 几乎同一时间，Anthropic向美国证券交易委员会（SEC）正式递交招股书的重磅消息像风一样传遍市场，似乎给近月来在AI泡沫争议、数据中心投建焦虑情绪压制下跌跌不休的科技股市场注入一", "tags": ["AI", "商业认知"], "topic_score": 5, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1793491548.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27}, {"title": "SpeakON Agent", "url": "https://www.producthunt.com/products/speakon", "date": "2026-10-31T16:38:02-07:00", "desc": "", "tags": ["AI"], "topic_score": 2, "source": "Product Hunt", "cat": "AI实战_创作者", "weight": 5, "ts": 1793489882.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27, "title_zh": "SpeakON Agent"}, {"title": "OpenAI Lowers Fundraising Target–After Decreasing Possible Valuation", "url": "https://www.theinformation.com/briefings/openai-lowers-fundraising-target-after-decreasing-possible-valuation", "date": "2026-10-31T23:14:12Z", "desc": "", "tags": ["AI", "资本市场"], "topic_score": 5, "source": "The Information", "cat": "金融媒体_英文", "weight": 3, "ts": 1793488452.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27, "title_zh": "OpenAI 在降低潜在估值后下调融资目标"}, {"title": "Show HN: Keybind-find – search the focused window's shortcuts by pressing keys", "url": "https://github.com/Benjmhart/keybind-find", "date": "Sat, 31 Oct 2026 22:06:58 +0000", "desc": "Article URL: https://github.com/Benjmhart/keybind-find Comments URL: https://news.ycombinator.com/item?id=50320726 Points: 1 # Comments: 0", "tags": ["个人成长"], "topic_score": 2, "source": "HN Show HN", "cat": "AI实战_创作者", "weight": 5, "ts": 1793484418.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27, "title_zh": "Show HN：Keybind-find —— 按下按键即可搜索当前聚焦窗口的快捷键", "desc_zh": "文章链接：https://github.com/Benjmhart/keybind-find 评论链接：https://news.ycombinator.com/item?id=50320726 积分：1 评论数：0"}, {"title": "Show HN: Winch – App Store optimization run by your own coding agent", "url": "https://getwinch.app/", "date": "Sat, 31 Oct 2026 21:39:37 +0000", "desc": "Article URL: https://getwinch.app/ Comments URL: https://news.ycombinator.com/item?id=50320501 Points: 4 # Comments: 1", "tags": ["AI"], "topic_score": 2, "source": "HN Show HN", "cat": "AI实战_创作者", "weight": 5, "ts": 1793482777.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27}, {"title": "奥特曼：PC上装内存太浪费，最好留给AI数据中心", "url": "https://www.36kr.com/p/4049467472493065", "date": "Sat, 31 Oct 2026 08:07:24 GMT", "desc": "「从全球资源配置的角度来看，让每个人把紧缺的 DRAM 囤在自己电脑里大部分时间闲置，是『相当糟糕』（quite terrible）的安排，内存应该集中到云端数据中心去。」 话都说到这份上了。 本周四在接受 YouTube 频道 Cheeky Pint 的采访时，OpenAI CEO 山姆・奥特曼（Sam Altman）全程喝着啤酒，气氛轻松地聊了聊 AI 大模型的本地推理，以及由此延伸出的家用电脑内存不足的问题，不经意间爆典了。 我们知道，目前全球 AI 浪潮引发的内存涨价，已经让 PC 和手机的价格暴涨了一圈，个人消费者早已难以承受。与此同时，各家内存大厂的产能扩张还要等一阵子。就在前沿 AI 公司吃下内存大头的同时，他们却已经开始讨论起个人电脑中的内存是否得到充分利用。 奥特曼提到一个假设，即人们能够在自己的电脑上运行本地人工智能，这些电脑可能是他们已经拥有的，也可能是因为 AI 大", "tags": ["AI"], "topic_score": 3, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1793434044.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 27}, {"title": "Governance-Aware Federated Learning for Multi-Agent AI Systems: A Policy-Driven Framework for Trustworthy Collaborative AI", "url": "https://arxiv.org/abs/2610.38411", "date": "Sat, 31 Oct 2026 00:00:00 -0400", "desc": "arXiv:2610.38411v1 Announce Type: new Abstract: Federated Learning (FL) enables collaborative model t 会议暨警示教育会，会议罕见由市委副秘书长，市国资委党委书记、主任李文基主持，却不见该公司总经理 李光宁 。 李光宁更为人所知的前身份是 华发集团 总经理，他曾执掌这家珠海头号国企逾12载，是当地家喻户晓亦颇具争议的人物。 据财新多方了解，李光宁约在两周前被有关部门带走调查。2025年以来，珠海国资系统风声鹤唳。3月至今，5家市属国企共6人被查，如今轮到李光宁，被视为更大风暴的前兆（参见财新我闻2025年8月19日 《第三代掌门人失联 华发集团经历险滩》 ）。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1793492545.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "刑法学者刘霜：十年40人被判终身监禁，震慑贪腐与刑罚理性如何平衡？", "url": "https://china.caixin.com/2026-10-31/102499422.html", "date": "Sun, 01 Nov 2026 00:22:25 GMT", "desc": "刘霜长期跟踪研究终身监禁问题。她认为，司法机关适用终身监禁时，既要防止过严，又要防止过宽。应采用“数额+情节”二元模式，除涉案的贪贿金额外，犯罪情节及犯罪形态等，也应成为重要考量因素 刘霜认为，司法应采取“数额+情节”二元模式，综合研判终身监禁制度适用与否。图：视觉中国 【财新网】 白恩培、魏鹏远、 武长顺 、 赵正永 、 蒋超良 、 王会民 ……这些贪官没有被判处死刑立即执行，而是要在有生之年把牢底坐穿。对于普通罪犯而言，减刑、假释本是法律留出的改过自新之路，但对重特大贪贿犯罪分子，这条路被彻底封堵。 封堵这条路的是刑法中增设的终身监禁制度。2015年11月1日，《刑法修正案（九）》正式施行，终身监禁制度随之适用于司法实践。2016年4月，最高法院、最高检察院联合发布《关于办理贪污贿赂刑事案件适用法律若干问题的解释》，由此，终身监禁制度的具体适用条件得以明确。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1793492545.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "金壮龙等军工及航空航天系统六“虎”被开除党籍", "url": "https://china.caixin.com/2026-10-30/102499047.html", "date": "Sun, 01 Nov 2026 00:22:25 GMT", "desc": "分别是金壮龙、雷凡培、余剑锋、袁洁、张忠阳、温刚 资料图：金壮龙。图：视觉中国 【财新网】 10月29日，中共二十届五中全会会议公报披露，全会审议并通过了中央纪委关于 金壮龙 、 雷凡培 、 余剑锋 、 袁洁 、 张忠阳 、 温刚 等严重违纪违法问题的审查报告，确认中央政治局之前作出的给予金壮龙、雷凡培、余剑锋、袁洁、张忠阳、温刚等开除党籍处分。 财新注意到，金壮龙、雷凡培、余剑锋、袁洁、张忠阳、温刚等6人曾长期任职航空航天或军工系统。其中， 中核集团 原董事长余剑锋、 中国航天科工集团 原董事长袁洁、 中国航天科技集团 原总经理张忠阳、 中国船舶集团 原董事长温刚等四人均在未满60岁时卸任原职，曾与他们“搭班子”或“交接班”的多名高管也已“出事”。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1793492545.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "网球反腐打假，电光火石的几秒钟｜体坛", "url": "https://mini.caixin.com/2026-10-29/102498593.html", "date": "Sun, 01 Nov 2026 00:22:25 GMT", "desc": "很多项目反腐的思路是道德化的宣誓承诺、相信荣誉感；网球的思路是结构化的，默 : "中文商业媒体", "weight": 4, "ts": 1793492271.0, "opinion": true, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 16}, {"title": "专家：短期国际金价后续可能维持震荡放大的态势。招联首席经济学家、上海金融与发展实验室执行主任董希淼分析，近日金价下探，主要受市场对美联储利率路径预期边...", "url": "https://www.huxiu.com/moment/1292969.html", "date": "Sat, 31 Oct 2026 23:42:51 GMT", "desc": "专家：短期国际金价后续可能维持震荡放大的态势。 招联首席经济学家、上海金融与发展实验室执行主任董希淼分析，近日金价下探，主要受市场对美联储利率路径预期边际转鹰、美元与美债实际收益率上行、地缘避险溢价回吐、前期多头获利了结，以及市场风险偏好和流动性扰动等多重因素共同影响。董希淼指出，国际金价失守3900美元/盎司关口，更多具有心理和技术意义。“整数关口跌破可能引发程序化止损和趋势资金减仓，放大短期波动，并强化市场从避险或抗通胀交易转向利率与美元交易的叙事。” 但他强调，不能据此判定长期支撑逻辑已被破坏，关键要看失守后能否快速收复，以及美元和实际利率是否继续上行。他认为，短期看，国际金价后续可能维持震荡放大的态势。“这主要取决于市场对美联储利率路径的预期差、美国通胀就业数据、美元指数及美债实际收益率、地缘风险及ETF和央行购金节奏。\"", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1793490171.0, "opinion": true, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 16}, {"title": "SoftBank-Backed OPay Halts IPO to Respond to Regulatory Inquiry", "url": "https://www.bloomberg.com/news/articles/2026-10-31/softbank-backed-opay-halts-ipo-to-respond-to-regulatory-inquiry", "date": "Sat, 31 Oct 2026 08:48:16 GMT", "desc": "OPay Ltd., a Nigeria-focused payments platform, halted an initial public offering on the New York Stock Exchange that was supposed to start trading on Friday, citing a regulatory inquiry.", "tags": ["商业认知"], "topic_score": 2, "source": "Bloomberg Technology", "cat": "金融媒体_英文", "weight": 2, "ts": 1793436496.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 16}, {"title": "Is this the first clear evidence of AI’s impact on the labour market?", "url": "https://www.ft.com/content/7f27aa5f-5994-4f82-aed8-1cade18fb487?syn-25a6b1a6=1", "date": "Sat, 31 Oct 2026 05:00:31 GMT", "desc": "Productivity is up and employment is down in the tech sector but elsewhere the picture is muddier", "tags": ["资本市场"], "topic_score": 2, "source": "Financial Times", "cat": "金融媒体_英文", "weight": 2, "ts": 1793422831.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 16}, {"title": "”零售之王“招商银行的三季报答卷：息差企稳，客户资产逼近19万亿", "url": "https://wallstreetcn.com/articles/3784906", "date": "Sat, 31 Oct 2026 11:23:28 +0800", "desc": "在复杂严峻的宏观经济环境与银行业整体承压的背景下，“零售之王”招商银行发布了三季报。 季报显示，今年前三季度，招行实现营业收入2648.52亿元，同比增长5.34%；实现归属于本行股东的净利润1164.76亿元，同比增长2.38%。在13.76万亿的庞大资产体量之上，招行依然保持了稳健的增长态势。 透过这份三季报，外界亦可以看到招商银行应对当下市场环境的三大策略安排：成本端推动净息差筑底企稳、零售端推动大财富管理矩阵爆发，资产端把好风险关。 净息差同比改善环比持平 近年来，受LPR下调及有效信贷需求不足影响，银行业净息差普遍承压。然而，招行三季报完成了息差的“企稳”。 报告显示，2026年1-9月，招行净利差1.76%，净利息收益率（NIM）1.82%。更为关键的是，在2026年第三季度单季，招行的净利差和净利息收益率均环比二季度持平。在行业息差普遍下行的通道中，招行能够率先踩住“刹车”，", "tags": ["企业落地"], "topic_score": 2, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793417008.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 16}, {"title": "苹果官宣：Apple智能接入阿里千问，11月4日开放测试", "url": "https://wallstreetcn.com/articles/3784898", "date": "Sat, 31 Oct 2026 09:15:24 +0800", "desc": "苹果公司在推动其人工智能技术落地全球最大智能手机市场方面迈出关键一步。 北京时间10月31日，苹果公司正式宣布与阿里巴巴集团达成合作，将 大模型“通义千问”整合进中国大陆市场的苹果智能（Apple Intelligence）系统中 。 相关集成功能将于 11月4日随iOS 27.3开发者测试版首发 ，并 计划于12月随系统正式版向中国用户全面推送 。 届时，符合条件的中国iPhone用户可在Siri、写作工具以及视觉智能功能中，直接调用千问的文本与图像理解及内容生成能力。 阿里巴巴集团首席执行官吴泳铭表示，千问将深度融入苹果生态，为中国用户带来全新的智能服务。 不过，首批上线的苹果智能仍面临严格的硬件及合规限制。 该服务目前仅限于符合运行内存要求的特定iPhone机型，iPad与Mac设备暂未列入首批支持范围。 同时，受制于监管审批进度，苹果在今年WWDC 2026上发布的新一代苹果智能及", "tags": ["AI"], "topic_score": 2, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793409324.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 16}, {"title": "美联储官员接连放鹰：洛根预计至少再加息两次，穆萨莱姆呼吁尽快行动", "url": "https://wallstreetcn.com/articles/3784893", "date": "Sat, 31 Oct 2026 08:04:53 +0800", "desc": "美联储本周决定维持利率不变后，两位地区联储主席周五相继释放进一步收紧货币政策的信号，显示部分官员仍对通胀压力保持警惕。 达拉斯联储主席洛里·洛根（Lorie Logan）表示，当前经济前景意味着美联储至少还需要加息两次，每次25个基点。她指出，跳过一次议息会议并不意味着货币政策的最终目标发生改变。 圣路易斯联储主席阿尔贝托·穆萨莱姆（Alberto Musalem）则认为，进一步收紧货币政策是必要的，而且应该尽快采取行动。他指出，目前的利率水平仍具有宽松性，通胀风险倾向于持续高于美联储2%的目标。 两位官员的表态凸显出美联储内部对后续政策路径的关注仍集中在如何控制通 活跃", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793412524.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "透视中国人寿三季报：894亿利润之下，是什么在守候", "url": "https://wallstreetcn.com/articles/3784911", "date": "Sat, 31 Oct 2026 09:59:35 +0800", "desc": "10月30日晚，中国人寿（601628）披露2026年三季报。季报显示，公司前三季度营业收入 3678.12亿元，归母净利润 894.30亿元，同比均明显有所回落。 但利润数字背后，公司的总投资收益率为 3.23%；新业务价值同比提升13.1%，加上总保费、首年期交保费和队伍规模等指标依然位居行业领先位置。对长期的投资者而言，搞清这些可能更为重要。 穿过短期数字，长期实力仍在 观察今年保险行业的三季报，有一个共同特征值得重视：三季度单季的利润明显回落。这一点在中国人寿也体现的很明显。 公司前三季度营业收入 3678.12亿元，同比 -31.6%；前三季度归母净利润 894.30亿元，同比 -46.7%；如果单看第三季度单季营收-664.95亿元，归母净利润-450.59亿元，承压明显。 但穿过数字可以发现，-511.37亿元的前三季度公允价值变动损益，是重要变量。比较下，去年同期这个科目的", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793411975.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "雪上加霜！科技股“认清现实”的一周", "url": "https://wallstreetcn.com/articles/3784902", "date": "Sat, 31 Oct 2026 09:51:49 +0800", "desc": "谷歌、亚马逊、英特尔的财报接连让市场失望，本周AI交易的裂痕明显扩大。周五（10月30日）英特尔股价暴跌29%，创有史以来最大单日跌幅；纳斯达克综合指数下跌2.9%，是6月以来最差的一天，10月也将成为纳指一年多来表现最差的月份。 此前数月，AI交易的风险主要暴露在负债沉重的小公司身上，巨头凭借丰厚利润稳住了华尔街。本周，情况变了：谷歌搜索广告增长放缓，亚马逊自由现金流大幅转负，英特尔预计PC销售将长期低迷。据FactSet，“七巨头”第三季度盈利增速预计将低于标普500其余成分股。 市场追问的问题，已经从AI需求有多大，变成谁来为AI买单。高盛Delta One主管Rich Privorotsky写道： “资本成本已经客观地重新定价，而且没有显而易见的解决办法。” 巨头财报接连失守 本周初，Anthropic提交的IPO文件显示营收飙升，一度提振市场情绪，但随后的巨头财报给市场泼了冷水。", "tags": [], "topic_score": 0, "source": "华尔街见闻", "cat": "中文商业媒体", "weight": 2, "ts": 1793411509.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 12}, {"title": "茅台三季度净利增3.78%，增长动力重新转向批发渠道", "url": "https://wallstreetcn.com/articles/3784899", "date": "Sat, 31 Oct 2026 09:19:48 +0800", "desc": "贵州茅台在持续调整产品供给、价格和销售渠道后，重新恢复利润增长。 10月30日，贵州茅台披露2026年第三季度报告。第三季度实现营业收入402.67亿元，同比增长3.08%；归母净利润199.51亿元，同比增长3.78%。 相比二季度营收、利润双降，茅台三季度业绩明显改善，利润表现也好于部分机构预期。 不过，这轮业绩修复也有低基数因素。2025年第三季度，茅台已经开始主动控制产品投放，当季营 const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
