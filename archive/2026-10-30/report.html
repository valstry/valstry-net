"01 上周末，去云贵长途旅行的父母终于回来了，进门就和我感慨，太值了，真的太值了。 行李还没收拾，母亲已经翻出手机，要给我看看她沿途住过的酒店。 我问母亲到底有多划算，她说，携程上标着4钻的酒店，每晚200至300多元就能住，不仅房间宽敞，窗外就是洱海，之前还担心便宜没好货，到了以后，反倒觉得可以多待几天。 父亲更满意的是清静，不仅去哪都不用跟着人群挪动，大众点评上的热门餐馆也没有几个人，吃完还能清净地散步，下次还要这时候出门。 听他们讲完，我翻开携程看了看，10月26日入住大理，那住度假酒店284元起，洱海国际会展中心亚朵酒店322元起，两家都标着4钻。 难怪母亲觉得，退休以后出去玩，实在没必要赶着放假。 父母还在回味旅途中的实惠，做酒店的朋友已经惦记他们这样的客人。 郑州某商务酒店总经理周诚最近和我聊起经营，说国庆过后，商务散客没有盼来多少，倒是陆续住进了几批老年团。 有天早晨，他在餐", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1793247514.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "“世界” 等待张一鸣", "url": "https://www.36kr.com/p/4046427575605128", "date": "Thu, 29 Oct 2026 04:18:15 GMT", "desc": "2021年的时候，张一鸣曾在卸任信中写道：“虚拟现实、生命科学、科学计算对人类生活的影响都已现黎明之曙光，这些需要我们突破业务的惯性去探索。” 2021年6月，《财新》报道称，张一鸣曾亲自到潍坊谈判收购Pico，见面时张一鸣就表现出了收购意向。这次收购后来成为这一轮元宇宙投资热的标志性事件，但《财新》在新闻中特意写到，双方当时并未透露“进军元宇宙”的意向。 5年后，来到2026年6月，字节世界模型曝光，该爆料称世界模型是字节2026年AI四大重点之一，目标年底前至少发布一版，对标Genie 3。 这个项目基于Seedance，用户以Pico的头戴设备为入口，说一句话、做一个动作，云端就生成一个随之变化的世界。 张一鸣笔下的“虚拟现实”指的并非是元宇宙，而是更为宏大的世界模型。他的卸任信，其实也可以理解成为一封预告信。 2026年9月份又有爆料称，已成为中国首富的张一鸣，仍然亲自督导字节跳动", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1793247495.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "这届中产父母的AI焦虑，标价13800元", "url": "https://www.36kr.com/p/4046412359603328", "date": "Thu, 29 Oct 2026 04:14:25 GMT", "desc": "这届中产父母的朋友圈里，都藏着同一种恐惧。 如今大家已经不只是怕孩子一次考不好了，而是担心他未来连被淘汰的资格都没有，是“别人家孩子已经用AI做了小程序，我儿子还在搭乐高”。 家长群里晒结营照、晒大厂logo、晒“少年CEO”工牌，你明明知道有点虚，手指却停在“报名链接”上点不下去也关不掉。 于是 13800元、6天5晚的AI研学营 ，成了最省事的解药。 2026年研学旅游市场规模预计2422亿元，同比涨13.6%， 其中AI主题研学订单同比增长370%。 课程的价格从2000元至5万元不等，但大多都有着相似的关键词，“走进大厂”、“名校硕博”、“科创思维”。可这些词背后到底是什么，很少有人真的明白。 本期显微故事采访到了报名家长和机构讲师，从他们的故事里我们看见，每一份焦虑都是有价格的，但这笔钱的背后，买到的到底是什么？ 以下是关于他们的真实故事： 连外婆都坐不住了 九月的最后一个周五，", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1793247265.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "张雪一句 “ 有点搞笑 ”，把两轮车智驾的遮羞布扯下来了？", "url": "https://www.36kr.com/p/4045636882666369", "date": "Thu, 29 Oct 2026 02:23:29 GMT", "desc": "前段时间， 狐妹盘点了各家两轮车“车机系统”，没想到 一篇稿子下去，评论区直接热闹起来了。 有人觉得，小电驴搞这些纯属噱头；也有人认为，技术总得往前走，不能因为现在不成熟，就否定未来的可能性。 巧的是，张雪机车创始人张雪在 10 月 15 日第 140 届广交会现场，也被问到了这个问题。 面对当下两轮车圈热议的“自动驾驶”，他的回答比评论区直接得多： “有点搞笑。” 这句话一出，两轮车智能化又有了新的讨论。 为什么两轮车自动驾驶“搞笑”？ 张雪的理由很直接：两轮车和四轮车，根本不是一套逻辑。 他举了个例子：如果两轮车自己行驶，前方突然遇到紧急情况需要刹车，骑手怎么办？ “手没放在方向把上就配合不了，一刹车人直接就倒了。” 这句话点出了两轮车自动驾驶绕不开的难题： 车能自己保持平衡，不代表骑手能跟着系统完成制动和转向。 汽车有四个轮子，车身相对稳定，还能用安全带约束乘员姿态。 两轮车却要靠骑", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1793240609.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "“对不起，我们不投具身智能了”", "url": "https://www.36kr.com/p/4046281658307456", "date": "Thu, 29 Oct 2026 01:32:34 GMT", "desc": "作者 | 邱晓芬 编辑 | 袁斯来 具身赛道里，那个有些疯狂的投资人，开始收手了。 很少有人会质疑他的地位。他出现在某机器人上市公司早期投资人名单中、又是另一家具身智能头部企业的幕后人。在很多年中，他和公众视野保持着谨慎的距离。但在一级市场，他以风格凌厉和激进著名。 “他的判断很疯狂，没有前面那堆乱七八糟的（调研），就是我要投你，就投了，一个礼拜钱到账。”一位熟悉的投资人告诉硬氪。 如今，这个很少犹豫的人，忽然冷淡下来。他会告诉一些创始人：“这个项目要给董事会看一下。”接着，再也没有实际的回复。 对具身智能的创业者而言，2026年秋天，一切忽然开始崩裂。从气候已经凛冽的北京，到仍如盛夏的深圳，整个具身智能市场，正浸入同一片寒意中。 三家对具身充满热情的头部机构收紧了口袋。其中一家机构的投资人开会时明确：“ 收紧对具身智能的投资”、“对具身项目谨慎做判断”，另一家最近一个半月几乎没有具身项目", "tags": [], "topic_score": 0, "source": "36氪 热榜", "cat": "中文商业媒体", "weight": 5, "ts": 1793237554.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 21}, {"title": "🧠 Community Wisdom: PRDs for agents, tracking competitor messaging, whether software moats still exist, exercising startup options when you leave, and more", "url": "https://www.lennysnewsletter.com/p/community-wisdom-prds-for-agents", "date": "Sat, 17 Oct 2026 13:53:57 GMT", "desc": "Community Wisdom 302", "tags": ["AI", "商业认知"], "topic_score": 6, "source": "Lenny's Newsletter", "cat": "AI实战_创作者", "weight": 3, "ts": 1792245237.0, "opinion": false, "is_hot": false, "is_vendor": false ·斯图尔特去世，终年86岁，曾饰演《X战警》的X教授，“金刚狼”休·杰克曼等人发文悼念。 据看看新闻，英国演员帕特里克·斯图尔特去世，终年86岁。他是《X战警》的X教授、《星际迷航：下一代》的皮卡德舰长，也出演了《沙丘》《麦克白》《奥赛罗》《白鲸记》《冬狮》等，50多年演艺生涯留下许多影/视/戏剧形象，最后一部银幕作品将是今年12月的《复仇者联盟5》。斯图尔特的代理人发布声明称：他身患阿尔茨海默病和路易体痴呆症，于本月28日在洛杉矶家中、妻子Sunny的陪伴下离世。业内各方悼念斯图尔特：与他合作了《X战警》《金刚狼》的休·杰克曼发ins分享两人留影表达悼念：“今天，我们失去了舞台上与银幕上的伟人之一。于我，他还是一个了不起朋友、一个了不起的人，我从他身上学到了太多。帕特里克·斯图尔特，我此生将怀念你。” 《星际迷航》的初代柯克舰长威廉·夏特纳发文悼念：“令人心碎的一星期。帕", "tags": [], "topic_score": 0, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1793318201.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "@markjcarney: Canadians will own a stake in Cohere’s world-leading secure AI. An investment for Canadians, by Canadians.", "url": "https://www.threads.com/t/DfGOMwFjgPE", "date": "Thu, 29 Oct 2026 23:51:40 GMT", "desc": "@markjcarney : Canadians will own a stake in Cohere’s world-leading secure AI. An investment for Canadians, by Canadians.", "tags": [], "topic_score": 0, "source": "Threads-AI讨论", "cat": "AI实战_创作者", "weight": 4, "ts": 1793317900.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "Andy Jassy says Prime Video is on track to earn ‘tens of billions of dollars’", "url": "https://techcrunch.com/2026/10/29/andy-jassy-says-prime-video-is-on-track-to-earn-tens-of-billions-of-dollars/", "date": "Thu, 29 Oct 2026 23:44:56 +0000", "desc": "The success of blockbuster hits like Project Hail Mary and Verity is only part of the story, Amazon's CEO says.", "tags": [], "topic_score": 0, "source": "TechCrunch", "cat": "科技新闻", "weight": 4, "ts": 1793317496.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 20}, {"title": "产品开发新规即将施行，中小财险公司迎来错位发展空间。金融监管总局修订发布的《财产保险公司保险产品开发管理规定》将于11月1日起施行，系财险业近十年来首次...", "url": "https://www.huxiu.com/moment/1292523.html", "date": "Thu, 29 Oct 2026 23:36:59 GMT", "desc": "产品开发新规即将施行，中小财险公司迎来错位发展空间。 金融监管总局修订发布的《财产保险公司保险产品开发管理规定》将于11月1日起施行，系财险业近十年来首次对产品开发管理规定作出的系统性修订完善。 事故现场。图：Burak Akbulut/IC photo 【财新网】 当地时间2026年10月28日，西班牙托莱多省乌尔达车站附近发生两列高速列车相撞事故，应急救援人员在现场开展救援。西班牙卡斯蒂利亚-拉曼查自治区政府发布消息称，高速铁路列车相撞事故已导致68人死亡，有53人在医院接受治疗，另有15人重伤，死亡人数可能还会增加。另据中国驻西班牙大使馆消息，相撞列车上有4名中国公民，1人腿部受轻伤。 相撞的两列列车均从马德里出发前往塞维利亚，共载有约540名乘客。图片显示，有两节车厢脱轨且从中间断开。一名事故幸存者对西班牙媒体说：“我当时正在用笔记本电脑工作，突然感到一股强烈加速，然后就撞到了前面的座位上。人们被甩出车外……我们一点一点地爬出车厢，发现列车倾斜了。很多人受伤，还有很多人受到惊吓。”", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1793319277.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "穆迪：私募信贷对接AI融资，哪些风险点值得关注", "url": "https://international.caixin.com/2026-10-29/102498562.html", "date": "Fri, 30 Oct 2026 00:14:37 GMT", "desc": "科技公司、芯片制造商、人工智能（AI）开发商以及各类融资工具之间，正日益频繁地进行相互投资、借贷和采购 评级机构穆迪标识。穆迪评级称，在全球多个地区，当前利率水平远高于2021年，随着2020年至2022年发放的私募贷款陆续到期，再融资风险将愈发凸显。 【财新网】 近期，在欧美利率走高的背景下，私募信贷的再融资压力备受关注。穆迪评级称，在全球多个地区，当前利率水平远高于2021年，随着2020年至2022年发放的私募贷款陆续到期，再融资风险将愈发凸显。 穆迪评级称，在其中端市场贷款抵押债券（CLO）所持有的贷款中，涉及607家未获得公开信用评级的企业。穆迪评级预计在截至2026年6月的12个月内，这些企业的违约率将达到5.8%。 与此同时，AI基础设施已成为私募资本一个重要且日益增长的新需求来源。其融资需求不仅限于数据中心建设，还涵盖了土地、电力、半导体、图形处理器（GPU）、张量处理器（", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1793319277.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "魏尚进：中国顺差背后的家庭账本", "url": "https://opinion.caixin.com/2026-10-29/102498591.html", "date": "Fri, 30 Oct 2026 00:14:37 GMT", "desc": "当家庭不必为每一种可能的风险都预留过多资金，当企业不必因为融资不稳而反复推迟有价值的投资，中国的增长便能更多依靠国内真实需求，也为世界减少一份失衡压力 2026年10月14日，江苏扬州港。图：视觉中国 准备买一件大件商品，想到房贷和下一年的收入，决定再等等；企业有扩张计划，想到贷款到期能否续上，决定先多留一点现金。这样的选择并不难理解。对一个家庭或一家企业来说，钱留在手里，意味着多一份应对变化的余地。 但当许多人同时作出类似选择，影响就会越过自家账本：消费和投资需求可能减弱，进口受到影响，国内生产与国内支出之间的差额，最终会反映在对外收支上。中国持续保持经常账户顺差，意味着一部分国内储蓄没有被国内投资吸收，在全球总账上也与其他经济体的逆差大体对应。港口里驶向世界的集装箱，与普通人为什么不敢轻易花钱，其实属于同一个全球经济故事。 .lanmu_textend{ padding-bottom:", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1793319277.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "万斯被曝致信伊朗强硬派寻求直接和谈 调解人提议恢复核查伊核设施", "url": "https://international.caixin.com/2026-10-29/102498585.html", "date": "Fri, 30 Oct 2026 00:14:37 GMT", "desc": "消息称，以卡塔尔为首的地区调解人正试图达成一项外交协议，重启美国和伊朗之间的谈判，防止美国中期选举后战争再次爆发 美国副总统万斯。图：视觉中国 【财新网】 在美国总统特朗普放言将再次对伊朗动武之际，美国副总统万斯被曝与伊朗强硬派领导人接触以寻求重启谈判的可能。《华尔街日报》10月28日报道称，美国官员和知情人士表示，万斯正在与伊朗强硬派代表人物、伊朗最高领袖军事顾问、伊最高国家安全委员会秘书穆赫辛·雷扎伊接触，以寻求恢复两国间的停战谈判。 报道称，万斯正在试探德黑兰和华盛顿是否能找到足够的共识，以说服特朗普不要在未来几周内对伊朗进行军事打击。据知情人士透露，万斯已致函雷扎伊。这封信是按照特朗普的指示发送的。", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1793319277.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "当逝者的数据持续累积，谁将继承他们的数字遗产？｜带着问题去读书", "url": "https://mini.caixin.com/2026-10-28/102498163.html", "date": "Fri, 30 Oct 2026 00:14:37 GMT", "desc": "如同史前的旧石器部落，我们必须学会与新型的逝者遗存共处，成为合格的“档案公民” 《我们死后，我们的数据呢？》卡尔·奥曼 著 梁家瑞 译 【前记： 在数字时代，死亡不再是生命的终点。瑞典乌普萨拉大学政治学者卡尔·奥曼发出叩问：当逝者的数据持续累积，谁将继承他们的数字遗产？谁在觊觎这些数字遗产？谁又在从中牟利？书中揭示了一系列震撼事实：未来30年内全球约有22亿人将离世；脸书上逝者账户数量最早可能在2070年超过生者账户数量；谷歌等巨头的“幽灵账户”每年产生数亿美元广告收益；更有人利用逝者社交数据训练出可对话的AI替身。奥曼尖锐指出，掌控数字遗产的巨头不仅垄断着集体记忆，更在重塑生死的边界。一个人的数字遗迹或许能慰藉至亲，但当数十亿份遗存汇聚成册，它们便成为一部属于全人类的文化记忆——这既关乎我们如何向后代讲述这一代人的故事，也关乎文明自身能否在数据洪流中找到延续的根基。】", "tags": [], "topic_score": 0, "source": "财新", "cat": "中文商业媒体", "weight": 3, "ts": 1793319277.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "[问与答] 有没有国内访问速度也不错的网页托管服务啊？", "url": "https://www.v2ex.com/t/1253023#reply1", "date": "2026-10-30T00:11:46Z", "desc": "", "tags": [], "topic_score": 0, "source": "V2EX 最新", "cat": "AI实战_创作者", "weight": 3, "ts": 1793319106.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 17}, {"title": "The director of Obsession put a new horror short on YouTube", "url": "https://www.theverge.com/streaming/1022934/curry-barker-obsession-horror-short-youtube-mama-bear", "date": "2026-10-29T19:57:18-04:00", "desc": "Curry Barker, the director beh  ["AI"], "topic_score": 4, "source": "掘金", "cat": "中文科技财经", "weight": 3, "ts": 0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": true, "rank": 17}, {"title": "OpenAI and ServiceNow expand partnership across enterprise workflows", "url": "https://openai.com/index/openai-servicenow-partnership-expansion", "date": "Wed, 28 Oct 2026 13:15:00 GMT", "desc": "OpenAI and ServiceNow expand their partnership to bring OpenAI models and agents into ServiceNow and ServiceNow workflows into ChatGPT and Codex.", "tags": ["AI"], "topic_score": 5, "source": "OpenAI News", "cat": "AI厂商官方", "weight": 7, "ts": 1793193300.0, "opinion": false, "is_hot": false, "is_vendor": true, "always_fresh": false, "rank": 45, "title_zh": "OpenAI 与 ServiceNow 扩大合作，覆盖企业工作流", "desc_zh": "OpenAI 与 ServiceNow 扩大合作，将 OpenAI 模型和智能体引入 ServiceNow，并让 ServiceNow 工作流接入 ChatGPT 和 Codex。"}, {"title": "星巴克探索在得来速中引入AI，加速咖啡师接单。星巴克正在研究将人工智能技术引入得来速（drive-thrus）点餐服务，准备测试在后台运行的AI模型，帮助咖啡师“在...", "url": "https://www.huxiu.com/moment/1292514.html", "date": "Thu, 29 Oct 2026 22:52:49 GMT", "desc": "星巴克探索在得来速中引入AI，加速咖啡师接单。 星巴克正在研究将人工智能技术引入得来速（drive-thrus）点餐服务，准备测试在后台运行的AI模型，帮助咖啡师“在与顾客互动时更准确、高效地录入订单”。首席执行官Brian Niccol周四在电话会议上表示，公司希望员工在更专注于与顾客交流的同时提高服务速度。星巴克还在探索能够在顾客抵达时识别其身份的技术，以向顾客展示个性化的数字菜单并简化支付流程。 多年来，大型连锁餐饮企业一直在测试用于得来速的AI技术，但此类技术尚未在整个行业得到大规模应用。汉堡王目前没有计划更广泛地推广正在试点的AI点餐系统，并表示顾客更喜欢与真人交流。麦当劳也在测试自己的AI点餐系统，称这项技术有望让每家餐厅每周节省数十个工时，以便员工将时间用于其他工作。", "tags": ["AI"], "topic_score": 5, "source": "虎嗅", "cat": "中文商业媒体", "weight": 4, "ts": 1793314369.0, "opinion": false, "is_hot": false, "is_vendor": false, "always_fresh": false, "rank": 30}, {"title": "谷歌美股开盘大跌超 13%，创历史最大单日跌幅，总市值蒸发 5000 亿美元，为啥会这样？还会持续下跌吗？", "url": "https://www.zhihu.com/question/2099258545564643597", "desc": "10 月 29 日消息，谷歌母公司 Alphabet 美股开盘大跌，现将跌幅扩大至 13%，创其历史上最大单日跌幅，报 283 美元，市值较前一交易日收盘减少逾 5000 亿美元。谷歌盘初大跌超 13% 创其历史上最大单日跌幅，总市值蒸发 5000 亿美元", "date": "", "hot": 0, "tags": ["资本市场"], "topic_score": 4, "source": "热搜-知乎", "cat": "热点榜_发生了什么", "weight": 5, "ts const KEY = "src_star_" + D.date;
let stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let fc = null, view = 0;
document.getElementById("d").textContent = D.date;
const allCats = [...new Set(D.items.map(i => i.cat))];
document.getElementById("cats").innerHTML = allCats.map(c =>
  `<span class="chip" data-c="${c}">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  fc = (fc === ch.dataset.c) ? null : ch.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === fc));
  render();
});
function setView(v){ view = v;
  document.getElementById("v0").classList.toggle("on", v===0);
  document.getElementById("v1").classList.toggle("on", v===1);
  render();
}
function esc(s){return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ageStr(ds){
  if(!ds) return "刚刚";
  const t = Date.parse(ds);
  if(isNaN(t)) return "";
  const h = (Date.now()-t)/3600000;
  if(h < 0) return "刚刚";
  if(h < 1) return Math.max(1, Math.round(h*60))+"分钟前";
  if(h < 24) return Math.round(h)+"小时前";
  if(h < 48) return "昨天";
  return Math.round(h/24)+"天前";
}
function base(){
  // v0 = Python 算好的精选列表（带分类/源限额），v1 = 全部储备
  return view === 0 ? (D.picks || []) : D.items;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const list = base().filter(i => {
    if (fc && i.cat !== fc) return false;
    if (!q) return true;
    return (i.title+" "+i.source+" "+(i.tags||[]).join(" ")+" "+(i.desc||"")).toLowerCase().includes(q);
  });
  document.getElementById("s").textContent =
    `${view===0?"精选":"全部储备"} · 精选 ${(D.picks||[]).length} 条 / 储备池 ${D.items.length} 条 · 当前 ${list.length} 条 · 已选 ${stars.size}`;
  document.getElementById("m").innerHTML = list.length ? list.map(i => {
    const on = stars.has(i.url);
    return `<div class="it ${on?"star":""}">
      <button class="sb ${on?"on":""}" onclick="tg('${encodeURIComponent(i.url)}')">${on?"★":"☆"}</button>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title_zh || i.title)}</a></div>
        ${i.title_zh ? `<div class="orig">${esc(i.title)}</div>` : ""}
        <div class="meta">
          <span class="src">${esc(i.source)}</span><span class="tg">${esc(i.cat)}</span>
          ${(i.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join("")}
          <span class="rk">分 ${i.rank}</span><span class="age">${esc(ageStr(i.date))}</span>
        </div>
        ${i.desc_zh ? `<div class="dsc">${esc(i.desc_zh)}</div>` : (i.desc?`<div class="dsc">${esc(i.desc)}</div>`:"")}
      </div></div>`;
  }).join("") : `<div class="empty">没有匹配的内容</div>`;
  const b = document.getElementById("sel");
  b.style.display = stars.size ? "block" : "none";
  b.textContent = `导出已选 ${stars.size} 条`;
}
function tg(enc){
  const u = decodeURIComponent(enc);
  stars.has(u) ? stars.delete(u) : stars.add(u);
  localStorage.setItem(KEY, JSON.stringify([...stars]));
  render();
}
function exp(){
  const picked = D.items.filter(i => stars.has(i.url));
  if (!picked.length) return alert("还没选任何条目");
  const md = `## 我筛出来的重点 ${D.date}\n\n` + picked.map(i =>
    `- [ ] **${i.title}**\n  - 来源: ${i.source} · 标签: ${(i.tags||[]).join("/")||"—"}\n  - ${i.url}`).join("\n");
  navigator.clipboard.writeText(md).then(
    () => alert(`已复制 ${picked.length} 条，粘贴给我即可`),
    () => prompt("复制下面内容：", md));
}
document.getElementById("q").oninput = render;
render();
</script></body></html>
